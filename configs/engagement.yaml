# Engagement = how the work is handed over: what the agent is told up front, how
# the client behaves, how clean the agent's copy of the data is and what happens
# while it works. It is an experiment axis of its own, separate from difficulty:
# the difficulty picks a case's content tier (easy / medium / hard) and the rule
# set (A / B / C) picks its rule parameters, and neither changes anything the
# agent sees, so within one engagement every difficulty gets the same prompt and
# the same files.
#
# condition: what the agent gets up front
#   full          request + complete requirements, nobody to ask
#   interact      request only; client reachable, asking is optional
#   interact_req  request only; must clarify before solving
#   hidden        request only, nobody to ask
# persona: how the simulated client answers (see fdebench2/customer.py)

standard:            # the default for difficulty and rule-set comparisons
  condition: interact_req
  persona: default
  noise: []
  events: []
  time_budget_s: 43200
  max_question_rounds: 30

full_spec:           # no discovery: the agent is handed the client's full requirements
  condition: full
  persona: cooperative
  noise: []
  events: []
  time_budget_s: 43200
  max_question_rounds: 30

messy:               # a hard engagement: busy client, noisy data, things change mid-task
  condition: interact_req
  persona: busy
  noise: [duplicate_rows, stale_copy, legacy_encoding]
  events:
    - {kind: stakeholder_conflict, at_step: 12}
    - {kind: customer_unavailable, after_questions: 6, duration_steps: 20}
    - {kind: data_correction, at_step: 30}
    - {kind: customer_volunteer, at_step: 45}
    - {kind: deadline_change, at_step: 80, factor: 0.5}
  time_budget_s: 43200
  max_question_rounds: 15
