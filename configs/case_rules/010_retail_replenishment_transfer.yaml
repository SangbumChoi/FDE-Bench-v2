# Classification of the v1 evaluator's hard constraints for case 010, so that a
# policy can decide which of them may bend. `match` is the prefix of the
# violation message the v1 evaluator emits.
case: 010_retail_replenishment_transfer
hook: fdebench2.case_hooks.c010_retail_replenishment_transfer
rules:
  - id: valid_source
    match: "HC0_"
    class: physical
    description: Transfers come only from in-scope stores or the WH_LOCAL warehouse.
  - id: stock_available
    match: "HC1_"
    class: physical
    description: A source cannot ship more than its available stock after the day's sales.
  - id: same_city_internal_first
    match: "HC2_HC3_"
    class: business_policy
    description: Exhaust same-city store and local-warehouse stock before buying from a supplier.
  - id: dsd_designated_supplier
    match: "HC4_"
    class: contractual
    description: DSD items come only via the warehouse or from the designated supplier.
