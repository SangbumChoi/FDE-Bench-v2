# A campaign is a list of experiments; each expands to a grid of runs.
# One axis at a time against a fixed baseline keeps the grid affordable:
# baseline = customer en, agent en, baseline policy, medium difficulty, standard engagement,
# and every rule set (ruleset: all), so each difficulty cell is the mean over rule sets A/B/C.
defaults:
  cases_root: cases
  models: configs/models.yaml
  out: runs
  seeds: [0, 1, 2]
  # strict: every run in docker; the agent sees only /workspace (same in every setting).
  isolation: strict
  sandbox:
    kind: docker
    image: "fde-bench-agent:latest"     # docker/Dockerfile.agent: python, data libraries, the vendor CLIs
    env: [OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY]   # passed to CLI agents in the container
  cases: all                     # all | field:<field> | a subset name | list of <field>/<role> ids

subsets: {}

agents:
  # Neutral harness: same tools and prompts for every model.
  - {harness: reference, model: gpt}
  - {harness: reference, model: claude}
  - {harness: reference, model: deepseek}
  - {harness: reference, model: qwen}
  - {harness: reference, model: local-open-model}
  # Vendor harnesses: model id is passed to the CLI itself.
  - {harness: claude_code, model: claude-opus-5-5}
  - {harness: codex, model: gpt-6}
  - {harness: gemini, model: gemini-3-pro}

experiments:
  language_customer:     # which customer languages does each system handle?
    customer_locale: [en, zh, ko, ja, es]
  language_protocol:     # which language should the FDE agent itself be instructed in?
    customer_locale: [ko]
    agent_locale: [en, ko, zh]
  policy:
    policy: [baseline, enterprise_balanced, regulated_strict, startup_velocity]
  difficulty:            # three columns, each the mean over rule sets A/B/C
    difficulty: [easy, medium, hard]
  engagement:            # how the work is handed over (configs/engagement.yaml)
    engagement: [full_spec, standard, messy]
