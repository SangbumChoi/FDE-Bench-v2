# Delivery quality is the whole score, the agent sees no policy, and every case rule is a hard constraint.
title: Baseline (delivery quality only)
agent_visible: false
exceptions: forbidden
notes_required: false
communication_locale: customer
hard_gates: [validity]
weights: {quality: 1.0}
quality_cap: 1.5    # normalized quality (baseline 0, reference 1) that earns full quality credit
