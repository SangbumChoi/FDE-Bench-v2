title: Enterprise (balanced)
statement: |
  You are working for a large enterprise client. Deliver a correct, well-documented solution. Ask the client
  whenever a requirement is unclear; do not guess on things that change the result. Keep the client informed in
  their own language.
agent_visible: true
question_budget: 30
exceptions: escalate
rule_classes: {physical: hard, contractual: hard, business_policy: soft}
soft_rule_penalty: 0.1
notes_required: true
communication_locale: customer
budgets: {wall_seconds: 43200}
hard_gates: [validity]
weights: {quality: 0.6, clarification: 0.15, communication: 0.15, efficiency: 0.1}
quality_cap: 1.5    # normalized quality (baseline 0, reference 1) that earns full quality credit
