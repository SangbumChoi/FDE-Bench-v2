[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fdebench2"
version = "0.1.0"
description = "FDE-Bench v2: language, policy and difficulty transforms over FDE-Bench cases, with an OpenAI-compatible agent harness"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40",
  "pyyaml>=6",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
fdebench2 = "fdebench2.cli:main"

[tool.setuptools.packages.find]
include = ["fdebench2*"]

[tool.setuptools.package-data]
fdebench2 = ["prompts/agent/*.yaml", "prompts/*.yaml", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
