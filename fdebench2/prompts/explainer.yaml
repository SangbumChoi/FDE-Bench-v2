    {n} cases. Each link opens the case's explainer: request, settings, rules, hidden requirements, targets, stored
    data and answers, and review findings.
  field: Field
  role: Role
  case_id: Case id
  site_cases: All cases
  site_direction: Direction
  site_design: Design
  site_catalog: Catalog
  site_source: Source on GitHub
  site_english_only: (English)
  # a case with settings (params: and rule_seeds:)
  settings_value: "{tiers} tiers × {seeds} public rule seeds = {n} ground truths (private seeds draw more)"
  settings_intro: >-
    The agent sees the same request and data in every setting. The <strong>tier</strong> (= difficulty) decides
    which rules apply; the <strong>rule seed</strong> draws each rule parameter, independently of the others, from
    its candidates below. Each difficulty is reported as the mean over rule seeds: the public ones below, or private
    seeds that draw from the same candidates.
  param_candidates: Parameter candidates
  public_panel: Public rule seeds
  public_panel_intro: >-
    The settings stored in <code>dataset/</code> and shown on this page, with the values each rule seed drew. Any
    other seed is private: a fresh draw from the same candidates.
  rule_seed: Rule seed
  drawn_values: Drawn values
  derived_note: "Derived by the case from the drawn values: {names}."
  description_params: "Description (parameters in {{…}} are drawn by the rule seed)"
  targets_intro_params: >-
    The facts a good engineer should ask the client for; Ask-F1 is scored against them.
    <code>{{param}}</code> is filled from the rule seed's draw.
  only_when: "only when {cond}"
