  common_title: Igual en todos los casos
  common_body: <ol><li><strong>Válido o no.</strong> Romper cualquiera de las reglas de arriba invalida el entregable
    y la ejecución vale 0. Una regla que la política de la empresa permite flexibilizar solo cuenta si la IA pidió
    una excepción al cliente.</li><li><strong>Calidad.</strong> El resultado se sitúa en una escala donde la forma
    de trabajar del cliente sin un ingeniero vale 0 y la solución de referencia vale 1. Lo que supera a la referencia
    pasa de 1; la puntuación completa llega en el tope de la política (1,5).</li><li><strong>Puntuación final.</strong>
    La calidad, más lo bien que preguntó la IA (¿sus preguntas descubrieron los hechos de arriba?), cómo se comunicó
    (el idioma del cliente, un NOTES.md) y su eficiencia, ponderados según la política de la empresa.</li><li><strong>Varias
    versiones.</strong> Los datos no cambian; solo los valores concretos del cliente (un umbral, una unidad, una
    fecha) cambian de una versión del caso a otra. La puntuación de cada dificultad es la media de varias versiones,
    así que memorizar una respuesta no sirve.</li></ol>
