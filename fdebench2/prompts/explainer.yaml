  site_english_only: (English)
  diff_title: What is different
  diff_body: <ul><li><strong>One dataset, several right answers.</strong> The client's hidden rules change from version
    to version while the AI gets exactly the same files, so the score depends on finding out this client's facts.</li><li><strong>Five
    languages written natively</strong>, for the client and, separately, for the AI's instructions.</li><li><strong>Every
    client fact is checked to matter.</strong> Misreading it costs score, shortcuts are closed, and doing the request
    word for word scores at most 0.2.</li><li><strong>Each fact is followed</strong> from what the client said, to what
    the AI found out, to what the deliverable does.</li><li><strong>Like real work:</strong> company policies with an
    exception process, dated events and pressure during the job, and programs that run day by day on days the AI
    never saw.</li></ul>
