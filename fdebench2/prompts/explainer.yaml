  settings_intro: The AI sees the same request and data in every version. The <strong>difficulty</strong> decides
    which client rules apply; the <strong>rule seed</strong> picks the exact values of those rules (a threshold,
    a unit, a date) from the candidates below. A difficulty's score is the average over rule seeds.
  param_candidates: Parameter candidates
  public_panel: Public rule seeds
  public_panel_intro: 'The settings stored in <code>dataset/</code> and shown on this page, with the values each
    rule seed drew. Any other seed is private: a fresh draw from the same candidates.'
