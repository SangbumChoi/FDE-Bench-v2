  glance_title: At a glance
  nav_glance: At a glance
  task_title: What the AI has to do
  given_title: What the AI is given
  ask_title: What the AI must find out by asking the client
  scoring_title: How it is scored
  nav_scoring: How it is scored
  invalid_title: Scores 0 if the deliverable…
  quality_title: If it is valid, quality is…
  common_title: The same in every case
  common_body: <ol><li><strong>Valid or not.</strong> Breaking any rule above makes the deliverable invalid and
    the run scores 0. A rule the company policy lets bend counts only if the AI asked the client for an exception.</li><li><strong>Quality.</strong>
    The result is placed on a scale where the client's own way without an engineer is 0 and the reference solution
    is 1. Better than the reference goes above 1; full credit at the policy's cap (1.5).</li><li><strong>Final score.</strong>
    Quality, plus how well the AI asked (did its questions uncover the facts above?), how it communicated (the client's
    language, a NOTES.md) and how efficient it was, weighted by the company policy.</li><li><strong>Several versions.</strong>
    The data stays the same; only the client's exact values (a threshold, a unit, a date) change with the rule seed.
    A difficulty's score is the average over several rule seeds, so memorising one answer does not help.</li></ol>
  tiers_title: Easy, medium and hard
  details_title: Details
  nav_details: Details
  details_intro: 'The full material behind the summary: the request as written, the client''s rules and their candidate
    values, what only the client knows, the data and the stored answers, and the case notes.'
