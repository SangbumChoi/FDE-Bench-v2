  evidence_title: Evidence the facts matter
  evidence_intro: 'Measured by <code>audit-case</code> on {n} settings of this dataset: the public rule seeds and other combinations
    of the candidates. Everything is on the quality scale (the client''s own way 0, the reference solution 1), and a deliverable
    that breaks a rule earns 0.'
  ablation_title: If the AI gets only this fact wrong
  ablation_intro: 'The reference solution with this one fact misread and everything else right. Score lost is how much of
    the way from the client''s own way to the reference it gives up (100%: it breaks a rule or does no better than the client).
    The fact matters in a setting when at least {min} is lost; a wrong parameter value counts at its least harmful.'
