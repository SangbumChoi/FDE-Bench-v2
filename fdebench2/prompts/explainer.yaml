  diff_body: <ul><li><strong>Un solo conjunto de datos, varias respuestas correctas.</strong> Las reglas ocultas del
    cliente cambian de una versión a otra mientras la IA recibe exactamente los mismos archivos, así que la puntuación
    depende de averiguar los hechos de este cliente.</li><li><strong>Cinco idiomas redactados de forma nativa</strong>,
    para el cliente y, por separado, para las instrucciones de la IA.</li><li><strong>Se comprueba que cada hecho del
    cliente importa.</strong> Malinterpretarlo cuesta puntos, los atajos están cerrados y hacer la solicitud al pie de la
    letra puntúa como mucho 0,2.</li><li><strong>Cada hecho se sigue</strong> desde lo que dijo el cliente hasta lo que
    averiguó la IA y lo que hace el entregable.</li><li><strong>Como el trabajo real:</strong> políticas de empresa con
    un proceso de excepciones, eventos con fecha y presión durante el trabajo, y programas que se ejecutan día a día
    sobre días que la IA nunca vio.</li></ul>
