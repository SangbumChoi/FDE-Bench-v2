# Interface text of the case explainers and the site, in the five locales. {name} fields are filled in code.
en:
  language: Language
  case_eyebrow: "{field} · FDE-Bench v2 case"
  task_type: Task type
  deliverable: Deliverable
  objective: Objective
  settings: Settings
  maximize: maximize
  minimize: minimize
  program: "Program {entry}"
  batch_files: "Batch files: {files}"
  settings_value: "{tiers} tiers × {rulesets} rule sets = {n} ground truths"
  one_problem: one fixed problem
  nav_request: Request
  nav_settings: Settings
  nav_rules: Rules
  nav_requirements: Hidden requirements
  nav_targets: Targets
  nav_data: Data & answers
  nav_readme: Case notes
  nav_review: Review findings
  request_title: What the agent is asked
  request_intro: The client's request, the only text the agent gets up front. It is the same in every setting.
  spec_title: "Deliverable spec ({label})"
  spec_program: the program interface
  spec_batch: shown to the extractor that reshapes the agent's files, not to the agent
  spec_translation: "Translation for reading; the agent and the extractor get the English original:"
  settings_title: "Settings: one dataset, {n} ground truths"
  settings_intro: >-
    The agent sees the same request and data in every setting. The <strong>tier</strong> (= difficulty) decides
    which rules apply; the <strong>rule set</strong> gives their parameters. Each difficulty is reported as the mean
    over rule sets A, B and C.
  tiers: Tiers
  tier: Tier
  in_force: What is in force
  rulesets: Rule sets
  parameter: Parameter
  no_settings: "This case has no settings: one fixed problem at every difficulty."
  rules_title: Rules
  rules_intro: >-
    Breaking any rule makes the deliverable invalid, unless the rule's class may bend under the run's company
    policy and the agent went through the exception process.
  rule: Rule
  class: Class
  description: "Description (parameters in {{…}} come from the rule set)"
  class_physical: physical
  class_contractual: contractual
  class_business_policy: business policy
  note_physical: never bends
  note_contractual: bends only if the policy allows contractual exceptions
  note_business_policy: may bend through the policy's exception process
  requirements_title: Hidden requirements
  requirements_intro: >-
    What the simulated client knows and answers from. The agent only learns it by asking (in the
    <code>full_spec</code> engagement it is handed over).
  setting: Setting
  not_available: (not available)
  targets_title: Clarification targets
  targets_intro: >-
    The facts a good engineer should ask the client for; Ask-F1 is scored against them.
    <code>{{param}}</code> is filled from the rule set.
  target: Target
  kind: Kind
  all_tiers: all
  data_title: Data & answers
  data_intro: >-
    Everything is stored as files next to the case. <code>visible/</code> is what the agent receives;
    <code>hidden/</code> is what it never sees (a program's hidden period or corpus); <code>gt/</code> holds one
    answer folder per setting. <code>validate-case</code> checks the files still match the generator.
  visible_data: "Agent-visible data ({language} locale)"
  hidden_inputs: Hidden inputs
  scores_title: Reference score per setting
  scores_intro: >-
    Quality is normalized per setting: the baseline (the simplest valid deliverable) is 0, the reference is 1, and
    better than the reference goes above 1 (full credit at the policy's quality cap).
  reference_objective: Reference objective
  baseline_objective: Baseline objective
  metrics: Metrics (first four)
  folder: Folder
  open: open
  no_dataset: (no dataset yet)
  answer_folder: "One answer folder: {folder}"
  readme_title: Case notes (README)
  no_readme: (no README)
  untranslated: "Not translated into this language yet; showing the English version."
  review_title: Review findings (REVIEW)
  index_eyebrow: FDE-Bench v2
  index_title: Built cases
  index_intro: >-
    {n} cases. Each link opens the case's explainer: request, settings, rules, hidden requirements, targets, stored
    data and answers, and review findings.
  field: Field
  role: Role
  case_id: Case id
  site_cases: All cases
  site_direction: Direction
  site_design: Design
  site_catalog: Catalog
  site_source: Source on GitHub
  site_english_only: (English)
