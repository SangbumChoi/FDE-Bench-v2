  glance_title: At a glance
  nav_glance: At a glance
  task_title: What the AI has to do
  given_title: What the AI is given
  ask_title: What the AI must find out by asking the client
  scoring_title: How it is scored
  nav_scoring: How it is scored
  invalid_title: Scores 0 if the deliverable…
  quality_title: If it is valid, quality is…
  common_title: The same in every case
  common_body: <ol><li><strong>Valid or not.</strong> Breaking any rule above makes the deliverable invalid and
    the run scores 0. A rule the company policy lets bend counts only if the AI asked the client for an exception.</li><li><strong>Quality.</strong>
    The result is placed on a scale where the client's own way without an engineer is 0 and the reference solution
    is 1. Better than the reference goes above 1; full credit at the policy's cap (1.5).</li><li><strong>Final score.</strong>
    Quality, plus how well the AI asked (did its questions uncover the facts above?), how it communicated (the client's
    language, a NOTES.md) and how efficient it was, weighted by the company policy.</li><li><strong>Several versions.</strong>
    The data stays the same; only the client's exact values (a threshold, a unit, a date) change from one version
    of the case to another. A difficulty's score is the average over several versions, so memorising one answer
    does not help.</li></ol>
  tiers_title: Easy, medium and hard
  details_title: Details
  nav_details: Details
  details_intro: 'The full material behind the summary: the request as written, the client''s rules and their candidate
    values, what only the client knows, the data and the stored answers, and the case notes.'
  difficulty: Difficulty
  asks_for: What it asks for
  nav_evidence: Evidence
  evidence_title: Evidence the facts matter
  evidence_intro: 'Measured by <code>audit-case</code> on {n} settings of this dataset: the public rule seeds and other
    combinations of the candidates. Everything is on the quality scale (the client''s own way 0, the reference solution
    1), and a deliverable that breaks a rule earns 0.'
  ablation_title: If the AI gets only this fact wrong
  ablation_intro: 'The reference solution with this one fact misread and everything else right. Score lost is how much
    of the way from the client''s own way to the reference it gives up (100%: it breaks a rule or does no better than
    the client). The fact matters in a setting when at least {min} is lost; a wrong parameter value counts at its least
    harmful.'
  in_force_tiers: In force
  checked_by: How it is checked
  checked_param: the reference for another value of {param}
  checked_hook: a misreading written by the case
  checked_none: not checked yet
  score_lost: Score lost
  matters_in: Matters in
  k_of_n: '{k} of {n} settings'
  diagnostic: Checked directly
  answer_yes: 'yes'
  answer_no: 'no'
  shortcuts_title: Shortcuts
  shortcuts_intro: Strategies that skip the part of the task the case exists to test. A shortcut is closed in a setting
    when it breaks a rule or scores at most {max}.
  shortcut: Shortcut
  what_it_does: What it does
  closed_in: Closed in
  best_quality: Best quality
  no_shortcuts: (no shortcuts measured yet)
  voi_title: Value of asking
  voi_intro: What an AI that never asks the client can still earn, on average over the settings of a tier. The
    reference solution, which knows everything the client knows, earns 1; the value of asking is the difference.
  voi_params: Right for one setting, used for all
  voi_robust: Never asks, plans for every setting
  voi_reference: Asks (the reference)
  bounds_title: How close the reference is to the best possible
  bounds_intro: A stronger, slower solver (best known) and a proven limit that no solution can pass (bound), both on
    the quality scale; the gap is how far the bound is from the reference's objective.
  best_known: Best known
  bound: Bound
  gap_to_bound: Gap to bound
  no_bounds: (no best known solution or bound yet)
  not_measured: (not measured)
