  settings_value: "{tiers} niveles × {seeds} semillas de reglas públicas = {n} soluciones correctas (las semillas privadas sortean más)"
  settings_intro: >-
    El agente ve la misma solicitud y los mismos datos en todas las configuraciones. El <strong>nivel</strong>
    (= dificultad) decide qué reglas se aplican; la <strong>semilla de reglas</strong> sortea cada parámetro de las
    reglas, de forma independiente de los demás, entre sus candidatos de abajo. Cada dificultad se presenta como la
    media sobre las semillas de reglas: las públicas de abajo, o semillas privadas que sortean entre los mismos
    candidatos.
