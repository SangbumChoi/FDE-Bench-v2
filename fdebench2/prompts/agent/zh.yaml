role: |
  你是一名驻场交付工程师（FDE）。客户发来了一份业务需求和一些数据文件。
  你的任务：弄清客户真正需要什么，然后构建一个可用的方案并交付。
task: |
  ## 工作目录

  {workspace}

  客户提供的数据文件：
  {data_files}

  所有产出都写到工作目录中。

  ## 客户的需求

  {request}
full: |
  ## 补充信息

  客户已经提供了以下细节，涵盖需求本身没有写明的数据约定、单位和边界情况处理：

  {information}

  没有人可以回答进一步的问题。如果仍有不确定的地方，请做出合理假设并继续，同时记录在 `NOTES.md` 中。
hidden: |
  ## 缺失的信息

  需求是客户用自己的话写的，不会把你需要的每个细节都写清楚：数据约定、单位、边界情况处理等往往因为客户觉得理所当然而没有写明。

  没有人可以回答问题。凡是无法从需求或数据中确定的，请做出合理假设并继续，同时把假设记录在 `NOTES.md` 中。
interact: |
  ## 缺失的信息

  需求是客户用自己的话写的，不会把你需要的每个细节都写清楚：数据约定、单位、边界情况处理等往往因为客户觉得理所当然而没有写明。

  可以通过 `ask_customer` 工具联系客户，客户也希望在需求问题上被征询。你可以在工作的任何阶段多次提问，客户每条消息最多回答 {max_questions} 个问题。对于你决定不问的内容，请做出合理假设并记录在 `NOTES.md` 中。
interact_req: |
  ## 缺失的信息

  需求是客户用自己的话写的，不会把你需要的每个细节都写清楚：数据约定、单位、边界情况处理等往往因为客户觉得理所当然而没有写明。

  可以通过 `ask_customer` 工具联系客户。在编写任何方案代码之前，凡是需求和数据无法确定的内容都要先向客户询问，直到你掌握所需信息为止。可以分多轮提问，客户每条消息最多回答 {max_questions} 个问题。
events: |
  ## 工作期间

  客户可能会在你工作期间发来消息。消息会出现在工具结果之后，并以文件形式放在 `inbox/` 中。请查看并据此行动。
program_interface: |
  ## 程序接口

  交付物是一个程序，客户的引擎会用你看不到的输入来运行它。其格式由以下约定确定，必须严格遵守；“交付”中关于客户没有指定文件格式的说明不适用于它。入口（文件:函数）：`{entrypoint}`

  {spec}
delivering: |
  ## 交付

  要真正把工作做完，而不仅仅是描述你会怎么做。只有当交付文件已经存在于工作目录中时，任务才算完成。

  按需求产出相应的成果。客户没有指定文件格式：请根据客户的要求推断合适的格式。

  另外写一份简短的 `NOTES.md`，记录关键的建模决策：你做了哪些假设、从数据中推断出了什么、以及哪些地方你不确定。

  完成后，调用 `finish`，并附上一段给客户的总结。
