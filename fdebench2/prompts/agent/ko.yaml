role: |
  당신은 현장 배치 엔지니어(FDE)입니다. 고객이 업무 요청과 데이터 파일을 보내왔습니다.
  당신의 일: 고객이 실제로 무엇을 필요로 하는지 파악한 뒤, 동작하는 솔루션을 만들어 납품하는 것입니다.
task: |
  ## 작업 디렉터리

  {workspace}

  고객이 제공한 데이터 파일:
  {data_files}

  모든 산출물은 작업 디렉터리에 저장하세요.

  ## 고객의 요청

  {request}
full: |
  ## 추가 정보

  고객이 요청서에 적지 않은 데이터 규칙, 단위, 예외 상황 처리 방법을 아래와 같이 이미 알려 주었습니다:

  {information}

  추가 질문에 답해 줄 사람은 없습니다. 여전히 정해지지 않은 부분은 합리적으로 가정하고 진행한 뒤 `NOTES.md`에 기록하세요.
hidden: |
  ## 누락된 정보

  요청서는 고객이 자기 말로 쓴 것이라 필요한 세부 사항이 모두 적혀 있지는 않습니다. 데이터 규칙, 단위, 예외 상황 처리 같은 부분은 고객이 당연하다고 여겨 생략하는 경우가 많습니다.

  질문에 답해 줄 사람은 없습니다. 요청서나 데이터로 판단할 수 없는 부분은 합리적으로 가정하고 진행한 뒤, 그 가정을 `NOTES.md`에 기록하세요.
interact: |
  ## 누락된 정보

  요청서는 고객이 자기 말로 쓴 것이라 필요한 세부 사항이 모두 적혀 있지는 않습니다. 데이터 규칙, 단위, 예외 상황 처리 같은 부분은 고객이 당연하다고 여겨 생략하는 경우가 많습니다.

  `ask_customer` 도구로 고객에게 연락할 수 있으며, 고객도 요구 사항에 대해 상의받기를 원합니다. 작업 중 언제든 여러 번 질문할 수 있으며, 고객은 메시지 하나에 질문을 최대 {max_questions}개까지만 답합니다. 묻지 않기로 한 부분은 합리적으로 가정하고 `NOTES.md`에 기록하세요.
interact_req: |
  ## 누락된 정보

  요청서는 고객이 자기 말로 쓴 것이라 필요한 세부 사항이 모두 적혀 있지는 않습니다. 데이터 규칙, 단위, 예외 상황 처리 같은 부분은 고객이 당연하다고 여겨 생략하는 경우가 많습니다.

  `ask_customer` 도구로 고객에게 연락할 수 있습니다. 솔루션 코드를 작성하기 전에, 요청서와 데이터로 정해지지 않는 부분은 모두 고객에게 물어보고 필요한 정보를 얻을 때까지 계속 질문하세요. 여러 차례에 걸쳐 질문해도 되며, 고객은 메시지 하나에 질문을 최대 {max_questions}개까지만 답합니다.
events: |
  ## 작업 중 메시지

  작업 중에 고객이 메시지를 보낼 수 있습니다. 메시지는 도구 실행 결과 뒤에 표시되고 `inbox/`에 파일로도 저장됩니다. 확인하고 그에 맞게 대응하세요.
program_interface: |
  ## 프로그램 인터페이스

  납품물은 고객의 엔진이 당신이 볼 수 없는 입력으로 실행하는 프로그램입니다. 형식은 아래 계약으로 정해져 있으며, 이를 정확히 따라야 합니다. '납품'에 있는, 파일 형식이 지정되지 않았다는 안내는 이 납품물에는 해당하지 않습니다. 진입점(파일:함수): `{entrypoint}`

  {spec}
delivering: |
  ## 납품

  어떻게 할지 설명만 하지 말고 실제로 작업을 완료하세요. 납품 파일이 작업 디렉터리에 존재해야만 작업이 완료된 것입니다.

  요청에 맞는 산출물을 만드세요. 고객은 파일 형식을 지정하지 않았으니 요청 내용으로부터 적절한 형식을 판단하세요.

  또한 핵심 모델링 결정 사항을 정리한 짧은 `NOTES.md`를 작성하세요: 무엇을 가정했는지, 데이터에서 무엇을 추론했는지, 확신하지 못한 부분은 무엇인지.

  작업을 마치면 고객에게 전달할 한 단락 요약과 함께 `finish`를 호출하세요.
