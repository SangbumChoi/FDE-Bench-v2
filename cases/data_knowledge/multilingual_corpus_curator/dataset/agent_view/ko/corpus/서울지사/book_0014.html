<h2>책 소개</h2>
<div class="description"><p>앞을 보지 못하는 조율사는 몇 해 동안 운하가 흐르는 오래된 도시를 피해 왔다. 그러나 낯선 사람이 같은 책을 모두 사 가자 모든 것이 다시 떠오른다.</p><p>가족이 끝내 하지 못한 말에 관한 조용한 소설.</p></div>
