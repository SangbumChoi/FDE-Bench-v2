<p class="edition">초판 2018년 / 개정판 2025년</p>
<h2>책 소개</h2>
<div class="description"><p>남편을 잃은 양봉가는 몇 해 동안 고원의 기상 관측소를 피해 왔다. 그러나 화재로 기록 보관소가 불타자 모든 것이 다시 떠오른다.</p><p>한 겨울 동안의 이야기로, 남편을 잃은 양봉가와 떠나기를 거부하는 사람들을 따라간다.</p></div>
