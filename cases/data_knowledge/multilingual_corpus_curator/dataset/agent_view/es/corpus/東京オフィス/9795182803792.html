<p class="latin">(Tokei no Sakamichi?)</p>
<p class="byline">伊藤湊（Ito Minato） 著</p>
<p class="edition">初版 1987年</p>
<h2>内容紹介</h2>
<div class="description"><p>物語は国境近くの茶畑から始まる。最終列車が戻らない――その理由を覚えているのは引退した地図職人だけだ。</p><p>ひと冬の出来事として、引退した地図職人と、町を離れようとしない人々を描く。</p></div>
