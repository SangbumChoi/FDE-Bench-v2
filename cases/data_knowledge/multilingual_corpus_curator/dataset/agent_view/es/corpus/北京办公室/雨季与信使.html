<h2>内容简介</h2>
<div class="description"><p>故事从运河纵横的老城开始：灯塔的灯第一次熄灭，而一位退休的地图绘制师是唯一记得原因的人。</p><p>作者用二十个短章在过去与现在之间来回，追问时间如何改变一个地方。</p></div>
