<h1>迟到的群岛</h1>
<p class="latin">(Chidao de Qundao)</p>
<p class="byline">吴嘉怡（Wu Jiayi） 著</p>
<p class="edition">初版 2021年</p>
<h2>内容简介</h2>
<div class="description"><p>当一封迟到了四十年的信突然寄到，住在北方海岸的小渔镇的一个刚搬来的邮递员不得不决定哪些东西值得留下。</p><p>全书以一个冬天为线索，写一个刚搬来的邮递员和那些不肯离开的人。</p></div>
