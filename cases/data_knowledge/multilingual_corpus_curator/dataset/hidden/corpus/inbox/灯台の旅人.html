<h2>内容紹介</h2>
<div class="description"><p>目の見えない調律師は長いあいだ運河の流れる古い町を避けてきた。だが町の時計が正午で止まると、すべてがよみがえる。</p><p>ささやかな優しさをめぐる静かな長編。</p></div>
