<h2>内容紹介</h2>
<div class="description"><p>物語は河口の古い波止場から始まる。四十年遅れの手紙が届く――その理由を覚えているのは口をきかなくなった二人の姉妹だけだ。</p><p>ひと冬の出来事として、口をきかなくなった二人の姉妹と、町を離れようとしない人々を描く。</p></div>
