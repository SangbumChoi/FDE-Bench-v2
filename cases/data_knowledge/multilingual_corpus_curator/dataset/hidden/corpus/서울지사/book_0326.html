<h1>시계탑의 골목</h1>

<p class="byline">정예린(Jung Ye-rin) 지음</p>
<p class="edition">초판 1966년</p>
<h2>책 소개</h2>
<div class="description"><p>철새들이 한 달 일찍 떠나자, 서점이 하나뿐인 섬에 사는 새로 온 우체부는 무엇을 남길지 결정해야 한다.</p><p>가족이 끝내 하지 못한 말에 관한 조용한 소설.</p></div>
