<h2>책 소개</h2>
<div class="description"><p>강줄기가 하룻밤 사이에 바뀌자, 북쪽 해안의 작은 어촌에 사는 새로 온 우체부는 무엇을 남길지 결정해야 한다.</p><p>한 겨울 동안의 이야기로, 새로 온 우체부와 떠나기를 거부하는 사람들을 따라간다.</p></div>
