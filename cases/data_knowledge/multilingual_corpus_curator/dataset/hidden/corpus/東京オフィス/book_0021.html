<h1>最後の図書館</h1>
<p class="latin">(Saigo no Toshokan)</p>
<p class="byline">佐藤大翔（Sato Hiroto） 著</p>
<p class="edition">初版 1984年 / 新版 1991年</p>
<h2>内容紹介</h2>
<div class="description"><p>目の見えない調律師は長いあいだ河口の古い波止場を避けてきた。だが火事で資料館が焼けると、すべてがよみがえる。</p><p>過去と現在を行き来する二十の短い章で、時間が場所を変えていくことを問いかける。</p></div>
