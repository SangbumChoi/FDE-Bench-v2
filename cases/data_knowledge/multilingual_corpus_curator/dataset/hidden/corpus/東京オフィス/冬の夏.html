<h1>冬の夏</h1>
<p class="latin">(Fuyu no Natsu)</p>
<p class="byline">高橋湊（Takahashi Minato） 著</p>
<p class="edition">初版 2003年 / 新版 2012年</p>
<h2>内容紹介</h2>
<div class="description"><p>見知らぬ客が同じ本を買い占めるとき、運河の流れる古い町に住む夫を亡くした養蜂家は、何を残すべきかを決めなければならない。</p><p>ひと冬の出来事として、夫を亡くした養蜂家と、町を離れようとしない人々を描く。</p></div>
