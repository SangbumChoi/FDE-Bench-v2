<h1>硝子の鳥</h1>
<p class="latin">(Garasu no Tori)</p>
<p class="byline">佐藤湊（Sato Minato）、高橋湊（Takahashi Minato） 著</p>
<p class="edition">初版 1992年 / 新版 2004年</p>
<h2>内容紹介</h2>
<div class="description"><p>火事で資料館が焼けるとき、北の海岸の小さな漁村に住む夜勤の図書館司書は、何を残すべきかを決めなければならない。</p><p>ひと冬の出来事として、夜勤の図書館司書と、町を離れようとしない人々を描く。</p></div>
