- id: layout
  kind: missing
  domain: business rule
  text: Cada libro que se coloca en la biblioteca es un archivo en `library/<año>/<título>/<autor>.txt`
    dentro de la carpeta out_dir.
- id: year_basis
  kind: ambiguous
  domain: business rule
  text: El año de la ruta es el año de la primera publicación; un libro con un solo año usa ese año.
- id: script
  kind: ambiguous
  domain: business rule
  text: Los títulos y los nombres de autor de la ruta se escriben en el alfabeto latino (los libros en
    chino, coreano y japonés usan la forma romanizada que da su metadata).
- id: co_authors
  kind: missing
  domain: business rule
  text: En los libros con varios autores, la parte del autor en la ruta es solo el primer autor.
- id: separator
  kind: missing
  domain: data semantics
  text: En los títulos y los nombres de autor, cada tramo de espacios se convierte en un guion `-`.
- id: max_len
  kind: missing
  domain: data semantics
  text: Un título o un nombre de autor conserva sus primeros 48 caracteres y después se quitan los espacios,
    puntos y separadores de los extremos.
- id: content
  kind: missing
  domain: data semantics
  text: Un archivo de la biblioteca contiene solo la sinopsis del libro (sin líneas de título, autor ni
    año), en UTF-8, con los párrafos separados por una línea en blanco.
- id: review_codes
  kind: missing
  domain: business rule
  text: Una fila de revisión lleva un código de motivo, UNREADABLE, NO_TITLE, NO_AUTHOR, NO_YEAR, NO_DESCRIPTION
    o CONFLICT (el primero de este orden que se aplique).
