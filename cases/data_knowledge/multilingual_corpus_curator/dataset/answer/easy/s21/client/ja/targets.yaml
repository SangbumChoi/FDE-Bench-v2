- id: layout
  kind: missing
  domain: business rule
  text: ライブラリに並べる本は、out_dir の中の `library/<年>/<著者>/<書名>.txt` というパスのファイル1つです。
- id: year_basis
  kind: ambiguous
  domain: business rule
  text: パスの年はこの版（手元の版）の刊行年です。年が1つしかない本はその年を使います。
- id: script
  kind: ambiguous
  domain: business rule
  text: パスの書名と著者名は原語の文字（中国語・韓国語・日本語の本は原語の文字のまま）で書きます。
- id: co_authors
  kind: missing
  domain: business rule
  text: 共著の本では、パスの著者の部分は筆頭著者のみです。
- id: separator
  kind: missing
  domain: data semantics
  text: 書名と著者名の中の連続する空白はアンダースコア `_`にします。
- id: max_len
  kind: missing
  domain: data semantics
  text: 書名と著者名は先頭の 60 文字だけ残し、両端の空白・ピリオド・区切り文字を除きます。
- id: content
  kind: missing
  domain: data semantics
  text: ライブラリのファイルにはその本の紹介文だけを入れます（書名・著者・年の行は入れない）。UTF-8 で、段落の間に空行を入れます。
- id: review_codes
  kind: missing
  domain: business rule
  text: 確認の行には理由コード UNREADABLE、NO_TITLE、NO_AUTHOR、NO_YEAR、NO_DESCRIPTION、CONFLICT のうち1つを付けます（この順で最初に当てはまるもの）。
