- id: layout
  kind: missing
  domain: business rule
  text: 서고에 올리는 책은 out_dir 안의 `library/<연도>/<제목>/<저자>.txt` 경로에 파일을 하나씩 둡니다.
- id: year_basis
  kind: ambiguous
  domain: business rule
  text: 경로의 연도는 초판 발행 연도입니다. 연도가 하나뿐인 책은 그 연도를 씁니다.
- id: script
  kind: ambiguous
  domain: business rule
  text: 경로의 제목과 저자 이름은 로마자로 씁니다. 중국어·한국어·일본어 책은 메타데이터에 있는 로마자 표기를 씁니다.
- id: co_authors
  kind: missing
  domain: business rule
  text: 공저인 책은 경로의 저자 부분에 첫 번째 저자만 씁니다.
- id: separator
  kind: missing
  domain: data semantics
  text: 제목과 저자 이름에서 연속된 공백은 하이픈 `-` 하나로 바꿉니다.
- id: max_len
  kind: missing
  domain: data semantics
  text: 제목과 저자 이름은 앞의 32자만 남기고, 양 끝의 공백·마침표·구분자를 없앱니다.
- id: content
  kind: missing
  domain: data semantics
  text: 서고 파일에는 책 소개글만 넣습니다(제목·저자·연도 줄은 넣지 않음). UTF-8이며 문단 사이에 빈 줄을 둡니다.
- id: review_codes
  kind: missing
  domain: business rule
  text: 검토 줄에는 사유 코드 UNREADABLE, NO_TITLE, NO_AUTHOR, NO_YEAR, NO_DESCRIPTION, CONFLICT 중 하나를 적습니다(이 순서로
    해당하는 첫 번째).
- id: missing_author
  kind: missing
  domain: business rule
  text: 저자가 없는 책은 NO_AUTHOR로 검토에 보냅니다. 방침이므로 예외를 승인받으면 저자를 "Unknown"라고 적어 서고에 올립니다.
- id: no_description
  kind: missing
  domain: business rule
  text: 어느 출처에도 소개글이 없는 책은 NO_DESCRIPTION으로 검토에 보냅니다. 지어낸 소개글이나 자리 표시 문구는 절대 쓰지 않습니다.
- id: conflict
  kind: ambiguous
  domain: business rule
  text: 같은 단계의 두 출처가 연도를 다르게 적으면(예를 들어 한 책의 JSON 기록과 ONIX 기록) 그 책은 CONFLICT로 검토에 보냅니다. 어느 연도도 택하지 않습니다.
- id: generic_titles
  kind: ambiguous
  domain: data semantics
  text: 의미 있는 파일 이름은 제목으로 칩니다(밑줄은 공백). doc_0042, scan_0007, book_0031이나 ISBN 같은 일반적인 이름은 제목이 아니며, 다른 제목이
    없는 책은 NO_TITLE로 검토에 보냅니다.
