- id: layout
  kind: missing
  domain: business rule
  text: Cada libro que se coloca en la biblioteca es un archivo en `library/<autor>/<año>_<título>.txt`
    dentro de la carpeta out_dir.
- id: year_basis
  kind: ambiguous
  domain: business rule
  text: El año de la ruta es el año de la primera publicación; un libro con un solo año usa ese año.
- id: script
  kind: ambiguous
  domain: business rule
  text: Los títulos y los nombres de autor de la ruta se escriben en el alfabeto latino (los libros en
    chino, coreano y japonés usan la forma romanizada que da su metadata).
- id: co_authors
  kind: missing
  domain: business rule
  text: En los libros con varios autores, la parte del autor en la ruta es todos los autores en su orden,
    unidos con `" & "`.
- id: separator
  kind: missing
  domain: data semantics
  text: En los títulos y los nombres de autor, cada tramo de espacios se convierte en un espacio normal
    (los espacios se mantienen).
- id: max_len
  kind: missing
  domain: data semantics
  text: Un título o un nombre de autor conserva sus primeros 24 caracteres y después se quitan los espacios,
    puntos y separadores de los extremos.
- id: content
  kind: missing
  domain: data semantics
  text: Un archivo de la biblioteca contiene solo la sinopsis del libro (sin líneas de título, autor ni
    año), en UTF-8, con los párrafos separados por una línea en blanco.
- id: review_codes
  kind: missing
  domain: business rule
  text: Una fila de revisión lleva un código de motivo, UNREADABLE, NO_TITLE, NO_AUTHOR, NO_YEAR, NO_DESCRIPTION
    o CONFLICT (el primero de este orden que se aplique).
- id: missing_author
  kind: missing
  domain: business rule
  text: Un libro sin autor se coloca con el nombre de autor "Unknown" como cualquier otro libro y no va
    a revisión (no se usa NO_AUTHOR).
- id: no_description
  kind: missing
  domain: business rule
  text: Un libro sin sinopsis en ninguna fuente va a revisión como NO_DESCRIPTION; nunca se escribe una
    sinopsis inventada ni un texto de relleno.
- id: conflict
  kind: ambiguous
  domain: business rule
  text: Dos fuentes del mismo rango que no coinciden en un año (por ejemplo, un registro JSON y un registro
    ONIX del mismo libro) mandan el libro a revisión como CONFLICT; no se toma ninguno de los dos años.
- id: generic_titles
  kind: ambiguous
  domain: data semantics
  text: Un nombre de archivo con sentido cuenta como título y los guiones bajos son espacios; uno genérico
    como doc_0042, scan_0007, book_0031 o un ISBN no cuenta, y un libro sin otro título va a revisión
    como NO_TITLE.
