<h2>책 소개</h2>
<div class="description"><p>철새들이 한 달 일찍 떠나자, 운하가 흐르는 오래된 도시에 사는 오랫동안 말을 끊은 두 자매는 무엇을 남길지 결정해야 한다.</p><p>가족이 끝내 하지 못한 말에 관한 조용한 소설.</p></div>
