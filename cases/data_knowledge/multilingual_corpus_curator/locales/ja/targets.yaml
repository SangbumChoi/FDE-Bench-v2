- id: layout
  text: ライブラリに並べる本は、out_dir の中の {{layout}} というパスのファイル1つです。
- id: year_basis
  text: パスの年は{{year_basis}}です。年が1つしかない本はその年を使います。
- id: script
  text: パスの書名と著者名は{{script}}で書きます。
- id: co_authors
  text: 共著の本では、パスの著者の部分は{{multi_author}}です。
- id: separator
  text: 書名と著者名の中の連続する空白は{{sep}}にします。
- id: max_len
  text: 書名と著者名は先頭の {{max_len}} 文字だけ残し、両端の空白・ピリオド・区切り文字を除きます。
- id: content
  text: ライブラリのファイルにはその本の紹介文だけを入れます（書名・著者・年の行は入れない）。UTF-8 で、段落の間に空行を入れます。
- id: review_codes
  text: 確認の行には理由コード UNREADABLE、NO_TITLE、NO_AUTHOR、NO_YEAR、NO_DESCRIPTION、CONFLICT のうち1つを付けます（この順で最初に当てはまるもの）。
- id: missing_author
  text: '<!-- when: no_author=review -->著者のない本は NO_AUTHOR として確認に回します。方針なので、例外が承認されれば「{{fallback_author}}」でライブラリに並べます。<!-- /when --><!-- when: no_author=Unknown,Anonymous -->著者のない本は著者名「{{fallback_author}}」でほかの本と同じようにライブラリに並べ、確認には回しません（NO_AUTHOR は使わない）。<!-- /when -->'
- id: no_description
  text: どの情報源にも紹介文がない本は NO_DESCRIPTION として確認に回します。作った紹介文や仮の文言は決して書きません。
- id: conflict
  text: 同じ段階の2つの情報源で年が食い違う本（たとえば1冊の JSON レコードと ONIX レコード）は CONFLICT として確認に回します。どちらの年も採りません。
- id: generic_titles
  text: 意味のあるファイル名は書名になります（アンダースコアは空白）が、doc_0042、scan_0007、book_0031 や ISBN のような汎用的な名前はなりません。ほかに書名のない本は NO_TITLE として確認に回します。
