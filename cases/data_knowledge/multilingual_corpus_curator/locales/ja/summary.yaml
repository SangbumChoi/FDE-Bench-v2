# The case in plain words, shown at the top of its page.
task: 'AIは、顧客が共有ドライブ全体（中国語・英語・韓国語・日本語・スペイン語の本およそ100冊。ファイルの種類はサンプルと同じで、本は別）に対してオフラインで1回実行する Python プログラムを作ります。プログラムは整理されたライブラリ（1冊につき紹介文だけを収めた UTF-8 のテキストファイル1つ、パスは年・書名・著者で組み立てる）と、どのファイルをどこに置いたかの一覧（`manifest.csv`）を作り、整理できない本は理由コードを付けて、顧客のチームが確認できるよう別にしておきます。'
given:
  - '顧客の依頼：本およそ100冊分の資料が各地のオフィス、スキャン担当、版権チームのファイルに散らばっているので、ドライブ全体で実行して1冊につき紹介文のファイルを1つ目録チームの決まりどおりに並べ、一覧を残し、整理できないものは推測せずに別にしておくプログラムがほしい、という内容です。'
  - '`corpus/` は、整理せずにそのままコピーしたドライブのサンプルです。100冊分でファイルはおよそ120個あり、多くは `inbox/`、`misc/` と各オフィスのフォルダ（`london/`、`madrid/`、`北京办公室/`、`東京オフィス/`、`서울지사/`）にあります。1冊の書名・著者・年・紹介文は、JSON、ONIX XML、EPUB、DOCX、PDF、HTML、Markdown、プレーンテキストの1〜3個のファイルに分かれていて、古いエンコーディングのものもあります。'
  - '`corpus/catalogs/` には1行1冊の目録の書き出し `rights_catalog_export.csv`（英語のヘッダー）と `東京_目録.csv`（日本語のヘッダー）が、`corpus/archives/` にはさらに2冊ずつ入った zip アーカイブ `handover_2021.zip` と `old_drive_backup.zip` があります。'
  - '`corpus/scans/` には、文字がなく画像だけの PDF が4つあります（2つは読めるファイルが別にある本のコピー、2つはその本の唯一の資料）。不要ファイルはほかのフォルダに散らばっています。`.DS_Store`、`Thumbs.db`、`desktop.ini`、Office のロックファイル、空のテキストファイルです。'
  - '`整理メモ.txt` は短いメモです。サンプルは整理せずにそのままコピーしたこと、誰がファイルを置いたか（古いアーカイブや目録の書き出しも含む）、本番では同じ構成のドライブ全体を渡すことが書かれています。'
ask:
  - 'ライブラリのフォルダ構成です。ケースのバージョンごとに変わり、`library/<年>/<書名>/<著者>.txt`、`library/<年>/<著者>/<書名>.txt`、`library/<著者>/<年>_<書名>.txt` のどれかです。'
  - 'パスに入れる年が初版の刊行年か、顧客の手元にある版の刊行年かです（バージョンごとに変わります）。年が1つしかない本は、その年を両方に使います。'
  - '書名と著者名を原語の文字で書くか、メタデータで対になっているローマ字表記で書くかです（バージョンごとに変わります。中国語・韓国語・日本語の本で違いが出ます）。'
  - '共著の本の著者を筆頭著者のみにするか、全著者を順番どおり `" & "` でつなぐかです（バージョンごとに変わります）。'
  - '書名や名前をファイル名にする方法です。空白を `_` か `-` にするか半角スペースのまま残すか、先頭から何文字残すか（easy は40・48・60文字、medium は32・40・50文字、hard は24・32・40文字のどれか）が、どちらもバージョンごとに変わります。あらかじめ全角英数は半角に直し、分解されたアクセントは合成したうえで、`: ? / *` などの文字は空白にします。'
  - 'ライブラリのファイルと一覧の中身です（どのバージョンでも同じです）。ファイルにはその本の紹介文だけを UTF-8 で入れます。`manifest.csv` は1冊1行でその本のファイルをすべて挙げ、`placed` とパス、または `review` と6つの理由コード（UNREADABLE、NO_TITLE、NO_AUTHOR、NO_YEAR、NO_DESCRIPTION、CONFLICT のうち最初に当てはまるもの）のどれかを書きます。確認に回す本のファイルは `_review/` の下にコピーします。'
  - 'ファイルどうしが食い違うときにどれを優先するかです（どのバージョンでも同じです）。ファイルに埋め込まれたメタデータが扉ページのテキストより、扉ページのテキストがファイル名より優先します。ファイルの作成日・更新日は刊行年ではありません。'
  - 'hard のみ：どこにも著者のない本の扱いです。NO_AUTHOR で確認に回すか、著者名「Unknown」または「Anonymous」でライブラリに並べます（バージョンごとに変わります）。'
invalid_if:
  - 'ライブラリのファイルか `manifest.csv` が正しい UTF-8 ではありません。'
  - '書き出したファイル名やフォルダ名が `\ / : * ? " < > |` や制御文字を含むか、`.` や `..` であるか、空白やピリオドで終わるか、255バイトを超えています。'
  - '1冊の本のファイルがライブラリに2つ以上あります。ほかの形式やフォルダにあるコピーは1つにまとめなければなりません。'
  - '`review` とした一覧の行に理由コードがないか、6つ以外のコードが書かれています。'
  - 'hard：どこにも紹介文のない本にライブラリのファイルがあるか、ライブラリのファイルが空であるか、ファイルから取った紹介文ではなく作った文や仮の文が入っています。'
  - 'hard で、顧客の方針が著者のない本を確認に回すと決めている場合：著者のない本をそのままライブラリに並べています。ただし、AIが顧客に申請して例外の承認を得ていれば「Unknown」で並べられます。'
quality: '数えた本1冊あたりの平均点を100点満点で表します。正しいパスに紹介文とともに置いた本や、正しい理由コードで確認に回した本は1点（顧客の方針が確認に回すものなら、著者のない本は0.7点）、紹介文は正しいがパスが違えば0.4点に年・書名・著者が1つ合うごとに0.2点を加え、一覧の行がないか誤っている本はその点数の5分の1を失い、medium からは本でないライブラリのファイル1つにつき0.5点を引きます。従来のやり方（0点）は完全な UTF-8 の JSON 記録がある本だけを並べて残りはそのままにします（約10〜13点）。模範解答（1点）はすべての形式を読みますが、zip アーカイブ、ローマ数字の年、`©` の行など、いくつかの難しいケースを見落とします（easy 100点、medium 約93点、hard 約86点）。'
tiers:
  easy: '形式の整った30冊（1冊1つの UTF-8 ファイル、メタデータがそろい、年はふつうの4桁）だけを数え、名前は40・48・60文字のどれかで切ります。'
  medium: '残りの読める本を加えて66冊を数えます。古いエンコーディング（GB18030、CP949、Shift_JIS、CP1252）、`令和元年`・`民國98年`・`단기 4342년`・`MMIX` のような年、全角やアクセントが分解された書名、ファイル名に使えない文字、いくつものローマ字表記で出てくる著者、まとめるべきコピー、情報源の優先順位が加わり、名前は32・40・50文字のどれかで切り、本でないライブラリのファイルは1つにつき0.5点引かれます。'
  hard: '例外を加えて全100冊を数えます。別のファイルで補うか理由コードを付けて確認に回すべき書名・著者・年・紹介文の欠落、`©` の行の年、食い違う年、画像だけのスキャン、不要ファイル、zip アーカイブ、目録 CSV、紹介文を作らないこと、著者のない本についての顧客の方針が加わり、名前は24・32・40文字のどれかで切ります。'
