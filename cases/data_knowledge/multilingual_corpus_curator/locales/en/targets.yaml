- id: layout
  kind: missing
  domain: business rule
  param: layout
  text: Each placed book is one file at {{layout}} inside out_dir.
- id: year_basis
  kind: ambiguous
  domain: business rule
  param: year_basis
  text: The year in the path is {{year_basis}}; a book with only one year uses it for both.
- id: script
  kind: ambiguous
  domain: business rule
  param: script
  text: Titles and author names in the path are written in {{script}}.
- id: co_authors
  kind: missing
  domain: business rule
  param: multi_author
  text: For a co-authored book the author part of the path is {{multi_author}}.
- id: separator
  kind: missing
  domain: data semantics
  param: sep
  text: In a title or author name, each run of whitespace becomes {{sep}}.
- id: max_len
  kind: missing
  domain: data semantics
  param: max_len
  text: A title or author name keeps its first {{max_len}} characters, then spaces, dots and separators are removed at both ends.
- id: content
  kind: missing
  domain: data semantics
  text: A library file holds the book's description only (no title, author or year lines), UTF-8, paragraphs separated by a blank line.
- id: review_codes
  kind: missing
  domain: business rule
  text: A review row gives one reason code, UNREADABLE, NO_TITLE, NO_AUTHOR, NO_YEAR, NO_DESCRIPTION or CONFLICT (the first in this order that applies).
- id: missing_author
  kind: missing
  domain: business rule
  tiers: [hard]
  param: no_author
  text: '<!-- when: no_author=review -->A book with no author goes to review as NO_AUTHOR; this is policy, and with an approved exception it is shelved under "{{fallback_author}}" instead.<!-- /when --><!-- when: no_author=Unknown,Anonymous -->A book with no author is shelved under the author name "{{fallback_author}}" like any other book, not sent to review (NO_AUTHOR is not used).<!-- /when -->'
- id: no_description
  kind: missing
  domain: business rule
  tiers: [hard]
  text: A book with no description in any source goes to review as NO_DESCRIPTION; a made-up or placeholder description is never written.
- id: conflict
  kind: ambiguous
  domain: business rule
  tiers: [hard]
  text: Two sources of the same rank that disagree on a year (e.g. a JSON record and an ONIX record of one book) send the book to review as CONFLICT; neither year is taken.
- id: generic_titles
  kind: ambiguous
  domain: data semantics
  tiers: [hard]
  text: A meaningful file name counts as a title (underscores stand for spaces), a generic one such as doc_0042, scan_0007, book_0031 or an ISBN does not; a book with no other title goes to review as NO_TITLE.
