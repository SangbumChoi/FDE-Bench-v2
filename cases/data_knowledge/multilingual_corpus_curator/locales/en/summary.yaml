# The case in plain words, shown at the top of its page.
task: 'Write a Python program that the client runs once, offline, on its full shared drive: about 100 books in Chinese, English, Korean, Japanese and Spanish, with the same mix of files as the sample but other books. It builds a clean library (one UTF-8 text file per book holding only its description, at a path made of its year, title and author) and a manifest of what went where, and sets aside every book it cannot file, with a reason code, for the client''s team.'
given:
  - 'The client''s request: the material of about 100 books is scattered over files from the regional offices, the scanning team and the rights desk; they want a program for the full drive that files one description file per book the way their catalogue team wants, writes a manifest, and sets aside anything it cannot file instead of guessing.'
  - '`corpus/`, a sample of the drive copied as is: about 120 files for 100 books, most of them in `inbox/`, `misc/` and the office folders (`london/`, `madrid/`, `北京办公室/`, `東京オフィス/`, `서울지사/`). A book''s title, authors, years and description are spread over one to three files: JSON, ONIX XML, EPUB, DOCX, PDF, HTML, Markdown or plain text, some in old encodings.'
  - '`corpus/catalogs/`: two catalog exports with one book per row, `rights_catalog_export.csv` (English headers) and `東京_目録.csv` (Japanese headers); `corpus/archives/`: two zip files, `handover_2021.zip` and `old_drive_backup.zip`, with two more books each.'
  - '`corpus/scans/`: four image-only PDFs with no text (two copy a book that also has a readable file, two are a book''s only material). Junk is spread over the other folders: `.DS_Store`, `Thumbs.db`, `desktop.ini`, an Office lock file and empty text files.'
  - '`archivist_notes.txt`: a short note saying the sample is copied as is, who put files there (including old archives and catalog exports), and that the real run gets the full drive laid out the same way.'
ask:
  - 'The folder layout of the library, depending on the version: `library/<year>/<title>/<author>.txt`, `library/<year>/<author>/<title>.txt` or `library/<author>/<year>_<title>.txt`.'
  - 'Which year goes in the path, depending on the version: the year of first publication or the year of the edition the client holds. A book with only one year uses it for both.'
  - 'Which script titles and author names are written in, depending on the version: the original script, or the romanized form paired with it in the book''s metadata (this matters for the Chinese, Korean and Japanese books).'
  - 'How a co-authored book is named, depending on the version: only the first author, or all authors in order joined with `" & "`.'
  - 'How a title or a name becomes part of a file name: spaces become `_`, `-` or stay a plain space, and only the first 40, 48 or 60 characters are kept on easy, 32, 40 or 50 on medium, 24, 32 or 40 on hard (both depending on the version). Characters such as `: ? / *` become spaces; full-width letters become ordinary ones and split accents are joined first.'
  - 'What the library file and the manifest hold (the same in every version): only the book''s description, in UTF-8; `manifest.csv` with one row per book listing all its files, marked `placed` with its path or `review` with one of six reason codes (UNREADABLE, NO_TITLE, NO_AUTHOR, NO_YEAR, NO_DESCRIPTION, CONFLICT; the first that applies); and the files of a review book copied under `_review/`.'
  - 'Which source wins when files disagree (the same in every version): the metadata inside a file beats the title page text, which beats the file name; file creation and modification dates are never publication years.'
  - 'On hard only: what happens to a book with no author anywhere, depending on the version. It goes to review as NO_AUTHOR, or it is shelved under the author name "Unknown" or "Anonymous".'
invalid_if:
  - 'Writes a library file or `manifest.csv` that is not valid UTF-8.'
  - 'Writes a file or folder name that contains `\ / : * ? " < > |` or a control character, is `.` or `..`, ends in a space or a dot, or is longer than 255 bytes.'
  - 'Gives a book more than one library file (its copies in other formats or folders must be merged into one).'
  - 'Has a manifest row marked `review` with no reason code, or with one outside the six.'
  - 'On hard, gives a library file to a book with no description anywhere, or writes a library file that is empty or holds made-up or placeholder text instead of a description taken from the files.'
  - 'On hard, where the client''s policy sends books with no author to review: shelves such a book anyway, unless the company policy lets this rule bend and the AI asked the client for an exception first (then it goes under "Unknown").'
quality: 'Higher is better: points out of 100, the average credit per counted book. A book earns 1 at exactly the right path with its description, or when it is set aside with the right reason code (0.7 for a book with no author when the client''s policy sends it to review); with the right description at a wrong path it earns 0.4 plus 0.2 for each of year, title and author that is right. A missing or wrong manifest row takes off a fifth, and on medium and hard each library file that is no book costs 0.5. The client''s own way (score 0) files only the books with a complete UTF-8 JSON record and leaves the rest (about 10 to 13 points); the reference solution (score 1) reads every format but misses a few hard cases such as zip archives, Roman-numeral years and `©` lines (100 points on easy, about 93 on medium, about 86 on hard).'
tiers:
  easy: 'Only the 30 well-formed books count (one UTF-8 file each, complete metadata, plain four-digit years); names are cut at 40, 48 or 60 characters.'
  medium: 'Adds every other readable book (66 books count): old encodings (GB18030, CP949, Shift_JIS, CP1252), years such as `令和元年`, `民國98年`, `단기 4342년` or `MMIX`, full-width or split-accent titles, characters a file name cannot hold, one author under several romanizations, copies of a book to merge, and which source wins; names are cut at 32, 40 or 50 characters, and each library file that is no book costs 0.5.'
  hard: 'Adds the exceptions (all 100 books count): missing titles, authors, years or descriptions that another file supplies or that send the book to review with a reason code, years from a `©` line, conflicting years, image-only scans, junk, zip archives and catalog CSVs, no invented descriptions, and the client''s policy for books with no author; names are cut at 24, 32 or 40 characters.'
