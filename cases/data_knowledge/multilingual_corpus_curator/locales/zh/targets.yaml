- id: layout
  text: 每本上架的书在 out_dir 下对应一个文件，路径为 {{layout}}。
- id: year_basis
  text: 路径里的年份是{{year_basis}}；只有一个年份的书两者都用它。
- id: script
  text: 路径里的书名和作者名用{{script}}书写。
- id: co_authors
  text: 多人合著的书，路径里的作者部分为{{multi_author}}。
- id: separator
  text: 书名和作者名里的每一段连续空白换成{{sep}}。
- id: max_len
  text: 书名和作者名只保留前 {{max_len}} 个字符，然后去掉两端的空格、句点和分隔符。
- id: content
  text: 书库文件里只放这本书的简介（不要书名、作者、年份那几行），UTF-8，段落之间空一行。
- id: review_codes
  text: 复核行给出一个原因代码：UNREADABLE、NO_TITLE、NO_AUTHOR、NO_YEAR、NO_DESCRIPTION 或 CONFLICT（按这个顺序取第一个符合的）。
- id: missing_author
  text: '<!-- when: no_author=review -->没有作者的书以 NO_AUTHOR 送去复核；这是规定，批准例外后改以“{{fallback_author}}”上架。<!-- /when --><!-- when: no_author=Unknown,Anonymous -->没有作者的书以作者名“{{fallback_author}}”和其他书一样上架，不送去复核（不用 NO_AUTHOR）。<!-- /when -->'
- id: no_description
  text: 哪个来源都没有简介的书以 NO_DESCRIPTION 送去复核；绝不写编造的或占位的简介。
- id: conflict
  text: 同一级别的两个来源年份不一致（比如同一本书的一条 JSON 记录和一条 ONIX 记录），这本书以 CONFLICT 送去复核；两个年份都不采用。
- id: generic_titles
  text: 有意义的文件名可当书名（下划线代表空格），doc_0042、scan_0007、book_0031 或 ISBN 这类通用文件名不算；没有别的书名的书以 NO_TITLE 送去复核。
