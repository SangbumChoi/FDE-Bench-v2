- id: layout
  text: 서고에 올리는 책은 out_dir 안의 {{layout}} 경로에 파일을 하나씩 둡니다.
- id: year_basis
  text: 경로의 연도는 {{year_basis}}입니다. 연도가 하나뿐인 책은 그 연도를 씁니다.
- id: script
  text: 경로의 제목과 저자 이름은 {{script}}
- id: co_authors
  text: 공저인 책은 경로의 저자 부분에 {{multi_author}}
- id: separator
  text: 제목과 저자 이름에서 연속된 공백은 {{sep}} 바꿉니다.
- id: max_len
  text: 제목과 저자 이름은 앞의 {{max_len}}자만 남기고, 양 끝의 공백·마침표·구분자를 없앱니다.
- id: content
  text: 서고 파일에는 책 소개글만 넣습니다(제목·저자·연도 줄은 넣지 않음). UTF-8이며 문단 사이에 빈 줄을 둡니다.
- id: review_codes
  text: 검토 줄에는 사유 코드 UNREADABLE, NO_TITLE, NO_AUTHOR, NO_YEAR, NO_DESCRIPTION, CONFLICT 중 하나를 적습니다(이 순서로 해당하는 첫 번째).
- id: missing_author
  text: '<!-- when: no_author=review -->저자가 없는 책은 NO_AUTHOR로 검토에 보냅니다. 방침이므로 예외를 승인받으면 저자를 "{{fallback_author}}"라고 적어 서고에 올립니다.<!-- /when --><!-- when: no_author=Unknown,Anonymous -->저자가 없는 책은 저자 이름을 "{{fallback_author}}"라고 적어 다른 책과 똑같이 서고에 올리고, 검토로 보내지 않습니다(NO_AUTHOR는 쓰지 않음).<!-- /when -->'
- id: no_description
  text: 어느 출처에도 소개글이 없는 책은 NO_DESCRIPTION으로 검토에 보냅니다. 지어낸 소개글이나 자리 표시 문구는 절대 쓰지 않습니다.
- id: conflict
  text: 같은 단계의 두 출처가 연도를 다르게 적으면(예를 들어 한 책의 JSON 기록과 ONIX 기록) 그 책은 CONFLICT로 검토에 보냅니다. 어느 연도도 택하지 않습니다.
- id: generic_titles
  text: 의미 있는 파일 이름은 제목으로 칩니다(밑줄은 공백). doc_0042, scan_0007, book_0031이나 ISBN 같은 일반적인 이름은 제목이 아니며, 다른 제목이 없는 책은 NO_TITLE로 검토에 보냅니다.
