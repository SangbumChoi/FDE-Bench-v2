- id: layout
  text: 서고에 올리는 책은 out_dir 안의 {{layout}} 경로에 파일을 하나씩 둡니다.
- id: year_basis
  text: 경로의 연도는 {{year_basis}}입니다. 연도가 하나뿐인 책은 그 연도를 씁니다.
- id: script
  text: 경로의 제목과 저자 이름은 {{script}} 로마자는 메타데이터에서 원래 표기와 짝지어진 것을 씁니다.
- id: co_authors
  text: 공저인 책은 경로의 저자 부분에 {{multi_author}}
- id: name_rules
  text: '제목과 저자 이름: NFKC, \ / : * ? " < > | 와 제어 문자는 공백으로, 연속 공백은 {{sep}}, 앞의 {{max_len}}자만 남기고, 양 끝의 공백·마침표·구분자 제거.'
- id: content
  text: 서고 파일에는 책 소개글만 UTF-8로 넣고 문단 사이에 빈 줄을 둡니다.
- id: manifest_review
  text: manifest.csv에 모든 책을 적고(원본 파일은 ;로 구분, 상태는 placed 또는 review), 검토할 책은 파일을 _review/ 아래로 복사하고 사유 코드 UNREADABLE, NO_TITLE, NO_AUTHOR, NO_YEAR, NO_DESCRIPTION, CONFLICT 중 하나(해당하는 첫 번째)를 줍니다.
- id: precedence
  text: 각 정보는 내장 메타데이터, 표제지 텍스트, 파일 이름 순으로 가져옵니다. 파일 작성일·수정일은 출판 연도가 아닙니다.
- id: encodings
  text: 일부 파일은 표시 없이 GB18030, CP949, Shift_JIS, CP1252로 되어 있습니다(HTML은 charset을 밝힘).
- id: year_notations
  text: 연도는 일본 연호, 민국 기년, 단기, 한자 숫자, 로마 숫자로도 나오며 모두 네 자리 연도로 바꿉니다.
- id: author_variants
  text: 한 저자가 여러 로마자 표기나 '성, 이름' 형태로 나옵니다. 항상 공식 짝 표기를 쓰고, 책 자체 파일에 없으면 드라이브에 있는 같은 저자의 다른 책에서 찾습니다.
- id: duplicates
  text: 여러 파일이나 형식에 있는 같은 책의 사본은 서고 파일 하나로 합치고, 매니페스트의 그 줄에 파일을 모두 적습니다.
- id: exceptions
  text: 빠진 항목은 그 책의 다른 파일에서 가져옵니다. 의미 있는 파일 이름은 제목이 됩니다(일반 이름은 아님). 저작권 줄이 연도를 줍니다. 소개글이 없으면 NO_DESCRIPTION이고 절대 지어내지 않습니다. 같은 단계 두 출처의 연도가 다르면 CONFLICT입니다.
- id: containers
  text: zip 압축 파일과 카탈로그 CSV(한 줄에 한 권, 머리글은 영어 또는 일본어)에도 책이 있습니다. 이미지뿐인 스캔본은 읽을 수 있는 사본이 있으면 무시하고 없으면 UNREADABLE입니다. 쓰레기 파일은 아무것도 만들지 않습니다.
- id: missing_author
  text: '<!-- when: no_author=review -->저자가 없는 책은 NO_AUTHOR로 검토에 보냅니다. 방침이므로 예외를 승인받으면 저자를 "{{fallback_author}}"라고 적어 서고에 올립니다.<!-- /when --><!-- when: no_author=Unknown,Anonymous -->저자가 없는 책은 저자 이름을 "{{fallback_author}}"라고 적어 다른 책과 똑같이 서고에 올리고, 검토로 보내지 않습니다(NO_AUTHOR는 쓰지 않음).<!-- /when -->'
- id: scoring
  text: 책마다 정확한 경로와 소개글이면 1점(아니면 소개글 0.4점에 연도·제목·저자가 맞을 때마다 0.2점, 경로만 맞고 소개글이 틀리면 0.2점), 검토는 그 책의 파일을 적은 줄이 모두 맞는 사유 코드면 1점(모두 같은 다른 코드면 0.4점, 줄끼리 어긋나면 0점). 매니페스트 줄이 없거나 틀리면 그 책 점수의 5분의 1을 잃습니다. medium과 hard에서는 책이 아닌 서고 파일마다 0.5점 감점.
