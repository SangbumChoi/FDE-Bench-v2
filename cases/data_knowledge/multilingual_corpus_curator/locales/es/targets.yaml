- id: layout
  text: Cada libro que se coloca en la biblioteca es un archivo en {{layout}} dentro de la carpeta out_dir.
- id: year_basis
  text: El año de la ruta es {{year_basis}}; un libro con un solo año usa ese año.
- id: script
  text: Los títulos y los nombres de autor de la ruta se escriben en {{script}}.
- id: co_authors
  text: En los libros con varios autores, la parte del autor en la ruta es {{multi_author}}.
- id: separator
  text: En los títulos y los nombres de autor, cada tramo de espacios se convierte en {{sep}}.
- id: max_len
  text: Un título o un nombre de autor conserva sus primeros {{max_len}} caracteres y después se quitan los espacios, puntos y separadores de los extremos.
- id: content
  text: Un archivo de la biblioteca contiene solo la sinopsis del libro (sin líneas de título, autor ni año), en UTF-8, con los párrafos separados por una línea en blanco.
- id: review_codes
  text: Una fila de revisión lleva un código de motivo, UNREADABLE, NO_TITLE, NO_AUTHOR, NO_YEAR, NO_DESCRIPTION o CONFLICT (el primero de este orden que se aplique).
- id: missing_author
  text: '<!-- when: no_author=review -->Un libro sin autor va a revisión como NO_AUTHOR; es una política y, con una excepción aprobada, se coloca como "{{fallback_author}}".<!-- /when --><!-- when: no_author=Unknown,Anonymous -->Un libro sin autor se coloca con el nombre de autor "{{fallback_author}}" como cualquier otro libro y no va a revisión (no se usa NO_AUTHOR).<!-- /when -->'
- id: no_description
  text: Un libro sin sinopsis en ninguna fuente va a revisión como NO_DESCRIPTION; nunca se escribe una sinopsis inventada ni un texto de relleno.
- id: conflict
  text: Dos fuentes del mismo rango que no coinciden en un año (por ejemplo, un registro JSON y un registro ONIX del mismo libro) mandan el libro a revisión como CONFLICT; no se toma ninguno de los dos años.
- id: generic_titles
  text: Un nombre de archivo con sentido cuenta como título y los guiones bajos son espacios; uno genérico como doc_0042, scan_0007, book_0031 o un ISBN no cuenta, y un libro sin otro título va a revisión como NO_TITLE.
