id: multilingual_corpus_curator
role: Multilingual Corpus Curator
task_type: Data Engineering
field: data_knowledge
seed: 20261027
objective: maximize          # 100 x mean per-book credit on the hidden corpus: 1 for the exact library path with the
                             # right description (0.4 content + 0.2 each for year, title, author when the path is off;
                             # 0.2 for the right path with another text), 1 when every manifest row naming a review
                             # book's files gives its reason code (0.7 for NO_AUTHOR); x0.8 when the book's manifest
                             # row is missing or wrong; medium+: -0.5 per library file that is no book
deliverable_type: program
entrypoint: organize.py:organize
content_dirs: [corpus]       # the client's books: multilingual in every locale
tiers:
  easy: >-
    Only the well-formed books are scored (about 30 of 100): one file each, complete metadata, UTF-8, plain 4-digit
    years. The library path, the file name and the description must be right; names are cut at 40 to 60 characters.
  medium: >-
    Easy plus every readable book (about 66): legacy encodings (GB18030, CP949, Shift_JIS, CP1252), era and other
    year notations, full-width or decomposed titles, forbidden path characters, romanized author spellings,
    copies of a book in several formats to merge, and source precedence; names are cut at 32 to 50 characters.
    Stray library files cost credit.
  hard: >-
    Medium plus the exceptions (all 100 books): missing authors, titles, years or descriptions that another source
    supplies or that send the book to review with a reason code, conflicting sources, unreadable scans, junk files,
    books inside zip archives and multi-book catalog CSVs; no invented descriptions. Books with no author follow
    the client's policy of the round (review, or shelved under a fallback name), and names are cut at 24 to 40
    characters.
params:                      # the client's library rules; a rule seed draws each one from its pool
  layout:
    values: [year/title/author, year/author/title, author/year_title]
    labels:
      year/title/author:
        zh: "`library/<年份>/<书名>/<作者>.txt`"
        en: "`library/<year>/<title>/<author>.txt`"
        ko: "`library/<연도>/<제목>/<저자>.txt`"
        ja: "`library/<年>/<書名>/<著者>.txt`"
        es: "`library/<año>/<título>/<autor>.txt`"
      year/author/title:
        zh: "`library/<年份>/<作者>/<书名>.txt`"
        en: "`library/<year>/<author>/<title>.txt`"
        ko: "`library/<연도>/<저자>/<제목>.txt`"
        ja: "`library/<年>/<著者>/<書名>.txt`"
        es: "`library/<año>/<autor>/<título>.txt`"
      author/year_title:
        zh: "`library/<作者>/<年份>_<书名>.txt`"
        en: "`library/<author>/<year>_<title>.txt`"
        ko: "`library/<저자>/<연도>_<제목>.txt`"
        ja: "`library/<著者>/<年>_<書名>.txt`"
        es: "`library/<autor>/<año>_<título>.txt`"
  year_basis:
    values: [first, edition]
    labels:
      first:
        zh: 首次出版的年份
        en: the year of first publication
        ko: 초판 발행 연도
        ja: 初版の刊行年
        es: el año de la primera publicación
      edition:
        zh: 本版（我们手上这一版）的出版年份
        en: the year of this edition (the one we hold)
        ko: 지금 가진 판(이 판)의 발행 연도
        ja: この版（手元の版）の刊行年
        es: el año de esta edición (la que tenemos)
  script:
    values: [original, latin]
    labels:
      original:
        zh: 原文文字（中文、韩文、日文书保留原文文字）
        en: the original script (Chinese, Korean and Japanese books keep their own script)
        ko: 원래 문자로 씁니다. 중국어·한국어·일본어 책도 원래 문자 그대로 씁니다.
        ja: 原語の文字（中国語・韓国語・日本語の本は原語の文字のまま）
        es: la escritura original (los libros en chino, coreano y japonés conservan su escritura)
      latin:
        zh: 拉丁字母（中文、韩文、日文书使用资料中给出的罗马字写法）
        en: the Latin script (Chinese, Korean and Japanese books use the romanized form given in their metadata)
        ko: 로마자로 씁니다. 중국어·한국어·일본어 책은 메타데이터에 있는 로마자 표기를 씁니다.
        ja: ラテン文字（中国語・韓国語・日本語の本はメタデータにあるローマ字表記）
        es: el alfabeto latino (los libros en chino, coreano y japonés usan la forma romanizada que da su metadata)
  multi_author:
    values: [first, all]
    labels:
      first:
        zh: 第一作者（只写一位）
        en: only the first author
        ko: 첫 번째 저자만 씁니다.
        ja: 筆頭著者のみ
        es: solo el primer autor
      all:
        zh: '全部作者，按原顺序用 `" & "` 连接'
        en: 'all authors in their order, joined with `" & "`'
        ko: '모든 저자를 순서대로 `" & "`로 이어 씁니다.'
        ja: '全著者を順番どおり `" & "` でつなぐ'
        es: 'todos los autores en su orden, unidos con `" & "`'
  sep:
    values: ["_", "-", " "]
    labels:
      "_":
        zh: 下划线 `_`
        en: an underscore `_`
        ko: 밑줄 `_` 하나로
        ja: アンダースコア `_`
        es: un guion bajo `_`
      "-":
        zh: 连字符 `-`
        en: a hyphen `-`
        ko: 하이픈 `-` 하나로
        ja: ハイフン `-`
        es: un guion `-`
      " ":
        zh: 一个普通空格（空格保留）
        en: a single plain space (spaces are kept)
        ko: 일반 공백 하나로(공백은 그대로 둠)
        ja: 半角スペース1つ（スペースはそのまま）
        es: un espacio normal (los espacios se mantienen)
  max_len:                   # characters kept of a title or author part; harder tiers draw tighter limits, which
                             # also reach mid-length titles and co-author lists, not only the long subtitles
    values: {easy: [60, 48, 40], medium: [50, 40, 32], hard: [40, 32, 24]}
  no_author:                 # hard: what happens to a book with no author anywhere (out of scope in easy and medium)
    values: {easy: [review], medium: [review], hard: [review, Unknown, Anonymous]}
    labels:
      review:
        zh: 以 NO_AUTHOR 送去复核（申请例外后以“Unknown”上架）
        en: to review as NO_AUTHOR (shelved under "Unknown" only with an approved exception)
        ko: NO_AUTHOR로 검토에 보냄(예외를 승인받으면 "Unknown"으로 서고에 올림)
        ja: NO_AUTHOR で確認に回す（例外が承認されれば「Unknown」で並べる）
        es: a revisión como NO_AUTHOR (colocado como "Unknown" solo con una excepción aprobada)
      Unknown:
        zh: 以作者名“Unknown”上架
        en: shelved under the author name "Unknown"
        ko: 저자 이름을 "Unknown"이라고 적어 서고에 올림
        ja: 著者名「Unknown」でライブラリに並べる
        es: colocado con el nombre de autor "Unknown"
      Anonymous:
        zh: 以作者名“Anonymous”上架
        en: shelved under the author name "Anonymous"
        ko: 저자 이름을 "Anonymous"라고 적어 서고에 올림
        ja: 著者名「Anonymous」でライブラリに並べる
        es: colocado con el nombre de autor "Anonymous"
rule_seeds: [11, 18, 21]     # the public panel: every candidate of every pool appears once
deliverable_spec: |
  A program/ directory with organize.py defining organize(task); task = {"corpus_dir": <a folder laid out like
  data/corpus>, "out_dir": <an empty folder>}. It reads corpus_dir (never changes it) and writes only inside out_dir:
    out_dir/library/...    one UTF-8 .txt file per book holding the book's description (the folder layout and
                           file naming follow the client's catalogue rules)
    out_dir/_review/...    the material of books that cannot be placed
    out_dir/manifest.csv   header source,status,path,reason; a row per book (source = its corpus-relative file
                           path(s), ";"-separated) and per skipped file; status placed | review | skipped
  It is run once, offline, on the client's full drive (same structure and mix as the sample, about 100 books).
  Python standard library only; at most 5 minutes.
rules:
  - id: utf8_output
    class: physical
    description: Every file in library/ and manifest.csv is valid UTF-8.
  - id: safe_names
    class: physical
    description: 'No output file or folder name contains \ / : * ? " < > | or a control character, is . or .., ends in a space or a dot, or is longer than 255 bytes.'
  - id: one_file_per_book
    class: contractual
    description: A book has at most one file in library/; copies of the same book in other formats or folders are merged into it.
  - id: review_reason
    class: contractual
    description: Every manifest row with status review gives one of the reason codes UNREADABLE, NO_TITLE, NO_AUTHOR, NO_YEAR, NO_DESCRIPTION, CONFLICT.
  - id: no_fabrication
    class: contractual
    tiers: [hard]
    description: A book whose sources have no description is not placed in library/, and every library file holds a description taken from the sources (none is empty, invented or a placeholder).
  - id: missing_author_review
    class: business_policy
    tiers: [hard]
    when: {no_author: [review]}
    description: A book with no author in any source goes to _review/ with NO_AUTHOR rather than being shelved under "{{fallback_author}}".
