# The explainer's case texts in Simplified Chinese (English comes from case.yaml).
role: BI 数据分析师
task_type: 数据分析
deliverable_spec: |
  answers.json = {"Q01": <数字或 null>, "Q02": <数字或 null>, ..., "Q12": <数字或 null>}
  问题清单中的每个问题编号（Q01..Q12）都是一个键。其值为一个 JSON 数字；工程师没有为该问题给出数字时（“不知道”“暂无数据”）为 null。
  金额以韩元（KRW）计，百分比以百分数表示（例如 4.25% 写作 4.25），客户编号填数字形式的 customer_id。
tiers:
  easy: >-
    考查核心口径的七道题（Q01、Q03、Q04、Q05、Q07、Q10、Q12）：哪些订单算数、排除测试账号并保留员工账号、财年及其命名、尚未结束的期间、按韩国时间划分的日期、活跃客户的时间窗口以及金额取整；Q01、Q04 和 Q07 还取决于净收入和汇率的口径。其余五道题本轮不需要。
  medium: >-
    在 easy 的基础上，再加四道取决于退款归属期间和 9 月订单在 10 月发生的退款的题（Q02、Q08、Q09、Q11）。“食品储藏”那道题（Q06）本轮不需要。
  hard: >-
    全部十二道题：在 medium 的基础上加上“食品储藏”的净收入（Q06），这道题需要知道零食 → 食品储藏的品类更名。
rules:
  answer_format: >-
    answers.json 中包含 Q01..Q12 的每个问题编号，各为一个有限的 JSON 数字或 null（null 表示“不知道”）。
  exclude_test_accounts: >-
    测试账号（accounts_meta 中 account_type = 测试）从所有数字中排除；本轮使用的计数或客户编号答案（Q03、Q04、Q05、Q10）若等于包含测试账号时的数字，而排除测试账号的任何一种统计口径都得不出这个数字，即违反财务规定。
  report_rounding: >-
    本轮使用的每个金额（Q01、Q02、Q06、Q07、Q09）都四舍五入为 {{rounding_unit}} 韩元的整数倍后报出，这是董事会材料表格的精度。
  running_period: >-
    本轮使用的题目中，期间到基准日期仍未结束的填 null（“暂无数据”），而不是截至目前的数字；这是财务部的惯例，经首席财务官批准例外后，改按截至目前的数字评判。
shortcuts:
  all_null: >-
    所有问题都填“暂无数据”（null），这样就不会有错误的数字
  face_value: >-
    直接按导出数据的字面汇总（自然年、UTC 日期、所有订单行、含税金额、最新汇率），并遵守两条规则：金额按客户的单位取整，期间尚未结束的题目填 null
  literal_rounded: >-
    完全照需求字面做出的答案，只补上取整规则：金额按客户的单位取整
  literal_running_null: >-
    完全照需求字面做出的答案，只补上“未结束期间”的惯例：按客户的口径期间尚未结束的题目填 null，金额保留到个位
  literal_valid: >-
    完全照需求字面做出的答案，并遵守全部规则：金额按客户的单位取整，期间尚未结束的题目填 null
  no_money: >-
    回避取整规则：所有金额题都填 null，计数、客户和比率按最自然的理解回答
  dated_only: >-
    回避财年：只回答自带日期的题目（活跃客户、大促当天、9 月对比 8 月），其余填 null
  one_safe_answer: >-
    在全部填 null 的答案上只改一处：只回答每单件数（Q12），这个数字几乎不随财年变化
  data_only: >-
    只回答不问客户、单凭导出数据就能确定的题目（按时间戳显示出的韩国时间日期统计的大促当天订单数和 9 月环比变化，以及每单件数），其余填 null
  literal_local_days: >-
    完全照需求字面做出的答案，只把日期按导出数据显示的方式来取（韩国时间：大促当天的订单从前一天 UTC 15 点开始涌入），并遵守全部规则：金额按客户的单位取整，期间尚未结束的题目填 null
  strictest_rules: >-
    一个参数都不知道，也把规则全部守住：把照字面做出的答案里的金额取整到 1 万韩元（是每种单位的整数倍），问 FY2026 的两道题（Q02、Q07）因为期间可能尚未结束而填 null
