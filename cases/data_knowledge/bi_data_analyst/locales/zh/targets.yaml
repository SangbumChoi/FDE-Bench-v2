- id: fiscal_year
  text: 财年从 {{fy_start}} 1 日开始。
- id: fy_naming
  text: 财年以开始那一年命名：FY2025 = {{fy2025}}，FY2026 第一季度为 {{fy2026_q1}}，上半年为 {{fy2026_h1}}。
- id: running_period
  text: 到基准日期仍未结束的期间还没有数字：对应的题目填 null（“暂无数据”），而不是截至基准日期的数字。这是财务部的惯例，首席财务官可以批准报截至目前的数字。
- id: local_day
  text: 时间戳以 UTC 存储，但日、月、季度和财年都按韩国时间（UTC+9）划分；取日期前先加 9 小时。
- id: test_accounts
  text: accounts_meta 中 account_type 为“测试”的客户是 QA 账号，所有数字都要排除；“员工”账号是真实客户，需要保留。
- id: counted_orders
  text: 只有“已完成”的订单才算；“已取消”和“支付失败”的订单一律不算，即使 payments.csv 里有付款记录。
- id: revenue_ex_tax
  text: 净收入不含税：订单 subtotal（税前）减去其退款的不含税部分（退款金额 × subtotal / total）。
- id: refund_period
  text: 退款冲减的是其订单下单日期所在期间的收入，而不是退款日期所在期间。
- id: late_refunds
  text: 导出数据取于 2026-10-31，包含截至那时记录的全部退款；基准日期之后（2026 年 10 月）办理的退款也要算，冲减其订单所在期间的收入。
- id: fx_order_date
  text: 金额以订单币种存储，按订单日期（韩国时间）的 fx_rates 中 krw_per_unit 换算成韩元。
- id: active_customer
  text: 活跃客户是在截至基准日期的 {{active_days}} 天内（{{active_from}} 至 2026-09-30）至少有一笔已完成订单的客户。
- id: category_rename
  text: “零食”品类于 2025-10-01 更名为“食品储藏”，较早的商品仍是旧标签；问到“食品储藏”时两个标签都要算。
- id: report_rounding
  text: 所有金额答案都四舍五入为 {{rounding_unit}} 韩元的整数倍。
