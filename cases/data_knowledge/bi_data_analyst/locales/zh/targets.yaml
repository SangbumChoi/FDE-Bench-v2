- id: fiscal_year
  text: 财年从 {{fy_start}} 1 日开始，以开始那一年命名（FY2025 = {{fy2025}}）；FY2026 第一季度为 {{fy2026_q1}}，上半年为 {{fy2026_h1}}，到基准日期仍未结束的期间统计到基准日期为止。
- id: local_day
  text: 时间戳以 UTC 存储，但日、月、季度和财年都按韩国时间（UTC+9）划分；取日期前先加 9 小时。
- id: test_accounts
  text: accounts_meta 中 account_type 为“测试”的客户是 QA 账号，所有数字都必须排除；“员工”账号保留。
- id: counted_orders
  text: 只有“已完成”的订单才算；“已取消”和“支付失败”的订单一律不算，即使 payments.csv 里有付款记录。
- id: net_revenue
  text: 净收入 = 订单 subtotal（税前）减去不含税退款（退款金额 × subtotal / total），计入下单日期所在期间，而不是退款日期所在期间。
- id: late_refunds
  text: 导出数据取于 2026-10-31，包含截至那时记录的全部退款；基准日期之后（2026 年 10 月）办理的退款也要算，冲减其订单所在期间的收入。
- id: fx_order_date
  text: 金额以订单币种存储，按订单日期（韩国时间）的 fx_rates 中 krw_per_unit 换算成韩元；退款使用其订单的同一汇率。
- id: active_customer
  text: 活跃客户是在截至基准日期的 {{active_days}} 天内（{{active_from}} 至 2026-09-30）至少有一笔已完成订单的客户。
- id: category_rename
  text: “零食”品类于 2025-10-01 更名为“食品储藏”，较早的商品仍是旧标签；问到“食品储藏”时两个标签都要算，订单的退款按行金额比例分摊。
- id: report_rounding
  text: 财务要求所有金额答案四舍五入为 {{rounding_unit}} 韩元的整数倍；答案与精确值比较（计数和编号须完全一致，金额在 0.5% 或取整单位一半以内，环比变化在 0.05 个百分点以内，其他在 0.5% 以内）。
- id: answer_rewards
  text: 答案会放进 CEO 的董事会材料，null（“暂无数据”）也是可以接受的答案；在财务部看来，正确的数字价值 {{right_reward}}，null 价值 {{dont_know_reward}}，错误的数字价值 {{wrong_reward}}。
