# The case in plain words, shown at the top of its page.
task: >-
  根据首尔一家咖啡与茶订阅网店的订单数据库导出数据，回答管理层提出的十二个问题，交回 `answers.json`，每个问题一个数字；没有把握的数字填“不知道”。这些答案会放进下次董事会上 CEO 的汇报材料，金额以韩元计。
given:
  - >-
    客户的需求：“管理层发来了一批问题，能麻烦您根据数据库导出的数据帮忙回答一下吗？……每个问题给一个数字就行。”里面没有给出这些数字的任何统计口径，也没有说报错数字的代价。
  - >-
    `问题清单.md` 和 `数据字典.md`：十二个问题（基准日期 2026-09-30，金额以韩元计）和各表的字段说明。
  - >-
    `customers.csv` 和 `accounts_meta.csv`：韩国、日本、美国的 1,407 位客户，含注册时间（UTC）、购买方式（订阅或单次购买）和账号类型（普通、员工、测试）。
  - >-
    `orders.csv`、`order_items.csv`、`payments.csv`、`refunds.csv`：2025 年 1 月至 2026 年 9 月约 11,000 笔订单的状态、币种（KRW、JPY、USD）、税前和含税金额，以及订单明细、付款和退款（退款金额含税，部分退款在 2026 年 10 月办理）。
  - >-
    `products.csv` 和 `fx_rates.csv`：6 个品类的 24 件商品（其中有“零食”和“食品储藏”），以及每天美元和日元兑韩元的汇率。
ask:
  - >-
    财年从哪个月开始：随版本不同，为 1 月、4 月或 7 月。财年以开始那一年命名，所以 FY2025 可能是 2025 年 1–12 月、2025 年 4 月至 2026 年 3 月，或 2025 年 7 月至 2026 年 6 月。
  - >-
    “一天”指韩国时间（UTC+9）的自然日，而所有时间戳都按 UTC 存储：UTC 2026-06-30 16:30 的订单算在大促当天 2026-07-01。
  - >-
    哪些订单和客户算数：只算“已完成”的订单，已取消或付款失败的订单即使有付款记录也不算；测试账号从所有数字中排除，员工账号保留。
  - >-
    金额怎么算：净收入是税前金额减去不含税的退款，退款（包括 2026 年 10 月办理的）冲减订单所在期间的收入；日元和美元金额按下单当天的汇率换算为韩元。
  - >-
    “活跃客户”的含义：截至 2026-09-30 的最近 30、60 或 90 天内（随版本不同）至少有一笔算数的订单的客户。
  - >-
    “食品储藏”在 2025-10-01 之前叫“零食”，较早的商品仍是旧标签，所以问到“食品储藏”时两个标签都要算（只在 hard 中需要）。
  - >-
    金额答案的取整单位：随版本不同，为 100、1,000 或 10,000 韩元。
  - >-
    “不知道”值多少：财务部把正确的数字记为 2，错误的记为 0，“不知道”（董事会材料中显示为“暂无数据”）随版本记为 0.5、1 或 1.5；所以只有答对的把握超过 25%、50% 或 75% 时，给出数字才划算。
invalid_if:
  - >-
    Q01 到 Q12 中缺了某道题，或某个答案既不是一个数字，也不是“不知道”。
  - >-
    本难度计分的某个金额答案不是客户取整单位（100、1,000 或 10,000 韩元）的整数倍；除非公司政策允许放宽这条规则，且 AI 事先向客户申请了例外。
  - >-
    本难度计分的某个计数（活跃客户、大促当天订单、新客户）或净收入最高客户的答案，恰好等于把测试账号算进去时的数字（且该数字不是正确答案）。
quality: >-
  本难度计分的每道题，答对得 2，答错得 0，填“不知道”得 0.5、1 或 1.5（由客户决定），总分除以“计分题数 × 2”，全部答对即为 1.0（计数和客户编号须完全一致，金额误差须在 0.5% 或取整单位的一半以内，9 月环比变化须在 0.05 个百分点以内，其余须在 0.5% 以内）。客户原来的做法（记 0 分）是每道题都报“暂无数据”；参考答案（记 1 分）除品类更名外所有口径都用对，所以在 hard 中“食品储藏”那道题会答错或填“不知道”。
tiers:
  easy: >-
    计分五道题：FY2025 净收入（Q01）、活跃客户（Q03）、净收入最高的客户（Q04）、新客户（Q10）和每单件数（Q12）。关键在于哪些订单和账号算数、财年、活跃客户的时间范围和取整。
  medium: >-
    再加六道：第一季度净收入（Q02）、大促当天订单（Q05）、平均客单价（Q07）、退款率（Q08）、平均退款（Q09）和 9 月环比变化（Q11），关键在于净收入、汇率、按韩国时间划分的日期和 10 月的退款。只有“食品储藏”那道题不计分。
  hard: >-
    十二道题全部计分：再加上“食品储藏”净收入（Q06），需要知道“零食”已更名为“食品储藏”。
