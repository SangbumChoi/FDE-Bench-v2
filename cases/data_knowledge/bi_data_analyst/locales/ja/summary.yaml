# The case in plain words, shown at the top of its page.
task: >-
  ソウルにあるコーヒー・お茶の定期便ショップの経営陣から届いた12の質問に注文データベースのエクスポートから答え、質問ごとに数値をひとつ入れた `answers.json` を返します。責任を持って出せない数値は「わからない」とします。回答は次回の取締役会に出す CEO 向けの資料に載り、金額はウォン建てです。
given:
  - >-
    顧客の依頼：「経営陣から質問がいくつか届きました。データベースのエクスポートから回答していただけますでしょうか。…質問ごとに数値をひとつずつお返しください。」数値を決める定義はひとつも書かれておらず、誤った数値がどれだけ損になるかも書かれていません。
  - >-
    `質問一覧.md` と `データ辞書.md`：12の質問（基準日 2026-09-30、金額はウォン）と、テーブルごとのカラム一覧です。
  - >-
    `customers.csv` と `accounts_meta.csv`：韓国・日本・米国の顧客 1,407 人の登録日時（UTC）、プラン、アカウント種別（一般、社員、テスト）です。
  - >-
    `orders.csv`、`order_items.csv`、`payments.csv`、`refunds.csv`：2025年1月〜2026年9月の約 11,000 件の注文のステータス、通貨（KRW、JPY、USD）、税抜・税込の金額と、その明細、決済、返金です（返金額は税込みで、一部は2026年10月に行われています）。
  - >-
    `products.csv` と `fx_rates.csv`：「スナック」と「パントリー」を含む6カテゴリの商品 24 点と、日ごとのドルと円の対ウォンレートです。
ask:
  - >-
    会計年度がいつ始まるか：バージョンによって1月、4月、7月のいずれかです。始まる年の西暦で呼ぶので、FY2025 は2025年1〜12月、2025年4月〜2026年3月、2025年7月〜2026年6月のいずれかになります。
  - >-
    「1日」は韓国時間（UTC+9）の暦日であること：タイムスタンプはすべて UTC で保存されているので、UTC 2026-06-30 16:30 の注文はセール当日の 2026-07-01 の注文です。
  - >-
    どの注文と顧客を数えるか：「完了」の注文だけを数え、キャンセルされた注文や決済に失敗した注文は、決済の記録があっても数えません。テストアカウントはすべての数値から除き、社員アカウントは含めます。
  - >-
    金額の数え方：純売上は税抜金額から税抜の返金額を差し引いたもので、返金は2026年10月の返金も含めて、注文が属する期間から差し引きます。円とドルの金額は注文日のレートでウォンに換算します。
  - >-
    「アクティブ顧客」の意味：2026-09-30 までの直近 30 日、60 日、90 日（バージョンによる）に集計対象の注文がある顧客です。
  - >-
    「パントリー」は 2025-10-01 まで「スナック」だったこと：既存商品はまだ旧ラベルのままなので、パントリーの質問は両方のラベルを含みます（hard でだけ必要です）。
  - >-
    金額の回答の端数処理の単位：バージョンによって 100、1,000、10,000 ウォンのいずれかです。
  - >-
    「わからない」の価値：経理チームは正しい数値を 2、誤った数値を 0、「わからない」（取締役会資料では「集計中」と表示）をバージョンによって 0.5、1、1.5 と見ます。そのため、正しい確率が 25%、50%、75% を超えるときだけ数値を出すほうが得です。
invalid_if:
  - >-
    Q01〜Q12 のどれかが抜けているか、数値1つと「わからない」のどちらでもない回答があります。
  - >-
    この難易度で使う金額の回答が、顧客の端数処理の単位（100、1,000、10,000 ウォン）の整数倍になっていません。ただし、会社の方針がこのルールを緩めることを認めていて、AIが先に顧客に例外を申請した場合は認められます。
  - >-
    この難易度で使う件数（アクティブ顧客、セール当日の注文、新規顧客）や純売上トップの顧客の回答が、テストアカウントを含めて数えた数値と一致します（その数値が正解と異なる場合）。
quality: >-
  この難易度で使う質問ごとに、正しければ 2、誤りなら 0、「わからない」なら 0.5・1・1.5（顧客が決めた値）を得て、合計を1問あたり 2 で割るので、すべて正しければ 1.0 です（件数と顧客 ID は完全一致、金額は 0.5% または端数処理単位の半分以内、9月の変化率は 0.05 ポイント以内、その他は 0.5% 以内で正解）。従来のやり方（0点）はすべての質問を「わからない」（資料では「集計中」）とするものです。模範解答（1点）はパントリーのカテゴリ名変更だけを見落とし、ほかの定義はすべて正しく使います。そのため hard ではパントリーの質問を誤るか「わからない」にします。
tiers:
  easy: >-
    5問を採点します：FY2025 の純売上（Q01）、アクティブ顧客（Q03）、純売上トップの顧客（Q04）、新規顧客（Q10）、注文1件あたりの点数（Q12）。集計対象の注文とアカウント、会計年度、アクティブ顧客の期間、端数処理が鍵です。
  medium: >-
    6問を加えます：第1四半期の純売上（Q02）、セール当日の注文（Q05）、平均注文単価（Q07）、返金率（Q08）、平均返金額（Q09）、9月の変化率（Q11）。純売上、為替レート、韓国時間の日付、10月の返金が鍵で、パントリーの質問だけは採点しません。
  hard: >-
    12問すべてを採点します。スナック → パントリーのカテゴリ名変更を知っている必要があるパントリーの純売上（Q06）が加わります。
