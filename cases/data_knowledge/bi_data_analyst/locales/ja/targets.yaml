- id: fiscal_year
  text: 会計年度は4月1日に始まり、始まる年で呼びます（FY2025 = 2025-04-01〜2026-03-31）。第1四半期は4〜6月、上半期は4〜9月です。
- id: local_day
  text: タイムスタンプは UTC で保存されていますが、日・月・四半期・会計年度は韓国時間（UTC+9）で区切ります。日付を取る前に9時間を足します。
- id: test_accounts
  text: accounts_meta の account_type が「テスト」の顧客は QA 用アカウントで、すべての数値から除外します。「社員」アカウントは含めます。
- id: counted_orders
  text: 「完了」の注文だけを数えます。「キャンセル」と「決済失敗」の注文は、payments.csv に決済行があっても含めません。
- id: net_revenue
  text: 純売上 = 注文の subtotal（税抜）− 税抜返金額（返金額 × subtotal / total）で、注文日の期間に計上します。基準日より後に行われた返金（エクスポートの 2026-10-31 まで）も含みます。カテゴリ別では返金を行金額の比率で按分します。
- id: fx_order_date
  text: 金額は注文通貨で保存されており、注文日（韓国時間）の fx_rates の krw_per_unit でウォンに換算します。返金も注文と同じレートを使います。
- id: active_customer
  text: アクティブ顧客とは、基準日で終わる90日間（2026-07-03〜2026-09-30）に完了注文が1件以上ある顧客です。
- id: category_rename
  text: 「スナック」カテゴリは 2025-10-01 に「パントリー」へ名称変更され、既存商品は旧ラベルのままです。「パントリー」の質問には両方のラベルを含めます。
- id: report_rounding
  text: 経理の方針で、金額の回答はすべて千ウォン単位に四捨五入します。回答は正確な値と比較されます（件数・ID は完全一致、金額は 0.5% または 500 ウォン以内、前月比は 0.05 ポイント以内、その他は 0.5% 以内）。
