- id: fiscal_year
  text: 会計年度は{{fy_start}}1日に始まります。
- id: fy_naming
  text: 会計年度は始まる年で呼びます。FY2025 = {{fy2025}}、FY2026 の第1四半期は {{fy2026_q1}}、上半期は {{fy2026_h1}} です。
- id: running_period
  text: 基準日にまだ終わっていない期間には、まだ数値がありません。その質問には基準日までの数値ではなく null（「集計中」）で答えます。経理の慣行であり、CFO が現時点までの数値を承認することはできます。
- id: local_day
  text: タイムスタンプは UTC で保存されていますが、日・月・四半期・会計年度は韓国時間（UTC+9）で区切ります。日付を取る前に9時間を足します。
- id: test_accounts
  text: accounts_meta の account_type が「テスト」の顧客は QA 用アカウントで、すべての数値から除外します。「社員」アカウントは実際のお客様なので含めます。
- id: counted_orders
  text: 「完了」の注文だけを数えます。「キャンセル」と「決済失敗」の注文は、payments.csv に決済行があっても含めません。
- id: revenue_ex_tax
  text: 純売上は税抜きです。注文の subtotal（税抜）から、その注文の返金額の税抜部分（返金額 × subtotal / total）を差し引きます。
- id: refund_period
  text: 返金は返金日ではなく、その注文の注文日が属する期間の売上から差し引きます。
- id: late_refunds
  text: エクスポートは 2026-10-31 に取得したもので、それまでに記録された返金をすべて含みます。基準日より後（2026年10月）に行われた返金も、注文が属する期間から差し引きます。
- id: fx_order_date
  text: 金額は注文通貨で保存されており、注文日（韓国時間）の fx_rates の krw_per_unit でウォンに換算します。
- id: active_customer
  text: アクティブ顧客とは、基準日で終わる{{active_days}}日間（{{active_from}}〜2026-09-30）に完了注文が1件以上ある顧客です。
- id: category_rename
  text: 「スナック」カテゴリは 2025-10-01 に「パントリー」へ名称変更され、既存商品は旧ラベルのままです。「パントリー」の質問には両方のラベルを含めます。
- id: report_rounding
  text: 金額の回答はすべて {{rounding_unit}} ウォン単位に四捨五入します。
