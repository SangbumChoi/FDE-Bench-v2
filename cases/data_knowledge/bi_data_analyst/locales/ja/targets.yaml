- id: fiscal_year
  text: 会計年度は{{fy_start}}1日に始まり、始まる年で呼びます（FY2025 = {{fy2025}}）。FY2026 の第1四半期は {{fy2026_q1}}、上半期は {{fy2026_h1}} で、基準日にまだ終わっていない期間は基準日までで集計します。
- id: local_day
  text: タイムスタンプは UTC で保存されていますが、日・月・四半期・会計年度は韓国時間（UTC+9）で区切ります。日付を取る前に9時間を足します。
- id: test_accounts
  text: accounts_meta の account_type が「テスト」の顧客は QA 用アカウントで、すべての数値から除外します。「社員」アカウントは含めます。
- id: counted_orders
  text: 「完了」の注文だけを数えます。「キャンセル」と「決済失敗」の注文は、payments.csv に決済行があっても含めません。
- id: net_revenue
  text: 純売上 = 注文の subtotal（税抜）− 税抜返金額（返金額 × subtotal / total）で、返金日ではなく注文日の期間に計上します。
- id: late_refunds
  text: エクスポートは 2026-10-31 に取得したもので、それまでに記録された返金をすべて含みます。基準日より後（2026年10月）に行われた返金も、注文が属する期間から差し引きます。
- id: fx_order_date
  text: 金額は注文通貨で保存されており、注文日（韓国時間）の fx_rates の krw_per_unit でウォンに換算します。返金も注文と同じレートを使います。
- id: active_customer
  text: アクティブ顧客とは、基準日で終わる{{active_days}}日間（{{active_from}}〜2026-09-30）に完了注文が1件以上ある顧客です。
- id: category_rename
  text: 「スナック」カテゴリは 2025-10-01 に「パントリー」へ名称変更され、既存商品は旧ラベルのままです。「パントリー」の質問には両方のラベルを含め、注文の返金は行金額の比率で按分します。
- id: report_rounding
  text: 経理の方針で、金額の回答はすべて {{rounding_unit}} ウォン単位に四捨五入します。回答は正確な値と比較されます（件数・ID は完全一致、金額は 0.5% または端数処理単位の半分以内、前月比は 0.05 ポイント以内、その他は 0.5% 以内）。
- id: answer_rewards
  text: 回答は CEO の取締役会資料に載り、null（「集計中」）も回答として受け付けます。経理チームの見る価値は、正しい数値 {{right_reward}}、null {{dont_know_reward}}、誤った数値 {{wrong_reward}} です。
