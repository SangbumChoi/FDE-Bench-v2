# The explainer's case texts in Japanese (English comes from case.yaml).
role: BI データアナリスト
task_type: データ分析
deliverable_spec: |
  answers.json = {"Q01": <数値または null>, "Q02": <数値または null>, ..., "Q12": <数値または null>}
  質問一覧のすべての質問番号（Q01..Q12）がキーです。値は JSON の数値ひとつで、エンジニアがその質問に数値を出さなかった場合（「わからない」「集計中」）は null です。
  金額はウォン（KRW）、割合はパーセント（例: 4.25% なら 4.25）、顧客 ID は数値の customer_id です。
tiers:
  easy: >-
    中核となる慣行についての7問（Q01、Q03、Q04、Q05、Q07、Q10、Q12）：どの注文を集計するか、テストアカウントの除外と社員アカウントの算入、会計年度とその呼び方、まだ終わっていない期間、韓国時間の日付、アクティブ顧客の期間、金額の端数処理。Q01、Q04、Q07 は純売上と為替レートの定義にも左右されます。残りの5問は今回は不要です。
  medium: >-
    easy に、返金を計上する期間と、9月の注文に対する10月の返金で答えが決まる4問（Q02、Q08、Q09、Q11）を加えます。「パントリー」の質問（Q06）は今回は不要です。
  hard: >-
    全12問：medium に「パントリー」の純売上（Q06）を加えます。この質問に答えるには、スナック → パントリーのカテゴリ名変更を知っている必要があります。
rules:
  answer_format: >-
    Q01..Q12 のすべての質問番号が answers.json にあり、それぞれ有限の JSON 数値ひとつまたは null です（null は「わからない」を意味します）。
  exclude_test_accounts: >-
    テストアカウント（accounts_meta の account_type = テスト）はすべての数値から除外します。今回使う件数や顧客 ID の回答（Q03、Q04、Q05、Q10）が、テストアカウントを含めた数値と一致し、かつテストアカウントを除いたどの集計方法でもその数値にならないときは、経理の方針違反です。
  report_rounding: >-
    今回使うすべての金額（Q01、Q02、Q06、Q07、Q09）は、取締役会資料の表の単位である {{rounding_unit}} ウォン単位に四捨五入して報告します。
  running_period: >-
    今回使う質問のうち、基準日に期間がまだ終わっていないものは、現時点までの数値ではなく null（「集計中」）で答えます。経理の慣行であり、CFO が例外を承認した場合は現時点までの数値で評価します。
shortcuts:
  all_null: >-
    誤った数値が出ないよう、すべての質問を「集計中」（null）にします
  face_value: >-
    エクスポートを見たままに集計します（暦年、UTC の日付、すべての注文行、税込金額、最新のレート）。2つのルールは守ります：金額は顧客の単位に丸め、期間が終わっていない質問は null にします
  literal_rounded: >-
    依頼を文字どおりに行った回答に、端数処理のルールだけを守らせたもの：金額を顧客の単位に丸めます
  literal_running_null: >-
    依頼を文字どおりに行った回答に、進行中の期間の慣行だけを守らせたもの：顧客の基準で期間が終わっていない質問は null、金額は1ウォン単位です
  literal_valid: >-
    依頼を文字どおりに行った回答に、すべてのルールを守らせたもの：金額は顧客の単位に丸め、期間が終わっていない質問は null にします
  no_money: >-
    端数処理のルールを避けます：金額の質問はすべて null にし、件数・顧客・割合だけを最も自然な読み方で答えます
  dated_only: >-
    会計年度を避けます：日付が決まっている質問（アクティブ顧客、セール当日、9月と8月の比較）だけに答え、残りは null にします
  one_safe_answer: >-
    すべて null の回答をひとつだけ変えたもの：会計年度が変わってもほとんど動かない注文1件あたりの点数（Q12）だけに答えます
  data_only: >-
    顧客に尋ねなくてもエクスポートだけで決まるものだけに答えます（タイムスタンプから読み取れる韓国時間の日付で数えたセール当日の注文件数と9月の前月比、それに注文1件あたりの点数）。残りは null にします
  literal_local_days: >-
    依頼を文字どおりに行った回答で、日付だけをエクスポートから読み取り（韓国時間：セール当日の注文は前日の UTC 15時から集中します）、すべてのルールを守らせたもの：金額は顧客の単位に丸め、期間が終わっていない質問は null にします
  strictest_rules: >-
    パラメータをひとつも知らないまま、すべてのルールを守ります：依頼を文字どおりに行った回答の金額を1万ウォン単位（どの単位の倍数でもあります）に丸め、FY2026 を尋ねる2問（Q02、Q07）は期間が終わっていないかもしれないので null にします
