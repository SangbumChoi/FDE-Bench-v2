# The explainer's case texts in Japanese (English comes from case.yaml).
role: BI データアナリスト
task_type: データ分析
deliverable_spec: |
  answers.json = {"Q01": <数値または null>, "Q02": <数値または null>, ..., "Q12": <数値または null>}
  質問一覧のすべての質問番号（Q01..Q12）がキーです。値は JSON の数値ひとつで、エンジニアがその質問に数値を出さなかった場合（「わからない」「集計中」）は null です。
  金額はウォン（KRW）、割合はパーセント（例: 4.25% なら 4.25）、顧客 ID は数値の customer_id です。
tiers:
  easy: >-
    中核となる慣行についての5問（Q01、Q03、Q04、Q10、Q12）：どの注文を集計するか、テストアカウントの除外と社員アカウントの算入、会計年度、アクティブ顧客の期間、金額の端数処理。Q01 と Q04 は純売上と為替レートの定義にも左右されます。残りの7問は今回は不要です。
  medium: >-
    easy に、純売上・注文日の為替レート・韓国時間の日付で答えが決まる6問（Q02、Q05、Q07、Q08、Q09、Q11）を加えます。9月の注文に対する10月の返金もここに含まれます（Q11、ルールセット B では Q02 も）。「パントリー」の質問（Q06）は今回は不要です。
  hard: >-
    全12問：medium に「パントリー」の純売上（Q06）を加えます。この質問にはスナック → パントリーのカテゴリ名変更を知っている必要があります。
rules:
  answer_format: >-
    Q01..Q12 のすべての質問番号が answers.json にあり、それぞれ有限の JSON 数値ひとつまたは null です（null は「わからない」を意味します）。
  exclude_test_accounts: >-
    テストアカウント（accounts_meta の account_type = テスト）はすべての数値から除外します。今回使う件数や顧客 ID の回答（Q03、Q04、Q05、Q10）が、テストアカウントを含めた数値と一致し、かつその数値が含めない場合の数値と異なるときは、経理の方針違反です。
  report_rounding: >-
    今回使うすべての金額（Q01、Q02、Q06、Q07、Q09）は {{rounding_unit}} ウォン単位に四捨五入して報告します。
