# The case in plain words, shown at the top of its page.
task: >-
  Answer twelve questions from the managers of a Seoul coffee-and-tea subscription shop using its order database
  export, and send back `answers.json` with one number per question, or "don't know" where the AI cannot stand behind
  a figure. The answers go into the CEO's pack for the next board meeting; money is in Korean won.
given:
  - >-
    The client's request: "Our managers sent these questions. Can you answer them from the database export? … please
    send back one number per question." It gives none of the definitions behind the numbers and does not say what a
    wrong figure costs.
  - >-
    `questions.md` and `data_dictionary.md`: the twelve questions (reference date 2026-09-30, money in KRW) and the
    columns of each table.
  - >-
    `customers.csv` and `accounts_meta.csv`: 1,407 customers in Korea, Japan and the US, with sign-up time (in UTC),
    plan and account type (regular, staff or test).
  - >-
    `orders.csv`, `order_items.csv`, `payments.csv` and `refunds.csv`: about 11,000 orders from January 2025 to
    September 2026 with status, currency (KRW, JPY or USD) and amounts before and after tax, their lines, their
    payments and their refunds (refund amounts include tax; some were made in October 2026).
  - >-
    `products.csv` and `fx_rates.csv`: 24 products in six categories, "snacks" and "pantry" among them, and the won
    rate of the dollar and the yen for every day.
ask:
  - >-
    When the fiscal year starts: January, April or July, depending on the version. A year is named after the year it
    starts in, so FY2025 is January–December 2025, April 2025–March 2026 or July 2025–June 2026.
  - >-
    That a "day" is a calendar day in Korea time (UTC+9), although every timestamp is stored in UTC: an order at
    2026-06-30 16:30 UTC falls on 2026-07-01, the sale day.
  - >-
    Which orders and customers count: only completed orders (a cancelled or failed order does not, even when a payment
    was recorded); test accounts are left out of every figure, staff accounts stay in.
  - >-
    How money is counted: net revenue is the amount before tax minus refunds without their tax, booked in the period
    of the order, refunds made in October 2026 included; yen and dollar amounts convert at the rate of the order's day.
  - >-
    What an "active customer" is: one with a counted order in the last 30, 60 or 90 days up to 2026-09-30, depending
    on the version.
  - >-
    That "pantry" was called "snacks" until 2025-10-01 and older products still carry the old label, so a pantry
    question covers both (needed only on hard).
  - >-
    How money answers are rounded: to the nearest 100, 1,000 or 10,000 won, depending on the version.
  - >-
    What a "don't know" is worth: finance counts a right figure as 2, a wrong one as 0 and a "don't know" (shown as
    "not available yet" in the board pack) as 0.5, 1 or 1.5, depending on the version, so a figure is worth giving
    only when the AI is more than 25%, 50% or 75% sure of it.
invalid_if:
  - >-
    Leaves out a question from Q01 to Q12, or answers one with anything other than one number or "don't know".
  - >-
    Gives a money answer that counts at this difficulty and is not a whole multiple of the rounding unit (100, 1,000
    or 10,000 won), unless the company policy lets this rule bend and the AI asked the client for an exception first.
  - >-
    Gives, for a count (active customers, sale-day orders, new customers) or the top customer that counts at this
    difficulty, the figure with the test accounts kept in, where that differs from the right one.
quality: >-
  Higher is better: each question that counts earns 2 if right, 0 if wrong and 0.5, 1 or 1.5 for "don't know"
  (depending on the version), and the total is divided by 2 per question, so 1.0 means all right. Counts and the
  customer id must match exactly; money must be within 0.5% or half the rounding unit, the September change within
  0.05 percentage points, the rest within 0.5%. The client's own way (score 0) is "not available yet" for every
  question; the reference solution (score 1) gets every definition right except the pantry rename, so on hard it gets
  the pantry question wrong or leaves it as "don't know".
tiers:
  easy: >-
    Five questions count: FY2025 net revenue (Q01), active customers (Q03), top customer (Q04), new customers (Q10)
    and units per order (Q12). They turn on which orders and accounts count, the fiscal year, the active window and
    the rounding.
  medium: >-
    Adds six: first-quarter revenue (Q02), sale-day orders (Q05), average order value (Q07), refund rate (Q08),
    average refund (Q09) and the September change (Q11), which turn on net revenue, exchange rates, Korea-time days
    and the October refunds. Only the pantry question does not count.
  hard: >-
    All twelve count: adds the pantry revenue (Q06), which needs the snacks-to-pantry rename.
