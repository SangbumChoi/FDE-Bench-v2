- id: fiscal_year
  kind: missing
  domain: business rule
  param: fy_start
  text: "The fiscal year starts on {{fy_start}} 1."
- id: fy_naming
  kind: ambiguous
  domain: business rule
  text: "A fiscal year is named after the calendar year it starts in: FY2025 = {{fy2025}}, the first quarter of FY2026 is {{fy2026_q1}} and its first half {{fy2026_h1}}."
- id: running_period
  kind: missing
  domain: business rule
  when: {fy_start: [7, 9]}
  text: "A period still running on the reference date has no figure yet: its question is answered null (\"not available yet\"), not with the figure to date. This is finance's habit; the CFO can approve a figure to date."
- id: local_day
  kind: ambiguous
  domain: data semantics
  text: Timestamps are stored in UTC, but days, months, quarters and fiscal years are decided in Korea time (UTC+9); add 9 hours before taking the date.
- id: test_accounts
  kind: missing
  domain: business rule
  text: Customers with account_type test in accounts_meta are QA accounts and are excluded from every figure; staff accounts are real customers and stay in.
- id: counted_orders
  kind: ambiguous
  domain: data semantics
  text: Only completed orders count; cancelled and payment_failed orders never count, even when payments.csv has a payment row for them.
- id: revenue_ex_tax
  kind: ambiguous
  domain: calculation
  text: "Net revenue excludes tax: the order subtotal (before tax) minus the tax-free part of its refunds (refund amount × subtotal / total)."
- id: refund_period
  kind: ambiguous
  domain: calculation
  tiers: [medium, hard]
  text: A refund reduces the revenue of the period in which its order was placed, not the period of the refund.
- id: late_refunds
  kind: ambiguous
  domain: data semantics
  tiers: [medium, hard]
  text: The export was taken on 2026-10-31 with every refund recorded until then; refunds made after the reference date (October 2026) count too, against their order's period.
- id: fx_order_date
  kind: missing
  domain: calculation
  text: Amounts are in the order currency and are converted to KRW at the fx_rates krw_per_unit of the order's date (Korea time).
- id: active_customer
  kind: ambiguous
  domain: business rule
  param: active_days
  text: "An active customer has at least one completed order dated within the {{active_days}} days ending on the reference date ({{active_from}} to 2026-09-30)."
- id: category_rename
  kind: missing
  domain: data semantics
  tiers: [hard]
  text: The snacks category was renamed pantry on 2025-10-01 and older products still carry the old label; a question about pantry covers both labels.
- id: report_rounding
  kind: missing
  domain: business rule
  param: rounding_unit
  text: "Every money answer is rounded to the nearest {{rounding_unit}} KRW."
