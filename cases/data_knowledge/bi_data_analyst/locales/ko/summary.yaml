# The case in plain words, shown at the top of its page.
task: >-
  서울의 커피·차 구독 쇼핑몰 경영진이 보낸 질문 열두 개에 주문 데이터베이스 추출본으로 답하고, 질문마다 숫자 하나를
  담은 `answers.json`을 돌려줍니다. 자신 있게 낼 수 없는 수치는 '모름'으로 둡니다. 답은 다음 이사회에 올라가는 CEO
  보고 자료에 들어가며, 금액은 원화 기준입니다.
given:
  - >-
    고객의 요청: "경영진이 질문을 몇 가지 보내왔습니다. 데이터베이스 추출본으로 답을 내 주실 수 있을까요? … 질문마다
    숫자 하나씩 주시면 됩니다." 숫자를 정하는 정의는 하나도 없고, 틀린 수치가 얼마나 손해인지도 말하지 않습니다.
  - >-
    `질문목록.md`와 `데이터사전.md`: 질문 열두 개(기준일 2026-09-30, 금액은 원화)와 테이블별 컬럼 목록입니다.
  - >-
    `customers.csv`와 `accounts_meta.csv`: 한국·일본·미국 고객 1,407명의 가입 시각(UTC), 플랜, 계정 유형(일반, 직원,
    테스트)입니다.
  - >-
    `orders.csv`, `order_items.csv`, `payments.csv`, `refunds.csv`: 2025년 1월~2026년 9월 주문 약 11,000건의 상태,
    통화(KRW, JPY, USD), 세전·세후 금액과 주문 행, 결제, 환불입니다(환불액은 세금 포함이고, 일부는 2026년 10월에
    처리되었습니다).
  - >-
    `products.csv`와 `fx_rates.csv`: '스낵'과 '팬트리'를 포함한 6개 카테고리의 상품 24개와, 날짜별 달러·엔의 원화
    환율입니다.
ask:
  - >-
    회계연도가 언제 시작하는지: 버전에 따라 1월, 4월 또는 7월입니다. 시작하는 해의 연도로 부르므로 FY2025는 2025년
    1~12월, 2025년 4월~2026년 3월, 2025년 7월~2026년 6월 중 하나입니다.
  - >-
    '하루'가 한국 시간(UTC+9)의 날짜라는 것: 타임스탬프는 모두 UTC로 저장되어 있어서, UTC 2026-06-30 16:30 주문은
    세일 당일인 2026-07-01 주문입니다.
  - >-
    어떤 주문과 고객을 세는지: '완료' 주문만 세고, 결제 기록이 있어도 취소되거나 결제에 실패한 주문은 세지 않습니다. 테스트 계정은 모든
    수치에서 빼고, 직원 계정은 포함합니다.
  - >-
    금액을 세는 방법: 순매출은 세전 금액에서 세금을 뺀 환불액을 차감한 것이고, 환불은 2026년 10월 환불까지 포함해
    주문이 속한 기간에서 뺍니다. 엔·달러 금액은 주문일의 환율로 원화 환산합니다.
  - >-
    '활성 고객'의 뜻: 2026-09-30까지 최근 30일, 60일 또는 90일(버전에 따라 다름) 안에 집계 대상 주문이 있는
    고객입니다.
  - >-
    '팬트리'가 2025-10-01까지 '스낵'이었다는 것: 기존 상품은 아직 옛 라벨이라서 팬트리 질문은 두 라벨을 모두
    포함합니다(hard에서만 필요합니다).
  - >-
    금액 답의 반올림 단위: 버전에 따라 100원, 1,000원 또는 10,000원입니다.
  - >-
    '모름'의 가치: 재무팀은 맞는 수치를 2, 틀린 수치를 0, '모름'(이사회 자료에는 '아직 확인 중'으로 표시)을 버전에
    따라 0.5, 1 또는 1.5로 칩니다. 그래서 맞을 확률이 25%, 50%, 75%를 넘을 때만 수치를 내는 편이 낫습니다.
invalid_if:
  - >-
    Q01~Q12 중 빠진 질문이 있거나, 숫자 하나도 '모름'도 아닌 답이 있습니다.
  - >-
    이번 난이도에서 채점하는 금액 답이 고객의 반올림 단위(100원, 1,000원 또는 10,000원)의 정수배가 아닙니다. 단, 회사 정책이 예외를 허용하고 AI가 먼저 고객에게 예외를 요청했다면 위반으로 보지 않습니다.
  - >-
    이번 난이도에서 채점하는 건수(활성 고객, 세일 당일 주문, 신규 고객)나 순매출 1위 고객 답이 테스트 계정을 포함해 센
    수치와 같습니다(그 수치가 맞는 답과 다를 때).
quality: >-
  이번 난이도에서 채점하는 질문마다 맞으면 2, 틀리면 0, '모름'이면 0.5·1·1.5(고객이 정한 값)를 받고, 합계를 질문당 2로
  나누므로 모두 맞히면 1.0입니다(건수와 고객 ID는 정확히 일치해야 하고, 금액은 0.5% 또는 반올림 단위의 절반 이내, 9월
  변화율은 0.05%포인트 이내, 나머지는 0.5% 이내면 맞은 것으로 봅니다). 기존 방식(0점)은 모든 질문을 '아직 확인 중'으로 내는 것이고, 모범
  답안(1점)은 팬트리 카테고리명 변경만 놓치고 나머지 정의는 모두 맞게 쓰므로, hard에서는 팬트리 질문을 틀리거나
  '모름'으로 둡니다.
tiers:
  easy: >-
    질문 다섯 개를 채점합니다: FY2025 순매출(Q01), 활성 고객(Q03), 순매출 1위 고객(Q04), 신규 고객(Q10), 주문당
    수량(Q12). 집계 대상 주문과 계정, 회계연도, 활성 고객 기간, 반올림이 관건입니다.
  medium: >-
    여섯 개를 더합니다: 1분기 순매출(Q02), 세일 당일 주문(Q05), 평균 주문 금액(Q07), 환불률(Q08), 평균
    환불액(Q09), 9월 변화율(Q11). 순매출, 환율, 한국 시간 날짜, 10월 환불이 관건이며, 팬트리 질문만 채점하지
    않습니다.
  hard: >-
    열두 질문을 모두 채점합니다. 스낵 → 팬트리 카테고리명 변경을 알아야 하는 팬트리 순매출(Q06)이 더해집니다.
