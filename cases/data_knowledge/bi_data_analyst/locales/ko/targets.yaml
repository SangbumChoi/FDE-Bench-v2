- id: fiscal_year
  text: 회계연도는 4월 1일에 시작하고 시작 연도로 부릅니다(FY2025 = 2025-04-01 ~ 2026-03-31). 1분기는 4~6월, 상반기는 4~9월입니다.
- id: local_day
  text: 타임스탬프는 UTC로 저장되지만 일·월·분기·회계연도는 한국 시간(UTC+9) 기준입니다. 날짜를 잡기 전에 9시간을 더합니다.
- id: test_accounts
  text: accounts_meta의 account_type이 '테스트'인 고객은 QA 계정으로 모든 수치에서 제외해야 하며, '직원' 계정은 포함합니다.
- id: counted_orders
  text: "'완료' 주문만 집계합니다. '취소'와 '결제실패' 주문은 payments.csv에 결제 행이 있어도 포함하지 않습니다."
- id: net_revenue
  text: 순매출 = 주문 subtotal(세전) − 세금 제외 환불액(환불 금액 × subtotal / total)이며, 주문일이 속한 기간에 반영합니다. 기준일 이후에 처리된 환불(추출일 2026-10-31까지)도 포함합니다. 카테고리별로는 환불액을 행 금액 비율로 나눕니다.
- id: fx_order_date
  text: 금액은 주문 통화로 저장되어 있고, 주문일(한국 시간)의 fx_rates krw_per_unit으로 원화 환산합니다. 환불도 해당 주문과 같은 환율을 씁니다.
- id: active_customer
  text: 활성 고객은 기준일로 끝나는 90일(2026-07-03 ~ 2026-09-30)에 완료 주문이 한 건 이상 있는 고객입니다.
- id: category_rename
  text: "'스낵' 카테고리는 2025-10-01에 '팬트리'로 이름이 바뀌었고 기존 상품은 옛 라벨 그대로입니다. '팬트리' 질문에는 두 라벨을 모두 포함합니다."
- id: report_rounding
  text: 재무 정책상 모든 금액 답은 천 원 단위로 반올림해야 합니다. 답은 정확한 값과 비교합니다(건수·ID는 정확히 일치, 금액은 0.5% 또는 500원 이내, 전월 대비 변화는 0.05%포인트 이내, 나머지는 0.5% 이내).
