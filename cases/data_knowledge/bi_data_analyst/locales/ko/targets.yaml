- id: fiscal_year
  text: 회계연도는 {{fy_start}} 1일에 시작합니다.
- id: fy_naming
  text: 회계연도는 시작하는 해의 연도로 부릅니다. FY2025 = {{fy2025}}, FY2026 1분기는 {{fy2026_q1}}, 상반기는 {{fy2026_h1}}입니다.
- id: running_period
  text: 기준일에 아직 진행 중인 기간에는 아직 수치가 없습니다. 해당 질문은 기준일까지의 수치가 아니라 null('아직 확인 중')로 답합니다. 재무팀의 관행이며, CFO가 현재까지의 수치를 승인할 수 있습니다.
- id: local_day
  text: 타임스탬프는 UTC로 저장되지만 일·월·분기·회계연도는 한국 시간(UTC+9) 기준입니다. 날짜를 잡기 전에 9시간을 더합니다.
- id: test_accounts
  text: accounts_meta의 account_type이 '테스트'인 고객은 QA 계정으로 모든 수치에서 제외하며, '직원' 계정은 실제 고객이므로 포함합니다.
- id: counted_orders
  text: "'완료' 주문만 집계합니다. '취소'와 '결제실패' 주문은 payments.csv에 결제 행이 있어도 포함하지 않습니다."
- id: revenue_ex_tax
  text: 순매출은 세금을 제외합니다. 주문 subtotal(세전)에서 그 주문 환불액의 세금 제외분(환불 금액 × subtotal / total)을 뺍니다.
- id: refund_period
  text: 환불은 환불일이 아니라 그 주문의 주문일이 속한 기간의 매출에서 차감합니다.
- id: late_refunds
  text: 추출본은 2026-10-31에 뽑은 것으로 그때까지 기록된 환불을 모두 담고 있습니다. 기준일 이후(2026년 10월)에 처리된 환불도 주문이 속한 기간에서 차감합니다.
- id: fx_order_date
  text: 금액은 주문 통화로 저장되어 있고, 주문일(한국 시간)의 fx_rates krw_per_unit으로 원화 환산합니다.
- id: active_customer
  text: 활성 고객은 기준일로 끝나는 {{active_days}}일({{active_from}} ~ 2026-09-30)에 완료 주문이 한 건 이상 있는 고객입니다.
- id: category_rename
  text: "'스낵' 카테고리는 2025-10-01에 '팬트리'로 이름이 바뀌었고 기존 상품은 옛 라벨 그대로입니다. '팬트리' 질문에는 두 라벨을 모두 포함합니다."
- id: report_rounding
  text: 모든 금액 답은 {{rounding_unit}}원 단위로 반올림합니다.
