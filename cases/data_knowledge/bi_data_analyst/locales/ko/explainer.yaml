# The explainer's case texts in Korean (English comes from case.yaml).
role: BI 데이터 분석가
task_type: 데이터 분석
deliverable_spec: |
  answers.json = {"Q01": <숫자 또는 null>, "Q02": <숫자 또는 null>, ..., "Q12": <숫자 또는 null>}
  질문 목록의 모든 질문 번호(Q01..Q12)가 키입니다. 값은 JSON 숫자 하나이며, 엔지니어가 그 질문에 수치를 내지
  않은 경우("모름", "아직 확인 중")에는 null입니다. 금액은 원화(KRW), 비율은 퍼센트(예: 4.25%는 4.25), 고객 ID는
  숫자 customer_id로 씁니다.
tiers:
  easy: >-
    핵심 관행을 묻는 질문 다섯 개(Q01, Q03, Q04, Q10, Q12): 어떤 주문을 집계하는지, 테스트 계정 제외와 직원 계정
    포함, 회계연도, 활성 고객 기간, 금액 반올림. Q01과 Q04는 순매출과 환율 정의에도 달려 있습니다. 나머지 일곱
    질문은 이번 차수에 필요 없습니다.
  medium: >-
    easy에 순매출, 주문일 환율, 한국 시간 날짜가 좌우하는 질문 여섯 개(Q02, Q05, Q07, Q08, Q09, Q11)를 더합니다.
    9월 주문의 10월 환불도 여기에 들어갑니다(Q11, 그리고 회계연도가 7월에 시작하면 Q02). '팬트리' 질문(Q06)은
    이번 차수에 필요 없습니다.
  hard: >-
    열두 질문 전부: medium에 '팬트리' 순매출(Q06)을 더하며, 이 질문에는 스낵 → 팬트리 카테고리명 변경을 알아야
    합니다.
rules:
  answer_format: >-
    Q01..Q12 모든 질문 번호가 answers.json에 있고, 각각 유한한 JSON 숫자 하나 또는 null입니다(null은 "모름"을
    뜻합니다).
  exclude_test_accounts: >-
    테스트 계정(accounts_meta의 account_type = 테스트)은 모든 수치에서 제외합니다. 이번 차수에 쓰는 건수나 고객 ID
    답(Q03, Q04, Q05, Q10)이 테스트 계정을 포함한 수치와 같고 그 수치가 테스트 계정을 뺀 수치와 다르면 재무 정책
    위반입니다.
  report_rounding: >-
    이번 차수에 쓰는 모든 금액(Q01, Q02, Q06, Q07, Q09)은 {{rounding_unit}}원 단위로 반올림해 보고합니다.
