- id: fiscal_year
  kind: missing
  domain: business rule
  text: 财年从 1 月 1 日开始，以开始那一年命名（FY2025 = 2025-01-01 至 2025-12-31）；FY2026 第一季度为 2026-01-01 至 2026-03-31，上半年为
    2026-01-01 至 2026-06-30，到基准日期仍未结束的期间统计到基准日期为止。
- id: local_day
  kind: ambiguous
  domain: data semantics
  text: 时间戳以 UTC 存储，但日、月、季度和财年都按韩国时间（UTC+9）划分；取日期前先加 9 小时。
- id: test_accounts
  kind: missing
  domain: business rule
  text: accounts_meta 中 account_type 为“测试”的客户是 QA 账号，所有数字都必须排除；“员工”账号保留。
- id: counted_orders
  kind: ambiguous
  domain: data semantics
  text: 只有“已完成”的订单才算；“已取消”和“支付失败”的订单一律不算，即使 payments.csv 里有付款记录。
- id: net_revenue
  kind: ambiguous
  domain: calculation
  text: 净收入 = 订单 subtotal（税前）减去不含税退款（退款金额 × subtotal / total），计入下单日期所在期间，而不是退款日期所在期间。
- id: late_refunds
  kind: ambiguous
  domain: data semantics
  text: 导出数据取于 2026-10-31，包含截至那时记录的全部退款；基准日期之后（2026 年 10 月）办理的退款也要算，冲减其订单所在期间的收入。
- id: fx_order_date
  kind: missing
  domain: calculation
  text: 金额以订单币种存储，按订单日期（韩国时间）的 fx_rates 中 krw_per_unit 换算成韩元；退款使用其订单的同一汇率。
- id: active_customer
  kind: ambiguous
  domain: business rule
  text: 活跃客户是在截至基准日期的 60 天内（2026-08-02 至 2026-09-30）至少有一笔已完成订单的客户。
- id: report_rounding
  kind: missing
  domain: scoring
  text: 财务要求所有金额答案四舍五入为 100 韩元的整数倍；答案与精确值比较（计数和编号须完全一致，金额在 0.5% 或取整单位一半以内，环比变化在 0.05 个百分点以内，其他在 0.5% 以内）。
- id: answer_rewards
  kind: missing
  domain: business rule
  text: 答案会放进 CEO 的董事会材料，null（“暂无数据”）也是可以接受的答案；在财务部看来，正确的数字价值 2，null 价值 1，错误的数字价值 0。
