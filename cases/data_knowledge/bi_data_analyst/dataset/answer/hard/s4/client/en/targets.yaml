- id: fiscal_year
  kind: missing
  domain: business rule
  text: The fiscal year starts on January 1 and is named after the year it starts in (FY2025 = 2025-01-01
    to 2025-12-31); the first quarter of FY2026 is 2026-01-01 to 2026-03-31 and its first half 2026-01-01
    to 2026-06-30, a period still running on the reference date counted up to it.
- id: local_day
  kind: ambiguous
  domain: data semantics
  text: Timestamps are stored in UTC, but days, months, quarters and fiscal years are decided in Korea
    time (UTC+9); add 9 hours before taking the date.
- id: test_accounts
  kind: missing
  domain: business rule
  text: Customers with account_type test in accounts_meta are QA accounts and must be excluded from every
    figure; staff accounts stay in.
- id: counted_orders
  kind: ambiguous
  domain: data semantics
  text: Only completed orders count; cancelled and payment_failed orders never count, even when payments.csv
    has a payment row for them.
- id: net_revenue
  kind: ambiguous
  domain: calculation
  text: Net revenue = order subtotal (before tax) minus refunds without tax (refund amount × subtotal
    / total), booked in the period of the order date, not of the refund.
- id: late_refunds
  kind: ambiguous
  domain: data semantics
  text: The export was taken on 2026-10-31 with every refund recorded until then; refunds made after the
    reference date (October 2026) count too, against their order's period.
- id: fx_order_date
  kind: missing
  domain: calculation
  text: Amounts are in the order currency and are converted to KRW at the fx_rates krw_per_unit of the
    order's date (Korea time); refunds use the same rate as their order.
- id: active_customer
  kind: ambiguous
  domain: business rule
  text: An active customer has at least one completed order dated within the 60 days ending on the reference
    date (2026-08-02 to 2026-09-30).
- id: category_rename
  kind: missing
  domain: data semantics
  text: The snacks category was renamed pantry on 2025-10-01 and older products still carry the old label;
    questions about pantry include both labels, with each order's refunds spread over its lines pro rata.
- id: report_rounding
  kind: missing
  domain: scoring
  text: Finance requires every money answer rounded to the nearest 100 KRW; answers are checked against
    exact figures (counts and ids exact, money within 0.5 % or half the rounding unit, the month-on-month
    change within 0.05 percentage points, others within 0.5 %).
- id: answer_rewards
  kind: missing
  domain: business rule
  text: 'The answers go into the CEO''s board pack, and null ("not available yet") is an accepted answer:
    finance values a correct figure at 2, a null at 1 and a wrong figure at 0.'
