id: bi_data_analyst
role: BI Data Analyst
task_type: Data Analysis
field: data_knowledge
seed: 20261026
objective: maximize          # reward per scored question (right 2, null = "don't know" 0.5-1.5 by rule set, wrong 0)
                             # / (2 x scored questions): counts/ids exact, money within 0.5% or half the rounding
                             # unit, Q11 within 0.05 percentage points, others within 0.5%
tiers:
  easy: >-
    Five questions (Q01, Q03, Q04, Q10, Q12) on the core conventions: which orders count, test accounts out and staff
    in, the fiscal year, the active-customer window and the rounding of money; Q01 and Q04 also rest on the
    net-revenue and FX definitions. The other seven questions are not needed this round.
  medium: >-
    Easy plus six questions that turn on net revenue, FX at the order date and Korea-time days (Q02, Q05, Q07, Q08,
    Q09, Q11), including the October refunds of September orders (Q11, and Q02 under rule set B). The "pantry"
    question (Q06) is not needed this round.
  hard: >-
    All twelve questions: medium plus the "pantry" revenue (Q06), which needs the snacks-to-pantry category rename.
rulesets:                    # the client's conventions and how it weighs an answer; same data, three ground truths
  A: {fy_start: 4, fy2025: 2025-04-01/2026-03-31, fy2026_q1: 2026-04-01/2026-06-30, fy2026_h1: 2026-04-01/2026-09-30,
      active_days: 90, active_from: "2026-07-03", rounding_unit: 1000,
      right_reward: 2, dont_know_reward: 1, wrong_reward: 0}
  B: {fy_start: 7, fy2025: 2025-07-01/2026-06-30, fy2026_q1: 2026-07-01/2026-09-30, fy2026_h1: 2026-07-01/2026-12-31,
      active_days: 60, active_from: "2026-08-02", rounding_unit: 10000,
      right_reward: 2, dont_know_reward: 0.5, wrong_reward: 0}
  C: {fy_start: 1, fy2025: 2025-01-01/2025-12-31, fy2026_q1: 2026-01-01/2026-03-31, fy2026_h1: 2026-01-01/2026-06-30,
      active_days: 30, active_from: "2026-09-01", rounding_unit: 100,
      right_reward: 2, dont_know_reward: 1.5, wrong_reward: 0}
