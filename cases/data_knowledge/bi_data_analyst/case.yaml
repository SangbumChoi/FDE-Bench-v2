id: bi_data_analyst
role: BI Data Analyst
task_type: Data Analysis
field: data_knowledge
seed: 20261026
objective: maximize          # reward per scored question (right 2, null = "don't know" 0.5-1.5 by rule seed, wrong 0)
                             # / (2 x scored questions): counts/ids exact, money within 0.5% or half the rounding
                             # unit, Q11 within 0.05 percentage points, others within 0.5%
quality_cap: 1.0             # the reference reaches the proven bound (GT.md part 4): nothing valid scores above it
audited: true                # ground truth audit: dataset/audit.json, GT.md, CLIENT_REVIEW.md (gt_report.py)
tiers:
  easy: >-
    Seven questions (Q01, Q03, Q04, Q05, Q07, Q10, Q12) on the core conventions: which orders count, test accounts out
    and staff in, the fiscal year and how it is named, a period that is still running, Korea-time days, the
    active-customer window and the rounding of money; Q01, Q04 and Q07 also rest on the net-revenue and FX
    definitions. The other five questions are not needed this round.
  medium: >-
    Easy plus four questions that turn on the period a refund is booked in and the October refunds of September
    orders (Q02, Q08, Q09, Q11). The "pantry" question (Q06) is not needed this round.
  hard: >-
    All twelve questions: medium plus the "pantry" revenue (Q06), which needs the snacks-to-pantry category rename.
params:                      # the client's conventions and how it weighs an answer; a rule seed draws each
  fy_start:                  # the FY starts on the 1st of this month (derived: fy2025, fy2026_q1, fy2026_h1); never
    values: [9, 4, 7]        # January, the calendar year a sheet that never asks assumes
    labels:
      9: {zh: 9 月, en: September, ko: 9월, ja: 9月, es: septiembre}
      4: {zh: 4 月, en: April, ko: 4월, ja: 4月, es: abril}
      7: {zh: 7 月, en: July, ko: 7월, ja: 7月, es: julio}
  active_days:               # active = a counted order in the N days to the reference date (derived: active_from)
    values: [30, 60, 90]
  rounding_unit:             # money answers are reported to the nearest unit (KRW)
    values: [100, 1000, 10000]
    labels:
      100: {zh: "100", en: "100", ko: "100", ja: "100", es: "100"}
      1000: {zh: "1,000", en: "1,000", ko: "1,000", ja: "1,000", es: "1.000"}
      10000: {zh: "10,000", en: "10,000", ko: "10,000", ja: "10,000", es: "10.000"}
  dont_know_reward:          # what a null earns (derived: wrong_reward 0 and right_reward 2, fixed)
    values: [0.5, 1, 1.5]
    labels:
      0.5: {zh: "0.5", en: "0.5", ko: "0.5", ja: "0.5", es: "0,5"}
      1: {zh: "1", en: "1", ko: "1", ja: "1", es: "1"}
      1.5: {zh: "1.5", en: "1.5", ko: "1.5", ja: "1.5", es: "1,5"}
rule_seeds: [4, 12, 23]      # the public panel: every value of every parameter appears once
deliverables: [answers.json]
deliverable_spec: |
  answers.json = {"Q01": <number or null>, "Q02": <number or null>, ..., "Q12": <number or null>}
  Every question id from the questions file (Q01..Q12) is a key. Its value is one JSON number, or null where the
  engineer gave no figure for that question ("don't know", "not available yet"). Money in KRW, percentages in
  percent (e.g. 4.25 for 4.25%), customer ids as the numeric customer_id.
rules:
  - id: answer_format
    class: physical
    description: Every question id Q01..Q12 is in answers.json, each with a single finite JSON number or null (null means "don't know").
  - id: exclude_test_accounts
    class: contractual
    description: Test accounts (account_type = test in accounts_meta) are excluded from every figure; a count or customer-id answer this round uses (Q03, Q04, Q05, Q10) that equals the figure with test accounts included, and that no reading of the export without them gives, breaches the finance policy.
  - id: report_rounding
    class: contractual
    description: Every money figure this round uses (Q01, Q02, Q06, Q07, Q09) is reported rounded to the nearest {{rounding_unit}} KRW, the precision of the board pack's tables.
  - id: running_period
    class: business_policy
    when: {fy_start: [7, 9]}
    description: A question this round uses whose period is still running on the reference date is answered null ("not available yet"), not with a figure to date; this is finance's habit, and with the CFO's approved exception the figure to date is judged instead.
