id: bi_data_analyst
role: BI Data Analyst
task_type: Data Analysis
field: data_knowledge
seed: 20261026
objective: maximize          # number of the 12 questions answered correctly (counts/ids exact, money within
                             # 0.5% or 500 KRW, Q11 within 0.05 percentage points, others within 0.5%)
deliverables: [answers.json]
deliverable_spec: |
  answers.json = {"Q01": <number>, "Q02": <number>, ..., "Q12": <number>}
  One JSON number per question id from the questions file (Q01..Q12). Money in KRW,
  percentages in percent (e.g. 4.25 for 4.25%), customer ids as the numeric customer_id.
rules:
  - id: answer_format
    class: physical
    description: Every question Q01..Q12 is answered with a single JSON number.
  - id: exclude_test_accounts
    class: contractual
    description: Test accounts (account_type = test in accounts_meta) are excluded from every figure; a count or customer-id answer (Q03, Q04, Q05, Q10) that equals the figure with test accounts included, where that differs from the figure without them, breaches the finance policy.
  - id: report_rounding
    class: business_policy
    description: Every money figure (Q01, Q02, Q06, Q07, Q09) is reported rounded to the nearest thousand KRW.
