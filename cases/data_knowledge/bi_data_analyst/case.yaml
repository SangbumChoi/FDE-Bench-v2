  fy_start:
    4: {zh: 4 月, en: April, ko: 4월, ja: 4月, es: abril}
    7: {zh: 7 月, en: July, ko: 7월, ja: 7月, es: julio}
    1: {zh: 1 月, en: January, ko: 1월, ja: 1月, es: enero}
  fy2025:
    2025-04-01/2026-03-31: {zh: 2025-04-01 至 2026-03-31, en: 2025-04-01 to 2026-03-31, ko: 2025-04-01 ~ 2026-03-31,
                            ja: 2025-04-01〜2026-03-31, es: del 2025-04-01 al 2026-03-31}
    2025-07-01/2026-06-30: {zh: 2025-07-01 至 2026-06-30, en: 2025-07-01 to 2026-06-30, ko: 2025-07-01 ~ 2026-06-30,
                            ja: 2025-07-01〜2026-06-30, es: del 2025-07-01 al 2026-06-30}
    2025-01-01/2025-12-31: {zh: 2025-01-01 至 2025-12-31, en: 2025-01-01 to 2025-12-31, ko: 2025-01-01 ~ 2025-12-31,
                            ja: 2025-01-01〜2025-12-31, es: del 2025-01-01 al 2025-12-31}
  fy2026_q1:
    2026-04-01/2026-06-30: {zh: 2026-04-01 至 2026-06-30, en: 2026-04-01 to 2026-06-30, ko: 2026-04-01 ~ 2026-06-30,
                            ja: 2026-04-01〜2026-06-30, es: del 2026-04-01 al 2026-06-30}
    2026-07-01/2026-09-30: {zh: 2026-07-01 至 2026-09-30, en: 2026-07-01 to 2026-09-30, ko: 2026-07-01 ~ 2026-09-30,
                            ja: 2026-07-01〜2026-09-30, es: del 2026-07-01 al 2026-09-30}
    2026-01-01/2026-03-31: {zh: 2026-01-01 至 2026-03-31, en: 2026-01-01 to 2026-03-31, ko: 2026-01-01 ~ 2026-03-31,
                            ja: 2026-01-01〜2026-03-31, es: del 2026-01-01 al 2026-03-31}
  fy2026_h1:
    2026-04-01/2026-09-30: {zh: 2026-04-01 至 2026-09-30, en: 2026-04-01 to 2026-09-30, ko: 2026-04-01 ~ 2026-09-30,
                            ja: 2026-04-01〜2026-09-30, es: del 2026-04-01 al 2026-09-30}
    2026-07-01/2026-12-31: {zh: 2026-07-01 至 2026-12-31, en: 2026-07-01 to 2026-12-31, ko: 2026-07-01 ~ 2026-12-31,
