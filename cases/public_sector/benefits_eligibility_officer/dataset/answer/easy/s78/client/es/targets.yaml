- id: household_size
  kind: ambiguous
  domain: data semantics
  text: Solo cuentan para el tamaño del hogar los miembros con vive_en_domicilio = sí; los que viven en
    otro lugar se ignoran por completo, incluidos sus ingresos y su discapacidad.
- id: earned_disregard
  kind: missing
  domain: calculation
  text: Para cada persona que trabaja en el domicilio se ignoran los primeros 200 de ingresos del trabajo
    al mes y lo que los supera cuenta íntegramente; pensiones, desempleo y otros ingresos cuentan íntegramente.
- id: residency
  kind: missing
  domain: business rule
  text: El hogar debe llevar al menos 365 días residiendo en la ciudad en la fecha de solicitud; las fechas
    de los datos están en formato día/mes/año.
- id: uprating
  kind: missing
  domain: calculation
  text: Los datos traen la tabla del año pasado; los importes base y las ayudas máximas de vivienda de
    este año son los del año pasado más un 2,5 %, redondeados hacia abajo a múltiplos de 10.
- id: need_formula
  kind: ambiguous
  domain: calculation
  text: La necesidad es el importe base según el tamaño del hogar más el alquiler hasta el máximo de vivienda;
    el importe es la necesidad menos los ingresos computables, redondeado hacia abajo, y 0 o menos significa
    sin derecho.
- id: renewals
  kind: missing
  domain: business rule
  text: Las renovaciones se aprueban con el importe mensual del año pasado sin volver a evaluarlas, con
    el código de motivo RENEWAL.
- id: scoring
  kind: missing
  domain: scoring
  text: El objetivo es pagar a cada hogar exactamente lo que le corresponde según las reglas de este año
    y, sobre todo, acertar en cada decisión de sí o no; un rechazo indica el primer requisito que el hogar
    no cumple, en el orden residencia, patrimonio, ingresos.
- id: assets_out_of_round
  kind: missing
  domain: business rule
  text: En esta ronda la ventanilla de registro ya ha comprobado el patrimonio, así que todos los hogares
    cumplen el requisito de patrimonio y no se usa DENY_ASSETS.
- id: supplement_out_of_round
  kind: missing
  domain: calculation
  text: En esta ronda el importe no incluye complemento por discapacidad; lo paga aparte la oficina de
    discapacidad.
- id: child_support_out_of_round
  kind: missing
  domain: calculation
  text: En esta ronda la pensión alimenticia no cuenta como ingreso, mientras el Ayuntamiento revisa cómo
    tratarla.
- id: cap_out_of_round
  kind: missing
  domain: business rule
  text: En esta ronda los importes no tienen tope; el Departamento de Hacienda aplica después el tope
    presupuestario.
- id: changes_and_letters_out_of_round
  kind: missing
  domain: business rule
  text: En esta ronda los cambios comunicados y los documentos de la carpeta correspondencia se tratan
    aparte; cada solicitud se resuelve tal como se presentó.
