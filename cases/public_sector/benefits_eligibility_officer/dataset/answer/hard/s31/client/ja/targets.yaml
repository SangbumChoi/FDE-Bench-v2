- id: household_size
  kind: ambiguous
  domain: data semantics
  text: 申請住所に居住が「はい」の世帯員だけを世帯人数に数え、別の場所に住む世帯員は収入や障害も含めて一切考慮しません。
- id: earned_disregard
  kind: missing
  domain: calculation
  text: 申請住所に住む就労者ごとに、月の就労収入のうち最初の150を差し引き、残りの30%も差し引きます（150を超える分の70%を算入）。年金・失業給付・その他収入は全額算入です。
- id: residency
  kind: missing
  domain: business rule
  text: 申請日の時点で市内に90日以上居住していることが必要で、データの日付は「年月日」形式です。
- id: uprating
  kind: missing
  domain: calculation
  text: データは昨年度の表で、今年度の基準生活額と住居費上限は昨年度の値を3.2%引き上げて10の倍数に切り捨てたものです。
- id: need_formula
  kind: ambiguous
  domain: calculation
  text: 必要額は世帯人数に応じた基準生活額＋住居費上限までの家賃で、支給額は必要額−認定収入を切り捨てた額、0以下なら対象外です。
- id: renewals
  kind: missing
  domain: business rule
  text: 更新申請は再審査せず昨年度の月額のまま承認し、理由コードはRENEWALです。
- id: scoring
  kind: missing
  domain: scoring
  text: 目標は、すべての世帯に今年度の基準で本来受け取るべき額を正確に支給し、何よりも対象かどうかの判断を誤らないことです。不承認の理由には、居住、資産、収入の順で最初に満たさない要件を記入します。
- id: asset_test
  kind: missing
  domain: business rule
  text: 資産からは居住用不動産と自動車1台（最も評価額の高いもの）を除き、5,000に追加の世帯員1人につき2,500を加えた額を超えると対象外です。
- id: disability_supplement
  kind: missing
  domain: calculation
  text: 必要額には、申請住所に住む障害のある世帯員1人につき150が含まれます。
- id: child_support
  kind: ambiguous
  domain: calculation
  text: 養育費は世帯の収入として全額算入します。収入ではないと考える市民の方もいますが、含めます。
- id: amount_cap
  kind: missing
  domain: business rule
  text: 予算法により、月額の上限は次のとおりです：1人 1,050、2人 1,450、3人 1,800、4人 2,100、5人 2,350、6人以上 2,550。
- id: heating_supplement
  kind: missing
  domain: calculation
  text: 財政課の通知が適用され、申請日が2026年10月1日以降の申請は必要額に冬季暖房費加算60を加え、それより前の申請には加えません。
- id: reported_changes
  kind: ambiguous
  domain: business rule
  text: 申請日以前に効力が生じた変更届は届出済みの就労収入や家賃に置き換え、それより後に生じた変更は今回は反映しません。
- id: exception_requests
  kind: ambiguous
  domain: business rule
  text: 例外を求める文書（居住期間の足りない世帯の承認を求める市議会議員、養育費を収入に数えないよう求める申請者）は結果を変えず、基準どおりに決定します。居住要件は法定の要件です。
