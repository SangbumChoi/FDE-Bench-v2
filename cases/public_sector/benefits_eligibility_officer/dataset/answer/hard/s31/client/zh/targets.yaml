- id: household_size
  kind: ambiguous
  domain: data semantics
  text: 只有“居住在申请地址”为“是”的成员计入家庭人数；住在别处的成员完全不考虑，包括其收入和残疾情况。
- id: earned_disregard
  kind: missing
  domain: calculation
  text: 申请地址的每位有工资的人，月工资前150不计，剩余部分再扣30%（即超过150部分的70%计入）；养老金、失业金和其他收入全额计入。
- id: residency
  kind: missing
  domain: business rule
  text: 申请日期当天须已在本市居住满90天；数据中的日期为“年月日”格式。
- id: uprating
  kind: missing
  domain: calculation
  text: 数据里是去年的金额表；今年的基本生活金额和住房补贴上限为去年数值上调3.2%后向下取整到10的倍数。
- id: need_formula
  kind: ambiguous
  domain: calculation
  text: 所需金额 = 家庭人数对应的基本生活金额 + 不超过住房补贴上限的租金；发放额 = 所需金额 − 可计收入，向下取整，0或以下即不符合条件。
- id: renewals
  kind: missing
  domain: business rule
  text: 续期申请不重新审核，按上年度月发放额直接批准，原因代码为RENEWAL。
- id: scoring
  kind: missing
  domain: scoring
  text: 目标是让每个家庭按今年的规则准确拿到应得金额，最重要的是资格判定不出错；拒绝时按居住、资产、收入的顺序，写明第一个未满足的条件。
- id: asset_test
  kind: missing
  domain: business rule
  text: 可计资产不含自住房和一辆车（价值最高的那辆）；超过5,000加每多一名成员2,500的，不符合条件。
- id: disability_supplement
  kind: missing
  domain: calculation
  text: 所需金额包括申请地址每名残疾成员150。
- id: child_support
  kind: ambiguous
  domain: calculation
  text: 子女抚养费作为家庭收入全额计入，虽然有些居民认为它不算收入。
- id: amount_cap
  kind: missing
  domain: business rule
  text: 按预算法，每月金额上限为：1人1,050，2人1,450，3人1,800，4人2,100，5人2,350，6人及以上2,550。
- id: heating_supplement
  kind: missing
  domain: calculation
  text: 财政局的通知适用；申请日期在2026年10月1日或之后的申请，所需金额加上冬季取暖补贴60，更早的申请不加。
- id: reported_changes
  kind: ambiguous
  domain: business rule
  text: 在申请日期当天或之前生效的变更，替换原申报的工资收入或房租；之后才生效的变更现在不考虑。
- id: exception_requests
  kind: ambiguous
  domain: business rule
  text: 要求破例的来信（市议员要求批准居住时间不够的家庭、申请人要求不计算子女抚养费）不改变任何结果；按规则判定，居住要求是法定条件。
