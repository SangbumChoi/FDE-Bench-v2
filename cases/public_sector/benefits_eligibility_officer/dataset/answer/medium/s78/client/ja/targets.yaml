- id: household_size
  kind: ambiguous
  domain: data semantics
  text: 申請住所に居住が「はい」の世帯員だけを世帯人数に数え、別の場所に住む世帯員は収入や障害も含めて一切考慮しません。
- id: earned_disregard
  kind: missing
  domain: calculation
  text: 申請住所に住む就労者ごとに、月の就労収入のうち最初の200を差し引き、それを超える分は全額算入します。年金・失業給付・その他収入は全額算入です。
- id: residency
  kind: missing
  domain: business rule
  text: 申請日の時点で市内に365日以上居住していることが必要で、データの日付は「年月日」形式です。
- id: uprating
  kind: missing
  domain: calculation
  text: データは昨年度の表で、今年度の基準生活額と住居費上限は昨年度の値を2.5%引き上げて10の倍数に切り捨てたものです。
- id: need_formula
  kind: ambiguous
  domain: calculation
  text: 必要額は世帯人数に応じた基準生活額＋住居費上限までの家賃で、支給額は必要額−認定収入を切り捨てた額、0以下なら対象外です。
- id: renewals
  kind: missing
  domain: business rule
  text: 更新申請は再審査せず昨年度の月額のまま承認し、理由コードはRENEWALです。
- id: scoring
  kind: missing
  domain: scoring
  text: 目標は、すべての世帯に今年度の基準で本来受け取るべき額を正確に支給し、何よりも対象かどうかの判断を誤らないことです。不承認の理由には、居住、資産、収入の順で最初に満たさない要件を記入します。
- id: asset_test
  kind: missing
  domain: business rule
  text: 資産からは居住用不動産と自動車1台（最も評価額の高いもの）を除き、6,000に追加の世帯員1人につき3,000を加えた額を超えると対象外です。
- id: disability_supplement
  kind: missing
  domain: calculation
  text: 必要額には、申請住所に住む障害のある世帯員1人につき120が含まれます。
- id: child_support
  kind: ambiguous
  domain: calculation
  text: 養育費は世帯の収入として全額算入します。収入ではないと考える市民の方もいますが、含めます。
- id: amount_cap
  kind: missing
  domain: business rule
  text: 予算法により、月額の上限は次のとおりです：1人 1,150、2人 1,550、3人 1,900、4人 2,200、5人 2,450、6人以上 2,650。
- id: changes_and_letters_out_of_round
  kind: missing
  domain: business rule
  text: 今回は変更届と受付文書フォルダの文書を別に扱い、どの申請も申請時の届出どおりに決定します。
