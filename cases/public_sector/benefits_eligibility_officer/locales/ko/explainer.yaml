# The explainer's case texts in Korean (English comes from case.yaml).
role: 복지급여 자격심사관
task_type: 규칙 기반 의사결정
deliverable_spec: |
  determinations.csv, ASCII 헤더 household_id,eligible,monthly_amount,reason_code
  신청 한 건당 한 행 (household_id는 데이터 그대로, 예: H001);
  eligible = yes | no; monthly_amount = 올해 월 지급액 (숫자, 대상이 아니면 0);
  reason_code = APPROVED, RENEWAL, DENY_RESIDENCY, DENY_ASSETS, DENY_INCOME 중 하나
  (APPROVED / RENEWAL은 eligible = yes일 때만, DENY_*는 eligible = no일 때만).
rules:
  residency_requirement: 신청일 기준으로 시에 6개월 이상 거주한 가구만 승인할 수 있습니다(법정 요건).
  asset_limit: 인정 재산(거주주택과 자동차 한 대 제외)이 6,000에 추가 가구원 1명당 3,000을 더한 금액을 넘는 가구는 승인할 수 없습니다.
  amount_cap: 월 지급액은 가구원수별 올해 예산상 상한을 넘지 않습니다(1 / 2 / 3 / 4 / 5 / 6인 이상 각각 1050 / 1450 / 1800 / 2100 / 2350 / 2550).
  reason_code_required: 모든 결정에는 정해진 목록에서 결정과 맞는 사유 코드를 붙입니다(승인은 갱신 신청이면 RENEWAL, 신규 신청이면 APPROVED).
  auto_approve_renewals: 갱신 신청은 재심사 없이 작년 월 지급액으로 승인합니다.
