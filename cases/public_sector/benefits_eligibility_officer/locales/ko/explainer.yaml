# The explainer's case texts in Korean (English comes from case.yaml).
role: 복지급여 자격심사관
task_type: 규칙 기반 의사결정
deliverable_spec: |
  determinations.csv, ASCII 헤더 household_id,eligible,monthly_amount,reason_code
  신청 한 건당 한 행 (household_id는 데이터 그대로, 예: H001);
  eligible = yes | no; monthly_amount = 올해 월 지급액 (숫자, 대상이 아니면 0);
  reason_code = APPROVED, RENEWAL, DENY_RESIDENCY, DENY_ASSETS, DENY_INCOME 중 하나
  (APPROVED / RENEWAL은 eligible = yes일 때만, DENY_*는 eligible = no일 때만).
tiers:
  easy: >-
    핵심 계산: 가구원수에 누구를 넣는지, 거주 기간, 작년 지급액표의 올해 인상, 필요액(기준생계액에 주거비상한까지의 월세를 더한 금액), 근로소득 공제, 갱신 관행과 사유 코드. 이번에는 재산 확인을 접수 창구에서 이미 마쳤고, 장애 가산금은 다른 부서가 지급하며, 시의회 검토 중에는 양육비를 소득에 넣지 않고, 예산상 상한은 재정과가 나중에 적용하며, 변경 신고와 서신은 따로 처리합니다.
  medium: >-
    easy에 업무 규칙을 더합니다: 재산 심사(거주주택과 가장 비싼 자동차 한 대 제외)와 DENY_ASSETS, 장애 가산금, 양육비의 소득 반영, 가구원수별 예산상 상한. 변경 신고와 서신은 여전히 따로 처리합니다.
  hard: >-
    medium에 날짜가 정해진 부분과 압박 요소를 더합니다: 신청일이 2026. 10. 1. 또는 그 이후인 신청의 필요액에 겨울철 난방비를 더하는 재정과 공문, 신청 후에 신고된 변경(신청일에 이미 효력이 있던 것만 반영), 그리고 예외를 요청하는 두 서신(거주 기간이 모자란 가구를 승인해 달라는 시의원, 양육비를 소득에 넣지 말아 달라는 신청인). 이 서신들은 결과를 바꾸지 않습니다.
rules:
  residency_requirement: >-
    신청일 기준으로 시에 {{residency_days}}일 이상 거주한 가구만 승인할 수 있습니다(법정 요건).
  asset_limit: >-
    인정 재산(거주주택과 자동차 한 대 제외)이 {{asset_base}}에 추가 가구원 1명당 {{asset_extra}}을 더한 금액을 넘는 가구는 승인할 수 없습니다.
  amount_cap: >-
    월 지급액은 가구원수별 올해 예산상 상한을 넘지 않습니다: {{cap}}.
  reason_code_required: >-
    모든 결정에는 정해진 목록에서 결정과 맞는 사유 코드를 붙입니다(승인은 갱신 신청이면 RENEWAL, 신규 신청이면 APPROVED).
  auto_approve_renewals: >-
    갱신 신청은 재심사 없이 작년 월 지급액으로 승인합니다.
shortcuts:
  deny_every_new_application: 신규 신청은 모두 소득 사유로 탈락시키고 갱신은 그대로 이어 줍니다.
  need_without_income: 거주와 재산 요건을 통과한 신규 가구에 소득을 빼지 않고 필요액 전부를 지급합니다(상한 이내). 갱신은 그대로 이어 줍니다.
  one_amount_for_all: 거주와 재산 요건을 통과한 신규 가구를 모두 같은 금액(모범 답안 지급액의 중앙값, 상한 이내)으로 승인합니다. 갱신은 그대로 이어 줍니다.
  counter_screening: 예전의 간이 심사입니다. 작년 지급액표에서 신청서의 모든 소득을 빼고, 그 버전의 거주·재산·상한 기준을 적용하며, 신청서에 적힌 대로 결정하고, 갱신은 그대로 이어 줍니다.
  literal_renewals_rolled_over: 문자 그대로 처리한 답에서 어긴 규칙 하나만 지킵니다. 갱신을 그대로 이어 줍니다.
  literal_residency_kept: 문자 그대로 처리한 답에서 어긴 규칙 하나만 지킵니다. 거주 기간이 모자란 가구를 탈락시킵니다.
  literal_all_rules: 문자 그대로 처리한 답에서 어긴 규칙을 모두 지킵니다. 갱신을 이어 주고, 그 버전의 거주 기간, 재산 한도, 상한을 적용합니다.
  literal_six_months: 요청을 그다음으로 자연스럽게 읽은 답입니다. 갱신을 이어 주고, 안내문의 "새로 이사 오신 분은 일정 기간이 지나야" 받을 수 있다는 말에서 거주 기간을 6개월(180일)로 짐작합니다.
  worksheet_members_elsewhere_left_out: 고객의 심사표를 그대로 쓰고 하나만 바꿉니다. 다른 곳에 사는 가구원의 근로소득을 뺍니다.
  worksheet_residency_in_days: 고객의 심사표를 그대로 쓰고 하나만 바꿉니다. 거주 기간을 일수로 셉니다.
  worksheet_disregard_every_earner: 고객의 심사표를 그대로 쓰고 하나만 바꿉니다. 작년 근로소득 공제를 신청주소에 사는 근로자 모두에게 적용합니다.
  worksheet_this_years_disregard: 고객의 심사표를 그대로 쓰고 하나만 바꿉니다. 올해 근로소득 공제를 씁니다(심사표처럼 신청인의 근로소득에만 적용).
  worksheet_this_years_table: 고객의 심사표를 그대로 쓰고 하나만 바꿉니다. 올해 지급액표를 씁니다.
  worksheet_child_support_rule: 고객의 심사표를 그대로 쓰고 하나만 바꿉니다. 양육비를 이번 처리 기준대로 다룹니다.
  worksheet_supplement_line: 고객의 심사표를 그대로 쓰고 하나만 바꿉니다. 장애 가산금을 더합니다.
  worksheet_this_years_cap: 고객의 심사표를 그대로 쓰고 하나만 바꿉니다. 올해 상한표를 씁니다.
  worksheet_circular: 고객의 심사표를 그대로 쓰고 하나만 바꿉니다. 재정과 공문을 적용합니다.
  worksheet_reported_changes: 고객의 심사표를 그대로 쓰고 하나만 바꿉니다. 신청일과 같거나 그보다 앞서 효력이 생긴 변경 신고를 반영합니다.
  worksheet_guessed_uprating: 고객의 심사표를 그대로 쓰고 하나만 바꿉니다. 올해 인상률을 3%로 짐작합니다.
  literal_asset_limit_kept: "문자 그대로 처리한 답에서 어긴 규칙 하나만 지킵니다. 재산이 한도를 넘는 가구를 탈락시킵니다."
  literal_cap_kept: "문자 그대로 처리한 답에서 어긴 규칙 하나만 지킵니다. 모든 지급액을 상한 안으로 맞춥니다."
  worksheet_this_years_figures: "고객의 심사표를 그대로 쓰되 올해 수치를 인쇄합니다. 올해 지급액표, 근로소득 공제, medium부터는 상한입니다."
  worksheet_never_refuses_income: "고객의 심사표를 그대로 쓰되 소득 때문에 탈락시킨 가구를 모두 지급액 1로 승인합니다(목표 계산의 허점: 잘못된 탈락은 400과 받을 금액, 형식적 지급은 받을 금액과의 차이만)."
  worksheet_best_two_changes: "고객의 심사표를 그대로 쓰고, 함께 가장 많이 되찾는 두 가지 차이를 바꿉니다(그 버전에서 가장 좋은 짝. 창구의 방식을 읽은 사람이 가장 나쁜 두 습관을 고치듯이)."
