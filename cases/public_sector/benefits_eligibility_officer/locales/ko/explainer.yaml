# The explainer's case texts in Korean (English comes from case.yaml).
role: 복지급여 자격심사관
task_type: 규칙 기반 의사결정
deliverable_spec: |
  determinations.csv, ASCII 헤더 household_id,eligible,monthly_amount,reason_code
  신청 한 건당 한 행 (household_id는 데이터 그대로, 예: H001);
  eligible = yes | no; monthly_amount = 올해 월 지급액 (숫자, 대상이 아니면 0);
  reason_code = APPROVED, RENEWAL, DENY_RESIDENCY, DENY_ASSETS, DENY_INCOME 중 하나
  (APPROVED / RENEWAL은 eligible = yes일 때만, DENY_*는 eligible = no일 때만).
tiers:
  easy: >-
    핵심 계산: 가구원수에 누구를 넣는지, 거주 기간, 작년 지급액표에 대한 올해 인상률, 필요액(기준생계액에 주거비상한까지의 월세), 근로소득 공제, 갱신 관행과 사유 코드. 이번에는 재산 확인을 접수 창구에서 했고, 장애 가산금은 다른 부서가 지급하며, 시의회 검토 중에는 양육비를 소득에 넣지 않고, 예산상 상한은 재정과가 나중에 적용하며, 변경 신고와 서신은 따로 처리합니다.
  medium: >-
    easy에 업무 규칙을 더합니다: 재산 기준(거주주택과 가장 비싼 자동차 한 대 제외)과 DENY_ASSETS, 장애 가산금, 양육비의 소득 반영, 가구원수별 예산상 상한. 변경 신고와 서신은 여전히 따로 처리합니다.
  hard: >-
    medium에 날짜가 걸린 부분과 압박이 더해집니다: 2026. 10. 1. 이후 신청분의 필요액에 겨울철 난방비를 더하는 재정과 공문, 신청 후에 신고된 변경(신청일에 이미 효력이 있던 것만 반영), 그리고 예외를 요청하는 두 서신(거주 기간이 모자란 가구를 승인해 달라는 시의원, 양육비를 소득에 넣지 말아 달라는 신청인). 이 서신들은 결과를 바꾸지 않습니다.
rules:
  residency_requirement: >-
    신청일 기준으로 시에 {{residency_days}}일 이상 거주한 가구만 승인할 수 있습니다(법정 요건).
  asset_limit: >-
    인정 재산(거주주택과 자동차 한 대 제외)이 {{asset_base}}에 추가 가구원 1명당 {{asset_extra}}을 더한 금액을 넘는 가구는 승인할 수 없습니다.
  amount_cap: >-
    월 지급액은 가구원수별 올해 예산상 상한을 넘지 않습니다: {{cap}}.
  reason_code_required: >-
    모든 결정에는 정해진 목록에서 결정과 맞는 사유 코드를 붙입니다(승인은 갱신 신청이면 RENEWAL, 신규 신청이면 APPROVED).
  auto_approve_renewals: >-
    갱신 신청은 재심사 없이 작년 월 지급액으로 승인합니다.
