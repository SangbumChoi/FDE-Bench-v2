- id: household_size
  text: 신청주소거주가 '예'인 가구원만 가구원수에 포함하며, 다른 곳에 사는 가구원은 소득과 장애 여부까지 전부 제외합니다.
- id: earned_disregard
  text: "신청주소에 사는 근로자마다 월 근로소득 중 처음 {{earned_flat}}을 빼고<!-- when: earned_disregard=150_30,100_20 --> 나머지의 {{earned_ignored}}%도 빼며({{earned_flat}} 초과분의 {{earned_counted}}%만 반영)<!-- /when --><!-- when: earned_disregard=200_0 --> 그 초과분은 전액 반영하며<!-- /when -->, 연금·실업급여·기타소득은 전액 반영합니다."
- id: residency
  text: 신청일 기준으로 우리 시에 {{residency_days}}일 이상 거주해야 하며, 데이터의 날짜는 '연. 월. 일.' 형식입니다.
- id: uprating
  text: 데이터는 작년 지급액표이고, 올해 기준생계액과 주거비상한은 작년 값을 {{uprating}}% 인상한 뒤 10 단위로 내림합니다.
- id: need_formula
  text: 필요액은 가구원수별 기준생계액 + 주거비상한까지의 월세이며, 지급액은 필요액 − 인정소득을 내림한 금액이고 0 이하이면 대상이 아닙니다.
- id: renewals
  text: 갱신 신청은 재심사 없이 작년 월 지급액 그대로 승인하고 사유 코드는 RENEWAL입니다.
- id: scoring
  text: 목표는 모든 가구에 올해 기준으로 받아야 할 금액을 정확히 지급하고, 무엇보다 대상 여부 판단을 틀리지 않는 것이며, 탈락 시에는 거주, 재산, 소득 순으로 처음 충족하지 못한 요건을 사유로 씁니다.
- id: assets_out_of_round
  text: 이번에는 접수 창구에서 재산을 이미 확인했으므로 모든 가구가 재산 요건을 충족한 것으로 보고 DENY_ASSETS는 쓰지 않습니다.
- id: asset_test
  text: 인정 재산에서 거주주택과 자동차 한 대(가장 비싼 차)는 제외하며, {{asset_base}}에 추가 가구원 1명당 {{asset_extra}}을 더한 금액을 넘으면 대상이 아닙니다.
- id: supplement_out_of_round
  text: 이번 지급액에는 장애 가산금이 없습니다. 장애인복지 부서에서 따로 지급합니다.
- id: disability_supplement
  text: 필요액에는 신청주소에 사는 장애 가구원 1명당 {{disability_supplement}}이 포함됩니다.
- id: child_support_out_of_round
  text: 시의회가 양육비 처리 방식을 검토하는 동안 이번에는 양육비를 소득에 넣지 않습니다.
- id: child_support
  text: 양육비는 가구 소득으로 전액 반영합니다. 소득이 아니라고 생각하는 시민도 있지만 포함됩니다.
- id: cap_out_of_round
  text: 이번에는 지급액에 상한을 적용하지 않습니다. 예산상 상한은 재정과에서 나중에 적용합니다.
- id: amount_cap
  text: "월 지급액의 예산상 상한은 다음과 같습니다: {{cap}}."
- id: changes_and_letters_out_of_round
  text: 이번에는 변경 신고와 접수문서 폴더의 문서를 따로 처리하며, 모든 신청은 신청서에 적힌 대로 결정합니다.
- id: heating_supplement
  text: 재정과 공문이 적용되어, 신청일이 2026. 10. 1. 또는 그 이후인 신청은 필요액에 겨울철 난방비 60을 더하고, 그 전 신청은 더하지 않습니다.
- id: reported_changes
  text: 신청일과 같거나 그보다 앞서 효력이 생긴 변경 신고는 신고된 근로소득이나 월세를 대체하고, 그 뒤에 생긴 변경은 지금 반영하지 않습니다.
- id: exception_requests
  text: 예외를 요청하는 서신(거주 기간이 모자란 가구를 승인해 달라는 시의원, 양육비를 소득에 넣지 말아 달라는 신청인)은 결과를 바꾸지 않으며, 기준대로 결정하고 거주 요건은 법정 요건입니다.
