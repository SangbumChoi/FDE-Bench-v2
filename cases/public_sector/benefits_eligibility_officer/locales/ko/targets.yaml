- id: household_size
  text: 신청주소거주가 '예'인 가구원만 가구원수에 포함하며, 다른 곳에 사는 가구원은 소득과 장애 여부까지 전부 제외합니다.
- id: earned_disregard
  text: 신청주소에 사는 근로자마다 월 근로소득 중 처음 150과 나머지의 30%를 빼고(150 초과분의 70%만 반영) 계산하며, 연금·실업급여·양육비·기타소득은 전액 반영합니다.
- id: asset_test
  text: 인정 재산에서 거주주택과 자동차 한 대(가장 비싼 차)는 제외하며, 6,000에 추가 가구원 1명당 3,000을 더한 금액을 넘으면 대상이 아닙니다.
- id: residency
  text: 신청일 기준으로 우리 시에 6개월 이상 거주해야 하며, 데이터의 날짜는 '연. 월. 일.' 형식입니다.
- id: uprating
  text: 데이터는 작년 지급액표이고, 올해 기준생계액과 주거비상한은 작년 값에 3.2%를 올린 뒤 10 단위로 내림합니다.
- id: need_formula
  text: 필요액은 가구원수별 기준생계액 + 주거비상한까지의 월세 + 함께 사는 장애 가구원 1명당 120이며, 지급액은 필요액 − 인정소득을 내림한 금액이고 0 이하이면 대상이 아닙니다.
- id: amount_cap
  text: 예산법에 따라 월 지급액 상한은 1/2/3/4/5/6인 이상 가구 각각 1,050/1,450/1,800/2,100/2,350/2,550입니다.
- id: renewals
  text: 갱신 신청은 재심사 없이 작년 월 지급액 그대로 승인하고 사유 코드는 RENEWAL입니다.
- id: scoring
  text: 품질은 실제 지급액과 받아야 할 금액의 절대 차이 합계에 대상 여부 오판 1건당 400을 더해 평가하며, 사유 코드는 결정과 일치해야 합니다(거주, 재산, 소득 순).
