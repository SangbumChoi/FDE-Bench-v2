# The case in plain words, shown at the top of its page.
task: >-
  某市社会事务部门积压了大约300件按月发放的家庭生活补助申请。AI 要按今年的规则逐件判定家庭是否符合条件、每月发多少、理由是什么，写成 `determinations.csv`，每个申请一行（符合为 yes，不符合为 no；理由为新申请通过、续期通过，或因居住、资产、收入之一被拒）。
given:
  - "客户的需求：三句话，请我们判定哪些家庭符合条件、每月各发多少，并列出附件。没有给出任何规则或数字。"
  - "`申请清单.csv`：300件申请（新申请190件，续期110件），每件有申请日期（2026年9月1日至10月20日）、开始在本市居住的日期（`本市居住起始日`）、月租金，续期的还有上年度月发放额。"
  - "`家庭成员.csv` 和 `资产申报.csv`：775名家庭成员（其中62人住在别处，108人有残疾）的与申请人关系、年龄、是否居住在申请地址、是否残疾和五项月收入（工资收入、养老金、失业金、子女抚养费、其他收入）；以及申报的563项资产（存款、自住房产、汽车、投资理财、其他房产）及其价值。"
  - "`2025年度金额表.csv`：家庭人数1至10人对应的去年基本生活金额和住房补贴上限（单人为640和380）。"
  - "`变更申报.csv`：家庭在申请后申报的16项变更（某位成员的新工资收入，或新的房租）及各自的生效日期。`来函` 文件夹：财政局关于增加冬季取暖补贴60的通知、H061申请人要求不计算其子女抚养费（每月290）的来信，以及市议员要求批准H161家庭的便函，该家庭在申请前53天才迁入本市。"
  - "`居民须知.md`：用文字向居民介绍这项补助，没有任何数字。"
ask:
  - "工资收入中有哪部分不计入收入：每位有工资的人，随版本不同，为月工资前150加其余部分的30%、前100加其余部分的20%，或只有前200。"
  - "申请日期当天须已在本市居住多久：随版本不同，为90天、180天或365天。这是法定条件，没有例外。"
  - "今年的金额：文件中的表是去年的。今年的基本生活金额和住房补贴上限是去年的数值上调2.0%、4.0%或6.0%（随版本不同），再各自向下取整到10的倍数（上调6.0%时，单人640 → 670，380 → 400）。"
  - "续期申请不重新审核，直接按上年度的月发放额批准：这是部门为加快处理而形成的惯例。只有局长能批准例外，例外针对全部续期申请，每重新审核一件计200。"
  - "在 easy 中，本轮哪些部分交给别处：资产已由受理窗口审核（不做资产审核），残疾补贴由残疾人事务部门发放，市议会审议期间子女抚养费不计入收入。在 easy 和 medium 中，变更申报和来函（包括财政局的通知）另行处理：每个申请都按申请时申报的情况判定。"
  - "在 medium 和 hard 中，领域规则的数字，各随版本不同：不计自住房产和价值最高的一辆车，资产合计不得超过单人5,000、每多一人加2,500，单人6,000、每多一人加3,000，或单人8,000、每多一人加2,000；申请地址每名残疾成员在所需金额上加60、140或220；子女抚养费计入收入；每月金额不得超过按家庭人数规定的上限，从单人980、1,050或1,150到6人及以上2,400、2,550或2,650。"
  - "在 hard 中，哪些变更申报计入（只计生效日期在申请日期当天或之前的：16项中的8项），以及两封来信不改变任何结果：H161因居住被拒，H061的子女抚养费照计。财政局通知中对申请日期在2026年10月1日或之后的申请加60的规定适用。"
  - "没有 AI 时窗口会怎么做（零分点）：去年的纸质审核表，用去年的数字，工资扣除只用于申请人本人的工资，住在别处的成年人的工资也计入，居住期限按整月计算，没有残疾补贴栏，每个申请都按申报时的情况判定。"
invalid_if:
  - "无法读取：没有 `determinations.csv`，有申请缺行或重复出现，有数据中不存在的家庭编号，资格判定不是 yes 或 no，或金额为负数。"
  - "批准了在本市居住未满规定天数（90天、180天或365天之一）的家庭，例如市议员要求批准的H161家庭。"
  - "在 medium 和 hard 中，批准了资产超过上限的家庭，或发放金额超过该家庭人数的上限。"
  - "理由不在列表中或与决定不符：批准时，新申请须为新申请通过，续期申请须为续期通过；拒绝时须给出三个拒绝理由之一（在三个拒绝理由中选错不算无效，但要计100）。"
  - "没有按上年度月发放额原额批准每一件续期申请；除非公司政策允许放宽这一惯例，且 AI 事先向客户申请了例外。"
quality: >-
  越低越好，单位为本市的发放单位：对全部300个家庭，计算实际发放金额（被拒为0）与按今年规则应得金额之差的总和，每个判错资格的家庭加400，正确拒绝但理由错误的每个家庭加100。续期家庭也与今年的应得金额比较，所以直接延续续期让每个有效答案都带上同样一笔差额（这个惯例的代价）；经批准的例外重新审核续期申请，则改为每个续期家庭计200，在有的版本里划算，在有的版本里不划算。客户自己的审核表记 0 分（本页各版本约42,000至56,000），准确执行该版本全部规则的标准答案记 1 分并拿到满分（约20,000至32,000，正是续期惯例本身的代价）。
tiers:
  easy: >-
    基本计算：居住期限、今年的金额表、所需金额减去收入（工资有一部分不计入）、续期和理由。没有资产审核、残疾补贴和上限，子女抚养费不计入收入；变更申报和来函（包括财政局的通知）另行处理。
  medium: >-
    增加资产审核（不计自住房产和价值最高的一辆车）、残疾补贴、子女抚养费计入收入，以及按家庭人数的上限。变更申报和来函仍另行处理。
  hard: >-
    增加财政局通知中的取暖补贴（申请日期在2026年10月1日或之后的加60）、变更申报（只计申请日期当天已生效的），以及两封要求破例的来信（市议员要求批准H161，H061申请人要求不计子女抚养费），这两封信不改变任何结果。
