- id: household_size
  text: 只有“居住在申请地址”为“是”的成员计入家庭人数；住在别处的成员完全不考虑，包括其收入和残疾情况。
- id: earned_disregard
  text: 申请地址的每位有工资的人，月工资前150不计，剩余部分再扣30%（即超过150部分的70%计入）；养老金、失业金、子女抚养费和其他收入全额计入。
- id: asset_test
  text: 可计资产不含自住房和一辆车（价值最高的那辆）；超过6,000加每多一名成员3,000的，不符合条件。
- id: residency
  text: 申请日期当天须已在本市居住满6个月；数据中的日期为“年月日”格式。
- id: uprating
  text: 数据里是去年的金额表；今年的基本生活金额和住房补贴上限为去年数值上调3.2%后向下取整到10的倍数。
- id: need_formula
  text: 所需金额 = 家庭人数对应的基本生活金额 + 不超过住房补贴上限的租金 + 每名同住残疾成员120；发放额 = 所需金额 − 可计收入，向下取整，0或以下即不符合条件。
- id: amount_cap
  text: 按预算法，每月金额上限为1/2/3/4/5/6人及以上家庭分别1,050/1,450/1,800/2,100/2,350/2,550。
- id: renewals
  text: 续期申请不重新审核，按上年度月发放额直接批准，原因代码为RENEWAL。
- id: scoring
  text: 目标是让每个家庭按今年的规则准确拿到应得金额，最重要的是资格判定不出错；拒绝时按居住、资产、收入的顺序，写明第一个未满足的条件。
