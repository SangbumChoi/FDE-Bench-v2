# The explainer's case texts in Japanese (English comes from case.yaml).
role: 給付資格審査担当者
task_type: ルールに基づく判定
deliverable_spec: |
  determinations.csv、ヘッダーは ASCII の household_id,eligible,monthly_amount,reason_code
  申請1件につき1行（household_id はデータのまま、例: H001）;
  eligible = yes | no; monthly_amount = 今年度の月額支給額（数値、対象外なら 0）;
  reason_code = APPROVED、RENEWAL、DENY_RESIDENCY、DENY_ASSETS、DENY_INCOME のいずれか
  （APPROVED / RENEWAL は eligible = yes のときのみ、DENY_* は eligible = no のときのみ）。
tiers:
  easy: >-
    中心となる計算: 世帯人数に誰を数えるか、居住期間、昨年度の支給額表に対する今年度の引き上げ、必要額（基準生活額に住居費上限までの家賃）、就労収入の控除、更新の運用と理由コード。今回は資産の確認を受付窓口が済ませており、障害加算はほかの部署が支給し、市議会の見直し中は養育費を収入に含めず、予算上の上限は財政課が後で適用し、変更届と文書は別に扱います。
  medium: >-
    easy に業務上のルールを加えます: 資産審査（居住用不動産と最も評価額の高い自動車1台を除外）と DENY_ASSETS、障害加算、養育費の収入算入、世帯人数ごとの予算上の上限。変更届と文書は引き続き別に扱います。
  hard: >-
    medium に日付の決まった部分と圧力が加わります: 申請日が2026年10月1日以降の申請の必要額に冬季暖房費加算を加える財政課の通知、申請後に届け出られた変更（申請日の時点ですでに効力があったものだけを反映）、そして例外を求める2通の文書（居住期間の足りない世帯の承認を求める市議会議員、養育費を収入に数えないよう求める申請者）。これらの文書は結果を変えません。
rules:
  residency_requirement: >-
    申請日の時点で市内に{{residency_days}}日以上居住している世帯だけを承認できます（法定の要件）。
  asset_limit: >-
    算入される資産（居住用不動産と自動車1台を除く）が、{{asset_base}}に追加の世帯員1人につき{{asset_extra}}を加えた額を超える世帯は承認できません。
  amount_cap: >-
    月額は、世帯人数ごとの今年度の予算法上の上限を超えません: {{cap}}。
  reason_code_required: >-
    すべての決定に、決められた一覧のうち決定と整合する理由コードを付けます（承認は、更新申請なら RENEWAL、新規申請なら APPROVED）。
  auto_approve_renewals: >-
    更新申請は再審査せず、昨年度の月額で承認します。
shortcuts:
  deny_every_new_application: 新規申請はすべて収入を理由に不承認とし、更新はそのまま継続します。
  need_without_income: 居住と資産の要件を満たす新規世帯に、収入を差し引かずに必要額の全額を支給します（上限の範囲内）。更新はそのまま継続します。
  one_amount_for_all: 居住と資産の要件を満たす新規世帯をすべて同じ額（模範解答の支給額の中央値、上限の範囲内）で承認します。更新はそのまま継続します。
  counter_screening: 以前の簡易審査です。昨年度の表から申請書のすべての収入を差し引き、そのバージョンの居住・資産・上限の基準を適用し、申請時の届出どおりに決定し、更新はそのまま継続します。
  literal_renewals_rolled_over: 文字どおりに処理した解答のうち、守っていないルールを1つだけ守ります。更新をそのまま継続します。
  literal_residency_kept: 文字どおりに処理した解答のうち、守っていないルールを1つだけ守ります。居住期間の足りない世帯を不承認にします。
  literal_all_rules: 文字どおりに処理した解答のうち、守っていないルールをすべて守ります。更新を継続し、そのバージョンの居住期間、資産の上限、支給額の上限を適用します。
  literal_six_months: 依頼を次に自然な形で読んだ解答です。更新を継続し、ご案内の「転入されたばかりの方は一定期間お待ちいただく場合があります」から居住期間を6か月（180日）と推測します。
  worksheet_members_elsewhere_left_out: 顧客の審査表をそのまま使い、1つだけ変えます。別の場所に住む世帯員の就労収入を除きます。
  worksheet_residency_in_days: 顧客の審査表をそのまま使い、1つだけ変えます。居住期間を日数で数えます。
  worksheet_disregard_every_earner: 顧客の審査表をそのまま使い、1つだけ変えます。昨年度の就労収入控除を申請住所に住む就労者全員に適用します。
  worksheet_this_years_disregard: 顧客の審査表をそのまま使い、1つだけ変えます。今年度の就労収入控除を使います（審査表どおり申請者の就労収入にだけ適用）。
  worksheet_this_years_table: 顧客の審査表をそのまま使い、1つだけ変えます。今年度の支給額表を使います。
  worksheet_child_support_rule: 顧客の審査表をそのまま使い、1つだけ変えます。養育費を今回の基準どおりに扱います。
  worksheet_supplement_line: 顧客の審査表をそのまま使い、1つだけ変えます。障害加算を加えます。
  worksheet_this_years_cap: 顧客の審査表をそのまま使い、1つだけ変えます。今年度の上限表を使います。
  worksheet_circular: 顧客の審査表をそのまま使い、1つだけ変えます。財政課の通知を適用します。
  worksheet_reported_changes: 顧客の審査表をそのまま使い、1つだけ変えます。申請日以前に効力が生じた変更届を反映します。
  worksheet_guessed_uprating: 顧客の審査表をそのまま使い、1つだけ変えます。今年度の引き上げ率を3%と推測します。
  literal_asset_limit_kept: "文字どおりに処理した解答のうち、守っていないルールを1つだけ守ります。資産が上限を超える世帯を不承認にします。"
  literal_cap_kept: "文字どおりに処理した解答のうち、守っていないルールを1つだけ守ります。どの支給額も上限以内にします。"
  worksheet_this_years_figures: "顧客の審査表をそのまま使い、今年度の数字を印刷します。今年度の支給額表、就労収入控除、mediumからは上限です。"
  worksheet_never_refuses_income: "顧客の審査表をそのまま使い、収入で不承認にした世帯をすべて支給額1で承認します（目的関数の計算の悪用：誤った不承認は400と本来の額、形だけの支給は本来の額との差だけ）。"
  worksheet_best_two_changes: "顧客の審査表をそのまま使い、合わせて最も取り戻せる2つの違いを変えます（そのバージョンで最良の組み合わせ。窓口のやり方を読んだ人が最悪の2つの習慣を直すように）。"
