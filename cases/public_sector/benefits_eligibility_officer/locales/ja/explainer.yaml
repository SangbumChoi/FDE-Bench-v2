# The explainer's case texts in Japanese (English comes from case.yaml).
role: 給付資格審査担当者
task_type: ルールに基づく判定
deliverable_spec: |
  determinations.csv、ヘッダーは ASCII の household_id,eligible,monthly_amount,reason_code
  申請1件につき1行（household_id はデータのまま、例: H001）;
  eligible = yes | no; monthly_amount = 今年度の月額支給額（数値、対象外なら 0）;
  reason_code = APPROVED、RENEWAL、DENY_RESIDENCY、DENY_ASSETS、DENY_INCOME のいずれか
  （APPROVED / RENEWAL は eligible = yes のときのみ、DENY_* は eligible = no のときのみ）。
rules:
  residency_requirement: 申請日の時点で市内に6か月以上居住している世帯だけを承認できます（法定の要件）。
  asset_limit: 算入される資産（居住用不動産と自動車1台を除く）が、6,000に追加の世帯員1人につき3,000を加えた額を超える世帯は承認できません。
  amount_cap: 月額は、世帯人数ごとの今年度の予算法上の上限を超えません（1 / 2 / 3 / 4 / 5 / 6人以上でそれぞれ 1050 / 1450 / 1800 / 2100 / 2350 / 2550）。
  reason_code_required: すべての決定に、決められた一覧のうち決定と整合する理由コードを付けます（承認は、更新申請なら RENEWAL、新規申請なら APPROVED）。
  auto_approve_renewals: 更新申請は再審査せず、昨年度の月額で承認します。
