- id: household_size
  text: 申請住所に居住が「はい」の世帯員だけを世帯人数に数え、別の場所に住む世帯員は収入や障害も含めて一切考慮しません。
- id: earned_disregard
  text: "申請住所に住む就労者ごとに、月の就労収入のうち最初の{{earned_flat}}を差し引き<!-- when: earned_disregard=150_30,100_20 -->、残りの{{earned_ignored}}%も差し引きます（{{earned_flat}}を超える分の{{earned_counted}}%を算入）<!-- /when --><!-- when: earned_disregard=200_0 -->、それを超える分は全額算入します<!-- /when -->。年金・失業給付・その他収入は全額算入です。"
- id: residency
  text: 申請日の時点で市内に{{residency_days}}日以上居住していることが必要で、データの日付は「年月日」形式です。
- id: uprating
  text: データは昨年度の表で、今年度の基準生活額と住居費上限は昨年度の値を{{uprating}}%引き上げて10の倍数に切り捨てたものです。
- id: need_formula
  text: 必要額は世帯人数に応じた基準生活額＋住居費上限までの家賃で、支給額は必要額−認定収入を切り捨てた額、0以下なら対象外です。
- id: renewals
  text: 更新申請は再審査せず昨年度の月額のまま承認し、理由コードはRENEWALです。
- id: scoring
  text: 目標は、すべての世帯に今年度の基準で本来受け取るべき額を正確に支給し、何よりも対象かどうかの判断を誤らないことです。不承認の理由には、居住、資産、収入の順で最初に満たさない要件を記入します。
- id: assets_out_of_round
  text: 今回は受付窓口で資産を確認済みのため、どの世帯も資産要件を満たしているものとし、DENY_ASSETSは使いません。
- id: asset_test
  text: 資産からは居住用不動産と自動車1台（最も評価額の高いもの）を除き、{{asset_base}}に追加の世帯員1人につき{{asset_extra}}を加えた額を超えると対象外です。
- id: supplement_out_of_round
  text: 今回の支給額には障害加算を含めません。障害福祉課が別に支給します。
- id: disability_supplement
  text: 必要額には、申請住所に住む障害のある世帯員1人につき{{disability_supplement}}が含まれます。
- id: child_support_out_of_round
  text: 市議会が養育費の扱いを見直している間、今回は養育費を収入に含めません。
- id: child_support
  text: 養育費は世帯の収入として全額算入します。収入ではないと考える市民の方もいますが、含めます。
- id: cap_out_of_round
  text: 今回は支給額に上限をかけません。予算上の上限は財政課が後で適用します。
- id: amount_cap
  text: 予算法により、月額の上限は次のとおりです：{{cap}}。
- id: changes_and_letters_out_of_round
  text: 今回は変更届と受付文書フォルダの文書を別に扱い、どの申請も申請時の届出どおりに決定します。
- id: heating_supplement
  text: 財政課の通知が適用され、申請日が2026年10月1日以降の申請は必要額に冬季暖房費加算60を加え、それより前の申請には加えません。
- id: reported_changes
  text: 申請日以前に効力が生じた変更届は届出済みの就労収入や家賃に置き換え、それより後に生じた変更は今回は反映しません。
- id: exception_requests
  text: 例外を求める文書（居住期間の足りない世帯の承認を求める市議会議員、養育費を収入に数えないよう求める申請者）は結果を変えず、基準どおりに決定します。居住要件は法定の要件です。
