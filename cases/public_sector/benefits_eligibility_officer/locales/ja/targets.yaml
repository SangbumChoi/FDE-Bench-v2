- id: household_size
  text: 申請住所に居住が「はい」の世帯員だけを世帯人数に数え、別の場所に住む世帯員は収入や障害も含めて一切考慮しません。
- id: earned_disregard
  text: 申請住所に住む就労者ごとに、月の就労収入のうち最初の150と残りの30%を差し引きます（150を超える分の70%を算入）。年金・失業給付・養育費・その他収入は全額算入です。
- id: asset_test
  text: 資産からは居住用不動産と自動車1台（最も評価額の高いもの）を除き、6,000に追加の世帯員1人につき3,000を加えた額を超えると対象外です。
- id: residency
  text: 申請日の時点で市内に6か月以上居住していることが必要で、データの日付は「年月日」形式です。
- id: uprating
  text: データは昨年度の表で、今年度の基準生活額と住居費上限は昨年度の値を3.2%引き上げて10の倍数に切り捨てたものです。
- id: need_formula
  text: 必要額は世帯人数に応じた基準生活額＋住居費上限までの家賃＋同居する障害のある世帯員1人につき120で、支給額は必要額−認定収入を切り捨てた額、0以下なら対象外です。
- id: amount_cap
  text: 予算法により、月額の上限は1/2/3/4/5/6人以上の世帯でそれぞれ1,050/1,450/1,800/2,100/2,350/2,550です。
- id: renewals
  text: 更新申請は再審査せず昨年度の月額のまま承認し、理由コードはRENEWALです。
- id: scoring
  text: 目標は、すべての世帯に今年度の基準で本来受け取るべき額を正確に支給し、何よりも対象かどうかの判断を誤らないことです。不承認の理由には、居住、資産、収入の順で最初に満たさない要件を記入します。
