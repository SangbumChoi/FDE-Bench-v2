- id: household_size
  kind: ambiguous
  domain: data semantics
  text: Only members with lives_at_address = yes count towards household size; members living elsewhere are ignored entirely, including their income and disability.
- id: earned_disregard
  kind: missing
  domain: calculation
  text: For each earner at the address, the first 150 of monthly earned income is ignored and 30% of the rest too (70% of earnings above 150 counts); pensions, unemployment benefit, child support and other income count in full.
- id: asset_test
  kind: missing
  domain: business rule
  text: Countable assets exclude the home the household lives in and one car (the most valuable); above 6,000 plus 3,000 per additional household member the household is not eligible.
- id: residency
  kind: missing
  domain: business rule
  text: The household must have lived in the city for at least 6 months on the application date; dates in the data are written day/month/year.
- id: uprating
  kind: missing
  domain: calculation
  text: The data has last year's table; this year's standard amounts and housing maximums are last year's plus 3.2%, rounded down to a multiple of 10.
- id: need_formula
  kind: ambiguous
  domain: calculation
  text: Need is the standard amount for the household size plus rent up to the housing maximum plus 120 per disabled member at the address; the amount is need minus countable income, rounded down, and 0 or less means not eligible.
- id: amount_cap
  kind: missing
  domain: business rule
  text: The monthly amount is capped by budget law at 1,050 / 1,450 / 1,800 / 2,100 / 2,350 / 2,550 for households of 1 / 2 / 3 / 4 / 5 / 6 or more.
- id: renewals
  kind: missing
  domain: business rule
  text: Renewal applications are approved at last year's monthly amount without re-assessment, with reason code RENEWAL.
- id: scoring
  kind: missing
  domain: scoring
  text: The goal is to pay every household exactly its entitlement under this year's rules and above all to get every yes/no decision right; a refusal gives the first condition the household fails, in the order residency, assets, income.
