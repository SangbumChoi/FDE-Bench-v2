- id: household_size
  text: Solo cuentan para el tamaño del hogar los miembros con vive_en_domicilio = sí; los que viven en otro lugar se ignoran por completo, incluidos sus ingresos y su discapacidad.
- id: earned_disregard
  text: Para cada persona que trabaja en el domicilio se ignoran los primeros 150 de ingresos del trabajo al mes y el 30 % del resto (cuenta el 70 % de lo que supera 150); pensiones, desempleo, pensión alimenticia y otros ingresos cuentan íntegramente.
- id: asset_test
  text: El patrimonio computable excluye la vivienda habitual y un coche (el de mayor valor); por encima de 6.000 más 3.000 por cada miembro adicional, el hogar no tiene derecho.
- id: residency
  text: El hogar debe llevar al menos 6 meses residiendo en la ciudad en la fecha de solicitud; las fechas de los datos están en formato día/mes/año.
- id: uprating
  text: Los datos traen la tabla del año pasado; los importes base y las ayudas máximas de vivienda de este año son los del año pasado más un 3,2 %, redondeados hacia abajo a múltiplos de 10.
- id: need_formula
  text: La necesidad es el importe base según el tamaño del hogar más el alquiler hasta el máximo de vivienda más 120 por cada miembro con discapacidad que viva en el domicilio; el importe es la necesidad menos los ingresos computables, redondeado hacia abajo, y 0 o menos significa sin derecho.
- id: amount_cap
  text: Por ley presupuestaria, el importe mensual tiene un tope de 1.050 / 1.450 / 1.800 / 2.100 / 2.350 / 2.550 para hogares de 1 / 2 / 3 / 4 / 5 / 6 o más personas.
- id: renewals
  text: Las renovaciones se aprueban con el importe mensual del año pasado sin volver a evaluarlas, con el código de motivo RENEWAL.
- id: scoring
  text: La calidad es la suma de diferencias absolutas entre el importe pagado y el que corresponde, más 400 por cada decisión de derecho equivocada; el código de motivo debe coincidir con la decisión (residencia, luego patrimonio, luego ingresos).
