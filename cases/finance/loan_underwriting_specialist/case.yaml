id: loan_underwriting_specialist
role: Loan Underwriting Specialist
task_type: Decision Program
field: finance
seed: 20261026
objective: maximize          # 0.7 x expected profit / the reference program's expected profit (same setting)
                             # + 0.3 x limit-table accuracy (mean over the 20 days); the reference scores 1.0
deliverable_type: program
entrypoint: underwriter.py:on_day
tiers:                       # one world, one hidden period and the same notices in every setting
  easy: >-
    The daily underwriting core for one product (PL36): income = 12 x declared base salary + documented bonus;
    the policy bureau's score with a cutoff; active delinquency declined; a customer limit = min(50,000, income
    cap, DSR headroom counting installment loans only: the client's own affordability cap this round, the
    regulator's ratio being a separate compliance check) minus what we already lent the customer in the period
    (earlier days and the same day); a daily disbursement cap; ordered decline reason codes; protected attributes
    never used (planted twins); the tenure referral habit; a closing limit table every day (customer limits and
    the daily capacity left). The notices in the input are out of scope this round.
  medium: >-
    Easy plus credit lines in the DSR (balance over 5 years plus interest), the stress rate above 60,000 of total
    debt, a period budget, a near-prime quota on the cumulative approved amount, and two notices: the regulator's
    DSR cap cut for loans decided from a given day, and the treasury's budget cut.
  hard: >-
    Medium plus income verification (lowest of declared and documented salary; a large discrepancy is referred),
    document corrections (a referred application is decided again the day its corrected document arrives),
    repayment notices (a repaid debt leaves the DSR the day the notice arrives), and split applications (at most
    one approval per customer per day; the others are declined with SPLIT_APPLICATION).
params:                      # the client's rule parameters; a rule seed draws each from its candidates (same data)
  policy_bureau:             # the bureau whose score the policy uses; the other one is reference only (other_bureau)
    values: [A, B]
    labels:                  # a bureau reads as its score field in each locale's text
      A: {zh: bureau_a_score（A评分机构分数）, en: bureau_a_score, ko: bureau_a_score(A평가사 점수), ja: bureau_a_score（A社スコア）, es: bureau_a_score (buró A)}
      B: {zh: bureau_b_score（B评分机构分数）, en: bureau_b_score, ko: bureau_b_score(B평가사 점수), ja: bureau_b_score（B社スコア）, es: bureau_b_score (buró B)}
  min_score_a:               # the score cutoff in Bureau A points (8-19% of non-delinquent applicants fall under it);
    values: [745, 760, 775]  # the policy's cutoff min_score is 55 points higher with Bureau B (derive_params)
  near_prime_a:              # near-prime: the policy score below this, in Bureau A points (near_prime_below, likewise);
    values: [825, 840, 855]  # the band from the cutoff must be >= 2.5 points per point of the quota (admissible)
  max_dsr_pct:               # the DSR cap (medium+: 5 points lower from the regulator's effective date)
    values: [35, 40, 45]
  income_cap_pct:            # the income cap in % of annual income, below what even a 35% DSR cap allows a
    values: [50, 65, 80]     # debt-free customer (about 88% of income), so it binds in every draw
  daily_cap:
    values: [200000, 250000, 300000]
    labels:
      200000: {zh: "200,000", en: "200,000", ko: "200,000", ja: "200,000", es: "200.000"}
      250000: {zh: "250,000", en: "250,000", ko: "250,000", ja: "250,000", es: "250.000"}
      300000: {zh: "300,000", en: "300,000", ko: "300,000", ja: "300,000", es: "300.000"}
  period_budget:             # medium+ (400,000 less from the treasury's cut); it binds after the cut (admissible)
    values: [3400000, 3800000, 4400000]
    labels:
      3400000: {zh: "3,400,000", en: "3,400,000", ko: "3,400,000", ja: "3,400,000", es: "3.400.000"}
      3800000: {zh: "3,800,000", en: "3,800,000", ko: "3,800,000", ja: "3,800,000", es: "3.800.000"}
      4400000: {zh: "4,400,000", en: "4,400,000", ko: "4,400,000", ja: "4,400,000", es: "4.400.000"}
  quota_pct:                 # medium+: the near-prime share of the period's approved amount
    values: [25, 30, 35]
  discrepancy_pct:           # hard: a document this much below the declared salary is referred
    values: [15, 20, 25]
  min_tenure:                # the tenure habit: refer below this many months in the job
    values: [3, 6, 12]
rule_seeds: [30, 525, 1043]        # public panel: every candidate but quota_pct 35; binding is checked on 30
deliverable_spec: |
  A program/ directory with underwriter.py defining on_day(day). The engine loads it once and calls it once per
  business day of the hidden period, in order, in the same process (module-level state survives between calls);
  10 s per call, Python standard library only, no network and no access to the data files at run time.
  day = {"date", "day_index", "days_in_period", "period_end", "applications": [...], "notices": [...],
  "book": {"loans": [...], "referred": [...]}} exactly as in the pilot-day input file.
  Return {"decisions": [{"application_id": str, "decision": "approve" | "decline" | "refer",
  "amount": int (approved amount; 0 unless approve), "reason_code": str (on every decline; "" otherwise)}],
  "limit_table": {"customers": {customer_id: int}, "daily_capacity_remaining": int,
  "period_budget_remaining": int or null}} as in the pilot-day output file.
  reason_code is one of DELINQUENCY | LOW_SCORE | SPLIT_APPLICATION | LIMIT_EXCEEDED | CREDIT_RISK.
rules:
  - id: decision_complete
    class: contractual
    description: Every call returns one well-formed decision for each application received that day (approved amount a whole number from 1,000 to the requested amount, 0 otherwise) and none for anything else; a call that fails or times out breaks it too.
  - id: delinquency_decline
    class: contractual
    description: Applications of customers with an active delinquency are declined.
  - id: score_cutoff
    class: contractual
    description: Approvals only when the policy bureau's score ({{policy_bureau}}) is at least {{min_score}}.
  - id: customer_limit
    class: physical
    description: What a customer is approved on a day (all their applications together) is at most their customer limit that morning, min(50,000, {{income_cap_pct}}% of annual income, DSR headroom at {{max_dsr_pct}}%) minus our approvals to them earlier in the period. It never bends, since the income cap is regulatory and so is the DSR cap from medium (medium+, the cap moves by the regulator's notice from its effective date; hard, repayments and verified income count); in easy the DSR cap is our own affordability limit on installment loans, with no exception, and the regulator's notice does not reach it.
  - id: daily_cap
    class: contractual
    description: The amount approved on one day is at most the daily disbursement capacity of {{daily_cap}} (our funding line).
  - id: period_budget
    class: contractual
    tiers: [medium, hard]
    description: No day's approvals take the amount approved in the period above the period budget in force that day, {{period_budget}} (400,000 less from the treasury's budget cut); a cut below what is already approved stops further approvals but does not undo earlier ones.
  - id: reason_code_required
    class: contractual
    description: Every decline carries the code of its main driver after the day's approvals, the first that applies of DELINQUENCY, LOW_SCORE, SPLIT_APPLICATION (hard), LIMIT_EXCEEDED (less than 1,000 of customer limit left), CREDIT_RISK.
  - id: no_protected_attributes
    class: physical
    description: Age band, gender and nationality never influence a decision; planted twin applications that differ only in them get the same decision and amount.
  - id: near_prime_quota
    class: contractual
    tiers: [medium, hard]
    description: At least {{quota_pct}}% of the total amount approved over the period goes to near-prime customers ({{policy_bureau}} below {{near_prime_below}}), a commitment to the regulator.
  - id: income_discrepancy_refer
    class: contractual
    tiers: [hard]
    description: An application whose documents show a monthly base salary more than {{discrepancy_pct}}% below the declared one is referred (unless declined for delinquency); our fraud-prevention procedure agreed with the regulator.
  - id: redecide_on_documents
    class: contractual
    tiers: [hard]
    description: A referred application whose corrected income document arrives in a notice is decided again that same day (our service commitment to customers).
  - id: split_applications
    class: contractual
    tiers: [hard]
    description: At most one application per customer is approved on a day; splitting one need into several same-day applications must not get around the limit.
  - id: tenure_review
    class: business_policy
    description: Applicants with fewer than {{min_tenure}} months in their current job are referred to a human underwriter (unless declined for delinquency); a habit the head of credit can grant exceptions to.
