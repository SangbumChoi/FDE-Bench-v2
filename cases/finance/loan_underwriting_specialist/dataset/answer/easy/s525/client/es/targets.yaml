- id: gross_income
  kind: ambiguous
  domain: calculation
  text: El ingreso bruto anual es 12 x monthly_base_salary más annual_bonus solo cuando bonus_documented
    es true; stated_monthly_income no se usa nunca.
- id: policy_bureau
  kind: ambiguous
  domain: data semantics
  text: La política de crédito usa solo bureau_b_score (buró B); bureau_a_score (buró A) es de referencia
    y nunca se usa para un corte ni para definir near-prime (el buró B sale unos 55 puntos más alto).
- id: score_cutoff
  kind: missing
  domain: business rule
  text: Una solicitud solo se aprueba cuando la puntuación bureau_b_score (buró B) del cliente llega al
    menos a 830 puntos.
- id: income_cap
  kind: missing
  domain: calculation
  text: El límite de un cliente es como máximo el 80 % del ingreso bruto anual, redondeado hacia abajo
    (y como máximo los 50.000 del producto).
- id: dsr_cap
  kind: missing
  domain: calculation
  text: El ratio de endeudamiento, (servicio anual de las deudas existentes + 12 x 33,17 por cada 1.000
    de todos nuestros préstamos PL36 al cliente) / ingreso bruto anual, puede ser como máximo el 45 %;
    un préstamo a plazos cuenta 12 x su monthly_payment.
- id: our_lending
  kind: missing
  domain: calculation
  text: Al límite del cliente se le resta todo lo que le aprobamos en el período, en días anteriores y
    antes ese mismo día, así que a quien vuelve le queda menos y las solicitudes del mismo día comparten
    un límite.
- id: daily_cap
  kind: missing
  domain: business rule
  text: Como máximo se pueden aprobar 200.000 en total por día hábil (nuestra línea de financiación).
- id: limit_table
  kind: missing
  domain: scoring
  text: La tabla de límites de cada día debe incluir a todos los clientes que han solicitado en el período
    hasta ese momento (ese día incluido), la capacidad diaria restante y, cuando hay presupuesto del período,
    el presupuesto restante; que falte un valor incumple las reglas.
- id: closing_table
  kind: missing
  domain: scoring
  text: La tabla de límites es la del cierre del día, tras las aprobaciones y avisos de ese día (no los
    límites de la mañana).
- id: ineligible_zero
  kind: missing
  domain: scoring
  text: En la tabla de límites un cliente en mora o por debajo del corte de puntuación tiene 0.
- id: reason_codes
  kind: missing
  domain: business rule
  text: Cada rechazo lleva el primero que aplique de DELINQUENCY, LOW_SCORE, LIMIT_EXCEEDED (menos de
    1.000 de límite restante tras las aprobaciones del día), CREDIT_RISK (todo lo demás, incluida la capacidad
    agotada).
- id: protected_attributes
  kind: missing
  domain: business rule
  text: El tramo de edad, el género y la nacionalidad no pueden influir; las parejas de auditoría del
    mismo día que solo difieren en esos campos deben recibir la misma decisión e importe.
- id: tenure_review
  kind: missing
  domain: business rule
  text: Los solicitantes con menos de 12 meses en su empleo se derivan a un analista humano salvo que
    estén en mora; es una costumbre y el director de riesgos puede autorizar una excepción.
- id: branch_notes
  kind: missing
  domain: business rule
  text: Las notas de directores de sucursal que piden aprobar el importe completo no cuentan ni son una
    excepción; esas solicitudes se deciden exactamente como cualquier otra.
- id: credit_lines_easy
  kind: missing
  domain: calculation
  text: En esta ronda las líneas de crédito quedan fuera del ratio de endeudamiento (solo cuentan los
    préstamos a plazos).
- id: regulator_notice_easy
  kind: missing
  domain: business rule
  text: En esta ronda el ratio máximo es nuestro propio límite de solvencia, así que el aviso del regulador
    no lo cambia (el ratio del regulador es un control aparte de cumplimiento normativo).
- id: declared_income
  kind: missing
  domain: calculation
  text: En esta ronda el ingreso es el monthly_base_salary declarado; no se usan los justificantes de
    ingresos ni los avisos document_correction.
- id: repayments_unused
  kind: missing
  domain: data semantics
  text: En esta ronda no se aplican los avisos repayment; las deudas son las de la última solicitud del
    cliente.
