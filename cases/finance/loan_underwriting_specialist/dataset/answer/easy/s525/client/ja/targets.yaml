- id: gross_income
  kind: ambiguous
  domain: calculation
  text: 年間総収入は 12 × monthly_base_salary に、bonus_documented が true のときだけ annual_bonus を加えたもので、stated_monthly_income
    は使いません。
- id: policy_bureau
  kind: ambiguous
  domain: data semantics
  text: 与信ポリシーは bureau_b_score（B社スコア） だけを使い、bureau_a_score（A社スコア） は参考用で、基準点にもニアプライム層の定義にも使いません（B社は55点ほど高く出ます）。
- id: score_cutoff
  kind: missing
  domain: business rule
  text: bureau_b_score（B社スコア） が830点以上のときだけ承認します。
- id: income_cap
  kind: missing
  domain: calculation
  text: 顧客枠は年間総収入の80%（切り捨て）以下です（商品の上限50,000以下でもあります）。
- id: dsr_cap
  kind: missing
  domain: calculation
  text: 返済負担率（DSR）、つまり（既存債務の年間元利返済額 + その顧客への当社PL36貸出全額の1,000あたり33.17 × 12）/ 年間総収入は45%以下でなければならず、分割返済ローンは
    12 × monthly_payment で数えます。
- id: our_lending
  kind: missing
  domain: calculation
  text: 顧客枠からは、当期間にその顧客に承認した額を、前の営業日の分もその日の先の承認分もすべて差し引くので、再来店の顧客は残りが減っており、同じ日の複数申込は1つの枠を分け合います。
- id: daily_cap
  kind: missing
  domain: business rule
  text: 1営業日の承認合計は 200,000 までです（当社の資金調達枠）。
- id: limit_table
  kind: missing
  domain: scoring
  text: 毎日の枠一覧表には、当期間にこれまで（当日を含む）申し込んだすべての顧客と、残りの1日枠、そして期間予算があるときは残りの予算が必要で、抜けがあればルール違反です。
- id: closing_table
  kind: missing
  domain: scoring
  text: 枠一覧表はその日の承認と通知を反映した、その日の締め時点のものです（朝の時点の枠ではない）。
- id: ineligible_zero
  kind: missing
  domain: scoring
  text: 枠一覧表では、延滞中の顧客やスコアが基準に届かない顧客は0です。
- id: reason_codes
  kind: missing
  domain: business rule
  text: 否決ごとに DELINQUENCY、LOW_SCORE、LIMIT_EXCEEDED（その日の承認後の残り顧客枠が1,000未満）、CREDIT_RISK（それ以外。枠の使い切りを含む）のうち最初に当てはまるコードを付けます。
- id: protected_attributes
  kind: missing
  domain: business rule
  text: 年齢層、性別、国籍は判断に影響させてはならず、同じ日にこれらだけが異なる監査用のペアは同じ判断・同じ金額でなければなりません。
- id: tenure_review
  kind: missing
  domain: business rule
  text: 勤続12か月未満の申込者は、延滞中でなければ人の審査担当者に回します。慣行なので与信担当役員が例外を承認できます。
- id: branch_notes
  kind: missing
  domain: business rule
  text: 全額承認を求める支店長のメモには何の効力もなく例外の承認でもないので、その申込はほかの申込とまったく同じように判断します。
- id: credit_lines_easy
  kind: missing
  domain: calculation
  text: 今回はカードローン枠をDSRに入れません（分割返済ローンだけを入れます）。
- id: regulator_notice_easy
  kind: missing
  domain: business rule
  text: 今回はDSRの上限が当社独自の返済能力基準なので、規制当局の通知では変わりません（規制当局の基準によるDSRはコンプライアンス部が別に確認）。
- id: declared_income
  kind: missing
  domain: calculation
  text: 今回は収入に記入された monthly_base_salary を使い、収入書類と document_correction の通知は使いません。
- id: repayments_unused
  kind: missing
  domain: data semantics
  text: 今回は repayment の通知を反映せず、債務はその顧客の最新の申込の一覧を使います。
