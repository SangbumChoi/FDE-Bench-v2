- id: gross_income
  kind: ambiguous
  domain: calculation
  text: Annual gross income is 12 x monthly_base_salary plus annual_bonus only when bonus_documented is
    true; stated_monthly_income is never used.
- id: policy_bureau
  kind: ambiguous
  domain: data semantics
  text: The credit policy uses bureau_b_score only; bureau_a_score is for reference and never used for
    a cutoff or the near-prime definition (Bureau B runs about 55 points higher).
- id: score_cutoff
  kind: missing
  domain: business rule
  text: An application is approved only when bureau_b_score is at least 815.
- id: income_cap
  kind: missing
  domain: calculation
  text: A customer's limit is at most 50% of annual gross income, rounded down (and at most the product's
    50,000).
- id: dsr_cap
  kind: missing
  domain: calculation
  text: The debt-service ratio, (annual service of the existing debts + 12 x 33.17 per 1,000 of all our
    PL36 lending to the customer) / annual gross income, may be at most 40%; an installment loan counts
    12 x its monthly_payment.
- id: our_lending
  kind: missing
  domain: calculation
  text: The customer limit is reduced by everything we approved to the customer in the period, on earlier
    days and earlier the same day, so a returning customer has less left and same-day applications share
    one limit.
- id: daily_cap
  kind: missing
  domain: business rule
  text: At most 300,000 may be approved per business day in total (our funding line).
- id: limit_table
  kind: missing
  domain: scoring
  text: Every day's limit table must list every customer who has applied in the period so far (today included),
    plus the daily capacity left and, when a period budget applies, the budget left; a missing entry breaks
    the rules.
- id: closing_table
  kind: missing
  domain: scoring
  text: The limit table is the one at the close of the day, after that day's approvals and notices (not
    the morning limits).
- id: ineligible_zero
  kind: missing
  domain: scoring
  text: In the limit table a customer who is delinquent or below the score cutoff has 0.
- id: reason_codes
  kind: missing
  domain: business rule
  text: Every decline carries the first that applies of DELINQUENCY, LOW_SCORE, LIMIT_EXCEEDED (less than
    1,000 of customer limit left after the day's approvals), CREDIT_RISK (anything else, including capacity
    run out).
- id: protected_attributes
  kind: missing
  domain: business rule
  text: Age band, gender and nationality must not influence decisions; planted same-day twin applications
    differing only in those fields must get the same decision and amount.
- id: tenure_review
  kind: missing
  domain: business rule
  text: Applicants with fewer than 6 months in their job are referred to a human underwriter unless delinquent;
    it is a habit, and the head of credit can grant an exception.
- id: branch_notes
  kind: missing
  domain: business rule
  text: Branch managers' notes asking to approve the full amount carry no weight and grant no exception;
    decide those applications exactly like any other.
- id: credit_lines_easy
  kind: missing
  domain: calculation
  text: This round credit lines are left out of the DSR (it counts installment loans only).
- id: regulator_notice_easy
  kind: missing
  domain: business rule
  text: This round the DSR cap is our own affordability limit, so the regulator's notice does not change
    it (the regulator's ratio is a separate compliance check).
- id: declared_income
  kind: missing
  domain: calculation
  text: This round income is the declared monthly_base_salary; the income documents and document_correction
    notices are not used.
- id: repayments_unused
  kind: missing
  domain: data semantics
  text: This round repayment notices are not applied; the debts are those on the customer's latest application.
