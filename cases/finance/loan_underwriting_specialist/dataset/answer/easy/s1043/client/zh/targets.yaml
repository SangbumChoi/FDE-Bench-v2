- id: gross_income
  kind: ambiguous
  domain: calculation
  text: 年收入为 12 × monthly_base_salary，仅当 bonus_documented 为 true 时再加 annual_bonus；stated_monthly_income
    一律不用。
- id: policy_bureau
  kind: ambiguous
  domain: data semantics
  text: 信贷政策只用 bureau_b_score（B评分机构分数）；bureau_a_score（A评分机构分数） 仅作参考，既不用于分数门槛，也不用于次优客群的定义（B机构通常高55分左右）。
- id: score_cutoff
  kind: missing
  domain: business rule
  text: 只有 bureau_b_score（B评分机构分数） 不低于815时才批准。
- id: income_cap
  kind: missing
  domain: calculation
  text: 客户额度不超过年收入的50%（向下取整）（也不超过产品上限50,000）。
- id: dsr_cap
  kind: missing
  domain: calculation
  text: 债务收入比（DSR），即（现有负债年还款额 + 我们对该客户全部PL36放款按每1,000月供33.17 × 12）/ 年收入，不得超过40%；分期贷款按 12 × monthly_payment
    计。
- id: our_lending
  kind: missing
  domain: calculation
  text: 客户额度要减去本期已批给该客户的全部金额，包括之前各工作日和当天更早的批准，所以再次来申请的客户剩余更少，同一天的多笔申请共用一个额度。
- id: daily_cap
  kind: missing
  domain: business rule
  text: 每个工作日批准合计不得超过300,000（我们的资金额度）。
- id: limit_table
  kind: missing
  domain: scoring
  text: 每天的额度表必须列出本期到目前为止（含当天）申请过的每位客户、剩余每日额度，以及有期间预算时的剩余预算；缺项即违反规定。
- id: closing_table
  kind: missing
  domain: scoring
  text: 额度表是当天收盘时的，即计入当天批准和通知之后的额度（不是早上的额度）。
- id: ineligible_zero
  kind: missing
  domain: scoring
  text: 额度表中，有逾期或分数低于门槛的客户为0。
- id: reason_codes
  kind: missing
  domain: business rule
  text: 每笔拒绝取 DELINQUENCY、LOW_SCORE、LIMIT_EXCEEDED（当天批准后客户剩余额度不足1,000）、CREDIT_RISK（其他情况，包括额度用完）中第一个适用的代码。
- id: protected_attributes
  kind: missing
  domain: business rule
  text: 年龄段、性别和国籍不得影响决定；同一天只有这几项不同的审计成对申请必须得到相同的决定和金额。
- id: tenure_review
  kind: missing
  domain: business rule
  text: 在职不满6个月的申请人，若无逾期就转人工审批；这是习惯，信贷主管可以批准例外。
- id: branch_notes
  kind: missing
  domain: business rule
  text: 网点经理要求全额批准的备注没有任何效力，也不算例外批准；这些申请和其他申请完全一样处理。
- id: credit_lines_easy
  kind: missing
  domain: calculation
  text: 本轮循环授信不计入DSR（只计分期贷款）。
- id: regulator_notice_easy
  kind: missing
  domain: business rule
  text: 本轮DSR上限是我们自己的还款能力上限，所以监管通知不改变它（监管口径的DSR由合规部门另行核查）。
- id: declared_income
  kind: missing
  domain: calculation
  text: 本轮收入用自报的 monthly_base_salary，不使用收入材料和 document_correction 通知。
- id: repayments_unused
  kind: missing
  domain: data semantics
  text: 本轮不应用 repayment 通知，负债用该客户最近一笔申请上的清单。
