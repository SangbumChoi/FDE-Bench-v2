- id: gross_income
  kind: ambiguous
  domain: calculation
  text: 年收入为 12 × monthly_base_salary，仅当 bonus_documented 为 true 时再加 annual_bonus；stated_monthly_income
    一律不用。
- id: policy_bureau
  kind: ambiguous
  domain: data semantics
  text: 信贷政策只用 bureau_a_score（A评分机构分数）；bureau_b_score（B评分机构分数） 仅作参考，既不用于分数门槛，也不用于次优客群的定义（B机构通常高55分左右）。
- id: score_cutoff
  kind: missing
  domain: business rule
  text: 只有 bureau_a_score（A评分机构分数） 不低于745时才批准。
- id: income_cap
  kind: missing
  domain: calculation
  text: 客户额度不超过年收入的65%（向下取整）（也不超过产品上限50,000）。
- id: dsr_cap
  kind: missing
  domain: calculation
  text: 债务收入比（DSR），即（现有负债年还款额 + 我们对该客户全部PL36放款按每1,000月供33.17 × 12）/ 年收入，不得超过35%；分期贷款按 12 × monthly_payment
    计。
- id: our_lending
  kind: missing
  domain: calculation
  text: 客户额度要减去本期已批给该客户的全部金额，包括之前各工作日和当天更早的批准，所以再次来申请的客户剩余更少，同一天的多笔申请共用一个额度。
- id: daily_cap
  kind: missing
  domain: business rule
  text: 每个工作日批准合计不得超过250,000（我们的资金额度）。
- id: limit_table
  kind: missing
  domain: scoring
  text: 每天的额度表必须列出本期到目前为止（含当天）申请过的每位客户、剩余每日额度，以及有期间预算时的剩余预算；缺项即违反规定。
- id: closing_table
  kind: missing
  domain: scoring
  text: 额度表是当天收盘时的，即计入当天批准和通知之后的额度（不是早上的额度）。
- id: ineligible_zero
  kind: missing
  domain: scoring
  text: 额度表中，有逾期或分数低于门槛的客户为0。
- id: reason_codes_hard
  kind: missing
  domain: business rule
  text: 每笔拒绝取 DELINQUENCY、LOW_SCORE、SPLIT_APPLICATION（同一客户另一笔申请当天已批准）、LIMIT_EXCEEDED（当天批准后客户剩余额度不足1,000）、CREDIT_RISK
    中第一个适用的代码。
- id: protected_attributes
  kind: missing
  domain: business rule
  text: 年龄段、性别和国籍不得影响决定；同一天只有这几项不同的审计成对申请必须得到相同的决定和金额。
- id: tenure_review
  kind: missing
  domain: business rule
  text: 在职不满3个月的申请人，若无逾期就转人工审批；这是习惯，信贷主管可以批准例外。
- id: branch_notes
  kind: missing
  domain: business rule
  text: 网点经理要求全额批准的备注没有任何效力，也不算例外批准；这些申请和其他申请完全一样处理。
- id: credit_line_amortization
  kind: missing
  domain: calculation
  text: 循环授信视为已用余额分5年还清并加利息计入DSR（每年 余额 / 5 + 余额 × 利率），即使当前没有应还款也一样。
- id: stress_rate
  kind: missing
  domain: calculation
  text: 无抵押负债总额（现有余额加我们对该客户的全部PL36放款）超过60,000时，我们的放款在DSR中按13.4%计（每1,000月供33.89）。
- id: period_budget
  kind: missing
  domain: business rule
  text: 整个期间批准合计不得超过预算3,400,000。
- id: budget_notice
  kind: missing
  domain: business rule
  text: budget_change 通知自生效日起调整期间预算；预算降到已批准金额以下时，此后不能再批，但之前的批准不撤销。
- id: regulatory_notice
  kind: missing
  domain: business rule
  text: regulation_change 通知自生效日起，对所有决定和额度把DSR上限调整相应的百分点。
- id: near_prime_threshold
  kind: missing
  domain: business rule
  text: 次优客群客户指 bureau_a_score（A评分机构分数） 低于840的客户。
- id: near_prime_quota
  kind: missing
  domain: business rule
  text: 整个期间（累计，期末检查）批准金额的30%以上必须投向次优客群客户。
- id: verified_income
  kind: ambiguous
  domain: calculation
  text: 规则用核实后的工资，即自报工资与该客户材料上所示工资中的最低值；历史贷款的工资已经是核实过的。
- id: income_discrepancy
  kind: missing
  domain: business rule
  text: 材料显示的月基本工资比自报低25%以上的申请，若无逾期须转反欺诈团队人工审批。
- id: document_corrections
  kind: missing
  domain: business rule
  text: document_correction 通知自当天起替换材料；若相关申请处于转人工状态，必须当天重新决定（已批准或已拒绝的不动）。
- id: repayments
  kind: missing
  domain: data semantics
  text: 收到 repayment 通知后，该负债自当天起不再计入DSR和负债总额（即使当天申请清单里仍有它），客户额度随之增加。
- id: split_applications
  kind: missing
  domain: business rule
  text: 有客户把一笔资金需求拆成同一天的多笔申请；每位客户每天最多在客户额度内批准一笔，其余以 SPLIT_APPLICATION 拒绝。
