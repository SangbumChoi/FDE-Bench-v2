- id: gross_income
  kind: ambiguous
  domain: calculation
  text: 연간 총소득은 12 × monthly_base_salary에 bonus_documented가 true일 때만 annual_bonus를 더한 값이며, stated_monthly_income은
    쓰지 않습니다.
- id: policy_bureau
  kind: ambiguous
  domain: data semantics
  text: 여신 정책은 bureau_b_score(B평가사 점수)만 쓰고, bureau_a_score(A평가사 점수)는 참고용이라 기준 점수에도 중저신용 정의에도 쓰지 않습니다(B평가사
    점수가 55점가량 높게 나옴).
- id: score_cutoff
  kind: missing
  domain: business rule
  text: bureau_b_score(B평가사 점수)가 815점 이상일 때만 승인합니다.
- id: income_cap
  kind: missing
  domain: calculation
  text: 고객 한도는 연간 총소득의 50%(버림) 이하입니다(상품 최대 50,000 이하이기도 합니다).
- id: dsr_cap
  kind: missing
  domain: calculation
  text: DSR, 즉 (기존 부채의 연간 원리금 + 그 고객에 대한 저희 PL36 대출 전액의 1,000당 33.17 × 12) / 연간 총소득은 40% 이하여야 하며, 분할상환대출은
    12 × monthly_payment로 계산합니다.
- id: our_lending
  kind: missing
  domain: calculation
  text: 고객 한도에서는 이번 기간에 그 고객에게 승인한 금액을 이전 영업일분과 당일 앞선 승인분까지 모두 빼므로, 다시 온 고객은 남은 한도가 줄어 있고 같은 날 여러 건은 한도
    하나를 나눠 씁니다.
- id: daily_cap
  kind: missing
  domain: business rule
  text: 영업일마다 승인 합계는 300,000 이하여야 합니다(자금 조달 한도).
- id: limit_table
  kind: missing
  domain: scoring
  text: 날마다 한도표에는 이번 기간에 지금까지(오늘 포함) 신청한 모든 고객과 남은 일일 한도, 그리고 기간 예산이 있을 때는 남은 예산이 있어야 하며, 항목이 빠지면 규칙 위반입니다.
- id: closing_table
  kind: missing
  domain: scoring
  text: 한도표는 그날 승인과 통지를 반영한 그날 마감 시점의 것입니다(아침 기준 한도가 아님).
- id: ineligible_zero
  kind: missing
  domain: scoring
  text: 한도표에서 연체자나 점수 기준 미달 고객은 0입니다.
- id: reason_codes_hard
  kind: missing
  domain: business rule
  text: 거절 건마다 DELINQUENCY, LOW_SCORE, SPLIT_APPLICATION(같은 고객의 다른 신청이 그날 승인됨), LIMIT_EXCEEDED(그날 승인 후
    남은 고객 한도 1,000 미만), CREDIT_RISK 중 처음 해당하는 코드를 붙입니다.
- id: protected_attributes
  kind: missing
  domain: business rule
  text: 연령대, 성별, 국적은 판단에 영향을 주면 안 되며, 같은 날 이 항목만 다른 감사용 쌍은 같은 결정과 같은 금액을 받아야 합니다.
- id: tenure_review
  kind: missing
  domain: business rule
  text: 근속 6개월 미만 신청자는 연체자가 아니면 사람 심사역에게 넘기며, 관행이라서 여신 담당 임원이 예외를 승인할 수 있습니다.
- id: branch_notes
  kind: missing
  domain: business rule
  text: 전액 승인을 부탁하는 지점장 메모는 아무 의미가 없고 예외 승인도 아니므로, 그 신청은 다른 신청과 똑같이 판단합니다.
- id: credit_line_amortization
  kind: missing
  domain: calculation
  text: 마이너스통장은 사용 잔액을 5년에 걸쳐 갚는 것으로 보고 이자를 더해(잔액 / 5 + 잔액 × 이율, 연간) DSR에 넣으며, 지금 갚을 금액이 없어도 마찬가지입니다.
- id: stress_rate
  kind: missing
  domain: calculation
  text: 무담보 부채 총액(기존 잔액 + 그 고객에 대한 저희 PL36 대출 전액)이 60,000을 넘으면 저희 대출은 DSR에서 13.4%(월 1,000당 33.89)로 계산합니다.
- id: period_budget
  kind: missing
  domain: business rule
  text: 기간 전체 승인액은 예산 4,400,000을 넘을 수 없습니다.
- id: budget_notice
  kind: missing
  domain: business rule
  text: budget_change 통지는 효력일부터 기간 예산을 바꾸며, 이미 승인한 금액 아래로 줄어들면 그 뒤의 승인은 멈추지만 이전 승인은 취소되지 않습니다.
- id: regulatory_notice
  kind: missing
  domain: business rule
  text: regulation_change 통지는 효력일부터 모든 결정과 한도에 대해 DSR 상한을 그 포인트만큼 바꿉니다.
- id: near_prime_threshold
  kind: missing
  domain: business rule
  text: 중저신용 고객은 bureau_b_score(B평가사 점수) 880점 미만인 고객입니다.
- id: near_prime_quota
  kind: missing
  domain: business rule
  text: 기간 전체(누적, 기간 말 확인) 승인액의 25% 이상을 중저신용 고객에게 공급해야 합니다.
- id: verified_income
  kind: ambiguous
  domain: calculation
  text: 규칙에 쓰는 급여는 확인된 급여, 즉 기재 급여와 그 고객 서류에 적힌 급여 중 가장 낮은 금액이며, 과거 대출의 급여는 이미 확인된 값입니다.
- id: income_discrepancy
  kind: missing
  domain: business rule
  text: 서류상 월 기본급이 기재액보다 15% 넘게 낮은 신청은 연체자가 아니면 사기방지팀 수기 심사로 넘깁니다.
- id: document_corrections
  kind: missing
  domain: business rule
  text: document_correction 통지는 그날부터 서류를 대신하며, 해당 신청이 수기 심사 상태면 그날 바로 다시 결정해야 합니다(승인·거절 건은 그대로 둠).
- id: repayments
  kind: missing
  domain: data semantics
  text: repayment 통지가 오면 그날부터 그 부채는 DSR과 부채 총액에서 빠지고(같은 날 신청서 목록에 남아 있어도), 고객 한도가 늘어납니다.
- id: split_applications
  kind: missing
  domain: business rule
  text: 하나의 자금 수요를 같은 날 여러 건으로 나눠 신청하는 고객이 있으며, 고객당 하루 한 건만 고객 한도 안에서 승인하고 나머지는 SPLIT_APPLICATION으로 거절합니다.
