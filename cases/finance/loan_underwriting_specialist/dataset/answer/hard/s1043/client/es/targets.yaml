- id: gross_income
  kind: ambiguous
  domain: calculation
  text: El ingreso bruto anual es 12 x monthly_base_salary más annual_bonus solo cuando bonus_documented
    es true; stated_monthly_income no se usa nunca.
- id: policy_bureau
  kind: ambiguous
  domain: data semantics
  text: La política de crédito usa solo bureau_b_score (buró B); bureau_a_score (buró A) es de referencia
    y nunca se usa para un corte ni para definir near-prime (el buró B sale unos 55 puntos más alto).
- id: score_cutoff
  kind: missing
  domain: business rule
  text: Una solicitud solo se aprueba cuando la puntuación bureau_b_score (buró B) del cliente llega al
    menos a 815 puntos.
- id: income_cap
  kind: missing
  domain: calculation
  text: El límite de un cliente es como máximo el 50 % del ingreso bruto anual, redondeado hacia abajo
    (y como máximo los 50.000 del producto).
- id: dsr_cap
  kind: missing
  domain: calculation
  text: El ratio de endeudamiento, (servicio anual de las deudas existentes + 12 x 33,17 por cada 1.000
    de todos nuestros préstamos PL36 al cliente) / ingreso bruto anual, puede ser como máximo el 40 %;
    un préstamo a plazos cuenta 12 x su monthly_payment.
- id: our_lending
  kind: missing
  domain: calculation
  text: Al límite del cliente se le resta todo lo que le aprobamos en el período, en días anteriores y
    antes ese mismo día, así que a quien vuelve le queda menos y las solicitudes del mismo día comparten
    un límite.
- id: daily_cap
  kind: missing
  domain: business rule
  text: Como máximo se pueden aprobar 300.000 en total por día hábil (nuestra línea de financiación).
- id: limit_table
  kind: missing
  domain: scoring
  text: La tabla de límites de cada día debe incluir a todos los clientes que han solicitado en el período
    hasta ese momento (ese día incluido), la capacidad diaria restante y, cuando hay presupuesto del período,
    el presupuesto restante; que falte un valor incumple las reglas.
- id: closing_table
  kind: missing
  domain: scoring
  text: La tabla de límites es la del cierre del día, tras las aprobaciones y avisos de ese día (no los
    límites de la mañana).
- id: ineligible_zero
  kind: missing
  domain: scoring
  text: En la tabla de límites un cliente en mora o por debajo del corte de puntuación tiene 0.
- id: reason_codes_hard
  kind: missing
  domain: business rule
  text: Cada rechazo lleva el primero que aplique de DELINQUENCY, LOW_SCORE, SPLIT_APPLICATION (ese día
    se aprobó otra solicitud del cliente), LIMIT_EXCEEDED (menos de 1.000 de límite restante tras las
    aprobaciones del día), CREDIT_RISK.
- id: protected_attributes
  kind: missing
  domain: business rule
  text: El tramo de edad, el género y la nacionalidad no pueden influir; las parejas de auditoría del
    mismo día que solo difieren en esos campos deben recibir la misma decisión e importe.
- id: tenure_review
  kind: missing
  domain: business rule
  text: Los solicitantes con menos de 6 meses en su empleo se derivan a un analista humano salvo que estén
    en mora; es una costumbre y el director de riesgos puede autorizar una excepción.
- id: branch_notes
  kind: missing
  domain: business rule
  text: Las notas de directores de sucursal que piden aprobar el importe completo no cuentan ni son una
    excepción; esas solicitudes se deciden exactamente como cualquier otra.
- id: credit_line_amortization
  kind: missing
  domain: calculation
  text: Las líneas de crédito cuentan en el ratio como su saldo devuelto en 5 años más intereses (saldo
    / 5 + saldo x tipo al año), aunque no haya nada que pagar.
- id: stress_rate
  kind: missing
  domain: calculation
  text: Cuando la deuda sin garantía total (saldos existentes más todos nuestros préstamos PL36 al cliente)
    supera 60.000, nuestros préstamos cuentan en el ratio al 13,4 % (33,89 al mes por cada 1.000).
- id: period_budget
  kind: missing
  domain: business rule
  text: El importe aprobado en todo el período no puede superar el presupuesto de 4.400.000.
- id: budget_notice
  kind: missing
  domain: business rule
  text: Un aviso budget_change cambia el presupuesto del período desde su fecha de efecto; si baja de
    lo ya aprobado, se detienen las aprobaciones siguientes pero no se deshace nada.
- id: regulatory_notice
  kind: missing
  domain: business rule
  text: Un aviso regulation_change mueve el ratio máximo en sus puntos para toda decisión y todo límite
    desde su fecha de efecto.
- id: near_prime_threshold
  kind: missing
  domain: business rule
  text: Los clientes near-prime son los que tienen bureau_b_score (buró B) por debajo de 880.
- id: near_prime_quota
  kind: missing
  domain: business rule
  text: Al menos el 25 % del importe total aprobado en el período (acumulado, comprobado al final) debe
    ir a clientes near-prime.
- id: verified_income
  kind: ambiguous
  domain: calculation
  text: El salario que se usa es el verificado, el menor entre el declarado y cada salario que muestran
    los justificantes del cliente; los préstamos históricos ya muestran salarios verificados.
- id: income_discrepancy
  kind: missing
  domain: business rule
  text: Una solicitud cuyos justificantes muestran un salario base mensual más de un 15 % por debajo del
    declarado se deriva a prevención del fraude salvo mora.
- id: document_corrections
  kind: missing
  domain: business rule
  text: Un aviso document_correction sustituye un justificante desde ese día; si la solicitud afectada
    está derivada, hay que decidirla de nuevo ese mismo día (las aprobadas o rechazadas no se tocan).
- id: repayments
  kind: missing
  domain: data semantics
  text: Un aviso repayment saca la deuda del ratio y de la deuda total desde ese día, aunque una solicitud
    del mismo día todavía la liste, lo que sube el límite del cliente.
- id: split_applications
  kind: missing
  domain: business rule
  text: Algunos clientes fraccionan una necesidad en varias solicitudes el mismo día; como máximo se aprueba
    una por cliente y día, dentro del límite del cliente, y las demás se rechazan con SPLIT_APPLICATION.
