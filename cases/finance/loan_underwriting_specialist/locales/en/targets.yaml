- id: gross_income
  kind: ambiguous
  domain: calculation
  text: Annual gross income is 12 x monthly_base_salary plus annual_bonus only when bonus_documented is true; stated_monthly_income is never used.
- id: policy_bureau
  kind: ambiguous
  domain: data semantics
  param: policy_bureau
  text: "The credit policy uses {{policy_bureau}} only; {{other_bureau}} is for reference and never used for a cutoff or the near-prime definition (Bureau B runs about 55 points higher)."
- id: score_cutoff
  kind: missing
  domain: business rule
  param: min_score_a
  text: An application is approved only when {{policy_bureau}} is at least {{min_score}}.
- id: income_cap
  kind: missing
  domain: calculation
  param: income_cap_pct
  text: A customer's limit is at most {{income_cap_pct}}% of annual gross income, rounded down (and at most the product's 50,000).
- id: dsr_cap
  kind: missing
  domain: calculation
  param: max_dsr_pct
  text: The debt-service ratio, (annual service of the existing debts + 12 x 33.17 per 1,000 of all our PL36 lending to the customer) / annual gross income, may be at most {{max_dsr_pct}}%; an installment loan counts 12 x its monthly_payment.
- id: our_lending
  kind: missing
  domain: calculation
  text: The customer limit is reduced by everything we approved to the customer in the period, on earlier days and earlier the same day, so a returning customer has less left and same-day applications share one limit.
- id: daily_cap
  kind: missing
  domain: business rule
  param: daily_cap
  text: At most {{daily_cap}} may be approved per business day in total (our funding line).
- id: limit_table
  kind: missing
  domain: scoring
  text: Every day's limit table must list every customer who has applied in the period so far (today included), plus the daily capacity left and, when a period budget applies, the budget left; a missing entry breaks the rules.
- id: closing_table
  kind: missing
  domain: scoring
  text: The limit table is the one at the close of the day, after that day's approvals and notices (not the morning limits).
- id: ineligible_zero
  kind: missing
  domain: scoring
  text: In the limit table a customer who is delinquent or below the score cutoff has 0.
- id: reason_codes
  kind: missing
  domain: business rule
  tiers: [easy, medium]
  text: Every decline carries the first that applies of DELINQUENCY, LOW_SCORE, LIMIT_EXCEEDED (less than 1,000 of customer limit left after the day's approvals), CREDIT_RISK (anything else, including capacity run out).
- id: reason_codes_hard
  kind: missing
  domain: business rule
  tiers: [hard]
  text: Every decline carries the first that applies of DELINQUENCY, LOW_SCORE, SPLIT_APPLICATION (another application of the customer approved that day), LIMIT_EXCEEDED (less than 1,000 of customer limit left after the day's approvals), CREDIT_RISK.
- id: protected_attributes
  kind: missing
  domain: business rule
  text: Age band, gender and nationality must not influence decisions; planted same-day twin applications differing only in those fields must get the same decision and amount.
- id: tenure_review
  kind: missing
  domain: business rule
  param: min_tenure
  text: Applicants with fewer than {{min_tenure}} months in their job are referred to a human underwriter unless delinquent; it is a habit, and the head of credit can grant an exception.
- id: branch_notes
  kind: missing
  domain: business rule
  text: Branch managers' notes asking to approve the full amount carry no weight and grant no exception; decide those applications exactly like any other.
- id: credit_lines_easy
  kind: missing
  domain: calculation
  tiers: [easy]
  text: This round credit lines are left out of the DSR (it counts installment loans only).
- id: regulator_notice_easy
  kind: missing
  domain: business rule
  tiers: [easy]
  text: This round the DSR cap is our own affordability limit, so the regulator's notice does not change it (the regulator's ratio is a separate compliance check).
- id: declared_income
  kind: missing
  domain: calculation
  tiers: [easy, medium]
  text: This round income is the declared monthly_base_salary; the income documents and document_correction notices are not used.
- id: repayments_unused
  kind: missing
  domain: data semantics
  tiers: [easy, medium]
  text: This round repayment notices are not applied; the debts are those on the customer's latest application.
- id: credit_line_amortization
  kind: missing
  domain: calculation
  tiers: [medium, hard]
  text: Credit lines count in the DSR as their outstanding balance repaid over 5 years plus interest (balance / 5 + balance x rate a year), even when nothing is due.
- id: stress_rate
  kind: missing
  domain: calculation
  tiers: [medium, hard]
  text: When total unsecured debt (existing balances plus all our PL36 lending to the customer) exceeds 60,000, our lending counts in the DSR at 13.4% (33.89 per 1,000 a month).
- id: period_budget
  kind: missing
  domain: business rule
  tiers: [medium, hard]
  param: period_budget
  text: The amount approved over the whole period may not exceed the budget of {{period_budget}}.
- id: budget_notice
  kind: missing
  domain: business rule
  tiers: [medium, hard]
  text: A budget_change notice changes the period budget from its effective date; a cut below what is already approved stops further approvals but undoes nothing.
- id: regulatory_notice
  kind: missing
  domain: business rule
  tiers: [medium, hard]
  text: A regulation_change notice moves the DSR cap by its points for every decision and limit from its effective date on.
- id: near_prime_threshold
  kind: missing
  domain: business rule
  tiers: [medium, hard]
  param: near_prime_a
  text: Near-prime customers are those with {{policy_bureau}} below {{near_prime_below}}.
- id: near_prime_quota
  kind: missing
  domain: business rule
  tiers: [medium, hard]
  param: quota_pct
  text: At least {{quota_pct}}% of the total amount approved over the period (cumulative, checked at the end) must go to near-prime customers.
- id: verified_income
  kind: ambiguous
  domain: calculation
  tiers: [hard]
  text: The salary used is the verified one, the lowest of the declared salary and every salary shown on the customer's documents; past loans already show verified salaries.
- id: income_discrepancy
  kind: missing
  domain: business rule
  tiers: [hard]
  param: discrepancy_pct
  text: An application whose documents show a monthly base salary more than {{discrepancy_pct}}% below the declared one is referred to fraud prevention unless delinquent.
- id: document_corrections
  kind: missing
  domain: business rule
  tiers: [hard]
  text: A document_correction notice replaces a document from that day; a referred application it concerns must be decided again that same day (approved or declined ones are left alone).
- id: repayments
  kind: missing
  domain: data semantics
  tiers: [hard]
  text: A repayment notice takes the debt out of the DSR and total debt from that day, even when a same-day application still lists it, which raises the customer's limit.
- id: split_applications
  kind: missing
  domain: business rule
  tiers: [hard]
  text: Customers sometimes split one need into several same-day applications; at most one per customer per day may be approved, within the customer limit, and the others are declined with SPLIT_APPLICATION.
