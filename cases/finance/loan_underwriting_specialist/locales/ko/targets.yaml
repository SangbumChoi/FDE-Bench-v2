- id: gross_income
  text: 연간 총소득은 12 × 월_기본급 + 연간_상여금이며, 상여금은 상여금_증빙 = 예일 때만 인정하고 신고_월소득은 쓰지 않습니다.
- id: policy_bureau
  text: 정책은 {{policy_bureau}}만 쓰고(최저 {{min_score}}점), {{other_bureau}}는 참고용이라 어떤 기준에도 쓰지 않습니다(B평가사 점수가 A평가사보다 50점가량 높게 나옴).
- id: dsr_rule
  text: 대출 후 DSR은 연간 총소득의 {{max_dsr_pct}}% 이하여야 하며, 분할상환대출은 12 × 월상환액, 신규 대출은 승인 한도 기준 월 상환액 × 12로 계산합니다.
- id: interim_scope
  text: 이번 회차의 임시 정책은 DSR에 분할상환대출만 넣고(마이너스통장 제외), 신청자가 기재한 급여를 쓰며(소득 서류는 실행 전에 확인), 신청 건을 하나씩 따로 판단합니다(중복 신청 확인 없음, DUPLICATE 미사용).
- id: declared_income_scope
  text: 이번 회차는 신청자가 기재한 급여를 쓰고(소득 서류는 실행 전에 확인), 신청 건을 하나씩 따로 판단합니다(중복 신청 확인 없음, DUPLICATE 미사용).
- id: credit_line_amortization
  text: 마이너스통장은 DSR에서 잔액을 5년에 걸쳐 갚는 것으로 보고 잔액 / 5 + 잔액 × 금리로 계산하며, 상환할 금액이 없어도 반영합니다.
- id: stress_add_on
  text: 대출 후 무담보 부채 총액(기존 잔액 + 신규 한도)이 60,000을 넘으면 신규 대출 상환액을 11.9% + 1.5%p로 계산합니다.
- id: limit_caps
  text: 승인 한도는 1,000 이상, min(50,000, 연간 총소득, 신청금액) 이하여야 합니다.
- id: reason_codes
  text: 모든 거절에는 DELINQUENCY, LOW_SCORE, DSR_EXCEEDED(1,000도 DSR이나 한도를 못 맞춤), CREDIT_RISK 순으로 처음 해당하는 사유 코드가 필요하고, 현재 연체는 항상 거절합니다.
- id: protected_attributes
  text: 연령대, 성별, 국적은 판단에 영향을 주면 안 되며, 이 컬럼만 다른 쌍둥이 신청 건은 같은 결정과 한도를 받아야 합니다.
- id: near_prime_quota
  text: 승인 금액 총액의 {{quota_pct}}% 이상을 {{policy_bureau}} {{near_prime_below}}점 미만인 중저신용자에게 공급해야 합니다.
- id: verified_income
  text: 규칙에 쓰는 급여는 확인된 급여로, 신청서의 월_기본급과 그 건의 소득 증빙 서류(급여명세서, 재직·소득확인서)에 적힌 금액 중 가장 낮은 값이며, 과거 신청 건은 이미 확인된 급여입니다.
- id: income_discrepancy
  text: 서류상 월 기본급이 신청서 기재액보다 {{discrepancy_pct}}% 넘게 낮은 신청 건은 사기방지팀 수기 심사로 넘겨야 하며, 현재 연체가 있으면 거절합니다.
- id: duplicate_applications
  text: 같은 사람이 신청번호를 달리해 두 번 신청한 건이 있고, 신용정보_고유번호가 같으면 같은 사람이므로 한 건만 승인할 수 있으며 나머지는 DUPLICATE로 거절합니다.
- id: tenure_review
  text: 현직장 근속 {{min_tenure}}개월 미만인 신청자는 수기 심사로 넘기며, 현재 연체가 있으면 거절합니다.
- id: profit_metric
  text: 품질은 기대 수익으로, 승인 건마다 한도 × 10% 마진 − 실제 PD × 0.60 × 한도이며 PD는 승인 금액으로 상환 부담이 커질수록 올라가고, 수기 심사는 건당 60의 비용, 거절은 0입니다.
