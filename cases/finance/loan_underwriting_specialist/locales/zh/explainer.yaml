# The explainer's case texts in Simplified Chinese (English comes from case.yaml).
role: 贷款审批专员
task_type: 决策程序
deliverable_spec: |
  一个 program/ 文件夹，其中的 underwriter.py 定义 on_day(day)。引擎只加载一次，在隐藏期间的每个工作日按顺序、
  在同一进程中调用一次（模块级状态在两次调用之间保留）；每次调用10秒，只用 Python 标准库，运行时不联网，也不能访问数据文件。
  day = {"date", "day_index", "days_in_period", "period_end", "applications": [...], "notices": [...],
  "book": {"loans": [...], "referred": [...]}}，与试点日输入文件完全一致。
  返回 {"decisions": [{"application_id": str, "decision": "approve" | "decline" | "refer",
  "amount": int (批准金额；非 approve 时为 0), "reason_code": str (每笔拒绝必填；其他情况为 "")}],
  "limit_table": {"customers": {customer_id: int}, "daily_capacity_remaining": int,
  "period_budget_remaining": int 或 null}}，格式同试点日输出文件。
  reason_code 取 DELINQUENCY | LOW_SCORE | SPLIT_APPLICATION | LIMIT_EXCEEDED | CREDIT_RISK 之一。
tiers:
  easy: >-
    单一产品（PL36）的每日审批核心：收入 = 12 × 自报基本工资 + 有证明的奖金；政策评分机构的分数及门槛；当前逾期一律拒绝；
    客户额度 = min(50,000, 收入上限, DSR余量) 减去本期已借给该客户的金额（之前各天及当天），其中DSR只计分期贷款（本轮这是
    客户自己的还款能力上限，监管口径的比率是另外的合规检查）；每日放款上限；按固定顺序取的拒绝原因代码；绝不使用受保护属性
    （审计放入的成对申请）；按在职时间转人工的习惯；每天的收盘额度表（客户额度和剩余的每日额度）。输入中的通知本轮不在范围内。
  medium: >-
    在 easy 基础上，DSR计入循环授信（余额按5年偿还并加利息），负债总额超过60,000时使用压力利率，加上期间预算、按累计批准金额
    计算的次优客群承诺比例，以及两类通知：监管机构对自某日起决定的贷款下调DSR上限，资金部削减预算。
  hard: >-
    在 medium 基础上，加入收入核实（取自报工资与材料工资中的较低者；差距过大则转人工）、材料更正（转人工的申请在更正材料送达
    当天重新决定）、还款通知（已还清的负债自通知送达当天起不再计入DSR）以及拆分申请（每位客户每天最多批准一笔，其余以
    SPLIT_APPLICATION 拒绝）。
rules:
  decision_complete: 每次调用都要对当天收到的每笔申请返回一个格式正确的决定（批准金额为1,000到申请金额之间的整数，否则为0），且不对其他任何东西作出决定；调用失败或超时也算违反。
  delinquency_decline: 有当前逾期的客户，其申请一律拒绝。
  score_cutoff: 只有政策评分机构的分数（{{policy_bureau}}）不低于{{min_score}}时才能批准。
  customer_limit: 客户某天获批的金额（其全部申请合计）不得超过其当天早上的客户额度，即 min(50,000, 年收入的{{income_cap_pct}}%, DSR {{max_dsr_pct}}% 下的余量) 减去本期此前已批给他的金额。这条规则绝不放宽：收入上限是监管要求，从 medium 起DSR上限也是（medium 及以上，上限自监管通知的生效日起变动；hard 中计入还款和核实后收入）；在 easy 中，DSR上限是针对分期贷款的自有还款能力上限，没有例外，监管通知也不影响它。
  daily_cap: 一天的批准金额不得超过每日放款上限{{daily_cap}}（资金额度）。
  period_budget: 任何一天的批准都不得使本期批准累计超过当天现行的期间预算{{period_budget}}（资金部削减预算后少400,000）；预算削减到已批金额以下时，会停止后续批准，但不撤销之前的批准。
  reason_code_required: 每笔拒绝都要附上计入当天批准后的主要原因代码，取 DELINQUENCY、LOW_SCORE、SPLIT_APPLICATION（hard）、LIMIT_EXCEEDED（剩余客户额度不足1,000）、CREDIT_RISK 中第一个适用的。
  no_protected_attributes: 年龄段、性别和国籍绝不影响决定；审计放入的、只在这几项上不同的成对申请必须得到相同的决定和金额。
  near_prime_quota: 整个期间批准总额中至少{{quota_pct}}%投向次优客群客户（{{policy_bureau}} 低于{{near_prime_below}}），这是对监管机构的承诺。
  income_discrepancy_refer: 材料显示的月基本工资比自报低{{discrepancy_pct}}%以上的申请转人工审批（因逾期拒绝的除外）；这是与监管机构约定的反欺诈流程。
  redecide_on_documents: 已转人工的申请，若其更正后的收入材料随通知送达，须当天重新决定（对客户的服务承诺）。
  split_applications: 每位客户每天最多批准一笔申请；把一笔资金需求拆成同一天的多笔申请不能绕过额度。
  tenure_review: 现职在职时间不满{{min_tenure}}个月的申请人转人工审批（因逾期拒绝的除外）；这是信贷主管可以批准例外的习惯。
