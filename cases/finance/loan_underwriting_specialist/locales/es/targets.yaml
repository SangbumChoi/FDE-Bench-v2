- id: interface
  text: El entregable es program/underwriter.py con on_day(day), llamado una vez por día hábil, en orden y en un solo proceso (el estado puede vivir en variables de módulo), 10 s por llamada, solo biblioteca estándar y sin archivos de datos en ejecución; devuelve una decisión por solicitud del día y la tabla de límites del día.
- id: evaluation_period
  text: El programa se evalúa sobre los 20 días hábiles del 2 al 27 de noviembre de 2026, que no están en los datos; todas sus solicitudes son nuevas.
- id: gross_income
  text: El ingreso bruto anual es 12 x monthly_base_salary más annual_bonus solo cuando bonus_documented es true; stated_monthly_income no se usa nunca.
- id: policy_bureau
  text: "La puntuación de la política es {{policy_bureau}} (mínimo {{min_score}}); {{other_bureau}} es solo de referencia y nunca se usa para un corte (el buró B sale unos 55 puntos más alto)."
- id: customer_limit
  text: Un cliente puede pedir como máximo mín(50.000, el {{income_cap_pct}} % del ingreso anual redondeado hacia abajo, el margen de ratio de endeudamiento) menos todo lo que ya le aprobamos en el período; todas sus aprobaciones de un día juntas deben caber, así que las solicitudes del mismo día comparten un límite y a quien vuelve le queda menos.
- id: dsr_rule
  text: Ratio de endeudamiento = (servicio anual de las deudas existentes, los préstamos a plazos a 12 x monthly_payment, + 12 x 33,17 por cada 1.000 de todos nuestros préstamos PL36 al cliente) / ingreso anual, como máximo el {{max_dsr_pct}} %.
- id: easy_scope
  text: En esta ronda el ratio máximo es el propio límite de solvencia del cliente (el ratio del regulador es un control aparte de cumplimiento normativo), las líneas de crédito quedan fuera de él, el ingreso es el salario declarado, las deudas son las de la última solicitud del cliente y ningún aviso se aplica (ni regulatorio, ni de presupuesto, ni amortizaciones, ni documentos).
- id: daily_cap
  text: Como máximo se pueden aprobar {{daily_cap}} en total por día hábil (nuestra línea de financiación).
- id: limit_table
  text: Cada día el programa devuelve la tabla de límites al cierre, tras las aprobaciones y avisos del día - cada cliente visto hasta entonces con lo que aún puede pedir (0 si está en mora o bajo el corte), la capacidad diaria restante y, cuando hay presupuesto del período, el presupuesto restante.
- id: reason_codes
  text: Cada rechazo lleva el primero que aplique de DELINQUENCY, LOW_SCORE, LIMIT_EXCEEDED (menos de 1.000 de límite restante tras las aprobaciones del día), CREDIT_RISK (todo lo demás, incluida la capacidad agotada).
- id: reason_codes_hard
  text: Cada rechazo lleva el primero que aplique de DELINQUENCY, LOW_SCORE, SPLIT_APPLICATION (ese día se aprobó otra solicitud del cliente), LIMIT_EXCEEDED (menos de 1.000 de límite restante), CREDIT_RISK.
- id: protected_attributes
  text: El tramo de edad, el género y la nacionalidad no pueden influir; las parejas de auditoría del mismo día que solo difieren en esos campos deben recibir la misma decisión e importe.
- id: tenure_review
  text: Los solicitantes con menos de {{min_tenure}} meses en su empleo se derivan a un analista humano salvo que estén en mora; es una costumbre y el director de riesgos puede autorizar una excepción.
- id: profit_metric
  text: El objetivo es el mayor beneficio esperado tras pérdidas y costes de derivación - una aprobación gana el 10 % de su importe en la vida del préstamo y pierde el 60 % si el cliente entra en impago, con el riesgo de impago creciendo con la carga de deuda del cliente (es decir, con todo lo que se le presta), y cada derivación cuesta 60 de tiempo de un analista.
- id: credit_line_amortization
  text: Las líneas de crédito cuentan en el ratio como su saldo devuelto en 5 años más intereses (saldo / 5 + saldo x tipo al año), aunque no haya nada que pagar.
- id: stress_rate
  text: Cuando la deuda sin garantía total (saldos existentes más todos nuestros préstamos PL36 al cliente) supera 60.000, nuestros préstamos cuentan en el ratio al 13,4 % (33,89 al mes por cada 1.000).
- id: period_budget
  text: El importe aprobado en todo el período no puede superar el presupuesto de {{period_budget}}, y un aviso budget_change lo modifica desde su fecha de efecto.
- id: near_prime_quota
  text: Al menos el {{quota_pct}} % del importe total aprobado en el período (acumulado, comprobado al final) debe ir a clientes near-prime con {{policy_bureau}} por debajo de {{near_prime_below}}.
- id: regulatory_notice
  text: Un aviso regulation_change mueve el ratio máximo en sus puntos para toda decisión y todo límite desde su fecha de efecto.
- id: medium_scope
  text: En esta ronda el ingreso es el salario declarado y las deudas son las de la última solicitud del cliente; no se usan los avisos repayment ni document_correction.
- id: verified_income
  text: El salario que se usa es el verificado, el menor entre el declarado y cada salario que muestran los justificantes del cliente; los préstamos históricos ya muestran salarios verificados.
- id: income_discrepancy
  text: Una solicitud cuyos justificantes muestran un salario base mensual más de un {{discrepancy_pct}} % por debajo del declarado se deriva a prevención del fraude salvo mora.
- id: document_corrections
  text: Un aviso document_correction sustituye un justificante desde ese día; si la solicitud afectada está derivada, hay que decidirla de nuevo ese mismo día (las aprobadas o rechazadas no se tocan).
- id: repayments
  text: Un aviso repayment saca la deuda del ratio y de la deuda total desde ese día, aunque una solicitud del mismo día todavía la liste, lo que sube el límite del cliente.
- id: split_applications
  text: Algunos clientes fraccionan una necesidad en varias solicitudes el mismo día; como máximo se aprueba una por cliente y día, dentro del límite del cliente, y las demás se rechazan con SPLIT_APPLICATION.
- id: branch_notes
  text: Las notas de directores de sucursal que piden aprobar el importe completo no cuentan; esas solicitudes se deciden como cualquier otra, nunca por encima de un límite.
