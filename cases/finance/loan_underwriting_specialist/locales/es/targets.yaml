- id: gross_income
  text: El ingreso bruto anual es 12 x monthly_base_salary más annual_bonus solo cuando bonus_documented es true; stated_monthly_income no se usa nunca.
- id: policy_bureau
  text: "La política de crédito usa solo {{policy_bureau}}; {{other_bureau}} es de referencia y nunca se usa para un corte ni para definir near-prime (el buró B sale unos 55 puntos más alto)."
- id: score_cutoff
  text: "Una solicitud solo se aprueba cuando la puntuación {{policy_bureau}} del cliente llega al menos a {{min_score}} puntos."
- id: income_cap
  text: El límite de un cliente es como máximo el {{income_cap_pct}} % del ingreso bruto anual, redondeado hacia abajo (y como máximo los 50.000 del producto).
- id: dsr_cap
  text: El ratio de endeudamiento, (servicio anual de las deudas existentes + 12 x 33,17 por cada 1.000 de todos nuestros préstamos PL36 al cliente) / ingreso bruto anual, puede ser como máximo el {{max_dsr_pct}} %; un préstamo a plazos cuenta 12 x su monthly_payment.
- id: our_lending
  text: Al límite del cliente se le resta todo lo que le aprobamos en el período, en días anteriores y antes ese mismo día, así que a quien vuelve le queda menos y las solicitudes del mismo día comparten un límite.
- id: daily_cap
  text: Como máximo se pueden aprobar {{daily_cap}} en total por día hábil (nuestra línea de financiación).
- id: limit_table
  text: La tabla de límites de cada día debe incluir a todos los clientes que han solicitado en el período hasta ese momento (ese día incluido), la capacidad diaria restante y, cuando hay presupuesto del período, el presupuesto restante; que falte un valor incumple las reglas.
- id: closing_table
  text: La tabla de límites es la del cierre del día, tras las aprobaciones y avisos de ese día (no los límites de la mañana).
- id: ineligible_zero
  text: En la tabla de límites un cliente en mora o por debajo del corte de puntuación tiene 0.
- id: reason_codes
  text: Cada rechazo lleva el primero que aplique de DELINQUENCY, LOW_SCORE, LIMIT_EXCEEDED (menos de 1.000 de límite restante tras las aprobaciones del día), CREDIT_RISK (todo lo demás, incluida la capacidad agotada).
- id: reason_codes_hard
  text: Cada rechazo lleva el primero que aplique de DELINQUENCY, LOW_SCORE, SPLIT_APPLICATION (ese día se aprobó otra solicitud del cliente), LIMIT_EXCEEDED (menos de 1.000 de límite restante tras las aprobaciones del día), CREDIT_RISK.
- id: protected_attributes
  text: El tramo de edad, el género y la nacionalidad no pueden influir; las parejas de auditoría del mismo día que solo difieren en esos campos deben recibir la misma decisión e importe.
- id: tenure_review
  text: Los solicitantes con menos de {{min_tenure}} meses en su empleo se derivan a un analista humano salvo que estén en mora; es una costumbre y el director de riesgos puede autorizar una excepción.
- id: branch_notes
  text: Las notas de directores de sucursal que piden aprobar el importe completo no cuentan ni son una excepción; esas solicitudes se deciden exactamente como cualquier otra.
- id: credit_lines_easy
  text: En esta ronda las líneas de crédito quedan fuera del ratio de endeudamiento (solo cuentan los préstamos a plazos).
- id: regulator_notice_easy
  text: En esta ronda el ratio máximo es nuestro propio límite de solvencia, así que el aviso del regulador no lo cambia (el ratio del regulador es un control aparte de cumplimiento normativo).
- id: declared_income
  text: En esta ronda el ingreso es el monthly_base_salary declarado; no se usan los justificantes de ingresos ni los avisos document_correction.
- id: repayments_unused
  text: En esta ronda no se aplican los avisos repayment; las deudas son las de la última solicitud del cliente.
- id: credit_line_amortization
  text: Las líneas de crédito cuentan en el ratio como su saldo devuelto en 5 años más intereses (saldo / 5 + saldo x tipo al año), aunque no haya nada que pagar.
- id: stress_rate
  text: Cuando la deuda sin garantía total (saldos existentes más todos nuestros préstamos PL36 al cliente) supera 60.000, nuestros préstamos cuentan en el ratio al 13,4 % (33,89 al mes por cada 1.000).
- id: period_budget
  text: El importe aprobado en todo el período no puede superar el presupuesto de {{period_budget}}.
- id: budget_notice
  text: Un aviso budget_change cambia el presupuesto del período desde su fecha de efecto; si baja de lo ya aprobado, se detienen las aprobaciones siguientes pero no se deshace nada.
- id: regulatory_notice
  text: Un aviso regulation_change mueve el ratio máximo en sus puntos para toda decisión y todo límite desde su fecha de efecto.
- id: near_prime_threshold
  text: Los clientes near-prime son los que tienen {{policy_bureau}} por debajo de {{near_prime_below}}.
- id: near_prime_quota
  text: Al menos el {{quota_pct}} % del importe total aprobado en el período (acumulado, comprobado al final) debe ir a clientes near-prime.
- id: verified_income
  text: El salario que se usa es el verificado, el menor entre el declarado y cada salario que muestran los justificantes del cliente; los préstamos históricos ya muestran salarios verificados.
- id: income_discrepancy
  text: Una solicitud cuyos justificantes muestran un salario base mensual más de un {{discrepancy_pct}} % por debajo del declarado se deriva a prevención del fraude salvo mora.
- id: document_corrections
  text: Un aviso document_correction sustituye un justificante desde ese día; si la solicitud afectada está derivada, hay que decidirla de nuevo ese mismo día (las aprobadas o rechazadas no se tocan).
- id: repayments
  text: Un aviso repayment saca la deuda del ratio y de la deuda total desde ese día, aunque una solicitud del mismo día todavía la liste, lo que sube el límite del cliente.
- id: split_applications
  text: Algunos clientes fraccionan una necesidad en varias solicitudes el mismo día; como máximo se aprueba una por cliente y día, dentro del límite del cliente, y las demás se rechazan con SPLIT_APPLICATION.
