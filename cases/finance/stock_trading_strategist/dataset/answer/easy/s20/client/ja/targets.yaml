- id: interface
  kind: missing
  domain: data semantics
  text: 納品物は program/strategy.py の on_day(day) で、day = {market, portfolio, notices} です。毎回の大引け後に呼ばれ、注文は翌営業日に執行されます。80回の呼び出しは1つのプロセスで行われるので状態はモジュール変数に持てます。1回10秒、標準ライブラリのみ、実行中のデータファイル参照不可で、{orders,
    status} を返します。その日のメッセージは入力の notices としてのみ届き、メールでは届きません。
- id: evaluation_period
  kind: missing
  domain: scoring
  text: プログラムはヒストリーの次の80営業日（2026年5月18日〜9月4日）に、現金 10,000,000、保有なしから再生されます。その期間の通知は実行中に、届いた日に1回だけ入ってきます。
- id: fills
  kind: missing
  domain: calculation
  text: '"open" の注文は翌営業日の寄り付きの板寄せでスプレッドなしで約定し、"p10" の注文は寄り付き10分後の価格に半スプレッドを加減して約定します。売りが買いより先に執行されます。'
- id: costs
  kind: missing
  domain: calculation
  text: 手数料は約定代金の0.04%、1約定あたり最低20です。
- id: simple_engine
  kind: missing
  domain: calculation
  text: 今回のラウンドではエンジンは簡易モードで動きます（取引税なし、売却代金は即時に使える、マーケットインパクトなし）。
- id: lots_and_cash
  kind: ambiguous
  domain: business rule
  text: 株数は売買単位（100株、値がさ株は10株）の倍数で、空売りのない現金口座です。使える現金を超える買いは丸ごと拒否されます。
- id: halts
  kind: missing
  domain: data semantics
  text: 売買停止中の銘柄は株価データがなく注文はすべて拒否され、再開時に停止中の値動きがまとめて反映されます。新しい停止は始まった時点でしかわかりません。
- id: upcoming_split
  kind: missing
  domain: data semantics
  text: OMNY は2026年7月3日付で1株を2株に分割し、その前日の晩から保有株数は2倍になり、株価データも調整し直されます。
- id: earnings
  kind: missing
  domain: data semantics
  text: 各社は四半期ごとに大引け後、サプライズ（%）付きで決算を発表し、株価の反応は大半が翌朝のギャップと寄り付き直後に出て、一部はその後の数日続きます。
- id: restricted_list
  kind: missing
  domain: business rule
  text: NEXO, PYRO は社内の売買制限リストに載っています（コーポレートファイナンス部門が助言中）。指数とデータには残りますが、この口座は買い注文を一切出せません。デスクのデータベースにある売買制限リストの履歴は、解除済みの過去の登録だけです。
- id: restricted_addition
  kind: missing
  domain: business rule
  text: コンプライアンスが売買制限リストに銘柄を追加したら（restricted_list_add の通知）、効力発生日からその銘柄の買い注文は禁止で、保有分は効力発生日を1営業日目として3営業日目の大引けまでに売り切ります。
- id: large_order_approval
  kind: missing
  domain: business rule
  text: 直近20営業日の平均出来高の9%を超える注文にはデスク責任者の事前承認が必要なので、プログラムは出してはいけません。売買制限に追加された銘柄を売り切る注文も例外ではないため、期限内に売り切れる大きさに保有を抑える必要があります。デスクの方針なのでデスク責任者は例外を認められます。
- id: raw_volumes
  kind: ambiguous
  domain: data semantics
  text: 価格は分割・併合を調整済みですが出来高は未調整です。2026年5月7日の XIPH の5株→1株の併合のため、それ以前の出来高は現在の株数に直すと5倍大きく、大口注文の基準に影響します。
- id: status_table
  kind: missing
  domain: scoring
  text: 毎回の呼び出しは引けたばかりの時点の状況を返します。資産に対する銘柄・業種のウェイト（%）、翌営業日の買付余力（受渡済み現金 + next_date までに使える代金 − 通知済みで未払いの出金、0以上）、資産
    + 出金支払額のこれまでの最高値（当初資金を含む）からのドローダウン（%）で、0.05ポイントまたは 1 + 0.1% 以内なら正解、品質の20%を占めます。
- id: objective
  kind: missing
  domain: scoring
  text: 品質は 0.8 × リターン点 + 0.2 × 表の正確さです。リターン点は、初日に買って持ち続けた指数に対する口座の超過分（最終純資産 + お客様への出金支払額 − 指数の価値）を、お客様の基準プログラムの超過分で割った値で、指数を下回れば0です（基準プログラムが指数を上回る幅が資金の5%に満たない場合や指数を下回る場合は、比較の基準は基準プログラムの最終価値より資金の5%低い水準です）。
- id: easy_scope
  kind: missing
  domain: business rule
  text: 今回のラウンドは、売買の基本、売買制限リストとその追加、大口注文のルール、ステータス表だけを見ます。保有上限はなく、出金・上限変更・サーキットブレーカーの通知とメモは何も変えません。
