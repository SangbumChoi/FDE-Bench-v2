- id: interface
  kind: missing
  domain: data semantics
  text: The deliverable is program/strategy.py with on_day(day), day = {market, portfolio, notices}; called
    after each close, orders execute next session; one process for all 80 calls, so state can live in
    module variables; 10 s per call, standard library, no data files at run time; it returns {orders,
    status}. The day's messages reach it only as notices in its input, never as e-mail.
- id: evaluation_period
  kind: missing
  domain: scoring
  text: The program is replayed on the 80 sessions after the history (18 May to 4 September 2026), starting
    from 10,000,000 in cash and no positions; the notices of those sessions arrive only at run time, each
    once, on the day received.
- id: fills
  kind: missing
  domain: calculation
  text: An order "at open" trades in the next session's opening auction at the open without spread; "at
    p10" fills at the price 10 minutes after the open plus or minus half the spread; sells execute before
    buys.
- id: costs
  kind: missing
  domain: calculation
  text: Commission is 0.04% of the traded value with a minimum of 20 per filled order.
- id: simple_engine
  kind: missing
  domain: calculation
  text: This round the engine runs in its simple mode (no sales tax, sale proceeds usable at once, no
    market impact).
- id: lots_and_cash
  kind: ambiguous
  domain: business rule
  text: Quantities are whole board lots (100 shares, 10 for high-priced stocks); cash account with no
    short selling; a buy that exceeds the usable cash is rejected whole.
- id: halts
  kind: missing
  domain: data semantics
  text: A halted stock has no bars and every order for it is rejected; it reopens with the price move
    accumulated during the halt; new halts are only known when they start.
- id: upcoming_split
  kind: missing
  domain: data semantics
  text: OMNY splits 2-for-1 effective 3 July 2026; positions double and its bars are re-adjusted from
    the evening before.
- id: earnings
  kind: missing
  domain: data semantics
  text: Companies report quarterly after the close with a surprise in %; the price reacts mostly in the
    next morning's gap and first minutes, and partly over the following sessions.
- id: restricted_list
  kind: missing
  domain: business rule
  text: 'MEDQ, GLAC are on the firm''s restricted list (its corporate finance team advises them): the
    book may never place a buy order for them, although they stay in the index and the data. The restricted-list
    history in the desk database holds only earlier, lifted entries.'
- id: restricted_addition
  kind: missing
  domain: business rule
  text: When compliance adds a stock to the restricted list (restricted_list_add notice), the book places
    no buy order for it from the effective date and sells out its holding by the close of the 2th session
    counting the effective session as the first.
- id: large_order_approval
  kind: missing
  domain: business rule
  text: Any order above 6% of the stock's 20-session average volume needs the desk head's prior approval,
    so the program must not send one; sells that close out a newly restricted stock are no exception (positions
    must stay small enough to sell out in time); it is a desk policy and the desk head can grant an exception.
- id: raw_volumes
  kind: ambiguous
  domain: data semantics
  text: Prices are adjusted for splits and consolidations but volumes are raw; XIPH's 5-to-1 consolidation
    on 7 May 2026 makes its earlier volumes five times too high in today's shares, which matters for the
    large-order threshold.
- id: status_table
  kind: missing
  domain: scoring
  text: Every call returns the status at the close just past - stock and sector weights in % of equity,
    buying power for the next session (settled cash plus proceeds usable by next_date, minus an announced
    withdrawal not yet paid, at least 0), and the drawdown in % of equity plus payouts from its peak including
    the starting capital - right within 0.05 points or 1 + 0.1%, worth 20% of quality.
- id: objective
  kind: missing
  domain: scoring
  text: Quality is 0.8 x the return component + 0.2 x table accuracy; the return component is the book's
    excess over the index bought at the first session and held (final net equity plus cash paid out to
    the client, minus the index's value) relative to the client's benchmark program's excess, 0 below
    the index (if the benchmark program beats the index by less than 5% of the capital, or trails it,
    the yardstick is 5% of the capital below its final value instead).
- id: easy_scope
  kind: missing
  domain: business rule
  text: This round only the trading core, the restricted list with its additions, the large-order rule
    and the status table count; no position limits, and the withdrawal, risk-limit, circuit-breaker notices
    and the notes change nothing.
