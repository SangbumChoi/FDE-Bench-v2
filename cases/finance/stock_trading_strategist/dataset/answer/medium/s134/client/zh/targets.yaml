- id: interface
  kind: missing
  domain: data semantics
  text: 交付物是 program/strategy.py 中的 on_day(day)，day = {market, portfolio, notices}；每次收盘后调用，订单在下一交易日执行；80
    次调用在同一进程中完成，状态可以放在模块变量里；每次 10 秒，只用标准库，运行时不能读数据文件；返回 {orders, status}。当天的消息只以 notices 的形式出现在输入里，不会以邮件形式到达。
- id: evaluation_period
  kind: missing
  domain: scoring
  text: 程序在历史数据之后的 80 个交易日（2026 年 5 月 18 日至 9 月 4 日）上回放，从现金 10,000,000、无持仓开始；期间的通知只在运行时于收到当天出现一次。
- id: fills
  kind: missing
  domain: calculation
  text: '"open" 订单在下一交易日开盘集合竞价按开盘价成交，没有价差；"p10" 订单按开盘 10 分钟后的价格加减半个价差成交；卖单先于买单执行。'
- id: costs
  kind: missing
  domain: calculation
  text: 佣金为成交金额的 0.04%，每笔成交至少 20。
- id: lots_and_cash
  kind: ambiguous
  domain: business rule
  text: 股数须为整手（100 股，高价股 10 股）；现金账户，不能卖空；超过可用现金的买单整笔被拒。
- id: halts
  kind: missing
  domain: data semantics
  text: 停牌股票没有行情，所有订单被拒；复牌时停牌期间的价格变化一次性反映；新的停牌只有开始时才知道。
- id: upcoming_split
  kind: missing
  domain: data semantics
  text: OMNY 自 2026 年 7 月 3 日起 1 拆 2；从前一天晚上起持股翻倍，行情重新复权。
- id: earnings
  kind: missing
  domain: data semantics
  text: 各公司每季度收盘后公布业绩并附超预期幅度（%）；股价反应大部分在次日早上的跳空和开盘最初几分钟，部分在之后几天延续。
- id: restricted_list
  kind: missing
  domain: business rule
  text: MEDQ, GLAC 在公司的限制名单上（投行团队正在为其提供顾问服务）：它们仍在指数和数据里，但本账户不得对它们下任何买单。数据库里的限制名单历史只有以前已解除的条目。
- id: restricted_addition
  kind: missing
  domain: business rule
  text: 合规把股票加入限制名单（restricted_list_add 通知）后，自生效日起不得对其下买单，已有持仓须在以生效日为第一个交易日算起的第 2 个交易日收盘前卖完。
- id: large_order_approval
  kind: missing
  domain: business rule
  text: 超过该股票最近 20 个交易日平均成交量 6% 的订单需要交易台主管事先批准，所以程序不得发出；清仓新增限制名单股票的卖单也不例外，因此持仓要小到能在期限内卖完；这是交易台规定，交易台主管可以批准例外。
- id: raw_volumes
  kind: ambiguous
  domain: data semantics
  text: 价格按拆股、合股复权，但成交量是原始值；XIPH 于 2026 年 5 月 7 日 5 股合 1 股，此前的成交量按现在股数算大五倍，这会影响大额订单的标准。
- id: status_table
  kind: missing
  domain: scoring
  text: 每次调用返回刚收盘时的状况：个股和行业占净值的权重（%）、下一交易日的购买力（已交收现金 + 到 next_date 可用的款项 − 已通知未支付的出金，不低于 0），以及净值加已付出金相对其最高值（含初始资金）的回撤（%）；误差在
    0.05 个百分点或 1 + 0.1% 内算对，占质量的 20%。
- id: objective
  kind: missing
  domain: scoring
  text: 质量 = 0.8 × 收益得分 + 0.2 × 表准确度；收益得分是账户相对首日买入并持有指数的超额（最终净资产 + 已付客户出金 − 指数价值）除以客户基准程序的超额，跑输指数则为 0（若基准程序跑赢指数不到资金的
    5% 或跑输指数，比较基准改为基准程序最终价值以下资金的 5% 处）。
- id: settlement
  kind: missing
  domain: business rule
  text: 卖出收 0.2% 印花税，卖出款 T+2 交收（卖出后第二个交易日起可用于买入）；买入当即付款。
- id: position_limits
  kind: missing
  domain: business rule
  text: 在买入某只股票的交易日收盘时，该股票不超过净值的 15%，其行业不超过 40%（价格变动导致的超限不算违规）。
- id: risk_limit_change
  kind: missing
  domain: business rule
  text: risk_limit_change 通知自生效日起按给定百分点调整单只股票限额，生效日收盘时所有持仓不论当天是否买入都必须在新限额以内。
- id: cash_withdrawal
  kind: missing
  domain: business rule
  text: cash_withdrawal 通知只给出付款日；金额由协议规定：初始资金 10,000,000 的 25%（即 2,500,000），在付款日收盘时只从已交收现金中支付（不足即违反客户指令）；由于
    T+2，卖出必须足够早。
- id: medium_scope
  kind: missing
  domain: business rule
  text: 这一轮回撤授权、熔断和留言都不在考核范围内。
