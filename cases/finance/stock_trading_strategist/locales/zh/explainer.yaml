  no_table: "交易与参考答案相同，但不返回状态表"
  empty_table: "交易与参考答案相同；状态表里不报持仓，购买力填现金，回撤填 0"
  ignore_notices: "交易与参考答案相同，但对当天的消息一概不作反应"
  stale_table: "交易与参考答案相同；状态表报的是上一个收盘的（晚一次调用）"
  no_close_out_sizing: "交易与参考答案相同，但每只股票都按目标权重持有，不管强制清仓时能否按时卖完"
  hold_first_picks: "买入参考答案的第一批选股后一直持有（之后不再排序，也没有风险开关）；通知和状态表与参考答案相同"
  table_from_input: "交易与参考答案相同；状态表里的现金和净值照抄引擎的输入（不为出金预留，付给客户的出金不加回）"
