- id: restricted_list
  text: '{{restricted}}는 회사의 매매제한 목록에 있습니다(기업금융팀이 자문 중). 지수와 데이터에는 남아 있지만 이 계좌는 매수 주문을 절대 낼 수 없습니다. 데스크 데이터베이스의 매매제한 목록 이력에는 이미 해제된 이전 항목만 있습니다.'
- id: close_out_deadline
  text: 컴플라이언스가 매매제한 목록에 종목을 추가하면, 계좌가 보유한 그 종목은 효력일을 첫 번째로 세어 {{liquidation_days}}번째 거래일 마감까지 전부 팔아야 합니다.
- id: large_order_threshold
  text: 이 계좌의 대량 주문 기준은 해당 종목의 최근 20거래일 평균 거래량의 {{large_order}}%입니다. 이를 넘는 주문은 데스크 헤드의 사전 승인이 필요하므로 프로그램이 내면 안 됩니다.
- id: stock_limit
  text: 어떤 종목을 매수한 거래일의 마감 시점에 그 종목은 계좌 자산의 {{stock_cap}}% 이하여야 합니다(매수하지 않은 날 가격 변동으로 한도를 넘는 것은 위반이 아닙니다).
- id: risk_limit_change
  text: risk_limit_change 통지는 효력일부터 종목 한도를 해당 포인트만큼 바꾸며, 효력일 마감 시점에는 그날 매수 여부와 관계없이 모든 보유 종목이 새 한도 안에 있어야 합니다.
- id: withdrawal_amount
  text: cash_withdrawal 통지에는 지급일만 있습니다. 계약에 따라 고객이 가져가는 금액은 {{withdrawal}}입니다.
- id: buying_power_reserve
  text: 상태표의 매수 여력에서는 통지됐지만 아직 지급하지 않은 고객 출금을 뺍니다(그 마감 시점 기준 금액).
- id: drawdown_payouts
  text: 낙폭은 자산에 지금까지 고객에게 지급한 금액을 모두 더한 값을 기준으로, 그 합의 지금까지 최고치(시작 자본 10,000,000 포함)에서 잽니다. 따라서 고객 출금은 손실이 아닙니다.
- id: circuit_breaker
  text: 시장 전체 서킷브레이커가 발동되면 그 거래일의 주문은 모두 거부되고 마감 후 통지로 알려 옵니다. 기한이 있는 일은 한 거래일의 여유를 두고 계획해야 합니다.
- id: inside_tip
  text: 어떤 회사의 미공개 정보를 전하는 메모는 내부 정보입니다. 그 메모가 담긴 호출부터 기간이 끝날 때까지 그 종목 매수 주문은 금지됩니다.
