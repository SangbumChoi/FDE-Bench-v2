  no_table: "売買は模範解答と同じですが、ステータス表を返しません"
  empty_table: "売買は模範解答と同じで、ステータス表には保有なし、買付余力は現金、ドローダウンは0と書きます"
  ignore_notices: "売買は模範解答と同じですが、その日のメッセージには一切反応しません"
  stale_table: "売買は模範解答と同じですが、ステータス表は前の大引けのものを返します（1回遅れ）"
  no_close_out_sizing: "売買は模範解答と同じですが、強制売却で期限内に売り切れるかに関係なく、各銘柄を目標ウェイトまで持ちます"
  hold_first_picks: "模範解答が最初に選んだ銘柄を買ってそのまま持ち続けます（その後は順位を付け直さず、リスクスイッチもなし）。通知とステータス表は模範解答と同じです"
  table_from_input: "売買は模範解答と同じで、ステータス表の現金と資産はエンジンの入力をそのまま写します（出金のための取り置きをせず、お客様への支払額を足し戻しません）"
  literal_plus_order_size_limit: "依頼を文字どおりに実行した解答で、order_size_limit のルール1つだけを守ったもの（その事実だけを知っていて、ほかは知りません）"
