- id: interface
  text: 納品物は program/strategy.py の on_day(day) で、day = {market, portfolio} です。毎日大引け後に呼ばれ、注文は翌営業日に執行されます。エンジンはプログラムを一度だけ読み込み、すべての呼び出しを同じプロセスで行うので、状態はモジュール変数に置けます。1回10秒、標準ライブラリのみです。
- id: evaluation_period
  text: 戦略はヒストリーの後の80営業日（2026年5月18日〜9月4日）で、現金10,000,000・建玉なしから再生されます。
- id: fills
  text: 注文は翌営業日の p10（寄り付き10分後の価格）にスプレッドの半分を加減して約定し、"at open" は寄り付きの板寄せでスプレッドなしに約定します。売りが買いより先に執行されます。
- id: costs
  text: 手数料は約定代金の0.04%、1約定あたり最低20です。
- id: simple_engine
  text: 今回のラウンドはエンジンが簡易モード（取引税なし、売却代金は即時に使える、マーケットインパクトなし）で動き、チェックするのは売買制限銘柄と売買の基本ルールだけです（保有・注文サイズ・ドローダウンの上限はなし）。
- id: lots_and_cash
  text: 株数は売買単位（100株、値がさ株は10株）の倍数で、現金口座のため空売りはできず、使える現金を超える買いは丸ごと拒否されます。
- id: restricted_list
  text: "{{restricted}} は社内の売買制限リストに載っています（コーポレートファイナンス部門がアドバイザーを務めているため）。この口座ではこれらに買い注文を出せませんが、指数とデータにはそのまま含まれます。"
- id: first_10_minutes
  text: デスクは板寄せを含め取引開始から10分間は売買しません（注文はすべて p10）。ルールや契約ではなく習慣なので、寄り付きの売買が得なら例外もありえます。
- id: objective
  text: 品質は2026年9月4日の最終純資産（現金、未受渡の売却代金、最終終値で売却コストを差し引いた保有分）で、物差しは初日に時価総額加重指数を買って持ち続けることです。
- id: halts
  text: 売買停止中の銘柄は株価データがなく注文はすべて拒否され、再開時に停止中の値動きが一度に反映されます。新しい停止は始まるまでわかりません。
- id: upcoming_split
  text: OMNY は2026年7月3日付で1株を2株に分割し、その前日の晩から保有株数が2倍になり株価データも再調整されます。
- id: earnings
  text: 各社は四半期ごとに大引け後に決算とサプライズ（%）を発表し、株価は主に翌朝のギャップと寄り付き直後の数分で反応し、一部はその後の数日続きます。
- id: settlement
  text: 売りには0.2%の取引税がかかり、売却代金は T+2 で受け渡され（売りの2営業日後から買いに使える）、買いの代金はすぐに支払われます。
- id: raw_volumes
  text: 価格は分割・併合を調整済みですが出来高は生の値です。XIPH の2026年5月7日の5株→1株の併合により、それ以前の出来高は現在の株数で5倍大きくなっています。
- id: position_limits
  text: 銘柄を買った営業日の大引け時点で、その銘柄は資産の{{stock_cap}}%以下、その業種は{{sector_cap}}%以下でなければなりません（値動きによる超過は違反ではない）。
- id: order_size
  text: どの注文も、その銘柄の直近20営業日平均出来高（現在の株数ベース）の{{participation}}%を超えてはいけません。
- id: market_impact
  text: 約定には、その日の出来高の5%ごとに0.1%のマーケットインパクト（0.02 × 株数 / 出来高）が寄り付きでも p10 でもかかります。
- id: max_drawdown
  text: リスクガイドラインにより、終値ベース資産がそれまでの最高値（当初資金を含む）から{{max_drawdown}}%を超えて下がると口座は閉鎖されます。
