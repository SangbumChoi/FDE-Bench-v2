- id: restricted_list
  text: '{{restricted}} は社内の売買制限リストに載っています（コーポレートファイナンス部門が助言中）。指数とデータには残りますが、この口座は買い注文を一切出せません。デスクのデータベースにある売買制限リストの履歴は、解除済みの過去の登録だけです。'
- id: close_out_deadline
  text: コンプライアンスが売買制限リストに銘柄を追加したら、口座が保有するその銘柄は、効力発生日を1営業日目として{{liquidation_days}}営業日目の大引けまでにすべて売り切らなければなりません。
- id: large_order_threshold
  text: この口座の大口注文の基準は、その銘柄の直近20営業日の平均出来高の{{large_order}}%です。これを超える注文にはデスク責任者の事前承認が必要なので、プログラムは出してはいけません。
- id: stock_limit
  text: ある銘柄を買った営業日の大引け時点で、その銘柄は口座の資産の{{stock_cap}}%以下でなければなりません（買っていない日に値動きで上限を超えるのは違反ではありません）。
- id: risk_limit_change
  text: risk_limit_change の通知は効力発生日から1銘柄の上限を指定のポイントだけ変え、効力発生日の大引け時点では、その日に買ったかどうかに関係なくすべての保有銘柄が新しい上限内でなければなりません。
- id: withdrawal_amount
  text: cash_withdrawal の通知には支払日しかありません。契約により、お客様が引き出す金額は{{withdrawal}}です。
- id: buying_power_reserve
  text: ステータス表の買付余力からは、通知済みでまだ支払っていないお客様の出金（その大引け時点での金額）を引きます。
- id: drawdown_payouts
  text: ドローダウンは、資産にこれまでお客様へ支払った金額をすべて足した値について、その合計のこれまでの最高値（当初資金 10,000,000 を含む）から測ります。したがって出金は損失ではありません。
- id: circuit_breaker
  text: 市場全体のサーキットブレーカーが発動すると、その営業日の注文はすべて拒否され、大引け後の通知で知らされます。期限のある作業は、1営業日の余裕を見て計画しなければなりません。
- id: inside_tip
  text: ある会社の未公表の情報を伝えるメモはインサイダー情報です。そのメモを含む呼び出しから期間の終わりまで、その銘柄の買い注文は出せません。
