- id: restricted_list
  kind: missing
  domain: business rule
  param: restricted
  text: "{{restricted}} are on the firm's restricted list (its corporate finance team advises them): the book may never place a buy order for them, although they stay in the index and the data. The restricted-list history in the desk database holds only earlier, lifted entries."
- id: close_out_deadline
  kind: missing
  domain: business rule
  param: liquidation_days
  text: When compliance adds a stock to the restricted list, whatever the book holds of it must be sold out by the close of the {{liquidation_days}}th session, counting the effective session as the first.
- id: large_order_threshold
  kind: missing
  domain: business rule
  param: large_order
  text: The book's large-order threshold is {{large_order}}% of the stock's average daily volume over its last 20 trading sessions; an order above it needs the desk head's approval, so the program must not send one.
- id: stock_limit
  kind: missing
  domain: business rule
  tiers: [medium, hard]
  param: stock_cap
  text: At the close of a session in which the book bought a stock, that stock is at most {{stock_cap}}% of the book's equity (prices moving a holding above the limit on a day it was not bought is not a breach).
- id: risk_limit_change
  kind: missing
  domain: business rule
  tiers: [medium, hard]
  text: A risk_limit_change notice changes the stock limit by its points from its effective date, and at the close of that date every holding, bought that day or not, must be within the new limit.
- id: withdrawal_amount
  kind: missing
  domain: business rule
  tiers: [medium, hard]
  param: withdrawal
  text: A cash_withdrawal notice gives only the payment date; under the agreement the client takes out {{withdrawal}}.
- id: buying_power_reserve
  kind: missing
  domain: calculation
  tiers: [medium, hard]
  text: In the status table the buying power is net of a client withdrawal that is announced and not yet paid (its amount as it stands at that close).
- id: drawdown_payouts
  kind: missing
  domain: calculation
  tiers: [medium, hard]
  text: The drawdown is measured on the equity plus everything paid out to the client, from the highest value of that sum so far (the starting 10,000,000 included), so a payout is not a loss.
- id: circuit_breaker
  kind: missing
  domain: business rule
  tiers: [hard]
  text: When the market-wide circuit breaker trips, every order for that session is rejected and a notice reports it afterwards; anything with a deadline must be planned with one session to spare.
- id: inside_tip
  kind: missing
  domain: business rule
  tiers: [hard]
  text: A note that passes on non-public information about a company is inside information; from the call that carries it the book places no buy order for that stock for the rest of the period.
