- id: interface
  text: El entregable es program/strategy.py con on_day(day), day = {market, portfolio}; se llama tras cada cierre y las órdenes se ejecutan en la sesión siguiente; el motor carga el programa una sola vez y hace todas las llamadas en el mismo proceso, así que el estado puede vivir en variables del módulo; 10 s por llamada y solo la biblioteca estándar.
- id: evaluation_period
  text: La estrategia se reproduce en las 80 sesiones posteriores al histórico (del 18 de mayo al 4 de septiembre de 2026), partiendo de 10.000.000 en efectivo y sin posiciones.
- id: fills
  text: Las órdenes se ejecutan al p10 de la sesión siguiente (precio 10 minutos después de la apertura) más o menos medio diferencial; "at open" se ejecuta en la subasta de apertura sin diferencial; las ventas van antes que las compras.
- id: costs
  text: La comisión es el 0,04 % del importe negociado con un mínimo de 20 por orden ejecutada.
- id: simple_engine
  text: En esta ronda el motor funciona en modo simple (sin impuesto sobre las ventas, importe de las ventas disponible de inmediato, sin impacto de mercado) y solo se revisan la lista restringida y lo básico de la operativa (sin límites de posición, de tamaño de órdenes ni de caída máxima).
- id: lots_and_cash
  text: Las cantidades van en lotes completos (100 acciones, 10 en los valores caros); cuenta de efectivo sin ventas en corto; una compra que supere el efectivo disponible se rechaza entera.
- id: restricted_list
  text: "{{restricted}} están en la lista restringida de la firma (su equipo de finanzas corporativas los asesora): la cartera no puede dar ninguna orden de compra sobre ellos, aunque siguen en el índice y en los datos."
- id: first_10_minutes
  text: La mesa nunca opera en los primeros 10 minutos, subasta de apertura incluida (todas las órdenes a p10); es una costumbre, no una regla ni un contrato, y cabe una excepción si operar en la apertura compensa.
- id: objective
  text: La calidad es el patrimonio neto final del 4 de septiembre de 2026 (efectivo, ventas pendientes de liquidar y posiciones al último cierre netas del coste de venderlas); la referencia es comprar el índice ponderado por capitalización en la primera sesión y mantenerlo.
- id: halts
  text: Un valor suspendido no tiene barras y toda orden sobre él se rechaza; vuelve con todo el movimiento acumulado durante la suspensión; las suspensiones nuevas solo se conocen cuando empiezan.
- id: upcoming_split
  text: OMNY se desdobla 1 a 2 con efecto el 3 de julio de 2026; desde la tarde anterior las posiciones se duplican y sus barras se reajustan.
- id: earnings
  text: Las empresas publican resultados trimestrales tras el cierre con una sorpresa en %; el precio reacciona sobre todo en el hueco y los primeros minutos de la mañana siguiente, y en parte en las sesiones posteriores.
- id: settlement
  text: Las ventas pagan un impuesto del 0,2 % y su importe se liquida en T+2 (disponible para compras dos sesiones después de la venta); las compras se pagan al momento.
- id: raw_volumes
  text: Los precios están ajustados por desdoblamientos y contrasplits, pero los volúmenes no; por el contrasplit 5 a 1 de XIPH del 7 de mayo de 2026, sus volúmenes anteriores son cinco veces mayores en acciones de hoy.
- id: position_limits
  text: Al cierre de una sesión en la que se compró un valor, ese valor pesa como máximo el {{stock_cap}} % y su sector el {{sector_cap}} % del patrimonio (la deriva por precios no es incumplimiento).
- id: order_size
  text: Ninguna orden puede superar el {{participation}} % del volumen medio diario del valor en sus últimas 20 sesiones, en acciones de hoy.
- id: market_impact
  text: Las ejecuciones pagan además un impacto de mercado del 0,1 % por cada 5 % del volumen de la sesión que tome la orden (0,02 × acciones / volumen), en la apertura y a p10.
- id: max_drawdown
  text: El mandato de riesgo cierra la cartera si el patrimonio de cierre cae más de un {{max_drawdown}} % por debajo de su máximo (capital inicial incluido).
