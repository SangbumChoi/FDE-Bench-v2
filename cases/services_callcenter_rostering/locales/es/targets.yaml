- id: one_language
  text: Durante todo el turno un agente atiende en un solo idioma de los que habla; un agente bilingüe nunca cuenta para dos idiomas a la vez.
- id: slot_coverage
  text: La previsión ya da el número de agentes que hacen falta por idioma y por franja de media hora; la cobertura se comprueba por franja de 30 minutos y el agente cuenta en todas las franjas de su turno.
- id: holiday_wednesday
  text: El miércoles 11 de noviembre es festivo; la demanda de ese día es el 60 % de la previsión, redondeado hacia arriba, y el archivo no se actualizó.
- id: contract_limits
  text: El personal de jornada completa solo hace turnos de 8 horas y como máximo 5 a la semana; el de media jornada, solo turnos de 4 horas y como máximo 3.
- id: min_rest
  text: Entre el final de un turno y el inicio del siguiente del mismo agente debe haber al menos 11 horas de descanso.
- id: leave_dates
  text: La lista de ausencias escribe las fechas como día/mes/año con los dos extremos incluidos, y solo cuentan las aprobadas; una solicitud rechazada significa que el agente está disponible.
- id: overtime
  text: La semana normal de jornada completa es de 4 turnos; el 5.º turno es hora extra y cuesta 1,5 veces la tarifa por hora.
- id: buddy_rule
  text: Una persona de nuevo ingreso nunca puede estar sola en un idioma; en cada franja de media hora que trabaja, hay al menos un agente que no es nuevo en el mismo idioma.
- id: understaffing_penalty
  text: El cuadrante se puntúa con 40 por cada agente que falta por franja e idioma, más el coste de personal de todos los turnos; cuanto menor, mejor.
