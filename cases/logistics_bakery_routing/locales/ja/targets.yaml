- id: road_distance
  text: 道路距離は直線距離の1.3倍で、座標はキッチン (0, 0) からのkmです。
- id: speeds
  text: 07:00より前に出発する区間は時速30km、07:00以降に出発する区間は時速20kmで計算します。
- id: service_time
  text: 店舗での荷下ろしは4分に、トレー1枚あたり0.2分を加えた時間がかかります。
- id: shift
  text: 車両は05:00から出発でき、09:30までにキッチンへ戻る必要があります。
- id: closed_c11
  text: 時計台店（C11）は今週改装のため休業で、配送してはいけません。
- id: cold_chain
  text: 提携ブランドの店舗は冷蔵商品を扱うため、冷蔵車V4しか配送できません。
- id: one_visit
  text: 各店舗のトレーは1台の車両が1回ですべて届け、分けて配送することはありません。
- id: premium_first
  text: どのルートでも旗艦店を標準店より先に回らなければなりません。
- id: lateness
  text: 納品期限を過ぎた到着も認められますが、遅れた1分は総稼働時間に3分として加算されます。開店前に着いた場合は待つ必要があります。
