- id: bom_explosion
  kind: ambiguous
  domain: data semantics
  text: La demanda de un componente en una semana son las placas de cada modelo fabricadas esa semana
    (plan_produccion.csv) por su cantidad_por_placa en lista_materiales.csv, sumadas para los dos modelos,
    y se necesita esa misma semana; lo que llega en una semana sirve para toda la producción de esa semana
    (no hay desfase de montaje).
- id: lead_time_business_days
  kind: ambiguous
  domain: data semantics
  text: plazo_entrega_dias cuenta días hábiles (de lunes a viernes), no días naturales, contados desde
    el lunes de la semana del pedido; la mercancía se puede usar desde la primera semana que empieza después
    de su llegada.
- id: holiday_weeks
  kind: missing
  domain: calculation
  text: W5 (21-25 de diciembre, Navidad) y W6 (28 de diciembre - 1 de enero, Año Nuevo) solo tienen cuatro
    días hábiles; las demás semanas tienen cinco.
- id: usd_planning_rate
  kind: missing
  domain: calculation
  text: Pacific Parts (S04) cotiza en dólares estadounidenses; todos los costes y el presupuesto están
    en KRW, convertidos al tipo de cambio de planificación fijo de 1.380 KRW por USD.
- id: moq_per_line
  kind: ambiguous
  domain: business rule
  text: El pedido mínimo se aplica por línea de pedido (un proveedor, un componente y una semana de pedido);
    nunca se suman cantidades de semanas distintas para alcanzarlo.
- id: price_breaks
  kind: ambiguous
  domain: calculation
  text: Los descuentos por cantidad se aplican por línea de pedido y a toda la línea (descuento sobre
    todas las unidades); nunca se combinan cantidades de semanas distintas para alcanzar un tramo.
- id: price_rise_week
  kind: missing
  domain: business rule
  text: El aumento del 12% de Nara Display sobre C06, acordado en los correos, se aplica a los pedidos
    desde W4; todos los pedidos se envían el lunes de su semana, así que los de W3 (7 de diciembre) son
    anteriores a la fecha de entrada en vigor del 9 de diciembre y mantienen el precio anterior.
- id: quality_hold
  kind: missing
  domain: business rule
  text: Seoul PCB Tech (S05) está en bloqueo de calidad; su mercancía con llegada prevista de W1 a W4
    se rechaza, así que sus entregas solo pueden llegar después de W4.
- id: budget_hard_cap
  kind: ambiguous
  domain: business rule
  text: El presupuesto mensual de presupuesto.csv es un límite estricto de la empresa matriz, no un objetivo;
    ningún mes puede superarlo.
- id: budget_month
  kind: ambiguous
  domain: business rule
  text: Un pedido cuenta en el presupuesto del mes del lunes de su semana de pedido, así que W1-W2 son
    noviembre (W2 empieza el 30 de noviembre), W3-W6 diciembre y W7-W8 enero.
- id: approved_status_only
  kind: ambiguous
  domain: business rule
  text: Solo se pueden usar proveedores cuyo estado para ese componente sea homologado; los que están
    en evaluación o suspendidos no se permiten aunque hayan cotizado.
- id: safety_stock
  kind: missing
  domain: business rule
  text: Los componentes críticos (critico = sí) deben mantener un stock de seguridad de 0,5 veces su demanda
    semanal media (la demanda total de las semanas en que se usan dividida entre el número de esas semanas,
    por 0,5, redondeado hacia arriba) al final de cada semana en que se usan.
- id: dual_source_two
  kind: missing
  domain: business rule
  text: Cada componente crítico en uso debe pedirse a al menos dos proveedores distintos dentro de este
    plan; es una costumbre de la empresa, así que se puede pedir una excepción si ahorra dinero de verdad.
- id: max_share
  kind: missing
  domain: business rule
  text: Ningún proveedor puede recibir más del 70% de la cantidad pedida de un componente crítico en este
    plan, contada en piezas.
- id: scope_no_flash_change
  kind: missing
  domain: business rule
  text: El cambio de la memoria flash de lista_materiales.csv no está liberado en esta ronda; las dos
    placas siguen usando C04 las diez semanas, C25 no hace falta y se ignoran las columnas de vigencia.
- id: scope_on_time
  kind: missing
  domain: business rule
  text: En esta ronda se planifica como si todos los proveedores entregaran en la semana prometida; no
    se usa historial_entregas.csv.
- id: scope_no_allocation
  kind: missing
  domain: business rule
  text: En esta ronda se planifica como si todos los proveedores confirmaran todo lo que pedimos; no se
    usa asignaciones.csv.
