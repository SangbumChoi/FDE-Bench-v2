- id: bom_explosion
  kind: ambiguous
  domain: data semantics
  text: 주별 부품 소요량은 그 주 모델별 보드 생산 수량(생산계획.csv)에 자재명세서.csv의 보드당소요량을 곱해 두 모델을 합한 값이며, 그 주에 바로 필요합니다. 어떤 주에
    입고된 물건은 그 주 생산 전체에 쓸 수 있습니다(조립 선행 기간 없음).
- id: lead_time_business_days
  kind: ambiguous
  domain: data semantics
  text: 리드타임_일은 달력일이 아니라 영업일(월~금)입니다. 이번 차수에는 5로 나눠 올림한 주 단위로 보며(12일 = 3주), w주차에 리드타임 L주로 낸 발주는 w+L주차부터
    쓸 수 있습니다.
- id: scope_whole_weeks
  kind: missing
  domain: business rule
  text: 이번 차수에는 리드타임에서 공휴일을 따지지 않습니다. 성탄절 주와 신정 주를 포함해 모든 주를 영업일 5일로 봅니다.
- id: moq_per_line
  kind: ambiguous
  domain: business rule
  text: 최소주문수량은 발주 라인(공급사·부품·발주 주차 하나) 단위로 적용되며, 다른 주차의 수량을 합쳐서 맞출 수 없습니다.
- id: scope_list_prices
  kind: missing
  domain: business rule
  text: 이번 차수는 정가로 계획합니다. 모든 발주 라인은 크기와 상관없이 단가로 계산하고, 할인 구간 열은 무시합니다.
- id: price_rise_week
  kind: missing
  domain: business rule
  text: 메일에서 합의한 나라디스플레이의 C06 12% 인상은 W4 발주부터 적용됩니다. 발주는 모두 발주 주차의 월요일에 내므로 W3 발주(12월 7일)는 12월 9일 적용일보다
    앞서 기존 단가가 유지됩니다.
- id: quality_hold
  kind: missing
  domain: business rule
  text: 고원패시브(S07)는 품질 보류 중이라 W1~W3에 입고 예정인 물건은 반품되므로, 이 회사 물건은 W3 이후에만 입고되어야 합니다.
- id: budget_hard_cap
  kind: ambiguous
  domain: business rule
  text: 구매예산.csv의 월 예산은 모회사가 정한 넘을 수 없는 상한이며 목표치가 아닙니다. 어느 달도 이를 넘으면 안 됩니다.
- id: budget_month
  kind: ambiguous
  domain: business rule
  text: 발주는 발주 주차 월요일이 속한 달의 예산에서 차감됩니다. 따라서 W1~W2는 11월(W2는 11월 30일 시작), W3~W6는 12월, W7~W8은 1월입니다.
- id: approved_status_only
  kind: ambiguous
  domain: business rule
  text: 해당 부품의 승인상태가 승인인 공급사만 쓸 수 있으며, 심사중이나 거래정지 공급사는 견적을 냈더라도 안 됩니다.
- id: safety_stock
  kind: missing
  domain: business rule
  text: 핵심부품(핵심부품 = 예)은 쓰는 주의 매주 말에 주 평균 소요량의 1배(쓰는 주들의 소요량 합계를 주 수로 나누고 1를 곱해 올림)만큼 안전재고를 유지해야 합니다.
- id: dual_source_two
  kind: missing
  domain: business rule
  text: 사용 중인 핵심부품은 이번 계획 안에서 서로 다른 공급사 두 곳 이상에 발주해야 합니다. 회사 관행이므로 실제로 비용이 줄어든다면 예외를 요청할 수 있습니다.
- id: max_share
  kind: missing
  domain: business rule
  text: 어느 공급사도 이번 계획의 핵심부품 발주 수량(개수 기준)의 90%를 넘게 가져가면 안 됩니다.
- id: scope_no_flash_change
  kind: missing
  domain: business rule
  text: 자재명세서.csv의 플래시 변경은 이번 차수에 아직 확정되지 않았습니다. 두 보드 모두 10주 내내 C04를 쓰고, C25는 필요 없으며, 적용 주차 열은 무시합니다.
- id: scope_on_time
  kind: missing
  domain: business rule
  text: 이번 차수는 모든 공급사가 약속한 주에 납품한다고 보고 계획하며, 납품이력.csv는 쓰지 않습니다.
- id: scope_no_allocation
  kind: missing
  domain: business rule
  text: 이번 차수는 모든 공급사가 발주한 수량을 전부 확정해 준다고 보고 계획하며, 공급배정.csv는 쓰지 않습니다.
