- id: bom_explosion
  kind: ambiguous
  domain: data semantics
  text: 某周的物料需求等于当周各板型的计划产量（生产计划.csv）乘以物料清单.csv 中的单板用量，两个板型相加，并且就在当周需要；某周到货的物料可用于当周全部生产（没有装配提前期）。
- id: lead_time_business_days
  kind: ambiguous
  domain: data semantics
  text: 交期_天按工作日（周一至周五）计，不是自然日，从下单周的周一起算，货物从到货后开始的第一周起可用。
- id: holiday_weeks
  kind: missing
  domain: calculation
  text: W5（12月21日至25日，圣诞节）和 W6（12月28日至1月1日，元旦）只有 4 个工作日，其他每周 5 个。
- id: moq_per_line
  kind: ambiguous
  domain: business rule
  text: 最小起订量按订单行（一个供应商、一个物料、一个下单周）适用，不同周的数量不能合并来达到起订量。
- id: price_breaks
  kind: ambiguous
  domain: calculation
  text: 数量折扣按订单行适用于整行（全量折扣），不同周的数量不能合并来达到折扣档位。
- id: quality_hold
  kind: missing
  domain: business rule
  text: Mirae Semicon（S03） 处于质量冻结中；其在 W1 至 W5 到货的货物会被退回，因此它的交货只能在 W5 之后到货。
- id: budget_hard_cap
  kind: ambiguous
  domain: business rule
  text: 采购预算.csv 中的月度预算是母公司规定的硬性上限，不是目标；任何月份都不得超出。
- id: budget_month
  kind: ambiguous
  domain: business rule
  text: 订单计入下单周周一所在月份的预算，因此 W1-W2 属于 11月（W2 从 11月30日开始），W3-W6 属于 12月，W7-W8 属于 1月。
- id: approved_status_only
  kind: ambiguous
  domain: business rule
  text: 只能使用该物料认证状态为已认证的供应商；认证中和暂停的供应商即使报了价也不能用。
- id: safety_stock
  kind: missing
  domain: business rule
  text: 关键物料（关键物料 = 是）在使用的每一周周末都应保有其平均周需求 1 倍的安全库存（使用周的需求总和除以周数，乘以 1，向上取整）。
- id: shortfall_cost
  kind: missing
  domain: scoring
  text: 关键物料在其使用周的周末每比安全库存少一件，成本为其标准成本的 1.5 倍。
- id: dual_source_two
  kind: missing
  domain: business rule
  text: 每个在用的关键物料在本计划内必须向至少两家不同的供应商订购；这是公司惯例，如果确实能省钱，可以申请例外。
- id: max_share
  kind: missing
  domain: business rule
  text: 任何一家供应商都不得超过本计划中某关键物料订购数量（按件计）的 80%。
- id: backlog_cost
  kind: missing
  domain: scoring
  text: 因缺料无法生产的板子会等待物料，每块板每等一周成本 10,000 韩元；因此周末每缺一件物料的成本为 10,000 韩元除以该物料的单板件数，按物料分别计算。
- id: supplier_lateness
  kind: missing
  domain: data semantics
  text: 各供应商以各自的概率迟交一周或两周，交货记录.csv 显示了这一点（比承诺的周一晚 1-7 天到货算迟一周，晚 8-14 天算迟两周）；每次交货（一个供应商、一个物料、一个到货周）独立地迟交；在途采购单按时到货。
- id: allocation_caps
  kind: missing
  domain: business rule
  text: S03 的 C01 和 C03、S08 的 C06 按下单周所在的自然月，每月最多确认供应商配额.csv 中的数量；超出部分不会交货。
- id: eco_switch
  kind: missing
  domain: business rule
  text: 如物料清单.csv 的生效周次列所示，从 W6 起两个板型的闪存 C04 由 C25 替代；W5 结束时剩余的 C04 按标准成本报废，此后到货的 C04 没有用处；C25 没有库存也没有在途订单。
- id: eco_c04_exempt
  kind: missing
  domain: business rule
  text: 正在停用的 C04 不再需要安全库存，也不再需要第二供应商；C25 是关键物料，两者都需要。
