- id: bom_explosion
  kind: ambiguous
  domain: data semantics
  text: 주별 부품 소요량은 그 주 모델별 보드 생산 수량(생산계획.csv)에 자재명세서.csv의 보드당소요량을 곱해 두 모델을 합한 값이며, 그 주에 바로 필요합니다. 어떤 주에
    입고된 물건은 그 주 생산 전체에 쓸 수 있습니다(조립 선행 기간 없음).
- id: lead_time_business_days
  kind: ambiguous
  domain: data semantics
  text: 리드타임_일은 달력일이 아니라 영업일(월~금)입니다. 발주 주차 월요일부터 세며, 물건은 도착한 뒤 처음 시작하는 주부터 쓸 수 있습니다.
- id: holiday_weeks
  kind: missing
  domain: calculation
  text: W5(12월 21~25일, 성탄절)와 W6(12월 28일~1월 1일, 신정)는 영업일이 4일뿐이고, 나머지 주는 5일입니다.
- id: moq_per_line
  kind: ambiguous
  domain: business rule
  text: 최소주문수량은 발주 라인(공급사·부품·발주 주차 하나) 단위로 적용되며, 다른 주차의 수량을 합쳐서 맞출 수 없습니다.
- id: price_breaks
  kind: ambiguous
  domain: calculation
  text: 수량 할인은 발주 라인 단위로 라인 전체에 적용되며(전량 할인), 다른 주차의 수량을 합쳐 할인 구간을 맞출 수 없습니다.
- id: quality_hold
  kind: missing
  domain: business rule
  text: 한빛전자(S01)는 품질 보류 중이라 W1~W5에 입고 예정인 물건은 반품되므로, 이 회사 물건은 W5 이후에만 입고되어야 합니다.
- id: budget_hard_cap
  kind: ambiguous
  domain: business rule
  text: 구매예산.csv의 월 예산은 모회사가 정한 넘을 수 없는 상한이며 목표치가 아닙니다. 어느 달도 이를 넘으면 안 됩니다.
- id: budget_month
  kind: ambiguous
  domain: business rule
  text: 발주는 발주 주차 월요일이 속한 달의 예산에서 차감됩니다. 따라서 W1~W2는 11월(W2는 11월 30일 시작), W3~W6는 12월, W7~W8은 1월입니다.
- id: approved_status_only
  kind: ambiguous
  domain: business rule
  text: 해당 부품의 승인상태가 승인인 공급사만 쓸 수 있으며, 심사중이나 거래정지 공급사는 견적을 냈더라도 안 됩니다.
- id: safety_stock
  kind: missing
  domain: business rule
  text: 핵심부품(핵심부품 = 예)은 쓰는 주의 매주 말에 주 평균 소요량의 1.5배(쓰는 주들의 소요량 합계를 주 수로 나누고 1.5를 곱해 올림)만큼 안전재고를 유지해야 합니다.
- id: shortfall_cost
  kind: missing
  domain: scoring
  text: 핵심부품이 쓰이는 주의 주말에 안전재고보다 1개 모자랄 때마다 표준원가의 1.5배가 비용으로 듭니다.
- id: dual_source_two
  kind: missing
  domain: business rule
  text: 사용 중인 핵심부품은 이번 계획 안에서 서로 다른 공급사 두 곳 이상에 발주해야 합니다. 회사 관행이므로 실제로 비용이 줄어든다면 예외를 요청할 수 있습니다.
- id: max_share
  kind: missing
  domain: business rule
  text: 어느 공급사도 이번 계획의 핵심부품 발주 수량(개수 기준)의 80%를 넘게 가져가면 안 됩니다.
- id: backlog_cost
  kind: missing
  domain: scoring
  text: 부품이 없어 만들지 못한 보드는 부품을 기다리며, 보드 한 장이 한 주 기다릴 때마다 10,000원이 듭니다. 따라서 주말에 모자란 부품 1개는 10,000원을 그 부품의
    보드당 개수로 나눈 만큼의 비용이며, 부품별로 셉니다.
- id: supplier_lateness
  kind: missing
  domain: data semantics
  text: 공급사마다 고유한 확률로 1주 또는 2주 늦게 납품하며 이는 납품이력.csv에 나타납니다(약속한 월요일보다 1~7일 늦으면 1주 지연, 8~14일이면 2주 지연). 납품
    건(공급사·부품·입고주차 하나)마다 독립적으로 지연되며, 미입고 발주는 제때 들어옵니다.
- id: allocation_caps
  kind: missing
  domain: business rule
  text: S03의 C01·C03과 S08의 C06은 발주 주차 기준 달력월마다 공급배정.csv의 수량까지만 확정되며, 넘는 수량은 납품되지 않습니다.
- id: eco_switch
  kind: missing
  domain: business rule
  text: 자재명세서.csv의 적용 주차 열대로 W6부터 두 보드의 플래시 C04가 C25로 바뀝니다. W5 말에 남은 C04는 표준원가로 폐기되고 그 뒤에 들어오는 C04는 쓸모가
    없으며, C25는 재고도 미입고 발주도 없습니다.
- id: eco_c04_exempt
  kind: missing
  domain: business rule
  text: 단종되는 C04는 더 이상 안전재고도 2차 공급처도 필요 없습니다. C25는 핵심부품이라 둘 다 필요합니다.
