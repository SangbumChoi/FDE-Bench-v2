# The case in plain words, shown at the top of its page.
task: >-
  컨트롤 보드 두 모델을 조립하는 회사를 위해 앞으로 8주(W1 = 2026년 11월 23일 주부터 W8까지) 동안 어떤 부품을 어느
  공급사에 몇 개, 어느 주에 발주할지 정해서, 생산이 부품을 기다리며 멈추지 않고 총비용은 낮게 유지되도록 합니다. AI는
  발주 라인(주차·부품·공급사·낱개 수량)마다 한 행씩 쓴 `orders.csv` 파일 하나를 냅니다.
given:
  - "고객의 요청: 보드 두 모델, 부품 스무 가지 남짓에 대해 \"앞으로 두 달 동안 생산이 멈추지 않으면서 돈도 과하게 쓰지 않도록\" 어느 공급사에 무엇을 얼마나 발주할지 계획해 달라는 내용입니다. 납품이력, 공급배정 통보, 계획 중인 플래시 메모리 설계변경, 공급사 가격 이메일도 언급합니다."
  - "`생산계획.csv`와 `자재명세서.csv`: 모델별 주간 생산 보드 수(W1~W10)와 보드 한 장에 들어가는 부품별 개수입니다. 플래시 설계변경(C04는 W5까지, 새 C25는 W6부터)도 들어 있습니다."
  - "`부품마스터.csv`, `현재고.csv`, `미입고발주.csv`: 부품 25종의 핵심부품 여부와 표준원가, W1 시작 시점의 재고, 이미 낸 발주와 그 입고주차입니다."
  - "`공급사견적.xlsx`와 `supplier_price_email.txt`: 부품·공급사별 단가(Pacific Parts만 달러, 나머지는 원화), 최소주문수량, 수량 할인 구간 두 개, 일 단위 리드타임입니다. 이메일은 W4부터 발주하는 미래반도체(S03)의 C01 단가를 20% 올립니다."
  - "`승인업체목록.csv`와 `구매예산.csv`: 부품별 공급사의 승인상태(승인, 심사중, 거래정지)와 월 구매예산(11월 1억 1,500만 원, 12월 4억 7,500만 원, 1월 8,500만 원)입니다."
  - "`납품이력.csv`와 `공급배정.csv`: 과거 납품 188건의 납기약속일과 실입고일, 그리고 공급사 두 곳이 공급이 빠듯한 부품 세 가지를 한 달에 최대 몇 개까지 확정해 주는지입니다."
ask:
  - "Pacific Parts의 달러 단가에 적용할 계획환율입니다. 버전에 따라 1달러 = 1,320원, 1,380원, 1,450원, 1,500원 중 하나입니다(hard에서는 항상 1,380원)."
  - "핵심부품(MCU, 전원관리 IC, DRAM, 플래시, PCB, 디스플레이)의 안전재고 수준입니다. 버전에 따라 평균 소요량의 0.5주치, 1주치, 1.5주치 중 하나입니다(MCU는 1주치가 약 2,500개)."
  - "핵심부품은 공급사 두 곳 이상에서 사고, 한 공급사가 수량의 70%, 80%, 90%(버전에 따라 다르며 hard에서는 항상 80%)를 넘게 가져가면 안 된다는 점입니다. 회사 관행이라 실제로 비용이 줄면 고객이 예외를 허용합니다."
  - "품질 보류 중인 공급사와 보류가 끝나는 주차입니다(그때까지 입고 예정인 물량은 반품됩니다). 고원패시브 W3까지, 서울PCB테크 W4까지, 한빛전자 W4까지 중 하나이고, hard에서는 미래반도체, 서울PCB테크, 한빛전자 중 한 곳이 W5까지입니다."
  - "예산은 넘을 수 없는 월 상한이고, 발주 금액은 발주 주차의 월요일이 속한 달의 예산으로 잡힌다는 점입니다. W1~W2는 11월, W3~W6은 12월, W7~W8은 1월입니다."
  - "파일 읽는 법입니다. 칩저항 재고는 5,000개들이 릴 단위로 셉니다. 최소주문수량은 발주 라인(주차·부품·공급사 하나)마다 적용되며 여러 주의 수량을 합쳐 채울 수 없습니다. 그 부품의 승인상태가 '승인'인 공급사만 쓸 수 있습니다."
  - "이 난이도에서 무엇이 적용되는지입니다. 리드타임은 주 단위(easy) 또는 영업일 기준(medium과 hard, 성탄절 주와 신정 주는 영업일이 4일뿐)이고, 가격은 정가(easy) 또는 수량 할인(medium과 hard)이며, 플래시 설계변경, 납기 지연, 공급배정 한도는 hard에서만 적용됩니다."
  - "계획의 비용을 계산하는 방식입니다. 발주 금액에 재고유지비, 부품을 기다리는 보드에 대한 결품 대기비, 핵심부품의 안전재고 부족분을 더합니다."
invalid_if:
  - "그 부품의 승인상태가 '승인'이 아닌 공급사에 발주합니다('심사중', '거래정지'는 안 됩니다)."
  - "공급사의 최소주문수량보다 적은 발주 라인이 있습니다."
  - "어느 달이든 구매액이 그 달 예산을 넘습니다(발주 주차의 월요일이 속한 달 기준)."
  - "품질 보류 중인 공급사의 물량이 보류 기간 안에 입고될 예정입니다."
  - "hard에서만: 한 달 발주량이 공급배정 한도를 넘습니다(미래반도체 MCU 6,500개·DRAM 9,000개, 나라디스플레이 디스플레이 3,500개)."
  - "핵심부품을 공급사 한 곳에서만 사거나 한 공급사에 비중 상한(70%, 80%, 90% 중 하나)보다 많이 발주합니다. 단, 회사 정책이 예외를 허용하고 AI가 먼저 고객에게 예외를 요청했다면 위반으로 보지 않습니다."
quality: >-
  모든 발주 금액에 W1~W10 주 단위 시뮬레이션의 비용(매주 재고 1개당 표준원가의 0.5%, 보드가 기다리는 부품 1개당
  표준원가의 5배, 핵심부품 안전재고에 못 미치는 1개당 1.5배)을 더한 총비용(원)이 낮을수록 좋습니다(hard에서는 공급사의
  실제 지연 확률로 평균을 내고, W5 말에 남은 C04에는 표준원가만큼 폐기비가 붙습니다). 기존 방식(0점)은 다음 부족분만큼만
  제때 도착하는 가장 싼 공급사에 발주하고 핵심부품 발주는 매번 비중 상한대로 나누며 할인과 납기 지연은 고려하지 않고,
  모범 답안(1점)은 15가지 계획 방식 가운데 가장 싼 유효한 계획을 고르는데, 이득일 때 할인 구간까지 수량을 올리고 남는
  재고를 줄이며 hard에서는 자주 늦는 공급사의 리드타임을 1주 더 길게 잡습니다.
tiers:
  easy: >-
    기본 계획입니다. 생산 보드 수 × 보드당소요량으로 구한 소요량, 재고와 미입고 발주, 주 단위 리드타임(일수 ÷ 5, 올림),
    정가, 최소주문수량, 승인 공급사, 월 예산, 안전재고, 품질 보류, 핵심부품 2개 업체 발주가 들어갑니다. 설계변경, 수량 할인,
    공휴일, 납기 지연, 공급배정은 빠집니다.
  medium: >-
    수량 할인 구간(한 발주 라인이 구간 수량에 이르면 라인 전체가 낮은 단가)과 영업일 기준 리드타임이 더해집니다. 성탄절
    주(W5)와 신정 주(W6)는 영업일이 4일뿐입니다.
  hard: >-
    납기 지연(공급사마다 1주 또는 2주 늦을 수 있고, 그 확률은 AI가 납품이력에서 추정해야 합니다), 세 부품의 월 공급배정
    한도, 플래시 설계변경(W6부터 C25가 C04를 대신하고, W5 이후 남은 C04는 폐기), 주력 반도체 제조사인 미래반도체에도 걸릴
    수 있는 W5까지의 품질 보류가 더해집니다. 계획환율과 비중 상한은 1,380원과 80%로 고정입니다.
