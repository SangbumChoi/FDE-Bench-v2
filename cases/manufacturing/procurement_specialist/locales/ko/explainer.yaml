# The explainer's case texts in Korean (English comes from case.yaml).
role: 구매 전문가
task_type: 조합 최적화
deliverable_spec: |
  orders.csv, 헤더는 order_week,component_id,supplier_id,quantity
  구매 발주 라인 하나당 한 행: order_week = 발주를 내는 주차로 1..8의 숫자(W1 = 2026-11-23이 속한 주),
  component_id와 supplier_id = 데이터에 있는 그대로, quantity = 정수 개수(릴이 아니라 낱개).
  order_week, component_id, supplier_id가 같은 행은 합쳐서 하나의 발주 라인이 됩니다.
tiers:
  easy: >-
    MRP의 핵심: 보드 생산계획과 BOM으로 전개한 부품 소요량, 주 단위 리드타임, USD 견적을 계획환율로 환산한 정가, 발주 라인별 최소주문수량, 승인업체 목록, 넘을 수 없는 월 예산, 릴
    단위로 센 저항 재고, 핵심부품 안전재고, 품질 보류 중인 공급사 한 곳, 2개 업체 발주 관행, 그리고 메일 스레드에서 합의한 나라디스플레이의 W4 발주부터 디스플레이 12% 인상(모든 난이도
    공통)입니다. 설계변경, 수량 할인 구간, 공휴일 달력, 납품이력, 공급배정은 이번 차수의 범위에서 빠집니다.
  medium: >-
    easy에 더해 발주 라인별 전량 할인 구간, 그리고 공휴일로 짧아지는 주가 두 번 있는 영업일 기준 리드타임입니다.
  hard: >-
    medium에 더해 공급 불확실성이 있습니다. 공급사는 AI에게 알려 주지 않는 확률로 1주 또는 2주 늦게 납품하고(데이터에 6개월치
    납품이력이 있음), 공급이 빠듯한 세 부품에는 월 공급배정 한도가 있으며, W6부터 플래시 C04를 C25로 바꾸는
    설계변경이 있습니다(W5 이후에 남은 C04는 폐기). 품질은 정확한 기대 비용이 됩니다. 품질 보류는 W5까지
    이어지며 주력 반도체 제조사에 걸릴 수도 있습니다. 계획환율(1달러 = 1,380원)과 공급사 비중 상한(80%)은
    평소 값 그대로입니다.
rules:
  approved_vendor: 부품은 승인업체 목록에서 그 부품의 승인상태가 승인인 공급사에만 발주합니다.
  moq: 모든 발주 라인(주차·부품·공급사 하나)은 공급사의 최소주문수량 이상입니다.
  budget_cap: 매월 구매액(발주 주차의 월요일이 속한 달 기준)은 그 달의 예산을 넘지 않습니다.
  quality_hold: "{{hold_supplier}}는 품질 보류 중이며, W1~W{{hold_until}}에 입고 예정인 이 회사 물량은 반품됩니다."
  allocation_cap: 공급배정 대상 부품을 한 공급사에 한 달 동안 발주하는 수량은 그 공급사의 월 배정 한도를 넘지 않습니다.
  dual_source_critical: 사용 중인 핵심부품은 모두 공급사 두 곳 이상에 발주하며, 어느 공급사도 그 부품 발주 수량의 {{max_share}}%를 넘게 가져가지 않습니다.
shortcuts:
  no_orders: "빈 계획: 아무것도 발주하지 않음(재고와 미입고 발주만)."
  express_only: "모든 부품을 리드타임이 가장 짧고 최소주문수량이 가장 작은, 모든 부품 승인 브로커 익스프레스파츠코리아(S09)에서 필요한 만큼씩 발주."
  express_split: "익스프레스파츠코리아(S09)에서 필요한 만큼씩 발주하되, 핵심부품은 가장 싼 다른 승인 공급사와 비중 상한에 맞춰 나눔."
  ignore_budget: "월 예산을 상한이 아닌 목표로 보고 무시한 기준 해법 플래너."
  all_upfront: "10주 필요량 전부를 W1에 보류 중이 아닌 가장 싼 승인 공급사에 발주(핵심부품은 다음으로 싼 공급사와 비중 상한에 맞춰 나눔)."
  no_buffers: "버퍼가 전혀 없는 기준 해법 플래너: 핵심부품 안전재고도, hard에서 자주 늦는 공급사에 1주 더 잡는 여유도 없음(불확실성 무시)."
  critical_only: "핵심부품만 발주(기준 해법의 해당 라인)하고 값싼 부품은 빠뜨림."
  copy_demand: "소요량 그대로 옮기기: 매주 총소요량을 리드타임만큼 앞서 발주하고 재고와 미입고 발주는 차감하지 않음(제때 도착하고 품질 보류가 아닌 가장 싼 승인 공급사, 핵심부품은 점유율 상한에서 분할)."
  constant_orders: "상수 출력: 부품마다 주평균 순소요량을 W1~W8 매주 같은 양으로 발주(품질 보류가 아니고 W10까지 도착하는 가장 싼 승인 공급사, 핵심부품은 점유율 상한에서 분할)."
  baseline_breaks: "고객사 자체 MRP 결과에서 한 가지만 바꿈: 수량 할인 구간까지 올리는 편이 더 싸면 그 라인을 구간 수량으로 올림."
