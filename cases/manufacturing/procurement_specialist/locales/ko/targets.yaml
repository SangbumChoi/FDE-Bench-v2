- id: bom_explosion
  text: 주별 부품 소요량은 그 주 모델별 보드 생산 수량(생산계획.csv)에 자재명세서.csv의 보드당소요량을 곱해 두 모델을 합한 값이며, 모든 수량은 개수 단위입니다.
- id: round_scope_easy
  text: 이번 차수는 정가(단가, 할인 구간 없음)로, 플래시 변경 없이(10주 내내 C04, C25 불필요, 적용 주차 열 무시), 공급사가 모두 약속한 주에 납품하고 발주량을 전부 확정해 준다고 보고 계획합니다(납품이력과 공급배정은 쓰지 않음).
- id: round_scope_medium
  text: 이번 차수는 플래시 변경 없이(10주 내내 C04, C25 불필요, 적용 주차 열 무시), 공급사가 모두 약속한 주에 납품하고 발주량을 전부 확정해 준다고 보고 계획합니다(납품이력과 공급배정은 쓰지 않음).
- id: lead_time_weeks
  text: 이번 차수에는 리드타임을 주 단위로 봅니다(리드타임_일을 5로 나눠 올림, 공휴일 무시). w주차 월요일에 리드타임 L주로 낸 발주는 w+L주차부터 그 주 소요량 전체에 쓸 수 있습니다.
- id: business_day_lead_times
  text: 리드타임은 발주 주차 월요일부터 세는 영업일이며, W5와 W6(성탄절, 신정)는 영업일이 4일, 나머지 주는 5일이고, 물건은 도착 후 처음 시작하는 주부터 쓸 수 있습니다.
- id: usd_planning_rate
  text: Pacific Parts(S04)는 미국 달러로 견적을 내며, 모든 비용과 예산은 원화로 고정 계획환율 1달러 = {{usd_krw}}원을 적용해 환산합니다.
- id: moq_per_line
  text: 최소주문수량은 발주 라인(공급사·부품·발주 주차 하나) 단위로 적용되며, 다른 주차의 수량을 합쳐서 맞출 수 없습니다.
- id: price_breaks
  text: 수량 할인은 발주 라인 단위로 라인 전체에 적용되며(전량 할인), 다른 주차의 수량을 합쳐 할인 구간을 맞출 수 없습니다.
- id: quality_hold
  text: "{{hold_supplier}}는 품질 보류 중이라 W1~W{{hold_until}}에 입고 예정인 물건은 반품되므로, 이 회사 물건은 W{{hold_until}} 이후에만 입고되어야 합니다."
- id: monthly_budget_cap
  text: 월 예산은 목표가 아니라 넘을 수 없는 상한이며, 발주는 발주 주차 월요일이 속한 달로 잡힙니다(W1~W2 11월, W3~W6 12월, W7~W8 1월).
- id: approved_status_only
  text: 해당 부품의 승인상태가 승인인 공급사만 쓸 수 있으며, 심사중이나 거래정지 공급사는 견적을 냈더라도 안 됩니다.
- id: resistor_reels
  text: 재고 파일에서 칩저항(C07, C08, C09)은 5,000개들이 릴 단위로 세며, 나머지 부품과 모든 발주 수량은 개수 단위입니다.
- id: safety_stock
  text: 핵심부품(핵심부품 = 예)은 쓰는 주의 매주 말에 주 평균 소요량의 {{safety_weeks}}배(쓰는 주들의 소요량 합계를 주 수로 나누고 {{safety_weeks}}를 곱해 올림)만큼 안전재고를 유지해야 합니다.
- id: dual_source_critical
  text: 사용 중인 핵심부품은 이번 계획 안에서 서로 다른 공급사 두 곳 이상에 발주해야 하며, 어느 공급사도 그 부품 발주 수량의 {{max_share}}%를 넘으면 안 됩니다. 회사 관행이므로 예외를 요청할 수 있습니다.
- id: cost_model
  text: 계획은 W1~W10 주 단위로 결품 대기(부품이 없으면 보드가 기다림)를 포함해 시뮬레이션하며, 비용 = 구매금액 + 주당 재고 1개마다 표준원가의 0.5% + 결품 대기 1개·주마다 표준원가의 5배 + 핵심부품 안전재고 부족 1개·주마다 표준원가의 1.5배입니다.
- id: supplier_lateness
  text: 공급사마다 고유한 확률로 1주 또는 2주 늦게 납품하며 이는 납품이력.csv에 나타납니다(약속한 월요일보다 1~7일 늦으면 1주 지연, 8~14일이면 2주 지연). 납품 건(공급사·부품·입고주차 하나)마다 독립적으로 지연되며, 미입고 발주는 제때 들어옵니다.
- id: allocation_caps
  text: S03의 C01·C03과 S08의 C06은 발주 주차 기준 달력월마다 공급배정.csv의 수량까지만 확정되며, 넘는 수량은 납품되지 않습니다.
- id: engineering_change
  text: W6부터 두 보드의 플래시 C04가 C25로 바뀝니다. W5 말에 남은 C04는 표준원가로 폐기되고 그 뒤에 들어오는 C04는 쓸모가 없으며, C25는 재고가 없고 핵심부품이라 2개 업체 발주 대상이지만 C04는 안전재고도 2차 공급처도 필요 없습니다.
- id: expected_cost
  text: 납품이 늦을 수 있으므로 품질의 재고유지비, 결품 대기비, 안전재고 부족, C04 폐기비는 공급사의 실제 지연 확률에 대한 기댓값으로 계산합니다(이력은 표본일 뿐). 구매금액은 어느 경우든 전액 지급합니다.
