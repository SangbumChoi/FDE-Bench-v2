# The case in plain words, shown at the top of its page.
# One line per text: a folded line break would put a space into the Chinese text.
task: "一家组装两个控制板型号的工厂需要未来八周（W1 即 2026 年 11 月 23 日那一周，到 W8）的采购下单计划：决定哪一周向哪家供应商订哪种物料、订多少，使生产不因等料而停线，总成本尽量低。AI 提交一个文件 `orders.csv`，每条订单行（周次、物料、供应商、件数）占一行。"
given:
  - "客户的需求：两个板型、二十多种物料，请规划“未来两个月该向哪家供应商订什么、订多少，既不让生产停线，也别超支”；需求里还提到交货记录、配额通知、计划中的闪存工程变更和供应商价格邮件。"
  - "`生产计划.csv` 和 `物料清单.csv`：每个板型每周计划生产的板数（W1–W10），以及每块板所用各物料的件数，其中包含闪存工程变更（C04 用到 W5，新物料 C25 从 W6 起）。"
  - "`物料主数据.csv`、`当前库存.csv`、`在途采购单.csv`：25 种物料各自是否为关键物料及其标准成本、W1 开始时的库存、已下的订单及其到货周次。"
  - "`供应商报价.xlsx` 和 `supplier_price_email.txt`：每种物料、每家供应商的单价（只有 Pacific Parts 以美元报价，其余为韩元）、最小起订量、两档阶梯价和以天计的交期；邮件把 W4 起向 Mirae Semicon（S03）下单的 C01 单价上调 20%。"
  - "`合格供应商名录.csv` 和 `采购预算.csv`：每种物料各供应商的认证状态（已认证、认证中、暂停），以及每月采购预算：11 月 1.15 亿韩元，12 月 4.75 亿韩元，1 月 8,500 万韩元。"
  - "`交货记录.csv` 和 `供应商配额.csv`：过去 188 次交货的承诺到货日和实际到货日，以及两家供应商对三种紧缺物料每月最多确认的数量。"
ask:
  - "Pacific Parts 美元报价所用的计划汇率：随版本不同，为 1 美元 = 1,320、1,380、1,450 或 1,500 韩元（hard 固定为 1,380）。"
  - "关键物料（MCU、电源管理芯片、DRAM、闪存、印制电路板、显示屏）的安全库存：随版本不同，为平均周需求的 0.5、1 或 1.5 倍（MCU 一周约 2,500 件）。"
  - "每种关键物料必须向至少两家供应商下单，任何一家都不得超过该物料数量的 70%、80% 或 90%（随版本不同，hard 固定为 80%）。这是公司惯例，确实能省钱时客户允许例外。"
  - "哪家供应商处于质量冻结、冻结到哪一周（在此之前到货的货会被退回）：Kowon Passive 至 W3、Seoul PCB Tech 至 W4 或 Hanbit Electronics 至 W4；hard 中为 Mirae Semicon、Seoul PCB Tech 或 Hanbit Electronics 之一，均至 W5。"
  - "预算是不可突破的月度上限，订单计入下单周周一所在的月份：W1–W2 为 11 月，W3–W6 为 12 月，W7–W8 为 1 月。"
  - "文件怎么读：贴片电阻的库存按每盘 5,000 个的卷盘计数；最小起订量按每条订单行（同一周、同一物料、同一供应商）计算，不能把几周的数量加起来凑；只能向该物料认证状态为“已认证”的供应商采购。"
  - "本难度要考虑哪些内容：交期按整周计（easy），还是按工作日计、圣诞节和元旦那两周只有 4 个工作日（medium 和 hard）；按标价（easy）还是按阶梯价（medium 和 hard）；以及仅在 hard 中考虑的闪存工程变更、交货延误和配额上限。"
  - "计划的成本怎么算：采购金额，加上库存持有成本、等料板子的欠料成本，以及关键物料低于安全库存的成本。"
invalid_if:
  - "向认证状态不是“已认证”的供应商订购该物料（“认证中”和“暂停”都不行）。"
  - "有订单行低于供应商的最小起订量。"
  - "某个月的采购金额超过当月预算（按下单周的周一归入月份）。"
  - "处于质量冻结的供应商有货计划在冻结期内到货。"
  - "仅限 hard：一个月的下单量超过配额（Mirae Semicon 的 MCU 6,500 件、DRAM 9,000 件，Nara Display 的显示屏 3,500 件）。"
  - "某种关键物料只向一家供应商采购，或某家供应商超过规定比例，除非 AI 事先向客户申请了例外。"
quality: "总成本（韩元）越低越好：所有订单的采购金额，加上从 W1 到 W10 按周模拟得出的费用——每周每件库存计标准成本的 0.5%，板子在等的每件物料计标准成本的 5 倍，关键物料低于安全库存的每件计 1.5 倍（hard 中按各供应商真实的延误概率取平均，W5 结束时剩下的 C04 另按标准成本计报废）。客户原来的做法（记 0 分）只按下一次缺口向来得及到货的最便宜供应商下单，关键物料每单都按比例上限拆给两家供应商，不考虑阶梯价和延误；参考答案（记 1 分）从十五种计划方法中选出最便宜的有效计划，划算时把数量凑到阶梯价，削减多余库存，hard 中对常延误的供应商把交期多算一周。"
tiers:
  easy: "基本计划：由生产板数 × 单板用量得出需求，考虑库存和在途采购单，交期按整周（天数 ÷ 5 向上取整），按标价计价，并遵守最小起订量、合格供应商、月度预算、安全库存、质量冻结和关键物料两家供应商的要求。不考虑工程变更、阶梯价、节假日、交货延误和配额。"
  medium: "增加阶梯价（一条订单行达到阶梯数量，整行按较低单价计）和按工作日计的交期，圣诞节那周（W5）和元旦那周（W6）只有 4 个工作日。"
  hard: "增加交货延误（每家供应商可能晚一周或两周，概率要由 AI 从交货记录中估计）、三种物料的月度配额上限、闪存工程变更（W6 起 C25 取代 C04，W5 之后剩下的 C04 报废），以及持续到 W5、可能落在主力芯片厂 Mirae Semicon 身上的质量冻结。计划汇率和比例上限固定为 1,380 韩元和 80%。"
