- id: bom_explosion
  text: 每周物料需求 = 当周各板型的生产板数（生产计划.csv）乘以物料清单.csv 中的单板用量，两个板型相加；所有数量都以件计。
- id: round_scope_easy
  text: 这一轮按标价（单价，不用阶梯价）做计划，不考虑闪存变更（十周都用 C04，不需要 C25，忽略生效/失效周次），并按供应商都按承诺周交货、下多少确认多少来计划（不使用交货记录和配额）。
- id: round_scope_medium
  text: 这一轮不考虑闪存变更（十周都用 C04，不需要 C25，忽略生效/失效周次），并按供应商都按承诺周交货、下多少确认多少来计划（不使用交货记录和配额）。
- id: lead_time_weeks
  text: 这一轮交期按整周计（交期_天 除以 5 向上取整，不考虑节假日）；第 w 周周一下单、交期 L 周的货从第 w+L 周起可用于该周的全部需求。
- id: business_day_lead_times
  text: 交期是从下单周周一起算的工作日；W5 和 W6（圣诞节和元旦）只有 4 个工作日，其余每周 5 个，货到之后从下一个开始的周起可用。
- id: usd_planning_rate
  text: Pacific Parts（S04）以美元报价；所有成本和预算都以韩元计，按固定计划汇率 1 美元 = {{usd_krw}} 韩元换算。
- id: moq_per_line
  text: 最小起订量按订单行（同一供应商、物料和下单周）计算，不同周的数量不能合并来凑。
- id: price_breaks
  text: 阶梯价按订单行计算，达到阶梯后整行都按该单价（全量折扣）；不同周的数量不能合并来凑阶梯。
- id: quality_hold
  text: "{{hold_supplier}} 处于质量冻结，计划在 W1 到 W{{hold_until}} 到货的货会被退回，所以它的货只能在 W{{hold_until}} 之后到货。"
- id: monthly_budget_cap
  text: 月度预算是不能超过的硬上限，不是目标；订单计入下单周周一所在的月份（W1–W2 为 11 月，W3–W6 为 12 月，W7–W8 为 1 月）。
- id: approved_status_only
  text: 只能使用该物料认证状态为已认证的供应商；认证中和暂停的供应商即使报了价也不能用。
- id: resistor_reels
  text: 库存文件里贴片电阻（C07、C08、C09）按每盘 5,000 个的卷盘计数；其他物料和所有下单数量都以件计。
- id: safety_stock
  text: 关键物料（关键物料 = 是）在使用的每周周末都应保留平均周需求 {{safety_weeks}} 倍的安全库存（使用各周的需求合计除以周数，乘以 {{safety_weeks}}，向上取整）。
- id: dual_source_critical
  text: 每种在用的关键物料在本计划内必须向至少两家不同的供应商下单，且任何一家都不超过该物料下单数量的 {{max_share}}%；这是公司惯例，可以申请例外。
- id: cost_model
  text: 计划在 W1–W10 按周模拟，缺料时板子等料（欠料顺延）；成本 = 采购金额 + 每件每周库存按标准成本的 0.5% + 每件每周欠料按标准成本的 5 倍 + 关键物料每件每周低于安全库存按标准成本的 1.5 倍。
- id: supplier_lateness
  text: 供应商各自以一定概率晚一周或两周交货，见交货记录.csv（比承诺的周一晚 1–7 天为晚一周，晚 8–14 天为晚两周）；每次交货（一家供应商、一种物料、一个到货周）是否延误相互独立；在途采购单按时到货。
- id: allocation_caps
  text: S03 的 C01、C03 和 S08 的 C06 按下单周统计，每个自然月最多只确认供应商配额.csv 中的数量，超出部分不会交货。
- id: engineering_change
  text: 从 W6 起两个板型的闪存 C04 换成 C25；W5 结束时剩下的 C04 按标准成本报废，之后到货的 C04 没有用；C25 没有库存，是关键物料，需要两家供应商，而 C04 既不需要安全库存也不需要第二货源。
- id: expected_cost
  text: 由于交货可能延误，质量中的库存持有、欠料、安全库存不足和 C04 报废成本按供应商真实的延误概率取期望值（交货记录只是样本）；采购金额无论如何都全额支付。
