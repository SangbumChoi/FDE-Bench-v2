- id: bom_explosion
  text: 週ごとの部品所要量は、その週の機種別の生産枚数（生産計画.csv）に部品表.csv の基板当たり員数を掛け、2機種分を合計したものです。数量はすべて個数です。
- id: round_scope_easy
  text: 今回は定価（単価、数量割引なし）で、フラッシュの変更なし（10週間ずっと C04、C25 は不要、適用週の列は無視）、すべての仕入先が約束の週に納入し発注数量をすべて確定してくれる前提で計画します（納入実績と供給割当は使いません）。
- id: round_scope_medium
  text: 今回はフラッシュの変更なし（10週間ずっと C04、C25 は不要、適用週の列は無視）、すべての仕入先が約束の週に納入し発注数量をすべて確定してくれる前提で計画します（納入実績と供給割当は使いません）。
- id: lead_time_weeks
  text: 今回はリードタイムを週単位で扱います（リードタイム_日を5で割って切り上げ、祝日は考えない）。第 w 週の月曜日にリードタイム L 週で出した発注は、第 w+L 週からその週の所要量すべてに使えます。
- id: business_day_lead_times
  text: リードタイムは発注週の月曜日から数える営業日です。W5 と W6（クリスマスと元日）は営業日が4日、他の週は5日で、品物は到着後に始まる最初の週から使えます。
- id: usd_planning_rate
  text: Pacific Parts（S04）はドル建てで見積を出しています。費用と予算はすべてウォンで、固定の計画レート1ドル = {{usd_krw}}ウォンで換算します。
- id: moq_per_line
  text: 最小発注数量は発注明細（仕入先・部品・発注週の1件）ごとに適用され、別の週の数量を合算して届かせることはできません。
- id: price_breaks
  text: 数量割引は発注明細ごとに、明細全体に適用されます（全数量割引）。別の週の数量を合算して割引に届かせることはできません。
- id: quality_hold
  text: "{{hold_supplier}} は品質保留中のため、W1〜W{{hold_until}} に入荷予定の品物は返品されます。同社の品物は W{{hold_until}} より後に入荷させる必要があります。"
- id: monthly_budget_cap
  text: 月次予算は目標ではなく、超えてはならない上限です。発注は発注週の月曜日が属する月（W1〜W2 は11月、W3〜W6 は12月、W7〜W8 は1月）に計上します。
- id: approved_status_only
  text: その部品について承認済の仕入先しか使えません。審査中や取引停止の仕入先は、見積があっても使えません。
- id: resistor_reels
  text: 現在庫ファイルではチップ抵抗（C07、C08、C09）が5,000個巻きのリール単位で記載されています。他の部品とすべての発注数量は個数単位です。
- id: safety_stock
  text: 重要部品（重要部品 = はい）は、使う週の毎週末に週平均所要量の {{safety_weeks}} 倍（使う週の所要量の合計をその週数で割り、{{safety_weeks}} を掛けて切り上げ）を安全在庫として残す必要があります。
- id: dual_source_critical
  text: 使用中の重要部品は今回の計画の中で異なる2社以上の仕入先に発注しなければならず、1社がその部品の発注数量の {{max_share}}% を超えてはいけません。会社の慣行なので例外を申請できます。
- id: cost_model
  text: 計画は W1〜W10 を週単位で、欠品待ち（基板が部品を待つ）を含めてシミュレーションします。コスト = 購買金額 + 週ごとの在庫1個あたり標準原価の0.5% + 欠品待ち1個・1週あたり標準原価の5倍 + 重要部品の安全在庫不足1個・1週あたり標準原価の1.5倍です。
- id: supplier_lateness
  text: 仕入先はそれぞれの確率で1週または2週遅れて納入し、その様子は納入実績.csv に表れています（回答した月曜日の1〜7日後なら1週遅れ、8〜14日後なら2週遅れ）。納入（仕入先・部品・入荷週の1件）ごとに独立に遅れ、未入荷発注は予定どおり入荷します。
- id: allocation_caps
  text: S03 の C01・C03 と S08 の C06 は、発注週で数えて1か月に供給割当.csv の数量までしか確定されず、それを超える分は納入されません。
- id: engineering_change
  text: W6 から両機種のフラッシュ C04 が C25 に替わります。W5 末に残った C04 は標準原価で廃棄、その後に入荷する C04 は使えません。C25 は在庫のない重要部品で2社購買が必要、C04 は安全在庫も2社目も不要です。
- id: expected_cost
  text: 納入が遅れることがあるため、品質では在庫保管コスト、欠品待ちコスト、安全在庫不足、C04 の廃棄コストを各仕入先の実際の遅延確率に対する期待値で数えます（実績は標本にすぎません）。購買金額はいずれにせよ全額支払います。
