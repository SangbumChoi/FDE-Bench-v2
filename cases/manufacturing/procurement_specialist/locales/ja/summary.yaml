# The case in plain words, shown at the top of its page.
# One line per text: a folded line break would put a space into the Japanese text.
task: "2機種の制御基板を組み立てる会社のために、今後8週間（W1 = 2026年11月23日の週から W8 まで）、どの部品をどの仕入先に何個、どの週に発注するかを決め、生産が部品待ちで止まらず総コストが低くなるようにします。AIは発注明細（週・部品・仕入先・個数）ごとに1行の `orders.csv` を1つ提出します。"
given:
  - "顧客の依頼：2機種の基板と20数点の部品について、「今後2か月、生産を止めず、かつ使いすぎにならないように」どの部品をどの仕入先にどれだけ発注するか計画してほしいという内容です。納入実績、供給割当の通知、予定されているフラッシュメモリの設計変更、仕入先からの価格メールにも触れています。"
  - "`生産計画.csv` と `部品表.csv`：機種ごとの週別の生産枚数（W1〜W10）と、基板1枚に使う部品ごとの個数です。フラッシュの設計変更（C04 は W5 まで、新しい C25 は W6 から）も入っています。"
  - "`部品マスタ.csv`、`現在庫.csv`、`未入荷発注.csv`：25部品それぞれの重要部品かどうかと標準原価、W1 開始時点の在庫、発注済みの注文とその入荷週です。"
  - "`仕入先見積.xlsx` と `supplier_price_email.txt`：部品・仕入先ごとの単価（Pacific Parts だけドル建て、ほかはウォン建て）、最小発注数量、2段階の数量割引、日数で示したリードタイムです。メールは、W4 以降に発注する Mirae Semicon（S03）の C01 の単価を20%引き上げます。"
  - "`承認仕入先リスト.csv` と `購買予算.csv`：部品ごとの仕入先の承認状況（承認済、審査中、取引停止）と、月ごとの購買予算（11月 1億1,500万ウォン、12月 4億7,500万ウォン、1月 8,500万ウォン）です。"
  - "`納入実績.csv` と `供給割当.csv`：過去188件の納入の納期回答日と実入荷日、そして2社の仕入先が供給の逼迫した3部品を1か月に最大何個まで確定してくれるかです。"
ask:
  - "Pacific Parts のドル建て単価に使う計画レートです。バージョンによって1ドル = 1,320、1,380、1,450、1,500ウォンのいずれかです（hard では常に1,380ウォン）。"
  - "重要部品（MCU、電源管理IC、DRAM、フラッシュ、プリント基板、ディスプレイ）の安全在庫です。バージョンによって週平均所要量の0.5倍、1倍、1.5倍のいずれかです（MCU なら1週分は約2,500個）。"
  - "重要部品は2社以上の仕入先から買い、1社が数量の70%、80%、90%（バージョンによります。hard では常に80%）を超えてはいけないことです。会社の慣行なので、実際にコストが下がるなら顧客は例外を認めます。"
  - "品質保留中の仕入先と、保留が続く週です（それまでに入荷予定の品物は返品されます）。Kowon Passive が W3 まで、Seoul PCB Tech が W4 まで、Hanbit Electronics が W4 までのいずれかで、hard では Mirae Semicon、Seoul PCB Tech、Hanbit Electronics のいずれかが W5 までです。"
  - "予算は超えられない月ごとの上限で、発注は発注週の月曜日が属する月に計上されることです。W1〜W2 は11月、W3〜W6 は12月、W7〜W8 は1月です。"
  - "ファイルの読み方です。チップ抵抗の在庫は5,000個巻きのリール単位で数えます。最小発注数量は発注明細（週・部品・仕入先の1件）ごとにかかり、複数の週を合算して満たすことはできません。その部品で「承認済」の仕入先しか使えません。"
  - "この難易度で何が適用されるかです。リードタイムは easy では週単位、medium・hard では営業日単位（クリスマスの週と元日の週は営業日が4日だけ）です。価格は easy では定価のみ、medium・hard では数量割引も使います。さらに hard のみ、フラッシュの設計変更、納期遅延、供給割当の上限が加わります。"
  - "計画のコストの数え方です。発注金額に、在庫保管コスト、部品を待つ基板の欠品待ちコスト、重要部品の安全在庫不足を加えます。"
invalid_if:
  - "その部品で「承認済」でない仕入先に発注しています（「審査中」「取引停止」は使えません）。"
  - "仕入先の最小発注数量を下回る発注明細があります。"
  - "どこかの月の購買額がその月の予算を超えています（発注週の月曜日が属する月で判定します）。"
  - "品質保留中の仕入先の品物が、保留期間中に入荷予定になっています。"
  - "hard のみ：1か月の発注数量が供給割当を超えています（Mirae Semicon は MCU 6,500個・DRAM 9,000個、Nara Display はディスプレイ3,500個）。"
  - "重要部品を1社だけから買っているか、1社に決められた割合より多く発注しています。ただし、AIが顧客に例外を申請した場合は除きます。"
quality: "全発注の金額に W1〜W10 の週単位シミュレーションのコスト（毎週の在庫1個あたり標準原価の0.5%、基板が待っている部品1個あたり標準原価の5倍、重要部品の安全在庫を下回る1個あたり1.5倍）を加えた総コスト（ウォン）が低いほど良い評価です（hard では仕入先の実際の遅延確率で平均し、W5 末に残った C04 には標準原価の廃棄コストがかかります）。従来のやり方（0点）は次の不足分だけを間に合う最も安い仕入先に発注し、重要部品の発注は毎回割合の上限どおりに分け、割引も納期遅延も考えません。模範解答（1点）は15通りの計画方法のうち最も安い有効な計画を選び、得になるときは割引の数量まで発注を増やし、余る在庫を削り、hard ではよく遅れる仕入先のリードタイムを1週長く見込みます。"
tiers:
  easy: "基本の計画です。生産枚数 × 基板当たり員数で求める所要量、在庫と未入荷発注、週単位のリードタイム（日数 ÷ 5、切り上げ）、定価、最小発注数量、承認済の仕入先、月ごとの予算、安全在庫、品質保留、重要部品の2社購買が入ります。設計変更、数量割引、祝日、納期遅延、供給割当は含みません。"
  medium: "数量割引（1件の発注明細が割引数量に届けば明細全体が安い単価になります）と営業日単位のリードタイムが加わります。クリスマスの週（W5）と元日の週（W6）は営業日が4日だけです。"
  hard: "納期遅延（仕入先ごとに1週または2週遅れることがあり、その確率はAIが納入実績から推定します）、3部品の月ごとの供給割当、フラッシュの設計変更（W6 から C25 が C04 に代わり、W5 より後に残った C04 は廃棄）、主要な半導体メーカー Mirae Semicon にもかかりうる W5 までの品質保留が加わります。計画レートと割合の上限は1,380ウォンと80%で固定です。"
