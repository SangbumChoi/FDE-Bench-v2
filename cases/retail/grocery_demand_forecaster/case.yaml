id: grocery_demand_forecaster
role: Grocery Demand Forecaster
task_type: Machine Learning
field: retail
seed: 20261102
objective: minimize          # mean over stores of WAPE against true demand in the horizon
deliverables: [forecast.csv]
deliverable_spec: |
  forecast.csv with ASCII header store_id,item_id,date,forecast
  One row per store x item x date in the 14-day horizon (2026-11-02 .. 2026-11-15);
  store_id / item_id exactly as in the data (e.g. S1, I01), date as YYYY-MM-DD,
  forecast = expected units of the item's current sales unit (a number, decimals allowed).
rules:
  - id: complete_grid
    class: contractual
    description: forecast.csv has exactly one row for every store x item x date in the horizon.
  - id: non_negative
    class: physical
    description: No forecast is negative.
  - id: closed_day_zero
    class: physical
    description: Store S4 is closed on Sundays; its Sunday forecasts are 0.
  - id: min_display_stock
    class: business_policy
    description: Core items (fresh produce and dairy) are never forecast below 6 units on a day the store is open.
