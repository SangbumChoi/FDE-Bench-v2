- id: base_forecast
  kind: missing
  domain: business rule
  text: En esta ronda solo se quiere la previsión base; las promociones de plan_promociones.csv y el festivo
    regional único los añade el equipo de categorías, así que se dejan fuera y la previsión se evalúa
    con las ventas base, sin esos efectos.
- id: s4_sunday_closed
  kind: missing
  domain: business rule
  text: La tienda Casco Antiguo S4 cierra los domingos y su previsión para esos días debe ser 0.
- id: min_display
  kind: missing
  domain: business rule
  text: Los artículos básicos (fruta y verdura y lácteos, I01-I06) nunca tienen una previsión por debajo
    de 6 unidades en un día en que la tienda abre.
- id: wape_metric
  kind: missing
  domain: scoring
  text: La calidad es el WAPE por tienda (suma de errores absolutos entre la suma de lo real), promediado
    entre las cinco tiendas; cuanto más bajo, mejor. En esta ronda lo real son las ventas de caja con
    las devoluciones restadas (los días de rotura, tal como se registraron) y los panecillos I07 no se
    evalúan.
- id: submission_format
  kind: ambiguous
  domain: deliverable
  text: Se entrega forecast.csv con las columnas store_id,item_id,date,forecast y exactamente una fila
    por tienda, artículo y día del 2026-11-02 al 2026-11-15 (840 filas).
