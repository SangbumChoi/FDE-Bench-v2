- id: base_forecast
  kind: missing
  domain: business rule
  text: 这一轮只要基础预测；促销计划.csv 中的促销和那个一次性地方假日由品类团队另外加，所以不算进去，预测按去掉这些影响后的基础销量来评估。
- id: s4_sunday_closed
  kind: missing
  domain: business rule
  text: 老城店 S4 每周日休息，周日的预测必须为 0。
- id: min_display
  kind: missing
  domain: business rule
  text: 核心商品（果蔬和乳制品，I01-I06）在门店营业日的预测量不得低于 8。
- id: wape_metric
  kind: missing
  domain: scoring
  text: 质量按每家门店的加权 WAPE（少预测的每一件按多预测一件的 2 倍计，再除以实际之和）计算，再对 5 家门店取平均，越低越好。这一轮的实际是扣除退货后的收银销量，缺货日按记录算，小餐包
    I07 不评估。
- id: submission_format
  kind: ambiguous
  domain: deliverable
  text: 提交 forecast.csv，列为 store_id,item_id,date,forecast，2026-11-02 至 2026-11-15 每个门店、商品、日期恰好一行（共 840
    行）。
