- id: stockout_censoring
  kind: ambiguous
  domain: data semantics
  text: Los días con rotura de stock las unidades_vendidas están limitadas por el stock; se prevé la demanda
    de los clientes, así que esos días no se tratan como ventas normales.
- id: returns
  kind: ambiguous
  domain: data semantics
  text: Las filas con unidades_vendidas negativas son devoluciones de clientes registradas el día de la
    devolución; no son demanda y se excluyen, sin restarlas de las ventas.
- id: s4_sunday_closed
  kind: missing
  domain: business rule
  text: La tienda Casco Antiguo S4 cierra los domingos y su previsión para esos días debe ser 0.
- id: promo_plan
  kind: missing
  domain: data semantics
  text: Hay que usar las promociones de plan_promociones.csv (con las fechas de inicio y fin incluidas);
    el aumento crece con el descuento, varía por categoría y se estima con el descuento_promo_pct del
    historial.
- id: promo_flyer
  kind: missing
  domain: business rule
  text: Las promociones de noviembre funcionan como las anteriores (solo etiqueta en el lineal, sin folleto),
    así que el aumento estimado del historial vale tal cual.
- id: promo_revision
  kind: missing
  domain: business rule
  text: El viernes 30 de octubre, después de exportar plan_promociones.csv, se cancelaron todas las promociones
    de panadería del plan; no se harán y el resto del plan se mantiene.
- id: one_off_holiday
  kind: missing
  domain: business rule
  text: El festivo regional único del lunes 9 de noviembre de 2026 no está en festivos.csv; las tiendas
    abren y la demanda sube como en los festivos anteriores, sobre todo en panadería y bebidas.
- id: unit_change_i07
  kind: missing
  domain: data semantics
  text: Los panecillos I07 se registraban por unidad hasta el 31 de mayo de 2026 y por paquete de 6 desde
    el 1 de junio de 2026; el historial anterior se divide por 6 y I07 se prevé en paquetes.
- id: min_display
  kind: missing
  domain: business rule
  text: Los artículos básicos (fruta y verdura y lácteos, I01-I06) nunca tienen una previsión por debajo
    de 6 unidades en un día en que la tienda abre.
- id: wape_metric
  kind: missing
  domain: scoring
  text: La calidad es el WAPE por tienda (suma de errores absolutos entre la suma de lo real), promediado
    entre las cinco tiendas; cuanto más bajo, mejor. Lo real es la demanda de los clientes, incluidas
    las ventas perdidas por rotura de stock.
- id: submission_format
  kind: ambiguous
  domain: deliverable
  text: Se entrega forecast.csv con las columnas store_id,item_id,date,forecast y exactamente una fila
    por tienda, artículo y día del 2026-11-02 al 2026-11-15 (840 filas).
