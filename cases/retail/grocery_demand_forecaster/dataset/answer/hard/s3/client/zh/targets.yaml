- id: stockout_censoring
  kind: ambiguous
  domain: data semantics
  text: 缺货日的销量受库存上限限制；要预测的是顾客需求，这些日子不能当作正常销售。
- id: returns
  kind: ambiguous
  domain: data semantics
  text: 销量为负数的行是顾客退货，记在退货当天；退货不是需求，应剔除，而不是与当天销量相抵。
- id: s4_sunday_closed
  kind: missing
  domain: business rule
  text: 老城店 S4 每周日休息，周日的预测必须为 0。
- id: promo_plan
  kind: missing
  domain: data semantics
  text: 必须使用促销计划.csv 中的促销（开始和结束日期都包含在内）；提升幅度随折扣增加、因品类而异，需从历史的促销折扣_% 中估计。
- id: promo_flyer
  kind: missing
  domain: business rule
  text: 11 月的促销和以往一样（只有货架价签，没有宣传单），从历史中估计出的提升照原样用。
- id: promo_revision
  kind: missing
  domain: business rule
  text: 10 月 30 日（周五），在促销计划.csv 导出之后，计划里所有烘焙类促销都已取消，不会执行；计划的其余部分不变。
- id: one_off_holiday
  kind: missing
  domain: business rule
  text: 2026 年 11 月 9 日（周一）的一次性地方假日不在节假日.csv 里；门店照常营业，需求会像以往假日一样上升，烘焙和饮料涨幅最大。
- id: unit_change_i07
  kind: missing
  domain: data semantics
  text: 小餐包 I07 在 2026 年 5 月 31 日之前按个记录，6 月 1 日起按 6 个装一包记录；之前的历史要除以 6，I07 按包预测。
- id: min_display
  kind: missing
  domain: business rule
  text: 核心商品（果蔬和乳制品，I01-I06）在门店营业日的预测量不得低于 6。
- id: wape_metric
  kind: missing
  domain: scoring
  text: 质量按每家门店的 WAPE（绝对误差之和 ÷ 实际之和）计算，再对 5 家门店取平均，越低越好。实际是顾客需求，包括缺货损失的销量。
- id: submission_format
  kind: ambiguous
  domain: deliverable
  text: 提交 forecast.csv，列为 store_id,item_id,date,forecast，2026-11-02 至 2026-11-15 每个门店、商品、日期恰好一行（共 840
    行）。
