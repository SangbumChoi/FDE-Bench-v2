- id: s4_sunday_closed
  kind: missing
  domain: business rule
  text: La tienda Casco Antiguo S4 cierra los domingos y su previsión para esos días debe ser 0.
- id: promo_plan
  kind: missing
  domain: data semantics
  text: Hay que usar las promociones de plan_promociones.csv (con las fechas de inicio y fin incluidas);
    el aumento crece con el descuento, varía por categoría y se estima con el descuento_promo_pct del
    historial.
- id: promo_flyer
  kind: missing
  domain: business rule
  text: Las promociones de noviembre salen también en el folleto impreso y traen unas 2 veces las ventas
    adicionales de una promoción pasada con el mismo descuento en la misma categoría.
- id: one_off_holiday
  kind: missing
  domain: business rule
  text: El festivo regional único del viernes 13 de noviembre de 2026 no está en festivos.csv; las tiendas
    abren y la demanda sube como en los festivos anteriores, sobre todo en panadería y bebidas.
- id: min_display
  kind: missing
  domain: business rule
  text: Los artículos básicos (fruta y verdura y lácteos, I01-I06) nunca tienen una previsión por debajo
    de 4 unidades en un día en que la tienda abre.
- id: wape_metric
  kind: missing
  domain: scoring
  text: La calidad es un WAPE ponderado por tienda en el que cada unidad prevista de menos cuenta 3 veces
    una unidad prevista de más, dividido entre la suma de lo real, promediado entre las cinco tiendas;
    cuanto más bajo, mejor. En esta ronda lo real son las ventas de caja con las devoluciones restadas
    (los días de rotura, tal como se registraron) y los panecillos I07 no se evalúan.
- id: submission_format
  kind: ambiguous
  domain: deliverable
  text: Se entrega forecast.csv con las columnas store_id,item_id,date,forecast y exactamente una fila
    por tienda, artículo y día del 2026-11-02 al 2026-11-15 (840 filas).
