# The case in plain words, shown at the top of its page.
task: >-
  점포 5곳을 운영하는 식료품 체인은 일별 판매 예측을 보고 발주를 넣습니다. AI는 2026년 11월 2일(월)부터 15일(일)까지 매일
  점포마다 상품 12개가 각각 얼마나 팔릴지 예측해, 점포·상품·날짜마다 한 행씩(총 840행) 상품의 현재 판매단위로 적은
  `forecast.csv`를 냅니다.
given:
  - "고객의 요청: 11월 2일(월)부터 2주 동안 5개 점포에서 상품별로 하루에 얼마나 팔릴지 예측해 달라는 세 문장이며, \"이 숫자를 보고 발주를 넣습니다\"라고 합니다. 행사, 공휴일, 품절, 평가 방법은 전혀 말하지 않습니다."
  - "`판매이력.csv`: 2년 치 일별 판매 기록(2024년 11월 4일~2026년 11월 1일, 43,718행)입니다. 점포·상품·영업일마다 판매수량, 그날의 행사 할인율(0이면 행사 없음), 품절 여부(4,390행이 예)가 있고, 판매수량이 음수인 고객 반품 행 1,286개가 따로 들어 있습니다. 모닝빵(I07)은 2026년 5월 31일까지 낱개로, 그 뒤로는 6개입 팩으로 기록되어 있지만 파일에는 그런 설명이 없습니다."
  - "`행사계획.csv`: 2주 동안 예정된 행사 14건(점포, 상품, 시작일, 종료일, 할인율 10·20·30%)입니다. 음료 7건, 베이커리 3건, 유제품 2건, 신선 청과 2건입니다."
  - "`공휴일.csv`: 지난 2년의 공휴일 12개(성탄절, 신정, 근로자의 날, 봄·여름·가을 공휴일이 각각 두 번)입니다. 예측하는 2주 안에 드는 날은 없고, 11월의 일회성 지역 공휴일도 나오지 않습니다."
  - "`점포목록.csv`와 `상품목록.csv`: 점포 5곳(슈퍼마켓 4곳과 소형 매장인 구도심점 S4)과 4개 카테고리(신선 청과 I01–I03, 유제품 I04–I06, 베이커리 I07–I09, 음료 I10–I12)의 상품 12개이며, 상품마다 kg, 병, 6개입 팩 같은 판매단위가 적혀 있습니다."
ask:
  - "예측을 무엇과 비교해 평가하는지입니다. easy와 medium에서는 포스에 찍힌 판매량입니다. 고객 반품(판매수량이 음수인 행)은 그날 판매량에서 차감하고, 품절일도 기록된 그대로 봅니다. easy에서는 여기서 행사와 공휴일 효과도 뺀 값입니다. hard에서는 고객 수요입니다. 품절일에는 진열대가 비어 실제 수요가 판매량보다 컸으므로 평소 판매로 쓰면 안 되고, 반품은 수요가 아니므로 반품 행은 뺍니다."
  - "`행사계획.csv`의 행사를 어떻게 다룰지입니다. easy에서는 카테고리팀이 나중에 따로 얹으므로 빼고, 행사일도 평소처럼 예측합니다. medium과 hard에서는 반영합니다(시작일과 종료일 모두 포함). 추가 판매는 과거 행사에서 카테고리·할인율별로 추정합니다. 일부 버전에서는 11월 행사가 종이 전단에도 실려 과거 행사보다 추가 판매가 1.5배 또는 2배가 되고, 나머지 버전에서는 전단이 없어 과거의 효과를 그대로 씁니다."
  - "`공휴일.csv`에 없는 일회성 지역 공휴일입니다. easy에서는 행사처럼 빼고, 그날은 같은 요일의 평소 날처럼 예측합니다. medium과 hard에서는 버전에 따라 11월 9일(월), 11일(수), 13일(금) 중 하루이며(시민의 날), 모든 점포가 정상 영업하고 과거 공휴일처럼 판매가 늘어납니다. 베이커리와 음료가 가장 많이 늘어납니다."
  - "hard에서만: 10월 30일(금), `행사계획.csv`를 내려받은 뒤에 한 카테고리의 행사가 모두 취소되어 진행하지 않습니다. 버전에 따라 음료, 유제품, 베이커리 중 하나입니다."
  - "모닝빵(I07): easy와 medium에서는 평가하지 않지만 파일에는 행이 있어야 합니다. hard에서는 평가하므로, 2026년 6월 1일 이전 이력을 6으로 나눠 팩 단위로 맞춰야 합니다."
  - "구도심점(S4)은 매주 일요일 휴무입니다. 그래서 이력에 S4의 일요일 행이 없고, S4의 일요일 예측은 0이어야 합니다."
  - "신선 청과와 유제품(I01–I06)에 대한 고객의 관행입니다. 점포가 영업하는 날에는 예측을 판매단위로 4, 6 또는 8(버전에 따라 다름) 이상으로 잡습니다. 진열대가 비어 보이지 않게 하기 위해서입니다."
  - "적게 잡았을 때의 손해입니다. 버전에 따라 적게 잡은 1개를 많게 잡은 1개의 1배, 2배, 3배로 계산합니다(1배면 똑같이 계산합니다)."
invalid_if:
  - "파일을 읽을 수 없습니다. `forecast.csv`가 없거나, 데이터에 없는 점포·상품이 있거나, 날짜가 2026년 11월 2일~15일 밖이거나, 예측값이 숫자가 아닙니다."
  - "빠진 행이나 중복된 행이 있습니다. 점포·상품·날짜마다 정확히 한 행씩 모두 840행이 있어야 하며, 평가하지 않는 경우에도 모닝빵(I07) 행이 들어가야 합니다."
  - "음수 예측이 있습니다."
  - "구도심점(S4)의 일요일(11월 8일, 15일) 예측이 0이 아닙니다."
  - "점포가 영업하는 날 신선 청과·유제품(I01–I06) 예측이 하한(버전에 따라 4, 6, 8 중 하나)보다 적습니다. 단, 회사 정책이 예외를 허용하고 AI가 먼저 고객에게 예외를 요청했다면 위반으로 보지 않습니다."
quality: >-
  낮을수록 좋습니다. 점포마다 많게 잡은 수량에 적게 잡은 수량의 1배, 2배 또는 3배(버전에 따른 가중치)를 더하고, 그 점포 모든
  상품·날짜의 실제 합계로 나눈 뒤 5개 점포의 평균을 냅니다. 기존 방식(0점)은 지난주(10월 26일~11월 1일) 같은 요일의 판매량을 두
  주 모두에 그대로 쓰고 S4 일요일은 0, 신선 청과·유제품은 하한까지 올리며, 행사·공휴일·품절·가중치는 무시합니다(이 페이지의
  버전에서 오차 약 27~68%). 모범 답안(1점)은 이력에서 점포·상품별 최근 수준, 요일 패턴, 계절, 과거 행사와 공휴일의 효과를
  추정하고, 적게 잡은 손해가 클수록 예측을 높게 잡습니다(약 14~27%).
tiers:
  easy: >-
    기본 예측만 합니다. 점포·상품별로 평소 하루에 얼마나 팔리는지 예측하고, 행사와 공휴일 효과를 뺀 포스 판매량(반품 차감)과
    비교해 평가합니다. S4 일요일 휴무, 신선 청과·유제품 하한, 적게 잡은 손해의 가중치가 적용되고, 모닝빵(I07)은 평가하지 않습니다.
  medium: >-
    `행사계획.csv`의 행사(일부 버전에서는 전단 때문에 과거 추가 판매의 1.5배 또는 2배)와 11월 9일, 11일, 13일 중 하루인 일회성
    지역 공휴일이 더해집니다. 평가는 여전히 반품을 차감한 포스 판매량 기준이고, 모닝빵은 평가하지 않습니다.
  hard: >-
    포스 판매량 대신 고객 수요와 비교해 평가합니다. 품절일 판매량은 수요보다 적고, 반품은 수요가 아닙니다. 모닝빵도 평가하므로
    2026년 6월 1일 낱개에서 6개입 팩으로 바뀐 단위가 중요해지고, `행사계획.csv`를 내려받은 뒤인 10월 30일에 한 카테고리(음료,
    유제품, 베이커리 중 하나)의 행사가 취소되었습니다.
