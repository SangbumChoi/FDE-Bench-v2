# The case in plain words, shown at the top of its page.
task: >-
  점포 5곳을 운영하는 식료품 체인은 일별 예측을 보고 발주를 넣습니다. AI는 상품 12개에 대해 2026년 11월 2일(월)부터 15일(일)까지
  매일 점포마다 얼마를 발주해야 하는지 계산해, 점포·상품·날짜마다 한 행씩(총 840행) 발주 수량을 상품의 현재 판매단위로 적은
  `forecast.csv`를 냅니다. 점포는 그 숫자 그대로 발주하므로 파일은 발주 계획으로 채점합니다. 어쩌다 그렇게 지나간 어느 11월과
  비교하는 것이 아니라, 그 계획이 평균적으로 낼 비용을 봅니다.
given:
  - "고객의 요청: 11월 2일(월)부터 2주 동안 5개 점포에서 상품별로 하루에 얼마나 팔릴지 예측해 달라는 세 문장이며, \"이 숫자를 보고 발주를 넣습니다\"라고 합니다. 숫자가 틀리면 드는 비용, 행사, 공휴일, 품절, 평가 방법은 전혀 말하지 않습니다."
  - "`판매이력.csv`: 2년 치 일별 판매 기록(2024년 11월 4일~2026년 11월 1일)입니다. 점포·상품·영업일마다 판매수량, 그날의 행사 할인율(0이면 행사 없음), 품절 여부(7,175행이 예, 약 여섯 행에 한 행)가 있고, 판매수량이 음수인 고객 반품 행 1,255개도 들어 있어 모두 43,687행입니다. 모닝빵(I07)은 2026년 5월 31일까지 낱개로, 그 뒤로는 6개입 팩으로 기록되어 있지만 파일에는 그런 설명이 없습니다."
  - "`행사계획.csv`: 2주 동안 예정된 행사 14건(점포, 상품, 시작일, 종료일, 할인율 10·20·30%)입니다. 음료 7건, 베이커리 3건, 유제품 2건, 신선 청과 2건입니다."
  - "`공휴일.csv`: 지난 2년의 공휴일 12개(성탄절, 신정, 근로자의 날, 봄·여름·가을 공휴일이 각각 두 번)입니다. 이 2주 안에 드는 날은 없고, 11월의 일회성 지역 공휴일도 나오지 않습니다."
  - "`점포목록.csv`와 `상품목록.csv`: 점포 5곳(슈퍼마켓 4곳과 소형 매장인 구도심점 S4)과 4개 카테고리(신선 청과 I01–I03, 유제품 I04–I06, 베이커리 I07–I09, 음료 I10–I12)의 상품 12개이며, 상품마다 kg, 병, 6개입 팩 같은 판매단위가 적혀 있습니다."
  - "`mail/`: 10월 28일에 중앙광장점(S1) 점장이 발주 담당에게 보낸 메일 한 통입니다. 숫자가 어떻게 나오든 자기 점포에는 20%를 더 얹어 달라는 내용입니다."
ask:
  - "숫자를 어디에 쓰는지입니다. 각 점포는 파일의 숫자 그대로 발주하고, 안전 여유분을 따로 얹는 사람은 없습니다. 그래서 고객에게 필요한 것은 예상 판매량이 아니라 발주 수량입니다."
  - "숫자가 틀리면 드는 비용입니다. 고객이 찾았는데 없어서 못 산 1개의 손해는 마감 때 남은 1개의 약 5배, 12배 또는 30배입니다(버전에 따라 다름)."
  - "품절 표시의 뜻입니다. 그런 날에는 진열대가 비어 판매량이 재고만큼으로 잘렸고 수요는 그보다 컸으므로 평소 판매로 쓰면 안 됩니다. 반품(판매수량이 음수인 행)은 수요가 아니므로 뺍니다."
  - "`행사계획.csv`의 행사를 어떻게 다룰지입니다. easy에서는 뺍니다. 카테고리팀이 나중에 따로 얹기 때문입니다. medium과 hard에서는 발주 수량에 넣습니다(시작일과 종료일 모두 포함). 추가 판매는 과거 행사에서 카테고리·할인율별로 추정합니다. 일부 버전에서는 11월 행사가 종이 전단에도 실려 과거 행사보다 추가 판매가 2배 또는 3배가 되고, 나머지 버전에서는 전단이 없습니다."
  - "`공휴일.csv`에 없는 일회성 지역 공휴일입니다. 버전에 따라 11월 9일(월), 11일(수), 13일(금) 중 하루이며(시민의 날), 모든 점포가 정상 영업하고 과거 공휴일처럼 수요가 늘어납니다. 베이커리와 음료가 가장 많이 늘어납니다."
  - "hard에서만: 10월 30일(금), `행사계획.csv`를 내려받은 뒤에 한 카테고리의 행사가 모두 취소되어 진행하지 않습니다. 버전에 따라 음료, 유제품, 베이커리 중 하나입니다."
  - "중앙광장점 점장의 메일을 따라야 하는지입니다. 따르지 않습니다. 점장 개인의 바람일 뿐 회사 방침이 아니며, 그 점포도 다른 점포와 똑같이 발주합니다."
  - "신선 청과와 유제품(I01–I06)에 대한 고객의 관행입니다. 점포가 영업하는 날에는 발주 수량을 판매단위로 4, 6 또는 12(버전에 따라 다름) 이상으로 잡습니다. 진열대가 비어 보이지 않게 하기 위해서입니다."
  - "파일입니다. 점포·상품·날짜마다 정확히 한 행씩 모두 840행이며, 구도심점의 일요일(휴무이므로 0)과 모닝빵(I07)도 들어가야 합니다. 모닝빵은 hard에서만 평가하고, 그때는 2026년 6월 1일 이전 이력을 6으로 나눠야 합니다."
invalid_if:
  - "파일을 읽을 수 없습니다. `forecast.csv`가 없거나, 수량이 든 열이 없거나(`order_qty` 열, 없으면 `forecast` 열, 그것도 없으면 나머지 중 하나뿐인 숫자 열을 읽습니다), 데이터에 없는 점포·상품이 있거나, 날짜가 2026년 11월 2일~15일 밖이거나, 수량이 숫자가 아닙니다."
  - "빠진 행이나 중복된 행이 있습니다. 점포·상품·날짜마다 정확히 한 행씩 모두 840행이 있어야 하며, 평가하지 않는 경우에도 모닝빵(I07) 행이 들어가야 합니다."
  - "음수 발주 수량이 있습니다."
  - "구도심점(S4)의 일요일(11월 8일, 15일) 발주 수량이 0이 아닙니다."
  - "점포가 영업하는 날 신선 청과·유제품(I01–I06) 발주 수량이 하한(버전에 따라 4, 6, 12 중 하나)보다 적습니다. 단, 회사 정책이 예외를 허용하고 AI가 먼저 고객에게 예외를 요청했다면 위반으로 보지 않습니다."
quality: >-
  낮을수록 좋습니다. 점포마다 남을 것으로 예상되는 수량에 부족할 것으로 예상되는 수량의 5배, 12배 또는 30배(버전에 따라 다름)를
  더하고, 그 점포 모든 상품·날짜의 예상 수요로 나눈 뒤 5개 점포의 평균을 냅니다. \"예상\"은 수요가 날마다 흔들리는 정도에 대한
  평균이며 벤치마크는 그것을 정확히 알고 있습니다. 그래서 점수가 운 좋거나 나쁜 어느 한 번의 11월에 달려 있지 않고, 가장 좋은
  계획도 알려져 있습니다. 기존 방식(0점)은 점장들의 습관입니다. 최근 8주 같은 요일 판매량의 평균(품절된 날 제외)에 10%, 20% 또는
  30%의 여유분을 더하고, 행사일에는 할인율 1%포인트마다 2%를 더 잡으며, 공휴일은 토요일처럼 발주합니다(이 페이지의 버전에서 비용은
  수요의 약 35~54%). 모범 답안(1점)은 진열대가 비지 않았던 날들로부터 점포·상품별 수준, 요일 패턴, 계절, 과거 행사와 공휴일의
  효과를 추정한 뒤 두 비용이 균형을 이루는 수량을 발주합니다(약 28~39%). 가장 좋은 계획은 약 1.04점입니다.
tiers:
  easy: >-
    행사를 뺀 발주 수량입니다. 행사는 카테고리팀이 나중에 얹습니다. 나머지는 모두 적용됩니다. 점포가 숫자 그대로 발주한다는 점,
    못 판 1개의 비용, 품절일, 일회성 공휴일, S4 일요일 휴무, 신선 청과·유제품 하한, 점장의 메일이 그렇습니다. 모닝빵(I07)은
    평가하지 않습니다.
  medium: >-
    `행사계획.csv`의 행사(일부 버전에서는 전단 때문에 과거 추가 판매의 2배 또는 3배)가 더해집니다. 모닝빵은 여전히 평가하지
    않습니다.
  hard: >-
    모닝빵이 더해지므로 2026년 6월 1일 낱개에서 6개입 팩으로 바뀐 단위가 중요해지고, `행사계획.csv`를 내려받은 뒤인 10월 30일에
    한 카테고리(음료, 유제품, 베이커리 중 하나)의 행사가 취소되었습니다.
