- id: base_forecast
  text: 이번 회차에는 기본 예측만 필요합니다. 행사계획.csv의 행사와 일회성 지역 공휴일은 카테고리팀이 따로 얹으므로 빼고 예측하며, 그 효과를 걷어 낸 기본 판매량으로 평가합니다.
- id: stockout_censoring
  text: 품절일의 판매수량은 재고만큼으로 잘려 있습니다. 예측 대상은 고객 수요이므로 이런 날을 평소 판매처럼 쓰면 안 됩니다.
- id: returns
  text: 판매수량이 음수인 행은 반품한 날짜로 기록된 고객 반품입니다. 수요가 아니므로 제외하고, 판매량에서 차감하지 않습니다.
- id: s4_sunday_closed
  text: 구도심점 S4는 매주 일요일 휴무이며, 일요일 예측은 0이어야 합니다.
- id: promo_plan
  text: 행사계획.csv의 행사(시작일·종료일 포함)를 반드시 반영해야 합니다. 증가 폭은 할인율이 클수록 크고 카테고리마다 다르며, 이력의 행사할인율_%로 추정합니다.
- id: promo_flyer
  text: "<!-- when: promo_uplift=1 -->11월 행사는 예전과 똑같이 진행하므로(가격표만, 전단 없음) 이력에서 추정한 증가 폭을 그대로 씁니다.<!-- /when --><!-- when: promo_uplift=1.5,2 -->11월 행사는 종이 전단에도 실려서, 같은 카테고리·같은 할인율의 과거 행사보다 추가 판매가 약 {{promo_uplift}}배 됩니다.<!-- /when -->"
- id: promo_revision
  text: "10월 30일(금), 행사계획.csv를 내려받은 뒤에 계획에 있던 {{promo_cancelled}} 행사가 모두 취소되었습니다. 이 행사들은 진행하지 않으며 나머지 계획은 그대로입니다."
- id: one_off_holiday
  text: "{{holiday_date}}의 일회성 지역 공휴일은 공휴일.csv에 없습니다. 점포는 정상 영업하고, 과거 공휴일처럼 수요가 늘며 베이커리와 음료가 가장 많이 늘어납니다."
- id: unit_change_i07
  text: 모닝빵 I07은 2026년 5월 31일까지 낱개, 6월 1일부터 6개입 팩으로 기록됩니다. 그 이전 이력은 6으로 나누고 I07은 팩 단위로 예측합니다.
- id: min_display
  text: "핵심 상품(신선 청과와 유제품, I01-I06)은 점포 영업일에 예측을 {{min_display}}(판매단위 기준) 미만으로 잡지 않습니다."
- id: wape_metric
  text: "품질은 <!-- when: short_weight=1 -->점포별 WAPE(절대 오차 합계 ÷ 실제 합계)<!-- /when --><!-- when: short_weight=2,3 -->적게 잡은 1개를 많게 잡은 1개의 {{short_weight}}배로 계산한 점포별 가중 WAPE(실제 합계로 나눔)<!-- /when -->의 5개 점포 평균이며, 낮을수록 좋습니다. <!-- tier: easy medium -->이번 회차의 실제는 반품을 차감한 포스 판매량이고(품절일은 기록 그대로), 모닝빵 I07은 평가하지 않습니다.<!-- /tier --><!-- tier: hard -->실제는 품절로 놓친 판매까지 포함한 고객 수요입니다.<!-- /tier -->"
- id: submission_format
  text: forecast.csv를 store_id,item_id,date,forecast 열로, 2026-11-02부터 2026-11-15까지 점포·상품·날짜마다 정확히 한 행(총 840행)씩 제출합니다.
