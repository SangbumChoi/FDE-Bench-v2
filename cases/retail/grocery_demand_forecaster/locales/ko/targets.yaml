- id: order_quantity
  text: 각 점포는 날마다 파일의 숫자 그대로 발주하고 자체적으로 더 얹지 않습니다. 따라서 숫자는 예상 판매량이 아니라 발주 수량이어야 합니다.
- id: lost_sale_cost
  text: "고객이 찾았는데 없어서 못 산 1개의 손해는 마감 때 남은 1개의 약 {{lost_sale_cost}}배입니다."
- id: stockout_censoring
  text: 품절일의 판매수량은 재고만큼으로 잘려 있고 고객 수요는 그보다 컸습니다. 발주 수량은 수요를 채워야 하므로 이런 날을 평소 판매처럼 쓰면 안 됩니다.
- id: base_forecast
  text: 이번 회차의 발주 수량에는 행사계획.csv의 행사를 넣지 않습니다. 행사 효과는 카테고리팀이 나중에 따로 얹습니다.
- id: promo_plan
  text: 행사계획.csv의 행사는 예측 기간에 진행되며 발주 수량에 반드시 들어가야 합니다. 나중에 따로 얹는 사람은 없습니다.
- id: promo_flyer
  text: "<!-- when: promo_uplift=1 -->11월 행사는 예전과 똑같이 진행하므로(가격표만, 전단 없음) 이력에서 추정한 증가 폭을 그대로 씁니다.<!-- /when --><!-- when: promo_uplift=2,3 -->11월 행사는 종이 전단에도 실려서, 같은 카테고리·같은 할인율의 과거 행사보다 추가 판매가 약 {{promo_uplift}}배 됩니다.<!-- /when -->"
- id: promo_revision
  text: "10월 30일(금), 행사계획.csv를 내려받은 뒤에 계획에 있던 {{promo_cancelled}} 행사가 모두 취소되었습니다. 이 행사들은 진행하지 않으며 나머지 계획은 그대로입니다."
- id: one_off_holiday
  text: "{{holiday_date}}의 일회성 지역 공휴일은 공휴일.csv에 없습니다. 점포는 정상 영업하고, 과거 공휴일처럼 수요가 늘며 베이커리와 음료가 가장 많이 늘어납니다."
- id: min_display
  text: "핵심 상품(신선 청과와 유제품, I01-I06)은 점포 영업일에 발주 수량을 {{min_display}}(판매단위 기준) 미만으로 잡지 않습니다."
- id: manager_note
  text: 중앙광장점(S1) 점장이 메일로 요청한 20% 추가는 점장 개인의 바람일 뿐 회사 방침이 아닙니다. S1도 다른 점포와 똑같이 발주합니다.
- id: submission_format
  text: 발주 시스템이 파일을 그대로 읽어 들이므로 2026-11-02부터 2026-11-15까지 점포·상품·날짜마다 정확히 한 행(총 840행)이 있어야 하며, S4의 일요일(발주 수량 0)과 모닝빵(I07)도 포함합니다.
