# The explainer's case texts in Korean (English comes from case.yaml).
role: 식료품 수요 예측 담당자
task_type: 머신러닝
deliverable_spec: |
  forecast.csv, ASCII 헤더는 store_id,item_id,date,forecast입니다.
  14일 예측 기간(2026-11-02 .. 2026-11-15)의 점포 x 상품 x 날짜마다 한 행씩 둡니다.
  store_id / item_id는 데이터에 있는 그대로(예: S1, I01), date는 YYYY-MM-DD 형식으로 쓰며,
  forecast = 해당 상품의 현재 판매단위 기준 예측 수량입니다(숫자, 소수 가능).
tiers:
  easy: >-
    기본 예측: 각 점포에서 평소 하루에 얼마나 팔리는지입니다. 행사 계획과 일회성 지역 공휴일은 카테고리팀이 따로 얹으므로 둘 다 빼고, 그 효과를 걷어 낸 기본 포스 판매량(반품 차감, 품절일은 기록 그대로)으로 평가합니다. S4 일요일 휴무, 진열 하한, 오차 가중치는 적용되며, 모닝빵(I07)은 이번 회차에 평가하지 않습니다.
  medium: >-
    easy에 더해 행사 계획(시작일·종료일 포함, 증가 폭은 과거 행사에서 추정하고, 규칙 시드가 전단을 뽑은 경우 전단 배수를 곱함)과 뽑힌 날짜의 일회성 지역 공휴일이 들어갑니다. 평가는 여전히 반품을 차감한 포스 판매량 기준이고, I07은 이번 회차에 평가하지 않습니다.
  hard: >-
    medium과 같되 고객 수요 기준으로 평가합니다. 품절일 판매량은 잘려 있고 반품은 수요가 아닙니다. I07도 평가하므로 단위 변경(2026년 5월 31일까지 낱개, 그 뒤 6개입 팩)이 영향을 주고, 날짜가 정해진 수정이 하나 있습니다. 10월 30일(금), 행사계획.csv를 내려받은 뒤에 뽑힌 카테고리의 행사가 모두 취소되었습니다.
rules:
  complete_grid: forecast.csv에는 예측 기간의 점포 × 상품 × 날짜마다 정확히 한 행이 있습니다.
  non_negative: 음수인 예측은 없습니다.
  closed_day_zero: 점포 S4는 매주 일요일 휴무이므로 일요일 예측은 0입니다.
  min_display_stock: 핵심 상품(신선 청과와 유제품)은 점포가 영업하는 날 예측을 {{min_display}}(판매단위 기준) 미만으로 잡지 않습니다.
