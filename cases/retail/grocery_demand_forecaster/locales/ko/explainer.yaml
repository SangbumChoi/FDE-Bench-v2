# The explainer's case texts in Korean (English comes from case.yaml).
role: 식료품 수요 예측 담당자
task_type: 머신러닝
deliverable_spec: |
  forecast.csv, ASCII 헤더는 store_id,item_id,date,order_qty입니다.
  14일 예측 기간(2026-11-02 .. 2026-11-15)의 점포 x 상품 x 날짜마다 한 행씩 둡니다.
  store_id / item_id는 데이터에 있는 그대로(예: S1, I01), date는 YYYY-MM-DD 형식으로 쓰며,
  order_qty = 그 점포가 그날 발주하는 수량으로, 해당 상품의 현재 판매단위 기준입니다(숫자, 소수 가능).
  점포는 숫자 그대로 발주합니다. order_qty 열이 없는 파일은 forecast 열을, 그것도 없으면 나머지 중 하나뿐인 숫자 열을 읽습니다.
  키 열은 고객 데이터에 쓰인 열 이름이어도 됩니다.
tiers:
  easy: >-
    행사를 뺀 발주 수량입니다. 행사 계획은 카테고리팀이 따로 얹으므로 빼고, 행사 효과가 없는 수요를 기준으로 평가합니다. 점포는 파일의 숫자 그대로 발주하므로 발주 계획으로 채점합니다. 기대 비용, 곧 남을 것으로 예상되는 수량에 부족할 것으로 예상되는 수량의 고객사 배수를 곱해 더한 값을 봅니다. 뽑힌 날짜의 일회성 지역 공휴일은 발주 수량에 들어가고, 이력의 품절일 판매량은 수요보다 적습니다. S4 일요일 휴무와 진열 하한은 발주 수량에 대한 규칙이며, 점장의 메일은 회사 방침이 아닙니다. 모닝빵(I07)은 이번 회차에 평가하지 않습니다.
  medium: >-
    easy에 더해 행사 계획(시작일·종료일 포함, 증가 폭은 과거 행사에서 추정하고, 규칙 시드가 전단을 뽑은 경우 전단 배수를 곱함)이 들어갑니다. I07은 이번 회차에 평가하지 않습니다.
  hard: >-
    medium에 더해 모닝빵이 들어갑니다. I07도 평가하므로 단위 변경(2026년 5월 31일까지 낱개, 그 뒤 6개입 팩)이 영향을 주고, 날짜가 정해진 수정이 하나 있습니다. 10월 30일(금), 행사계획.csv를 내려받은 뒤에 뽑힌 카테고리의 행사가 모두 취소되었습니다.
rules:
  complete_grid: forecast.csv에는 예측 기간의 점포 × 상품 × 날짜마다 정확히 한 행이 있습니다.
  non_negative: 음수인 발주 수량은 없습니다.
  closed_day_zero: 점포 S4는 매주 일요일 휴무이므로 일요일 발주 수량은 0입니다.
  min_display_stock: 핵심 상품(신선 청과와 유제품)은 점포가 영업하는 날 발주 수량을 {{min_display}}(판매단위 기준) 미만으로 잡지 않습니다.
shortcuts:
  literal_plus_floor: "글자 그대로의 해법에서, 어긴 규칙 하나만 지킨 것: 핵심 상품의 진열 하한."
  forecast_as_order: "불확실성 무시: 다른 사실은 모두 맞지만 예상 수요를 그대로 발주 수량으로 제출."
  blanket_cushion: "전부 올려 잡기: 글자 그대로의 예측에 점장이 요구한 20%를 모든 점포에 얹음."
  copy_last_week: "데이터 그대로 옮기기: 두 주 모두 지난주 같은 요일의 판매량."
  flat_average: "상수 출력: 점포·상품마다 숫자 하나, 최근 8주의 하루 평균 판매량을 매일 똑같이."
  never_run_out: "절대 품절 없이: 매일, 최근 8주 중 그 점포에서 그 상품이 가장 많이 팔린 날의 수량."
  display_only: "핵심 상품의 진열 하한 말고는 아무것도 발주하지 않음."
  judged_rows_only: "평가하지 않거나 항상 0인 행을 뺌: 모닝빵(I07)과 S4의 일요일."
  habit_last_year: "고객의 기존 방식을 그대로 가져와 한 가지만 바꿈: 점장들의 습관대로 하되 최근 52주 평균을 씀."
  habit_more_cushion: "고객의 기존 방식을 그대로 가져와 더 올려 잡음: 점장들의 습관에 여유분을 10%포인트 더 얹음."
  literal_sized_cushion: "못 판 1개의 비용 하나만 물어봄: 글자 그대로의 예측에 그 비용에 맞춘 일률적인 여유분을 얹음."
  weekday_quantile: "모델 없이: 점포·상품·요일마다 최근 26주 판매량에서 비용 비율에 해당하는 분위수를 그대로 씀."
