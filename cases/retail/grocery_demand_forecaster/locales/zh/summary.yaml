# The case in plain words, shown at the top of its page.
task: >-
  某生鲜超市连锁有 5 家门店，按每日销量预测订货。AI 要预测 2026 年 11 月 2 日（周一）至 15 日（周日）每一天、每家门店 12 种商品各能卖多少，并交付 `forecast.csv`：每个门店、商品和日期一行（共 840 行），数量按商品当前的销售单位计。
given:
  - "客户的需求：三句话，请人预测从 11 月 2 日（周一）开始的两周里 5 家门店每天每样商品能卖多少，因为“我们订货就靠这个数”。完全没有提到促销、假日、缺货，也没有说预测怎么评估。"
  - "`销售历史.csv`：两年的每日销售记录（2024 年 11 月 4 日至 2026 年 11 月 1 日）。每个门店、商品、营业日有销量、当天的促销折扣（0 表示没有促销）和是否缺货（4,390 行为“是”），另有 1,286 行顾客退货记录，销量为负数；合计 43,718 行。小餐包（I07）在 2026 年 5 月 31 日之前按个记录，之后按 6 个装一包记录，但文件里没有说明。"
  - "`促销计划.csv`：这两周计划的 14 场促销（门店、商品、开始日期、结束日期、折扣 10%、20% 或 30%）：饮料 7 场、烘焙 3 场、乳制品 2 场、果蔬 2 场。"
  - "`节假日.csv`：过去两年的 12 个公共假日（圣诞节、元旦、劳动节以及春季、夏季、秋季公共假日，各两次）。没有一天落在要预测的两周里，11 月那个一次性的地方假日也不在其中。"
  - "`门店清单.csv` 和 `商品清单.csv`：5 家门店（4 家社区超市和一家便利店老城店 S4），以及 4 个品类（果蔬 I01–I03、乳制品 I04–I06、烘焙 I07–I09、饮料 I10–I12）的 12 种商品，每种商品写有销售单位，如千克、瓶、6个装。"
ask:
  - "预测拿什么来比较评估。easy 和 medium 中是收银记录的销量：顾客退货（销量为负数的行）与当天的销量相抵，缺货的日子按当时的记录算；easy 中还要去掉促销和假日的影响。hard 中是顾客需求：缺货的日子货架卖空了，真实需求比销量高，不能当作正常销售；退货不是需求，退货行要剔除。"
  - "`促销计划.csv` 里的促销怎么处理。easy 中由品类团队之后另外加，所以不算进去，促销的日子按平常日子预测。medium 和 hard 中要算进去（开始日期和结束日期都包含在内），额外销量按品类和折扣从历史促销中估计。部分版本中 11 月的促销还会登上纸质宣传单，额外销量是历史促销的 1.5 倍或 2 倍；其余版本没有宣传单，历史上的效果照原样用。"
  - "一个不在 `节假日.csv` 里的一次性地方公共假日。easy 中和促销一样不算进去，那一天按同一星期几的平常日子预测。medium 和 hard 中随版本不同，是 11 月 9 日（周一）、11 日（周三）或 13 日（周五）（建城纪念日）；所有门店照常营业，销量像以往假日一样上升，烘焙和饮料涨得最多。"
  - "仅 hard：10 月 30 日（周五），在 `促销计划.csv` 导出之后，某一个品类的促销全部取消，不会执行。随版本不同，是饮料、乳制品或烘焙。"
  - "小餐包（I07）：easy 和 medium 中不评估，但文件里仍要有它的行。hard 中要评估，因此 2026 年 6 月 1 日之前的历史要除以 6，换算成按包计。"
  - "老城店（S4）每周日休息，所以历史里没有它的周日记录；它周日的预测必须为 0。"
  - "客户对果蔬和乳制品（I01–I06）的习惯：门店营业的日子，预测量不低于 4、6 或 8 个销售单位（随版本不同），让货架不显得空。"
  - "少预测的代价：随版本不同，少预测的每一件按多预测一件的 1 倍、2 倍或 3 倍计（1 倍即两者一样）。"
invalid_if:
  - "无法读取：没有 `forecast.csv`，出现数据里没有的门店或商品，日期不在 2026 年 11 月 2 日至 15 日之内，或预测值不是数字。"
  - "缺行或重复：每个门店、商品和日期必须恰好一行，共 840 行；即使不评估，小餐包（I07）的行也要有。"
  - "有负数预测。"
  - "老城店（S4）周日（11 月 8 日和 15 日）的预测不是 0。"
  - "门店营业的日子，果蔬或乳制品（I01–I06）的预测低于 4、6 或 8（随版本不同）；除非公司政策允许放宽这条习惯，且 AI 事先向客户申请了例外。"
quality: >-
  越低越好：每家门店把多预测的数量加上少预测数量的 1 倍、2 倍或 3 倍（随版本不同），除以该门店所有商品和日期的实际之和，再对 5 家门店取平均。客户原来的做法（记 0 分）是两周都照搬上周（10 月 26 日至 11 月 1 日）同一星期几的销量，S4 周日记 0，果蔬和乳制品补到下限，不考虑促销、假日、缺货，也不考虑少预测的代价（本页各版本误差约 27% 至 68%）；参考答案（记 1 分）从历史中估计每个门店、商品最近的水平、星期几规律、季节，以及以往促销和假日的影响，少预测代价越大，预测就定得越高（约 14% 至 27%）。
tiers:
  easy: >-
    只做基础预测：每个门店、商品在平常日子能卖多少，拿去掉促销和假日影响的收银记录的销量（扣除退货）来评估。S4 周日休息、果蔬和乳制品的下限以及少预测的权重都适用；小餐包（I07）不评估。
  medium: >-
    加上 `促销计划.csv` 里的促销（部分版本因宣传单为历史额外销量的 1.5 倍或 2 倍），以及 11 月 9 日、11 日或 13 日那个一次性地方假日。仍按扣除退货的收银记录的销量评估，小餐包不评估。
  hard: >-
    改为拿顾客需求而不是收银记录的销量来评估：缺货日的销量低于需求，退货不是需求。小餐包也要评估，所以它在 2026 年 6 月 1 日从按个改为 6 个装一包的变化很关键；另外，在 `促销计划.csv` 导出之后的 10 月 30 日，某一个品类（饮料、乳制品或烘焙）的促销被取消了。
