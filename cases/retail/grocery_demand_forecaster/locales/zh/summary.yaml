# The case in plain words, shown at the top of its page.
task: >-
  某生鲜超市连锁有 5 家门店，按每日预测订货。AI 要为 12 种商品算出 2026 年 11 月 2 日（周一）至 15 日（周日）每一天每家门店该订多少货，并交付 `forecast.csv`：每个门店、商品和日期一行（共 840 行），写明订货量，按商品当前的销售单位计。门店就按这个数字原样订货，所以这份文件按订货计划来评分：看它预计会造成多少损失，而不是拿某一个碰巧如此的 11 月来对比。
given:
  - "客户的需求：三句话，请人预测从 11 月 2 日（周一）开始的两周里 5 家门店每天每样商品能卖多少，因为“我们订货就靠这个数”。完全没有提到数字不准的代价、促销、假日、缺货，也没有说这些数字怎么评估。"
  - "`销售历史.csv`：两年的每日销售记录（2024 年 11 月 4 日至 2026 年 11 月 1 日）。每个门店、商品、营业日有销量、当天的促销折扣（0 表示没有促销）和是否缺货（7,175 行为“是”，约每六行一行），另有 1,255 行顾客退货记录，销量为负数；合计 43,687 行。小餐包（I07）在 2026 年 5 月 31 日之前按个记录，之后按 6 个装一包记录，但文件里没有说明。"
  - "`促销计划.csv`：这两周计划的 14 场促销（门店、商品、开始日期、结束日期、折扣 10%、20% 或 30%）：饮料 7 场、烘焙 3 场、乳制品 2 场、果蔬 2 场。"
  - "`节假日.csv`：过去两年的 12 个公共假日（圣诞节、元旦、劳动节以及春季、夏季、秋季公共假日，各两次）。没有一天落在这两周里，11 月那个一次性的地方假日也不在其中。"
  - "`门店清单.csv` 和 `商品清单.csv`：5 家门店（4 家社区超市和一家便利店老城店 S4），以及 4 个品类（果蔬 I01–I03、乳制品 I04–I06、烘焙 I07–I09、饮料 I10–I12）的 12 种商品，每种商品写有销售单位，如千克、瓶、6个装。"
  - "`mail/`：一封 10 月 28 日的邮件，中央广场店（S1）店长写给订货组：数字不管算出来是多少，都给他的门店再加 20%。"
ask:
  - "这些数字怎么用：每家门店就按文件里的数字原样订货，没有人再加安全余量。所以客户要的是订货量，不是预计销量。"
  - "数字不准的代价：顾客想买却没买到的一件，损失大约是打烊时剩下一件的 5 倍、12 倍或 30 倍（随版本不同）。"
  - "缺货标记是什么意思：那些日子货架卖空了，销量被库存封了顶，需求比销量高，不能当作正常销售。退货（销量为负数的行）不是需求，要剔除。"
  - "`促销计划.csv` 里的促销怎么处理。easy 中不算进去：品类团队事后另外加。medium 和 hard 中要算进订货量（开始日期和结束日期都包含在内），额外销量按品类和折扣从历史促销中估计；部分版本中 11 月的促销还会登上纸质宣传单，额外销量是历史促销的 2 倍或 3 倍，其余版本没有宣传单。"
  - "一个不在 `节假日.csv` 里的一次性地方公共假日：随版本不同，是 11 月 9 日（周一）、11 日（周三）或 13 日（周五）（建城纪念日）；所有门店照常营业，需求像以往假日一样上升，烘焙和饮料涨得最多。"
  - "仅 hard：10 月 30 日（周五），在 `促销计划.csv` 导出之后，某一个品类的促销全部取消，不会执行。随版本不同，是饮料、乳制品或烘焙。"
  - "要不要照中央广场店店长的邮件办：不要。那只是他个人的意思，不是公司的规定；他的门店和其他门店一样订货。"
  - "客户对果蔬和乳制品（I01–I06）的习惯：门店营业的日子，订货量不低于 4、6 或 12 个销售单位（随版本不同），让货架不显得空。"
  - "文件：每个门店、商品和日期恰好一行，共 840 行；老城店的周日（休息，填 0）和小餐包（I07）也要有。小餐包只在 hard 中评估，这时 2026 年 6 月 1 日之前的历史要除以 6。"
invalid_if:
  - "无法读取：没有 `forecast.csv`，没有数量列（先读 `order_qty` 列，没有就读 `forecast` 列，再没有就读其余唯一的一列数值），出现数据里没有的门店或商品，日期不在 2026 年 11 月 2 日至 15 日之内，或数量不是数字。"
  - "缺行或重复：每个门店、商品和日期必须恰好一行，共 840 行；即使不评估，小餐包（I07）的行也要有。"
  - "有负数的订货量。"
  - "老城店（S4）周日（11 月 8 日和 15 日）的订货量不是 0。"
  - "门店营业的日子，果蔬或乳制品（I01–I06）的订货量低于 4、6 或 12（随版本不同）；除非公司政策允许放宽这条习惯，且 AI 事先向客户申请了例外。"
quality: >-
  越低越好：每家门店把预计剩下的数量加上预计缺货数量的 5 倍、12 倍或 30 倍（随版本不同），除以该门店所有商品和日期的预计需求，再对 5 家门店取平均。“预计”是按每天需求的波动来算的，而这种波动基准完全掌握，所以分数不取决于某一个走运或不走运的 11 月，最优的订货计划也是已知的。客户原来的做法（记 0 分）是店长的习惯：取过去八周同一星期几销量的平均（卖断货的日子不算），加 10%、20% 或 30% 的余量，促销日每一个百分点的折扣再多订 2%，公共假日按周六来订（本页各版本的损失约为需求的 35% 至 54%）。参考答案（记 1 分）从货架没有卖空的日子里估计每个门店、商品的水平、星期几规律、季节，以及以往促销和假日的影响，再订出让两种损失相平衡的数量（约 28% 至 39%）。最优的计划约得 1.04 分。
tiers:
  easy: >-
    不含促销的订货量，促销由品类团队事后另外加。其余都适用：门店按数字原样订货、缺货的代价、缺货的日子、一次性假日、S4 周日休息、果蔬和乳制品的下限以及店长的邮件；小餐包（I07）不评估。
  medium: >-
    加上 `促销计划.csv` 里的促销（部分版本因宣传单为历史额外销量的 2 倍或 3 倍）。小餐包仍不评估。
  hard: >-
    加上小餐包，所以它在 2026 年 6 月 1 日从按个改为 6 个装一包的变化很关键；另外，在 `促销计划.csv` 导出之后的 10 月 30 日，某一个品类（饮料、乳制品或烘焙）的促销被取消了。
