# The explainer's case texts in Simplified Chinese (English comes from case.yaml).
role: 生鲜超市需求预测员
task_type: 机器学习
deliverable_spec: |
  forecast.csv，ASCII 表头为 store_id,item_id,date,forecast。
  14 天预测期（2026-11-02 .. 2026-11-15）内每个门店 x 商品 x 日期一行；
  store_id / item_id 与数据中完全一致（如 S1、I01），date 格式为 YYYY-MM-DD，
  forecast = 按该商品当前销售单位计的预测数量（数值，可带小数）。
tiers:
  easy: >-
    基础预测：每家门店在平常日子能卖多少。促销计划和一次性地方假日由品类团队另行叠加，因此两者都不计入，预测按去掉这些影响后的基础收银销量评估（扣除退货，缺货日按记录计）。S4 周日休息、陈列下限和误差权重照常适用；小餐包（I07）这一轮不评估。
  medium: >-
    在 easy 的基础上加入促销计划（开始和结束日期都包含在内，提升从历史促销中估计；规则种子抽到宣传单时再乘以宣传单的倍数）和落在抽到日期的一次性地方假日。仍按扣除退货后的收银销量评估；I07 这一轮不评估。
  hard: >-
    与 medium 相同，但改为按顾客需求评估：缺货日的销量是截断的，退货不是需求。I07 计入评估，因此它的单位变更（2026 年 5 月 31 日前按个，之后按 6 个装一包）有影响；另有一个带日期的修订：10 月 30 日（周五），在促销计划.csv 导出之后，抽到的品类的促销全部取消。
rules:
  complete_grid: forecast.csv 中，预测期内每个门店 × 商品 × 日期恰好一行。
  non_negative: 预测值都不为负。
  closed_day_zero: 门店 S4 每周日休息，其周日预测为 0。
  min_display_stock: 核心商品（果蔬和乳制品）在门店营业的日子，预测量均不低于 {{min_display}}（按销售单位计）。
