# The explainer's case texts in Simplified Chinese (English comes from case.yaml).
role: 生鲜超市需求预测员
task_type: 机器学习
deliverable_spec: |
  forecast.csv，ASCII 表头为 store_id,item_id,date,order_qty。
  14 天预测期（2026-11-02 .. 2026-11-15）内每个门店 x 商品 x 日期一行；
  store_id / item_id 与数据中完全一致（如 S1、I01），date 格式为 YYYY-MM-DD，
  order_qty = 门店当天的订货量，按该商品当前销售单位计（数值，可带小数）。
  门店按数字原样订货：没有 order_qty 列的文件，读它的 forecast 列，否则读其余唯一的一列数值；
  键列也可以用客户数据里的列名。
tiers:
  easy: >-
    不含促销的订货量：促销计划由品类团队另行叠加，因此不计入，计划按不含促销影响的需求评估。门店按文件里的数字原样订货，所以按订货计划评分：看预期损失，即预计剩下的件数加上客户给出的倍数乘以预计缺货的件数。落在抽到日期的一次性地方假日要算进订货量；历史中缺货日的销量低于需求；S4 周日休息和陈列下限是对订货量的规则；店长的邮件不是公司规定；小餐包（I07）这一轮不评估。
  medium: >-
    在 easy 的基础上加入促销计划（开始和结束日期都包含在内，提升从历史促销中估计；规则种子抽到宣传单时再乘以宣传单的倍数）。I07 这一轮不评估。
  hard: >-
    在 medium 的基础上加入小餐包：I07 计入评估，因此它的单位变更（2026 年 5 月 31 日前按个，之后按 6 个装一包）有影响；另有一个带日期的修订：10 月 30 日（周五），在促销计划.csv 导出之后，抽到的品类的促销全部取消。
rules:
  complete_grid: forecast.csv 中，预测期内每个门店 × 商品 × 日期恰好一行。
  non_negative: 订货量都不为负。
  closed_day_zero: 门店 S4 每周日休息，其周日订货量为 0。
  min_display_stock: 核心商品（果蔬和乳制品）在门店营业的日子，订货量均不低于 {{min_display}}（按销售单位计）。
shortcuts:
  literal_plus_floor: "字面解法，只补上它违反的那一条规则：核心商品的陈列下限。"
  forecast_as_order: "无视不确定性：其他事实都对，但把预计需求直接当作订货量交上去。"
  blanket_cushion: "全部加码：字面解法的预测，给每家门店都加上店长要的 20%。"
  copy_last_week: "照搬数据：两周都用上周同一星期几的销量。"
  flat_average: "输出常数：每个门店、商品只给一个数，即过去八周的日均销量，每天都一样。"
  never_run_out: "绝不断货：每天都订过去八周里该门店该商品单日卖得最多的数量。"
  display_only: "除了核心商品的陈列下限，什么都不订。"
  judged_rows_only: "去掉不评估或恒为 0 的行：小餐包（I07）和 S4 的周日。"
  habit_last_year: "照搬客户现在的做法，只改一处：店长的习惯订货法，改成取过去 52 周的平均。"
  habit_more_cushion: "照搬客户现在的做法再加码：店长的习惯订货法，余量再多加 10 个百分点。"
  literal_sized_cushion: "只问一件事，即缺货一件的代价：在字面解法的预测上，按这个代价加一个统一比例的余量。"
  weekday_quantile: "不建模型：每个门店、商品、星期几，直接取过去 26 周销量中与成本比例对应的分位数。"
