- id: order_quantity
  text: 各门店每天按文件里的数字原样订货，自己不再往上加；所以交的必须是订货量，而不是预计销量。
- id: lost_sale_cost
  text: "顾客想买却没买到的一件货，损失大约是打烊时剩下一件货的 {{lost_sale_cost}} 倍。"
- id: stockout_censoring
  text: 缺货日的销量受库存上限限制，顾客需求比它高；订货量要满足的是需求，这些日子不能当作正常销售。
- id: base_forecast
  text: 这一轮的订货量不含促销计划.csv 里的促销；促销的影响由品类团队事后另外加。
- id: promo_plan
  text: 促销计划.csv 里的促销在预测期内执行，必须算进订货量；事后没有人再另外加。
- id: promo_flyer
  text: "<!-- when: promo_uplift=1 -->11 月的促销和以往一样（只有货架价签，没有宣传单），从历史中估计出的提升照原样用。<!-- /when --><!-- when: promo_uplift=2,3 -->11 月的促销还会登上纸质宣传单，带来的额外销量约为历史上同品类、同折扣促销的 {{promo_uplift}} 倍。<!-- /when -->"
- id: promo_revision
  text: "10 月 30 日（周五），在促销计划.csv 导出之后，计划里所有{{promo_cancelled}}类促销都已取消，不会执行；计划的其余部分不变。"
- id: one_off_holiday
  text: "{{holiday_date}}的一次性地方假日不在节假日.csv 里；门店照常营业，需求会像以往假日一样上升，烘焙和饮料涨幅最大。"
- id: min_display
  text: "核心商品（果蔬和乳制品，I01-I06）在门店营业日的订货量不得低于 {{min_display}}。"
- id: manager_note
  text: 中央广场店（S1）店长在邮件里要求再加 20%，这只是他个人的意思，不是公司的规定；S1 和其他门店一样订货。
- id: submission_format
  text: 订货系统会原样读入文件，所以 2026-11-02 至 2026-11-15 每个门店、商品、日期必须恰好一行（共 840 行），S4 的周日（订货量为 0）和小餐包（I07）也要有。
