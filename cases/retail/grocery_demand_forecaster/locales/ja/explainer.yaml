# The explainer's case texts in Japanese (English comes from case.yaml).
role: 食品スーパーの需要予測担当者
task_type: 機械学習
deliverable_spec: |
  forecast.csv、ASCIIのヘッダーは store_id,item_id,date,order_qty です。
  14日間の予測期間（2026-11-02 .. 2026-11-15）の店舗 x 商品 x 日付ごとに1行とします。
  store_id / item_id はデータのとおり（例: S1, I01）、date は YYYY-MM-DD 形式で記載し、
  order_qty = その店舗がその日に発注する数量で、その商品の現在の販売単位での値です（数値、小数可）。
  店舗は数字をそのまま発注します。order_qty 列のないファイルは forecast 列を、それもなければ残りのうち唯一の数値の列を読みます。
  キーの列は、お客様のデータで使われている列名でもかまいません。
tiers:
  easy: >-
    販促を含めない発注数量です。販促計画はカテゴリ担当が上乗せするため含めず、販促の効果を除いた需要で評価します。店舗はファイルの数字をそのまま発注するので、発注計画として採点します。見込まれる損失、つまり売れ残ると見込まれる数量に、不足すると見込まれる数量の顧客の倍率をかけて足した値を見ます。抽選された日付の一度限りの地域の祝日は発注数量に含めます。履歴の欠品日の販売数量は需要より少なくなっています。S4の日曜定休と陳列下限は発注数量に対するルールで、店長のメールは会社の方針ではありません。ロールパン（I07）は今回は評価しません。
  medium: >-
    easy に加えて、販促計画（開始日・終了日を含み、伸びは過去の販促から推定し、ルールシードがチラシを抽選した場合はチラシの倍率をかける）が入ります。I07は今回は評価しません。
  hard: >-
    medium に加えてロールパンが入ります。I07も評価するため単位変更（2026年5月31日までは1個単位、その後は6個入りパック）が効き、日付の決まった改訂が1つあります。10月30日（金）、販促計画.csvを書き出した後に、抽選されたカテゴリの販促がすべて中止になりました。
rules:
  complete_grid: forecast.csv には、予測期間の店舗 × 商品 × 日付ごとにちょうど1行があります。
  non_negative: マイナスの発注数量はありません。
  closed_day_zero: 店舗S4は毎週日曜日が定休日なので、日曜日の発注数量は0です。
  min_display_stock: 主力商品（青果と乳製品）は、店舗が営業している日には発注数量を{{min_display}}未満にしません。
shortcuts:
  literal_plus_floor: "文字どおりの解に、それが破る唯一のルールだけを守らせたもの：主力商品の陳列下限。"
  forecast_as_order: "不確実性を無視：ほかの事実はすべて正しいが、見込み需要をそのまま発注数量として提出。"
  blanket_cushion: "すべて上乗せ：文字どおりの予測に、店長が求めた20%を全店舗に上乗せ。"
  copy_last_week: "データをそのまま写す：2週間とも、先週の同じ曜日の販売数量。"
  flat_average: "定数を出力：店舗・商品ごとに数字は1つ、直近8週間の1日平均の販売数量を毎日同じに。"
  never_run_out: "絶対に欠品させない：毎日、直近8週間でその店舗のその商品がいちばん売れた日の数量。"
  display_only: "主力商品の陳列下限のほかは何も発注しない。"
  judged_rows_only: "評価されない行や常に0の行を省く：ロールパン（I07）とS4の日曜日。"
  habit_last_year: "お客様の今のやり方を写して1点だけ変える：店長の慣習どおりの発注で、平均を直近52週間でとる。"
  habit_more_cushion: "お客様の今のやり方を写して上乗せする：店長の慣習どおりの発注に、余裕分をさらに10ポイント足す。"
  literal_sized_cushion: "欠品1個の損失だけを聞く：文字どおりの予測に、その損失に見合う一律の余裕分を上乗せ。"
  weekday_quantile: "モデルなし：店舗・商品・曜日ごとに、直近26週間の販売数量から損失の比率に対応する分位点をそのまま使う。"
