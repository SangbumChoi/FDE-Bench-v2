# The explainer's case texts in Japanese (English comes from case.yaml).
role: 食品スーパーの需要予測担当者
task_type: 機械学習
deliverable_spec: |
  forecast.csv、ASCIIのヘッダーは store_id,item_id,date,forecast です。
  14日間の予測期間（2026-11-02 .. 2026-11-15）の店舗 x 商品 x 日付ごとに1行とします。
  store_id / item_id はデータのとおり（例: S1, I01）、date は YYYY-MM-DD 形式で記載し、
  forecast = その商品の現在の販売単位での予測数量です（数値、小数可）。
tiers:
  easy: >-
    基本予測：通常の日に各店舗でどれだけ売れるかを予測します。販促計画と一度限りの地域の祝日はカテゴリ担当が上乗せするため、どちらも含めず、それらの効果を取り除いた基本のレジ販売数量（返品は差し引き、欠品日は記録どおり）で評価します。S4の日曜定休、陳列下限、誤差の重みは適用され、ロールパン（I07）は今回は評価しません。
  medium: >-
    easy に加えて、販促計画（開始日・終了日を含み、伸びは過去の販促から推定し、ルールシードがチラシを抽選した場合はチラシの倍率をかける）と、抽選された日付の一度限りの地域の祝日が入ります。評価は引き続き返品を差し引いたレジの販売数量で、I07は今回は評価しません。
  hard: >-
    medium と同じ内容を、お客様の需要で評価します。欠品日の販売数量は頭打ちで、返品は需要ではありません。I07も評価するため単位変更（2026年5月31日までは1個単位、その後は6個入りパック）が効き、日付の決まった改訂が1つあります。10月30日（金）、販促計画.csvを書き出した後に、抽選されたカテゴリの販促がすべて中止になりました。
rules:
  complete_grid: forecast.csv には、予測期間の店舗 × 商品 × 日付ごとにちょうど1行があります。
  non_negative: マイナスの予測はありません。
  closed_day_zero: 店舗S4は毎週日曜日が定休日なので、日曜日の予測は0です。
  min_display_stock: 主力商品（青果と乳製品）は、店舗が営業している日には予測を{{min_display}}未満にしません。
