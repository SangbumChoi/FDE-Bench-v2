# The explainer's case texts in Japanese (English comes from case.yaml).
role: 食品スーパーの需要予測担当者
task_type: 機械学習
deliverable_spec: |
  forecast.csv、ASCIIのヘッダーは store_id,item_id,date,forecast です。
  14日間の予測期間（2026-11-02 .. 2026-11-15）の店舗 x 商品 x 日付ごとに1行とします。
  store_id / item_id はデータのとおり（例: S1, I01）、date は YYYY-MM-DD 形式で記載し、
  forecast = その商品の現在の販売単位での予測数量です（数値、小数可）。
rules:
  complete_grid: forecast.csv には、予測期間の店舗 × 商品 × 日付ごとにちょうど1行があります。
  non_negative: マイナスの予測はありません。
  closed_day_zero: 店舗S4は毎週日曜日が定休日なので、日曜日の予測は0です。
  min_display_stock: 主力商品（青果と乳製品）は、店舗が営業している日には予測を6未満にしません。
