# The case in plain words, shown at the top of its page.
task: >-
  5店舗を持つ食品スーパーのチェーンは、日別の予測をもとに発注しています。AIは12の商品について、2026年11月2日（月）から15日（日）までの毎日、各店舗がいくつ発注すべきかを求め、店舗・商品・日付ごとに1行（合計840行）、発注数量を商品の現在の販売単位で書いた `forecast.csv` を提出します。店舗はその数字をそのまま発注するので、ファイルは発注計画として採点します。たまたまそうなった一度の11月と比べるのではなく、その計画が平均してどれだけの損失になるかを見ます。
given:
  - "顧客の依頼：11月2日（月）からの2週間、5店舗で各商品が毎日どれくらい売れるか予測してほしいという3文で、「この数字をもとに発注しています」とあります。数字が外れたときの損失、販促、祝日、欠品、評価の方法には何も触れていません。"
  - "`販売履歴.csv`：2年分の日別の販売記録（2024年11月4日〜2026年11月1日）です。店舗・商品・営業日ごとに販売数量、その日の販促の割引率（0は販促なし）、欠品かどうか（7,175行が「はい」、およそ6行に1行）があり、ほかに販売数量がマイナスのお客様の返品の行が1,255行あって、合計43,687行です。ロールパン（I07）は2026年5月31日までは1個単位、その後は6個入りパック単位で記録されていますが、ファイルにはその説明がありません。"
  - "`販促計画.csv`：2週間に予定されている14件の販促（店舗、商品、開始日、終了日、割引率10・20・30%）です。飲料7件、ベーカリー3件、乳製品2件、青果2件です。"
  - "`祝日一覧.csv`：過去2年の祝日12日（クリスマス、元日、労働の日、春・夏・秋の祝日がそれぞれ2回）です。この2週間に入る日はなく、11月の一度限りの地域の祝日も載っていません。"
  - "`店舗一覧.csv` と `商品マスタ.csv`：5店舗（スーパー4店と小型店の旧市街店S4）と、4つのカテゴリ（青果I01–I03、乳製品I04–I06、ベーカリーI07–I09、飲料I10–I12）の12商品で、商品ごとにkg、本、6個入りパックなどの販売単位が書かれています。"
  - "`mail/`：10月28日に中央広場店（S1）の店長が発注担当に送ったメール1通です。数字がどう出ても、自分の店舗の分は20%上乗せしてほしいという内容です。"
ask:
  - "数字の使い道です。各店舗はファイルの数字をそのまま発注し、安全分を足す人はいません。ですから顧客に必要なのは販売見込みではなく、発注数量です。"
  - "数字が外れたときの損失です。お客様が買おうとして棚になかった1個の損失は、閉店時に売れ残った1個の約5倍、12倍または30倍です（バージョンによる）。"
  - "欠品の印の意味です。その日は棚が空になり、販売数量は在庫分で頭打ちになっていて、需要はそれより多かったので、通常の販売として扱えません。返品（販売数量がマイナスの行）は需要ではないので除きます。"
  - "`販促計画.csv` の販促をどう扱うかです。easyでは含めません。カテゴリ担当が後から上乗せするからです。mediumとhardでは発注数量に含めます（開始日と終了日はどちらも含みます）。上乗せ分の売上は、過去の販促からカテゴリと割引率ごとに推定します。一部のバージョンでは11月の販促が紙のチラシにも載り、上乗せ分が過去の販促の2倍または3倍になります。ほかのバージョンではチラシがありません。"
  - "`祝日一覧.csv` に載っていない一度限りの地域の祝日です。バージョンによって11月9日（月）、11日（水）、13日（金）のいずれかで（市制記念日）、全店舗が通常どおり営業し、過去の祝日と同じように需要が増えます。いちばん伸びるのはベーカリーと飲料です。"
  - "hardだけ：10月30日（金）、`販促計画.csv` を書き出した後に、1つのカテゴリの販促がすべて中止になり、実施されません。バージョンによって飲料、乳製品、ベーカリーのいずれかです。"
  - "中央広場店の店長のメールに従うかどうかです。従いません。店長個人の希望であって会社の方針ではなく、その店舗もほかの店舗と同じように発注します。"
  - "青果と乳製品（I01–I06）についての顧客の慣習です。店舗が営業している日は、発注数量をバージョンによって販売単位で4、6、12のいずれかの値未満にしません。売場が寂しく見えないようにするためです。"
  - "ファイルです。店舗・商品・日付ごとにちょうど1行ずつ合計840行で、旧市街店の日曜日（定休日なので0）とロールパン（I07）の行も必要です。ロールパンはhardでだけ評価し、そのときは2026年6月1日より前の履歴を6で割る必要があります。"
invalid_if:
  - "読み取れません。`forecast.csv` がない、数量の列がない（`order_qty` 列、なければ `forecast` 列、それもなければ残りのうち唯一の数値の列を読みます）、データにない店舗や商品がある、日付が2026年11月2日〜15日の外にある、数量が数値でない、のいずれかです。"
  - "行の欠けや重複があります。店舗・商品・日付ごとにちょうど1行ずつ合計840行が必要で、評価しない場合でもロールパン（I07）の行が入っている必要があります。"
  - "マイナスの発注数量があります。"
  - "旧市街店（S4）の日曜日（11月8日、15日）の発注数量が0ではありません。"
  - "店舗が営業している日に、青果・乳製品（I01–I06）の発注数量がバージョンで決まる値（4、6、12のいずれか）を下回ります。ただし、会社の方針がこの慣習を緩めることを認めていて、AIが先に顧客に例外を申請した場合は認められます。"
quality: >-
  低いほど良い値です。店舗ごとに、売れ残ると見込まれる数量に、不足すると見込まれる数量の5倍、12倍または30倍（バージョンによる）を足し、その店舗の全商品・全日付の見込み需要で割って、5店舗の平均をとります。「見込み」とは需要が日々どれだけ変動するかについての平均で、ベンチマークはそれを正確に知っています。そのため点数は運の良し悪しがある一度の11月には左右されず、最良の計画もわかっています。従来のやり方（0点）は店長の習慣どおりの発注です。直近8週間の同じ曜日の販売数量の平均（欠品した日は除く）に10%、20%または30%を上乗せし、販促の日は割引率1ポイントにつき2%多めにし、祝日は土曜日と同じように発注します（このページのバージョンで損失は需要の約35〜54%）。模範解答（1点）は、棚が空にならなかった日から店舗・商品ごとの水準、曜日のパターン、季節、過去の販促と祝日の効果を推定し、2つの損失がつり合う数量を発注します（約28〜39%）。最良の計画は約1.04点です。
tiers:
  easy: >-
    販促を含めない発注数量です。販促はカテゴリ担当が後から上乗せします。ほかはすべて適用されます。店舗が数字をそのまま発注すること、売り逃した1個の損失、欠品の日、一度限りの祝日、S4の日曜定休、青果・乳製品の下限、店長のメールです。ロールパン（I07）は評価しません。
  medium: >-
    `販促計画.csv` の販促（一部のバージョンではチラシのため過去の上乗せ分の2倍または3倍）が加わります。ロールパンは引き続き評価しません。
  hard: >-
    ロールパンが加わるので、2026年6月1日に1個単位から6個入りパックに変わった単位が効いてきます。また、`販促計画.csv` を書き出した後の10月30日に、1つのカテゴリ（飲料、乳製品、ベーカリーのいずれか）の販促が中止になりました。
