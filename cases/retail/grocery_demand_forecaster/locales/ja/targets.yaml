- id: order_quantity
  text: 各店舗は毎日ファイルの数字をそのまま発注し、自分では何も上乗せしません。そのため数字は販売見込みではなく、発注数量でなければなりません。
- id: lost_sale_cost
  text: "お客様が買おうとして棚になかった1個の損失は、閉店時に売れ残った1個の約{{lost_sale_cost}}倍です。"
- id: stockout_censoring
  text: 欠品日の販売数量は在庫分で頭打ちになっており、お客様の需要はそれより多かったはずです。発注数量は需要を満たす必要があるので、こうした日を通常の販売として扱ってはいけません。
- id: base_forecast
  text: 今回の発注数量には販促計画.csvの販促を含めません。販促の効果はカテゴリ担当が後から上乗せします。
- id: promo_plan
  text: 販促計画.csvの販促は予測期間に実施され、必ず発注数量に含めます。後から上乗せする人はいません。
- id: promo_flyer
  text: "<!-- when: promo_uplift=1 -->11月の販促はこれまでと同じやり方（棚の値札だけで、チラシなし）なので、履歴から推定した伸びをそのまま使います。<!-- /when --><!-- when: promo_uplift=2,3 -->11月の販促は紙のチラシにも載り、同じカテゴリ・同じ割引率の過去の販促に比べて上乗せ分の売上が約{{promo_uplift}}倍になります。<!-- /when -->"
- id: promo_revision
  text: "10月30日（金）、販促計画.csvを書き出した後に、計画にある{{promo_cancelled}}の販促はすべて中止になりました。これらは実施せず、計画のほかの部分は変わりません。"
- id: one_off_holiday
  text: "{{holiday_date}}の一度限りの地域の祝日は祝日一覧.csvにありません。店舗は通常営業で、過去の祝日と同様に需要が増え、ベーカリーと飲料の伸びが最も大きくなります。"
- id: min_display
  text: "主力商品（青果と乳製品、I01-I06）は、店舗の営業日には発注数量を{{min_display}}未満にしません。"
- id: manager_note
  text: 中央広場店（S1）の店長がメールで求めている20%の上乗せは店長個人の希望で、会社の方針ではありません。S1もほかの店舗と同じように発注します。
- id: submission_format
  text: 発注システムがファイルをそのまま取り込むため、2026-11-02から2026-11-15まで店舗・商品・日付ごとにちょうど1行（計840行）が必要です。S4の日曜日（発注数量0）とロールパン（I07）の行も含めます。
