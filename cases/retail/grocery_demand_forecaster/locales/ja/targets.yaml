- id: base_forecast
  text: 今回は基本予測だけが必要です。販促計画.csvの販促と一度限りの地域の祝日はカテゴリ担当が上乗せするため含めず、それらの効果を取り除いた基本の販売数量で評価します。
- id: stockout_censoring
  text: 欠品日の販売数量は在庫分で頭打ちになっています。予測するのはお客様の需要なので、こうした日を通常の販売として扱ってはいけません。
- id: returns
  text: 販売数量がマイナスの行は返品日に記録されたお客様の返品です。需要ではないため除外し、販売数量と相殺もしません。
- id: s4_sunday_closed
  text: 旧市街店S4は毎週日曜日が定休日で、日曜日の予測は0にしなければなりません。
- id: promo_plan
  text: 販促計画.csvの販促（開始日・終了日を含む）は必ず反映します。伸びは割引率が大きいほど大きく、カテゴリによって異なり、履歴の販促割引率_%から推定します。
- id: promo_flyer
  text: "<!-- when: promo_uplift=1 -->11月の販促はこれまでと同じやり方（棚の値札だけで、チラシなし）なので、履歴から推定した伸びをそのまま使います。<!-- /when --><!-- when: promo_uplift=1.5,2 -->11月の販促は紙のチラシにも載り、同じカテゴリ・同じ割引率の過去の販促に比べて上乗せ分の売上が約{{promo_uplift}}倍になります。<!-- /when -->"
- id: promo_revision
  text: "10月30日（金）、販促計画.csvを書き出した後に、計画にある{{promo_cancelled}}の販促はすべて中止になりました。これらは実施せず、計画のほかの部分は変わりません。"
- id: one_off_holiday
  text: "{{holiday_date}}の一度限りの地域の祝日は祝日一覧.csvにありません。店舗は通常営業で、過去の祝日と同様に需要が増え、ベーカリーと飲料の伸びが最も大きくなります。"
- id: unit_change_i07
  text: ロールパンI07は2026年5月31日までは1個単位、6月1日からは6個入りパック単位で記録されています。それ以前の履歴は6で割り、I07はパック単位で予測します。
- id: min_display
  text: "主力商品（青果と乳製品、I01-I06）は、店舗の営業日には予測を{{min_display}}未満にしません。"
- id: wape_metric
  text: "品質は<!-- when: short_weight=1 -->店舗ごとのWAPE（絶対誤差の合計 ÷ 実績の合計）<!-- /when --><!-- when: short_weight=2,3 -->少なすぎた1個を多すぎた1個の{{short_weight}}倍に数える店舗ごとの加重WAPE（実績の合計で割る）<!-- /when -->の5店舗平均で、低いほど良い評価です。<!-- tier: easy medium -->今回の実績は返品を差し引いたレジの販売数量（欠品日は記録どおり）で、ロールパンI07は評価しません。<!-- /tier --><!-- tier: hard -->実績は欠品による販売機会ロスを含むお客様の需要です。<!-- /tier -->"
- id: submission_format
  text: forecast.csvを列store_id,item_id,date,forecastで提出し、2026-11-02から2026-11-15まで店舗・商品・日付ごとにちょうど1行（計840行）とします。
