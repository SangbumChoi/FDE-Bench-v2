- id: order_quantity
  kind: ambiguous
  domain: business rule
  text: The stores order exactly the number in the file for each day and add nothing of their own, so it must be the quantity to order, not the expected sales.
- id: lost_sale_cost
  kind: missing
  domain: business rule
  param: lost_sale_cost
  text: "A unit a customer wanted and did not find costs about {{lost_sale_cost}} times as much as a unit left over at closing."
- id: stockout_censoring
  kind: ambiguous
  domain: data semantics
  text: On stockout days units_sold is capped by what was in stock and customer demand was higher; the order must cover demand, so those days must not be treated as normal sales.
- id: base_forecast
  kind: missing
  domain: business rule
  tiers: [easy]
  text: This round the order leaves the promotions in promo_plan.csv out; the category team adds their effect on top afterwards.
- id: promo_plan
  kind: missing
  domain: business rule
  tiers: [medium, hard]
  text: The promotions in promo_plan.csv run in the forecast period and must be in the order quantities; nobody adds them afterwards.
- id: promo_flyer
  kind: missing
  domain: business rule
  tiers: [medium, hard]
  param: promo_uplift
  text: "<!-- when: promo_uplift=1 -->The November promotions run like past ones (shelf labels only, no flyer), so the lift learned from the history applies as it is.<!-- /when --><!-- when: promo_uplift=2,3 -->The November promotions are also in the printed flyer and bring about {{promo_uplift}} times the extra sales of a past promotion with the same discount in the same category.<!-- /when -->"
- id: promo_revision
  kind: missing
  domain: business rule
  tiers: [hard]
  param: promo_cancelled
  text: "On Friday 30 October, after promo_plan.csv was exported, all {{promo_cancelled}} promotions in the plan were cancelled; they do not run, and the rest of the plan stands."
- id: one_off_holiday
  kind: missing
  domain: business rule
  param: holiday_date
  text: "The one-off regional holiday on {{holiday_date}} is not in holidays.csv; stores are open and demand rises as on past holidays, most for bakery and beverages."
- id: min_display
  kind: missing
  domain: business rule
  param: min_display
  text: "Core items (fresh produce and dairy, I01-I06) are never ordered below {{min_display}} units on a day the store is open."
- id: manager_note
  kind: ambiguous
  domain: business rule
  text: The Central Plaza (S1) store manager's e-mail asking for 20% on top is his own wish, not company policy; S1 is ordered like every other store.
- id: submission_format
  kind: ambiguous
  domain: deliverable
  text: The ordering system loads the file as it is, so it needs exactly one row for every store, item and day from 2026-11-02 to 2026-11-15 (840 rows), S4's Sundays (order 0) and bread rolls (I07) included.
