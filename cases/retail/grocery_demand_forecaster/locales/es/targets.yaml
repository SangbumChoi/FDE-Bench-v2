- id: base_forecast
  text: En esta ronda solo se quiere la previsión base; las promociones de plan_promociones.csv y el festivo regional único los añade el equipo de categorías, así que se dejan fuera y la previsión se evalúa con las ventas base, sin esos efectos.
- id: stockout_censoring
  text: Los días con rotura de stock las unidades_vendidas están limitadas por el stock; se prevé la demanda de los clientes, así que esos días no se tratan como ventas normales.
- id: returns
  text: Las filas con unidades_vendidas negativas son devoluciones de clientes registradas el día de la devolución; no son demanda y se excluyen, sin restarlas de las ventas.
- id: s4_sunday_closed
  text: La tienda Casco Antiguo S4 cierra los domingos y su previsión para esos días debe ser 0.
- id: promo_plan
  text: Hay que usar las promociones de plan_promociones.csv (con las fechas de inicio y fin incluidas); el aumento crece con el descuento, varía por categoría y se estima con el descuento_promo_pct del historial.
- id: promo_flyer
  text: "<!-- when: promo_uplift=1 -->Las promociones de noviembre funcionan como las anteriores (solo etiqueta en el lineal, sin folleto), así que el aumento estimado del historial vale tal cual.<!-- /when --><!-- when: promo_uplift=1.5,2 -->Las promociones de noviembre salen también en el folleto impreso y traen unas {{promo_uplift}} veces las ventas adicionales de una promoción pasada con el mismo descuento en la misma categoría.<!-- /when -->"
- id: promo_revision
  text: "El viernes 30 de octubre, después de exportar plan_promociones.csv, se cancelaron todas las promociones de {{promo_cancelled}} del plan; no se harán y el resto del plan se mantiene."
- id: one_off_holiday
  text: "El festivo regional único del {{holiday_date}} no está en festivos.csv; las tiendas abren y la demanda sube como en los festivos anteriores, sobre todo en panadería y bebidas."
- id: unit_change_i07
  text: Los panecillos I07 se registraban por unidad hasta el 31 de mayo de 2026 y por paquete de 6 desde el 1 de junio de 2026; el historial anterior se divide por 6 y I07 se prevé en paquetes.
- id: min_display
  text: "Los artículos básicos (fruta y verdura y lácteos, I01-I06) nunca tienen una previsión por debajo de {{min_display}} unidades en un día en que la tienda abre."
- id: wape_metric
  text: "La calidad es <!-- when: short_weight=1 -->el WAPE por tienda (suma de errores absolutos entre la suma de lo real)<!-- /when --><!-- when: short_weight=2,3 -->un WAPE ponderado por tienda en el que cada unidad prevista de menos cuenta {{short_weight}} veces una unidad prevista de más, dividido entre la suma de lo real<!-- /when -->, promediado entre las cinco tiendas; cuanto más bajo, mejor. <!-- tier: easy medium -->En esta ronda lo real son las ventas de caja con las devoluciones restadas (los días de rotura, tal como se registraron) y los panecillos I07 no se evalúan.<!-- /tier --><!-- tier: hard -->Lo real es la demanda de los clientes, incluidas las ventas perdidas por rotura de stock.<!-- /tier -->"
- id: submission_format
  text: Se entrega forecast.csv con las columnas store_id,item_id,date,forecast y exactamente una fila por tienda, artículo y día del 2026-11-02 al 2026-11-15 (840 filas).
