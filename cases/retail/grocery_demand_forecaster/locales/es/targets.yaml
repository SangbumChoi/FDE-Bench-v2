- id: order_quantity
  text: Las tiendas piden exactamente la cifra del archivo para cada día y no añaden nada por su cuenta, así que tiene que ser la cantidad a pedir, no las ventas esperadas.
- id: lost_sale_cost
  text: "Una unidad que un cliente quería y no encontró cuesta unas {{lost_sale_cost}} veces lo que una unidad que sobra al cierre."
- id: stockout_censoring
  text: Los días con rotura de stock las unidades_vendidas están limitadas por el stock y la demanda de los clientes fue mayor; el pedido tiene que cubrir la demanda, así que esos días no se tratan como ventas normales.
- id: base_forecast
  text: En esta ronda el pedido deja fuera las promociones de plan_promociones.csv; su efecto lo añade después el equipo de categorías.
- id: promo_plan
  text: Las promociones de plan_promociones.csv se hacen en el periodo de la previsión y tienen que estar en las cantidades pedidas; nadie las añade después.
- id: promo_flyer
  text: "<!-- when: promo_uplift=1 -->Las promociones de noviembre funcionan como las anteriores (solo etiqueta en el lineal, sin folleto), así que el aumento estimado del historial vale tal cual.<!-- /when --><!-- when: promo_uplift=2,3 -->Las promociones de noviembre salen también en el folleto impreso y traen unas {{promo_uplift}} veces las ventas adicionales de una promoción pasada con el mismo descuento en la misma categoría.<!-- /when -->"
- id: promo_revision
  text: "El viernes 30 de octubre, después de exportar plan_promociones.csv, se cancelaron todas las promociones de {{promo_cancelled}} del plan; no se harán y el resto del plan se mantiene."
- id: one_off_holiday
  text: "El festivo regional único del {{holiday_date}} no está en festivos.csv; las tiendas abren y la demanda sube como en los festivos anteriores, sobre todo en panadería y bebidas."
- id: min_display
  text: "Los artículos básicos (fruta y verdura y lácteos, I01-I06) nunca se piden por debajo de {{min_display}} unidades para un día en que la tienda abre."
- id: manager_note
  text: El 20% adicional que pide por correo el gerente de la tienda Plaza Central (S1) es un deseo suyo, no la política de la empresa; S1 se pide como todas las demás tiendas.
- id: submission_format
  text: El sistema de pedidos carga el archivo tal cual, así que necesita exactamente una fila por tienda, artículo y día del 2026-11-02 al 2026-11-15 (840 filas), incluidos los domingos de S4 (con pedido 0) y los panecillos (I07).
