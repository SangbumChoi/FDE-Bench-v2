id: callcenter_workforce_planner
role: Call-Center Workforce Planner
task_type: Combinatorial Optimization
field: customer_service
seed: 20261109
objective: minimize          # under_weight x under-covered agent-slots + labor cost (by the shift; a part-timer's
                             # and a new hire's contract week paid in full even if fewer of their shifts are rostered;
                             # a full-timer's shift beyond the contract week, possible from medium with an approved
                             # exception, at 1.5x)
quality_cap: 1.06            # the median best known quality over the audit's settings, rounded up (GT.md, part 4)
audited: true
tiers:                       # one world: the same staff, forecast, leave file and team lead's note in every setting
  easy: >-
    The core staffing problem: one language per agent per shift (one of their skills), full-timers on 8-hour and
    part-timers on 4-hour shifts within their contract weeks (nobody works beyond them this round), the rest time
    between two shifts of an agent, approved leave, a regional public holiday on one weekday (a share of the
    forecast, rounded up) and the price of a missing agent, which trades under-staffing against labor cost (paid by
    the shift, but a part-timer's guaranteed week and a new hire's training salary are paid in full).
    Overtime and the new-hire pairing are out of scope this round, and the agent in the team lead's note is back on
    Monday as the note says.
  medium: >-
    Easy plus overtime (a full-timer may work one shift beyond the contract week, only with the operations
    manager's approval and at 1.5 times the rate: a business policy that an approved exception can bend) and the
    new-hire buddy rule (a new hire is never alone on a language). The agent in the team lead's note is back on
    Monday.
  hard: >-
    Medium plus a dated sick call: the team lead's note of Thursday asks to roster the agent it names as usual,
    but the doctor's certificate the client received on Friday morning keeps that agent off sick for the first
    days of the week; rostering them on one of those days breaks a rule.
params:                      # the client's rules a rule seed draws (DESIGN.md, Settings)
  under_weight:              # the price of a missing agent per half-hour slot and language, in the units of the
    values: [17, 50]         # hourly rates: a cost-driven center or one that cannot afford to miss calls
  ft_week_hours:             # the full-time contract week (32 h = 4 shifts, 40 h = 5): the weekly cap in easy; from
    values: [32, 40]         # medium one more shift is possible as overtime (derived: ft_regular_shifts, ft_max_shifts)
  pt_week_hours:             # the part-time contract week (12 h = 3 shifts, 16 h = 4), the part-timers' weekly cap
    values: [12, 16]         # (derived: pt_max_shifts)
  min_rest:                  # hours of rest between two shifts of an agent
    values: [11, 13]
  holiday_day:               # the regional public holiday of the week (any weekday), which the forecast file was
                             # not updated for
    values: ["2026-11-09", "2026-11-10", "2026-11-11", "2026-11-12", "2026-11-13"]
    labels:
      "2026-11-09": {zh: 11月9日（周一）, en: Monday 9 November, ko: 11월 9일(월), ja: 11月9日（月）,
                     es: lunes 9 de noviembre}
      "2026-11-10": {zh: 11月10日（周二）, en: Tuesday 10 November, ko: 11월 10일(화), ja: 11月10日（火）,
                     es: martes 10 de noviembre}
      "2026-11-11": {zh: 11月11日（周三）, en: Wednesday 11 November, ko: 11월 11일(수), ja: 11月11日（水）,
                     es: miércoles 11 de noviembre}
      "2026-11-12": {zh: 11月12日（周四）, en: Thursday 12 November, ko: 11월 12일(목), ja: 11月12日（木）,
                     es: jueves 12 de noviembre}
      "2026-11-13": {zh: 11月13日（周五）, en: Friday 13 November, ko: 11월 13일(금), ja: 11月13日（金）,
                     es: viernes 13 de noviembre}
  holiday_factor:            # the holiday's share of the forecast, rounded up to whole agents
    values: [0.25, 0.5]
    labels:
      0.25: {zh: "25%", en: "25%", ko: "25%", ja: "25%", es: "25 %"}
      0.5: {zh: "50%", en: "50%", ko: "50%", ja: "50%", es: "50 %"}
  sick_until:                # last day off sick of the agent in the team lead's note (hard; easy, medium: back Monday)
    values: {easy: ["2026-11-08"], medium: ["2026-11-08"], hard: ["2026-11-11", "2026-11-12", "2026-11-13"]}
    labels:
      "2026-11-08": {zh: 11月8日（周日）, en: Sunday 8 November, ko: 11월 8일(일), ja: 11月8日（日）,
                     es: domingo 8 de noviembre}
      "2026-11-11": {zh: 11月11日（周三）, en: Wednesday 11 November, ko: 11월 11일(수), ja: 11月11日（水）,
                     es: miércoles 11 de noviembre}
      "2026-11-12": {zh: 11月12日（周四）, en: Thursday 12 November, ko: 11월 12일(목), ja: 11月12日（木）,
                     es: jueves 12 de noviembre}
      "2026-11-13": {zh: 11月13日（周五）, en: Friday 13 November, ko: 11월 13일(금), ja: 11月13日（金）,
                     es: viernes 13 de noviembre}
rule_seeds: [10, 2, 11]      # the public panel: every candidate of every pool appears but two holiday days (Tuesday,
                             # Thursday); seed 10 first (the binding check's setting, where every parameter changes the
                             # reference's validity or objective)
deliverables: [roster.json]
deliverable_spec: |
  roster.json = {"assignments": [{"agent": "<agent id, e.g. A01>", "day": "YYYY-MM-DD (2026-11-09 .. 2026-11-15)",
                                  "shift": "<shift id from the shift list, e.g. S0800 or P1600>",
                                  "language": "<language the agent takes calls in for this shift: ko | ja | en | zh | es>"}, ...]}
  One entry per agent per worked shift; ids exactly as in the data; language as the ASCII code
  (ko = Korean, ja = Japanese, en = English, zh = Chinese, es = Spanish).
rules:
  - id: skill_valid
    class: physical
    description: An agent only takes calls in a language listed among their skills.
  - id: shift_type
    class: contractual
    description: Full-timers work only 8-hour shifts, part-timers only 4-hour shifts.
  - id: max_shifts
    class: contractual
    description: A full-timer works at most {{ft_max_shifts}} shifts a week, a part-timer at most {{pt_max_shifts}}.
  - id: min_rest
    class: contractual
    description: At least {{min_rest}} hours between the end of one shift and the start of the agent's next shift (so at most one shift a day).
  - id: leave_respected
    class: contractual
    description: Nobody is scheduled on a day of approved leave.
  - id: overtime_approval
    class: business_policy
    tiers: [medium, hard]
    description: Overtime is not planned. A full-timer's shift beyond the {{ft_regular_shifts}} shifts of the contract week needs the operations manager's approval.
  - id: buddy_rule
    class: contractual
    tiers: [medium, hard]
    description: Whenever a new hire is on the phones, at least one non-new agent is on the same language at the same time.
  - id: sick_leave
    class: contractual
    tiers: [hard]
    description: The agent in the team lead's note is not scheduled on any day up to and including {{sick_until}}, the last day of their doctor's certificate.
