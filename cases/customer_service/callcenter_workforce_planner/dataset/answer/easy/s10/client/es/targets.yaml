- id: one_language
  kind: ambiguous
  domain: data semantics
  text: Durante todo el turno un agente atiende en un solo idioma de los que habla; un agente bilingüe
    nunca cuenta para dos idiomas a la vez.
- id: slot_coverage
  kind: ambiguous
  domain: calculation
  text: La previsión ya da el número de agentes que hacen falta por idioma y por franja de media hora;
    la cobertura se comprueba por franja de 30 minutos y el agente cuenta en todas las franjas de su turno.
- id: contract_limits
  kind: missing
  domain: business rule
  text: El personal de jornada completa solo hace turnos de 8 horas y como máximo 5 a la semana; el de
    media jornada, solo turnos de 4 horas y como máximo 3.
- id: one_shift_a_day
  kind: missing
  domain: business rule
  text: Ningún agente hace más de un turno en el mismo día.
- id: leave_dates
  kind: ambiguous
  domain: data semantics
  text: La lista de ausencias escribe las fechas como día/mes/año con los dos extremos incluidos, y solo
    cuentan las aprobadas; una solicitud rechazada significa que el agente está disponible.
- id: understaffing_penalty
  kind: missing
  domain: scoring
  text: El cuadrante se puntúa con 40 por cada agente que falta por franja e idioma (la estimación del
    cliente, en las unidades de las tarifas por hora, de lo que cuesta un agente que falta), más el coste
    de personal de todos los turnos; cuanto menor, mejor.
- id: easy_scope
  kind: missing
  domain: business rule
  text: Esta vez se usa la previsión tal como está todos los días, cada turno se calcula a la tarifa por
    hora normal, los descansos se revisan en sala (solo cuenta no hacer más de un turno al día) y las
    personas de nuevo ingreso pueden programarse como cualquier otra.
