- id: one_language
  kind: ambiguous
  domain: data semantics
  text: 担当者は1回のシフト中、自分の対応言語のうち1言語だけで対応し、バイリンガルでも同時に2言語分としては数えられません。
- id: slot_coverage
  kind: ambiguous
  domain: calculation
  text: 予測ファイルはすでに言語別・30分枠ごとの必要人数で、充足は30分枠ごとに確認し、担当者はシフト内のすべての枠に数えられます。
- id: contract_limits
  kind: missing
  domain: business rule
  text: 正社員は8時間シフトのみで週5回まで、パートは4時間シフトのみで週3回までです。
- id: one_shift_a_day
  kind: missing
  domain: business rule
  text: 担当者のシフトは1日1回までです。
- id: leave_dates
  kind: ambiguous
  domain: data semantics
  text: 休暇一覧の日付は日/月/年の順で開始日・終了日とも含み、承認済みのものだけが休暇で、却下された申請者は勤務できます。
- id: understaffing_penalty
  kind: missing
  domain: scoring
  text: シフト表は、枠・言語ごとに不足する担当者1名につき15（人件費と同じ単位で顧客が見積もった不足の損失）に全シフトの人件費を加えた値で評価され、低いほど良いです。
- id: easy_scope
  kind: missing
  domain: business rule
  text: 今回はどの日も予測をそのまま使い、どのシフトも通常の時給で計算し、休息時間は現場で確認し（1日1シフトだけ守ればよい）、新人もほかの担当者と同じように配置できます。
