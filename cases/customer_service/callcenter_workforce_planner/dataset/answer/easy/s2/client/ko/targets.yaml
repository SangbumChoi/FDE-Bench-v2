- id: one_language
  kind: ambiguous
  domain: data semantics
  text: 상담원은 한 근무 동안 본인 언어능력 중 한 언어로만 응대하며, 2개 국어 상담원도 동시에 두 언어로 집계되지 않습니다.
- id: slot_coverage
  kind: ambiguous
  domain: calculation
  text: 예측 파일은 이미 언어별·30분 시간대별 필요 상담원 수이며, 충족 여부는 30분 단위로 확인하고 상담원은 근무 시간 안의 모든 시간대에 집계됩니다.
- id: contract_limits
  kind: missing
  domain: business rule
  text: 풀타임은 8시간 근무만 주 최대 6회, 파트타임은 4시간 근무만 주 최대 3회 할 수 있습니다.
- id: one_shift_a_day
  kind: missing
  domain: business rule
  text: 상담원은 하루에 최대 1회만 근무합니다.
- id: leave_dates
  kind: ambiguous
  domain: data semantics
  text: 휴가목록의 날짜는 일/월/연도 순서이고 시작일과 종료일 모두 포함하며, 승인된 건만 휴가이고 반려된 신청자는 근무할 수 있습니다.
- id: understaffing_penalty
  kind: missing
  domain: scoring
  text: 근무표는 시간대·언어별로 부족한 상담원 1명·30분당 25(고객사가 인건비와 같은 단위로 추정한 부족 손실)에 모든 근무의 인건비를 더해 평가하며, 낮을수록 좋습니다.
- id: easy_scope
  kind: missing
  domain: business rule
  text: 이번에는 모든 날을 예측 그대로 쓰고, 모든 근무를 기본 시급으로 계산하며, 휴식 시간은 현장에서 확인하고(하루 1회 근무만 지키면 됨), 신입도 다른 상담원과 똑같이
    배정할 수 있습니다.
