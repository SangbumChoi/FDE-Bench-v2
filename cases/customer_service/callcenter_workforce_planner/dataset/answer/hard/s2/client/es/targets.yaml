- id: one_language
  kind: ambiguous
  domain: data semantics
  text: Durante todo el turno un agente atiende en un solo idioma de los que habla; un agente bilingüe
    nunca cuenta para dos idiomas a la vez.
- id: slot_coverage
  kind: ambiguous
  domain: calculation
  text: La previsión ya da el número de agentes que hacen falta por idioma y por franja de media hora;
    la cobertura se comprueba por franja de 30 minutos y el agente cuenta en todas las franjas de su turno.
- id: holiday_wednesday
  kind: missing
  domain: data semantics
  text: El miércoles 11 de noviembre es festivo regional en el mercado principal; la demanda de ese día
    es el 60 % de la previsión, redondeado hacia arriba, y el archivo no se actualizó.
- id: contract_limits
  kind: missing
  domain: business rule
  text: El personal de jornada completa solo hace turnos de 8 horas y como máximo 6 a la semana; el de
    media jornada, solo turnos de 4 horas y como máximo 3.
- id: min_rest
  kind: missing
  domain: business rule
  text: Entre el final de un turno y el inicio del siguiente del mismo agente debe haber al menos 13 horas
    de descanso.
- id: leave_dates
  kind: ambiguous
  domain: data semantics
  text: La lista de ausencias escribe las fechas como día/mes/año con los dos extremos incluidos, y solo
    cuentan las aprobadas; una solicitud rechazada significa que el agente está disponible.
- id: overtime
  kind: missing
  domain: scoring
  text: La semana de contrato de jornada completa es de 40 horas (5 turnos); el 6.º turno de la semana
    es hora extra y cuesta 1,5 veces la tarifa por hora.
- id: buddy_rule
  kind: missing
  domain: business rule
  text: Una persona de nuevo ingreso nunca puede estar sola en un idioma; en cada franja de media hora
    que trabaja, hay al menos un agente que no es nuevo en el mismo idioma.
- id: understaffing_penalty
  kind: missing
  domain: scoring
  text: El cuadrante se puntúa con 25 por cada agente que falta por franja e idioma (la estimación del
    cliente, en las unidades de las tarifas por hora, de lo que cuesta un agente que falta), más el coste
    de personal de todos los turnos; cuanto menor, mejor.
- id: sick_call
  kind: missing
  domain: data semantics
  text: La nota del responsable de equipo está desfasada; el viernes por la mañana el cliente recibió
    el parte médico de la persona que nombra, que está de baja hasta el jueves 12 de noviembre incluido
    y no puede programarse antes, diga lo que diga la nota.
