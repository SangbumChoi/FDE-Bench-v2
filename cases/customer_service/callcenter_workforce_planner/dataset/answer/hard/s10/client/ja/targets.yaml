- id: one_language
  kind: ambiguous
  domain: data semantics
  text: 担当者は1回のシフト中、自分の対応言語のうち1言語だけで対応し、バイリンガルでも同時に2言語分としては数えられません。
- id: slot_coverage
  kind: ambiguous
  domain: calculation
  text: 予測ファイルはすでに言語別・30分枠ごとの必要人数で、充足は30分枠ごとに確認し、担当者はシフト内のすべての枠に数えられます。
- id: holiday_wednesday
  kind: missing
  domain: data semantics
  text: 11月11日（水）は主要市場がある地域の祝日のため、その日の需要は予測値の50%を切り上げた値で、ファイルには反映されていません。
- id: contract_limits
  kind: missing
  domain: business rule
  text: 正社員は8時間シフトのみで週5回まで、パートは4時間シフトのみで週3回までです。
- id: min_rest
  kind: missing
  domain: business rule
  text: 同じ担当者のシフト終了から次のシフト開始まで、11時間以上の休息が必要です。
- id: leave_dates
  kind: ambiguous
  domain: data semantics
  text: 休暇一覧の日付は日/月/年の順で開始日・終了日とも含み、承認済みのものだけが休暇で、却下された申請者は勤務できます。
- id: overtime
  kind: missing
  domain: scoring
  text: 正社員の契約上の労働時間は週32時間（シフト4回）で、週5回目のシフトは時間外勤務として時給の1.5倍がかかります。
- id: buddy_rule
  kind: missing
  domain: business rule
  text: 新人を1人だけで1言語に入れてはならず、新人が勤務するすべての30分枠で同じ言語に新人ではない担当者が1名以上必要です。
- id: understaffing_penalty
  kind: missing
  domain: scoring
  text: シフト表は、枠・言語ごとに不足する担当者1名につき40（人件費と同じ単位で顧客が見積もった不足の損失）に全シフトの人件費を加えた値で評価され、低いほど良いです。
- id: sick_call
  kind: missing
  domain: data semantics
  text: リーダーからの連絡は古い情報です。金曜日の朝にそこに書かれた担当者の診断書が届き、11月11日（水）まで（当日を含む）病気休暇のため、連絡の内容にかかわらずそれまでは配置できません。
