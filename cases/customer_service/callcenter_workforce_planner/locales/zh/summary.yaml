# The case in plain words, shown at the top of its page.
task: "为一家用韩语、日语、英语、中文和西班牙语接听电话（08:00–22:00）的客服中心编排下周（2026年11月9日周一至15日周日）的班表。AI 要为 30 名坐席逐一决定哪天上班、上哪个班次、接哪个语种，使每个语种都有足够人手且总成本最低，并以 `roster.json` 交付。"
given:
  - "客户的需求：寥寥几句，请人排下周的班表，要求“每个语种都要有足够的人接电话，别让客户等太久”。没有写任何规则或数字。"
  - "`人员名单.xlsx`：30 名坐席（全职 20 人，其中新员工 4 人；兼职 10 人）以及每人能接听的语种。"
  - "`话务量预测.csv`：每天 08:00–22:00 每个半小时、每个语种所需的坐席人数（1–5 人），已经换算成人数，而不是来电量。"
  - "`班次.csv` 和 `人工成本.csv`：4 个全职 8 小时班次（08:00、10:00、12:00、14:00 开始）、4 个兼职 4 小时班次（08:00、12:00、16:00、18:00 开始），以及时薪（全职 22，兼职 18，不带货币单位）。"
  - "`请假记录.csv`：5 条请假申请，日期按“日/月/年”书写，其中 1 条已被驳回。"
  - "`组长留言.txt`：11月5日（周四）发来的留言，说一位因流感请病假的坐席“周一就能好”，请照常排班。"
ask:
  - "缺一名坐席的代价：某个语种在半小时内少一个人时客户估算的损失，与时薪同一单位，随版本不同为 17 或 50。它决定花钱多排一个班是否划算。"
  - "一个班次内坐席只接一个语种：会两种语言的坐席也不能同时顶两个语种。"
  - "全职的合同工时：每周 32 或 40 小时（4 或 5 个班），随版本不同。easy 中谁都不超出合同工时；medium 和 hard 中可以多上一个班，但必须经运营经理批准，并按时薪的 1.5 倍付薪。"
  - "兼职的合同工时：每周 12 或 16 小时（3 或 4 个 4 小时班），随版本不同，不加班。这些工时是保底的：即使排的班更少，兼职也按整周合同工时付薪。"
  - "两个班之间的休息：同一坐席上一个班结束到下一个班开始至少间隔 11 或 13 小时（随版本不同）。"
  - "有没有特殊的日子。有：11月9日（周一）到 13日（周五）中的一天（随版本不同）是地区公共假日，当天按预测值的 25% 或 50% 向上取整排班；预测文件没有更新。"
  - "新员工怎么付薪：他们领培训期工资，无论是否上线接电话都按整周合同工时付薪，少排他们的班并不省钱。"
  - "medium 和 hard：新员工不能单独负责一个语种。新员工在岗的每个半小时，同一语种上至少要有一名非新员工。"
  - "hard：组长留言是否仍然准确。并不准确：周五上午收到的医生证明显示，这位坐席的病假持续到 11月11日（周三）、12日（周四）或 13日（周五）。"
invalid_if:
  - "给坐席安排了其语言技能中没有的语种。"
  - "让全职上 4 小时班或让兼职上 8 小时班，或者每周班次数超过合同允许的上限（easy 中全职 4 或 5 个，medium 和 hard 中再多 1 个；兼职 3 或 4 个）。"
  - "同一坐席两个班之间的休息不足 11 或 13 小时（一天上两个班也算）。"
  - "在已批准的请假日给人排了班。"
  - "在 medium 和 hard 中，未经运营经理批准就让全职上了超出合同工时的班（除非公司政策允许放宽这条规则，且 AI 事先向客户申请了例外），或者新员工在岗的某个半小时里同一语种上没有任何非新员工。"
  - "在 hard 中，在医生证明的最后一天及之前的任何一天给组长留言里的那位坐席排了班。"
quality: "数值越低越好：每个半小时、每个语种每缺一名坐席记 17 或 50（随版本不同），再加上所有班次的人工成本（时薪全职 22、兼职 18；兼职和新员工即使排的班更少，也按整周合同工时付薪；获批的加班按 1.5 倍），全部与时薪同一单位。客户原来的做法（记 0 分）是不看话务量预测排出的固定班表；参考答案（记 1 分）逐个重排每位坐席的一周，再两人一组一起重排，直到没有任何改动能降低总成本。已知最好的班表是精确最优解，得分比 1 高出几个百分点。"
tiers:
  easy: "核心排班：每个班次一个语种、与用工类型相符的班次时长、全职和兼职的合同工时（不加班）、两个班之间的休息、已批准的请假、地区假日，以及缺人的代价。新员工可以像其他人一样排班，组长留言里的坐席周一回来上班。"
  medium: "增加加班（全职每周可多上一个班，但须经运营经理批准并按 1.5 倍付薪），以及新员工不能单独负责一个语种。"
  hard: "增加病假通知：组长留言要求照常给这位坐席排班，但第二天上午收到的医生证明显示，其病假持续到 11月11日（周三）、12日（周四）或 13日（周五）。"
