# The explainer's case texts in Simplified Chinese (English comes from case.yaml).
role: 呼叫中心人力排班规划师
task_type: 组合优化
deliverable_spec: |
  roster.json = {"assignments": [{"agent": "<坐席工号，例如 A01>", "day": "YYYY-MM-DD (2026-11-09 .. 2026-11-15)",
                                  "shift": "<班次表中的班次编号，例如 S0800 或 P1600>",
                                  "language": "<该坐席在本班次接听的语种：ko | ja | en | zh | es>"}, ...]}
  每位坐席每上一个班记一条；编号与数据中完全一致；语种用 ASCII 代码填写
  （ko = 韩语，ja = 日语，en = 英语，zh = 中文，es = 西班牙语）。
tiers:
  easy: >-
    核心排班问题：每位坐席每个班次只接一个语种（须是其语言技能之一），全职上 8 小时班、兼职上 4 小时班且不超过每周上限，每天最多一个班，已批准的请假（日期按“日/月/年”书写，被驳回的申请不算请假），以及把缺人和人工成本放在一起衡量的缺员权重。周三的假日、加班费、休息时间和新员工带教本轮不在范围内；组长留言里的那位坐席如留言所说周一回来上班。
  medium: >-
    easy 加上同一坐席两个班之间的休息时间、11月11日周三的地区假日（按预测值的一定比例向上取整）、超出全职每周合同工时的加班（按时薪的 1.5 倍）和新员工带教惯例（新员工不能单独负责一个语种）。组长留言里的那位坐席周一回来上班。
  hard: >-
    medium 加上一条带日期的病假通知：组长周四的留言要求照常给留言里的坐席排班，但客户周五上午收到的医生证明让这位坐席在本周头几天仍在病假中；在这些日子给其排班即违反规则。
rules:
  skill_valid: 坐席只接听其语言技能中列出的语种。
  one_shift_a_day: 每位坐席每天最多上一个班。
  min_rest: 同一坐席上一个班结束到下一个班开始之间至少间隔 {{min_rest}} 小时（因此每天最多一个班）。
  shift_type: 全职只上 8 小时班，兼职只上 4 小时班。
  max_shifts: 全职每周最多上 {{ft_max_shifts}} 个班，兼职每周最多 3 个班。
  leave_respected: 已批准的请假日不给任何人排班。
  sick_leave: 组长留言里的那位坐席在 {{sick_until}}（医生证明的最后一天）及之前的任何一天都不排班。
  buddy_rule: 只要有新员工在岗接听，同一时间同一语种上就至少有一位非新员工坐席。
