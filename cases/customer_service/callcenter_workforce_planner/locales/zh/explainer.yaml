# The explainer's case texts in Simplified Chinese (English comes from case.yaml).
role: 呼叫中心人力排班规划师
task_type: 组合优化
deliverable_spec: |
  roster.json = {"assignments": [{"agent": "<坐席工号，例如 A01>", "day": "YYYY-MM-DD (2026-11-09 .. 2026-11-15)",
                                  "shift": "<班次表中的班次编号，例如 S0800 或 P1600>",
                                  "language": "<该坐席在本班次接听的语种：ko | ja | en | zh | es>"}, ...]}
  每位坐席每上一个班记一条；编号与数据中完全一致；语种用 ASCII 代码填写
  （ko = 韩语，ja = 日语，en = 英语，zh = 中文，es = 西班牙语）。
tiers:
  easy: >-
    核心排班问题：每位坐席每个班次只接一个语种（须是其语言技能之一），全职上 8 小时班、兼职上 4 小时班且不超出各自的合同工时（本轮不加班），同一坐席两个班之间的休息时间，已批准的请假（日期按“日/月/年”书写，被驳回的申请不算请假），本周某一天的地区公共假日（按预测值的一定比例向上取整），以及把缺人和人工成本放在一起衡量的缺人代价（按班次付薪，但兼职的保底工时和新员工的培训期工资整周照付）。加班和新员工带教本轮不在范围内；组长留言里的那位坐席如留言所说周一回来上班。
  medium: >-
    easy 加上加班（全职每周可超出合同工时多上一个班，但须经运营经理批准并按时薪的 1.5 倍付薪：这是一条可以经批准例外放宽的业务规定）和新员工带教规定（新员工不能单独负责一个语种）。组长留言里的那位坐席周一回来上班。
  hard: >-
    medium 加上一条带日期的病假通知：组长周四的留言要求照常给留言里的坐席排班，但客户周五上午收到的医生证明让这位坐席在本周头几天仍在病假中；在这些日子给其排班即违反规则。
rules:
  skill_valid: 坐席只接听其语言技能中列出的语种。
  shift_type: 全职只上 8 小时班，兼职只上 4 小时班。
  max_shifts: 全职每周最多上 {{ft_max_shifts}} 个班，兼职每周最多上 {{pt_max_shifts}} 个班。
  min_rest: 同一坐席上一个班结束到下一个班开始之间至少间隔 {{min_rest}} 小时（因此每天最多一个班）。
  leave_respected: 已批准的请假日不给任何人排班。
  overtime_approval: 不事先安排加班。全职超出合同工时 {{ft_regular_shifts}} 个班的班次须经运营经理批准。
  buddy_rule: 只要有新员工在岗接听，同一时间同一语种上就至少有一位非新员工坐席。
  sick_leave: 组长留言里的那位坐席在 {{sick_until}}（医生证明的最后一天）及之前的任何一天都不排班。
shortcuts:
  one_shift: 最低限度地守住规则：整周只排一个班（第一位坐席、其第一个班次和第一个语种）。
  fixed_rota: 照抄客户自己的固定班表（基线）。
  fixed_rota_no_new_hires: 固定班表只改一处：新员工不上线。
  fixed_rota_peak: 固定班表只改一处：所有人都上 10:00（全职）或 12:00（兼职）的班。
  same_shift_all_week: 常数输出：每位非新员工从周一起按合同工时上其用工类型的第一个班次，接第一个语种。
  part_timers_only: 利用目标函数的算术：只排兼职，每半小时最便宜的人手（参考规划器，不用全职）。
  one_day_only: 不完整的班表：只交参考规划器周一那一天的排班，其余六天没人。
  weekdays_only: 不完整的班表：只交参考规划器周一到周五的排班，周末没人。
  no_new_hires: 形式上守住新员工规则：从参考规划器的班表里去掉新员工，让他们不上线。
  one_shift_each: 最低限度地守住规则：用参考规划器给每位坐席每周只排一个班。
  literal_plus_max_shifts: 字面解法加一条规则：照需求原样做，但守住全职和兼职的每周上限。
  literal_plus_min_rest: 字面解法加一条规则：照需求原样做，但守住两个班之间的休息时间。
  literal_plus_buddy_rule: 字面解法加一条规则：照需求原样做，但新员工不单独负责一个语种。
  literal_plus_overtime_approval: 字面解法加一条规则：照需求原样做，但全职不超出合同工时。
  literal_plus_sick_leave: 字面解法加一条规则：照需求原样做，但避开医生证明上的病假日。
