- id: one_language
  text: 一个班次内坐席只接一个语种（须是其语言技能之一），会两种语言的坐席不能同时算两个语种。
- id: understaffing_price
  text: 每个时段、每个语种每缺一名坐席的代价是 {{under_weight}}，与时薪同一单位（客户估算的放弃来电、回拨处理和服务水平不达标的损失）；班表按这项代价加上所有班次的人工成本来评判，越低越好。
- id: ft_contract_week
  text: "全职的合同工时是每周 {{ft_week_hours}} 小时，即 {{ft_regular_shifts}} 个班<!-- tier: easy -->；本轮谁都不超出合同工时<!-- /tier --><!-- tier: medium hard -->；不事先安排加班，超出合同工时的班（最多一个，按 1.5 倍付薪）必须经运营经理批准<!-- /tier -->。"
- id: pt_contract_week
  text: 兼职的合同工时是每周 {{pt_week_hours}} 小时，最多 {{pt_max_shifts}} 个班，不加班；这些工时是保底的，即使排的班更少也照付。
- id: min_rest
  text: 同一坐席上一个班结束到下一个班开始之间至少休息 {{min_rest}} 小时。
- id: holiday
  text: "{{holiday_day}}是客户主要市场所在地区的公共假日，当天需求按预测值的 {{holiday_factor}} 向上取整计算，预测文件没有为此更新。"
- id: training_salary
  text: 新员工领培训期工资：无论是否上线接电话，其整周合同工时（{{ft_regular_shifts}} 个班）都照付，所以少排新员工的班并不省钱。
- id: buddy_rule
  text: 新员工不能单独负责一个语种，其在岗的每个半小时时段，同一语种至少要有一位非新员工。
- id: sick_call
  text: 组长留言已经过时；客户周五上午收到了留言里那位坐席的医生证明，病假到 {{sick_until}} 为止（含当天），不管留言怎么说，在此之前都不能给这个人排班。
