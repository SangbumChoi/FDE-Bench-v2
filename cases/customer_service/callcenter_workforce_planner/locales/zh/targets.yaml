- id: one_language
  text: 一个班次内坐席只接一个语种（须是其语言技能之一），会两种语言的坐席不能同时算两个语种。
- id: slot_coverage
  text: 预测文件给的已经是每个语种每半小时所需的坐席人数，按半小时时段检查覆盖，坐席在班次内的每个时段都算在岗。
- id: holiday_wednesday
  text: 11月11日周三是主要市场所在地区的公共假日，当天需求按预测值的 {{holiday_factor}} 向上取整计算，预测文件没有更新。
- id: contract_limits
  text: 全职只上 8 小时班且每周最多 {{ft_max_shifts}} 个，兼职只上 4 小时班且每周最多 3 个。
- id: one_shift_a_day
  text: 每位坐席每天最多上一个班。
- id: min_rest
  text: 同一坐席上一个班结束到下一个班开始之间至少休息 {{min_rest}} 小时。
- id: leave_dates
  text: 请假记录的日期是“日/月/年”格式，起止日期都包含在内；只有已批准的才算请假，被驳回的申请人可以排班。
- id: overtime
  text: 全职的合同工时是每周 {{ft_week_hours}} 小时（{{ft_regular_shifts}} 个班），每周第 {{ft_max_shifts}} 个班算加班，成本按时薪的 1.5 倍计算。
- id: buddy_rule
  text: 新员工不能单独负责一个语种，其在岗的每个半小时时段，同一语种至少要有一位非新员工。
- id: understaffing_penalty
  text: 班表按每个时段每个语种每缺一名坐席记 {{under_weight}}（客户用与时薪相同的单位估算的缺人损失），再加上所有班次的人工成本来评分，越低越好。
- id: sick_call
  text: 组长留言已经过时；客户周五上午收到了留言里那位坐席的医生证明，病假到 {{sick_until}} 为止（含当天），不管留言怎么说，在此之前都不能给这个人排班。
- id: easy_scope
  text: 本轮每天都按预测原样安排，每个班按普通时薪计算成本，休息时间由现场核对（只要求每天最多一个班），新员工可以和其他人一样排班。
