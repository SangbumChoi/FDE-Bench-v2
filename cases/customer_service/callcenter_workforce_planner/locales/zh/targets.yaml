- id: one_language
  text: 一个班次内坐席只接一个语种（须是其语言技能之一），会两种语言的坐席不能同时算两个语种。
- id: slot_coverage
  text: 预测文件给的已经是每个语种每半小时所需的坐席人数，按半小时时段检查覆盖，坐席在班次内的每个时段都算在岗。
- id: holiday_wednesday
  text: 11月11日周三是公共假日，当天需求按预测值的 60% 向上取整计算，预测文件没有更新。
- id: contract_limits
  text: 全职只上 8 小时班且每周最多 5 个，兼职只上 4 小时班且每周最多 3 个。
- id: min_rest
  text: 同一坐席上一个班结束到下一个班开始之间至少休息 11 小时。
- id: leave_dates
  text: 请假记录的日期是“日/月/年”格式，起止日期都包含在内；只有已批准的才算请假，被驳回的申请人可以排班。
- id: overtime
  text: 全职正常一周上 4 个班，第 5 个班算加班，成本按时薪的 1.5 倍计算。
- id: buddy_rule
  text: 新员工不能单独负责一个语种，其在岗的每个半小时时段，同一语种至少要有一位非新员工。
- id: understaffing_penalty
  text: 班表按每个时段每个语种每缺一名坐席记 40，再加上所有班次的人工成本来评分，越低越好。
