# The explainer's case texts in Korean (English comes from case.yaml).
role: 콜센터 인력 운영 플래너
task_type: 조합 최적화
deliverable_spec: |
  roster.json = {"assignments": [{"agent": "<상담원 ID, 예: A01>", "day": "YYYY-MM-DD (2026-11-09 .. 2026-11-15)",
                                  "shift": "<근무유형 목록의 근무코드, 예: S0800 또는 P1600>",
                                  "language": "<상담원이 이 근무에서 응대하는 언어: ko | ja | en | zh | es>"}, ...]}
  상담원 1명의 근무 1회당 항목 1개입니다. ID는 데이터에 있는 그대로 쓰고, 언어는 ASCII 코드로 씁니다
  (ko = 한국어, ja = 일본어, en = 영어, zh = 중국어, es = 스페인어).
rules:
  skill_valid: 상담원은 본인 언어능력에 있는 언어로만 응대합니다.
  min_rest: 한 근무가 끝나고 같은 상담원의 다음 근무가 시작되기까지 최소 11시간이 있어야 합니다(따라서 하루 최대 1회 근무).
  shift_type: 풀타임은 8시간 근무만, 파트타임은 4시간 근무만 합니다.
  max_shifts: 풀타임은 주 최대 5회, 파트타임은 주 최대 3회 근무합니다.
  leave_respected: 승인된 휴가일에는 아무도 배정하지 않습니다.
  buddy_rule: 신입이 전화를 받는 동안에는 언제나 같은 시간에 같은 언어로 배정된 기존(신입이 아닌) 상담원이 최소 1명 있습니다.
