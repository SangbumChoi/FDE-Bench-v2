# The explainer's case texts in Korean (English comes from case.yaml).
role: 콜센터 인력 운영 플래너
task_type: 조합 최적화
deliverable_spec: |
  roster.json = {"assignments": [{"agent": "<상담원 ID, 예: A01>", "day": "YYYY-MM-DD (2026-11-09 .. 2026-11-15)",
                                  "shift": "<근무유형 목록의 근무코드, 예: S0800 또는 P1600>",
                                  "language": "<상담원이 이 근무에서 응대하는 언어: ko | ja | en | zh | es>"}, ...]}
  상담원 1명의 근무 1회당 항목 1개입니다. ID는 데이터에 있는 그대로 쓰고, 언어는 ASCII 코드로 씁니다
  (ko = 한국어, ja = 일본어, en = 영어, zh = 중국어, es = 스페인어).
tiers:
  easy: >-
    핵심 인력 배치 문제입니다. 근무당 한 언어(본인 언어능력 중 하나), 각자의 계약 근무시간 안에서 풀타임은 8시간·파트타임은 4시간 근무(이번에는
    초과근무 없음), 같은 상담원의 두 근무 사이 휴식 시간, 승인된 휴가(날짜는 일/월/연도로 적혀 있고 반려된 신청은 휴가가 아님), 이번 주 하루의
    지역 공휴일(예측값의 일정 비율을 올림), 그리고 부족한 상담원 1명에 인건비와 견줄 값을 매기는 인력 부족 비용이 적용됩니다(근무별로 지급하지만 파트타임의 보장 시간과 신입의 교육 기간 급여는 전액 지급). 초과근무와 신입 짝
    배치는 이번 범위 밖이며, 팀장 메모에 나온 상담원은 메모대로 월요일에 복귀합니다.
  medium: >-
    easy에 더해 초과근무(풀타임은 계약 근무시간을 넘겨 한 주에 1회 더 근무할 수 있지만 운영 매니저의 승인이 필요하고 시급의 1.5배를 지급하며,
    승인된 예외로 완화할 수 있는 업무 규정입니다)와 신입 짝 배치 규정(신입은 혼자 한 언어를 맡지 않음)이 적용됩니다. 팀장 메모에 나온 상담원은
    월요일에 복귀합니다.
  hard: >-
    medium에 더해 날짜가 정해진 병가 연락이 있습니다. 목요일에 온 팀장 메모는 메모에 나온 상담원을 평소처럼 배정하라고
    하지만, 고객사가 금요일 오전에 받은 진단서에 따르면 그 상담원은 주 초반 며칠 동안 병가입니다. 그 기간에 하루라도
    배정하면 규칙 위반입니다.
rules:
  skill_valid: 상담원은 본인 언어능력에 있는 언어로만 응대합니다.
  shift_type: 풀타임은 8시간 근무만, 파트타임은 4시간 근무만 합니다.
  max_shifts: 풀타임은 주 최대 {{ft_max_shifts}}회, 파트타임은 주 최대 {{pt_max_shifts}}회 근무합니다.
  min_rest: 한 근무가 끝나고 같은 상담원의 다음 근무가 시작되기까지 최소 {{min_rest}}시간이 있어야 합니다(따라서 하루 최대 1회 근무).
  leave_respected: 승인된 휴가일에는 아무도 배정하지 않습니다.
  overtime_approval: 초과근무는 미리 계획하지 않습니다. 풀타임이 계약 근무시간인 {{ft_regular_shifts}}회를 넘겨 하는 근무에는 운영 매니저의 승인이 필요합니다.
  buddy_rule: 신입이 전화를 받는 동안에는 언제나 같은 시간에 같은 언어로 배정된 기존(신입이 아닌) 상담원이 최소 1명 있습니다.
  sick_leave: 팀장 메모에 나온 상담원은 진단서의 마지막 날인 {{sick_until}}까지 어느 날에도 배정하지 않습니다.
shortcuts:
  one_shift: '규칙을 최소한으로만 지킴: 한 주에 근무 1회만(첫 번째 상담원, 그 상담원의 첫 근무유형과 첫 언어).'
  fixed_rota: 고객의 고정 근무표를 그대로 베낌(기준선).
  fixed_rota_no_new_hires: '고정 근무표에서 한 가지만 바꿈: 신입은 전화를 받지 않음.'
  fixed_rota_peak: '고정 근무표에서 한 가지만 바꿈: 모두 10:00(풀타임) 또는 12:00(파트타임) 근무.'
  same_shift_all_week: '상수 출력: 신입이 아닌 상담원 모두가 월요일부터 계약 근무 횟수만큼 고용형태의 첫 근무유형, 첫 언어로 근무.'
  part_timers_only: '목적함수의 산술 이용: 30분당 가장 싼 파트타임만 배정(풀타임 없이 돌린 참조 플래너).'
  one_day_only: '일부만 짠 근무표: 참조 플래너의 월요일 근무만 넣고 나머지 6일은 아무도 없음.'
  weekdays_only: '일부만 짠 근무표: 참조 플래너의 월요일부터 금요일까지 근무만 넣고 주말에는 아무도 없음.'
  no_new_hires: '신입 규칙을 형식적으로만 지킴: 참조 플래너의 근무표에서 신입을 빼고 전화 응대에 넣지 않음.'
  one_shift_each: '규칙을 최소한으로만 지킴: 참조 플래너로 모든 상담원에게 주 1회 근무만 배정.'
  literal_plus_max_shifts: '문자 그대로의 해법에 규칙 하나를 더함: 요청대로 하되 풀타임·파트타임의 주간 상한을 지킴.'
  literal_plus_min_rest: '문자 그대로의 해법에 규칙 하나를 더함: 요청대로 하되 두 근무 사이 휴식 시간을 지킴.'
  literal_plus_buddy_rule: '문자 그대로의 해법에 규칙 하나를 더함: 요청대로 하되 신입을 혼자 한 언어에 두지 않음.'
  literal_plus_overtime_approval: '문자 그대로의 해법에 규칙 하나를 더함: 요청대로 하되 풀타임이 계약 근무시간을 넘지 않음.'
  literal_plus_sick_leave: '문자 그대로의 해법에 규칙 하나를 더함: 요청대로 하되 진단서의 병가일을 피함.'
