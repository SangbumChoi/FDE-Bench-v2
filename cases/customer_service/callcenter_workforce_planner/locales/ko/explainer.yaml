# The explainer's case texts in Korean (English comes from case.yaml).
role: 콜센터 인력 운영 플래너
task_type: 조합 최적화
deliverable_spec: |
  roster.json = {"assignments": [{"agent": "<상담원 ID, 예: A01>", "day": "YYYY-MM-DD (2026-11-09 .. 2026-11-15)",
                                  "shift": "<근무유형 목록의 근무코드, 예: S0800 또는 P1600>",
                                  "language": "<상담원이 이 근무에서 응대하는 언어: ko | ja | en | zh | es>"}, ...]}
  상담원 1명의 근무 1회당 항목 1개입니다. ID는 데이터에 있는 그대로 쓰고, 언어는 ASCII 코드로 씁니다
  (ko = 한국어, ja = 일본어, en = 영어, zh = 중국어, es = 스페인어).
tiers:
  easy: >-
    핵심 인력 배치 문제입니다. 상담원은 근무마다 언어 하나만(본인 언어능력 중 하나) 응대하고, 풀타임은 8시간 근무, 파트타임은
    4시간 근무를 주간 상한 안에서 하며, 하루 최대 1회 근무, 승인된 휴가(날짜는 일/월/연도, 반려된 신청은 휴가가 아님), 그리고
    부족 인원과 인건비를 함께 따지는 인력 부족 단가가 적용됩니다. 수요일 공휴일, 초과근무 수당, 휴식 시간, 신입 짝 배치는 이번
    범위 밖이며, 팀장 메모에 나온 상담원은 메모대로 월요일에 복귀합니다.
  medium: >-
    easy에 더해 같은 상담원의 두 근무 사이 휴식 시간, 11월 11일 수요일의 지역 공휴일(예측값의 일정 비율을 올림), 풀타임 계약
    근무시간을 넘는 초과근무(시급의 1.5배), 신입 짝 배치 관행(신입은 혼자 한 언어를 맡지 않음)이 적용됩니다. 팀장 메모에 나온
    상담원은 월요일에 복귀합니다.
  hard: >-
    medium에 더해 날짜가 정해진 병가가 있습니다. 목요일에 온 팀장 메모는 메모에 나온 상담원을 평소처럼 배정하라고 하지만,
    고객사가 금요일 오전에 받은 진단서에 따르면 그 상담원은 주 초반 며칠 동안 병가입니다. 그날 중 하루라도 배정하면 규칙
    위반입니다.
rules:
  skill_valid: 상담원은 본인 언어능력에 있는 언어로만 응대합니다.
  one_shift_a_day: 상담원은 하루에 최대 1회만 근무합니다.
  min_rest: 한 근무가 끝나고 같은 상담원의 다음 근무가 시작되기까지 최소 {{min_rest}}시간이 있어야 합니다(따라서 하루 최대 1회 근무).
  shift_type: 풀타임은 8시간 근무만, 파트타임은 4시간 근무만 합니다.
  max_shifts: 풀타임은 주 최대 {{ft_max_shifts}}회, 파트타임은 주 최대 3회 근무합니다.
  leave_respected: 승인된 휴가일에는 아무도 배정하지 않습니다.
  sick_leave: 팀장 메모에 나온 상담원은 진단서의 마지막 날인 {{sick_until}}까지 어느 날에도 배정하지 않습니다.
  buddy_rule: 신입이 전화를 받는 동안에는 언제나 같은 시간에 같은 언어로 배정된 기존(신입이 아닌) 상담원이 최소 1명 있습니다.
