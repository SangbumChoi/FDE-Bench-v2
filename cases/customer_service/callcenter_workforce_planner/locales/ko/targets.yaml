- id: one_language
  text: 상담원은 한 근무 동안 본인 언어능력 중 한 언어로만 응대하며, 2개 국어 상담원도 동시에 두 언어로 집계되지 않습니다.
- id: understaffing_price
  text: 시간대·언어별로 상담원이 1명 부족하면 30분당 {{under_weight}}의 손실로 봅니다(고객사가 시급과 같은 단위로 추정한 포기 콜·재문의·서비스 수준 미달 손실). 근무표는 이 손실에 모든 근무의 인건비를 더한 값으로 평가하며, 낮을수록 좋습니다.
- id: ft_contract_week
  text: "풀타임의 계약 근무시간은 주 {{ft_week_hours}}시간, 즉 근무 {{ft_regular_shifts}}회입니다<!-- tier: easy -->. 이번에는 아무도 이를 넘겨 일하지 않습니다<!-- /tier --><!-- tier: medium hard -->. 초과근무는 미리 계획하지 않으며, 이를 넘겨 하는 근무(최대 1회, 1.5배 지급)에는 운영 매니저의 승인이 필요합니다<!-- /tier -->."
- id: pt_contract_week
  text: 파트타임의 계약 근무시간은 주 {{pt_week_hours}}시간으로 최대 {{pt_max_shifts}}회 근무하며, 초과근무는 없습니다. 이 시간은 보장 시간이라 근무를 더 적게 배정해도 전액 지급합니다.
- id: min_rest
  text: 같은 상담원의 한 근무 종료부터 다음 근무 시작까지 최소 {{min_rest}}시간 휴식이 있어야 합니다.
- id: holiday
  text: "{{holiday_day}} 하루는 고객사 주요 시장이 있는 지역의 공휴일이라 그날 수요는 예측값의 {{holiday_factor}}를 올림한 값이고, 예측 파일에는 반영되어 있지 않습니다."
- id: training_salary
  text: 신입은 교육 기간 급여를 받으므로, 전화 응대에 배정되든 안 되든 계약 근무시간 전체(근무 {{ft_regular_shifts}}회)를 지급합니다. 신입의 근무를 빼도 절약되는 비용은 없습니다.
- id: buddy_rule
  text: 신입은 혼자 한 언어를 맡으면 안 되며, 신입이 근무하는 모든 30분 시간대에 같은 언어로 기존(신입이 아닌) 상담원이 최소 1명 있어야 합니다.
- id: sick_call
  text: 팀장 메모는 지난 정보입니다. 금요일 오전에 메모에 나온 상담원의 진단서가 들어왔고 {{sick_until}}까지(당일 포함) 병가이므로, 메모 내용과 상관없이 그때까지는 배정하면 안 됩니다.
