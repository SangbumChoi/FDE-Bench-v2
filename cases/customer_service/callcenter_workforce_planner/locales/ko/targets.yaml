- id: one_language
  text: 상담원은 한 근무 동안 본인 언어능력 중 한 언어로만 응대하며, 2개 국어 상담원도 동시에 두 언어로 집계되지 않습니다.
- id: slot_coverage
  text: 예측 파일은 이미 언어별·30분 시간대별 필요 상담원 수이며, 충족 여부는 30분 단위로 확인하고 상담원은 근무 시간 안의 모든 시간대에 집계됩니다.
- id: holiday_wednesday
  text: 11월 11일 수요일은 주요 시장이 있는 지역의 공휴일이라 그날 수요는 예측값의 {{holiday_factor}}를 올림한 값이고, 파일에는 반영되어 있지 않습니다.
- id: contract_limits
  text: 풀타임은 8시간 근무만 주 최대 {{ft_max_shifts}}회, 파트타임은 4시간 근무만 주 최대 3회 할 수 있습니다.
- id: one_shift_a_day
  text: 상담원은 하루에 최대 1회만 근무합니다.
- id: min_rest
  text: 같은 상담원의 한 근무 종료부터 다음 근무 시작까지 최소 {{min_rest}}시간 휴식이 있어야 합니다.
- id: leave_dates
  text: 휴가목록의 날짜는 일/월/연도 순서이고 시작일과 종료일 모두 포함하며, 승인된 건만 휴가이고 반려된 신청자는 근무할 수 있습니다.
- id: overtime
  text: 풀타임의 계약 근무시간은 주 {{ft_week_hours}}시간(근무 {{ft_regular_shifts}}회)이고, 주 {{ft_max_shifts}}번째 근무는 초과근무라 시급의 1.5배가 듭니다.
- id: buddy_rule
  text: 신입은 혼자 한 언어를 맡으면 안 되며, 신입이 근무하는 모든 30분 시간대에 같은 언어로 기존(신입이 아닌) 상담원이 최소 1명 있어야 합니다.
- id: understaffing_penalty
  text: 근무표는 시간대·언어별로 부족한 상담원 1명·30분당 {{under_weight}}(고객사가 인건비와 같은 단위로 추정한 부족 손실)에 모든 근무의 인건비를 더해 평가하며, 낮을수록 좋습니다.
- id: sick_call
  text: 팀장 메모는 지난 정보입니다. 금요일 오전에 메모에 나온 상담원의 진단서가 들어왔고 {{sick_until}}까지(당일 포함) 병가이므로, 메모 내용과 상관없이 그때까지는 배정하면 안 됩니다.
- id: easy_scope
  text: 이번에는 모든 날을 예측 그대로 쓰고, 모든 근무를 기본 시급으로 계산하며, 휴식 시간은 현장에서 확인하고(하루 1회 근무만 지키면 됨), 신입도 다른 상담원과 똑같이 배정할 수 있습니다.
