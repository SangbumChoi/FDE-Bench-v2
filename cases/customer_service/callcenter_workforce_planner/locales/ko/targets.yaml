- id: one_language
  text: 상담원은 한 근무 동안 본인 언어능력 중 한 언어로만 응대하며, 2개 국어 상담원도 동시에 두 언어로 집계되지 않습니다.
- id: slot_coverage
  text: 예측 파일은 이미 언어별·30분 시간대별 필요 상담원 수이며, 충족 여부는 30분 단위로 확인하고 상담원은 근무 시간 안의 모든 시간대에 집계됩니다.
- id: holiday_wednesday
  text: 11월 11일 수요일은 공휴일이라 그날 수요는 예측값의 60%를 올림한 값이고, 파일에는 반영되어 있지 않습니다.
- id: contract_limits
  text: 정규직은 8시간 근무만 주 최대 5회, 파트타임은 4시간 근무만 주 최대 3회 할 수 있습니다.
- id: min_rest
  text: 같은 상담원의 한 근무 종료부터 다음 근무 시작까지 최소 11시간 휴식이 있어야 합니다.
- id: leave_dates
  text: 휴가목록의 날짜는 일/월/연도 순서이고 시작일과 종료일 모두 포함하며, 승인된 건만 휴가이고 반려된 신청자는 근무할 수 있습니다.
- id: overtime
  text: 정규직의 기본 주간 근무는 4회이고, 5번째 근무는 초과근무라 시급의 1.5배가 듭니다.
- id: buddy_rule
  text: 신입은 혼자 한 언어를 맡으면 안 되며, 신입이 근무하는 모든 30분 시간대에 같은 언어로 신입이 아닌 상담원이 최소 1명 있어야 합니다.
- id: understaffing_penalty
  text: 근무표는 시간대·언어별로 부족한 상담원 1명당 40에 모든 근무의 인건비를 더해 평가하며, 낮을수록 좋습니다.
