# The case in plain words, shown at the top of its page.
task: "한국어·일본어·영어·중국어·스페인어로 08:00~22:00에 전화를 받는 고객센터의 다음 주(2026년 11월 9일 월요일~15일 일요일) 근무표를 짭니다. AI는 상담원 30명 각각이 어느 날, 어느 근무에, 어떤 언어로 전화를 받을지 정해 모든 언어에 인원이 충분하면서 총비용이 가장 낮은 근무표를 만들고, 이를 `roster.json`으로 넘깁니다."
given:
  - "고객의 요청: 다음 주 근무표를 부탁하는 몇 줄로, “지원하는 모든 언어에서 고객이 오래 기다리지 않도록 전화 받을 인원이 충분했으면 한다”는 내용입니다. 규칙이나 숫자는 없습니다."
  - "`고객센터_상담원명단.xlsx`: 상담원 30명(풀타임 20명, 그중 신입 4명, 파트타임 10명)과 각자 응대할 수 있는 언어입니다."
  - "`콜예측.csv`: 날짜별로 08:00~22:00의 30분마다 언어별로 필요한 상담원 수(1~5명)입니다. 콜 수가 아니라 이미 인원으로 환산한 값입니다."
  - "`근무유형.csv`와 `인건비.csv`: 풀타임 8시간 근무 4가지(08:00, 10:00, 12:00, 14:00 시작), 파트타임 4시간 근무 4가지(08:00, 12:00, 16:00, 18:00 시작)와 시급(풀타임 22, 파트타임 18, 통화 단위 없음)입니다."
  - "`휴가목록.csv`: 휴가 신청 5건입니다. 날짜는 일/월/연도 순서이고, 그중 1건은 반려되었습니다."
  - "`팀장_메모.txt`: 11월 5일(목)에 온 메모로, 독감으로 병가 중인 상담원이 “월요일이면 괜찮다”고 하니 평소처럼 근무에 넣어 달라고 합니다."
ask:
  - "상담원 1명이 부족할 때의 비용: 한 언어에서 30분 동안 1명이 모자랄 때 고객이 매기는 값으로, 시급과 같은 단위입니다. 버전에 따라 15, 25, 40 중 하나입니다. 이 값에 따라 돈을 들여 근무를 넣을 가치가 있는지가 갈립니다."
  - "상담원은 한 근무 동안 한 언어로만 응대한다는 점: 2개 국어 상담원도 두 언어를 동시에 채우지 못합니다."
  - "계약 조건: 풀타임은 8시간 근무만, 파트타임은 4시간 근무만 하며 파트타임은 주 최대 3회입니다. 풀타임의 계약 근무시간은 주 32시간 또는 40시간(근무 4회 또는 5회)이고, 1회를 더해 주 최대 5회 또는 6회까지 근무할 수 있습니다. medium부터는 이 추가 1회가 초과근무라 시급의 1.5배입니다."
  - "휴가목록 날짜를 읽는 법: 일/월/연도 순서이고(10/11/2026은 10월 11일이 아니라 11월 10일), 시작일과 종료일을 모두 포함하며, 반려된 신청은 휴가가 아닙니다."
  - "근무 사이 휴식: easy에서는 하루 1회 근무만 지키면 되고, medium·hard에서는 한 근무가 끝나고 다음 근무가 시작되기까지 최소 11시간 또는 13시간을 쉬어야 합니다."
  - "medium·hard: 11월 11일 수요일은 지역 공휴일입니다. 그날은 예측 인원의 50%, 60%, 75%(버전에 따라 다름)만 필요하며, 소수점은 올림합니다. 예측 파일에는 반영되어 있지 않습니다."
  - "medium·hard: 신입은 혼자 한 언어를 맡지 않습니다. 신입이 근무하는 모든 30분 시간대에 같은 언어로 응대하는 경력 상담원(신입이 아닌 상담원)이 최소 1명 있어야 합니다."
  - "hard: 팀장 메모가 아직 맞는지입니다. 맞지 않습니다. 금요일 오전에 받은 진단서에 따르면 그 상담원은 11월 10일(화), 11일(수), 12일(목) 중 하루까지 병가입니다."
invalid_if:
  - "상담원을 본인 언어능력에 없는 언어에 배정합니다."
  - "풀타임을 4시간 근무에, 파트타임을 8시간 근무에 넣거나, 주간 근무 횟수 상한(풀타임 5회 또는 6회, 파트타임 3회)을 넘깁니다."
  - "한 상담원에게 하루 2회 근무를 넣거나, medium·hard에서 두 근무 사이 휴식이 11시간 또는 13시간보다 짧습니다."
  - "승인된 휴가일에 누군가를 배정합니다."
  - "medium·hard에서 신입이 근무하는 30분 시간대에 같은 언어로 응대하는 경력 상담원이 한 명도 없습니다."
  - "hard에서 팀장 메모에 나온 상담원을 진단서의 마지막 날까지 어느 날에든 배정합니다."
quality: "낮을수록 좋습니다. 30분 시간대와 언어마다 모자란 상담원 1명당 15, 25 또는 40(고객이 정한 값)에, 모든 근무의 인건비(시급 풀타임 22, 파트타임 18, medium부터 초과근무는 1.5배)를 더한 값이며, 모두 시급과 같은 단위입니다. 기존 방식(0점)은 슈퍼바이저가 콜 예측을 보지 않고 짠 고정 근무표이고, 모범 답안(1점)은 더 넣을 가치가 있는 근무가 없을 때까지 비용을 가장 많이 줄이는 근무를 하나씩 더합니다."
tiers:
  easy: "핵심 근무표입니다. 근무당 한 언어, 고용형태에 맞는 근무 길이, 주간 상한, 하루 1회 근무, 승인된 휴가, 부족 인원의 비용을 다룹니다. 예측은 그대로 쓰고, 모든 근무는 기본 시급으로 계산하며, 신입도 똑같이 배정하고, 팀장 메모의 상담원은 월요일에 복귀합니다."
  medium: "근무 사이 11시간 또는 13시간 휴식, 11월 11일 수요일 공휴일(예측 인원의 50%, 60%, 75%), 주 32시간 또는 40시간의 계약 근무시간을 넘는 초과근무 1.5배, 신입 혼자 배정 금지가 더해집니다."
  hard: "병가 연락이 더해집니다. 팀장 메모는 그 상담원을 평소처럼 배정하라고 하지만, 다음 날 오전에 받은 진단서에 따르면 그 상담원은 11월 10일(화), 11일(수), 12일(목) 중 하루까지 병가입니다."
