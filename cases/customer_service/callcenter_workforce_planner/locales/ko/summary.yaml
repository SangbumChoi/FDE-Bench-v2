# The case in plain words, shown at the top of its page.
task: "한국어·일본어·영어·중국어·스페인어로 08:00~22:00에 전화를 받는 고객센터의 다음 주(2026년 11월 9일 월요일~15일 일요일) 근무표를 짭니다. AI는 상담원 30명 각각이 어느 날, 어느 근무에, 어떤 언어로 전화를 받을지 정해 모든 언어에 인원이 충분하면서 총비용이 가장 낮은 근무표를 만들고, 이를 `roster.json`으로 넘깁니다."
given:
  - "고객의 요청: 다음 주 근무표를 부탁하는 몇 줄로, “지원하는 모든 언어에서 고객이 오래 기다리지 않도록 전화 받을 인원이 충분했으면 한다”는 내용입니다. 규칙이나 숫자는 없습니다."
  - "`고객센터_상담원명단.xlsx`: 상담원 30명(풀타임 20명, 그중 신입 4명, 파트타임 10명)과 각자 응대할 수 있는 언어입니다."
  - "`콜예측.csv`: 날짜별로 08:00~22:00의 30분마다 언어별로 필요한 상담원 수(1~5명)입니다. 콜 수가 아니라 이미 인원으로 환산한 값입니다."
  - "`근무유형.csv`와 `인건비.csv`: 풀타임 8시간 근무 4가지(08:00, 10:00, 12:00, 14:00 시작), 파트타임 4시간 근무 4가지(08:00, 12:00, 16:00, 18:00 시작)와 시급(풀타임 22, 파트타임 18, 통화 단위 없음)입니다."
  - "`휴가목록.csv`: 휴가 신청 5건입니다. 날짜는 일/월/연도 순서이고, 그중 1건은 반려되었습니다."
  - "`팀장_메모.txt`: 11월 5일(목)에 온 메모로, 독감으로 병가 중인 상담원이 “월요일이면 괜찮다”고 하니 평소처럼 근무에 넣어 달라고 합니다."
ask:
  - "상담원 1명이 부족할 때의 비용: 한 언어에서 30분 동안 1명이 모자랄 때 고객이 매기는 값으로, 시급과 같은 단위입니다. 버전에 따라 17 또는 50입니다. 이 값에 따라 돈을 들여 근무를 넣을 가치가 있는지가 갈립니다."
  - "상담원은 한 근무 동안 한 언어로만 응대한다는 점: 2개 국어 상담원도 두 언어를 동시에 채우지 못합니다."
  - "풀타임의 계약 근무시간: 버전에 따라 주 32시간 또는 40시간(근무 4회 또는 5회)입니다. easy에서는 아무도 이를 넘겨 일하지 않습니다. medium·hard에서는 근무를 1회 더 할 수 있지만 운영 매니저의 승인이 있어야 하고 시급의 1.5배를 지급합니다."
  - "파트타임의 계약 근무시간: 버전에 따라 주 12시간 또는 16시간(4시간 근무 3회 또는 4회)이며, 초과근무는 없습니다. 이 시간은 보장 시간이라 근무가 더 적어도 계약 근무시간 전체를 지급합니다."
  - "근무 사이 휴식: 한 근무가 끝나고 같은 상담원의 다음 근무가 시작되기까지 최소 11시간 또는 13시간(버전에 따라 다름)을 쉬어야 합니다."
  - "특별한 날이 있는지입니다. 있습니다. 11월 9일(월)부터 13일(금)까지 중 하루(버전에 따라 다름)가 지역 공휴일입니다. 그날은 예측 인원의 25% 또는 50%만 필요하며, 소수점은 올림합니다. 예측 파일에는 반영되어 있지 않습니다."
  - "신입의 급여 방식입니다. 신입은 교육 기간 급여를 받으므로 전화 응대에 배정되든 안 되든 계약 근무시간 전체를 지급하며, 신입의 근무를 빼도 비용이 줄지 않습니다."
  - "medium·hard: 신입은 혼자 한 언어를 맡지 않습니다. 신입이 근무하는 모든 30분 시간대에 같은 언어로 응대하는 경력 상담원(신입이 아닌 상담원)이 최소 1명 있어야 합니다."
  - "hard: 팀장 메모가 아직 맞는지입니다. 맞지 않습니다. 금요일 오전에 받은 진단서에 따르면 그 상담원은 11월 11일(수), 12일(목), 13일(금) 중 하루까지 병가입니다."
invalid_if:
  - "상담원을 본인 언어능력에 없는 언어에 배정합니다."
  - "풀타임을 4시간 근무에, 파트타임을 8시간 근무에 넣거나, 계약이 허용하는 주간 근무 횟수(풀타임은 easy에서 4회 또는 5회, medium·hard에서는 1회 더, 파트타임은 3회 또는 4회)를 넘깁니다."
  - "한 상담원의 두 근무 사이 휴식이 11시간 또는 13시간보다 짧습니다(하루 2회 근무 포함)."
  - "승인된 휴가일에 누군가를 배정합니다."
  - "medium·hard에서 운영 매니저의 승인 없이 풀타임에게 계약 근무시간을 넘는 근무를 넣거나(단, 회사 정책이 예외를 허용하고 AI가 먼저 고객에게 예외를 요청했다면 위반으로 보지 않습니다), 신입이 근무하는 30분 시간대에 같은 언어로 응대하는 경력 상담원이 한 명도 없습니다."
  - "hard에서 팀장 메모에 나온 상담원을 진단서의 마지막 날까지 어느 날에든 배정합니다."
quality: "낮을수록 좋습니다. 30분 시간대와 언어마다 모자란 상담원 1명당 17 또는 50(버전에 따라 다름)에, 모든 근무의 인건비(시급 풀타임 22, 파트타임 18, 파트타임과 신입은 근무가 더 적어도 계약 근무시간 전체를 지급, 승인된 초과근무는 1.5배)를 더한 값이며, 모두 시급과 같은 단위입니다. 기존 방식(0점)은 슈퍼바이저가 콜 예측을 보지 않고 짠 고정 근무표이고, 모범 답안(1점)은 상담원 한 명씩 한 주 근무를 다시 짜고 이어서 두 명씩 묶어 다시 짜는 일을, 총비용을 더 낮출 변경이 없을 때까지 되풀이합니다. 지금까지 알려진 가장 좋은 근무표는 정확한 최적해이며, 점수는 1보다 몇 퍼센트 높습니다."
tiers:
  easy: "핵심 근무표입니다. 근무당 한 언어, 고용형태에 맞는 근무 길이, 풀타임과 파트타임의 계약 근무시간(초과근무 없음), 근무 사이 휴식, 승인된 휴가, 지역 공휴일, 부족 인원의 비용을 다룹니다. 신입도 똑같이 배정하고, 팀장 메모의 상담원은 월요일에 복귀합니다."
  medium: "초과근무(풀타임이 한 주에 1회 더 근무할 수 있지만 운영 매니저의 승인이 필요하고 1.5배 지급)와 신입 혼자 배정 금지가 더해집니다."
  hard: "병가 연락이 더해집니다. 팀장 메모는 그 상담원을 평소처럼 배정하라고 하지만, 다음 날 오전에 받은 진단서에 따르면 그 상담원은 11월 11일(수), 12일(목), 13일(금) 중 하루까지 병가입니다."
