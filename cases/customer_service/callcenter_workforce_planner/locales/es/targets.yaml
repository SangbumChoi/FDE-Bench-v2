- id: one_language
  text: Durante todo el turno un agente atiende en un solo idioma de los que habla; un agente bilingüe nunca cuenta para dos idiomas a la vez.
- id: understaffing_price
  text: Cada agente que falta en una franja de media hora y un idioma cuesta {{under_weight}}, en las unidades de las tarifas por hora (la estimación del cliente de llamadas abandonadas, rellamadas y niveles de servicio incumplidos); el cuadrante se valora con ese coste más el coste de personal de todos los turnos, y cuanto menor, mejor.
- id: ft_contract_week
  text: "La semana de contrato del personal de jornada completa es de {{ft_week_hours}} horas, es decir, {{ft_regular_shifts}} turnos<!-- tier: easy -->, y en esta ronda nadie trabaja más allá de ella<!-- /tier --><!-- tier: medium hard -->. No se planifican horas extra: un turno más allá de ella (pagado a 1,5 veces) necesita la aprobación del responsable de operaciones<!-- /tier -->."
- id: pt_contract_week
  text: El contrato de media jornada es de {{pt_week_hours}} horas a la semana, como máximo {{pt_max_shifts}} turnos, sin horas extra; esas horas están garantizadas (se pagan completas aunque se programen menos turnos).
- id: min_rest
  text: Entre el final de un turno y el inicio del siguiente del mismo agente debe haber al menos {{min_rest}} horas de descanso.
- id: holiday
  text: "El {{holiday_day}} es festivo regional en el mercado principal del cliente; la demanda de ese día es el {{holiday_factor}} de la previsión, redondeado hacia arriba, y el archivo de previsión no se actualizó."
- id: training_salary
  text: "Las personas de nuevo ingreso cobran un salario de formación: su semana de contrato completa ({{ft_regular_shifts}} turnos) se paga estén o no al teléfono, así que quitarles turnos no ahorra nada."
- id: buddy_rule
  text: Una persona de nuevo ingreso nunca puede estar sola en un idioma; en cada franja de media hora que trabaja, hay al menos un agente que no es nuevo en el mismo idioma.
- id: sick_call
  text: La nota del responsable de equipo está desfasada; el viernes por la mañana el cliente recibió el parte médico de la persona que nombra, que está de baja hasta el {{sick_until}} incluido y no puede programarse antes, diga lo que diga la nota.
