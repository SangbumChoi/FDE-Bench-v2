# The case in plain words, shown at the top of its page.
task: "Preparar el cuadrante de turnos de la próxima semana (del lunes 9 al domingo 15 de noviembre de 2026) de un centro de llamadas que atiende en coreano, japonés, inglés, chino y español de 08:00 a 22:00. La IA decide, para cada uno de los 30 agentes, qué días trabaja, en qué turno y en qué idioma atiende, de modo que cada idioma tenga gente suficiente al menor coste total, y lo entrega como `roster.json`."
given:
  - "La solicitud del cliente: unas líneas que piden el cuadrante de la próxima semana con «suficiente gente al teléfono para que los clientes no esperen, en todos los idiomas que atendemos». No da reglas ni cifras."
  - "`agentes.xlsx`: los 30 agentes (20 de jornada completa, 4 de ellos de nuevo ingreso, y 10 de media jornada) y los idiomas en los que puede atender cada uno."
  - "`prevision_llamadas.csv`: cuántos agentes necesita cada idioma en cada media hora de 08:00 a 22:00, día por día: entre 1 y 5, ya contados en personas, no en llamadas."
  - "`turnos.csv` y `costes.csv`: cuatro turnos de 8 horas para jornada completa (empiezan a las 08:00, 10:00, 12:00 y 14:00), cuatro de 4 horas para media jornada (08:00, 12:00, 16:00 y 18:00) y la tarifa por hora: 22 en jornada completa, 18 en media jornada, sin moneda."
  - "`ausencias.csv`: 5 solicitudes de ausencia con fechas en día/mes/año; una de ellas, rechazada."
  - "`nota_responsable_equipo.txt`: un mensaje del jueves 5 de noviembre que dice que una persona de baja por gripe «el lunes estará bien» y pide incluirla en el cuadrante como siempre."
ask:
  - "Cuánto cuesta que falte un agente: el valor que el cliente da a un agente que falta media hora en un idioma, en las mismas unidades que las tarifas por hora: 17 o 50, según la versión. Decide cuántos turnos vale la pena pagar."
  - "Que un agente atiende en un solo idioma durante todo el turno: un agente bilingüe nunca cubre dos idiomas a la vez."
  - "La semana de contrato de jornada completa: 32 o 40 horas (4 o 5 turnos), según la versión. En easy nadie trabaja más allá de ella. En medium y hard se puede hacer un turno más, pero solo con la aprobación del responsable de operaciones y a 1,5 veces la tarifa."
  - "La semana de contrato de media jornada: 12 o 16 horas (3 o 4 turnos de 4 horas), según la versión, sin horas extra. Esas horas están garantizadas: se paga la semana de contrato completa aunque haya menos turnos."
  - "El descanso entre turnos: al menos 11 o 13 horas (según la versión) entre el final de un turno y el inicio del siguiente turno del mismo agente."
  - "Si hay algún día especial. Lo hay: un día laborable del lunes 9 al viernes 13 de noviembre (según la versión) es festivo regional. Ese día se planifica con el 25 % o el 50 % de la previsión, redondeado hacia arriba; el archivo no se actualizó."
  - "Cómo se paga a las personas de nuevo ingreso: cobran un salario de formación, así que su semana de contrato completa se paga estén o no al teléfono, y quitarles turnos no ahorra nada."
  - "Medium y hard: una persona de nuevo ingreso nunca está sola en un idioma. En cada media hora en que trabaja, al menos un agente que no sea de nuevo ingreso debe atender en el mismo idioma."
  - "Hard: si la nota del responsable de equipo sigue siendo cierta. No lo es: el parte médico recibido el viernes por la mañana mantiene a esa persona de baja hasta el miércoles 11, el jueves 12 o el viernes 13 de noviembre."
invalid_if:
  - "Asigna a un agente un idioma que no está entre sus idiomas."
  - "Pone a alguien de jornada completa en un turno de 4 horas o a alguien de media jornada en uno de 8, o da a alguien más turnos semanales de los que permite su contrato (4 o 5 en jornada completa en easy, uno más en medium y hard; 3 o 4 en media jornada)."
  - "Deja a un agente menos de 11 o 13 horas de descanso entre dos turnos (dos turnos el mismo día incluidos)."
  - "Programa a alguien en un día de ausencia aprobada."
  - "En medium y hard, da a alguien de jornada completa un turno más allá de su semana de contrato sin la aprobación del responsable de operaciones (salvo que la política de la empresa permita flexibilizar esta regla y la IA haya pedido antes una excepción al cliente), o deja a una persona de nuevo ingreso al teléfono en una media hora sin ningún agente que no sea de nuevo ingreso en el mismo idioma."
  - "En hard, programa a la persona de la nota del responsable de equipo algún día hasta el último día de su parte médico."
quality: "Cuanto menor, mejor: 17 o 50 (según la versión) por cada agente que falte en cada media hora y cada idioma, más el coste de personal de todos los turnos (22 por hora en jornada completa, 18 en media jornada; la semana de contrato completa de quien trabaja a media jornada y de quien es de nuevo ingreso, aunque tenga menos turnos; un turno de hora extra aprobado, a 1,5 veces), todo en las unidades de las tarifas por hora. La forma de trabajar del cliente (vale 0) es un cuadrante fijo hecho sin mirar la previsión; la solución de referencia (vale 1) replanifica la semana de cada agente por turnos, y después la de dos agentes a la vez, hasta que ningún cambio reduce el total. El mejor cuadrante conocido, un óptimo exacto, puntúa unos pocos puntos porcentuales por encima de 1."
tiers:
  easy: "El cuadrante básico: un idioma por turno, la duración de turno que corresponde a cada contrato, las semanas de contrato de jornada completa y de media jornada (sin horas extra), el descanso entre turnos, las ausencias aprobadas, el festivo regional y el coste de que falte un agente. Las personas de nuevo ingreso se programan como cualquiera y la persona de la nota vuelve el lunes."
  medium: "Añade las horas extra (un turno más a la semana en jornada completa, solo con la aprobación del responsable de operaciones y a 1,5 veces la tarifa) y que nadie de nuevo ingreso quede solo en un idioma."
  hard: "Añade la baja médica: la nota del responsable de equipo pide programar a esa persona como siempre, pero el parte médico recibido a la mañana siguiente la mantiene de baja hasta el miércoles 11, el jueves 12 o el viernes 13 de noviembre."
