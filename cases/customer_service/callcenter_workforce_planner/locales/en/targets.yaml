- id: one_language
  kind: ambiguous
  domain: data semantics
  text: An agent takes calls in only one language for the whole shift (one of their skills); a bilingual agent never counts for two languages at once.
- id: understaffing_price
  kind: missing
  domain: scoring
  param: under_weight
  text: A missing agent costs {{under_weight}} per half-hour slot and language, in the units of the hourly rates (the client's estimate of abandoned calls, callbacks and missed service levels); the roster is judged on that plus the labor cost of all shifts, and lower is better.
- id: ft_contract_week
  kind: missing
  domain: business rule
  param: ft_week_hours
  text: "A full-timer's contract week is {{ft_week_hours}} hours, that is {{ft_regular_shifts}} shifts<!-- tier: easy -->, and nobody works beyond it this round<!-- /tier --><!-- tier: medium hard -->. Overtime is not planned: one shift beyond it (paid 1.5 times) needs the operations manager's approval<!-- /tier -->."
- id: pt_contract_week
  kind: missing
  domain: business rule
  param: pt_week_hours
  text: A part-timer's contract is {{pt_week_hours}} hours a week, at most {{pt_max_shifts}} shifts, with no overtime; those hours are guaranteed (paid in full even if fewer shifts are rostered).
- id: min_rest
  kind: missing
  domain: business rule
  param: min_rest
  text: There must be at least {{min_rest}} hours of rest between the end of one shift and the start of the next shift of the same agent.
- id: holiday
  kind: missing
  domain: data semantics
  text: "{{holiday_day}} is a regional public holiday in the client's main market; the demand for that day is {{holiday_factor}} of the forecast, rounded up, and the forecast file was not updated for it."
- id: training_salary
  kind: missing
  domain: scoring
  text: "New hires are on a training salary: their whole contract week ({{ft_regular_shifts}} shifts) is paid whether or not they are on the phones, so leaving a new hire's shift off the roster saves nothing."
- id: buddy_rule
  kind: missing
  domain: business rule
  tiers: [medium, hard]
  text: A new hire must never be alone on a language; in every half-hour slot they work, at least one non-new agent is on the same language.
- id: sick_call
  kind: missing
  domain: data semantics
  tiers: [hard]
  text: The team lead's note is out of date; on Friday morning the client received the doctor's certificate of the agent it names, who is off sick up to and including {{sick_until}} and must not be rostered before then, whatever the note says.
