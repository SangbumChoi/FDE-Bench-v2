- id: one_language
  text: 担当者は1回のシフト中、自分の対応言語のうち1言語だけで対応し、バイリンガルでも同時に2言語分としては数えられません。
- id: slot_coverage
  text: 予測ファイルはすでに言語別・30分枠ごとの必要人数で、充足は30分枠ごとに確認し、担当者はシフト内のすべての枠に数えられます。
- id: holiday_wednesday
  text: 11月11日（水）は主要市場がある地域の祝日のため、その日の需要は予測値の{{holiday_factor}}を切り上げた値で、ファイルには反映されていません。
- id: contract_limits
  text: 正社員は8時間シフトのみで週{{ft_max_shifts}}回まで、パートは4時間シフトのみで週3回までです。
- id: one_shift_a_day
  text: 担当者のシフトは1日1回までです。
- id: min_rest
  text: 同じ担当者のシフト終了から次のシフト開始まで、{{min_rest}}時間以上の休息が必要です。
- id: leave_dates
  text: 休暇一覧の日付は日/月/年の順で開始日・終了日とも含み、承認済みのものだけが休暇で、却下された申請者は勤務できます。
- id: overtime
  text: 正社員の契約上の労働時間は週{{ft_week_hours}}時間（シフト{{ft_regular_shifts}}回）で、週{{ft_max_shifts}}回目のシフトは時間外勤務として時給の1.5倍がかかります。
- id: buddy_rule
  text: 新人を1人だけで1言語に入れてはならず、新人が勤務するすべての30分枠で同じ言語に新人ではない担当者が1名以上必要です。
- id: understaffing_penalty
  text: シフト表は、枠・言語ごとに不足する担当者1名につき{{under_weight}}（人件費と同じ単位で顧客が見積もった不足の損失）に全シフトの人件費を加えた値で評価され、低いほど良いです。
- id: sick_call
  text: リーダーからの連絡は古い情報です。金曜日の朝にそこに書かれた担当者の診断書が届き、{{sick_until}}まで（当日を含む）病気休暇のため、連絡の内容にかかわらずそれまでは配置できません。
- id: easy_scope
  text: 今回はどの日も予測をそのまま使い、どのシフトも通常の時給で計算し、休息時間は現場で確認し（1日1シフトだけ守ればよい）、新人もほかの担当者と同じように配置できます。
