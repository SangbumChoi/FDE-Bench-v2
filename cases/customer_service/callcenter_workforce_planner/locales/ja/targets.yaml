- id: one_language
  text: 担当者は1回のシフト中、自分の対応言語のうち1言語だけで対応し、バイリンガルでも同時に2言語分としては数えられません。
- id: understaffing_price
  text: 枠・言語ごとに担当者が1名不足すると{{under_weight}}の損失と見ます（時給と同じ単位で顧客が見積もった、放棄呼・折り返し対応・サービスレベル未達の損失）。シフト表はこの損失に全シフトの人件費を加えた値で評価され、低いほど良いです。
- id: ft_contract_week
  text: "正社員の契約上の労働時間は週{{ft_week_hours}}時間、つまりシフト{{ft_regular_shifts}}回です<!-- tier: easy -->。今回はこれを超えて働く人はいません<!-- /tier --><!-- tier: medium hard -->。時間外勤務はあらかじめ計画せず、これを超えて入るシフト（1回まで、1.5倍を支払う）には運営マネージャーの承認が必要です<!-- /tier -->。"
- id: pt_contract_week
  text: パートの契約上の労働時間は週{{pt_week_hours}}時間で、シフトは{{pt_max_shifts}}回まで、時間外勤務はありません。この時間は保証されており、シフトを少なく組んでも全額支払います。
- id: min_rest
  text: 同じ担当者のシフト終了から次のシフト開始まで、{{min_rest}}時間以上の休息が必要です。
- id: holiday
  text: "{{holiday_day}}は顧客の主要市場がある地域の祝日のため、その日の需要は予測値の{{holiday_factor}}を切り上げた値で、予測ファイルには反映されていません。"
- id: training_salary
  text: 新人は研修期間の給与制で、電話対応に入るかどうかにかかわらず契約上の労働時間分（シフト{{ft_regular_shifts}}回）を全額支払うため、新人のシフトを減らしても費用は減りません。
- id: buddy_rule
  text: 新人を1人だけで1言語に入れてはならず、新人が勤務するすべての30分枠で同じ言語に新人ではない担当者が1名以上必要です。
- id: sick_call
  text: リーダーからの連絡は古い情報です。金曜日の朝にそこに書かれた担当者の診断書が届き、{{sick_until}}まで（当日を含む）病気休暇のため、連絡の内容にかかわらずそれまでは配置できません。
