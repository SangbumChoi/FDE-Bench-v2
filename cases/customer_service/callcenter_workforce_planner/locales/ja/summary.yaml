# The case in plain words, shown at the top of its page.
task: "韓国語・日本語・英語・中国語・スペイン語で08:00〜22:00に電話を受けるコールセンターの、来週（2026年11月9日月曜日〜15日日曜日）のシフト表を作ります。AIは担当者30名それぞれについて、どの日にどのシフトでどの言語の電話を受けるかを決め、どの言語でも人数が足りて総コストが最も低いシフト表を `roster.json` として渡します。"
given:
  - "顧客の依頼：来週のシフト表を頼む数行の文で、「対応しているどの言語でもお客様をお待たせしないよう、電話に出られる人数を十分に確保したい」とあります。ルールや数値は書かれていません。"
  - "`オペレーター一覧.xlsx`：担当者30名（正社員20名、うち新人4名、パート10名）と、各自が対応できる言語です。"
  - "`入電予測.csv`：日ごとに、08:00〜22:00の30分枠ごと・言語ごとに必要な担当者数（1〜5名）です。入電件数ではなく、すでに人数に換算した値です。"
  - "`シフト.csv` と `人件費.csv`：正社員の8時間シフト4種（08:00、10:00、12:00、14:00開始）、パートの4時間シフト4種（08:00、12:00、16:00、18:00開始）と時給（正社員22、パート18、通貨単位なし）です。"
  - "`休暇一覧.csv`：休暇申請5件です。日付は日/月/年の順で、うち1件は却下されています。"
  - "`リーダーからの連絡.txt`：11月5日（木）に届いた連絡で、インフルエンザで病欠中の担当者が「月曜日には大丈夫」なので、いつもどおりシフトに入れてほしいと書かれています。"
ask:
  - "担当者が1名足りないときのコスト：1つの言語で30分間1名不足したときに顧客がつける値で、時給と同じ単位です。バージョンによって17または50です。この値で、お金を払ってシフトを入れる価値があるかどうかが決まります。"
  - "担当者は1回のシフト中、1言語だけで対応すること：バイリンガルの担当者でも2言語を同時に埋めることはできません。"
  - "正社員の契約上の労働時間：バージョンによって週32時間または40時間（シフト4回または5回）です。easy では誰もこれを超えて勤務しません。medium・hard ではシフトを1回多く勤務できますが、運営マネージャーの承認が必要で、時給の1.5倍を支払います。"
  - "パートの契約上の労働時間：バージョンによって週12時間または16時間（4時間シフト3回または4回）で、時間外勤務はありません。この時間は保証されており、シフトが少なくても契約上の労働時間分を全額支払います。"
  - "シフト間の休息：1つのシフトの終了から同じ担当者の次のシフト開始まで、11時間または13時間以上（バージョンによる）空けます。"
  - "特別な日があるかどうかです。あります。11月9日（月）から13日（金）までのいずれか1日（バージョンによる）が地域の祝日です。その日は予測値の25%または50%を切り上げた人数で計画します。予測ファイルには反映されていません。"
  - "新人の給与の扱いです。新人は研修期間の給与制で、電話対応に入るかどうかにかかわらず契約上の労働時間分を全額支払うため、新人のシフトを減らしても費用は減りません。"
  - "medium・hard：新人を1人だけで1言語に入れません。新人が勤務するすべての30分枠で、同じ言語に新人ではない担当者が少なくとも1名必要です。"
  - "hard：リーダーからの連絡がまだ正しいかどうかです。正しくありません。金曜日の朝に届いた診断書では、その担当者は11月11日（水）、12日（木）、13日（金）のいずれかまで病気休暇です。"
invalid_if:
  - "担当者を、本人の対応言語にない言語に配置しています。"
  - "正社員を4時間シフトに、パートを8時間シフトに入れているか、契約で認められた週のシフト回数（正社員は easy で4回または5回、medium・hard ではさらに1回。パートは3回または4回）を超えています。"
  - "同じ担当者の2つのシフトの間の休息が11時間または13時間に足りません（1日2回のシフトを含みます）。"
  - "承認済みの休暇日に誰かを配置しています。"
  - "medium・hard で、運営マネージャーの承認なしに正社員を契約上の労働時間を超えるシフトに入れています（ただし、会社の方針がこのルールを緩めることを認めていて、AIが先に顧客に例外を申請した場合は認められます）。または、新人が勤務する30分枠に、同じ言語の新人ではない担当者が1人もいません。"
  - "hard で、リーダーからの連絡に書かれた担当者を、診断書の最終日までのいずれかの日に配置しています。"
quality: "低いほど良い値です。枠・言語ごとに不足する担当者1名・30分につき17または50（バージョンによる）に、全シフトの人件費（時給は正社員22、パート18。パートと新人はシフトが少なくても契約上の労働時間分を全額。承認された時間外勤務は1.5倍）を加えたもので、すべて時給と同じ単位です。従来のやり方（0点）はスーパーバイザーが入電予測を見ずに作った固定のシフト表です。模範解答（1点）は、担当者1人ずつの1週間を組み直し、続いて2人1組でも組み直すことを、総コストが下がらなくなるまで繰り返します。知られている最良のシフト表は厳密な最適解で、スコアは1を数パーセント上回ります。"
tiers:
  easy: "中核となるシフト表です。シフトごとに1言語、雇用形態に合ったシフトの長さ、正社員とパートの契約上の労働時間（時間外勤務なし）、シフト間の休息、承認済みの休暇、地域の祝日、不足人数のコストを扱います。新人もほかの人と同じように配置でき、リーダーからの連絡の担当者は月曜日に復帰します。"
  medium: "時間外勤務（正社員は週にシフトを1回多く勤務できるが、運営マネージャーの承認が必要で1.5倍を支払う）と、新人を1人だけで1言語に入れないルールが加わります。"
  hard: "病欠の連絡が加わります。リーダーからの連絡はその担当者をいつもどおり配置するよう求めていますが、翌朝届いた診断書では、その担当者は11月11日（水）、12日（木）、13日（金）のいずれかまで病気休暇です。"
