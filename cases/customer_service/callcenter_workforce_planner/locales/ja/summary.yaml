# The case in plain words, shown at the top of its page.
task: "韓国語・日本語・英語・中国語・スペイン語で08:00〜22:00に電話を受けるコールセンターの、来週（2026年11月9日月曜日〜15日日曜日）のシフト表を作ります。AIは担当者30名それぞれについて、どの日にどのシフトでどの言語の電話を受けるかを決め、どの言語でも人数が足りて総コストが最も低いシフト表を `roster.json` として渡します。"
given:
  - "顧客の依頼：来週のシフト表を頼む数行の文で、「対応しているどの言語でもお客様をお待たせしないよう、電話に出られる人数を十分に確保したい」とあります。ルールや数値は書かれていません。"
  - "`オペレーター一覧.xlsx`：担当者30名（正社員20名、うち新人4名、パート10名）と、各自が対応できる言語です。"
  - "`入電予測.csv`：日ごとに、08:00〜22:00の30分枠ごと・言語ごとに必要な担当者数（1〜5名）です。入電件数ではなく、すでに人数に換算した値です。"
  - "`シフト.csv` と `人件費.csv`：正社員の8時間シフト4種（08:00、10:00、12:00、14:00開始）、パートの4時間シフト4種（08:00、12:00、16:00、18:00開始）と時給（正社員22、パート18、通貨単位なし）です。"
  - "`休暇一覧.csv`：休暇申請5件です。日付は日/月/年の順で、うち1件は却下されています。"
  - "`リーダーからの連絡.txt`：11月5日（木）に届いた連絡で、インフルエンザで病欠中の担当者が「月曜日には大丈夫」なので、いつもどおりシフトに入れてほしいと書かれています。"
ask:
  - "担当者が1名足りないときのコスト：1つの言語で30分間1名不足したときに顧客がつける値で、時給と同じ単位です。バージョンによって15、25、40のいずれかです。この値で、お金を払ってシフトを入れる価値があるかどうかが決まります。"
  - "担当者は1回のシフト中、1言語だけで対応すること：バイリンガルの担当者でも2言語を同時に埋めることはできません。"
  - "契約上の条件：正社員は8時間シフトのみ、パートは4時間シフトのみで、パートは週3回までです。正社員の契約上の労働時間は週32時間または40時間（シフト4回または5回）で、1回多い週5回または6回まで勤務できます。medium 以降はこの1回が時間外勤務で、時給の1.5倍です。"
  - "休暇一覧の日付の読み方：日/月/年の順（10/11/2026は10月11日ではなく11月10日）で、開始日と終了日の両方を含み、却下された申請は休暇ではありません。"
  - "シフト間の休息：easy では1日1回までを守るだけでよく、medium・hard では1つのシフトの終了から次のシフト開始まで11時間または13時間以上空けます。"
  - "medium・hard：11月11日（水）は地域の祝日です。その日は予測値の50%、60%、75%のいずれかを切り上げた人数で計画します。予測ファイルには反映されていません。"
  - "medium・hard：新人を1人だけで1言語に入れません。新人が勤務するすべての30分枠で、同じ言語に新人ではない担当者が少なくとも1名必要です。"
  - "hard：リーダーからの連絡がまだ正しいかどうかです。正しくありません。金曜日の朝に届いた診断書では、その担当者は11月10日（火）、11日（水）、12日（木）のいずれかまで病気休暇です。"
invalid_if:
  - "担当者を、本人の対応言語にない言語に配置しています。"
  - "正社員を4時間シフトに、パートを8時間シフトに入れているか、週のシフト回数の上限（正社員は5回または6回、パートは3回）を超えています。"
  - "1人に1日2回のシフトを入れているか、medium・hard で2つのシフトの間の休息が11時間または13時間に足りません。"
  - "承認済みの休暇日に誰かを配置しています。"
  - "medium・hard で、新人が勤務する30分枠に、同じ言語の新人ではない担当者が1人もいません。ただし、会社の方針がこの慣習を緩めることを認めていて、AIが先に顧客に例外を申請した場合は認められます。"
  - "hard で、リーダーからの連絡に書かれた担当者を、診断書の最終日までのいずれかの日に配置しています。"
quality: "低いほど良い値です。枠・言語ごとに不足する担当者1名・30分につき15、25または40（顧客が決める値）に、全シフトの人件費（時給は正社員22、パート18。medium 以降、時間外勤務は1.5倍）を加えたもので、すべて時給と同じ単位です。従来のやり方（0点）はスーパーバイザーが入電予測を見ずに作った固定のシフト表です。模範解答（1点）は、入れる価値のあるシフトがなくなるまで、コストを最も減らすシフトを1つずつ加えていきます。"
tiers:
  easy: "中核となるシフト表です。シフトごとに1言語、雇用形態に合ったシフトの長さ、週の上限、1日1回まで、承認済みの休暇、不足人数のコストを扱います。予測はそのまま使い、全シフトを通常の時給で計算し、新人もほかの人と同じように配置でき、リーダーからの連絡の担当者は月曜日に復帰します。"
  medium: "シフト間の11時間または13時間の休息、11月11日（水）の祝日（予測値の50%、60%、75%）、週32時間または40時間の契約上の労働時間を超える時間外勤務（1.5倍）、新人を1人だけで1言語に入れない慣習が加わります。"
  hard: "病欠の連絡が加わります。リーダーからの連絡はその担当者をいつもどおり配置するよう求めていますが、翌朝届いた診断書では、その担当者は11月10日（火）、11日（水）、12日（木）のいずれかまで病気休暇です。"
