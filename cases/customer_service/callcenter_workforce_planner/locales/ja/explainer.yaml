# The explainer's case texts in Japanese (English comes from case.yaml).
role: コールセンター要員計画担当
task_type: 組合せ最適化
deliverable_spec: |
  roster.json = {"assignments": [{"agent": "<担当者ID、例: A01>", "day": "YYYY-MM-DD (2026-11-09 .. 2026-11-15)",
                                  "shift": "<シフト一覧のシフトコード、例: S0800 または P1600>",
                                  "language": "<このシフトで担当者が電話対応する言語: ko | ja | en | zh | es>"}, ...]}
  担当者が勤務するシフト1回につき1件です。IDはデータのとおりに記載し、言語はASCIIコードで記載します
  （ko = 韓国語、ja = 日本語、en = 英語、zh = 中国語、es = スペイン語）。
tiers:
  easy: >-
    要員配置の中核となる問題です。担当者はシフトごとに1言語（本人の対応言語のうち1つ）だけで対応し、正社員は8時間、パートは4時間のシフトに、それぞれの契約上の労働時間の範囲で入ります（今回は時間外勤務なし）。同じ担当者の2つのシフトの間の休息時間、承認済みの休暇（日付は日/月/年で記載、却下された申請は休暇ではない）、週のうち1日の地域の祝日（予測値の一定割合を切り上げ）を守り、不足した担当者1名を人件費と比べて値付けする人員不足のコストで評価します（シフトごとの支払いだが、パートの保証時間と新人の研修期間の給与は全額支払う）。時間外勤務と新人の組み合わせは今回の範囲外で、リーダーからの連絡に書かれた担当者は連絡のとおり月曜日に復帰します。
  medium: >-
    easy に加えて、時間外勤務（正社員は契約上の労働時間を超えて週にシフトを1回多く勤務できるが、運営マネージャーの承認が必要で時給の1.5倍を支払う。承認された例外で緩められる業務上のルール）と、新人の組み合わせのルール（新人を1人だけで1言語に入れない）が適用されます。リーダーからの連絡に書かれた担当者は月曜日に復帰します。
  hard: >-
    medium に加えて、日付の決まった病欠の連絡があります。木曜日のリーダーからの連絡はその担当者をいつもどおり配置するよう求めていますが、顧客が金曜日の朝に受け取った診断書では、その担当者は週の初めの数日間病気休暇です。その期間に1日でも配置するとルール違反です。
rules:
  skill_valid: 担当者は自分の対応言語に記載された言語でのみ電話対応します。
  shift_type: 正社員は8時間シフトのみ、パートは4時間シフトのみ勤務します。
  max_shifts: 正社員は週{{ft_max_shifts}}回まで、パートは週{{pt_max_shifts}}回まで勤務します。
  min_rest: 1つのシフトの終了から同じ担当者の次のシフト開始まで、{{min_rest}}時間以上空けます（そのため1日1回まで）。
  leave_respected: 承認済みの休暇日には誰も配置しません。
  overtime_approval: 時間外勤務はあらかじめ計画しません。正社員が契約上の{{ft_regular_shifts}}回を超えて入るシフトには運営マネージャーの承認が必要です。
  buddy_rule: 新人が電話に出ているときは常に、同じ時間・同じ言語に新人ではない担当者が少なくとも1名います。
  sick_leave: リーダーからの連絡に書かれた担当者は、診断書の最終日である{{sick_until}}まで、どの日にも配置しません。
shortcuts:
  one_shift: ルールを最小限だけ守る：1週間にシフト1回だけ（最初の担当者、その最初のシフトと最初の言語）。
  fixed_rota: 顧客自身の固定シフト表をそのまま写す（ベースライン）。
  fixed_rota_no_new_hires: 固定シフト表を1か所だけ変える：新人は電話に出ない。
  fixed_rota_peak: 固定シフト表を1か所だけ変える：全員が10:00（正社員）または12:00（パート）のシフト。
  same_shift_all_week: 定数の出力：新人以外の担当者全員が、月曜日から契約上の回数だけ、雇用形態の最初のシフトと最初の言語で勤務。
  part_timers_only: 目的関数の算術を突く：30分あたり最も安いパートだけを配置（正社員なしで動かした参照プランナー）。
  one_day_only: 一部だけのシフト表：参照プランナーの月曜日の分だけで、ほかの6日は誰もいない。
  weekdays_only: 一部だけのシフト表：参照プランナーの月曜日から金曜日までの分だけで、週末は誰もいない。
  no_new_hires: 新人ルールを形だけ守る：参照プランナーのシフト表から新人を外し、電話対応に入れない。
  one_shift_each: ルールを最低限だけ守る：参照プランナーで全員を週1回のシフトにする。
  literal_plus_max_shifts: 文字どおりの解にルールを1つ足す：依頼どおりに作り、正社員とパートの週の上限だけ守る。
  literal_plus_min_rest: 文字どおりの解にルールを1つ足す：依頼どおりに作り、シフト間の休息時間だけ守る。
  literal_plus_buddy_rule: 文字どおりの解にルールを1つ足す：依頼どおりに作り、新人を1人だけで1言語に入れない。
  literal_plus_overtime_approval: 文字どおりの解にルールを1つ足す：依頼どおりに作り、正社員が契約上の労働時間を超えない。
  literal_plus_sick_leave: 文字どおりの解にルールを1つ足す：依頼どおりに作り、診断書の病気休暇の日を避ける。
