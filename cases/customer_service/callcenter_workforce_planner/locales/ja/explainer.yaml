# The explainer's case texts in Japanese (English comes from case.yaml).
role: コールセンター要員計画担当
task_type: 組合せ最適化
deliverable_spec: |
  roster.json = {"assignments": [{"agent": "<担当者ID、例: A01>", "day": "YYYY-MM-DD (2026-11-09 .. 2026-11-15)",
                                  "shift": "<シフト一覧のシフトコード、例: S0800 または P1600>",
                                  "language": "<このシフトで担当者が電話対応する言語: ko | ja | en | zh | es>"}, ...]}
  担当者が勤務するシフト1回につき1件です。IDはデータのとおりに記載し、言語はASCIIコードで記載します
  （ko = 韓国語、ja = 日本語、en = 英語、zh = 中国語、es = スペイン語）。
tiers:
  easy: >-
    要員配置の中核となる問題です。担当者はシフトごとに1言語（本人の対応言語のうち1つ）だけで対応し、正社員は8時間、パートは4時間のシフトに週の上限内で入ります。シフトは1日1回まで、承認済みの休暇（日付は日/月/年で記載、却下された申請は休暇ではない）は守り、不足した担当者1名を人件費と比べて値付けする人員不足の重みで評価します。水曜日の祝日、時間外手当、休息時間、新人の組み合わせは今回の範囲外で、リーダーからの連絡に書かれた担当者は連絡のとおり月曜日に復帰します。
  medium: >-
    easy に加えて、同じ担当者の2つのシフトの間の休息時間、11月11日（水）の地域の祝日（予測値の一定割合を切り上げ）、正社員の週の契約上の労働時間を超える時間外勤務（時給の1.5倍）、新人の組み合わせの慣行（新人を1人だけで1言語に入れない）が適用されます。リーダーからの連絡に書かれた担当者は月曜日に復帰します。
  hard: >-
    medium に加えて、日付の決まった病欠の連絡があります。木曜日のリーダーからの連絡はその担当者をいつもどおり配置するよう求めていますが、顧客が金曜日の朝に受け取った診断書では、その担当者は週の初めの数日間病気休暇です。その期間に1日でも配置するとルール違反です。
rules:
  skill_valid: 担当者は自分の対応言語に記載された言語でのみ電話対応します。
  one_shift_a_day: 担当者のシフトは1日1回までです。
  min_rest: 1つのシフトの終了から同じ担当者の次のシフト開始まで、{{min_rest}}時間以上空けます（そのため1日1回まで）。
  shift_type: 正社員は8時間シフトのみ、パートは4時間シフトのみ勤務します。
  max_shifts: 正社員は週{{ft_max_shifts}}回まで、パートは週3回まで勤務します。
  leave_respected: 承認済みの休暇日には誰も配置しません。
  sick_leave: リーダーからの連絡に書かれた担当者は、診断書の最終日である{{sick_until}}まで、どの日にも配置しません。
  buddy_rule: 新人が電話に出ているときは常に、同じ時間・同じ言語に新人ではない担当者が少なくとも1名います。
