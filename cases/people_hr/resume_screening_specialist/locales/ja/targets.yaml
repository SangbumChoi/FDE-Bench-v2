- id: shortlist_size
  text: ショートリストは各職種ちょうど8名（合計24名）で、職種ごとに1〜8の順位をつけます。
- id: must_haves
  text: "必須要件は足切り条件です。R1 は Python と SQL、R2 は SQL と統計学、R3 はネットワークセキュリティ、SIEM、有効な CISSP または CompTIA Security+ が必要で、求人票のその他のスキルは歓迎条件にすぎません。"
- id: relevant_experience
  text: 職種分類が合う職歴だけを数えます（R1 ソフトウェア開発、R2 データ分析、R3 情報セキュリティ）。開始月と終了月を両方含め、「現在」は2026年10月までとし、最低ラインは36・24・24か月です。総経験年数は使いません。
- id: certificate_expiry
  text: 資格は有効期限が2026年11月1日以降の場合のみ有効で、期限切れの資格は R3 の必須要件にも加点にもなりません。
- id: work_authorization
  text: R1 と R3 はすでに就労資格があることが条件のため、ビザスポンサーが必要な候補者は対象外です。R2 は EOR 経由のリモート勤務なのでこの条件はありません。
- id: one_role_only
  text: 候補者は最大1職種のショートリストにしか載せられません。
- id: past_hire_bias
  text: 過去採用データの入社1年後評価点は活躍度の手がかりですが、管理職が男性・若手・シンガポール国籍を高く評価していたため、職務に関係する項目だけから学習する必要があります。
- id: adverse_impact
  text: 性別・年齢層・国籍や、卒業年・言語・居住地などの代理項目を順位付けに使ってはいけません。有資格者のうち15名以上の性別、40歳未満/以上、シンガポール/その他国籍の各集団は、最高集団の通過率の0.8倍以上が必要で、1名分の許容があります。
- id: referral_habit
  text: 応募職種の必須要件をすべて満たす紹介候補者は必ずその職種のショートリストに入れます。要件を満たさない紹介候補者は優遇しません。
