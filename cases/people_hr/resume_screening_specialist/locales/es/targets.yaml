- id: shortlist_size
  text: La preselección tiene exactamente 8 candidatos por puesto (24 en total), ordenados del 1 al 8 dentro de cada puesto.
- id: must_haves
  text: "Los requisitos imprescindibles son un filtro estricto: R1 Python y SQL; R2 SQL y estadística; R3 seguridad de redes, SIEM y un CISSP o CompTIA Security+ vigente. Las demás habilidades de las descripciones solo son deseables."
- id: relevant_experience
  text: Solo cuentan los empleos del área profesional correspondiente (desarrollo de software para R1, análisis de datos para R2, seguridad de la información para R3), con el mes de inicio y el de fin incluidos y "actualidad" hasta octubre de 2026; los mínimos son 36, 24 y 24 meses; no debe usarse anios_experiencia_total.
- id: certificate_expiry
  text: Un certificado solo cuenta si vence el 1 de noviembre de 2026 o después; los vencidos no sirven ni para el requisito de R3 ni como mérito.
- id: work_authorization
  text: R1 y R3 exigen permiso de trabajo previo, así que quedan fuera los candidatos que requieren patrocinio de visado; R2 es remoto a través de un EOR y no tiene ese requisito.
- id: one_role_only
  text: Cada candidato puede aparecer, como máximo, en la preselección de un único puesto de los tres.
- id: past_hire_bias
  text: La puntuacion_desempeno_1a de las contrataciones previas es la señal de un buen fichaje, pero los responsables puntuaban mejor a hombres, personal joven y singapurenses; las columnas demográficas no deben ser entradas de la puntuación de cribado, pero pueden usarse para medir y eliminar ese sesgo de las puntuaciones pasadas.
- id: adverse_impact
  text: El género, el rango de edad, la nacionalidad y sustitutos como el año de graduación, los idiomas o la ubicación no pueden influir en el orden; entre los cualificados, un grupo de género, menores de 40/40 o más o Singapur/otras con al menos 15 personas solo suspende si su tasa de selección es inferior a 0,8 veces la del grupo más alto y una prueba exacta de Fisher bilateral frente a ese grupo da p < 0,05.
- id: referral_habit
  text: Todo referido que cumpla todos los requisitos imprescindibles de un puesto al que se presentó debe estar en esa preselección; los referidos no cualificados no tienen preferencia.
