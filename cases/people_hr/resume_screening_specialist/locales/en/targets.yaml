- id: shortlist_size
  kind: missing
  domain: business rule
  text: The shortlist has exactly 8 candidates per role (24 in total), ranked 1 to 8 within each role.
- id: must_haves
  kind: ambiguous
  domain: business rule
  text: "Must-haves are a hard filter: R1 Python and SQL; R2 SQL and statistics; R3 network security, SIEM and a valid CISSP or CompTIA Security+. All other job-description skills are only nice-to-have."
- id: relevant_experience
  kind: ambiguous
  domain: calculation
  text: Only jobs in the matching job_family count (software engineering for R1, data analytics for R2, information security for R3), with start and end month inclusive and "present" up to October 2026; minimums are 36, 24 and 24 months; total_years_experience must not be used.
- id: certificate_expiry
  kind: missing
  domain: data semantics
  text: A certificate counts only if it expires on 1 November 2026 or later; expired ones count neither for the R3 must-have nor as a plus.
- id: work_authorization
  kind: missing
  domain: business rule
  text: R1 and R3 require existing work authorization, so candidates who need visa sponsorship are excluded there; R2 is remote through an employer of record and has no such requirement.
- id: one_role_only
  kind: missing
  domain: business rule
  text: A candidate may appear on at most one role's shortlist.
- id: past_hire_bias
  kind: ambiguous
  domain: data semantics
  text: performance_score_1y in the past hires is the signal of a strong hire, but managers rated men, younger staff and Singaporeans higher, so only the job-related columns should be learned from.
- id: adverse_impact
  kind: missing
  domain: scoring
  text: Gender, age band, nationality and stand-ins such as graduation year, languages or location must not drive the ranking; among qualified candidates every gender, under-40/40-and-over and Singapore/other group of at least 15 must reach 0.8 times the top group's selection rate, with a one-person tolerance.
- id: referral_habit
  kind: missing
  domain: business rule
  text: Every referred candidate who meets all must-haves of a role they applied to must be on that role's shortlist; unqualified referrals get no preference.
