- id: shortlist_size
  text: 쇼트리스트는 직무별로 정확히 8명(총 24명)이며, 직무 안에서 1부터 8까지 순위를 매깁니다.
- id: must_haves
  text: "필수 요건은 하드 필터입니다. R1은 Python과 SQL, R2는 SQL과 통계학, R3는 네트워크 보안, SIEM, 유효한 CISSP 또는 CompTIA Security+가 필요하며, 직무기술서의 다른 기술은 모두 우대 사항일 뿐입니다."
- id: relevant_experience
  text: 직무분야가 맞는 경력만 셉니다(R1 소프트웨어 개발, R2 데이터 분석, R3 정보보안). 시작 월과 종료 월을 모두 포함하고 '재직중'은 2026년 10월까지 계산하며, 최소 기준은 36, 24, 24개월입니다. 총경력연수는 쓰면 안 됩니다.
- id: certificate_expiry
  text: 자격증은 만료일이 2026년 11월 1일 이후인 경우에만 인정되며, 만료된 자격증은 R3 필수 요건으로도 우대 사항으로도 인정되지 않습니다.
- id: work_authorization
  text: R1과 R3는 이미 취업 자격이 있어야 하므로 비자 스폰서가 필요한 후보자는 제외되고, R2는 EOR을 통한 원격 근무라 이 요건이 없습니다.
- id: one_role_only
  text: 한 후보자는 최대 한 직무의 쇼트리스트에만 오를 수 있습니다.
- id: past_hire_bias
  text: 과거 채용 데이터의 1년차성과점수가 우수 인재의 근거이지만, 관리자들이 남성, 젊은 직원, 싱가포르 국적자에게 높은 점수를 주었으므로 직무 관련 항목에서만 학습해야 합니다.
- id: adverse_impact
  text: 성별, 연령대, 국적과 졸업연도, 구사언어, 거주지 같은 대리 항목은 순위에 영향을 주면 안 됩니다. 자격 있는 후보자 중 15명 이상인 성별, 40세 미만/이상, 싱가포르/기타 국적 집단은 최고 집단 선발률의 0.8배 이상이어야 하며 1인 허용 범위가 있습니다.
- id: referral_habit
  text: 지원한 직무의 필수 요건을 모두 충족한 추천 후보자는 반드시 그 직무 쇼트리스트에 올라야 하며, 자격 미달 추천자에게는 우대가 없습니다.
