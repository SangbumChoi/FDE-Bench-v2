# The explainer's case texts in Korean (English comes from case.yaml).
role: 서류 심사 전문가
task_type: 순위 매기기
deliverable_spec: |
  shortlist.csv, ASCII 헤더는 role_id,candidate_id,rank
  명단에 오른 후보자와 직무마다 한 행이며, role_id와 candidate_id는 데이터와 똑같이 적습니다(예: R2, C017).
  rank = 그 직무의 명단 안에서의 순위이며, 1 = 가장 우수, 연속된 정수입니다.
rules:
  must_have_skills: 명단에 오른 모든 후보자는 해당 직무의 필수 요건을 충족합니다. 필수 기술 두 가지, 최소 관련 경력(R1 소프트웨어 개발 36개월, R2 데이터 분석 24개월, R3 정보보안 24개월), 그리고 R3는 2026-11-01에 유효한 CISSP 또는 CompTIA Security+ 자격증입니다.
  work_authorization: R1과 R3 후보자는 이미 취업 자격이 있어야 합니다(비자 스폰서가 필요 없어야 함). 법적 요건입니다.
  one_role_per_candidate: 한 후보자는 최대 한 직무의 명단에만 오릅니다.
  adverse_impact: 지원한 직무 중 하나 이상에 자격을 갖춘 후보자 가운데, 자격 있는 후보자가 15명 이상인 성별·연령대·국적 집단은 어느 것도 선발률이 그 속성에서 가장 높은 집단의 0.8배 미만이면서 그 집단과의 차이가 양측 피셔 정확 검정에서 유의(p < 0.05)해서는 안 됩니다(법적 요건이며, 보호 속성이 순위를 좌우해서는 안 됩니다).
  referral_boost: 지원한 직무에 자격을 갖춘 추천 후보자는 모두 (그런 직무 중 하나의) 명단에 오릅니다.
