- id: shortlist_size
  text: 每个岗位正好 8 位候选人（共 24 人），岗位内按 1 到 8 排名。
- id: must_haves
  text: 必备条件是硬性筛选：R1 需 Python 和 SQL；R2 需 SQL 和统计学；R3 需网络安全、SIEM 以及有效的 CISSP 或 CompTIA Security+。职位说明中的其他技能都只是加分项。
- id: relevant_experience
  text: 只统计岗位类别对应的工作（R1 软件开发、R2 数据分析、R3 信息安全），开始月和结束月都算，"至今"算到 2026 年 10 月；最低要求分别为 36、24、24 个月；不能使用总工作年限。
- id: certificate_expiry
  text: 证书到期日期在 2026 年 11 月 1 日或之后才算数；过期证书既不满足 R3 必备条件，也不算加分。
- id: work_authorization
  text: R1 和 R3 要求已有工作许可，需要公司担保签证的候选人不能入选；R2 通过雇佣代理机构远程工作，没有这项要求。
- id: one_role_only
  text: 每位候选人最多只能出现在一个岗位的名单上。
- id: past_hire_bias
  text: 历史录用数据中的一年绩效分是判断优秀员工的依据，但主管给男性、年轻员工和新加坡籍员工打分偏高；人口属性字段不得作为筛选评分的输入，但可以用来衡量并剔除历史分数中的这种偏差。
- id: adverse_impact
  text: 性别、年龄段、国籍以及毕业年份、语言、所在地等替代字段都不能影响排序；在合格候选人中，性别、40 岁以下/40 岁及以上、新加坡/其他国籍中人数不少于 15 的群体，只有在入选率低于最高群体的 0.8 倍、且与该群体的双侧 Fisher 精确检验 p < 0.05 时才判为未通过。
- id: referral_habit
  text: 满足所应聘岗位全部必备条件的被推荐人必须进入该岗位名单；不合格的被推荐人没有优待。
