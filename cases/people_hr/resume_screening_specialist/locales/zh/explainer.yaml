# The explainer's case texts in Simplified Chinese (English comes from case.yaml).
role: 简历筛选专员
task_type: 排序
deliverable_spec: |
  shortlist.csv，ASCII 表头为 role_id,candidate_id,rank
  每位入选候选人及其岗位占一行；role_id 和 candidate_id 与数据完全一致（如 R2、C017）；
  rank = 在该岗位名单中的名次，1 = 最强，为连续整数。
rules:
  must_have_skills: 每位入选者都满足所在岗位的必备条件：两项必备技能、最低相关经验（R1 软件开发 36 个月，R2 数据分析 24 个月，R3 信息安全 24 个月），R3 还须持有在 2026-11-01 有效的 CISSP 或 CompTIA Security+ 证书。
  work_authorization: R1 和 R3 的候选人必须已有工作许可（不需要公司担保签证）；这是法律要求。
  one_role_per_candidate: 每位候选人最多出现在一个岗位的名单上。
  adverse_impact: 在对至少一个所应聘岗位合格的候选人中，合格人数不少于 15 的任何性别、年龄段或国籍群体，都不得同时出现入选率低于该属性最高群体的 0.8 倍、且与该群体的差距经双侧 Fisher 精确检验显著（p < 0.05）的情况（法律要求；受保护属性不得左右排序）。
  referral_boost: 每位对所应聘岗位合格的被推荐人都已入选（进入其中一个这样的岗位的名单）。
