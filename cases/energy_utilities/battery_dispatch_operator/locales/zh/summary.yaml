# The case in plain words, shown at the top of its page.
task: "西班牙一座光储电站（储能电池 40 MWh、20 MW，与 30 MWp 光伏电站共用一个并网点和一块电表）的储能电池调度员，需要一份下周即 2027年3月22日（周一）至28日（周日）的计划：电池什么时候充电、什么时候放电才能赚最多的钱。AI 提交一份文件 `dispatch.csv`，按当地时间给出整周 668 个 15 分钟时段各自的充电功率和放电功率（MW）。"
given:
  - "客户的需求：排一下下周电池什么时候充电、什么时候放电，“尽量多赚钱”。需求里只提到五个附件，没有提任何上限或规定。"
  - "`电价预测.csv`：整周逐小时的市场电价预测（欧元/MWh），共 167 小时，因为 3月28日只有 23 小时。计划按本周实际电价结算，实际电价与预测不同。"
  - "`光伏出力预测.csv`：整周每个 15 分钟时段光伏电站的平均出力（MW，668 行），晴天中午可达 30 MW。"
  - "`电池规格.csv`：容量 40 MWh，充电、放电功率各 20 MW，往返效率 84.6%，厂家允许的荷电状态 5%-95%，同站光伏装机容量 30 MWp。"
  - "`并网协议.md`：2024 年并网协议摘要：上网最多 30 MW，下网最多 20 MW，光伏与电池合并计量，超过上限的光伏自动限发，所有时间均为当地时间。其中 30 MW 已经过时。"
  - "`上周调度记录.csv`：上周（3月15日至21日，672 个 15 分钟时段）的充电功率、放电功率和荷电状态。它是按上周的数值排的，其中一些数值本周已经变了。"
ask:
  - "84.6% 的往返效率如何分到充电和放电两个方向：随版本不同，为充电 92%、放电 92%，95% 和 89%，或 90% 和 94%。它决定每个时段存进或消耗多少电量。"
  - "质保要求任何时刻都保持的荷电状态范围：40 MWh 的 10%-90%、15%-85% 或 5%-95%（规格表只给出厂家允许的 5%-95%）。另外，整周以 50% 开始，结束时不得低于 50%、40% 或 30%（随版本不同）。"
  - "当前的上网上限：因变电站施工，协议的 30 MW 下调为 18 MW、15 MW 或 12 MW。电池放电时，（光伏 + 放电 − 充电）不得超过这个上限；超过上限的光伏会被限发浪费掉，除非电池把它充进去。"
  - "按 15 分钟结算（每小时的电价适用于该小时的 4 个时段），所有时间都是当地时间，3月28日（周日）夏令时开始：那天没有 02:00-02:45，所以计划正好 668 行。"
  - "“多赚钱”的含义：场站上网收入减去从电网取电的费用，再减去光伏单独运行本来能赚的钱，上网电量只算到上网上限为止。"
  - "medium 和 hard：什么时候可以从电网取电（充电功率超过光伏出力）：随版本不同，只允许在 00:00-05:45、01:00-04:45 或 02:00-07:45 开始的时段。easy 中任何时候都可以取电，最多 20 MW。"
  - "medium 和 hard：傍晚的应急备用（每天 16:00-20:00、17:00-21:00 或 18:00-22:00 之间荷电状态保持在 15%、20% 或 30% 以上）以及损耗成本（每 MWh 充电量加放电量 5、15 或 25 欧元）。"
  - "hard：文件里没有的三份通知。变电站施工提前完工，从 3月24日（周三）、26日（周五）或 27日（周六）起恢复 30 MW；配电公司（DSO）在 3月23日（周二）、25日（周四）或 27日（周六）18:00 到 21:00 把上网限制为 10 MW、8 MW 或 5 MW；电池在 3月22日（周一）、24日（周三）或 26日（周五）08:00 到 20:00 停运。交易部门要求在晚高峰把应急备用也卖掉，这需要获批的例外。"
invalid_if:
  - "不是整周 668 个 15 分钟时段每段正好一行：例如出现了因夏令时并不存在的 3月28日 02:00-02:45 行，或者缺少、重复某个时间。"
  - "按客户的分方向效率计算，荷电状态在任何时刻超出质保范围，或者整周结束时低于规定的数值。"
  - "功率为负或超过 20 MW，同一时段既充又放，从电网取电超过 20 MW，或者在 medium 和 hard 中于低谷下网时段以外从电网取电。"
  - "电池放电时上网功率超过上网上限：12 MW、15 MW 或 18 MW；hard 中施工结束后为 30 MW，配电公司限制的傍晚时段为 5 MW、8 MW 或 10 MW。"
  - "medium 和 hard 中，在应急备用时段荷电状态低于傍晚的应急备用；但公司政策允许例外且 AI 事先向客户申请了例外的除外。"
  - "hard 中，在电池因逆变器检修停运的 08:00 到 20:00 期间充电或放电。"
quality: "整周电池利润（欧元）越高越好：按本周实际电价（AI 只看到预测）计算，场站上网收入（只算到上网上限）减去从电网取电的费用和光伏单独运行本来能赚的钱，medium 和 hard 还要减去每 MWh 充电量加放电量的损耗成本。客户原来的做法（记 0 分）是电池整周停在 50% 不动，赚 0 欧元，所以计划赚到参考答案一半的利润就得 0.5 分；参考答案（记 1 分）按预测电价执行一条简单的每日规则（在最便宜的夜间时段充电、在早高峰卖出，在最便宜的白天时段再充满并始终吸收被限发的光伏，在晚高峰卖出），随版本不同约赚 6,000 到 26,000 欧元。"
tiers:
  easy: "核心计划：分方向效率、质保荷电状态范围、整周结束时的荷电状态、下调后的上网上限和夏令时切换。任何时候都可以从电网取电，没有傍晚应急备用，也不计损耗成本。"
  medium: "加上客户的运行规定：只能在低谷时段从电网取电、傍晚应急备用，以及每 MWh 5、15 或 25 欧元的损耗成本。"
  hard: "加上三份带日期的通知（从某天起上网上限恢复 30 MW、某个傍晚配电公司的更低上限、某天 08:00 到 20:00 电池停运），以及交易部门要求在晚高峰卖掉应急备用的压力，这只有获批的例外才允许。"
