- id: efficiency
  text: 效率按方向分别计算，充电 {{eta_charge_pct}}%、放电 {{eta_discharge_pct}}%（不是把规格表的 84.6% 往返效率平均分到两个方向）；以 P MW 充电一个时段增加 0.25*P*{{eta_charge}} MWh，放电 P MW 减少 0.25*P/{{eta_discharge}} MWh。
- id: soc_window
  text: 质保要求荷电状态任何时刻都在 {{soc_min}}% 到 {{soc_max}}%（{{soc_min_mwh}}-{{soc_max_mwh}} MWh）之间，比厂家的 5%-95% 更窄。
- id: end_soc
  text: 整周结束时荷电状态必须不低于 {{end_soc}}%（{{end_soc_mwh}} MWh）（整周以 50% 开始）。
- id: export_cap
  text: 上网上限临时为 {{export_cap}} MW（不是协议里的 30 MW）；放电时光伏 + 放电 − 充电 不得超过 {{export_cap}} MW，光伏超过 {{export_cap}} MW 的部分会被限发，除非电池充进去。
- id: grid_charging
  text: 从电网取电（充电功率大于光伏出力）只能在当地时间 {{import_from}}-{{import_last}} 开始的时段，最多 20 MW；用光伏充电任何时候都可以。
- id: reserve_level
  text: 公司规定每天傍晚备用时段内，电池都要保留至少 {{reserve_pct}}%（{{reserve_mwh}} MWh）的电量作为应急备用。
- id: reserve_hours
  text: 傍晚应急备用适用于每天当地时间 {{reserve_from}} 到 {{reserve_to}} 之间的任何时刻。
- id: degradation
  text: 计量点每充进加放出 1 MWh，计 {{degradation}} 欧元的损耗成本，从利润中扣除。
- id: works_end
  text: 变电站施工提前完工：{{export_cap}} MW 的上限只到 {{works_end}} 00:00，之后恢复协议规定的 30 MW。
- id: dso_day
  text: 由于线路施工，配电公司在 {{dso_day}} 18:00 到 21:00 限制场站上网。
- id: dso_limit
  text: 配电公司限制的时段内场站上网最多 {{dso_mw}} MW：这段时间电池放电时，光伏 + 放电 − 充电 不得超过 {{dso_mw}} MW。
- id: maintenance_outage
  text: '{{outage_day}} 08:00 到 20:00 电池因逆变器检修停运：这些时段内不能充电也不能放电。'
