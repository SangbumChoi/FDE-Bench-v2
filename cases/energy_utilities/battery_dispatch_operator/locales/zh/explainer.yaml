# The explainer's case texts in Simplified Chinese (English comes from case.yaml).
role: 储能电池调度员
task_type: 组合优化
deliverable_spec: |
  dispatch.csv，ASCII 表头：timestamp,charge_mw,discharge_mw
  2027-03-22 00:00 .. 2027-03-28 23:45 这一周每个 15 分钟时段一行，使用当地时间；timestamp = 时段开始时间，
  格式为 "YYYY-MM-DD HH:MM"。charge_mw / discharge_mw = 该时段内电池在计量点的平均功率（MW），两者均 >= 0。
tiers:
  easy: 核心问题：质保荷电状态范围、功率限制、分方向效率、整周结束时的荷电状态、修订后的上网上限（低于存档的协议）以及夏令时切换。本轮场站任何时候都可以从电网取电，没有傍晚应急备用，也不计损耗成本。
  medium: 在 easy 的基础上加上客户的运行规定：只能在低谷时段从电网取电、傍晚应急备用（比例和时段）以及每 MWh 吞吐量的损耗成本。
  hard: 在 medium 的基础上加上三份带日期的通知：变电站施工提前完工，从某天起恢复协议的 30 MW；配电公司在某个傍晚限制场站上网；某天 08:00 到 20:00 电池因逆变器检修停运。交易部门还要求在晚高峰动用应急备用，这只有获批的例外才允许。
rules:
  complete_plan: "dispatch.csv 按当地时间为本周 668 个 15 分钟时段各给出一行，在切换夏令时跳过的钟点（3月28日 02:00-02:45）没有功率。"
  soc_limits: 荷电状态任何时刻都在 40 MWh 的 {{soc_min}}%-{{soc_max}}% 之间（充电效率 {{eta_charge_pct}}%，放电效率 {{eta_discharge_pct}}%）。
  power_limits: 充电和放电各在 0 到 20 MW 之间，同一时段不能既充又放；下网不超过 20 MW。
  export_cap: 变电站施工期间，电池放电时场站上网功率（光伏 + 放电 − 充电）不得超过修订后的 {{export_cap}} MW 上限。
  grid_charging_window: 场站只能在当地时间 {{import_from}}-{{import_last}} 开始的时段从电网取电（充电功率超过光伏出力）。
  end_soc: 整周以 50% 荷电状态开始，结束时不得低于 {{end_soc}}%。
  evening_reserve: 每天当地时间 {{reserve_from}} 到 {{reserve_to}} 之间的任何时刻，荷电状态都不低于 {{reserve_pct}}%。
  dso_limit: '{{dso_day}} 18:00 到 21:00，电池放电时场站上网功率不得超过配电公司规定的 {{dso_mw}} MW。'
  maintenance_outage: '{{outage_day}} 08:00 到 20:00 电池既不充电也不放电（逆变器检修）。'
shortcuts:
  literal_plus_soc_limits: "照字面做的计划，只守住它违反的一条规则 soc_limits：只问了这一条事实，其余照文件读。"
  literal_plus_export_cap: "照字面做的计划，只守住它违反的一条规则 export_cap：只问了这一条事实，其余照文件读。"
  literal_plus_end_soc: "照字面做的计划，只守住它违反的一条规则 end_soc：只问了这一条事实，其余照文件读。"
  literal_plus_grid_charging_window: "照字面做的计划，只守住它违反的一条规则 grid_charging_window：只问了这一条事实，其余照文件读。"
  literal_plus_evening_reserve: "照字面做的计划，只守住它违反的一条规则 evening_reserve：只问了这一条事实，其余照文件读。"
  literal_plus_dso_limit: "照字面做的计划，只守住它违反的一条规则 dso_limit：只问了这一条事实，其余照文件读。"
  literal_plus_maintenance_outage: "照字面做的计划，只守住它违反的一条规则 maintenance_outage：只问了这一条事实，其余照文件读。"
  last_week_settings: "用上周的设置排计划（也就是排出上周记录的设置）：10-90%、两个方向各 92%、结束时 50%、17:00-21:00 保留 20% 备用、00:00-06:00 下网、上网上限 25 MW。"
  last_week_settings_plus_cap: "上周的设置，只问了文件自己标明已过时的那一条：本周的上网上限。"
  copy_last_week: "照搬数据：把上周的计划按相同的星期几和钟点逐个时段重复一遍。"
  planner_before_the_cut: "照搬客户的做法只改一处：上网上限下调之前的排程程序（夜间充电不给中午的光伏留空间）。"
  planner_without_buffer: "照搬客户的做法只改一处：排程程序不再在荷电状态限值内留 1% 的余量。"
  planner_sells_reserve: "照搬客户的做法只改一处：备用时段结束后，排程程序把备用电量也卖掉。"
  idle: "什么都不做：电池整周停在 50%，光伏电站单独卖电。"
  solar_only: "从不从电网取电：其他事实都对，只用光伏充电的最优计划。"
  no_end_target: "周末前全部卖光：其他事实都对，但没有整周结束时的电量要求的最优计划。"
  stale_agreement: "上网上限照文件来：其他事实都对，整周用协议的 30 MW。"
  clock_naive: "忽略夏令时：按 672 个时段的钟点排的最优计划，周日 02:00-02:45 也在充电。"
  planner_reserve_in_hours: "照搬客户的做法只改一处：备用只在备用时段内保留，而不是全天保留。"
  planner_two_changes: "照搬客户的做法，去掉两个代价最高的习惯：1% 的余量和全天保留的备用。"
  solar_surplus_only: "只做最少的事：只存控制器本来要削掉的光伏，在傍晚最贵的时段卖掉。"
  same_day_every_day: "交一个常量：最优计划的周二，按钟点原样重复到一周的每一天。"
