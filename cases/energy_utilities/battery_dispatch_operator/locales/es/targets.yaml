- id: efficiency
  text: La eficiencia se modela por sentido, un {{eta_charge_pct}} % en la carga y un {{eta_discharge_pct}} % en la descarga (no el 84,6 % de ida y vuelta de la ficha repartido a partes iguales); cargar P MW durante un cuarto de hora añade 0,25*P*{{eta_charge}} MWh y descargar P MW retira 0,25*P/{{eta_discharge}} MWh.
- id: soc_window
  text: La garantía exige un estado de carga entre el {{soc_min}} % y el {{soc_max}} % (de {{soc_min_mwh}} a {{soc_max_mwh}} MWh) en todo momento, un margen más estrecho que el 5 %-95 % del fabricante.
- id: end_soc
  text: La semana debe terminar con un estado de carga del {{end_soc}} % ({{end_soc_mwh}} MWh) o más (empieza al 50 %).
- id: export_cap
  text: El límite de vertido es temporalmente de {{export_cap}} MW (no los 30 MW del contrato); mientras se descarga, solar + descarga − carga no puede superar {{export_cap}} MW, y la solar por encima de {{export_cap}} MW se recorta salvo que la batería la absorba.
- id: grid_charging
  text: Tomar energía de la red (cargar más que la producción solar) solo se permite en los cuartos de hora que empiezan entre las {{import_from}} y las {{import_last}} hora local, como máximo 20 MW; cargar desde la solar se permite siempre.
- id: reserve_level
  text: La política de la empresa exige conservar al menos un {{reserve_pct}} % ({{reserve_mwh}} MWh) de estado de carga como reserva para emergencias en las horas de reserva de la tarde, todos los días.
- id: reserve_hours
  text: La reserva de emergencia de la tarde rige en todo momento entre las {{reserve_from}} y las {{reserve_to}} hora local, todos los días.
- id: degradation
  text: Cada MWh cargado más descargado en el contador cuesta {{degradation}} EUR de degradación, que se resta del beneficio.
- id: works_end
  text: Las obras de la subestación terminan antes; el límite de {{export_cap}} MW rige hasta el {{works_end}} a las 00:00 y desde entonces vuelven a aplicarse los 30 MW del contrato.
- id: dso_day
  text: La distribuidora limita el vertido del emplazamiento el {{dso_day}} de 18:00 a 21:00 por trabajos en la línea.
- id: dso_limit
  text: En las horas de la distribuidora el vertido del emplazamiento es como máximo de {{dso_mw}} MW; si la batería descarga entonces, solar + descarga − carga no puede superar {{dso_mw}} MW.
- id: maintenance_outage
  text: La batería está fuera de servicio por mantenimiento del inversor el {{outage_day}} de 08:00 a 20:00; en esos cuartos de hora no carga ni descarga.
