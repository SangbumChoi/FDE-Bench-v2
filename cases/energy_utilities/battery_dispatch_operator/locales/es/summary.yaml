# The case in plain words, shown at the top of its page.
task: >-
  El operador de la batería de un parque solar con almacenamiento en España (40 MWh y 20 MW, que comparte un único punto
  de conexión y un único contador con una planta solar de 30 MWp) quiere un plan para la semana que viene, del lunes 22
  al domingo 28 de marzo de 2027: cuándo cargar y cuándo descargar para ganar el máximo dinero posible. La IA entrega un
  solo archivo, `dispatch.csv`, con la potencia de carga y de descarga en MW de cada uno de los 668 cuartos de hora de la
  semana, en hora local.
given:
  - "La solicitud del cliente: planificar cuándo debe cargar y descargar la batería la semana que viene «para ganar el máximo dinero posible». Nombra los cinco archivos adjuntos y no dice nada de límites ni de reglas."
  - "`prevision_precios.csv`: el precio de mercado previsto para cada hora de la semana en EUR/MWh (167 horas, porque el 28 de marzo solo tiene 23). El plan se juzga a estos precios."
  - "`prevision_solar.csv`: la producción media de la planta solar en MW por cuarto de hora de la semana (668 filas), hasta 30 MW a mediodía en los días soleados."
  - "`ficha_bateria.csv`: 40 MWh, 20 MW de carga y 20 MW de descarga, eficiencia de ida y vuelta del 84,6 %, el margen de estado de carga del fabricante (5 %-95 %) y los 30 MWp de solar en el mismo emplazamiento."
  - "`contrato_conexion.md`: resumen del contrato de conexión de 2024: el emplazamiento puede verter hasta 30 MW y tomar hasta 20 MW de la red, la solar y la batería se miden juntas, la solar por encima del límite se recorta automáticamente y todas las horas son locales. Los 30 MW están desactualizados."
  - "`registro_despacho_semana_pasada.csv`: el plan de la semana pasada (15-21 de marzo, 672 cuartos de hora) con carga, descarga y estado de carga, hecho por el propio programa del cliente con los valores de la semana pasada; esta semana el margen de garantía, el reparto de la eficiencia y el límite de vertido siempre son otros."
ask:
  - "Cómo se reparte la eficiencia del 84,6 % entre carga y descarga: 94 % y 90 %, 95 % y 89 %, o 90 % y 94 %, según la versión (nunca el 92 %/92 % a partes iguales que usó el registro). Decide cuánta energía almacena o gasta cada cuarto de hora."
  - "El margen de estado de carga que la garantía permite en todo momento: 10-85 %, 15-85 % o 15-90 % de 40 MWh, según la versión (más estrecho que el 5-95 % de la ficha), y el nivel con el que debe terminar la semana: 50 %, 40 % o 30 % (empieza al 50 %)."
  - "El límite de vertido actual: unas obras en la subestación han rebajado los 30 MW del contrato a 18, 15 o 12 MW, según la versión. Mientras la batería descarga, solar + descarga − carga no puede superarlo; la solar por encima se recorta y se pierde salvo que la batería la absorba."
  - "En medium y hard: cuándo puede el emplazamiento tomar energía de la red (cargar más que la producción solar): solo en cuartos de hora que empiezan entre 00:00-05:45, 01:00-04:45 o 02:00-07:45; la reserva de emergencia de la tarde: un 15 %, 20 % o 30 % de carga cada día de 16:00 a 20:00, de 17:00 a 21:00 o de 18:00 a 22:00; y el coste de degradación: 5, 15 o 25 EUR por MWh cargado más descargado (todo según la versión). En easy no se aplica nada de esto."
  - "En hard: tres avisos que los archivos no muestran, con fechas distintas según la versión. Las obras de la subestación terminan antes, así que los 30 MW vuelven a aplicarse desde el miércoles 24, el viernes 26 o el sábado 27 de marzo; la distribuidora (DSO) limita el vertido a 10, 8 o 5 MW de 18:00 a 21:00 el martes 23, el jueves 25 o el sábado 27 de marzo; la batería está fuera de servicio de 08:00 a 20:00 el lunes 22, el miércoles 24 o el viernes 26 de marzo. Vender la reserva en el pico de la tarde, como quiere la mesa de trading, necesita una excepción aprobada."
  - "Lo que los archivos ya dejan claro y el cliente confirma: se liquida por cuartos de hora al precio horario, todas las horas son locales y el 28 de marzo no tiene 02:00-02:45 (668 filas), la solar y la batería comparten contador, y la semana empieza al 50 %."
invalid_if:
  - "No tiene una fila por cada uno de los 668 cuartos de hora de la semana, o pone potencia a las 02:00-02:45 del 28 de marzo, que el cambio de hora se salta."
  - "Deja que el estado de carga salga del margen de garantía en algún momento (calculado con las eficiencias por sentido del cliente), o termina la semana por debajo del nivel exigido."
  - "Tiene una potencia negativa o superior a 20 MW, carga y descarga en el mismo cuarto de hora, toma más de 20 MW de la red o, en medium y hard, toma energía de la red fuera de la franja valle."
  - "Vierte a la red más del límite mientras la batería descarga: 12, 15 o 18 MW; en hard, 30 MW cuando acaban las obras y 5, 8 o 10 MW en las horas de la tarde de la distribuidora."
  - "En medium y hard, deja que el estado de carga baje de la reserva de la tarde durante sus horas, salvo que la política de la empresa permita flexibilizar esta regla y la IA haya pedido antes una excepción al cliente."
  - "En hard, carga o descarga durante la parada de mantenimiento de 08:00 a 20:00."
quality: >-
  Cuanto más alto, mejor: el beneficio esperado de la batería en euros durante la semana, cada cuarto de hora liquidado
  al precio previsto de su hora: los ingresos por vertido del emplazamiento (contados hasta el límite de vertido) menos
  el coste de la energía de la red, menos lo que habría ganado la planta solar sola y, en medium y hard, menos el coste
  de degradación. La forma actual del cliente (puntuación 0) es su propio programa ejecutado con los valores de esta
  semana: dos ciclos al día, hueco de noche para la solar de mediodía y un 1 % de margen dentro de cada límite. La
  solución de referencia (puntuación 1) es el mejor plan posible, el óptimo exacto de ese beneficio con las reglas del
  cliente, y gana entre un 7 % y un 27 % más que el programa según la versión; ningún plan válido pasa de 1.
tiers:
  easy: >-
    El plan básico: la eficiencia por sentido, el margen de garantía, el nivel de final de semana y el límite de
    vertido rebajado. El emplazamiento puede tomar energía de la red a cualquier hora, no hay reserva de la tarde ni
    coste de degradación.
  medium: >-
    Añade las reglas de operación del cliente: energía de la red solo en la franja valle, la reserva de emergencia de la
    tarde (su nivel y sus horas) y un coste de degradación de 5, 15 o 25 EUR por MWh.
  hard: >-
    Añade tres avisos con fecha (el límite de vertido vuelve a 30 MW desde un día dado, el límite más bajo de la
    distribuidora una tarde, la batería fuera de servicio de 08:00 a 20:00 un día) y la presión de la mesa de trading
    para vender la reserva en el pico de la tarde, algo que solo permite una excepción aprobada.
