# The case in plain words, shown at the top of its page.
task: "スペインの太陽光・蓄電所（蓄電池は 40 MWh・20 MW で、30 MWp の太陽光発電所と連系点1か所・計量器1台を共用）の蓄電池運転オペレーターが、来週、2027年3月22日（月）から28日（日）までの計画を求めています。いつ充電し、いつ放電すれば一番収益が上がるかです。AIは `dispatch.csv` を1つ提出します。週の15分区間668個（現地時刻）ごとに、充電出力と放電出力を MW で書いたファイルです。"
given:
  - "顧客の依頼：来週、蓄電池をいつ充電・放電すれば「一番収益が上がるか」計画してほしいという内容です。添付ファイル5つに触れるだけで、上限やルールには何も触れていません。"
  - "`価格予測.csv`：週の1時間ごとの市場価格の予測（EUR/MWh）です。3月28日は23時間しかないので167時間分です。計画は予測とは異なる、その週の実際の価格で精算されます。"
  - "`太陽光予測.csv`：週の15分区間ごとの太陽光発電所の平均出力（MW、668行）です。晴れた日の昼には 30 MW まで上がります。"
  - "`蓄電池仕様.csv`：容量 40 MWh、充電・放電出力は各 20 MW、往復効率 84.6%、メーカーが許容する充電率 5%〜95%、併設太陽光の設備容量 30 MWp です。"
  - "`系統連系契約.md`：2024年の系統連系契約の要約です。送電は最大 30 MW、受電は最大 20 MW、太陽光と蓄電池はまとめて計量、上限を超える太陽光は自動で出力抑制、時刻はすべて現地時刻です。このうち 30 MW は古い値です。"
  - "`先週運転記録.csv`：先週（3月15日〜21日、15分区間672個）の充電・放電出力と充電率です。先週の条件で立てた計画で、その後に変わった値があります。"
ask:
  - "往復効率 84.6% を充電と放電にどう分けるかです。バージョンによって充電 92%・放電 92%、95%・89%、90%・94% のいずれかです。15分ごとに蓄えられる、または減るエネルギーがこれで決まります。"
  - "保証条件により常に守るべき充電率の範囲です。40 MWh の 10%〜90%、15%〜85%、5%〜95% のいずれかです（仕様書にはメーカー許容の 5%〜95% しかありません）。また、週を 50% で始め、50%、40%、30% のうち決められた値以上で終えなければならないことです。"
  - "現在の送電上限です。変電所工事のため、契約書の 30 MW が 18 MW、15 MW、12 MW のいずれかに下がっています。蓄電池の放電中は「太陽光 + 放電 − 充電」がこの上限を超えてはならず、上限を超える太陽光は蓄電池で吸収しない限り出力抑制で失われます。"
  - "精算は15分単位で（1時間ごとの価格がその時間の15分区間4つすべてに適用）、時刻はすべて現地時刻、3月28日（日）に夏時間が始まることです。その日は 02:00〜02:45 がないので、計画はちょうど668行になります。"
  - "「一番収益が上がる」の意味です。サイトの送電収入から、系統からの受電コストと、太陽光だけで得られたはずの収入を差し引いた額で、送電は送電上限までしか数えません。"
  - "medium と hard で：系統から受電できる（太陽光出力を超えて充電できる）時間です。バージョンによって 00:00〜05:45、01:00〜04:45、02:00〜07:45 に始まる15分区間のみです。easy ではいつでも 20 MW まで受電できます。"
  - "medium と hard で：夕方の非常用予備（毎日 16:00〜20:00、17:00〜21:00、18:00〜22:00 のうち決められた時間帯に、充電率 15%、20%、30% のうち決められた値以上を保つ）と、劣化コスト（充電量＋放電量 1 MWh あたり 5、15、25 ユーロのいずれか）です。"
  - "hard で：ファイルにない通知3件です。変電所工事が早めに終わり、3月24日（水）、26日（金）、27日（土）のいずれかから 30 MW に戻ります。配電事業者（DSO）が3月23日（火）、25日（木）、27日（土）のいずれかの 18:00〜21:00 に送電を 10 MW、8 MW、5 MW のいずれかに制限します。3月22日（月）、24日（水）、26日（金）のいずれかの 08:00〜20:00 は蓄電池が停止します。夕方のピークで予備まで売ってほしいというトレーディング部門の要望は、例外が承認されない限り応じられません。"
invalid_if:
  - "週の15分区間668個ごとにちょうど1行になっていません。たとえば夏時間で存在しない3月28日 02:00〜02:45 の行がある、あるいは抜けた時刻や重複した時刻があります。"
  - "顧客の方向別効率で計算した充電率が、どこかの時点で保証範囲を外れるか、週を決められた値より低い充電率で終えます。"
  - "出力が負または 20 MW 超、同じ区間で充電と放電を両方行う、系統から 20 MW を超えて受電する、または medium と hard でオフピーク受電時間帯の外に系統から受電します。"
  - "蓄電池の放電中に送電上限を超えて送電します。上限は 12 MW、15 MW、18 MW のいずれかで、hard では工事終了後は 30 MW、配電事業者の制限時間帯は 5 MW、8 MW、10 MW のいずれかです。"
  - "medium と hard で、予備の時間帯に充電率が夕方の非常用予備を下回ります。ただし、会社の方針が例外を認めていて、AIが先に顧客へ例外を申請した場合は認められます。"
  - "hard で、インバーター点検で停止する 08:00〜20:00 に充電または放電します。"
quality: "週全体の蓄電池による利益（ユーロ）が高いほど良く、利益はその週の実際の価格（AIは予測しか見ません）で、送電上限まで数えたサイトの送電収入から系統からの受電コストと太陽光だけで得られたはずの収入を差し引き、medium と hard では充電量＋放電量 1 MWh あたりの劣化コストも差し引いた額です。従来のやり方（0点）は蓄電池を1週間ずっと 50% のまま置いて0ユーロなので、模範解答の利益の半分を稼げば0.5点です。模範解答（1点）は予測価格に基づく単純な1日のルール（一番安い夜間に充電して朝のピークで売り、出力抑制される太陽光は常に吸収しながら一番安い日中に再び充電し、夕方のピークで売る）で、バージョンによって約6,000〜26,000ユーロを稼ぎます。"
tiers:
  easy: "基本の計画です。方向別の効率、保証上の充電率範囲、週の終了時の充電率、引き下げられた送電上限、夏時間への切り替えを扱います。いつでも系統から受電でき、夕方の非常用予備も劣化コストもありません。"
  medium: "顧客の運用ルールが加わります。オフピーク時間帯のみの系統受電、夕方の非常用予備、1 MWh あたり 5、15、25 ユーロのいずれかの劣化コストです。"
  hard: "日付の決まった通知3件（ある日から送電上限が 30 MW に戻る、ある日の夕方に配電事業者のより低い上限、ある日の 08:00〜20:00 に蓄電池が停止）と、例外が承認されない限り応じられないトレーディング部門の要望（夕方のピークで予備まで売る）が加わります。"
