- id: efficiency
  text: 効率は方向別に充電 {{eta_charge_pct}}%、放電 {{eta_discharge_pct}}% で計算します（仕様書の往復 84.6% を2つの方向に均等に分けた値ではありません）。P MW で15分充電すると 0.25*P*{{eta_charge}} MWh 増え、P MW で放電すると 0.25*P/{{eta_discharge}} MWh 減ります。
- id: soc_window
  text: 保証条件により充電率は常に {{soc_min}}%〜{{soc_max}}%（{{soc_min_mwh}}〜{{soc_max_mwh}} MWh）で、メーカーの 5%〜95% より狭い範囲です。
- id: end_soc
  text: 週の終わりの充電率は {{end_soc}}%（{{end_soc_mwh}} MWh）以上でなければなりません（週は 50% で始まります）。
- id: export_cap
  text: 送電上限は契約書の 30 MW ではなく一時的に {{export_cap}} MW です。放電中は 太陽光 + 放電 − 充電 が {{export_cap}} MW を超えてはならず、{{export_cap}} MW を超える太陽光は蓄電池で吸収しない限り抑制されます。
- id: grid_charging
  text: 系統からの受電（太陽光出力を超える充電）は現地時刻 {{import_from}}〜{{import_last}} に始まる区間のみで、最大 20 MW です。太陽光からの充電はいつでも可能です。
- id: reserve_level
  text: 会社の方針として、毎日夕方の予備時間帯は非常用に充電率 {{reserve_pct}}%（{{reserve_mwh}} MWh）以上を保ちます。
- id: reserve_hours
  text: 夕方の非常用予備は、毎日、現地時刻 {{reserve_from}}〜{{reserve_to}} の間は常に適用されます。
- id: degradation
  text: 計量点での充電量と放電量 1 MWh ごとに劣化コスト {{degradation}} ユーロがかかり、利益から差し引かれます。
- id: works_end
  text: 変電所工事が早めに終わります。{{export_cap}} MW の上限は {{works_end}} 00:00 までで、その後は契約書どおりの 30 MW に戻ります。
- id: dso_day
  text: 線路作業のため、配電事業者が {{dso_day}} 18:00〜21:00 のサイト送電を制限します。
- id: dso_limit
  text: 配電事業者による制限時間帯のサイト送電は最大 {{dso_mw}} MW です。この時間に放電するときは 太陽光 + 放電 − 充電 が {{dso_mw}} MW 以下でなければなりません。
- id: maintenance_outage
  text: '{{outage_day}} 08:00〜20:00 はインバーター点検のため蓄電池が停止し、この区間は充電も放電もできません。'
