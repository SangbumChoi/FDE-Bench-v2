- id: efficiency
  text: 効率は往復 84.6% を1回掛けるのではなく、方向別に充電 {{eta_charge_pct}}%、放電 {{eta_discharge_pct}}% で計算します。P MW で15分充電すると 0.25*P*{{eta_charge}} MWh 増え、P MW で放電すると 0.25*P/{{eta_discharge}} MWh 減ります。
- id: soc_window
  text: '保証条件により充電率は常に {{soc_min}}%〜{{soc_max}}%（{{soc_min_mwh}}〜{{soc_max_mwh}} MWh）で<!-- when: soc_window=10-90,15-85 -->、メーカーの 5%〜95% より狭い範囲です<!-- /when --><!-- when: soc_window=5-95 -->、メーカーの範囲と同じです<!-- /when -->。'
- id: start_end_soc
  text: 蓄電池は週を 50%（20 MWh）で始め、{{end_soc}}%（{{end_soc_mwh}} MWh）以上で終える必要があります。
- id: export_cap
  text: 送電上限は契約書の 30 MW ではなく一時的に {{export_cap}} MW です。放電中は 太陽光 + 放電 − 充電 が {{export_cap}} MW を超えてはならず、{{export_cap}} MW を超える太陽光は蓄電池で吸収しない限り抑制されます。
- id: grid_charging
  text: '<!-- tier: easy -->今週はサイトがいつでも系統から充電できます（最大 20 MW）が<!-- /tier --><!-- tier: medium hard -->太陽光からの充電はいつでも可能ですが、系統からの受電は現地時刻 {{import_from}}〜{{import_last}} に始まる区間のみ（最大 20 MW）で<!-- /tier -->、同じ区間で充電と放電を同時に行いません。'
- id: quarter_settlement
  text: 精算は15分単位で、時間ごとの価格がその時間の4区間すべてに適用され、MW は区間平均、電力量は MW × 0.25 です。
- id: dst_clock
  text: 時刻は現地時刻で、3月28日（日）に夏時間が始まるため、その日は23時間で 02:00〜02:45 の行がなく、計画はちょうど668行です。
- id: evening_reserve
  text: 会社の方針として、毎日 {{reserve_from}}〜{{reserve_to}} の間は常に充電率 {{reserve_pct}}%（{{reserve_mwh}} MWh）以上を保ちます。
- id: degradation
  text: 計量点での充電量と放電量 1 MWh ごとに劣化コスト {{degradation}} ユーロがかかり、利益から差し引かれます。
- id: profit_scoring
  text: '実際の価格で、サイトの送電収入から受電コストと太陽光単独の収入（どちらも送電上限まで）を差し引き<!-- tier: medium hard -->、さらに充電量と放電量の合計にかかる劣化コストを差し引き<!-- /tier -->ます。'
- id: works_end
  text: 変電所工事が早めに終わります。{{export_cap}} MW の上限は {{works_end}} 00:00 までで、その後は契約書どおりの 30 MW に戻ります。
- id: dso_limit
  text: 配電事業者が {{dso_day}} 18:00〜21:00 のサイト送電を {{dso_mw}} MW に制限します。この時間に放電するときは 太陽光 + 放電 − 充電 が {{dso_mw}} MW 以下でなければなりません。
- id: maintenance_outage
  text: '{{outage_day}} 08:00〜20:00 はインバーター点検のため蓄電池が停止し、この区間は充電も放電もできません。'
