- id: efficiency
  text: 効率は往復 84.6% を1回掛けるのではなく、充電 92%、放電 92% でそれぞれ計算します。P MW で15分充電すると 0.25*P*0.92 MWh 増え、P MW で放電すると 0.25*P/0.92 MWh 減ります。
- id: soc_window
  text: 保証条件により充電率は常に 10%〜90%（4〜36 MWh）で、メーカーの 5%〜95% より狭い範囲です。
- id: start_end_soc
  text: 蓄電池は週を 50%（20 MWh）で始め、50% 以上で終える必要があります。
- id: export_cap
  text: 送電上限は契約書の 30 MW ではなく一時的に 25 MW です。放電中は 太陽光 + 放電 − 充電 が 25 MW を超えてはならず、25 MW を超える太陽光は蓄電池で吸収しない限り抑制されます。
- id: grid_charging
  text: 太陽光からの充電はいつでも可能ですが、系統からの受電は現地時刻 00:00〜05:45 に始まる区間のみ（最大 20 MW）で、同じ区間で充電と放電を同時に行いません。
- id: quarter_settlement
  text: 精算は15分単位で、時間ごとの価格がその時間の4区間すべてに適用され、MW は区間平均、電力量は MW × 0.25 です。
- id: dst_clock
  text: 時刻は現地時刻で、3月28日（日）に夏時間が始まるため、その日は23時間で 02:00〜02:45 の行がなく、計画はちょうど668行です。
- id: evening_reserve
  text: 会社の方針として、毎日 17:00〜21:00 の間は常に充電率 20% 以上を保ちます。
- id: profit_scoring
  text: 実際の価格で、サイトの送電収入から受電コストと太陽光単独の収入（25 MW 上限）を差し引き、さらに充電量と放電量の合計 1 MWh あたり 5 ユーロを差し引いて評価します。
