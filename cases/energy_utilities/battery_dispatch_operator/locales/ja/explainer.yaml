# The explainer's case texts in Japanese (English comes from case.yaml).
role: 蓄電池運転オペレーター
task_type: 組合せ最適化
deliverable_spec: |
  dispatch.csv、ASCII ヘッダー: timestamp,charge_mw,discharge_mw
  2027-03-22 00:00 .. 2027-03-28 23:45 の週の15分区間ごとに1行で、時刻は現地時刻です。
  timestamp = 区間の開始時刻（形式 "YYYY-MM-DD HH:MM"）。charge_mw / discharge_mw = その区間における計量点での
  蓄電池の平均出力（MW）で、どちらも >= 0 です。
tiers:
  easy: 中核となる問題です。保証上の充電率範囲、出力上限、方向別の効率、週末の充電率、変更後の送電上限（保管中の契約書より低い）、夏時間への切り替えを扱います。今回はいつでも系統から受電でき、夕方の非常用予備はなく、劣化コストも計上しません。
  medium: easy に顧客の運用ルールを加えます。オフピーク時間帯のみの系統受電、夕方の非常用予備（比率と時間帯）、充放電量 1 MWh あたりの劣化コストです。
  hard: medium に日付の決まった通知3件を加えます。変電所工事が早めに終わり、ある日から契約書の 30 MW に戻ること、配電事業者がある日の夕方にサイトの送電を制限すること、ある日の 08:00〜20:00 はインバーター点検で蓄電池が停止することです。さらにトレーディング部門が夕方のピークで予備を使うよう求めますが、これは例外が承認された場合にしか認められません。
rules:
  soc_limits: 充電率は常に 40 MWh の {{soc_min}}%〜{{soc_max}}% の範囲内にあります（充電効率 {{eta_charge_pct}}%、放電効率 {{eta_discharge_pct}}%）。
  power_limits: 充電と放電はそれぞれ 0〜20 MW で、同じ区間で両方を行うことはありません。系統からの受電は最大 20 MW です。
  export_cap: 変電所工事の期間中、蓄電池の放電中はサイトの送電（太陽光 + 放電 − 充電）が変更後の上限 {{export_cap}} MW を超えてはなりません。
  grid_charging_window: サイトが系統から受電（太陽光出力を超える充電）できるのは、現地時刻 {{import_from}}〜{{import_last}} に始まる区間のみです。
  end_soc: 週は充電率 50% で始まり、{{end_soc}}% 以上で終えなければなりません。
  evening_reserve: 毎日、現地時刻 {{reserve_from}}〜{{reserve_to}} の間は常に充電率が {{reserve_pct}}% 以上です。
  dso_limit: '{{dso_day}} 18:00〜21:00 は、蓄電池の放電中にサイトの送電が配電事業者の上限 {{dso_mw}} MW を超えてはなりません。'
  maintenance_outage: '{{outage_day}} 08:00〜20:00 は蓄電池は充電も放電も行いません（インバーター点検）。'
