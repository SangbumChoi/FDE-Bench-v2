# The explainer's case texts in Korean (English comes from case.yaml).
role: 배터리 운전 담당자
task_type: 조합 최적화
deliverable_spec: |
  dispatch.csv, ASCII 헤더: timestamp,charge_mw,discharge_mw
  2027-03-22 00:00 .. 2027-03-28 23:45 한 주의 15분 구간마다 한 행이며, 시각은 현지 시각입니다.
  timestamp = 구간 시작 시각, 형식 "YYYY-MM-DD HH:MM". charge_mw / discharge_mw = 그 구간 동안 계량점 기준
  배터리 평균 출력(MW)이며, 둘 다 >= 0입니다.
rules:
  soc_limits: 충전상태는 언제나 40 MWh의 10%~90% 사이에 있어야 합니다(충전과 방전 효율은 각각 92%).
  power_limits: 충전과 방전은 각각 0~20 MW이며, 한 구간에서 둘을 동시에 하지 않습니다. 계통 수전은 최대 20 MW입니다.
  export_cap: 배터리가 방전하는 동안 사업장 송전(태양광 + 방전 − 충전)은 변경된 한도 25 MW를 넘으면 안 됩니다.
  grid_charging_window: 사업장은 현지 시각 00:00~05:45에 시작하는 구간에서만 계통에서 수전(태양광 출력보다 많이 충전)할 수 있습니다.
  end_soc: 한 주는 충전상태 50%로 시작하며, 50% 이상으로 끝나야 합니다.
  reserve_20pct: 매일 현지 시각 17:00~21:00 사이에는 언제나 충전상태가 20% 이상이어야 합니다.
