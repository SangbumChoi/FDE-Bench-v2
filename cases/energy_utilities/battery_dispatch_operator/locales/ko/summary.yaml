# The case in plain words, shown at the top of its page.
task: >-
  스페인의 태양광·ESS 사업장(배터리 40 MWh·20 MW, 30 MWp 태양광 발전소와 연계점 하나와 계량기 하나를 같이 씀)의 배터리
  운전 담당자가 다음 주, 2027년 3월 22일(월)부터 28일(일)까지 배터리를 언제 충전하고 언제 방전해야 수익이 가장 많이
  나는지 계획을 원합니다. AI는 `dispatch.csv` 파일 하나를 냅니다. 한 주의 15분 구간 668개(현지 시각)마다 충전 출력과
  방전 출력을 MW로 적은 파일입니다.
given:
  - "고객의 요청: 다음 주에 배터리를 언제 충전하고 방전해야 \"수익이 가장 많이 날지\" 계획해 달라는 내용입니다. 첨부 파일 다섯 개를 언급할 뿐, 한도나 규칙은 전혀 말하지 않습니다."
  - "`가격예측.csv`: 한 주의 시간별 시장 가격 예측(EUR/MWh)입니다. 3월 28일은 23시간뿐이라 167시간입니다. 계획은 예측과 다른, 그 주의 실제 가격으로 정산됩니다."
  - "`태양광예측.csv`: 한 주의 15분 구간마다 태양광 발전소의 평균 출력(MW)입니다(668행). 맑은 날 한낮에는 30 MW까지 올라갑니다."
  - "`배터리사양.csv`: 용량 40 MWh, 충전·방전 출력 각 20 MW, 왕복 효율 84.6%, 제조사가 허용하는 충전상태 5%~95%, 같은 부지의 태양광 설비용량 30 MWp입니다."
  - "`계통연계계약.md`: 2024년 계통연계계약 요약입니다. 송전 최대 30 MW, 수전 최대 20 MW, 태양광과 배터리 합산 계량, 한도를 넘는 태양광은 자동으로 출력 제한, 모든 시각은 현지 시각입니다. 이 중 30 MW는 오래된 값입니다."
  - "`지난주운전기록.csv`: 지난주(3월 15일~21일, 15분 구간 672개)의 충전·방전 출력과 충전상태입니다. 지난주 설정으로 세운 계획이라 바뀐 값이 있습니다."
ask:
  - "왕복 효율 84.6%를 충전과 방전에 어떻게 나누는지입니다. 버전에 따라 충전 92%·방전 92%, 95%·89%, 90%·94% 중 하나입니다. 15분마다 저장되거나 빠져나가는 에너지가 이 값으로 정해집니다."
  - "보증 조건상 언제나 지켜야 하는 충전상태 범위입니다. 버전에 따라 40 MWh의 10%~90%, 15%~85%, 5%~95% 중 하나입니다(사양서에는 제조사 허용 범위 5%~95%만 있습니다). 또 한 주는 50%에서 시작하고, 끝날 때는 버전에 따라 50%, 40%, 30% 이상이어야 합니다."
  - "지금의 송전 한도입니다. 변전소 공사 때문에 계약서의 30 MW가 18 MW, 15 MW, 12 MW 중 하나로 낮아졌습니다. 배터리가 방전하는 동안 태양광 + 방전 − 충전이 이 한도를 넘으면 안 되고, 한도를 넘는 태양광은 배터리가 흡수하지 않으면 출력 제한으로 버려집니다."
  - "정산은 15분 단위이고(시간별 가격이 그 시간의 15분 구간 4개에 모두 적용), 모든 시각은 현지 시각이며, 3월 28일(일)에 서머타임이 시작된다는 점입니다. 그날은 02:00~02:45가 없으므로 계획은 정확히 668행이어야 합니다."
  - "\"수익이 가장 많이\"의 뜻입니다. 사업장 송전 수입에서 계통 수전 비용과 태양광만 운전했을 때 벌었을 금액을 뺀 값이며, 송전은 송전 한도까지만 셉니다."
  - "medium과 hard에서: 계통에서 수전할 수 있는 시간(태양광 출력보다 많이 충전)입니다. 버전에 따라 00:00~05:45, 01:00~04:45, 02:00~07:45에 시작하는 15분 구간만 허용됩니다. easy에서는 언제든 20 MW까지 수전할 수 있습니다."
  - "medium과 hard에서: 저녁 비상용 예비 전력과 열화 비용입니다. 매일 16:00~20:00, 17:00~21:00, 18:00~22:00 중 한 시간대에 충전상태를 15%, 20%, 30% 중 하나 이상으로 유지해야 하고, 충전량 + 방전량 1 MWh마다 5유로, 15유로, 25유로 중 하나의 열화 비용이 듭니다(모두 버전에 따라 다름)."
  - "hard에서: 파일에 없는 통지 세 건입니다. 변전소 공사가 일찍 끝나 3월 24일(수), 26일(금), 27일(토) 중 하루부터 30 MW가 다시 적용됩니다. 배전사업자(DSO)가 3월 23일(화), 25일(목), 27일(토) 중 하루 18:00~21:00에 송전을 10 MW, 8 MW, 5 MW 중 하나로 제한합니다. 3월 22일(월), 24일(수), 26일(금) 중 하루는 08:00~20:00에 인버터 점검으로 배터리가 정지됩니다. 저녁 피크에 예비 전력까지 팔자는 트레이딩 팀의 요청은 예외가 승인되어야만 따를 수 있습니다."
invalid_if:
  - "한 주의 15분 구간 668개마다 정확히 한 행씩이 아닙니다. 예를 들어 서머타임으로 없어지는 3월 28일 02:00~02:45 행이 있거나, 빠지거나 중복된 시각이 있습니다."
  - "고객의 방향별 효율로 계산한 충전상태가 어느 순간이든 보증 범위를 벗어나거나, 한 주를 마칠 때 충전상태가 요구 수준(50%, 40%, 30% 중 하나)보다 낮습니다."
  - "출력이 음수이거나 20 MW를 넘거나, 한 구간에서 충전과 방전을 같이 하거나, 계통에서 20 MW를 넘게 수전하거나, medium과 hard에서 경부하 수전 시간대 밖에 계통에서 수전합니다."
  - "배터리가 방전하는 동안 송전 한도보다 많이 송전합니다. 한도는 12 MW, 15 MW, 18 MW 중 하나이고, hard에서는 공사가 끝난 뒤 30 MW, 배전사업자 제한 시간대에는 5 MW, 8 MW, 10 MW 중 하나입니다."
  - "medium과 hard에서 예비 전력 시간대에 충전상태가 비상용 예비 전력 아래로 내려갑니다. 단, 회사 정책이 예외를 허용하고 AI가 먼저 고객에게 예외를 요청했다면 위반으로 보지 않습니다."
  - "hard에서 인버터 점검으로 정지되는 08:00~20:00에 충전하거나 방전합니다."
quality: >-
  한 주 동안 배터리로 얻은 이익(유로)이 높을수록 좋으며, 이익은 그 주의 실제 가격(AI는 예측만 봅니다)으로 송전 한도까지
  센 사업장 송전 수입에서 계통 수전 비용과 태양광만 운전했을 때 벌었을 금액을 빼고, medium과 hard에서는 충전량 + 방전량
  MWh당 열화 비용도 뺀 값입니다. 기존 방식(0점)은 배터리를 한 주 내내 충전상태 50%로 둔 채 운전하지 않아 0유로를 벌기 때문에 모범 답안 이익의 절반을
  벌면 0.5점이고, 모범 답안(1점)은 예측 가격에 따른 단순한 하루 규칙(가장 싼 밤 시간에 충전해 아침 피크에 팔고, 출력 제한되는
  태양광은 늘 흡수하면서 가장 싼 낮 시간에 다시 채워 저녁 피크에 팖)으로 버전에 따라 약 6,000~26,000유로를 법니다.
tiers:
  easy: >-
    기본 계획입니다. 방향별 효율, 보증 충전상태 범위, 한 주 종료 시 충전상태, 낮아진 송전 한도, 서머타임 전환을 다룹니다.
    언제든 계통에서 수전할 수 있고, 저녁 비상용 예비 전력과 열화 비용은 없습니다.
  medium: >-
    고객의 운전 규칙이 더해집니다. 경부하 시간대에만 계통 수전, 저녁 비상용 예비 전력, MWh당 5유로, 15유로, 25유로 중
    하나의 열화 비용입니다.
  hard: >-
    날짜가 정해진 통지 세 건(특정 날부터 송전 한도가 다시 30 MW, 하루 저녁 배전사업자의 더 낮은 한도, 하루 08:00~20:00
    배터리 정지)과, 예외가 승인될 때만 따를 수 있는 트레이딩 팀의 압박(저녁 피크에 예비 전력까지 팔자는 요청)이 더해집니다.
