# The case in plain words, shown at the top of its page.
task: >-
  스페인의 태양광·ESS 사업장(배터리 40 MWh·20 MW, 30 MWp 태양광 발전소와 연계점 하나와 계량기 하나를 같이 씀)의 배터리
  운전 담당자가 다음 주, 2027년 3월 22일(월)부터 28일(일)까지 배터리를 언제 충전하고 언제 방전해야 수익이 가장 많이
  나는지 계획을 원합니다. AI는 `dispatch.csv` 파일 하나를 냅니다. 한 주의 15분 구간 668개(현지 시각)마다 충전 출력과
  방전 출력을 MW로 적은 파일입니다.
given:
  - "고객의 요청: 다음 주에 배터리를 언제 충전하고 방전해야 \"수익이 가장 많이 날지\" 계획해 달라는 내용입니다. 첨부 파일 다섯 개를 언급할 뿐, 한도나 규칙은 전혀 말하지 않습니다."
  - "`가격예측.csv`: 한 주의 시간별 시장 가격 예측(EUR/MWh)입니다. 3월 28일은 23시간뿐이라 167시간입니다. 계획은 이 가격으로 평가합니다."
  - "`태양광예측.csv`: 한 주의 15분 구간마다 태양광 발전소의 평균 출력(MW)입니다(668행). 맑은 날 한낮에는 30 MW까지 올라갑니다."
  - "`배터리사양.csv`: 용량 40 MWh, 충전·방전 출력 각 20 MW, 왕복 효율 84.6%, 제조사가 허용하는 충전상태 5%~95%, 같은 부지의 태양광 설비용량 30 MWp입니다."
  - "`계통연계계약.md`: 2024년 계통연계계약 요약입니다. 송전 최대 30 MW, 수전 최대 20 MW, 태양광과 배터리 합산 계량, 한도를 넘는 태양광은 자동으로 출력 제한, 모든 시각은 현지 시각입니다. 이 중 30 MW는 오래된 값입니다."
  - "`지난주운전기록.csv`: 지난주(3월 15~21일, 15분 구간 672개)의 충전 출력, 방전 출력, 충전상태입니다. 고객의 자체 계획 프로그램이 지난주 값으로 세운 계획이며, 이번 주에는 보증 범위, 효율 배분, 송전 한도가 늘 다릅니다."
ask:
  - "왕복 효율 84.6%가 충전과 방전에 어떻게 나뉘는지: 버전에 따라 충전 94%·방전 90%, 95%·89%, 또는 90%·94%입니다(기록에 쓰인 균등한 92%/92%는 아닙니다). 15분 구간마다 저장되거나 소모되는 에너지가 이 값으로 정해집니다."
  - "보증 조건이 언제나 허용하는 충전상태 범위: 버전에 따라 40 MWh의 10~85%, 15~85%, 15~90%(사양서의 5~95%보다 좁음)이고, 한 주를 마칠 때의 수준은 50%, 40%, 30%입니다(한 주는 50%로 시작)."
  - "현재 송전 한도: 변전소 공사로 계약서의 30 MW가 버전에 따라 18, 15, 12 MW로 낮아졌습니다. 배터리가 방전하는 동안 태양광 + 방전 − 충전이 이 한도를 넘으면 안 되고, 한도를 넘는 태양광은 배터리가 흡수하지 않으면 출력이 제한되어 사라집니다."
  - "medium과 hard: 계통에서 전기를 받을 수 있는 때(태양광 출력보다 많이 충전): 00:00~05:45, 01:00~04:45, 02:00~07:45에 시작하는 구간만, 저녁 비상용 예비 전력: 매일 16:00~20:00, 17:00~21:00, 18:00~22:00에 15%, 20%, 30% 유지, 열화 비용: 충전량+방전량 MWh당 5, 15, 25유로(모두 버전에 따라 다름). easy에서는 모두 적용되지 않습니다."
  - "hard: 파일에 없는 통지 세 건이며 날짜는 버전에 따라 다릅니다. 변전소 공사가 일찍 끝나 3월 24일(수), 26일(금), 27일(토)부터 30 MW가 다시 적용되고, 배전사업자(DSO)가 3월 23일(화), 25일(목), 27일(토) 18:00~21:00에 송전을 10, 8, 5 MW로 제한하며, 배터리는 3월 22일(월), 24일(수), 26일(금) 08:00~20:00에 정지합니다. 트레이딩 팀의 요청대로 저녁 피크에 예비 전력을 팔려면 승인된 예외가 필요합니다."
  - "파일이 이미 알려 주고 고객이 확인해 주는 것: 시간별 가격으로 15분마다 정산, 모든 시각은 현지 시각이고 3월 28일에는 02:00~02:45가 없음(668행), 태양광과 배터리는 계량기 하나, 한 주는 50%로 시작."
invalid_if:
  - "한 주의 15분 구간 668개마다 한 행씩 있지 않거나, 서머타임으로 건너뛰는 3월 28일 02:00~02:45에 출력이 있는 경우."
  - "고객의 방향별 효율로 계산한 충전상태가 어느 순간이라도 보증 범위를 벗어나거나, 한 주를 정해진 수준보다 낮게 마치는 경우."
  - "출력이 음수이거나 20 MW를 넘는 경우, 한 구간에서 충전과 방전을 같이 하는 경우, 계통 수전이 20 MW를 넘는 경우, medium과 hard에서 경부하 시간대 밖에 계통 전력을 받는 경우."
  - "배터리가 방전하는 동안 송전 한도(12, 15, 18 MW; hard에서는 공사가 끝난 뒤 30 MW, 배전사업자의 저녁 시간대에는 5, 8, 10 MW)를 넘겨 송전하는 경우."
  - "medium과 hard에서 예비 시간대에 충전상태가 저녁 예비 전력 아래로 떨어지는 경우. 단, 회사 정책상 이 규칙을 굽힐 수 있고 AI가 먼저 고객에게 예외를 요청한 경우는 제외."
  - "hard에서 08:00~20:00 점검 정지 중에 충전하거나 방전하는 경우."
quality: >-
  높을수록 좋습니다. 그 주 배터리의 기대 이익(유로)이며, 15분 구간마다 그 시간의 예측 가격으로 정산합니다. 사업장 송전
  수입(송전 한도까지만)에서 계통 전력 비용과 태양광 단독 수입을 빼고, medium과 hard에서는 열화 비용도 뺍니다. 고객의
  기존 방식(0점)은 이번 주 값으로 돌린 자체 계획 프로그램입니다. 하루 두 번 충방전하고, 밤에는 낮 태양광을 위한 여유를
  남기며, 모든 한계 안쪽으로 1%를 더 남깁니다. 참조 해(1점)는 고객 규칙 아래 이 이익의 정확한 최적해로, 버전에 따라 계획
  프로그램보다 7~27% 더 법니다. 유효한 계획은 1점을 넘지 못합니다.
tiers:
  easy: >-
    핵심 계획: 방향별 효율, 보증 범위, 주말 충전상태, 낮아진 송전 한도. 계통 수전은 언제든 가능하고, 저녁 예비 전력과
    열화 비용은 없습니다.
  medium: >-
    고객의 운영 규칙이 더해집니다: 경부하 시간대에만 계통 수전, 저녁 비상용 예비 전력(수준과 시간대), MWh당 5, 15, 25유로의
    열화 비용.
  hard: >-
    날짜가 있는 통지 세 건(어느 날부터 송전 한도가 30 MW로 복귀, 어느 저녁 배전사업자의 더 낮은 한도, 어느 하루 08:00~20:00
    배터리 정지)과, 승인된 예외로만 허용되는 저녁 피크 예비 전력 판매를 요구하는 트레이딩 팀의 압력이 더해집니다.
