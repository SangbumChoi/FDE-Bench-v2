- id: efficiency
  text: 효율은 방향별로 충전 {{eta_charge_pct}}%, 방전 {{eta_discharge_pct}}%로 계산합니다(사양서의 왕복 84.6%를 두 방향에 똑같이 나눈 값이 아닙니다). P MW로 15분 충전하면 0.25*P*{{eta_charge}} MWh가 늘고, P MW로 방전하면 0.25*P/{{eta_discharge}} MWh가 줄어듭니다.
- id: soc_window
  text: 보증 조건상 충전상태는 언제나 {{soc_min}}%~{{soc_max}}%({{soc_min_mwh}}~{{soc_max_mwh}} MWh)여야 하며, 제조사의 5%~95%보다 좁습니다.
- id: end_soc
  text: 한 주가 끝날 때 충전상태는 {{end_soc}}%({{end_soc_mwh}} MWh) 이상이어야 합니다(한 주는 50%로 시작합니다).
- id: export_cap
  text: 송전 한도는 계약서의 30 MW가 아니라 임시로 {{export_cap}} MW입니다. 방전 중에는 태양광 + 방전 − 충전이 {{export_cap}} MW를 넘으면 안 되고, {{export_cap}} MW를 넘는 태양광은 배터리가 흡수하지 않으면 제한됩니다.
- id: grid_charging
  text: 계통 수전(태양광 출력보다 많이 충전)은 현지 시각 {{import_from}}~{{import_last}}에 시작하는 구간에서만 가능하며 최대 20 MW입니다. 태양광 충전은 언제든 가능합니다.
- id: reserve_level
  text: 회사 방침상 매일 저녁 예비 시간대에는 비상용으로 충전상태를 최소 {{reserve_pct}}%({{reserve_mwh}} MWh)로 유지합니다.
- id: reserve_hours
  text: 저녁 비상용 예비 전력은 매일 현지 시각 {{reserve_from}}~{{reserve_to}} 사이 언제나 적용됩니다.
- id: degradation
  text: 계량점 기준 충전량과 방전량 1 MWh마다 열화 비용 {{degradation}}유로가 들며, 이 비용은 이익에서 뺍니다.
- id: works_end
  text: 변전소 공사가 일찍 끝납니다. {{export_cap}} MW 한도는 {{works_end}} 00:00까지만 적용되고, 그 뒤로는 계약서의 30 MW가 다시 적용됩니다.
- id: dso_day
  text: 선로 작업 때문에 배전사업자가 {{dso_day}} 18:00~21:00에 사업장 송전을 제한합니다.
- id: dso_limit
  text: 배전사업자 제한 시간대에는 사업장 송전이 최대 {{dso_mw}} MW입니다. 이 시간에 방전할 때는 태양광 + 방전 − 충전이 {{dso_mw}} MW 이하여야 합니다.
- id: maintenance_outage
  text: '{{outage_day}} 08:00~20:00에는 인버터 점검으로 배터리가 정지되므로, 이 구간에는 충전도 방전도 하지 않습니다.'
