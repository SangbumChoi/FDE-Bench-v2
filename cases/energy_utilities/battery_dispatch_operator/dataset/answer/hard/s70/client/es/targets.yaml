- id: efficiency
  kind: ambiguous
  domain: calculation
  text: La eficiencia se modela por sentido, un 90 % en la carga y un 94 % en la descarga (no como el
    84,6 % de ida y vuelta aplicado una sola vez); cargar P MW durante un cuarto de hora añade 0,25*P*0,90
    MWh y descargar P MW retira 0,25*P/0,94 MWh.
- id: soc_window
  kind: ambiguous
  domain: business rule
  text: La garantía exige un estado de carga entre el 10 % y el 90 % (de 4 a 36 MWh) en todo momento,
    un margen más estrecho que el 5 %-95 % del fabricante.
- id: start_end_soc
  kind: missing
  domain: business rule
  text: La batería arranca la semana con un estado de carga del 50 % (20 MWh) y debe terminarla con un
    40 % (16 MWh) o más de carga.
- id: export_cap
  kind: ambiguous
  domain: data semantics
  text: El límite de vertido es temporalmente de 12 MW (no los 30 MW del contrato); mientras se descarga,
    solar + descarga − carga no puede superar 12 MW, y la solar por encima de 12 MW se recorta salvo que
    la batería la absorba.
- id: grid_charging
  kind: missing
  domain: business rule
  text: Cargar desde la solar se permite siempre, pero tomar energía de la red solo en los cuartos de
    hora que empiezan entre las 00:00 y las 05:45 hora local (máximo 20 MW); nunca se carga y descarga
    en el mismo cuarto de hora.
- id: quarter_settlement
  kind: ambiguous
  domain: data semantics
  text: La liquidación es por cuartos de hora; el precio horario se aplica a los cuatro cuartos de la
    hora, los MW son medias del cuarto de hora y la energía es MW × 0,25.
- id: dst_clock
  kind: missing
  domain: data semantics
  text: Las horas son locales y el domingo 28 de marzo se adelanta el reloj, así que ese día tiene 23
    horas, no hay filas de 02:00 a 02:45 y el plan tiene exactamente 668 filas.
- id: evening_reserve
  kind: missing
  domain: business rule
  text: La política de la empresa exige mantener al menos un 15 % (6 MWh) de estado de carga en todo momento
    entre las 18:00 y las 22:00, todos los días.
- id: degradation
  kind: missing
  domain: calculation
  text: Cada MWh cargado más descargado en el contador cuesta 15 EUR de degradación, que se resta del
    beneficio.
- id: profit_scoring
  kind: missing
  domain: scoring
  text: El plan se evalúa a precios reales como ingresos por vertido menos coste de la energía tomada
    de la red, menos lo que ganaría la solar sola (ambos recortados al límite de vertido), menos el coste
    de degradación de la energía cargada más descargada.
- id: works_end
  kind: missing
  domain: business rule
  text: Las obras de la subestación terminan antes; el límite de 12 MW rige hasta el viernes 26 de marzo
    a las 00:00 y desde entonces vuelven a aplicarse los 30 MW del contrato.
- id: dso_limit
  kind: missing
  domain: business rule
  text: La distribuidora limita el vertido del emplazamiento a 5 MW el martes 23 de marzo de 18:00 a 21:00;
    si la batería descarga en esas horas, solar + descarga − carga no puede superar 5 MW.
- id: maintenance_outage
  kind: missing
  domain: business rule
  text: La batería está fuera de servicio por mantenimiento del inversor el miércoles 24 de marzo de 08:00
    a 20:00; en esos cuartos de hora no carga ni descarga.
