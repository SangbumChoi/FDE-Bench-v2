- id: efficiency
  kind: ambiguous
  domain: calculation
  text: 効率は往復 84.6% を1回掛けるのではなく、方向別に充電 95%、放電 89% で計算します。P MW で15分充電すると 0.25*P*0.95 MWh 増え、P MW で放電すると
    0.25*P/0.89 MWh 減ります。
- id: soc_window
  kind: ambiguous
  domain: business rule
  text: 保証条件により充電率は常に 5%〜95%（2〜38 MWh）で、メーカーの範囲と同じです。
- id: start_end_soc
  kind: missing
  domain: business rule
  text: 蓄電池は週を 50%（20 MWh）で始め、50%（20 MWh）以上で終える必要があります。
- id: export_cap
  kind: ambiguous
  domain: data semantics
  text: 送電上限は契約書の 30 MW ではなく一時的に 15 MW です。放電中は 太陽光 + 放電 − 充電 が 15 MW を超えてはならず、15 MW を超える太陽光は蓄電池で吸収しない限り抑制されます。
- id: grid_charging
  kind: missing
  domain: business rule
  text: 太陽光からの充電はいつでも可能ですが、系統からの受電は現地時刻 01:00〜04:45 に始まる区間のみ（最大 20 MW）で、同じ区間で充電と放電を同時に行いません。
- id: quarter_settlement
  kind: ambiguous
  domain: data semantics
  text: 精算は15分単位で、時間ごとの価格がその時間の4区間すべてに適用され、MW は区間平均、電力量は MW × 0.25 です。
- id: dst_clock
  kind: missing
  domain: data semantics
  text: 時刻は現地時刻で、3月28日（日）に夏時間が始まるため、その日は23時間で 02:00〜02:45 の行がなく、計画はちょうど668行です。
- id: evening_reserve
  kind: missing
  domain: business rule
  text: 会社の方針として、毎日 16:00〜20:00 の間は常に充電率 20%（8 MWh）以上を保ちます。
- id: degradation
  kind: missing
  domain: calculation
  text: 計量点での充電量と放電量 1 MWh ごとに劣化コスト 5 ユーロがかかり、利益から差し引かれます。
- id: profit_scoring
  kind: missing
  domain: scoring
  text: 実際の価格で、サイトの送電収入から受電コストと太陽光単独の収入（どちらも送電上限まで）を差し引き、さらに充電量と放電量の合計にかかる劣化コストを差し引きます。
- id: works_end
  kind: missing
  domain: business rule
  text: 変電所工事が早めに終わります。15 MW の上限は 3月24日（水） 00:00 までで、その後は契約書どおりの 30 MW に戻ります。
- id: dso_limit
  kind: missing
  domain: business rule
  text: 配電事業者が 3月25日（木） 18:00〜21:00 のサイト送電を 10 MW に制限します。この時間に放電するときは 太陽光 + 放電 − 充電 が 10 MW 以下でなければなりません。
- id: maintenance_outage
  kind: missing
  domain: business rule
  text: 3月22日（月） 08:00〜20:00 はインバーター点検のため蓄電池が停止し、この区間は充電も放電もできません。
