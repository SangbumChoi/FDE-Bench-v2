- id: efficiency
  kind: ambiguous
  domain: calculation
  text: 效率按方向分别计算，充电 95%、放电 89%（而不是把 84.6% 的往返效率只算一次）；以 P MW 充电一个时段增加 0.25*P*0.95 MWh，放电 P MW 减少 0.25*P/0.89
    MWh。
- id: soc_window
  kind: ambiguous
  domain: business rule
  text: 质保要求荷电状态任何时刻都在 5% 到 95%（2-38 MWh）之间，与厂家的范围相同。
- id: start_end_soc
  kind: missing
  domain: business rule
  text: 电池整周以 50%（20 MWh）开始，结束时必须不低于 50%（20 MWh）。
- id: export_cap
  kind: ambiguous
  domain: data semantics
  text: 上网上限临时为 15 MW（不是协议里的 30 MW）；放电时光伏 + 放电 − 充电 不得超过 15 MW，光伏超过 15 MW 的部分会被限发，除非电池充进去。
- id: grid_charging
  kind: missing
  domain: business rule
  text: 用光伏充电任何时候都可以，但从电网取电只能在当地时间 01:00-04:45 开始的时段（最多 20 MW）；同一时段不能既充又放。
- id: quarter_settlement
  kind: ambiguous
  domain: data semantics
  text: 按 15 分钟结算；每小时电价适用于该小时的 4 个时段，功率是时段平均值，电量 = MW × 0.25。
- id: dst_clock
  kind: missing
  domain: data semantics
  text: 时间均为当地时间，3月28日周日开始夏令时，当天只有 23 小时、没有 02:00-02:45，计划正好 668 行。
- id: evening_reserve
  kind: missing
  domain: business rule
  text: 公司规定每天 16:00 到 20:00 之间任何时刻荷电状态都不低于 20%（8 MWh）。
- id: degradation
  kind: missing
  domain: calculation
  text: 计量点每充进加放出 1 MWh，计 5 欧元的损耗成本，从利润中扣除。
- id: profit_scoring
  kind: missing
  domain: scoring
  text: 按实际电价评分：场站上网收入减去下网成本，再减去光伏单独运行的收入（两者都以上网上限封顶），再减去充放电吞吐量的损耗成本。
- id: works_end
  kind: missing
  domain: business rule
  text: 变电站施工提前完工：15 MW 的上限只到 3月24日（周三） 00:00，之后恢复协议规定的 30 MW。
- id: dso_limit
  kind: missing
  domain: business rule
  text: 配电公司把 3月25日（周四） 18:00 到 21:00 的场站上网限制在 10 MW；这段时间放电时，光伏 + 放电 − 充电 不得超过 10 MW。
- id: maintenance_outage
  kind: missing
  domain: business rule
  text: 3月22日（周一） 08:00 到 20:00 电池因逆变器检修停运：这些时段内不能充电也不能放电。
