- id: efficiency
  kind: ambiguous
  domain: calculation
  text: La eficiencia se modela por sentido, un 95 % en la carga y un 89 % en la descarga (no como el
    84,6 % de ida y vuelta aplicado una sola vez); cargar P MW durante un cuarto de hora añade 0,25*P*0,95
    MWh y descargar P MW retira 0,25*P/0,89 MWh.
- id: soc_window
  kind: ambiguous
  domain: business rule
  text: La garantía exige un estado de carga entre el 5 % y el 95 % (de 2 a 38 MWh) en todo momento, el
    mismo margen que el del fabricante.
- id: start_end_soc
  kind: missing
  domain: business rule
  text: La batería arranca la semana con un estado de carga del 50 % (20 MWh) y debe terminarla con un
    50 % (20 MWh) o más de carga.
- id: export_cap
  kind: ambiguous
  domain: data semantics
  text: El límite de vertido es temporalmente de 15 MW (no los 30 MW del contrato); mientras se descarga,
    solar + descarga − carga no puede superar 15 MW, y la solar por encima de 15 MW se recorta salvo que
    la batería la absorba.
- id: grid_charging
  kind: missing
  domain: business rule
  text: Cargar desde la solar se permite siempre, pero tomar energía de la red solo en los cuartos de
    hora que empiezan entre las 01:00 y las 04:45 hora local (máximo 20 MW); nunca se carga y descarga
    en el mismo cuarto de hora.
- id: quarter_settlement
  kind: ambiguous
  domain: data semantics
  text: La liquidación es por cuartos de hora; el precio horario se aplica a los cuatro cuartos de la
    hora, los MW son medias del cuarto de hora y la energía es MW × 0,25.
- id: dst_clock
  kind: missing
  domain: data semantics
  text: Las horas son locales y el domingo 28 de marzo se adelanta el reloj, así que ese día tiene 23
    horas, no hay filas de 02:00 a 02:45 y el plan tiene exactamente 668 filas.
- id: evening_reserve
  kind: missing
  domain: business rule
  text: La política de la empresa exige mantener al menos un 20 % (8 MWh) de estado de carga en todo momento
    entre las 16:00 y las 20:00, todos los días.
- id: degradation
  kind: missing
  domain: calculation
  text: Cada MWh cargado más descargado en el contador cuesta 5 EUR de degradación, que se resta del beneficio.
- id: profit_scoring
  kind: missing
  domain: scoring
  text: El plan se evalúa a precios reales como ingresos por vertido menos coste de la energía tomada
    de la red, menos lo que ganaría la solar sola (ambos recortados al límite de vertido), menos el coste
    de degradación de la energía cargada más descargada.
