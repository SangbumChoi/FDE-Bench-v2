- id: efficiency
  kind: ambiguous
  domain: calculation
  text: 効率は往復 84.6% を1回掛けるのではなく、方向別に充電 90%、放電 94% で計算します。P MW で15分充電すると 0.25*P*0.90 MWh 増え、P MW で放電すると
    0.25*P/0.94 MWh 減ります。
- id: soc_window
  kind: ambiguous
  domain: business rule
  text: 保証条件により充電率は常に 10%〜90%（4〜36 MWh）で、メーカーの 5%〜95% より狭い範囲です。
- id: start_end_soc
  kind: missing
  domain: business rule
  text: 蓄電池は週を 50%（20 MWh）で始め、40%（16 MWh）以上で終える必要があります。
- id: export_cap
  kind: ambiguous
  domain: data semantics
  text: 送電上限は契約書の 30 MW ではなく一時的に 12 MW です。放電中は 太陽光 + 放電 − 充電 が 12 MW を超えてはならず、12 MW を超える太陽光は蓄電池で吸収しない限り抑制されます。
- id: grid_charging
  kind: missing
  domain: business rule
  text: 今週はサイトがいつでも系統から充電できます（最大 20 MW）が、同じ区間で充電と放電を同時に行いません。
- id: quarter_settlement
  kind: ambiguous
  domain: data semantics
  text: 精算は15分単位で、時間ごとの価格がその時間の4区間すべてに適用され、MW は区間平均、電力量は MW × 0.25 です。
- id: dst_clock
  kind: missing
  domain: data semantics
  text: 時刻は現地時刻で、3月28日（日）に夏時間が始まるため、その日は23時間で 02:00〜02:45 の行がなく、計画はちょうど668行です。
- id: profit_scoring
  kind: missing
  domain: scoring
  text: 実際の価格で、サイトの送電収入から受電コストと太陽光単独の収入（どちらも送電上限まで）を差し引きます。
