- id: road_distance
  kind: missing
  domain: calculation
  text: Road distance is 1.3 times the straight-line distance; coordinates are kilometres from the kitchen at (0, 0).
- id: speed
  kind: missing
  domain: calculation
  tiers: [easy, medium]
  text: Vans drive at 25 km/h on average all morning; there is no rush hour this Monday (school holiday).
- id: rush_hour
  kind: missing
  domain: calculation
  tiers: [hard]
  text: "Vans drive at 30 km/h until {{rush_start}} and at 20 km/h from {{rush_start}} on (morning rush hour); a van still on the road at {{rush_start}} slows down from then."
- id: service_time
  kind: missing
  domain: calculation
  text: Unloading at a café takes 4 minutes plus 0.2 minutes per tray.
- id: shift
  kind: missing
  domain: business rule
  text: "Vans may leave from 05:00 and must be back at the kitchen by {{shift_end}}."
- id: tray_limit
  kind: ambiguous
  domain: data semantics
  when: {van_capacity: [100, 110]}
  text: "max_trays (120) is what the racks hold, but this week's deeper crates limit a van to {{van_capacity}} trays."
- id: closed_cafe
  kind: missing
  domain: business rule
  text: "The {{closed_cafe}} is closed this week for renovation and must not be served."
- id: cold_chain
  kind: ambiguous
  domain: data semantics
  tiers: [medium, hard]
  text: Partner-brand cafés sell chilled products and may only be served by the refrigerated van V4.
- id: partner_this_week
  kind: ambiguous
  domain: data semantics
  tiers: [easy]
  text: This week the partner brings its chilled range itself, so any van may serve the partner-brand cafés.
- id: one_visit
  kind: ambiguous
  domain: business rule
  text: Each café receives all its trays in one visit from one van; deliveries are never split.
- id: premium_first
  kind: missing
  domain: business rule
  text: "<!-- when: premium_first=true -->On every route, premium cafés must be visited before standard cafés.<!-- /when --><!-- when: premium_first=false -->The premium-first habit is suspended this week: the cafés on a route may come in any order.<!-- /when -->"
- id: lateness
  kind: missing
  domain: scoring
  text: "Arriving after deliver_by is allowed but every late minute costs as much as {{late_cost}} minutes of van time; arriving before opening means waiting."
- id: workshop
  kind: missing
  domain: business rule
  tiers: [hard]
  text: On Monday V2 is in the workshop for its brake check until 06:40 and cannot leave the kitchen before then.
- id: manager_pressure
  kind: missing
  domain: business rule
  tiers: [hard]
  text: The East Lake café (C07) manager's demand to be the first stop before 06:30 is not a rule; she gets her trays between opens and deliver_by like every café.
