# The explainer's case texts in Simplified Chinese (English comes from case.yaml).
role: 面包店配送调度员
task_type: 组合优化
deliverable_spec: |
  routes.json = {"routes": [{"van": "<车辆编号，如 V1>", "depart": "HH:MM（可选，默认 05:00）",
                             "stops": ["<按到访顺序排列的门店编号，如 C03>", ...]}, ...]}
  每辆用到的车一条；编号与数据中完全一致。
tiers:
  easy: >-
    配送路线的核心规则：本周每辆车的托盘上限、司机班次（05:00 起出发，班次结束前返回厨房）、每家门店只送一次、本周停业的门店、恒定 25 公里/小时的车速（本周一没有早高峰）以及迟到成本。本周合作方自行配送冷藏商品，因此任何车辆都可以给合作品牌门店送货；旗舰店优先的习惯暂停。
  medium: >-
    在 easy 的基础上，加上合作方冷链（合作品牌门店只能由冷藏车 V4 配送），以及规则种子抽到时的旗舰店优先习惯（每条路线上旗舰店都排在标准店之前）。
  hard: >-
    在 medium 的基础上，加上早高峰（抽到的时刻之前 30 公里/小时，从该时刻起 20 公里/小时，已在途中的路段同样适用）、一个带日期的事件（周一 V2 在修理厂待到 06:40），以及一位旗舰店店长坚持要做早上第一站的施压（不是规则）。
rules:
  van_capacity: 本周每辆车最多装 {{van_capacity}} 个托盘（货架可放 120 个）。
  shift_window: 车辆不早于 05:00 出发，并在 {{shift_end}} 前回到厨房。
  van_ready: 周一 V2 在修理厂待到 06:40，不早于 06:40 从厨房出发。
  closed_cafe: 不给本周停业的门店（{{closed_cafe}}）送货。
  serve_each_once: 每家营业门店的全部托盘都在恰好一次到访中送达。
  cold_chain: 合作品牌门店（冷藏商品）只能由冷藏车配送。
  premium_first: 每条路线上，旗舰店都先于标准店到访。
