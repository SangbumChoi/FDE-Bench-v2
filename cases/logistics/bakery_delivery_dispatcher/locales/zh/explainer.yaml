# The explainer's case texts in Simplified Chinese (English comes from case.yaml).
role: 面包店配送调度员
task_type: 组合优化
deliverable_spec: |
  routes.json = {"routes": [{"van": "<车辆编号，如 V1>", "depart": "HH:MM（可选，默认 05:00）",
                             "stops": ["<按到访顺序排列的门店编号，如 C03>", ...]}, ...]}
  每辆用到的车一条；编号与数据中完全一致。
tiers:
  easy: >-
    配送路线的核心规则：本周每辆车的托盘上限、本周停业的门店、行车时间（道路距离、恒定 25 公里/小时的车速，本周一没有早高峰、卸货时间）、迟到一分钟的成本，以及车辆 10:00 前返回。本周合作方自行配送冷藏商品，因此任何车辆都可以给合作品牌门店送货；旗舰店优先的习惯暂停。
  medium: >-
    在 easy 的基础上，加上合作方冷链（合作品牌门店只能由冷藏车 V4 配送），以及规则种子抽到时的旗舰店优先习惯（每条路线上旗舰店都排在标准店之前）。
  hard: >-
    在 medium 的基础上，托盘上限固定为 110，并加上早高峰（抽到的时刻之前 30 公里/小时，从该时刻起 20 公里/小时，已在途中的路段同样适用）、抽到的司机下班时间（09:00 到 10:00）、一个带日期的事件（周一 V2 在修理厂待到 06:40），以及一位旗舰店店长坚持要做早上第一站的施压（不是规则）。
rules:
  van_capacity: 本周每辆车最多装 {{van_capacity}} 个托盘（货架可放 120 个）。
  shift_window: 车辆不早于 05:00 出发，并在 {{shift_end}} 前回到厨房。
  van_ready: 周一 V2 在修理厂待到 06:40，不早于 06:40 从厨房出发。
  closed_cafe: 不给本周停业的门店（{{closed_cafe}}）送货。
  serve_each_once: 每家营业门店的全部托盘都在恰好一次到访中送达。
  cold_chain: 合作品牌门店（冷藏商品）只能由冷藏车配送。
  premium_first: 每条路线上，旗舰店都先于标准店到访。
shortcuts:
  id_order: "每辆车一条路线，按门店编号顺序：C01、C02……先装上 V1 直到托盘上限，再依次装 V2、V3、V4。"
  opening_order: "按门店开门的先后，先装上 V1 直到托盘上限，再依次装 V2、V3、V4（只看时间，不看位置）。"
  nearest_neighbour: "不看送货时间窗的最近邻：每辆车总是开往最近的未送门店，装满托盘上限后，下一辆车从厨房出发。"
  map_slices: "把地图围绕厨房切成四块，每辆车一块，块内按门店开门的先后配送。"
  habit_best_departures: "照搬客户自己的做法，只改一处，即时间：调度员的路线不变，每辆车改在最佳时刻出发（每条路线也按这个出发时刻排成最好的顺序）。"
  habit_one_move: "照搬客户自己的做法，只改一处：把移动后省时最多的那一家门店挪到别的位置。"
  insertion_without_departures: "知道全部规则和客户的行车时间，用最省插入法排车，但文件里不写出发时间（每辆车都按默认的 05:00 出发）。"
  deadline_balanced: "按最晚到货的先后，把每家门店交给目前托盘最少的车（有冷链时合作品牌门店归 V4，有习惯时旗舰店在前），每辆车在最佳时刻出发。"
  literal_plus_closed_cafe_planner_guess: "字面方案，知道哪家店关门，行车时间则像没人告知时的调度员那样估计：直线距离的 1.3 倍、时速 25 公里、每站五分钟。"
  literal_plus_closed_cafe: "字面方案，只补上 closed_cafe 这条规则背后的客户信息（据此重新排车，其余仍按字面理解）。"
  literal_plus_van_capacity: "字面方案，只补上 van_capacity 这条规则背后的客户信息（据此重新排车，其余仍按字面理解）。"
  literal_plus_shift_window: "字面方案，只补上 shift_window 这条规则背后的客户信息（据此重新排车，其余仍按字面理解）。"
  literal_plus_cold_chain: "字面方案，只补上 cold_chain 这条规则背后的客户信息（据此重新排车，其余仍按字面理解）。"
  literal_plus_premium_first: "字面方案，只补上 premium_first 这条规则背后的客户信息（据此重新排车，其余仍按字面理解）。"
  literal_plus_van_ready: "字面方案，只补上 van_ready 这条规则背后的客户信息（据此重新排车，其余仍按字面理解）。"
