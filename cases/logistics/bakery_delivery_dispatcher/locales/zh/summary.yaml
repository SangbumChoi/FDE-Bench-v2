# The case in plain words, shown at the top of its page.
task: >-
  一家面包店的中央厨房每天早上用 4 辆车把面包托盘送到各门店。AI 要排出周一早上的配送路线：哪辆车去哪些门店、按什么顺序、几点出发，目的是让门店按时拿到托盘，同时让司机在外的时间尽量短。交付物是 `routes.json`：每辆用到的车写明出发时间和按到访顺序排列的门店。
given:
  - "客户的需求：三句话，请人排一下明天（周一）早上 4 辆车谁去哪里，“让门店按时拿到托盘，司机也别在外面跑太久”。完全没有提到任何上限或规定。"
  - "`门店清单.csv`：18 家门店（C01 至 C18）的地图坐标（公里，`东西坐标_km`、`南北坐标_km`）、每家要送的托盘数（10 至 29 个，共 332 个）、旗舰店还是标准店、开门时间（06:00 至 07:30）、最晚到货时间（`最晚到货`，开门后 30 至 60 分钟）以及是否为合作品牌门店（C05、C10、C16）。本周有一家门店停业，但文件里没有写是哪家。"
  - "`车辆.csv`：4 辆车（V1 至 V4），`最大托盘数` 都写着 120；只有 V4 是冷藏车。"
ask:
  - "怎样把地图换算成行车时间：坐标是相对中央厨房 (0, 0) 的公里数，道路距离是直线距离的 1.3 倍，整个早上平均车速 25 公里/小时。hard 中改为早高峰：随版本不同，06:30、07:00 或 07:30 之前 30 公里/小时，从该时刻起 20 公里/小时，已在路上的车也从那一刻起减速。"
  - "每到一家门店怎么算：每家门店的托盘由一辆车一次送完；卸货需要 4 分钟，另加每托盘 0.2 分钟；开门前到达的车要等到门店开门。"
  - "司机的班次：车辆最早 05:00 出发，随版本不同，必须在 09:00、09:30 或 10:00 前回到厨房。hard 中，V2 周一在修理厂，06:40 之前不能出发。"
  - "本周每辆车的托盘上限：随版本不同，为 100、110 或 120 个（hard 中固定为 110 个）。文件里的 120 是货架能放的数量，但新的加深周转箱可能让上限更低。"
  - "本周哪家门店装修停业、不能送货：随版本不同，为南山店（C11）、北站店（C03）或梧桐里店（C14）。"
  - "哪些车可以去合作品牌门店：easy 中哪辆车都可以（本周冷藏商品由合作方自己配送）；medium 和 hard 中只有冷藏车 V4 可以。"
  - "每条路线上旗舰店是否必须排在标准店之前：easy 中不需要（这个习惯暂停）；medium 和 hard 中，有的版本要遵守，有的不用。hard 中东湖店（C07）店长要求 06:30 之前做早上第一站，这不是规定。"
  - "晚到的代价：晚到门店也会收货，但每晚于 `最晚到货` 一分钟，算作车辆在外 2、3 或 5 分钟（随版本不同）。"
invalid_if:
  - "无法读取：没有 `routes.json`，出现数据里没有的车辆或门店编号，同一辆车有两条路线，或出发时间不是 HH:MM 格式。"
  - "某辆车装的托盘超过本周上限（100、110 或 120 个；hard 中为 110 个）。"
  - "有车 05:00 之前出发，或在班次结束时间（09:00、09:30 或 10:00）之后才回到厨房；hard 中 V2 在 06:40 之前出发也算。"
  - "给停业门店送货、漏掉营业中的门店，或同一家门店送了不止一次。"
  - "medium 和 hard 中，让 V4 以外的车去合作品牌门店（C05、C10、C16）。"
  - "在 medium 和 hard 中要遵守旗舰店优先习惯的版本里，任何一条路线在标准店之后又去旗舰店。但如果公司政策允许放宽这个习惯，且 AI 事先向客户申请了例外，则算有效。"
quality: >-
  越低越好：所有车辆从离开厨房到回来的在外时间（分钟）之和（等门店开门的时间也算在内），加上门店晚于 `最晚到货` 的分钟数乘以 2、3 或 5。客户原来的做法（记 0 分）以厨房为中心把地图切成扇形，按 V1、V2、V3、V4 的顺序装满，先送旗舰店，并让所有车尽早出发，于是车在还没开门的门店前干等，最后几家又送晚了（本页各版本约 1,140 至 1,980 分钟）；参考答案（记 1 分）是一种计算机搜索，不断在路线之间挪动门店来改进方案，并按 5 分钟的步长为每辆车选最好的出发时间（约 420 至 710 分钟）。
tiers:
  easy: >-
    配送路线的核心：托盘上限、班次结束时间、每家门店只送一次、停业门店、恒定 25 公里/小时的车速和晚到的代价。任何车辆都可以去合作品牌门店，也不必先送旗舰店。
  medium: >-
    加上冷链（合作品牌门店 C05、C10、C16 只能由冷藏车 V4 配送），部分版本还要遵守旗舰店优先习惯（每条路线上旗舰店排在标准店之前）。
  hard: >-
    加上早高峰（先是 30 公里/小时，从 06:30、07:00 或 07:30 起变为 20 公里/小时）、在修理厂待到 06:40 的 V2，以及东湖店（C07）店长要求 06:30 之前做第一站。这个要求不是规定：她的店 07:00 才开门，照办只会让车干等。托盘上限固定为 110 个。
