- id: road_distance
  text: 道路距离按直线距离的 1.3 倍计算；坐标是相对厨房 (0, 0) 的公里数。
- id: speeds
  text: 07:00 之前出发的路段按 30 公里/小时，07:00 及之后出发的路段按 20 公里/小时。
- id: service_time
  text: 每家门店卸货 4 分钟，另加每托盘 0.2 分钟。
- id: shift
  text: 车辆最早 05:00 出发，必须在 09:30 前回到厨房。
- id: closed_c11
  text: 钟楼店（C11）本周装修停业，不能送货。
- id: cold_chain
  text: 合作品牌门店销售冷藏商品，只能由冷藏车 V4 配送。
- id: one_visit
  text: 每家门店的托盘由一辆车一次送完，不能拆分配送。
- id: premium_first
  text: 每条路线上旗舰店必须排在标准店之前。
- id: lateness
  text: 晚于最晚到货时间到达是允许的，但每晚一分钟按三分钟计入总路线时间；早于开门时间到达需要等待。
