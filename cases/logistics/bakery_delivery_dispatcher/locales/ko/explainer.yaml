# The explainer's case texts in Korean (English comes from case.yaml).
role: 베이커리 배송 배차 담당자
task_type: 조합 최적화
deliverable_spec: |
  routes.json = {"routes": [{"van": "<차량 ID, 예: V1>", "depart": "HH:MM (선택, 기본값 05:00)",
                             "stops": ["<방문 순서대로 매장 ID, 예: C03>", ...]}, ...]}
  사용하는 차량마다 항목 하나를 두며, ID는 데이터에 있는 그대로 씁니다.
tiers:
  easy: >-
    배송 경로의 핵심: 이번 주 차량당 트레이 한도, 기사 근무 시간(05:00부터 출발, 근무 종료 전 복귀), 매장마다 한 번 방문, 이번 주 휴점 매장, 아침 내내 시속 25km 고정(이번 월요일은 출근 정체 없음), 지각 비용. 이번 주에는 제휴사가 냉장 상품을 직접 배송하므로 제휴브랜드 매장도 어느 차량이 가도 되고, 프리미엄 우선 관행은 쉽니다.
  medium: >-
    easy에 더해 제휴사 냉장 유통(제휴브랜드 매장은 냉장 차량 V4만 배송)과, 규칙 시드가 뽑은 경우 프리미엄 우선 관행(모든 경로에서 프리미엄 매장을 일반 매장보다 먼저)이 적용됩니다.
  hard: >-
    medium에 더해 출근 정체(뽑힌 시각 전에는 시속 30km, 그 시각부터 시속 20km, 주행 중인 구간도 감속), 날짜가 정해진 사건(월요일에 V2가 06:40까지 정비소에 있음), 아침 첫 방문지가 되겠다고 고집하는 프리미엄 매장 점장의 압박(규칙 아님)이 더해집니다.
rules:
  van_capacity: 이번 주 차량 한 대에는 트레이를 최대 {{van_capacity}}개까지 싣습니다(선반에는 120개가 들어감).
  shift_window: 차량은 05:00부터 출발할 수 있고 {{shift_end}}까지 주방에 돌아와야 합니다.
  van_ready: 월요일에 V2는 06:40까지 정비소에 있으므로 06:40 전에는 주방에서 출발하지 않습니다.
  closed_cafe: 이번 주 휴점인 매장({{closed_cafe}})에는 배송하지 않습니다.
  serve_each_once: 영업 중인 모든 매장은 정확히 한 번의 방문으로 트레이를 모두 받습니다.
  cold_chain: 제휴브랜드 매장(냉장 상품)은 냉장 차량만 배송합니다.
  premium_first: 모든 경로에서 프리미엄 매장을 일반 매장보다 먼저 방문합니다.
