# The explainer's case texts in Korean (English comes from case.yaml).
role: 베이커리 배송 배차 담당자
task_type: 조합 최적화
deliverable_spec: |
  routes.json = {"routes": [{"van": "<차량 ID, 예: V1>", "depart": "HH:MM (선택, 기본값 05:00)",
                             "stops": ["<방문 순서대로 매장 ID, 예: C03>", ...]}, ...]}
  사용하는 차량마다 항목 하나를 두며, ID는 데이터에 있는 그대로 씁니다.
tiers:
  easy: >-
    배송 경로의 핵심 규칙이 적용됩니다: 이번 주 차량당 트레이 한도, 이번 주 휴점 매장, 이동 시간(도로 거리, 시속 25km 고정으로 이번 월요일은 출근 정체 없음, 하차 시간), 늦은 1분의 비용, 10:00까지의 복귀. 이번 주에는 제휴사가 냉장 상품을 직접 배송하므로 어느 차량이든 제휴브랜드 매장에 배송할 수 있고, 프리미엄 우선 관행은 쉽니다.
  medium: >-
    easy에 더해 제휴사 콜드체인(제휴브랜드 매장은 냉장 차량 V4만 배송)과, 규칙 시드가 뽑은 경우 프리미엄 우선 관행(모든 경로에서 프리미엄 매장을 일반 매장보다 먼저 방문)이 적용됩니다.
  hard: >-
    medium에서 트레이 한도를 110으로 고정하고, 아침 출근 정체(뽑힌 시각 전에는 시속 30km, 그 시각부터 시속 20km, 이미 주행 중인 구간에도 적용), 뽑힌 기사 근무 종료 시각(09:00~10:00), 날짜가 정해진 이벤트(월요일에 V2가 06:40까지 정비소에 있음), 아침 첫 방문지가 되겠다고 고집하는 프리미엄 매장 점장의 압박(규칙 아님)이 더해집니다.
rules:
  van_capacity: 이번 주 차량 한 대에는 트레이를 최대 {{van_capacity}}개까지 싣습니다(선반에는 120개가 들어감).
  shift_window: 차량은 05:00부터 출발할 수 있고 {{shift_end}}까지 주방에 돌아와야 합니다.
  van_ready: 월요일에 V2는 06:40까지 정비소에 있으므로 06:40 전에는 주방에서 출발하지 않습니다.
  closed_cafe: 이번 주 휴점인 매장({{closed_cafe}})에는 배송하지 않습니다.
  serve_each_once: 영업 중인 모든 매장은 정확히 한 번의 방문으로 트레이를 모두 받습니다.
  cold_chain: 제휴브랜드 매장(냉장 상품)은 냉장 차량만 배송합니다.
  premium_first: 모든 경로에서 프리미엄 매장을 일반 매장보다 먼저 방문합니다.
shortcuts:
  id_order: "차량마다 경로 하나, 매장 번호 순서: C01, C02, …를 트레이 한도까지 V1에 싣고, 이어서 V2, V3, V4에 싣습니다."
  opening_order: "매장이 문을 여는 순서대로 트레이 한도까지 V1에 싣고, 이어서 V2, V3, V4에 싣습니다(위치가 아니라 시간만 봄)."
  nearest_neighbour: "납품 시간대를 보지 않는 최근접 이웃: 각 차량이 아직 배송하지 않은 가장 가까운 매장으로 가다가 트레이 한도에 이르면 다음 차량이 주방에서 출발합니다."
  map_slices: "주방을 중심으로 지도를 네 조각으로 나눠 차량마다 한 조각씩 맡고, 조각 안에서는 매장이 문을 여는 순서대로 배송합니다."
  habit_best_departures: "고객의 기존 방식을 그대로 베끼고 한 가지, 시간만 바꿉니다: 배차 담당자의 경로는 그대로 두고 각 차량을 가장 좋은 시각에 출발시킵니다(각 경로도 그 출발 시각에 가장 좋은 순서로 놓음)."
  habit_one_move: "고객의 기존 방식을 그대로 베끼고 한 가지만 바꿉니다: 옮겼을 때 가장 많이 절약되는 매장 하나를 다른 자리로 옮깁니다."
  insertion_without_departures: "모든 규칙과 고객의 이동 시간을 알고 최소 비용 삽입으로 짰지만, 파일에 출발 시각을 쓰지 않은 것(모든 차량이 기본값 05:00에 출발)."
  deadline_balanced: "납품마감 순서대로 매장마다 지금까지 트레이가 가장 적은 차량에 맡기고(콜드체인이 있으면 제휴 브랜드 매장은 V4, 관행이 있으면 프리미엄 매장 먼저), 각 차량을 가장 좋은 시각에 출발시킵니다."
  literal_plus_closed_cafe_planner_guess: "문자 그대로의 풀이에 문 닫은 매장만 알려 주고, 이동 시간은 아무도 알려 주지 않을 때 배차 담당자가 짐작하듯 정한 것: 직선 거리의 1.3배, 시속 25km, 매장마다 5분."
  literal_plus_closed_cafe: "문자 그대로의 풀이에 closed_cafe 규칙 뒤의 고객 사실 하나만 알려 준 것(그에 맞춰 다시 계획하고, 나머지는 문자 그대로 읽음)."
  literal_plus_van_capacity: "문자 그대로의 풀이에 van_capacity 규칙 뒤의 고객 사실 하나만 알려 준 것(그에 맞춰 다시 계획하고, 나머지는 문자 그대로 읽음)."
  literal_plus_shift_window: "문자 그대로의 풀이에 shift_window 규칙 뒤의 고객 사실 하나만 알려 준 것(그에 맞춰 다시 계획하고, 나머지는 문자 그대로 읽음)."
  literal_plus_cold_chain: "문자 그대로의 풀이에 cold_chain 규칙 뒤의 고객 사실 하나만 알려 준 것(그에 맞춰 다시 계획하고, 나머지는 문자 그대로 읽음)."
  literal_plus_premium_first: "문자 그대로의 풀이에 premium_first 규칙 뒤의 고객 사실 하나만 알려 준 것(그에 맞춰 다시 계획하고, 나머지는 문자 그대로 읽음)."
  literal_plus_van_ready: "문자 그대로의 풀이에 van_ready 규칙 뒤의 고객 사실 하나만 알려 준 것(그에 맞춰 다시 계획하고, 나머지는 문자 그대로 읽음)."
