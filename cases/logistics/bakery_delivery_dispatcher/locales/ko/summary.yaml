# The case in plain words, shown at the top of its page.
task: >-
  베이커리의 중앙 주방은 매일 아침 차량 4대로 매장에 빵 트레이를 배송합니다. AI는 월요일 아침 배송 경로를 짭니다. 어느 차량이
  어느 매장을 어떤 순서로 돌고 언제 출발할지를 정해서, 매장에 트레이가 늦지 않게 도착하고 기사들의 운행 시간은 최대한 짧게
  하는 것이 목적입니다. 산출물은 `routes.json`이며, 사용하는 차량마다 출발 시각과 방문 순서대로 매장을 적습니다.
given:
  - "고객의 요청: 내일(월요일) 아침 차량 4대로 어느 차가 어디로 갈지, \"매장에 트레이가 늦지 않게 도착하고, 기사님들이 필요 이상으로 오래 운행하지 않도록\" 짜 달라는 세 문장입니다. 한도나 규칙, 주행 시간은 전혀 말하지 않습니다."
  - "`매장목록.csv`: 매장 18곳(C01~C18)의 지도 좌표(km, `동서좌표_km`·`남북좌표_km`), 매장별 트레이 수(8~29개, 모두 356개), 프리미엄·일반 등급, 오픈시간(06:00~08:00, 프리미엄 매장이 먼저 열지만 동호수점 C07은 예외), 납품마감(오픈 30~60분 뒤), 제휴브랜드 매장 여부(C05, C10, C16)입니다. 이번 주 휴점하는 매장이 한 곳 있지만 파일에는 어디인지 나오지 않습니다."
  - "`차량.csv`: 차량 4대(V1~V4)이며 모두 `최대트레이` 120으로 적혀 있습니다. 냉장 차량은 V4뿐입니다."
ask:
  - "지도를 주행 시간으로 바꾸는 방법입니다. 좌표는 중앙 주방(0, 0)에서의 km이고, 도로 거리는 직선 거리의 1.3배이며, 차량은 아침 내내 평균 시속 25km로 달립니다. hard에서는 대신 출근 정체가 있습니다. 버전에 따라 06:30, 07:00, 07:30 중 정해진 시각 전까지는 시속 30km, 그 시각부터는 시속 20km이고, 이미 주행 중인 차량도 그때부터 느려집니다."
  - "매장 한 곳을 들르는 방식입니다. 하차에는 4분에 트레이 1개당 0.2분이 더 걸리고, 오픈 전에 도착한 차량은 오픈할 때까지 기다리며, 각 매장의 트레이는 한 차량이 한 번에 모두 배송합니다."
  - "기사 근무 시간입니다. 차량은 05:00부터 출발할 수 있고, easy와 medium에서는 10:00까지, hard에서는 버전에 따라 09:00, 09:30, 10:00 중 정해진 시각까지 주방에 돌아와야 합니다. hard에서는 V2가 월요일에 정비소에 있어 06:40 전에는 출발할 수 없습니다."
  - "이번 주 차량당 트레이 한도입니다. 버전에 따라 100개, 110개, 120개 중 하나입니다(hard에서는 항상 110개). 파일의 120은 선반에 들어가는 수량이고, 새로 바꾼 깊은 운반 상자 때문에 한도가 더 낮을 수 있습니다."
  - "이번 주 리모델링으로 휴점해서 배송하면 안 되는 매장입니다. 버전에 따라 남산점(C11), 북역점(C03), 단풍길점(C14) 중 한 곳입니다."
  - "제휴브랜드 매장에 어느 차량이 갈 수 있는지입니다. easy에서는 어느 차량이든 됩니다(이번 주에는 제휴사가 냉장 상품을 직접 배송). medium과 hard에서는 냉장 차량 V4만 갈 수 있습니다."
  - "모든 경로에서 프리미엄 매장을 일반 매장보다 먼저 방문해야 하는지입니다. easy에서는 그럴 필요가 없고(이 관행을 쉼), medium과 hard에서는 버전에 따라 다릅니다. hard에서 동호수점(C07) 점장님의 06:30 전 첫 방문 요구는 규칙이 아닙니다."
  - "늦은 도착의 비용입니다. 늦게 와도 매장에서 받아 주지만, `납품마감`보다 1분 늦을 때마다 차량 운행 3분과 같은 비용이 듭니다."
invalid_if:
  - "파일을 읽을 수 없습니다. `routes.json`이 없거나, 데이터에 없는 차량·매장 코드가 있거나, 한 차량에 경로가 두 개이거나, 출발 시각이 HH:MM 형식이 아닙니다."
  - "이번 주 한도(100개, 110개, 120개 중 하나, hard에서는 110개)보다 많은 트레이를 한 차량에 싣습니다."
  - "05:00 전에 출발하거나 근무 종료 시각(10:00, hard에서는 09:00, 09:30, 10:00 중 하나) 뒤에 주방에 돌아오는 차량이 있습니다. hard에서는 06:40 전에 출발하는 V2도 해당합니다."
  - "휴점 매장에 배송하거나, 영업 중인 매장을 빠뜨리거나, 한 매장을 두 번 이상 방문합니다."
  - "medium과 hard에서 제휴브랜드 매장(C05, C10, C16)에 V4가 아닌 차량을 보냅니다."
  - "medium과 hard 중 프리미엄 우선 관행을 지키는 버전에서, 어느 경로든 일반 매장 다음에 프리미엄 매장을 방문합니다. 단, 회사 정책이 이 규칙의 예외를 허용하고 AI가 먼저 고객에게 예외를 요청한 경우는 제외합니다."
quality: >-
  낮을수록 좋습니다. 모든 차량이 주방을 떠나서 돌아올 때까지의 운행 시간(분) 합계(매장 오픈을 기다린 시간 포함)에, 매장에
  `납품마감`보다 늦게 도착한 시간(분)의 3배를 더한 값입니다. 고객의 기존 방식(0점)은 배차 담당자가 손으로 짠 계획입니다. 매장을
  문 여는 순서대로 가장 먼저 도착할 수 있는 차량에 맡기고(또는 지도를 조각으로 나누고, 더 싼 쪽을 고름), 차량마다 매장을 가장
  좋은 순서로 놓고, 첫 매장이 문을 여는 시각에 맞춰 출발시킵니다(이 페이지의 버전에서 약 515~830분). 모범 답안(1점)은 매장을
  경로 사이로 계속 옮겨 보며 개선하고 차량마다 가장 좋은 출발 시각을 분 단위로 고르는 컴퓨터 탐색입니다(약 445~550분). 최적값이
  증명된 버전에서는 그 최적값과 3.4% 이내입니다.
tiers:
  easy: >-
    배송 경로의 핵심입니다. 트레이 한도, 휴점 매장, 일정한 시속 25km, 하차 시간, 늦은 도착의 비용이 적용되고 차량은 10:00까지
    돌아옵니다. 제휴브랜드 매장에는 어느 차량이든 갈 수 있고, 프리미엄 매장을 먼저 방문하지 않아도 됩니다.
  medium: >-
    콜드체인(제휴브랜드 매장 C05, C10, C16은 냉장 차량 V4만 배송)이 더해지고, 일부 버전에서는 프리미엄 우선 관행(모든 경로에서
    프리미엄 매장을 일반 매장보다 먼저 방문)도 더해집니다.
  hard: >-
    출근 정체(시속 30km였다가 06:30, 07:00, 07:30 중 정해진 시각부터 시속 20km), 일부 버전의 더 이른 근무 종료, 06:40까지
    정비소에 있는 V2, 06:30 전에 첫 방문지가 되겠다는 동호수점(C07) 점장님의 요구가 더해집니다. 이 요구는 규칙이 아닙니다. 그
    매장은 07:00에 열기 때문에 따르면 차량이 기다리기만 합니다. 트레이 한도는 항상 110개입니다.
