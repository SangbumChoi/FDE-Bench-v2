- id: road_distance
  text: 도로 거리는 직선 거리의 1.3배이며, 좌표는 주방(0, 0) 기준 km입니다.
- id: speeds
  text: 07:00 이전에 출발하는 구간은 시속 30km, 07:00 이후에 출발하는 구간은 시속 20km로 계산합니다.
- id: service_time
  text: 매장 하차 시간은 4분에 트레이 1개당 0.2분이 더해집니다.
- id: shift
  text: 차량은 05:00부터 출발할 수 있고 09:30까지 주방에 돌아와야 합니다.
- id: closed_c11
  text: 시계탑점(C11)은 이번 주 리모델링으로 휴점이라 배송하면 안 됩니다.
- id: cold_chain
  text: 제휴브랜드 매장은 냉장 상품을 판매하므로 냉장 차량 V4만 배송할 수 있습니다.
- id: one_visit
  text: 각 매장의 트레이는 한 차량이 한 번에 모두 배송하며, 나눠서 배송하지 않습니다.
- id: premium_first
  text: 모든 경로에서 프리미엄 매장을 일반 매장보다 먼저 방문해야 합니다.
- id: lateness
  text: 최종도착 이후 도착도 허용되지만 늦은 1분은 총 운행 시간에 3분으로 반영되며, 오픈 전에 도착하면 기다려야 합니다.
