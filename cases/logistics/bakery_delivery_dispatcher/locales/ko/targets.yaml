- id: road_distance
  text: 도로 거리는 직선 거리의 1.3배이며, 좌표는 주방(0, 0) 기준 km입니다.
- id: speed
  text: 아침 내내 평균 시속 25km로 계산하며, 이번 월요일은 학교 방학이라 출근 정체가 없습니다.
- id: rush_hour
  text: "{{rush_start}} 전까지는 시속 30km, {{rush_start}}부터는 시속 20km(출근 정체)이며, {{rush_start}}에 주행 중인 차량은 그때부터 속도가 떨어집니다."
- id: service_time
  text: 매장 하차 시간은 4분에 트레이 1개당 0.2분이 더해집니다.
- id: shift
  text: "차량은 05:00부터 출발할 수 있고 {{shift_end}}까지 주방에 돌아와야 합니다."
- id: tray_limit
  text: "최대트레이(120)는 선반에 들어가는 수량이지만, 이번 주에는 깊은 운반 상자 때문에 차량당 {{van_capacity}}개까지만 실을 수 있습니다."
- id: closed_cafe
  text: "{{closed_cafe}}은 이번 주 리모델링으로 휴점이라 배송하면 안 됩니다."
- id: cold_chain
  text: 제휴브랜드 매장은 냉장 상품을 판매하므로 냉장 차량 V4만 배송할 수 있습니다.
- id: partner_this_week
  text: 이번 주에는 제휴사가 냉장 상품을 직접 배송하므로, 제휴브랜드 매장도 어느 차량이 배송해도 됩니다.
- id: one_visit
  text: 각 매장의 트레이는 한 차량이 한 번에 모두 배송하며, 나눠서 배송하지 않습니다.
- id: premium_first
  text: "<!-- when: premium_first=true -->모든 경로에서 프리미엄 매장을 일반 매장보다 먼저 방문해야 합니다.<!-- /when --><!-- when: premium_first=false -->프리미엄 매장 우선 관행은 이번 주에 쉬므로, 경로 안의 매장 순서는 자유입니다.<!-- /when -->"
- id: lateness
  text: "납품마감보다 늦게 도착해도 되지만 늦은 1분마다 차량 운행 {{late_cost}}분과 같은 비용이 들며, 오픈 전에 도착하면 기다려야 합니다."
- id: workshop
  text: 월요일에는 V2가 브레이크 점검으로 06:40까지 정비소에 있어 06:40 전에는 주방에서 출발할 수 없습니다.
- id: manager_pressure
  text: 동호수점(C07) 점장님의 06:30 전 첫 방문 요구는 규칙이 아니며, 다른 매장처럼 오픈시간과 납품마감 사이에 트레이를 받으면 됩니다.
