# The explainer's case texts in Spanish (English comes from case.yaml).
role: Coordinador de reparto de panadería
task_type: Optimización combinatoria
deliverable_spec: |
  routes.json = {"routes": [{"van": "<código de furgoneta, p. ej. V1>", "depart": "HH:MM (opcional, por defecto 05:00)",
                             "stops": ["<código de cafetería en orden de visita, p. ej. C03>", ...]}, ...]}
  Una entrada por cada furgoneta utilizada; los códigos, exactamente como en los datos.
tiers:
  easy: >-
    El núcleo del reparto: el límite de bandejas por furgoneta de esta semana, el turno de los conductores (salida
    desde las 05:00, vuelta como muy tarde al fin del turno), una sola visita por cafetería, la cafetería cerrada esta
    semana, una velocidad constante de 25 km/h (este lunes no hay hora punta) y el coste de llegar tarde. Esta semana
    el socio lleva sus refrigerados él mismo, así que cualquier furgoneta puede atender las cafeterías de marca
    asociada, y la costumbre de atender primero las premium queda en suspenso.
  medium: >-
    Lo de easy más la cadena de frío del socio (las cafeterías de marca asociada, solo con la furgoneta refrigerada V4)
    y, cuando la semilla de reglas la sortea, la costumbre de atender primero las premium (en cada ruta, las premium
    antes que las estándar).
  hard: >-
    Lo de medium más la hora punta de la mañana (30 km/h antes de una hora sorteada y 20 km/h desde ella, también en un
    tramo ya empezado), un evento con fecha (el lunes V2 está en el taller hasta las 06:40) y la presión de la
    encargada de una cafetería premium que insiste en ser la primera parada de la mañana (no es una regla).
rules:
  van_capacity: Esta semana una furgoneta lleva como máximo {{van_capacity}} bandejas (en sus estanterías caben 120).
  shift_window: Las furgonetas no salen antes de las 05:00 y están de vuelta en la cocina a las {{shift_end}} como muy tarde.
  van_ready: El lunes V2 está en el taller hasta las 06:40 y no sale de la cocina antes de esa hora.
  closed_cafe: No se entrega a la cafetería cerrada esta semana ({{closed_cafe}}).
  serve_each_once: Cada cafetería abierta recibe todas sus bandejas en exactamente una visita.
  cold_chain: Las cafeterías de marca asociada (productos refrigerados) solo las atiende la furgoneta refrigerada.
  premium_first: En cada ruta, las cafeterías premium se visitan antes que las estándar.
