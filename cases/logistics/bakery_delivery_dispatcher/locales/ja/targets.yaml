- id: road_distance
  text: 道路距離は直線距離の1.3倍で、座標はキッチン (0, 0) からのkmです。
- id: speed
  text: 朝のあいだずっと平均時速25kmで計算します。今回の月曜日は学校が休みで、朝の渋滞はありません。
- id: rush_hour
  text: "{{rush_start}}までは時速30km、{{rush_start}}からは時速20km（朝の渋滞）で、{{rush_start}}の時点で走行中の車両はそこから速度が落ちます。"
- id: service_time
  text: 店舗での荷下ろしは4分に、トレー1枚あたり0.2分を加えた時間がかかります。
- id: shift
  text: "車両は05:00から出発でき、{{shift_end}}までにキッチンへ戻る必要があります。"
- id: tray_limit
  text: "最大トレー数（120）は棚に入る枚数ですが、今週は深型の番重のため1台に積めるのは{{van_capacity}}枚までです。"
- id: closed_cafe
  text: "{{closed_cafe}}は今週改装のため休業で、配送してはいけません。"
- id: cold_chain
  text: 提携ブランドの店舗は冷蔵商品を扱うため、冷蔵車V4しか配送できません。
- id: partner_this_week
  text: 今週は提携先が冷蔵商品を自分で届けるため、提携ブランドの店舗もどの車両が回っても構いません。
- id: one_visit
  text: 各店舗のトレーは1台の車両が1回ですべて届け、分けて配送することはありません。
- id: premium_first
  text: "<!-- when: premium_first=true -->どのルートでも旗艦店を標準店より先に回らなければなりません。<!-- /when --><!-- when: premium_first=false -->旗艦店を先に回る慣習は今週お休みで、ルート内の店舗はどの順番でも構いません。<!-- /when -->"
- id: lateness
  text: "納品期限を過ぎた到着も認められますが、遅れた1分ごとに車両の稼働{{late_cost}}分と同じコストがかかります。開店前に着いた場合は待つ必要があります。"
- id: workshop
  text: 月曜日はV2がブレーキ点検で06:40まで整備工場にあり、06:40より前にはキッチンを出発できません。
- id: manager_pressure
  text: 東湖店（C07）の店長の「06:30前に最初の訪問先に」という要求はルールではなく、ほかの店舗と同じく開店時刻から納品期限までに届けば十分です。
