# The case in plain words, shown at the top of its page.
task: >-
  ベーカリーのセントラルキッチンは、毎朝4台の車両で各店舗にパンのトレーを届けています。AIは月曜日の朝の配送ルートを組みます。どの車両がどの店舗をどの順で回り、いつ出発するかを決め、店舗にトレーが間に合い、ドライバーの稼働時間ができるだけ短くなるようにするのが目的です。成果物は `routes.json` で、使う車両ごとに出発時刻と訪問順の店舗を書きます。
given:
  - "顧客の依頼：明日（月曜日）の朝、4台の車両でどの車がどこを回るか、「店舗にトレーが間に合うように、またドライバーが必要以上に長く走らなくて済むように」組んでほしいという3文です。上限やルールには何も触れていません。"
  - "`店舗一覧.csv`：18店舗（C01〜C18）の地図座標（km、`東西座標_km`・`南北座標_km`）、店舗ごとのトレー数（10〜29枚、合計332枚）、旗艦店か標準店か、開店時刻（06:00〜07:30）、納品期限（開店の30〜60分後）、提携ブランドの店舗かどうか（C05、C10、C16）です。今週休業する店舗が1つありますが、ファイルにはどこか書かれていません。"
  - "`車両.csv`：4台の車両（V1〜V4）で、どれも `最大トレー数` は120と書かれています。冷蔵車はV4だけです。"
ask:
  - "地図から走行時間を出す方法です。座標はセントラルキッチン (0, 0) からのkmで、道路距離は直線距離の1.3倍、車両は朝のあいだずっと平均時速25kmで走ります。hardでは代わりに朝の渋滞があります。バージョンによって06:30、07:00、07:30のいずれかまでは時速30km、その時刻からは時速20kmで、すでに走っている車両もそこから遅くなります。"
  - "店舗に立ち寄るときの決まりです。各店舗のトレーは1台の車両が1回ですべて届け、荷下ろしには4分にトレー1枚あたり0.2分を加えた時間がかかり、開店前に着いた車両は開店まで待ちます。"
  - "ドライバーの勤務時間です。車両は05:00から出発でき、バージョンによって09:00、09:30、10:00のいずれかまでにキッチンへ戻る必要があります。hardでは、V2が月曜日に整備工場に入っているため06:40より前には出発できません。"
  - "今週の1台あたりのトレー上限です。バージョンによって100枚、110枚、120枚のいずれかです（hardでは常に110枚）。ファイルの120は棚に入る枚数で、新しい深型の番重（パンを運ぶ箱）を使うため、上限がもっと低いことがあります。"
  - "今週改装のため休業していて、配送してはいけない店舗です。バージョンによって南山店（C11）、北駅店（C03）、楓並木店（C14）のいずれかです。"
  - "提携ブランドの店舗にどの車両が行けるかです。easyではどの車両でも構いません（今週は提携先が冷蔵商品を自分で届けます）。mediumとhardでは冷蔵車V4だけが行けます。"
  - "どのルートでも旗艦店を標準店より先に回る必要があるかです。easyでは必要ありません（今週はこの慣習をお休みしています）。mediumとhardでは、バージョンによって守る場合と守らない場合があります。hardで東湖店（C07）の店長が06:30より前に朝いちばんの訪問先にしてほしいと求めているのは、ルールではありません。"
  - "遅れのコストです。遅れて着いても受け取ってもらえますが、`納品期限` を1分過ぎるごとに、バージョンによって車両の稼働2分、3分、5分のいずれかと同じだけのコストがかかります。"
invalid_if:
  - "読み取れません。`routes.json` がない、データにない車両コードや店舗コードがある、1台に2つのルートがある、出発時刻がHH:MMの形で書かれていない、のいずれかです。"
  - "今週の上限（100枚、110枚、120枚のいずれか。hardでは110枚）より多いトレーを1台に積みます。"
  - "05:00より前に出発する車両や、勤務終了（09:00、09:30、10:00のいずれか）より後にキッチンへ戻る車両があります。hardでは、06:40より前に出発するV2も該当します。"
  - "休業している店舗に配送する、営業中の店舗を抜かす、または同じ店舗を2回以上訪れます。"
  - "mediumとhardで、提携ブランドの店舗（C05、C10、C16）にV4以外の車両を行かせます。"
  - "mediumとhardのうち旗艦店優先の慣習を守るバージョンで、どこかのルートが標準店の後に旗艦店を訪れます。ただし、会社の方針がこの慣習を緩めることを認めていて、AIが先に顧客に例外を申請した場合は認められます。"
quality: >-
  低いほど良い値です。全車両がキッチンを出てから戻るまでの稼働時間（分）の合計（店舗の開店を待つ時間を含む）に、店舗への到着が `納品期限` を過ぎた分数の2倍、3倍または5倍を加えます。従来のやり方（0点）は、キッチンを中心に地図を扇形に分けてV1、V2、V3、V4の順に詰め、旗艦店を先に回り、すべての車両をできるだけ早く出発させます。そのため、まだ開いていない店舗の前で待ち、最後の店舗には遅れて着きます（このページのバージョンで約1,140〜1,980分）。模範解答（1点）は、店舗をルート間で動かしながら改善を続け、車両ごとに最も良い出発時刻を5分刻みで選ぶコンピューター探索です（約420〜710分）。
tiers:
  easy: >-
    配送ルートの基本です。トレーの上限、勤務終了の時刻、1店舗1回の訪問、休業している店舗、一定の時速25km、遅れのコストが適用されます。提携ブランドの店舗にはどの車両でも行けて、旗艦店を先に回る必要もありません。
  medium: >-
    コールドチェーン（提携ブランドの店舗C05、C10、C16は冷蔵車V4だけが配送）が加わり、一部のバージョンでは旗艦店優先の慣習（どのルートでも旗艦店を標準店より先に回る）も加わります。
  hard: >-
    朝の渋滞（時速30kmから、06:30、07:00、07:30のいずれかの時刻以降は時速20km）、06:40まで整備工場にあるV2、06:30より前に最初の訪問先にしてほしいという東湖店（C07）の店長の要求が加わります。この要求はルールではありません。その店舗は07:00開店なので、従っても車両が待つだけです。トレーの上限は常に110枚です。
