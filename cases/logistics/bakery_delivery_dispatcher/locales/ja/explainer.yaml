# The explainer's case texts in Japanese (English comes from case.yaml).
role: ベーカリー配送の配車担当者
task_type: 組合せ最適化
deliverable_spec: |
  routes.json = {"routes": [{"van": "<車両ID、例: V1>", "depart": "HH:MM（任意、省略時は 05:00）",
                             "stops": ["<訪問順の店舗ID、例: C03>", ...]}, ...]}
  使う車両ごとに1件とし、IDはデータのとおりに記載します。
tiers:
  easy: >-
    配送ルートの基本となるルールが適用されます：今週の1台あたりのトレー上限、今週休業している店舗、移動時間（道路距離、一定の時速25kmで今回の月曜日は朝の渋滞なし、荷下ろし時間）、遅れ1分あたりのコスト、10:00までの帰着。今週は提携先が冷蔵商品を自分で届けるため、提携ブランドの店舗もどの車両が回っても構わず、旗艦店を先に回る慣習もお休みです。
  medium: >-
    easy に加えて、提携先のコールドチェーン（提携ブランドの店舗は冷蔵車V4だけが配送）と、ルールシードの抽選で有効になった場合は旗艦店優先の慣習（どのルートでも旗艦店を標準店より先に回る）が適用されます。
  hard: >-
    medium のトレー上限を110に固定し、朝の渋滞（抽選された時刻までは時速30km、その時刻からは時速20km、すでに走行中の区間にも適用）、抽選されたドライバーの勤務終了時刻（09:00〜10:00）、日付の決まったイベント（月曜日はV2が06:40まで整備工場にある）、朝いちばんの訪問先にしてほしいと言い張る旗艦店の店長からの圧力（ルールではない）が加わります。
rules:
  van_capacity: 今週は車両1台に積めるトレーは最大{{van_capacity}}枚です（棚には120枚入ります）。
  shift_window: 車両は05:00より前には出発せず、{{shift_end}}までにキッチンへ戻ります。
  van_ready: 月曜日はV2が06:40まで整備工場にあるため、06:40より前にはキッチンを出発しません。
  closed_cafe: 今週休業している店舗（{{closed_cafe}}）には配送しません。
  serve_each_once: 営業中の全店舗が、ちょうど1回の訪問でトレーをすべて受け取ります。
  cold_chain: 提携ブランドの店舗（冷蔵商品）には冷蔵車だけが配送します。
  premium_first: どのルートでも、旗艦店を標準店より先に回ります。
shortcuts:
  id_order: "車両ごとに1ルート、店舗ID順：C01、C02…をトレー上限までV1に積み、続いてV2、V3、V4に積みます。"
  opening_order: "店舗の開店順にトレー上限までV1に積み、続いてV2、V3、V4に積みます（場所ではなく時刻だけを見る）。"
  nearest_neighbour: "納品時間帯を見ない最近傍法：各車両がまだ届けていない最寄りの店舗へ向かい、トレー上限に達したら次の車両がキッチンから出発します。"
  map_slices: "キッチンを中心に地図を4つに切り分けて1台に1区画を割り当て、区画内は開店順に回ります。"
  habit_best_departures: "顧客のやり方をそのまま写して1か所、時刻だけを変えます：配車担当のルートはそのままに、各車両を最適な時刻に出発させます（各ルートもその出発時刻に合ういちばんよい順番に並べる）。"
  habit_one_move: "顧客のやり方をそのまま写して1か所だけ変えます：動かすといちばん節約になる店舗を1つだけ別の位置に移します。"
  insertion_without_departures: "すべてのルールと顧客の移動時間を知ったうえで最安挿入法で組み、ファイルに出発時刻を書かなかったもの（全車両が既定の05:00に出発）。"
  deadline_balanced: "納品期限の早い順に、各店舗をその時点でトレーがいちばん少ない車両に割り当て（コールドチェーンがあれば提携ブランドの店舗はV4、慣習があれば旗艦店を先に）、各車両を最適な時刻に出発させます。"
  literal_plus_closed_cafe_planner_guess: "文字どおりの解に休業店舗だけを知らせ、移動時間は誰にも聞かずに配車担当が見積もるように決めたもの：直線距離の1.3倍、時速25km、1店舗5分。"
  literal_plus_closed_cafe: "文字どおりの解に、closed_cafe ルールの背後にある顧客の事実を1つだけ知らせたもの（それに合わせて組み直し、ほかは文字どおりに読む）。"
  literal_plus_van_capacity: "文字どおりの解に、van_capacity ルールの背後にある顧客の事実を1つだけ知らせたもの（それに合わせて組み直し、ほかは文字どおりに読む）。"
  literal_plus_shift_window: "文字どおりの解に、shift_window ルールの背後にある顧客の事実を1つだけ知らせたもの（それに合わせて組み直し、ほかは文字どおりに読む）。"
  literal_plus_cold_chain: "文字どおりの解に、cold_chain ルールの背後にある顧客の事実を1つだけ知らせたもの（それに合わせて組み直し、ほかは文字どおりに読む）。"
  literal_plus_premium_first: "文字どおりの解に、premium_first ルールの背後にある顧客の事実を1つだけ知らせたもの（それに合わせて組み直し、ほかは文字どおりに読む）。"
  literal_plus_van_ready: "文字どおりの解に、van_ready ルールの背後にある顧客の事実を1つだけ知らせたもの（それに合わせて組み直し、ほかは文字どおりに読む）。"
