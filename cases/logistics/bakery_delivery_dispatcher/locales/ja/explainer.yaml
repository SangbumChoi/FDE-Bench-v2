# The explainer's case texts in Japanese (English comes from case.yaml).
role: ベーカリー配送の配車担当者
task_type: 組合せ最適化
deliverable_spec: |
  routes.json = {"routes": [{"van": "<車両ID、例: V1>", "depart": "HH:MM（任意、省略時は 05:00）",
                             "stops": ["<訪問順の店舗ID、例: C03>", ...]}, ...]}
  使う車両ごとに1件とし、IDはデータのとおりに記載します。
tiers:
  easy: >-
    配送ルートの核心：今週の1台あたりのトレー上限、ドライバーの勤務（05:00から出発し、勤務終了までに帰着）、1店舗1回の訪問、今週休業の店舗、朝のあいだ一定の時速25km（今回の月曜日は朝の渋滞なし）、遅延のコスト。今週は提携先が冷蔵商品を自分で届けるので提携ブランドの店舗もどの車両が回ってもよく、旗艦店を先に回る慣習はお休みです。
  medium: >-
    easy に加えて、提携先のコールドチェーン（提携ブランドの店舗は冷蔵車V4だけが配送）と、ルールシードが引いた場合の旗艦店優先の慣習（どのルートでも旗艦店を標準店より先に）。
  hard: >-
    medium に加えて、朝の渋滞（引かれた時刻までは時速30km、そこからは時速20km、走行中の区間も減速）、日付のある出来事（月曜日はV2が06:40まで整備工場）、朝いちばんの訪問先にしてほしいと言い張る旗艦店店長からの圧力（ルールではない）。
rules:
  van_capacity: 今週は車両1台に積めるトレーは最大{{van_capacity}}枚です（棚には120枚入ります）。
  shift_window: 車両は05:00より前には出発せず、{{shift_end}}までにキッチンへ戻ります。
  van_ready: 月曜日はV2が06:40まで整備工場にあるため、06:40より前にはキッチンを出発しません。
  closed_cafe: 今週休業している店舗（{{closed_cafe}}）には配送しません。
  serve_each_once: 営業中の全店舗が、ちょうど1回の訪問でトレーをすべて受け取ります。
  cold_chain: 提携ブランドの店舗（冷蔵商品）には冷蔵車だけが配送します。
  premium_first: どのルートでも、旗艦店を標準店より先に回ります。
