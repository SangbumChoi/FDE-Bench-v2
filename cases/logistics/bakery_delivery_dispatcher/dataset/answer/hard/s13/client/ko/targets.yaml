- id: road_distance
  kind: missing
  domain: calculation
  text: 도로 거리는 직선 거리의 1.3배이며, 좌표는 주방(0, 0) 기준 km입니다.
- id: rush_hour
  kind: missing
  domain: calculation
  text: 07:30 전까지는 시속 30km, 07:30부터는 시속 20km(출근 정체)이며, 07:30에 주행 중인 차량은 그때부터 속도가 떨어집니다.
- id: service_time
  kind: missing
  domain: calculation
  text: 매장 하차 시간은 4분에 트레이 1개당 0.2분이 더해집니다.
- id: shift
  kind: missing
  domain: business rule
  text: 차량은 05:00부터 출발할 수 있고 09:00까지 주방에 돌아와야 합니다.
- id: tray_limit
  kind: ambiguous
  domain: data semantics
  text: 최대트레이(120)는 선반에 들어가는 수량이지만, 이번 주에는 깊은 운반 상자 때문에 차량당 110개까지만 실을 수 있습니다.
- id: closed_cafe
  kind: missing
  domain: business rule
  text: 단풍길점(C14)은 이번 주 리모델링으로 휴점이라 배송하면 안 됩니다.
- id: cold_chain
  kind: ambiguous
  domain: data semantics
  text: 제휴브랜드 매장은 냉장 상품을 판매하므로 냉장 차량 V4만 배송할 수 있습니다.
- id: one_visit
  kind: ambiguous
  domain: business rule
  text: 각 매장의 트레이는 한 차량이 한 번에 모두 배송하며, 나눠서 배송하지 않습니다.
- id: premium_first
  kind: missing
  domain: business rule
  text: 프리미엄 매장 우선 관행은 이번 주에 쉬므로, 경로 안의 매장 순서는 자유입니다.
- id: lateness
  kind: missing
  domain: scoring
  text: 납품마감보다 늦게 도착해도 되지만 늦은 1분마다 차량 운행 5분과 같은 비용이 들며, 오픈 전에 도착하면 기다려야 합니다.
- id: workshop
  kind: missing
  domain: business rule
  text: 월요일에는 V2가 브레이크 점검으로 06:40까지 정비소에 있어 06:40 전에는 주방에서 출발할 수 없습니다.
- id: manager_pressure
  kind: missing
  domain: business rule
  text: 동호수점(C07) 점장님의 06:30 전 첫 방문 요구는 규칙이 아니며, 다른 매장처럼 오픈시간과 납품마감 사이에 트레이를 받으면 됩니다.
