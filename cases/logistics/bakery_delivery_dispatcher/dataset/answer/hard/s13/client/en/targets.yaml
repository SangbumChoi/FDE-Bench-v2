- id: road_distance
  kind: missing
  domain: calculation
  text: Road distance is 1.3 times the straight-line distance; coordinates are kilometres from the kitchen
    at (0, 0).
- id: rush_hour
  kind: missing
  domain: calculation
  text: Vans drive at 30 km/h until 07:30 and at 20 km/h from 07:30 on (morning rush hour); a van still
    on the road at 07:30 slows down from then.
- id: service_time
  kind: missing
  domain: calculation
  text: Unloading at a café takes 4 minutes plus 0.2 minutes per tray.
- id: shift
  kind: missing
  domain: business rule
  text: Vans may leave from 05:00 and must be back at the kitchen by 09:00.
- id: tray_limit
  kind: ambiguous
  domain: data semantics
  text: max_trays (120) is what the racks hold, but this week's deeper crates limit a van to 110 trays.
- id: closed_cafe
  kind: missing
  domain: business rule
  text: The Maple Row café (C14) is closed this week for renovation and must not be served.
- id: cold_chain
  kind: ambiguous
  domain: data semantics
  text: Partner-brand cafés sell chilled products and may only be served by the refrigerated van V4.
- id: one_visit
  kind: ambiguous
  domain: business rule
  text: Each café receives all its trays in one visit from one van; deliveries are never split.
- id: premium_first
  kind: missing
  domain: business rule
  text: 'The premium-first habit is suspended this week: the cafés on a route may come in any order.'
- id: lateness
  kind: missing
  domain: scoring
  text: Arriving after deliver_by is allowed but every late minute costs as much as 5 minutes of van time;
    arriving before opening means waiting.
- id: workshop
  kind: missing
  domain: business rule
  text: On Monday V2 is in the workshop for its brake check until 06:40 and cannot leave the kitchen before
    then.
- id: manager_pressure
  kind: missing
  domain: business rule
  text: The East Lake café (C07) manager's demand to be the first stop before 06:30 is not a rule; she
    gets her trays between opens and deliver_by like every café.
