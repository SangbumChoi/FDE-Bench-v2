- id: road_distance
  kind: missing
  domain: calculation
  text: 道路距离按直线距离的 1.3 倍计算；坐标是相对厨房 (0, 0) 的公里数。
- id: rush_hour
  kind: missing
  domain: calculation
  text: 06:30 之前车速 30 公里/小时，从 06:30 起 20 公里/小时（早高峰）；到 06:30 时仍在路上的车从那一刻起减速。
- id: service_time
  kind: missing
  domain: calculation
  text: 每家门店卸货 4 分钟，另加每托盘 0.2 分钟。
- id: shift
  kind: missing
  domain: business rule
  text: 车辆最早 05:00 出发，必须在 09:30 前回到厨房。
- id: tray_limit
  kind: ambiguous
  domain: data semantics
  text: 最大托盘数（120）是货架能放的数量，但这周用加深周转箱，每辆车最多装 110 个托盘。
- id: closed_cafe
  kind: missing
  domain: business rule
  text: 北站店（C03）本周装修停业，不能送货。
- id: cold_chain
  kind: ambiguous
  domain: data semantics
  text: 合作品牌门店销售冷藏商品，只能由冷藏车 V4 配送。
- id: one_visit
  kind: ambiguous
  domain: business rule
  text: 每家门店的托盘由一辆车一次送完，不能拆分配送。
- id: premium_first
  kind: missing
  domain: business rule
  text: 旗舰店优先的习惯这周暂停：路线上的门店可以按任意顺序配送。
- id: lateness
  kind: missing
  domain: scoring
  text: 晚于最晚到货时间到达是允许的，但每晚一分钟的损失相当于车辆多跑 2 分钟；早于开门时间到达需要等待。
- id: workshop
  kind: missing
  domain: business rule
  text: 周一 V2 在修理厂做刹车检查，要到 06:40 才好，06:40 之前不能从厨房出发。
- id: manager_pressure
  kind: missing
  domain: business rule
  text: 东湖店（C07）店长要求 06:30 前做第一站，这不是规定；她和其他门店一样，在开门时间和最晚到货之间收到托盘即可。
