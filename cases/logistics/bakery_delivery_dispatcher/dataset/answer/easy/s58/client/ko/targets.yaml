- id: road_distance
  kind: missing
  domain: calculation
  text: 도로 거리는 직선 거리의 1.3배이며, 좌표는 주방(0, 0) 기준 km입니다.
- id: speed
  kind: missing
  domain: calculation
  text: 아침 내내 평균 시속 25km로 계산하며, 이번 월요일은 학교 방학이라 출근 정체가 없습니다.
- id: service_time
  kind: missing
  domain: calculation
  text: 매장 하차 시간은 4분에 트레이 1개당 0.2분이 더해집니다.
- id: shift
  kind: missing
  domain: business rule
  text: 차량은 05:00부터 출발할 수 있고 09:30까지 주방에 돌아와야 합니다.
- id: tray_limit
  kind: ambiguous
  domain: data semantics
  text: 최대트레이(120)는 선반에 들어가는 수량이지만, 이번 주에는 깊은 운반 상자 때문에 차량당 110개까지만 실을 수 있습니다.
- id: closed_cafe
  kind: missing
  domain: business rule
  text: 북역점(C03)은 이번 주 리모델링으로 휴점이라 배송하면 안 됩니다.
- id: partner_this_week
  kind: ambiguous
  domain: data semantics
  text: 이번 주에는 제휴사가 냉장 상품을 직접 배송하므로, 제휴브랜드 매장도 어느 차량이 배송해도 됩니다.
- id: one_visit
  kind: ambiguous
  domain: business rule
  text: 각 매장의 트레이는 한 차량이 한 번에 모두 배송하며, 나눠서 배송하지 않습니다.
- id: premium_first
  kind: missing
  domain: business rule
  text: 프리미엄 매장 우선 관행은 이번 주에 쉬므로, 경로 안의 매장 순서는 자유입니다.
- id: lateness
  kind: missing
  domain: scoring
  text: 납품마감보다 늦게 도착해도 되지만 늦은 1분마다 차량 운행 2분과 같은 비용이 들며, 오픈 전에 도착하면 기다려야 합니다.
