- id: road_distance
  kind: missing
  domain: calculation
  text: Road distance is 1.3 times the straight-line distance; coordinates are kilometres from the kitchen
    at (0, 0).
- id: speed
  kind: missing
  domain: calculation
  text: Vans drive at 25 km/h on average all morning; there is no rush hour this Monday (school holiday).
- id: service_time
  kind: missing
  domain: calculation
  text: Unloading at a café takes 4 minutes plus 0.2 minutes per tray.
- id: shift
  kind: missing
  domain: business rule
  text: Vans may leave from 05:00 and must be back at the kitchen by 09:00.
- id: tray_limit
  kind: ambiguous
  domain: data semantics
  text: max_trays (120) is what the racks hold, but this week's deeper crates limit a van to 100 trays.
- id: closed_cafe
  kind: missing
  domain: business rule
  text: The Maple Row café (C14) is closed this week for renovation and must not be served.
- id: partner_this_week
  kind: ambiguous
  domain: data semantics
  text: This week the partner brings its chilled range itself, so any van may serve the partner-brand
    cafés.
- id: one_visit
  kind: ambiguous
  domain: business rule
  text: Each café receives all its trays in one visit from one van; deliveries are never split.
- id: premium_first
  kind: missing
  domain: business rule
  text: 'The premium-first habit is suspended this week: the cafés on a route may come in any order.'
- id: lateness
  kind: missing
  domain: scoring
  text: Arriving after deliver_by is allowed but every late minute costs as much as 5 minutes of van time;
    arriving before opening means waiting.
