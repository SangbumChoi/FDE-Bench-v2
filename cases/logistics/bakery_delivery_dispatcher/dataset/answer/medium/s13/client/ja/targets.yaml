- id: road_distance
  kind: missing
  domain: calculation
  text: 道路距離は直線距離の1.3倍で、座標はキッチン (0, 0) からのkmです。
- id: speed
  kind: missing
  domain: calculation
  text: 朝のあいだずっと平均時速25kmで計算します。今回の月曜日は学校が休みで、朝の渋滞はありません。
- id: service_time
  kind: missing
  domain: calculation
  text: 店舗での荷下ろしは4分に、トレー1枚あたり0.2分を加えた時間がかかります。
- id: shift
  kind: missing
  domain: business rule
  text: 車両は05:00から出発でき、09:00までにキッチンへ戻る必要があります。
- id: tray_limit
  kind: ambiguous
  domain: data semantics
  text: 最大トレー数（120）は棚に入る枚数ですが、今週は深型の番重のため1台に積めるのは100枚までです。
- id: closed_cafe
  kind: missing
  domain: business rule
  text: 楓並木店（C14）は今週改装のため休業で、配送してはいけません。
- id: cold_chain
  kind: ambiguous
  domain: data semantics
  text: 提携ブランドの店舗は冷蔵商品を扱うため、冷蔵車V4しか配送できません。
- id: one_visit
  kind: ambiguous
  domain: business rule
  text: 各店舗のトレーは1台の車両が1回ですべて届け、分けて配送することはありません。
- id: premium_first
  kind: missing
  domain: business rule
  text: 旗艦店を先に回る慣習は今週お休みで、ルート内の店舗はどの順番でも構いません。
- id: lateness
  kind: missing
  domain: scoring
  text: 納品期限を過ぎた到着も認められますが、遅れた1分ごとに車両の稼働5分と同じコストがかかります。開店前に着いた場合は待つ必要があります。
