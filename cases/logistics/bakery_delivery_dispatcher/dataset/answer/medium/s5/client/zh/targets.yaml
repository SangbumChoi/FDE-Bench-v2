- id: road_distance
  kind: missing
  domain: calculation
  text: 道路距离按直线距离的 1.3 倍计算；坐标是相对厨房 (0, 0) 的公里数。
- id: speed
  kind: missing
  domain: calculation
  text: 整个早上车速都按平均 25 公里/小时计算；这个周一是学校假期，没有早高峰。
- id: service_time
  kind: missing
  domain: calculation
  text: 每家门店卸货 4 分钟，另加每托盘 0.2 分钟。
- id: shift
  kind: missing
  domain: business rule
  text: 车辆最早 05:00 出发，必须在 10:00 前回到厨房。
- id: closed_cafe
  kind: missing
  domain: business rule
  text: 南山店（C11）本周装修停业，不能送货。
- id: cold_chain
  kind: ambiguous
  domain: data semantics
  text: 合作品牌门店销售冷藏商品，只能由冷藏车 V4 配送。
- id: one_visit
  kind: ambiguous
  domain: business rule
  text: 每家门店的托盘由一辆车一次送完，不能拆分配送。
- id: premium_first
  kind: missing
  domain: business rule
  text: 每条路线上旗舰店必须排在标准店之前。
- id: lateness
  kind: missing
  domain: scoring
  text: 晚于最晚到货时间到达是允许的，但每晚一分钟的损失相当于车辆多跑 3 分钟；早于开门时间到达需要等待。
