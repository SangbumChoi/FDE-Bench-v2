- id: interface
  kind: missing
  domain: data semantics
  text: 成果物は on_day(day) を定義した program/scheduler.py で、営業日ごとに業務終了後、順番に同じプロセスで1回ずつ呼ばれます（状態はモジュール変数に保持可）。1回10秒、標準ライブラリのみ、実行時にデータファイルは使えません。book
    / move / release のアクション（翌日から10営業日以内）とその日の状況表を返します。
- id: evaluation_period
  kind: missing
  domain: scoring
  text: プログラムはデータにない2026年11月9日から12月4日までの20営業日で評価され、その期間の依頼はすべて新しいものです。
- id: visit_length
  kind: missing
  domain: calculation
  text: 初診は同じ医師・同じセッションの連続した20分枠2つ（開始 = 最初の枠）、再診は1枠です。
- id: urgent_window
  kind: missing
  domain: business rule
  text: 緊急（U）の依頼は受付当日に、最短受診可能日（受診可能日または受付翌営業日）から2営業日以内に予約し、移す場合もその範囲内に保つ必要があります。
- id: urgent_reserve
  kind: missing
  domain: business rule
  text: すべての午前セッションの最初の2枠（09:00と09:20）は、2営業日以上先なら緊急の依頼用に空けておき、前日（翌日の外来分）には誰にでも解放します。
- id: follow_up_doctor
  kind: missing
  domain: business rule
  text: 再診は患者さんの前回担当医に予約します。契約上のルールではなく慣行なので、外来運営室長が例外を認められます。
- id: interpreters
  kind: missing
  domain: business rule
  text: 患者さんの言語を話せない医師との初診には、病院全体で1日2名の対面通訳者が1名必要です。再診は電話通訳で制限はありません。
- id: holiday_clinic
  kind: missing
  domain: business rule
  text: 11月23日（月）の市民の日は小児科が休診ですが、外来枠表にはそのセッションがそのまま載っています。ほかの診療科は通常どおりです。
- id: move_notice
  kind: missing
  domain: business rule
  text: 病院が患者さんの予約の日付や時刻を変える場合、新しい予約は変更した日から3営業日以上先（取り消して取り直す場合は取り消した日から）でなければならず（同じ日時で医師だけ替えるのは例外）、変更のたびにコストがかかります。
- id: waitlist_priority
  kind: missing
  domain: business rule
  text: 待っている依頼は優先順位（まず緊急度順（U、S、R）、同じ緊急度の中では受付日の早い順）で予約し、同じ診療科・受診区分・前回担当医でより優先度の高い依頼が待っていてその枠を使えたなら、低いほうを予約してはいけません。
- id: status_table
  kind: missing
  domain: scoring
  text: 毎日アクション適用後、次の10営業日について診療科ごとに free_slots（予約可能な空き枠、確保枠と休診を除く）、held_back（2営業日以上先の空いている緊急用確保枠）、waitlist（待ち依頼の数）を返します。各項目は完全一致が必要です。
- id: scoring
  kind: missing
  domain: scoring
  text: 医師の時間が空くことがいちばんの損失です。最も重要なのは11月10日〜12月7日の外来日に診察した患者枠1つ1つ（初診は2枠、再診は1枠）で、患者さんを待たせること（緊急度が高いほど重い）、最後まで予約できない依頼、病院による予約の変更もそれぞれ損失です。
- id: easy_scope
  kind: missing
  domain: business rule
  text: 今回は不在・通訳の連絡は代診医と外部の通訳会社がまかない、紹介状と採血は紹介窓口と検査室が自分で扱い（test_date は null）、無断欠席は見込まず（予約した患者さんは全員来るものとする）、同じ患者さんの2回目の依頼も、依頼だけでは同じ症状か分からないので別に予約します。
