- id: urgent_reserve
  text: 紧急预留号是每个上午时段的前{{reserve_slots}}个号源（{{reserve_times}}）；两个及以上工作日之后，只有紧急（U）申请可以约在这里。
- id: reserve_release
  text: 在前一个工作日的调用中（对明天的门诊），紧急预留号里还空着的号源放开，任何人都可以约；以前预约处即使到那时也留给紧急患者，这是目前浪费医生时间最多的两处之一。
- id: follow_up_doctor
  text: 复诊约给患者的上次接诊医生；这是惯例，不是合同规定，门诊办公室主任可以批准例外（同事看的复诊少算十分之一个号源）。
- id: interpreters
  text: 初诊约给不会说患者语言的医生时，需要全院每天{{interpreters_per_day}}名现场翻译中的一名；复诊用电话翻译，不限数量。
- id: holiday_clinic
  text: 11月23日（周一）市民日{{closed_dept}}停诊，但出诊表里仍列有它的时段；其他科室照常。
- id: move_notice
  text: 医院更改患者预约的日期或时间时，新预约必须在更改当天（取消后再约则为取消当天）之后至少3个工作日（同一日期时间只换医生不需要提前通知）；每次更改都有成本。
- id: waitlist_priority
  text: 候诊申请按优先顺序预约：{{waitlist_order}}；同一科室、就诊类型和上次接诊医生下有优先级更高的申请仍在候诊且本可用那个号源时，不能约优先级更低的申请。
- id: status_table
  text: 程序每天在执行动作后，就接下来10个工作日按科室返回 free_slots（可约的空号源，不含预留号和停诊科室）、held_back（两个及以上工作日之后的空紧急预留号）和 waitlist（候诊申请数）；每项必须完全一致（错一项的损失相当于两个空号源），因为各科室根据它安排门诊人手。
- id: staff_notes
  text: 备注没有效力——院长的熟人和其他人一样按顺序等候，科主任希望下午空着也不是规定；这些号源照样从候诊名单里填。
- id: duplicates
  text: "<!-- tier: easy medium -->本轮同一患者对同一科室的第二条申请也单独预约，因为光看申请分不清是不是同一个病情（由门诊和患者确认）。<!-- /tier --><!-- tier: hard -->同一患者对同一科室的第二条申请是同一次就诊；每位患者本期间每个科室最多一个预约，现况表数的是候诊患者而不是申请。<!-- /tier -->"
- id: overbooking
  text: "<!-- tier: easy medium -->本轮不为爽约做安排：约上的患者都算会来，所以不超额预约，一个号源一个预约。<!-- /tier --><!-- tier: hard -->因为有爽约，复诊可以超额预约：一个号源最多放两个复诊，初诊不能共享号源。<!-- /tier -->"
- id: referral_expiry
  text: "<!-- tier: easy -->本轮由转诊窗口自己核对转诊单，所以不用管 referral_valid_until，每条申请都可以约。<!-- /tier --><!-- tier: medium hard -->初诊必须在 referral_valid_until 当天或之前就诊；过期后不能再约，也不计入候诊人数。<!-- /tier -->"
- id: blood_test
  text: "<!-- tier: easy -->本轮由检验科自己和患者约空腹抽血，所以不用管 pre_visit_test，test_date 保持 null。<!-- /tier --><!-- tier: medium hard -->就诊前至少一个工作日要做空腹抽血，不早于最早可约日期，设定或更改时从明天起，写在 test_date 里。<!-- /tier -->"
- id: lab_cap
  text: 检验科每个工作日最多做{{lab_cap}}人的空腹抽血，各科室合计，已在预约里的抽血也算。
- id: doctor_absence
  text: "<!-- tier: easy -->本轮医生缺勤都有代诊医生顶上：缺勤通知不改变任何事，缺勤医生的预约保留，照常预约。<!-- /tier --><!-- tier: medium hard -->收到 doctor_absence 通知的当天起，该医生缺勤日不能留有任何预约；在同一次调用中调整（遵守提前通知期，或同一时间换给其他医生）或退回候诊名单，缺勤日也不计入现况表。<!-- /tier -->"
- id: interpreter_absence
  text: interpreter_absence 通知表示从收到当天起，该日期现场翻译少一人；当天超出的需翻译初诊必须调整或取消。
- id: overbooking_cap
  text: 每位医生每个时段（上午或下午）最多{{overbooked_per_session}}个超额预约号源（放了两个复诊的号源）。
- id: collision_cost
  text: 超额预约的号源两位患者都来时，医生会拖延，后面整个时段都受影响；这相当于空三个号源的损失。
