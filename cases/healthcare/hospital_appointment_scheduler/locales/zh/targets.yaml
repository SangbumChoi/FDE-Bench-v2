- id: date_format
  text: 最早可约日期的格式是日/月/年，是患者最早能来的日子；早于11月16日的表示从16日起可以来，等待时间也从16日算起。
- id: visit_length
  text: 初诊占同一医生同一天连续两个空闲的20分钟号（开始时间 = 第一个号），复诊占一个号。
- id: urgent_window
  text: 所有紧急（U）申请必须在基准日（最早可约日期，若更早则为11月16日）起{{urgent_days}}个工作日内排上。
- id: follow_up_doctor
  text: 复诊排给上次接诊医生是前台惯例而不是合同条款，可以破例（D11医生第一周休假）。
- id: interpreters
  text: 医生不会说患者语言时需要翻译；每天只有{{interpreters_per_day}}名现场翻译，初诊必须用现场翻译，超出部分的复诊用付费视频翻译（每次3）。
- id: holiday_clinic
  text: 虽然空闲号源表里还有，但{{closed_dept}}11月23日（市民日）停诊。
- id: referral_expiry
  text: 初诊必须在转诊单有效期至（日/月/年）当天或之前就诊；过期后转诊单失效，这类申请宁可不排。
- id: blood_test
  text: 空腹抽血必须在就诊前至少一个工作日、且不早于最早可约日期进行，日期写在test_date；检验科每个工作日最多{{lab_cap}}个。
- id: no_show_rates
  text: 每位患者爽约率不同（就诊记录；全院约5个中有1个），提前期每多一个工作日约高1个百分点；记录是在提前期约5个工作日时测得的，申请在11月16日前2个工作日受理。
- id: overbooking
  text: 一个号最多放两个复诊（初诊不行），每位医生每个上午或下午时段最多{{overbooked_per_session}}个超额预约的号。
- id: scoring
  text: 质量 = 等待工作日乘以权重（U 3 / S 2 / R 1），每个超过{{soon_days}}个工作日才排上的S申请加20，每个没排上的申请加60，每个视频翻译的复诊加3；越低越好。
- id: scoring_no_shows
  text: 困难档的质量还要加上：预计空着的号每个10，预计两个患者都会来的超额预约号每个25。
