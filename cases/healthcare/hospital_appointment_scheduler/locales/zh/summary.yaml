# The case in plain words, shown at the top of its page.
task: >-
  编写一个 Python 程序，代替医院门诊预约处办理预约：每个工作日下班后，程序把当天的预约申请约进接下来10个工作日里医生空闲的20分钟号源，用候诊名单填补新空出的号源，并按科室报告空闲号源、为紧急患者预留的号源和候诊申请的数量。目标是在不违反医院任何预约规则的前提下，尽量减少医生出诊时间的空置。评分时，程序在数据里没有的20个工作日（2026年11月9日至12月4日）上逐日运行。
given:
  - >-
    客户的需求：从11月9日（周一）起，预约处希望改用程序办理，每个工作日把患者约进医生的空闲号源并报告各科室的情况，“最想解决的，是号源空着、医生的出诊时间白白浪费”。需求里没有写任何预约规则。
  - >-
    `预约系统导出.sql`：11月6日（周五）时的预约系统，包括五个科室（内科、心内科、皮肤科、骨科、儿科）的14位医生及其会说的语言和每周出诊时间、截至11月20日的出诊表、过去四周的预约申请和预约及实际结果（约22%的患者没有来）、取消记录、候诊名单（仍有45条申请在等）以及11月9日起已约上的359个预约。
  - >-
    `mail/`：预约处收到的7封邮件：以前两位医生和一名翻译的缺勤、一位科室主任要名单的邮件、院长办公室要求把院长的熟人约在“明天上午”的邮件，以及门诊部办公室关于市民日（11月23日周一，出诊表未作修改）和数据代码的通知。
  - >-
    `试点日_输入示例.json` 和 `试点日_输出示例.json`：某一天的输入，与程序每天收到的完全一样（接下来10个工作日的出诊表、新申请、取消和缺勤等通知、现有预约、候诊名单），以及客户试点程序给出的答复，答复展示了输出格式。
ask:
  - >-
    紧急申请怎么处理：受理当天就要预约，日期在其最早可就诊日起2个工作日以内。每个上午时段的前两个或前三个号源（09:00 和 09:20，或 09:00 至 09:40，随版本不同）留给紧急申请，到前一个工作日才放开给所有人。
  - >-
    11月23日（周一）市民日哪个科室停诊：随版本不同，为皮肤科、骨科或儿科。出诊表里仍列着该科当天的时段。
  - >-
    全院每天有几名现场翻译：随版本不同，为2名、3名或4名。初诊如果约给不会说患者语言的医生，每个需要一名；复诊用电话翻译，不限数量。
  - >-
    候诊名单的优先顺序，随版本不同，为以下三种之一：先按紧急程度、再按受理日期；紧急申请优先、其余一律按受理日期；或先按紧急程度、再按患者最早能来的日期。只要同一科室、同一就诊类型、同一医生下还有优先级更高、本可以用这个号源的申请在等，就不能先约优先级低的申请。
  - >-
    预约的基本规定：初诊占连续两个20分钟号源，复诊占一个，复诊约给上次接诊的医生（这是惯例，门诊办公室主任可以批准例外）。更改日期或时间时，新预约必须在更改那天之后至少3个工作日，而且每改一次都扣分。
  - >-
    每天的现况表数什么：在接下来10个工作日里，谁都可以约的空闲号源、两个及以上工作日之后仍空着的紧急预留号，以及候诊申请（hard 中为候诊患者）的数量；不含市民日停诊的科室，medium 起还不含医生缺勤日和转诊单已过期的申请。15个数字必须完全一致才算对。
  - >-
    medium 和 hard 中：初诊患者的转诊单到某一天过期；空腹抽血必须在就诊至少一个工作日前完成，检验科每天最多5人、6人或7人（随版本不同）；医生或翻译缺勤时，受影响的预约要在收到通知当天调整或放回候诊名单。
  - >-
    hard 中：每位患者的爽约率不同，提前预约的时间每多一个工作日约高一个百分点；一个号源可放两个复诊，这样的号源每位医生每个时段最多1个、2个或3个（随版本不同）；同一患者对同一科室的第二条申请是同一次就诊，不另约。
invalid_if:
  - >-
    任何一天程序崩溃或超过10秒，返回格式错误的动作，预约了不在候诊的申请，或约到接下来10个工作日之外。
  - >-
    一个号源里有两个预约（hard 中为三个及以上复诊、与初诊共用的号源，或每位医生每个时段的共用号源超过允许数量），或者约到出诊表之外的号源、其他科室的医生，或早于患者最早可约日期。
  - >-
    在市民日停诊的科室约了患者，或某天需要翻译的初诊多于当天的翻译人数；medium 和 hard 中，转诊单过期后的就诊、缺少抽血或抽血太晚或超出检验科每日上限、缺勤医生名下还留着预约，也算在内。
  - >-
    紧急申请到受理当天结束仍未预约，或约到2个工作日之后；或者非紧急患者占用了两个及以上工作日之后的紧急预留号。
  - >-
    把预约的日期或时间改到不足3个工作日之后；或者本可使用那个号源、优先级更高的申请仍在等候，却约了别的申请。
  - >-
    未经门诊办公室主任批准例外，就把复诊约给了别的医生；或者（hard）一位患者在一个科室有两个预约。
quality: >-
  80% 是运营价值（分）与参考答案的运营价值之比：实际进行的就诊每个20分钟号源 +10（初诊为两个号源），申请每等一个工作日 −0.4（紧急 ×3，尽快 ×2，常规 ×1），每条始终没约上的申请 −10，医院每调整或取消一次预约 −4；其余 20% 是现况表中完全正确的数字所占比例。客户原来的做法（记 0 分）用同样的方式预约，但从不把上午的紧急预留号放给第二天，也从不超额预约；参考答案（记 1 分）放开这些号源，按优先顺序用候诊名单填补空出的号源，并在 hard 中给可能爽约的患者的复诊号源再约一人（超额预约）。
tiers:
  easy: >-
    每天预约的基本内容：就诊时长、科室、紧急申请和上午紧急预留号、市民日停诊、翻译、更改须提前3个工作日通知、候诊优先顺序、复诊约给上次接诊医生、现况表。客户说明缺勤通知、转诊单、抽血、爽约和重复申请这次不在范围内。
  medium: >-
    增加会过期的转诊单、在检验科每日上限内并在就诊至少一个工作日前完成的空腹抽血，以及这20天里的缺勤：一位儿科医生病假两周、一位心内科医生外出开会（这些日子的预约须在收到通知当天调整或放回候诊名单），以及一名翻译请假一天。
  hard: >-
    增加爽约（患者按其会来的概率计入看诊，预约离就诊日越远，这个概率越低）、在客户规定的上限内一个号源放两个复诊（−12 × 两人都来的概率）、即使有重复申请每位患者每个科室也只约一个、在多个科室有预约的患者每多来医院一天 −3，客户还说明员工备注没有效力。
