- id: urgent_reserve
  text: La reserva de urgencias son los {{reserve_slots}} primeros huecos de cada sesión de mañana ({{reserve_times}}); con dos o más días laborables de antelación solo pueden citarse en ellos solicitudes urgentes (U).
- id: reserve_release
  text: En la llamada del día laborable anterior (para las consultas de mañana) los huecos de la reserva que siguen vacíos se liberan y cualquiera puede citarse en ellos; hasta ahora la oficina los guardaba para urgencias incluso entonces, y es uno de los dos sitios donde más tiempo de médico perdemos.
- id: follow_up_doctor
  text: Una revisión se cita con el médico anterior del paciente; es una costumbre, no una regla del contrato, y la jefa de la oficina de consultas externas puede autorizar una excepción (una revisión que ve un compañero cuenta una décima de hueco menos).
- id: interpreters
  text: Una primera visita con un médico que no habla el idioma del paciente necesita a uno de los {{interpreters_per_day}} intérpretes presenciales por día (para todo el hospital); las revisiones usan interpretación telefónica sin límite.
- id: holiday_clinic
  text: La consulta de {{closed_dept}} cierra el Día de la Ciudad, lunes 23 de noviembre, aunque el calendario sigue listando sus sesiones; las demás consultas funcionan.
- id: move_notice
  text: Cuando el hospital cambia la fecha o la hora de la cita de un paciente, la nueva debe ser al menos 3 días laborables después del día del cambio (para una solicitud liberada y citada de nuevo más tarde, después del día en que se liberó; misma fecha y hora con otro médico no necesita preaviso); cada cambio cuesta.
- id: waitlist_priority
  text: Las solicitudes en espera se citan por orden de prioridad, {{waitlist_order}}; no se puede citar una solicitud mientras otra de mayor prioridad de la misma especialidad, tipo de visita y médico anterior sigue esperando y podría haber ocupado ese hueco.
- id: status_table
  text: Cada día el programa devuelve por especialidad, para los 10 días laborables siguientes y tras sus acciones, free_slots (huecos libres que se pueden citar, sin los reservados ni las consultas cerradas), held_back (huecos vacíos de la reserva de urgencias a dos o más días) y waitlist (solicitudes en espera); cada entrada debe ser exacta (una equivocada cuesta tanto como dos huecos vacíos), porque las especialidades organizan su personal con ella.
- id: staff_notes
  text: "Las notas no tienen peso: un conocido del director espera su turno como cualquiera y el deseo de una jefatura de dejar libres sus tardes no es una regla; esos huecos se llenan con la lista de espera."
- id: duplicates
  text: "<!-- tier: easy medium -->Esta ronda la segunda solicitud de un paciente para la misma especialidad tiene su propia cita, porque una solicitud no dice si es la misma dolencia (la consulta lo comprueba con el paciente).<!-- /tier --><!-- tier: hard -->Una segunda solicitud del mismo paciente para la misma especialidad es la misma necesidad; un paciente tiene como mucho una cita por especialidad en el periodo, y la tabla cuenta pacientes en espera, no solicitudes.<!-- /tier -->"
- id: overbooking
  text: "<!-- tier: easy medium -->Esta ronda no se cuenta con las ausencias: todo paciente citado cuenta como que viene, así que no se sobrecita, una cita por hueco.<!-- /tier --><!-- tier: hard -->Por las ausencias se pueden sobrecitar revisiones: un hueco puede tener dos revisiones, nunca una primera visita.<!-- /tier -->"
- id: referral_expiry
  text: "<!-- tier: easy -->Esta ronda el mostrador de derivaciones comprueba él mismo los volantes, así que referral_valid_until no se mira y toda solicitud se puede citar.<!-- /tier --><!-- tier: medium hard -->La visita de una primera consulta debe ser el día referral_valid_until o antes; después ya no se puede citar y no cuenta en la lista de espera.<!-- /tier -->"
- id: blood_test
  text: "<!-- tier: easy -->Esta ronda el laboratorio cita él mismo los análisis en ayunas con los pacientes, así que pre_visit_test no se mira y test_date queda null.<!-- /tier --><!-- tier: medium hard -->Hace falta un análisis de sangre en ayunas al menos un día laborable antes de la visita, no antes de la fecha más temprana y, al fijarlo o cambiarlo, desde mañana, anotado en test_date.<!-- /tier -->"
- id: lab_cap
  text: El laboratorio hace como mucho {{lab_cap}} análisis en ayunas por día laborable, todas las especialidades juntas, contando los que ya están en la agenda.
- id: doctor_absence
  text: "<!-- tier: easy -->Esta ronda un sustituto cubre toda ausencia de médicos: los avisos de ausencia no cambian nada, las citas del médico ausente se quedan y se cita como siempre.<!-- /tier --><!-- tier: medium hard -->Desde el día en que llega un aviso doctor_absence no puede quedar ninguna cita con ese médico en los días de ausencia; se cambian en esa misma llamada (con el preaviso, u otro médico a la misma hora) o se devuelven a la lista de espera, y los días de ausencia salen de la tabla.<!-- /tier -->"
- id: interpreter_absence
  text: Un aviso interpreter_absence significa un intérprete presencial menos en esa fecha desde el día en que llega; las primeras visitas con intérprete que sobren ese día deben cambiarse o anularse.
- id: overbooking_cap
  text: Cada médico puede tener como mucho {{overbooked_per_session}} huecos sobrecitados (huecos con dos revisiones) por sesión, de mañana o de tarde.
- id: collision_cost
  text: Si en un hueco sobrecitado acuden los dos pacientes, el médico se retrasa y se resiente el resto de la sesión; eso cuesta lo mismo que tres huecos vacíos.
