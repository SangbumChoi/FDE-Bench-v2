# The explainer's case texts in Korean (English comes from case.yaml).
role: 병원 진료 예약 담당자
task_type: 의사결정 프로그램
deliverable_spec: |
  program/ 폴더에 on_day(day)를 정의한 scheduler.py를 둡니다. 엔진은 이 프로그램을 한 번 불러와 숨은 기간의
  영업일마다 순서대로, 같은 프로세스에서 한 번씩 호출합니다(모듈 수준의 상태는 호출 사이에 유지됩니다).
  호출당 10초, 파이썬 표준 라이브러리만 쓰며, 실행 중에는 네트워크도 데이터 파일 접근도 없습니다.
  day = {"date", "day_index", "days_in_period", "period_end", "booking_window": {"first", "last"}, "doctors",
  "sessions", "new_requests", "notices", "attendance", "book", "waitlist"}이며, 시범일 입력 파일과 정확히 같습니다.
  반환값은 {"actions": [{"type": "book" | "move", "request_id", "doctor_id", "date": "YYYY-MM-DD",
  "start": "HH:MM", "test_date": "YYYY-MM-DD" 또는 null} | {"type": "release", "request_id"}],
  "status_table": {department_code: {"free_slots": int, "held_back": int, "waitlist": int}}}이며, 시범일 출력
  파일과 같은 형식입니다. 액션은 순서대로 적용되고, 예약하지 않은 요청은 대기 목록에 남습니다.
tiers:
  easy: >-
    일일 예약의 핵심입니다. 초진 = 연속 슬롯 2개, 재진 = 1개, 진료과 일치, 진료 가능 시작일 이전 예약 금지, 긴급 예약
    기한, 긴급 예비 슬롯(오전 세션의 첫 두세 슬롯은 전날까지 긴급 요청용으로 비워 둠), 진료 일정표에는 나오지만 시민의 날
    공휴일에 휴진하는 진료과 하나, 초진에 필요한 하루 대면 통역사 수, 예약 변경의 사전 통보 기간, 대기 목록 우선순위,
    재진은 이전 담당의에게(완화 가능), 매일의 현황표가 적용됩니다. 부재·통역사 통지, 의뢰서 유효기한, 채혈, 미내원,
    중복 요청은 범위 밖입니다.
  medium: >-
    easy에 더해 만료되는 의뢰서, 하루 검사실 한도 안에서 진료 최소 1영업일 전에 하는 공복 채혈, 의사 부재(부재 의사의
    예약은 사전 통보 기간을 지켜 옮겨야 함), 통역사 부재(그날 통역사가 한 명 줄어듦)가 적용됩니다.
  hard: >-
    medium에 더해 미내원(환자마다 숨은 미내원율이 리드타임에 따라 오르며, 운영 가치는 진료한 환자 수의 기댓값으로 셈),
    재진 오버부킹(슬롯당 2건, 의사 세션당 상한, 두 환자가 모두 왔을 때의 기대 비용), 중복 요청(환자·진료과당 예약
    하나, 대기 목록에서는 하나의 진료 필요로 봄), 여러 진료과에 예약된 환자의 추가 내원이 적용됩니다.
rules:
  well_formed: 모든 호출이 존재하는 요청에 대해 올바른 형식의 액션을 반환합니다(대기 중인 요청만 예약하고, 앞으로의 예약만 옮기거나 취소함). 날짜는 예약 가능 기간(다음 10영업일) 안이어야 하며, 호출이 실패하거나 시간을 넘겨도 위반입니다.
  no_double_booking: 의사의 20분 슬롯 하나에는 예약이 최대 한 건입니다.
  slot_capacity: 의사의 20분 슬롯 하나에는 예약이 최대 두 건이며 둘 다 재진이어야 합니다. 초진은 자기 슬롯을 다른 예약과 나누지 않습니다.
  slot_length: 예약은 해당 의사와 해당 날짜의 진료 일정표 세션 슬롯을 씁니다. 초진은 같은 세션의 연속 슬롯 2개, 재진은 1개입니다.
  department_match: 요청은 해당 진료과의 의사에게 예약합니다.
  holiday_closure: '{{closed_dept}}는 2026년 11월 23일(월) 시민의 날에 휴진합니다. 진료 일정표에는 그날 세션이 그대로 나오지만, 그날 {{closed_dept}} 예약은 없어야 합니다.'
  not_before_earliest: 요청의 진료 가능 시작일(earliest_date) 전에는 예약하지 않습니다.
  interpreter_capacity: 환자의 언어를 못 하는 의사와의 초진은 병원 전체에서 하루 최대 {{interpreters_per_day}}건입니다(건마다 대면 통역사 한 명이 필요하며, medium 이상에서는 통역사가 부재한 날 한 명 줄어듭니다).
  lab_capacity: 검사실은 영업일당 공복 채혈을 최대 {{lab_cap}}건 받습니다.
  test_before_visit: 공복 채혈이 필요한 요청은 채혈일이 진료 가능 시작일부터 진료 전 영업일 사이에 있어야 합니다(새로 정하는 채혈일은 앞으로의 날짜여야 함).
  doctor_available: 부재 통지가 온 뒤로는 그 의사의 부재일에 남아 있거나 새로 잡히는 예약이 없어야 합니다.
  urgent_window: 모든 긴급(U) 요청은 접수 당일, 최초 가능일(진료 가능 시작일 또는 다음 영업일)로부터 2영업일 이내로 예약되며, 그 뒤로도 그 범위를 벗어나지 않습니다.
  urgent_reserve: 모든 오전 세션의 첫 {{reserve_slots}} 슬롯({{reserve_times}})은 전 영업일까지 긴급 요청용으로 비워 둡니다. 2영업일 이상 앞이면 S나 R 요청을 그 슬롯에 예약하거나 옮기지 않습니다.
  move_notice: 병원이 환자 예약의 날짜나 시각을 바꾸면 새 예약은 변경한 날로부터 최소 3영업일 뒤여야 합니다. 병원이 취소했다가 나중에 다시 예약하는 요청은 취소한 날부터 셉니다(같은 날짜·시각에 다른 의사로 바꾸는 것은 사전 통보가 필요 없습니다).
  waitlist_priority: 대기 중인 요청은 우선순위대로({{waitlist_order}}) 예약합니다. 같은 진료과, 같은 진료 구분, 같은 이전 담당의의 더 높은 우선순위 요청이 아직 대기 중이고 그 슬롯을 쓸 수 있었다면 그보다 낮은 요청을 예약하지 않습니다.
  overbooking_limit: 의사 한 명당 세션(오전 또는 오후)마다 오버부킹 슬롯(재진 2건이 든 슬롯)은 최대 {{overbooked_per_session}}개입니다.
  one_per_department: 환자 한 명은 기간 중 진료과마다 예약이 최대 하나입니다(이미 받은 진료든 앞으로의 예약이든). 중복 요청(같은 환자, 같은 진료과)을 두 번째 예약으로 잡지 않습니다.
  follow_up_same_doctor: 재진은 환자의 이전 담당의에게 예약합니다. 외래 운영실장이 예외를 승인할 수 있는 관행입니다.
