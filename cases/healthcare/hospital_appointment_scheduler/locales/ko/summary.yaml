# The case in plain words, shown at the top of its page.
task: >-
  병원 외래 예약실 업무를 대신하는 Python 프로그램을 만듭니다. 프로그램은 영업일마다 업무가 끝난 뒤 그날 들어온 예약
  요청을 다음 10영업일 동안 의사들의 비어 있는 20분 슬롯에 예약하고, 새로 빈 슬롯을 대기 목록에서 채우며, 진료과별로
  빈 슬롯, 긴급 환자용으로 묶어 둔 슬롯, 대기 중인 요청 수를 보고합니다. 목표는 병원의 예약 규칙을 하나도 어기지 않으면서
  비어 버리는 의사 진료 시간을 최대한 줄이는 것이며, 데이터에 없는 20영업일(2026년 11월 9일~12월 4일)에 돌려서
  평가합니다.
given:
  - >-
    고객의 요청: 11월 9일(월)부터 예약실이 영업일마다 의사들의 빈 시간에 환자를 예약하고 진료과별 현황을 알려 주는
    프로그램으로 일하고 싶다는 내용이며, "무엇보다 빈 슬롯 때문에 의사 진료 시간이 버려지는 일을 줄이고 싶다"고 합니다.
    예약 규칙은 하나도 적혀 있지 않습니다.
  - >-
    `예약시스템_내보내기.sql`: 11월 6일(금) 기준 예약 시스템입니다. 다섯 진료과(내과, 심장내과, 피부과, 정형외과,
    소아청소년과)의 의사 14명과 구사 언어, 주간 진료 일정, 11월 20일까지의 진료 일정표, 지난 4주간의 예약 요청과 예약
    및 실제 결과(환자의 약 22%가 오지 않음), 취소, 대기자 명단(아직 대기 중인 요청 45건), 11월 9일 이후로 이미 잡힌 예약
    359건이 들어 있습니다.
  - >-
    `mail/`: 예약실이 받은 메일 7통입니다. 과거 의사 두 명과 통역사 한 명의 부재, 명단을 요청하는 과장의 메일,
    병원장 지인을 "내일 오전으로" 잡아 달라는 원장실 메일, 그리고 시민의 날(11월 23일 월요일, 진료 일정표는 그대로 둠)과
    데이터 코드에 관한 외래 운영팀 안내입니다.
  - >-
    `시범일_입력예시.json`과 `시범일_출력예시.json`: 프로그램이 매일 받게 될 입력 하루치(다음 10영업일의 진료 일정표,
    신규 요청, 취소·부재 같은 통지, 현재 예약, 대기 목록)를 그대로 담은 것과, 고객의 시범 프로그램이 낸 답입니다. 답은
    출력 형식을 보여 줍니다.
ask:
  - >-
    긴급 요청을 어떻게 다루는지: 접수 당일 예약하되, 올 수 있는 첫날로부터 2영업일 이내의 날로 잡습니다. 모든 오전
    세션의 첫 두 슬롯 또는 세 슬롯(09:00과 09:20, 또는 09:00~09:40, 버전에 따라 다름)은 긴급 요청용으로 비워 두고,
    그 진료일의 전 영업일이 되어야 누구나 예약할 수 있게 풀립니다.
  - >-
    시민의 날인 11월 23일(월)에 어느 진료과가 휴진하는지: 버전에 따라 피부과, 정형외과 또는 소아청소년과입니다. 진료
    일정표에는 그날 세션이 그대로 남아 있습니다.
  - >-
    병원 전체에 대면 통역사가 하루 몇 명 있는지: 버전에 따라 2명, 3명 또는 4명입니다. 환자의 언어를 못 하는 의사와의
    초진에는 한 명씩 필요하고, 재진은 전화 통역이라 제한이 없습니다.
  - >-
    대기 목록의 우선순위: 버전에 따라 셋 중 하나입니다. 긴급도 다음 접수일 순, 긴급 요청 먼저 그다음 나머지 전부를 접수일
    순, 또는 긴급도 다음 환자가 올 수 있는 가장 이른 날 순입니다. 진료과·진료 구분(초진·재진)·이전 담당의가 같고
    우선순위가 더 높은 요청이 그 슬롯을 쓸 수 있었는데도 기다리고 있으면, 우선순위가 낮은 요청을 예약할 수 없습니다.
  - >-
    예약의 기본: 초진은 연속된 20분 슬롯 2개, 재진은 1개이고, 재진은 지난번에 본 의사에게 잡습니다(관행이라 외래
    운영실장이 예외를 승인할 수 있습니다). 날짜나 시각을 바꾸면 새 예약은 바꾼 날로부터 최소 3영업일 뒤여야 하고, 바꿀
    때마다 점수가 깎입니다.
  - >-
    매일 내는 현황표가 무엇을 세는지: 다음 10영업일 동안 누구나 예약할 수 있는 빈 슬롯, 2영업일 이상 앞의 비어 있는
    긴급 예비 슬롯, 대기 중인 요청(hard에서는 대기 중인 환자) 수입니다. 시민의 날 휴진 진료과는 빼고, medium부터는 의사
    부재일과 의뢰서가 만료된 요청도 뺍니다. 숫자 15개는 각각 정확히 맞아야만 맞은 것으로 봅니다.
  - >-
    medium·hard에서: 초진 환자의 의뢰서는 정해진 날짜에 만료됩니다. 공복 채혈은 진료 최소 1영업일 전에 해야 하고,
    검사실은 하루 5건, 6건 또는 7건(버전에 따라 다름)까지 받습니다. 의사나 통역사가 부재하면 해당 예약을 통지가 온 날
    옮기거나 대기 목록으로 되돌립니다.
  - >-
    hard에서: 환자마다 미내원(노쇼) 확률이 다르고, 미리 잡은 기간이 1영업일 늘 때마다 약 1%포인트 올라갑니다. 슬롯 하나에 재진
    2건을 넣을 수 있으며, 그런 슬롯은 의사·세션당 1개, 2개 또는 3개(버전에 따라 다름)까지입니다. 같은 환자가 같은
    진료과에 또 낸 요청은 같은 진료이므로 따로 예약하지 않습니다.
invalid_if:
  - >-
    어느 날이든 프로그램이 오류로 멈추거나 10초를 넘깁니다. 또는 형식이 잘못된 액션을 내거나, 대기 중이 아닌 요청을
    예약하거나, 다음 10영업일 밖의 날짜에 예약합니다.
  - >-
    한 슬롯에 예약이 두 건 들어갑니다(hard에서는 재진 3건 이상, 초진과 함께 쓰는 슬롯, 의사·세션당 허용보다 많은 공유
    슬롯). 또는 일정표에 없는 슬롯, 다른 진료과 의사, 환자의 진료 가능 시작일 이전 날짜에 예약합니다.
  - >-
    시민의 날 휴진 진료과에 예약하거나, 통역이 필요한 초진이 그날 통역사 수보다 많습니다. medium·hard에서는 의뢰서가
    만료된 뒤의 진료, 채혈이 없거나 늦거나 검사실 하루 한도를 넘는 경우, 부재 의사에게 예약이 남은 경우도 해당합니다.
  - >-
    긴급 요청이 접수 당일이 끝날 때까지 예약되지 않았거나 2영업일을 넘겨 잡힙니다. 또는 긴급이 아닌 환자가 2영업일 이상
    앞의 긴급 예비 슬롯에 들어갑니다.
  - >-
    예약의 날짜나 시각을 3영업일이 안 되는 앞날로 바꿉니다. 또는 그 슬롯을 쓸 수 있었던 더 높은 우선순위 요청이 기다리는데
    다른 요청을 예약합니다.
  - >-
    외래 운영실장의 예외 승인 없이 재진을 다른 의사에게 잡습니다. 또는 (hard) 한 환자가 한 진료과에 예약을 두 건 가집니다.
quality: >-
  80%는 운영 가치를 점수로 계산해 모범 답안 프로그램의 점수와 비교한 것입니다. 실제로 이루어진 진료의 20분 슬롯마다
  +10(초진은 2슬롯), 요청이 기다린 영업일마다 −0.4(긴급 ×3, 준응급 ×2, 일반 ×1), 끝내 예약하지 못한 요청마다 −10,
  병원이 예약을 옮기거나 취소할 때마다 −4입니다. 나머지 20%는 현황표 숫자 중 정확히 맞은 비율입니다. 기존 방식(0점)은
  같은 식으로 예약하지만 오전 긴급 예비 슬롯을 다음 날분으로 풀어 주지 않고 한 슬롯에 두 명을 겹쳐 잡지도 않으며, 모범 답안(1점)은 그 슬롯을 풀어
  대기 목록에서 우선순위대로 빈 슬롯을 채우고, hard에서는 안 올 가능성이 큰 환자의 재진을 겹쳐 잡습니다.
tiers:
  easy: >-
    일일 예약의 기본: 진료 시간, 진료과, 긴급 요청과 오전 긴급 예비 슬롯, 시민의 날 휴진, 통역사, 변경 시 3영업일 사전
    통보, 대기 우선순위, 재진은 이전 담당의에게, 현황표. 부재 통지, 의뢰서, 채혈, 미내원, 중복 요청은 이번에는 다루지
    않는다고 고객이 밝힙니다.
  medium: >-
    만료되는 의뢰서, 검사실 하루 한도 안에서 진료 최소 1영업일 전에 하는 공복 채혈, 그리고 20일 동안의 부재가 더해집니다.
    2주간 병가를 내는 소아청소년과 의사와 학회에 가는 심장내과 의사(그 기간 예약은 통지가 온 날 옮기거나 취소해야
    함), 하루 자리를 비우는 통역사입니다.
  hard: >-
    미내원(환자는 올 확률만큼만 진료한 것으로 세며, 예약부터 진료까지 기간이 길수록 그 확률이 떨어짐), 고객이 정한 한도 안에서 한 슬롯에 재진
    2건(둘 다 오면 −12 × 둘 다 올 확률), 중복 요청이 와도 환자·진료과당 예약 하나, 여러 진료과에 예약된 환자가 병원에
    오는 날이 하루 늘 때마다 −3이 더해지고, 직원 메모에는 효력이 없다고 고객이 밝힙니다.
