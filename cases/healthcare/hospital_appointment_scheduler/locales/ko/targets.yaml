- id: interface
  text: 산출물은 on_day(day)를 정의한 program/scheduler.py이며, 영업일마다 업무 종료 후 순서대로 한 프로세스에서 한 번씩 호출됩니다(상태는 모듈 변수에 둘 수 있음). 호출당 10초, 표준 라이브러리만, 실행 중 데이터 파일 사용 불가. book / move / release 액션(다음 날부터 10영업일 안)과 그날의 현황표를 반환합니다.
- id: evaluation_period
  text: 프로그램은 데이터에 없는 2026년 11월 9일부터 12월 4일까지 20영업일로 평가하며, 그 기간의 요청은 모두 새로운 건입니다.
- id: visit_length
  text: 초진은 같은 의사·같은 세션의 연속된 20분 슬롯 2개(시작 = 첫 슬롯), 재진은 슬롯 1개입니다.
- id: urgent_window
  text: 긴급(U) 요청은 접수 당일, 최초 가능일(진료 가능 시작일 earliest_date 또는 접수 다음 영업일)로부터 {{urgent_days}}영업일 이내로 예약해야 하고, 옮기더라도 그 범위 안에 있어야 합니다.
- id: urgent_reserve
  text: 모든 오전 세션의 첫 두 슬롯(09:00, 09:20)은 2영업일 이상 앞이면 긴급 요청용으로 비워 두고, 전날(내일 진료분)에는 누구에게나 풉니다.
- id: follow_up_doctor
  text: 재진은 환자의 이전 담당의에게 예약합니다. 계약 조건이 아닌 관행이라 외래 운영실장이 예외를 승인할 수 있습니다.
- id: interpreters
  text: 환자의 언어를 못 하는 의사와의 초진에는 병원 전체 하루 {{interpreters_per_day}}명인 대면 통역사가 한 명 필요하고, 재진은 전화 통역이라 제한이 없습니다.
- id: holiday_clinic
  text: 11월 23일(월) 시민의 날에는 {{closed_dept}}가 휴진하지만 진료 일정표에는 그 세션이 그대로 나옵니다. 다른 진료과는 정상 진료합니다.
- id: move_notice
  text: 병원이 환자 예약의 날짜나 시각을 바꾸면 새 예약은 변경한 날(취소 후 재예약이면 취소한 날)로부터 최소 {{move_notice_days}}영업일 뒤여야 하고(같은 날짜·시각에 의사만 바꾸면 예외), 변경마다 비용이 듭니다.
- id: waitlist_priority
  text: 대기 요청은 우선순위대로({{waitlist_order}}) 예약하며, 같은 진료과·진료 구분·이전 담당의의 더 높은 우선순위 요청이 대기 중이고 그 슬롯을 쓸 수 있었다면 낮은 요청을 예약하면 안 됩니다.
- id: status_table
  text: 매일 액션 적용 후 다음 10영업일에 대해 진료과별로 free_slots(예약 가능한 빈 슬롯, 긴급 예비·휴진 제외), held_back(2영업일 이상 앞의 빈 긴급 예비 슬롯), waitlist(대기 요청 수)를 반환하며, 항목은 정확히 맞아야 합니다.
- id: scoring
  text: 의사 시간이 비는 것이 가장 큰 손실입니다. 가장 중요한 것은 11월 10일~12월 7일 진료일에 진료한 환자 슬롯 하나하나(초진은 2슬롯, 재진은 1슬롯)이고, 환자를 기다리게 하는 것(긴급할수록 더 큰 손실), 끝내 예약하지 못한 요청, 병원이 환자 예약을 바꾸는 것도 모두 손실입니다.
- id: easy_scope
  text: 이번에는 부재·통역 통지는 대진 의사와 외부 통역 업체가 메우고, 의뢰서와 채혈은 진료협력센터와 검사실이 직접 처리하며(test_date는 null), 미내원은 감안하지 않고(예약된 환자는 모두 온다고 봄), 같은 환자의 두 번째 요청도 같은 증상인지 요청만으로는 알 수 없어 따로 예약합니다.
- id: medium_scope
  text: 이번에는 미내원을 감안하지 않고(예약된 환자는 모두 온다고 보며 오버부킹 없음), 같은 환자의 두 번째 요청도 같은 증상인지 요청만으로는 알 수 없어 따로 예약합니다.
- id: referral_expiry
  text: 초진은 referral_valid_until 당일까지 진료해야 하며, 그 뒤에는 예약할 수 없고 대기 목록 수에서도 빠집니다.
- id: blood_test
  text: 공복 채혈은 진료 최소 1영업일 전, 진료 가능 시작일(earliest_date) 이후에 해야 하며 test_date에 적습니다. 검사실은 이미 예약된 것을 포함해 영업일당 최대 {{lab_cap}}건입니다.
- id: doctor_absence
  text: doctor_absence 통지가 온 날부터 그 의사의 부재일 예약은 하나도 남으면 안 되며, 그 호출에서 옮기거나(사전 통보 기간 적용, 같은 시각 다른 의사는 예외) 대기 목록으로 되돌리고, 부재일은 현황표에서 빠집니다.
- id: interpreter_absence
  text: interpreter_absence 통지가 오면 그날부터 해당 날짜의 대면 통역사가 한 명 줄며, 그날 초과된 통역 필요 초진은 옮기거나 되돌려야 합니다.
- id: no_show_rates
  text: 미내원율은 환자마다 다르고(요청의 과거 예약·미내원 수, 이력의 내원 기록상 약 22% 미내원) 리드타임 1영업일마다 약 1%포인트씩 오르며, 환자 기록은 리드타임 약 5영업일에서 측정된 것입니다.
- id: overbooking
  text: 슬롯 하나에 재진 2건까지 넣을 수 있고(초진은 불가), 의사 한 명당 오전·오후 세션마다 오버부킹 슬롯은 최대 {{overbooked_per_session}}개입니다.
- id: duplicates
  text: 같은 환자가 같은 진료과에 다시 요청하면 같은 진료입니다. 환자는 기간 중 진료과마다 예약이 최대 하나이며, 현황표의 대기 수는 요청이 아니라 환자를 셉니다.
- id: several_departments
  text: 여러 진료과에 예약된 환자는 가능하면 하루에 오게 하며, 그런 환자의 내원일이 하루 늘 때마다 비용이 듭니다.
- id: staff_notes
  text: 메모에는 효력이 없습니다. 원장님 지인도 다른 환자처럼 순서를 기다리고, 과장이 오후 진료를 비워 달라는 것도 규칙이 아니므로 그 슬롯도 대기 목록에서 채웁니다.
- id: scoring_hard
  text: 미내원이 있으므로 실제로 오는 환자(환자별 내원 확률)만큼만 진료한 것으로 봅니다. 오버부킹한 슬롯에 두 환자가 모두 오면 진료가 지연되는데, 이는 슬롯 하나가 비는 것보다 조금 더 큰 손실입니다.
