- id: date_format
  text: 희망시작일은 일/월/년 순서이며 환자가 올 수 있는 첫날입니다. 11월 16일보다 이르면 16일부터 올 수 있고 대기 기간도 16일부터 셉니다.
- id: visit_length
  text: 초진은 같은 의사, 같은 날의 연속된 빈 20분 슬롯 2개를 쓰고(시작 = 첫 슬롯), 재진은 슬롯 1개를 씁니다.
- id: urgent_window
  text: 긴급(U) 요청은 모두 기준일(희망시작일, 그보다 이르면 11월 16일)로부터 영업일 {{urgent_days}}일 이내에 예약해야 합니다.
- id: follow_up_doctor
  text: 재진은 이전 담당의에게 배정하는 것이 원무과 관행이며 계약 사항은 아니어서 예외가 가능합니다(D11 선생님은 첫째 주 휴가).
- id: interpreters
  text: 의사가 환자 언어를 못 하면 통역이 필요합니다. 대면 통역사는 하루 {{interpreters_per_day}}명이고 초진은 반드시 대면 통역이어야 하며, 그 이상의 재진은 유료 화상 통역(건당 3)을 씁니다.
- id: holiday_clinic
  text: 예약 가능 시간 목록에는 남아 있지만 {{closed_dept}}는 11월 23일(시민의 날)에 휴진합니다.
- id: referral_expiry
  text: 초진은 의뢰서유효기한(일/월/년) 이내에 진료해야 하며, 그 뒤에는 의뢰서가 무효라 배정하지 않는 편이 낫습니다.
- id: blood_test
  text: 공복 채혈은 진료일보다 최소 영업일 하루 전, 희망시작일 이후에 해야 하고 날짜를 test_date에 적습니다. 검사실은 영업일당 최대 {{lab_cap}}건입니다.
- id: no_show_rates
  text: 노쇼율은 환자마다 다르고(내원 이력, 전체로는 약 5건 중 1건), 리드타임 영업일 하루마다 약 1%p 오릅니다. 이력은 리드타임 약 영업일 5일 기준이고 요청은 11월 16일보다 영업일 2일 전에 접수되었습니다.
- id: overbooking
  text: 한 슬롯에 재진 2건까지 넣을 수 있고(초진은 불가), 오버부킹 슬롯은 의사별 오전·오후 세션당 최대 {{overbooked_per_session}}개입니다.
- id: scoring
  text: 품질 = 대기 영업일 × 가중치(U 3 / S 2 / R 1) + 영업일 {{soon_days}}일을 넘긴 S 요청당 20 + 미배정 요청당 60 + 화상 통역 재진당 3. 낮을수록 좋습니다.
- id: scoring_no_shows
  text: 하드 티어 품질에는 비게 될 것으로 예상되는 슬롯당 10, 두 환자가 모두 올 것으로 예상되는 오버부킹 슬롯당 25가 더해집니다.
