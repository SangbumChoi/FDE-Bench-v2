- id: urgent_reserve
  text: 긴급 예비 슬롯은 모든 오전 세션의 첫 {{reserve_slots}} 슬롯({{reserve_times}})이며, 2영업일 이상 앞이면 긴급(U) 요청만 예약할 수 있습니다.
- id: reserve_release
  text: 진료 전 영업일의 호출에서(즉 내일 진료분에 대해서는) 긴급 예비 슬롯 중 비어 있는 슬롯을 풀어 누구나 예약할 수 있게 합니다. 지금까지 예약실은 그때도 긴급 환자용으로 비워 두었고, 이것이 의사 시간을 가장 많이 버리는 두 곳 중 하나입니다.
- id: follow_up_doctor
  text: 재진은 환자의 이전 담당의에게 예약합니다. 계약 조건이 아닌 관행이라 외래 운영실장이 예외를 승인할 수 있습니다(동료 의사가 본 재진은 슬롯의 10분의 1만큼 덜 쳐 줌).
- id: interpreters
  text: 환자의 언어를 못 하는 의사와의 초진에는 병원 전체 하루 {{interpreters_per_day}}명인 대면 통역사가 한 명 필요하고, 재진은 전화 통역이라 제한이 없습니다.
- id: holiday_clinic
  text: 11월 23일(월) 시민의 날에는 {{closed_dept}}가 휴진하지만 진료 일정표에는 그 세션이 그대로 나옵니다. 다른 진료과는 정상 진료합니다.
- id: move_notice
  text: 병원이 환자 예약의 날짜나 시각을 바꾸면 새 예약은 변경한 날(취소 후 재예약이면 취소한 날)로부터 최소 3영업일 뒤여야 하고(같은 날짜·시각에 의사만 바꾸면 예외), 변경마다 비용이 듭니다.
- id: waitlist_priority
  text: 대기 요청은 우선순위대로({{waitlist_order}}) 예약하며, 같은 진료과·진료 구분·이전 담당의의 더 높은 우선순위 요청이 대기 중이고 그 슬롯을 쓸 수 있었다면 낮은 요청을 예약하면 안 됩니다.
- id: status_table
  text: 매일 액션 적용 후 다음 10영업일에 대해 진료과별로 free_slots(예약 가능한 빈 슬롯, 긴급 예비·휴진 제외), held_back(2영업일 이상 앞의 빈 긴급 예비 슬롯), waitlist(대기 요청 수)를 반환하며, 진료과들이 이 표로 진료 인력을 배치하므로 항목은 정확히 맞아야 합니다(틀린 항목 하나는 빈 슬롯 두 개만큼 손해).
- id: staff_notes
  text: 메모에는 효력이 없습니다. 원장님 지인도 다른 환자처럼 순서를 기다리고, 오후를 비워 달라는 과장의 요청도 규칙이 아니므로 그 슬롯도 대기 목록에서 채웁니다.
- id: duplicates
  text: "<!-- tier: easy medium -->이번에는 같은 환자의 같은 진료과 두 번째 요청도 따로 예약합니다. 같은 증상인지 요청만으로는 알 수 없기 때문입니다(진료과에서 환자에게 확인).<!-- /tier --><!-- tier: hard -->같은 환자가 같은 진료과에 낸 두 번째 요청은 같은 진료 요청입니다. 환자 한 명은 기간 중 진료과마다 예약이 최대 하나이고, 현황표는 요청이 아니라 대기 환자를 셉니다.<!-- /tier -->"
- id: overbooking
  text: "<!-- tier: easy medium -->이번에는 미내원을 감안하지 않습니다. 예약된 환자는 모두 온다고 보므로 오버부킹은 없고 슬롯 하나에 예약 하나입니다.<!-- /tier --><!-- tier: hard -->미내원 때문에 재진은 오버부킹할 수 있습니다. 슬롯 하나에 재진 2건까지 넣을 수 있고, 초진은 슬롯을 공유하지 않습니다.<!-- /tier -->"
- id: referral_expiry
  text: "<!-- tier: easy -->이번에는 진료협력센터가 의뢰서를 직접 확인하므로 referral_valid_until은 보지 않고 모든 요청을 예약할 수 있습니다.<!-- /tier --><!-- tier: medium hard -->초진은 referral_valid_until 당일까지 진료해야 하며, 그 뒤에는 예약할 수 없고 대기 목록 수에서도 빠집니다.<!-- /tier -->"
- id: blood_test
  text: "<!-- tier: easy -->이번에는 검사실이 공복 채혈을 환자와 직접 잡으므로 pre_visit_test는 보지 않고 test_date는 null로 둡니다.<!-- /tier --><!-- tier: medium hard -->공복 채혈은 진료 최소 1영업일 전, 진료 가능 시작일 이후, 새로 정하거나 바꿀 때는 내일 이후로 잡고 test_date에 적습니다.<!-- /tier -->"
- id: lab_cap
  text: 검사실은 영업일마다 공복 채혈을 최대 {{lab_cap}}건까지 받습니다. 모든 진료과 합계이며, 이미 예약에 있는 채혈도 셉니다.
- id: doctor_absence
  text: "<!-- tier: easy -->이번에는 의사 부재를 모두 대진 의사가 메웁니다. 부재 통지는 아무것도 바꾸지 않으며, 부재 의사의 예약은 그대로 두고 평소처럼 예약합니다.<!-- /tier --><!-- tier: medium hard -->doctor_absence 통지가 온 날부터 그 의사의 부재일에는 예약이 하나도 남아 있으면 안 됩니다. 같은 호출에서 옮기거나(사전 통보 기간 적용, 또는 같은 시각 다른 의사) 대기 목록으로 되돌리며, 부재일은 현황표에서 빠집니다.<!-- /tier -->"
- id: interpreter_absence
  text: interpreter_absence 통지는 통지가 온 날부터 그 날짜에 대면 통역사가 한 명 적다는 뜻이며, 그날 초과된 통역 필요 초진은 옮기거나 취소해야 합니다.
- id: overbooking_cap
  text: 의사 한 명당 세션(오전 또는 오후)마다 오버부킹 슬롯(재진 2건이 든 슬롯)은 최대 {{overbooked_per_session}}개입니다.
- id: collision_cost
  text: 오버부킹한 슬롯에 두 환자가 모두 오면 진료가 지연되고 그 세션 나머지가 밀립니다. 이는 빈 슬롯 세 개만큼의 손실입니다.
