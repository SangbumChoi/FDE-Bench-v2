- id: date_format
  text: 受診可能日は日/月/年の順で、患者さんが来られる最初の日です。11月16日より前なら16日から来られ、待ち時間も16日から数えます。
- id: visit_length
  text: 初診は同じ医師・同じ日の連続した空き20分枠を2つ使い（開始 = 最初の枠）、再診は1枠です。
- id: urgent_window
  text: 緊急（U）の依頼はすべて基準日（受診可能日、それより前なら11月16日）から{{urgent_days}}営業日以内に予約する必要があります。
- id: follow_up_doctor
  text: 再診を前回担当医に割り当てるのは受付の慣行で契約ではないので、例外にできます（D11医師は第1週休暇）。
- id: interpreters
  text: 医師が患者さんの言語を話せないと通訳が必要です。対面通訳は1日{{interpreters_per_day}}人で初診は必ず対面、それを超える再診は有料のビデオ通訳（1件3）を使います。
- id: holiday_clinic
  text: 空き枠一覧には残っていますが、{{closed_dept}}は11月23日（市民の日）休診です。
- id: referral_expiry
  text: 初診は紹介状有効期限（日/月/年）までに診察する必要があり、それを過ぎると紹介状が無効なので入れないほうがよいです。
- id: blood_test
  text: 空腹時採血は診察の少なくとも1営業日前、受診可能日以降に行い、日付をtest_dateに書きます。検査室は1営業日あたり{{lab_cap}}件までです。
- id: no_show_rates
  text: 無断キャンセル率は患者さんごとに異なり（受診履歴、全体では約5件に1件）、リードタイム1営業日ごとに約1ポイント上がります。履歴はリードタイム約5営業日で測ったもので、依頼は11月16日の2営業日前に受け付けました。
- id: overbooking
  text: 1つの枠に再診2件まで入れられ（初診は不可）、オーバーブッキングした枠は医師ごとに午前・午後それぞれ{{overbooked_per_session}}つまでです。
- id: scoring
  text: 品質 = 待ち営業日 × 重み（U 3 / S 2 / R 1）＋ {{soon_days}}営業日を超えたSの依頼ごとに20 ＋ 未予約の依頼ごとに60 ＋ ビデオ通訳の再診ごとに3。低いほど良いです。
- id: scoring_no_shows
  text: ハードの品質には、空くと見込まれる枠ごとに10、2人とも来ると見込まれるオーバーブッキング枠ごとに25が加わります。
