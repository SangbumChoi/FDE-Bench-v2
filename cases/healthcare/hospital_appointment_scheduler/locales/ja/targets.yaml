- id: interface
  text: 成果物は on_day(day) を定義した program/scheduler.py で、営業日ごとに業務終了後、順番に同じプロセスで1回ずつ呼ばれます（状態はモジュール変数に保持可）。1回10秒、標準ライブラリのみ、実行時にデータファイルは使えません。book / move / release のアクション（翌日から10営業日以内）とその日の状況表を返します。
- id: evaluation_period
  text: プログラムはデータにない2026年11月9日から12月4日までの20営業日で評価され、その期間の依頼はすべて新しいものです。
- id: visit_length
  text: 初診は同じ医師・同じセッションの連続した20分枠2つ（開始 = 最初の枠）、再診は1枠です。
- id: urgent_window
  text: 緊急（U）の依頼は受付当日に、最短受診可能日（受診可能日または受付翌営業日）から{{urgent_days}}営業日以内に予約し、移す場合もその範囲内に保つ必要があります。
- id: urgent_reserve
  text: すべての午前セッションの最初の2枠（09:00と09:20）は、2営業日以上先なら緊急の依頼用に空けておき、前日（翌日の外来分）には誰にでも解放します。
- id: follow_up_doctor
  text: 再診は患者さんの前回担当医に予約します。契約上のルールではなく慣行なので、外来運営室長が例外を認められます。
- id: interpreters
  text: 患者さんの言語を話せない医師との初診には、病院全体で1日{{interpreters_per_day}}名の対面通訳者が1名必要です。再診は電話通訳で制限はありません。
- id: holiday_clinic
  text: 11月23日（月）の市民の日は{{closed_dept}}が休診ですが、外来枠表にはそのセッションがそのまま載っています。ほかの診療科は通常どおりです。
- id: move_notice
  text: 病院が患者さんの予約の日付や時刻を変える場合、新しい予約は本日から{{move_notice_days}}営業日以上先でなければならず（同じ日時で医師だけ替えるのは例外）、変更のたびにコストがかかります。
- id: waitlist_priority
  text: 待っている依頼は優先順位（{{waitlist_order}}）で予約し、同じ診療科・受診区分・前回担当医でより優先度の高い依頼が待っていてその枠を使えたなら、低いほうを予約してはいけません。
- id: status_table
  text: 毎日アクション適用後、次の10営業日について診療科ごとに free_slots（予約可能な空き枠、確保枠と休診を除く）、held_back（2営業日以上先の空いている緊急用確保枠）、waitlist（待ち依頼の数）を返します。各項目は完全一致が必要で、状況表は品質の20%です。
- id: scoring
  text: 品質は 0.8 × 顧客の基準プログラムに対する運営価値 + 0.2 × 状況表の精度です。運営価値は11月10日〜12月7日に診察した患者枠ごとに +10、待った営業日ごとに − 0.4 × 緊急度の重み（U 3、S 2、R 1）、最後まで予約できなかった依頼ごとに − 10、予約変更ごとに − 4 です。
- id: easy_scope
  text: 今回は不在・通訳の連絡、紹介状の期限、採血、無断欠席は範囲外で（test_date は null、予約した患者さんは全員来るものとする）、依頼1件ごとに別の受診として扱います。
- id: medium_scope
  text: 今回は無断欠席が範囲外で（予約した患者さんは全員来るものとし、オーバーブッキングなし）、同じ患者さんが2回依頼しても依頼ごとに別の受診として扱います。
- id: referral_expiry
  text: 初診は referral_valid_until の当日までに受診する必要があり、それを過ぎると予約できず、待ちリストの数からも外れます。
- id: blood_test
  text: 空腹時採血は受診の1営業日以上前、受診可能日以降に行い test_date に書きます。検査室は予約済みのものを含め1営業日あたり最大{{lab_cap}}件です。
- id: doctor_absence
  text: doctor_absence の連絡が届いた日から、その医師の不在日の予約は1件も残してはならず、その呼び出しで移す（予告期間あり、同時刻の別の医師は例外）か待ちリストに戻します。不在日は状況表から外れます。
- id: interpreter_absence
  text: interpreter_absence の連絡が届くと、その日から該当日の対面通訳者が1名減り、その日の超過した通訳が必要な初診は移すか戻す必要があります。
- id: no_show_rates
  text: 無断欠席率は患者さんごとに異なり（依頼の過去の予約数・無断欠席数、履歴では約22%）、リードタイム1営業日ごとに約1ポイント上がります。患者さんの記録はリードタイム約5営業日で測ったものです。
- id: overbooking
  text: 1枠に再診2件まで入れられ（初診は不可）、医師1人につき午前・午後のセッションごとにオーバーブッキング枠は最大{{overbooked_per_session}}枠です。
- id: duplicates
  text: 同じ患者さんが同じ診療科にまた依頼してきたら同じ受診です。患者さんは期間中、診療科ごとに予約が最大1つで、状況表の待ち数は依頼ではなく患者さんを数えます。
- id: several_departments
  text: 複数の診療科に予約された患者さんはできれば1日で来てもらい、そうした患者さんの来院日が1日増えるごとに3差し引かれます。
- id: staff_notes
  text: メモに効力はありません。院長の知人もほかの患者さんと同じく順番を待ち、部長が午後の外来を空けておいてほしいと言ってもルールではないので、その枠も待ちリストから埋めます。
- id: scoring_hard
  text: 今回は診察枠を患者さんごとの無断欠席確率に対する期待値で数え、オーバーブッキング枠ごとに 12 × 2人とも来る確率を差し引きます。
