- id: urgent_reserve
  text: 緊急用の確保枠はすべての午前セッションの最初の{{reserve_slots}}枠（{{reserve_times}}）で、2営業日以上先なら緊急（U）の依頼しか予約できません。
- id: reserve_release
  text: 外来の前営業日の呼び出しで（つまり翌日の外来分について）、確保枠のうち空いている枠を解放し、誰でも予約できるようにします。これまで予約係はそのときも緊急の患者さん用に空けたままにしており、それが医師の時間をいちばん無駄にしている2つのうちの1つです。
- id: follow_up_doctor
  text: 再診は患者さんの前回担当医に予約します。契約上のルールではなく慣行なので、外来運営室長が例外を認めることができます（同僚が診た再診は枠の10分の1だけ少なく数えます）。
- id: interpreters
  text: 患者さんの言語を話さない医師との初診には、病院全体で1日{{interpreters_per_day}}人いる対面通訳のうち1人が必要です。再診は電話通訳で、上限はありません。
- id: holiday_clinic
  text: 11月23日（月）の市民の日は{{closed_dept}}が休診ですが、外来枠表にはそのセッションがそのまま載っています。ほかの診療科は通常どおりです。
- id: move_notice
  text: 病院が患者さんの予約の日付か時刻を変えるときは、新しい予約は変更した日（取り消して後で予約し直すなら取り消した日）から少なくとも3営業日後でなければなりません（同じ日時で医師だけ替えるなら不要）。変更のたびにコストがかかります。
- id: waitlist_priority
  text: 待ちの依頼は優先順位（{{waitlist_order}}）どおりに予約し、同じ診療科・受診区分・前回担当医でより優先度の高い依頼がまだ待っていてその枠を使えたなら、低い依頼を予約してはいけません。
- id: status_table
  text: 毎日、アクションの後で次の10営業日について診療科ごとに free_slots（予約できる空き枠、確保枠と休診を除く）、held_back（2営業日以上先の空いている確保枠）、waitlist（待ちの依頼数）を返します。各診療科はこの表で外来の人員を決めるので、各項目は完全に一致する必要があります（間違った項目1つは空き枠2つ分の損失）。
- id: staff_notes
  text: メモには効力がありません。院長の知人もほかの患者さんと同じく順番を待ち、午後を空けておいてほしいという部長の希望もルールではないので、その枠も待ちリストから埋めます。
- id: duplicates
  text: "<!-- tier: easy medium -->今回は同じ患者さんの同じ診療科への2件目の依頼も別に予約します。同じ症状かどうかは依頼だけではわからないからです（診療科が患者さんに確認します）。<!-- /tier --><!-- tier: hard -->同じ患者さんの同じ診療科への2件目の依頼は、同じ受診の依頼です。患者さん1人につき期間中の予約は診療科ごとに最大1つで、状況表は依頼ではなく待っている患者さんを数えます。<!-- /tier -->"
- id: overbooking
  text: "<!-- tier: easy medium -->今回は無断欠席を見込みません。予約した患者さんは全員来るものとするので、オーバーブッキングはせず、1枠に1予約です。<!-- /tier --><!-- tier: hard -->無断欠席があるため、再診はオーバーブッキングできます。1枠に再診2件まで入れられ、初診は枠を共有しません。<!-- /tier -->"
- id: referral_expiry
  text: "<!-- tier: easy -->今回は地域連携室が紹介状を自分で確認するので、referral_valid_until は見ずにどの依頼も予約できます。<!-- /tier --><!-- tier: medium hard -->初診は referral_valid_until の当日までに受診しなければならず、それを過ぎると予約できず、待ちの人数にも数えません。<!-- /tier -->"
- id: blood_test
  text: "<!-- tier: easy -->今回は検査室が空腹時採血を患者さんと直接決めるので、pre_visit_test は見ずに test_date は null のままにします。<!-- /tier --><!-- tier: medium hard -->空腹時採血は受診の少なくとも1営業日前、受診可能日以降、新しく決めたり変えたりするときは明日以降にし、test_date に書きます。<!-- /tier -->"
- id: lab_cap
  text: 検査室が受けられる空腹時採血は1営業日あたり最大{{lab_cap}}件で、全診療科の合計です。すでに予約にある採血も数えます。
- id: doctor_absence
  text: "<!-- tier: easy -->今回は医師の不在はすべて代診医がカバーします。不在の通知では何も変わらず、不在医師の予約はそのまま残し、いつもどおり予約します。<!-- /tier --><!-- tier: medium hard -->doctor_absence の通知が届いた日から、その医師の不在日に予約を残してはいけません。同じ呼び出しで移す（事前通知期間を守るか、同じ時刻でほかの医師へ）か待ちリストに戻し、不在日は状況表から外します。<!-- /tier -->"
- id: interpreter_absence
  text: interpreter_absence の通知は、届いた日からその日付の対面通訳が1人少ないという意味で、その日の超過した通訳の必要な初診は移すか取り消さなければなりません。
- id: overbooking_cap
  text: 医師1人につきセッション（午前または午後）ごとのオーバーブッキング枠（再診2件が入った枠）は最大{{overbooked_per_session}}枠です。
- id: collision_cost
  text: オーバーブッキングした枠で2人とも来ると外来が押し、そのセッションの残りがすべて遅れます。それは空き枠3つ分の損失です。
