# The explainer's case texts in Japanese (English comes from case.yaml).
role: 病院の外来予約担当者
task_type: 意思決定プログラム
deliverable_spec: |
  program/ ディレクトリに、on_day(day) を定義した scheduler.py を置きます。エンジンはこれを一度だけ読み込み、
  隠れた期間の営業日ごとに順番に、同じプロセスで1回ずつ呼び出します（モジュールレベルの状態は呼び出しの間も
  保たれます）。1回の呼び出しは10秒まで、Python の標準ライブラリのみで、実行中はネットワークもデータファイルへの
  アクセスもありません。
  day = {"date", "day_index", "days_in_period", "period_end", "booking_window": {"first", "last"}, "doctors",
  "sessions", "new_requests", "notices", "attendance", "book", "waitlist"} で、試行日の入力ファイルとまったく同じです。
  戻り値は {"actions": [{"type": "book" | "move", "request_id", "doctor_id", "date": "YYYY-MM-DD",
  "start": "HH:MM", "test_date": "YYYY-MM-DD" または null} | {"type": "release", "request_id"}],
  "status_table": {department_code: {"free_slots": int, "held_back": int, "waitlist": int}}} で、試行日の
  出力ファイルと同じ形式です。アクションは順番に適用され、予約されなかった依頼は待ちリストに残ります。
tiers:
  easy: >-
    日々の予約の中核です。初診 = 連続した2枠、再診 = 1枠、診療科の一致、受診可能日より前には入れない、緊急の予約期限、緊急用確保枠（午前セッションの最初の2〜3枠は前日まで緊急の依頼のために空けておく）、外来枠表には載っているのに市民の日の祝日に休診する診療科が一つ、初診に必要な1日あたりの対面通訳者数、予約を動かすときの予告期間、待ちリストの優先順位、再診は前回担当医に（緩和可能）、毎日の状況表。不在と通訳の連絡、紹介状の期限、採血、無断欠席、重複依頼は範囲外です。
  medium: >-
    easy に加えて、期限が切れる紹介状、1日の検査室の上限内で受診の1営業日以上前に行う空腹時採血、医師の不在（不在の医師の予約は予告期間を守って移す必要がある）、通訳者の不在（その日は通訳者が1名減る）が適用されます。
  hard: >-
    medium に加えて、無断欠席（患者さんごとの隠れた無断欠席率がリードタイムとともに上がり、運営価値は診察した患者さんの期待値で数える）、再診のオーバーブッキング（1枠に2件、医師のセッションごとの上限、2人とも来た場合の期待コスト）、重複依頼（患者さん・診療科ごとに予約は1つ、待ちリストでは一つの受診ニーズとみなす）、複数の診療科に予約された患者さんの余分な来院が適用されます。
rules:
  well_formed: すべての呼び出しが、実在する依頼について正しい形式のアクションを返します（予約は待っている依頼だけ、移動・取り消しはこれからの予約だけ）。日付は予約可能期間（次の10営業日）内でなければならず、呼び出しが失敗したり時間切れになったりした場合も違反です。
  no_double_booking: 医師の20分枠1つに入る予約は最大1件です。
  slot_capacity: 医師の20分枠1つに入る予約は最大2件で、どちらも再診でなければなりません。初診は自分の枠をほかの予約と共有しません。
  slot_length: 予約はその医師のその日の外来枠表のセッション枠を使います。初診は同じセッションの連続した2枠、再診は1枠です。
  department_match: 依頼はその診療科の医師に予約します。
  holiday_closure: '{{closed_dept}}は2026年11月23日（月）の市民の日に休診します。外来枠表にはその日のセッションがそのまま載っていますが、その日の{{closed_dept}}の予約はあってはなりません。'
  not_before_earliest: 依頼の受診可能日（earliest_date）より前には予約しません。
  interpreter_capacity: 患者さんの言語を話せない医師との初診は、病院全体で1日最大{{interpreters_per_day}}件です（1件ごとに対面通訳者が1名必要で、medium 以上では通訳者が不在の日は1名減ります）。
  lab_capacity: 検査室が受ける空腹時採血は1営業日あたり最大{{lab_cap}}件です。
  test_before_visit: 空腹時採血が必要な依頼は、採血日が受診可能日から受診前の営業日までの間になければなりません（新たに決める採血日は将来の日付）。
  doctor_available: 不在の連絡が届いたあとは、その医師の不在日に残っている予約も、新たに入れる予約もあってはなりません。
  urgent_window: 緊急（U）の依頼はすべて受付当日に、最短受診可能日（受診可能日または翌営業日）から2営業日以内に予約され、その後もその範囲を出ません。
  urgent_reserve: すべての午前セッションの最初の{{reserve_slots}}枠（{{reserve_times}}）は、前営業日まで緊急の依頼のために空けておきます。2営業日以上先なら、S や R の依頼をそこに予約したり移したりしません。
  move_notice: 病院が患者さんの予約の日付や時刻を変える場合、新しい予約は変更した日から3営業日以上先でなければなりません。病院が取り消してあとで取り直す依頼は、取り消した日から数えます（同じ日付・時刻で別の医師に替える場合は予告が要りません）。
  waitlist_priority: 待っている依頼は優先順位（{{waitlist_order}}）で予約します。同じ診療科・同じ受診区分・同じ前回担当医で、より優先順位の高い依頼がまだ待っていてその枠を使えたのであれば、それより低い依頼は予約しません。
  overbooking_limit: オーバーブッキング枠（再診が2件入った枠）は、医師1人につきセッション（午前または午後）ごとに最大{{overbooked_per_session}}枠です。
  one_per_department: 患者さん1人につき、期間中の予約は診療科ごとに最大1つです（すでに受けた受診でも、これからの予約でも）。重複依頼（同じ患者さん・同じ診療科）を2つ目の予約として入れることはありません。
  follow_up_same_doctor: 再診は患者さんの前回担当医に予約します。外来運営室長が例外を認めることのできる慣行です。
