# The case in plain words, shown at the top of its page.
task: >-
  病院の外来予約係の仕事を回す Python プログラムを作ります。プログラムは毎営業日の業務終了後に、その日の予約依頼を次の10営業日の医師の空いている20分枠に予約し、新しく空いた枠を待ちリストから埋め、診療科ごとに空き枠・緊急用に確保している枠・待っている依頼の数を報告します。目的は、病院の予約ルールを一つも破らずに、空いたままになる医師の診療時間をできるだけ減らすことで、データに含まれない20営業日（2026年11月9日〜12月4日）で動かして評価します。
given:
  - >-
    顧客の依頼：11月9日（月）から、予約係が毎営業日、医師の空き枠に患者さんを予約して診療科ごとの状況を報告するプログラムで仕事をしたい、「何よりも、空き枠のせいで医師の診療時間が無駄になるのを減らしたい」という内容です。予約ルールは一つも書かれていません。
  - >-
    `予約システム_エクスポート.sql`：11月6日（金）時点の予約システムです。5診療科（内科、循環器内科、皮膚科、整形外科、小児科）の医師14名と対応言語、週間の外来担当、11月20日までの外来枠表、過去4週間の予約依頼と予約およびその結果（患者さんの約22%が来院せず）、キャンセル、待ちリスト（まだ待っている依頼45件）、11月9日以降にすでに入っている予約359件が入っています。
  - >-
    `mail/`：予約係が受け取ったメール7通です。過去の医師2名と通訳者1名の不在、リストを求める部長のメール、院長の知人を「明日の午前で」と頼む院長室のメール、そして市民の日（11月23日（月）。外来枠表は変更していない）とデータのコードについての外来管理室からの連絡です。
  - >-
    `試行日_入力例.json` と `試行日_出力例.json`：プログラムが毎日受け取る入力1日分（次の10営業日の外来枠表、新しい依頼、キャンセルや不在などの連絡、現在の予約、待ちリスト）をそのまま収めたものと、顧客の試行版プログラムの回答です。回答は出力の形式を示しています。
ask:
  - >-
    緊急の依頼の扱い：受け付けた当日に、来られる最初の日から2営業日以内の日で予約します。すべての午前セッション（医師ごとの午前の外来）の最初の2枠または3枠（09:00と09:20、または09:00〜09:40。バージョンによって違います）は緊急用に空けておき、前営業日になって初めて誰でも予約できるようになります。
  - >-
    市民の日の11月23日（月）にどの診療科が休診するか：バージョンによって皮膚科、整形外科、小児科のいずれかです。外来枠表にはその日のセッションが残ったままです。
  - >-
    病院全体の対面通訳者が1日何名いるか：バージョンによって2名、3名、4名のいずれかです。患者さんの言語を話せない医師との初診には1名ずつ必要で、再診は電話通訳なので制限はありません。
  - >-
    待ちリストの優先順位：バージョンによって次の三つのいずれかです。緊急度の次に受付日順、緊急の依頼を先にしてあとはすべて受付日順、または緊急度の次に患者さんが来られる最も早い日の順です。同じ診療科・同じ受診区分・同じ医師のより優先順位の高い依頼がその枠を使えたのに待っている間は、低い依頼を予約できません。
  - >-
    予約の基本：初診は連続した20分枠2つ、再診は1つで、再診は前回診た医師に入れます（慣行なので、外来運営室長が例外を認めることができます）。日付や時刻を変えるときは変更した日から3営業日以上先にする必要があり、変えるたびに点数が引かれます。
  - >-
    毎日返す状況表が何を数えるか：次の10営業日について、誰でも予約できる空き枠、2営業日以上先の空いている緊急用確保枠、待っている依頼（hard では待っている患者さん）の数です。市民の日に休診する診療科は除き、medium からは医師の不在日と紹介状が切れた依頼も除きます。15個の数字は完全に一致したときだけ正解です。
  - >-
    medium・hard では：初診の患者さんの紹介状は決まった日に切れます。空腹時採血は受診の1営業日以上前に必要で、検査室は1日5件、6件、7件（バージョンによって違います）までです。医師や通訳者が不在になったら、該当する予約を連絡が届いた日に移すか待ちリストに戻します。
  - >-
    hard では：無断欠席率は患者さんごとに違い、予約から受診までが1営業日延びるごとに約1ポイント上がります。1枠に再診2件まで入れられ、そうした枠は医師・セッションごとに1枠、2枠、3枠（バージョンによって違います）までです。同じ患者さんの同じ診療科への2件目の依頼は同じ受診なので、別に予約しません。
invalid_if:
  - >-
    どれかの日にプログラムがエラーで止まるか10秒を超えます。または形式の正しくないアクションを返す、待っていない依頼を予約する、次の10営業日の外に予約する、のいずれかをします。
  - >-
    1枠に予約が2件入ります（hard では再診3件以上、初診と共有する枠、医師・セッションごとに認められた数を超える共有枠）。または外来枠表にない枠、別の診療科の医師、患者さんの受診可能日より前の日に予約します。
  - >-
    市民の日に休診する診療科に予約するか、通訳が必要な初診がその日の通訳者数を超えます。medium・hard では、紹介状が切れた後の受診、採血がない・遅い・検査室の1日の上限を超える場合、不在の医師に予約が残る場合も該当します。
  - >-
    緊急の依頼が受け付けた日の終わりまでに予約されていないか、2営業日を超えた日に入っています。または緊急でない患者さんが2営業日以上先の緊急用確保枠に入ります。
  - >-
    予約の日付や時刻を3営業日未満先に変えます。またはその枠を使えたより優先順位の高い依頼が待っているのに、別の依頼を予約します。
  - >-
    hard で、1人の患者さんが1つの診療科に予約を2件持ちます。または再診を別の医師に入れます。ただし再診については、会社の方針がこの慣行を緩めることを認めていて、AIが先に顧客に例外を申請した場合は認められます。
quality: >-
  80%は点数で表す運営価値を、模範解答のプログラムの運営価値と比べたものです。実際に行われた受診の20分枠ごとに +10（初診は2枠）、依頼が待った営業日ごとに −0.4（緊急 ×3、早期 ×2、通常 ×1）、最後まで予約できなかった依頼ごとに −10、病院が予約を移したり取り消したりするたびに −4 です。残りの20%は状況表の数字のうち完全に一致した割合です。従来のやり方（0点）は同じように予約しますが、午前の緊急用確保枠を翌日分として解放せず、オーバーブッキングもしません。模範解答（1点）はその枠を解放し、空いた枠を待ちリストから優先順位どおりに埋め、hard では来ない可能性の高い患者さんの再診を重ねて予約します。
tiers:
  easy: >-
    毎日の予約の基本：受診時間、診療科、緊急の依頼と午前の緊急用確保枠、市民の日の休診、通訳者、変更時の3営業日の予告、待ちリストの優先順位、再診は前回担当医に、状況表。不在の連絡、紹介状、採血、無断欠席、重複依頼は今回は扱わないと顧客が明言しています。
  medium: >-
    期限が切れる紹介状、検査室の1日の上限内で受診の1営業日以上前に行う空腹時採血、そして20日間の不在が加わります。2週間病欠する小児科の医師と学会に出る循環器内科の医師（その期間の予約は連絡が届いた日に移すか取り消す必要があります）、1日不在の通訳者です。
  hard: >-
    無断欠席（患者さんは来る確率の分だけ受診したと数え、予約から受診までが長いほどその確率が下がります）、顧客が決めた上限内で1枠に再診2件を入れるオーバーブッキング（2人とも来る確率 × 12 を差し引く）、重複依頼があっても患者さん・診療科ごとに予約は1つ、複数の診療科に予約された患者さんの来院日が1日増えるごとの −3 が加わります。職員のメモには効力がないことも顧客が明言しています。
