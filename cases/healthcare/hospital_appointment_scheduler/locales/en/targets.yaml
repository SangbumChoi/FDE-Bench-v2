- id: urgent_reserve
  kind: missing
  domain: business rule
  param: reserve_slots
  text: The urgent reserve is the first {{reserve_slots}} slots of every morning session ({{reserve_times}}); two or more working days ahead only urgent (U) requests may be booked there.
- id: reserve_release
  kind: missing
  domain: business rule
  text: In the call of the working day before (for tomorrow's clinics) the urgent reserve's empty slots are released and anyone may be booked there; until now the office kept them for urgent patients even then, and that is one of the two places it loses most doctor time.
- id: follow_up_doctor
  kind: missing
  domain: business rule
  text: A follow-up is booked with the patient's previous doctor; this is a habit, not a contract rule, and the head of the outpatient office can grant an exception (a follow-up seen by a colleague counts a tenth of a slot less).
- id: interpreters
  kind: missing
  domain: business rule
  param: interpreters_per_day
  text: A new-patient visit with a doctor who does not speak the patient's language needs one of the {{interpreters_per_day}} in-person interpreters per day (hospital-wide); follow-ups use telephone interpreting without limit.
- id: holiday_clinic
  kind: missing
  domain: business rule
  param: closed_dept
  text: The {{closed_dept}} clinic is closed on City Day, Monday 23 November, although the calendar still lists its sessions; all other clinics work.
- id: move_notice
  kind: missing
  domain: business rule
  text: When the hospital changes the date or time of a patient's appointment, the new one must be at least 3 working days after the day of the change (for a request released and booked again later, after the day of the release; same date and time with another doctor needs no notice); every change costs.
- id: waitlist_priority
  kind: missing
  domain: business rule
  param: waitlist_order
  text: Waiting requests are booked in priority order, {{waitlist_order}}; a request may not be booked while a higher-priority request of the same department, visit type and previous doctor still waits and could have taken that slot.
- id: status_table
  kind: missing
  domain: scoring
  text: Every day the program returns per department, over the next 10 working days after its actions, free_slots (empty bookable slots, not held back, closed clinics excluded), held_back (empty urgent-reserve slots two or more days ahead) and waitlist (waiting requests); each entry must be exact (a wrong one costs as much as two empty slots), as the departments staff their clinics from it.
- id: staff_notes
  kind: missing
  domain: business rule
  text: Notes carry no weight - a director's acquaintance waits their turn like anyone else and a department head's wish to keep their afternoons free is not a rule; their slots are filled from the waitlist.
- id: duplicates
  kind: missing
  domain: business rule
  text: "<!-- tier: easy medium -->This round a patient's second request for the same department gets its own appointment, because a request does not show whether it is the same complaint (the clinic checks with the patient).<!-- /tier --><!-- tier: hard -->A second request of the same patient for the same department is the same need; a patient has at most one appointment per department in the period, and the table counts waiting patients, not requests.<!-- /tier -->"
- id: overbooking
  kind: missing
  domain: business rule
  text: "<!-- tier: easy medium -->This round no-shows are not planned for: everyone booked counts as coming, so no overbooking, one appointment per slot.<!-- /tier --><!-- tier: hard -->Because of no-shows, follow-ups may be overbooked: a slot may hold two follow-ups, never a new-patient visit.<!-- /tier -->"
- id: referral_expiry
  kind: missing
  domain: business rule
  text: "<!-- tier: easy -->This round the referral desk checks the referral letters itself, so referral_valid_until is ignored and every request can be booked.<!-- /tier --><!-- tier: medium hard -->A new patient's visit must be on or before referral_valid_until; after that the request can no longer be booked and does not count on the waitlist.<!-- /tier -->"
- id: blood_test
  kind: missing
  domain: business rule
  text: "<!-- tier: easy -->This round the lab books the fasting blood tests with the patients itself, so pre_visit_test is ignored and test_date stays null.<!-- /tier --><!-- tier: medium hard -->A fasting blood test is needed at least one working day before the visit, not before the earliest date and, when set or changed, from tomorrow on, written in test_date.<!-- /tier -->"
- id: lab_cap
  kind: missing
  domain: business rule
  tiers: [medium, hard]
  param: lab_cap
  text: The lab takes at most {{lab_cap}} fasting blood tests per working day, all departments together, the tests already in the book included.
- id: doctor_absence
  kind: missing
  domain: business rule
  text: "<!-- tier: easy -->This round a locum covers every doctor absence: the absence notices change nothing, and the absent doctor's appointments stay and are booked as usual.<!-- /tier --><!-- tier: medium hard -->From the day a doctor_absence notice arrives no appointment may remain with that doctor on the absent days; they are moved in that call (with the notice period, or another doctor at the same time) or released to the waitlist, and absent days leave the table.<!-- /tier -->"
- id: interpreter_absence
  kind: missing
  domain: business rule
  tiers: [medium, hard]
  text: An interpreter_absence notice means one in-person interpreter fewer on that date from the day it arrives; excess interpreted new-patient visits that day must be moved or released.
- id: overbooking_cap
  kind: missing
  domain: business rule
  tiers: [hard]
  param: overbooked_per_session
  text: Each doctor may have at most {{overbooked_per_session}} overbooked slots (slots holding two follow-ups) per session, morning or afternoon.
- id: collision_cost
  kind: missing
  domain: scoring
  tiers: [hard]
  text: When both patients of an overbooked slot come, the doctor runs late and the rest of the session suffers; that costs as much as three empty slots.
