- id: liability_cap
  kind: missing
  domain: calculation
  text: The liability cap must be at least 1x annual_value_usd from the register (a fixed amount is compared
    with 1x the value, a multiple of the annual fees must be at least 1); a cap exactly at the minimum
    is fine and an uncapped contract is fine.
- id: period_caps_out_of_round
  kind: missing
  domain: business rule
  text: Caps written as the fees paid over the last N months are being replaced in a separate exercise
    and are not flagged this round.
- id: governing_law
  kind: missing
  domain: business rule
  text: The governing law must be the law of Switzerland or of Singapore.
- id: law_not_forum
  kind: ambiguous
  domain: business rule
  text: Only the governing law counts this round, not the courts or arbitration seat.
- id: payment_terms
  kind: missing
  domain: business rule
  text: The payment term must be at least 60 days from receipt of the invoice.
- id: indemnity_mutual
  kind: missing
  domain: business rule
  text: Indemnities must be mutual; a clause where only we indemnify the supplier is an issue.
- id: issue_codes
  kind: missing
  domain: deliverable
  text: Every playbook point that fails is one issue with its code; the codes are LIABILITY_CAP, GOVERNING_LAW,
    AUTO_RENEWAL, PAYMENT_TERMS, DATA_PROTECTION, TERMINATION_CONVENIENCE, INDEMNITY.
- id: round_points
  kind: missing
  domain: deliverable
  text: This round only LIABILITY_CAP, GOVERNING_LAW, PAYMENT_TERMS and INDEMNITY are checked; renewal,
    data protection and termination are left to procurement, and other codes are ignored.
- id: round_contracts
  kind: missing
  domain: deliverable
  text: The contracts on the supplier's own paper, those with an amendment record and the one the e-mail
    is about are handled by procurement this round; they need an entry but are not used. Every other contract
    is reviewed, small ones included.
- id: decision_rule
  kind: missing
  domain: business rule
  text: The critical issues are LIABILITY_CAP and INDEMNITY, plus DATA_PROTECTION when it is checked;
    the decision is reject with two or more critical issues, negotiate with any issue, otherwise sign.
