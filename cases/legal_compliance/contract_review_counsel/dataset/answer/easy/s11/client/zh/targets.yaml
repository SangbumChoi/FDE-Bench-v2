- id: liability_cap
  kind: missing
  domain: calculation
  text: 责任上限必须不低于台账中年度金额_美元的 1.5 倍（固定金额与 1.5 倍年度金额比较，按年度费用倍数约定的倍数须不低于 1.5）；恰好等于最低值没问题，不设上限也没问题。
- id: period_caps_out_of_round
  kind: missing
  domain: business rule
  text: 按过去 N 个月已付费用约定的上限正在另一个项目里统一更换，本轮不标。
- id: governing_law
  kind: missing
  domain: business rule
  text: 适用法律必须是瑞士法、新加坡法或英格兰和威尔士法。
- id: law_not_forum
  kind: ambiguous
  domain: business rule
  text: 本轮只看适用法律，不看法院或仲裁地。
- id: payment_terms
  kind: missing
  domain: business rule
  text: 付款期限必须自收到发票起不少于 45 天。
- id: indemnity_mutual
  kind: missing
  domain: business rule
  text: 赔偿必须是双向的；只由我方赔偿供应商的条款算问题。
- id: issue_codes
  kind: missing
  domain: deliverable
  text: 每有一点手册要求不满足就记一个问题，使用对应代码：LIABILITY_CAP、GOVERNING_LAW、AUTO_RENEWAL、PAYMENT_TERMS、DATA_PROTECTION、TERMINATION_CONVENIENCE、INDEMNITY。
- id: round_points
  kind: missing
  domain: deliverable
  text: 本轮只检查 LIABILITY_CAP、GOVERNING_LAW、PAYMENT_TERMS 和 INDEMNITY；续约、数据保护和解除由采购核对，写了其他代码也会被忽略。
- id: round_contracts
  kind: missing
  domain: deliverable
  text: 供应商自己的合同文本、有修改记录的合同以及邮件所说的那份合同，本轮由采购处理；它们要有一条记录，但不采用其结论。其余合同都要审，小额合同也包括在内。
- id: decision_rule
  kind: missing
  domain: business rule
  text: 关键问题是 LIABILITY_CAP 和 INDEMNITY，检查数据保护时还包括 DATA_PROTECTION；有两个及以上关键问题为 reject，有任何问题为 negotiate，否则
    sign。
