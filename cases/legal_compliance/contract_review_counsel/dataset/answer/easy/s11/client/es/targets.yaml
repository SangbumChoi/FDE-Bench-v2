- id: liability_cap
  kind: missing
  domain: calculation
  text: El límite de responsabilidad debe ser al menos 1,5 × el importe_anual_usd del registro (un importe
    fijo se compara con 1,5 × el importe, un múltiplo del importe anual debe ser al menos 1,5); un límite
    exactamente igual al mínimo es correcto y un contrato sin límite también.
- id: period_caps_out_of_round
  kind: missing
  domain: business rule
  text: Los límites fijados como lo pagado en los últimos N meses se están sustituyendo en un trabajo
    aparte y no se marcan en esta ronda.
- id: governing_law
  kind: missing
  domain: business rule
  text: El contrato debe regirse por el Derecho de Suiza, el de Singapur o el de Inglaterra y Gales; si
    se rige por otra ley, es una incidencia.
- id: law_not_forum
  kind: ambiguous
  domain: business rule
  text: En esta ronda solo cuenta la ley aplicable, no los tribunales ni la sede del arbitraje.
- id: payment_terms
  kind: missing
  domain: business rule
  text: El plazo de pago debe ser de al menos 45 días desde la recepción de la factura.
- id: indemnity_mutual
  kind: missing
  domain: business rule
  text: Las indemnidades deben ser recíprocas; una cláusula en la que solo nosotros indemnizamos al proveedor
    es una incidencia.
- id: issue_codes
  kind: missing
  domain: deliverable
  text: Cada punto de nuestros criterios que no se cumple es una incidencia con su código; los códigos
    son LIABILITY_CAP, GOVERNING_LAW, AUTO_RENEWAL, PAYMENT_TERMS, DATA_PROTECTION, TERMINATION_CONVENIENCE
    e INDEMNITY.
- id: round_points
  kind: missing
  domain: deliverable
  text: En esta ronda solo se revisan LIABILITY_CAP, GOVERNING_LAW, PAYMENT_TERMS e INDEMNITY; la renovación,
    la protección de datos y la resolución las revisa compras, y los demás códigos no se tienen en cuenta.
- id: round_contracts
  kind: missing
  domain: deliverable
  text: Los contratos en el modelo del propio proveedor, los que tienen un registro de modificación y
    aquel del que trata el correo los lleva compras en esta ronda; necesitan una entrada, pero no se usa
    su respuesta. Todos los demás contratos se revisan, también los pequeños.
- id: decision_rule
  kind: missing
  domain: business rule
  text: Las incidencias críticas son LIABILITY_CAP e INDEMNITY, y también DATA_PROTECTION cuando se revisa;
    la decisión es reject con dos o más incidencias críticas, negotiate con alguna incidencia y sign en
    los demás casos.
