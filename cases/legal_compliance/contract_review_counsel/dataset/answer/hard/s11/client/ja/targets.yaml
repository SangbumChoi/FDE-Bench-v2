- id: liability_cap
  kind: missing
  domain: calculation
  text: 責任上限は契約台帳の年間金額_USDの1.5倍以上が必要です（固定金額は年間金額の1.5倍と比較し、年間代金の倍数は1.5以上）。最低基準とちょうど同じなら問題なく、上限なしの契約も問題ありません。
- id: period_caps
  kind: missing
  domain: calculation
  text: 直近Nか月の代金による上限は年間金額のN/12と換算します。
- id: governing_law
  kind: missing
  domain: business rule
  text: 準拠法はスイス法、シンガポール法またはイングランドおよびウェールズ法である必要があります。
- id: dispute_forum
  kind: missing
  domain: business rule
  text: 管轄裁判所または仲裁地も認められる法域にある必要があります。準拠法は認められても紛争解決地が別の場所なら論点で、紛争解決地は認められても準拠法が別の場合も論点です。
- id: auto_renewal
  kind: missing
  domain: calculation
  text: 自動的に更新される契約は書き方にかかわらず更新拒絶の通知期間が45日以上必要で、1か月は30日として扱います。満了で終了する契約は問題ありません。
- id: payment_terms
  kind: missing
  domain: business rule
  text: 支払期限は請求書の受領から45日以上必要です。
- id: data_protection
  kind: ambiguous
  domain: data semantics
  text: 調達区分が `IT・データサービス` の契約には、見出しを問わず個人情報の取扱いに関する条項が必要です。
- id: customer_personal_data
  kind: missing
  domain: data semantics
  text: ほかの区分の契約でも、取引先がその契約のもとで当社の顧客の個人情報を扱う場合（顧客宅への配送、顧客への書簡）にはデータ保護条項が必要で、そのことは契約の目的条項に書かれています。
- id: termination_convenience
  kind: missing
  domain: business rule
  text: 年間金額が250,000米ドルを超える契約では、当社がいつでも理由なく解約できる必要があり、違反による解除だけでは足りません。
- id: indemnity_mutual
  kind: missing
  domain: business rule
  text: 補償は相互的である必要があり、当社だけが取引先を補償する条項は論点です。
- id: issue_codes
  kind: missing
  domain: deliverable
  text: 満たしていない基準ごとに該当するコードで論点を1つ記録し、コードは LIABILITY_CAP、GOVERNING_LAW、AUTO_RENEWAL、PAYMENT_TERMS、DATA_PROTECTION、TERMINATION_CONVENIENCE、INDEMNITY
    です。
- id: decision_rule
  kind: missing
  domain: business rule
  text: 重大な論点は LIABILITY_CAP と INDEMNITY で、データ保護を確認する場合は DATA_PROTECTION も含みます。重大な論点が2つ以上あれば reject、論点が1つでもあれば
    negotiate、なければ sign です。
- id: amendments
  kind: missing
  domain: data semantics
  text: 双方が合意し、日付が契約の草案日付より後の変更だけが有効です。乙が提案して当社が承諾していない変更や、草案日付より前の変更は無効です。
- id: requests_to_sign
  kind: missing
  domain: business rule
  text: 事業部門の責任者がそのまま署名するよう依頼しても（CEOの承認があっても）レビューは変わらず、論点と判定はプレイブックに従います。
- id: small_contract_fast_track
  kind: missing
  domain: business rule
  text: 年間金額20,000米ドル未満の契約はレビューせず、論点なしの sign とします。
