- id: liability_cap
  kind: missing
  domain: calculation
  text: 责任上限必须不低于台账中年度金额_美元的 2 倍（固定金额与 2 倍年度金额比较，按年度费用倍数约定的倍数须不低于 2）；恰好等于最低值没问题，不设上限也没问题。
- id: period_caps
  kind: missing
  domain: calculation
  text: 按过去 N 个月已付费用约定的上限折算为年度金额的 N/12。
- id: governing_law
  kind: missing
  domain: business rule
  text: 适用法律必须是新加坡法。
- id: dispute_forum
  kind: missing
  domain: business rule
  text: 法院或仲裁地也必须位于可接受的法域；适用法律可以接受但争议解决地在别处算问题，争议解决地可以接受但适用法律是别的也算问题。
- id: auto_renewal
  kind: missing
  domain: calculation
  text: 会自动续期的合同（不论措辞）不续约通知期须不少于 60 天，一个月按 30 天计；期满即终止的合同没问题。
- id: payment_terms
  kind: missing
  domain: business rule
  text: 付款期限必须自收到发票起不少于 30 天。
- id: data_protection
  kind: ambiguous
  domain: data semantics
  text: 采购类别为 `IT与数据服务` 或 `市场营销` 的合同必须有处理个人信息的条款，标题不限。
- id: termination_convenience
  kind: missing
  domain: business rule
  text: 年度金额超过 100,000 美元（严格大于）的合同必须允许我方无理由随时解除；只有违约解除不够。
- id: indemnity_mutual
  kind: missing
  domain: business rule
  text: 赔偿必须是双向的；只由我方赔偿供应商的条款算问题。
- id: issue_codes
  kind: missing
  domain: deliverable
  text: 每有一点手册要求不满足就记一个问题，使用对应代码：LIABILITY_CAP、GOVERNING_LAW、AUTO_RENEWAL、PAYMENT_TERMS、DATA_PROTECTION、TERMINATION_CONVENIENCE、INDEMNITY。
- id: round_contracts
  kind: missing
  domain: deliverable
  text: 供应商自己的合同文本、有修改记录的合同以及邮件所说的那份合同，本轮由采购处理；它们要有一条记录，但不采用其结论。其余合同都要审，小额合同也包括在内。
- id: decision_rule
  kind: missing
  domain: business rule
  text: 关键问题是 LIABILITY_CAP 和 INDEMNITY，检查数据保护时还包括 DATA_PROTECTION；有一个及以上关键问题为 reject，有任何问题为 negotiate，否则
    sign。
