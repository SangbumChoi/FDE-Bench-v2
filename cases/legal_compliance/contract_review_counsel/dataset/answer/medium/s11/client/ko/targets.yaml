- id: liability_cap
  kind: missing
  domain: calculation
  text: 책임 한도는 계약대장의 연간금액_USD의 1.5배 이상이어야 합니다(고정 금액은 연간금액의 1.5배와 비교하고, 연간 대금의 배수는 1.5 이상). 최저 기준과 정확히
    같으면 문제없으며 한도가 없는 계약도 문제없습니다.
- id: period_caps
  kind: missing
  domain: calculation
  text: 직전 N개월 대금 기준 한도는 연간금액의 N/12로 봅니다.
- id: governing_law
  kind: missing
  domain: business rule
  text: 준거법은 스위스법, 싱가포르법 또는 잉글랜드 및 웨일스법이어야 합니다.
- id: dispute_forum
  kind: missing
  domain: business rule
  text: 관할 법원이나 중재지도 인정되는 법역에 있어야 합니다. 준거법은 괜찮지만 분쟁 해결지가 다른 곳이면 이슈이고, 분쟁 해결지는 괜찮지만 준거법이 다른 경우도 이슈입니다.
- id: auto_renewal
  kind: missing
  domain: calculation
  text: 자동으로 갱신되는 계약은 표현과 상관없이 갱신 거절 통지 기간이 45일 이상이어야 하고, 1개월은 30일로 봅니다. 만료로 종료되는 계약은 문제없습니다.
- id: payment_terms
  kind: missing
  domain: business rule
  text: 지급 기한은 청구서 수령일로부터 45일 이상이어야 합니다.
- id: data_protection
  kind: ambiguous
  domain: data semantics
  text: 구매분류가 `IT·데이터 서비스`인 계약에는 제목과 상관없이 개인정보 취급 조항이 있어야 합니다.
- id: termination_convenience
  kind: missing
  domain: business rule
  text: 연간금액이 250,000달러를 초과하는 계약은 저희가 언제든 사유 없이 해지할 수 있어야 하며, 위반 해지만으로는 부족합니다.
- id: indemnity_mutual
  kind: missing
  domain: business rule
  text: 배상 조항은 상호적이어야 하며, 저희만 공급업체에 배상하는 조항은 이슈입니다.
- id: issue_codes
  kind: missing
  domain: deliverable
  text: 충족하지 못한 플레이북 항목마다 해당 코드로 이슈 하나를 기록하며, 코드는 LIABILITY_CAP, GOVERNING_LAW, AUTO_RENEWAL, PAYMENT_TERMS,
    DATA_PROTECTION, TERMINATION_CONVENIENCE, INDEMNITY입니다.
- id: round_contracts
  kind: missing
  domain: deliverable
  text: 공급업체 자체 양식 계약, 수정 기록이 있는 계약, 메일이 언급한 계약은 이번에 구매팀이 처리합니다. 항목은 있어야 하지만 결과는 반영하지 않습니다. 나머지 계약은 소액
    계약을 포함해 모두 검토합니다.
- id: decision_rule
  kind: missing
  domain: business rule
  text: 중대 이슈는 LIABILITY_CAP과 INDEMNITY이며, 데이터 보호를 확인하는 경우 DATA_PROTECTION도 포함됩니다. 중대 이슈가 2개 이상이면 reject,
    이슈가 하나라도 있으면 negotiate, 없으면 sign입니다.
