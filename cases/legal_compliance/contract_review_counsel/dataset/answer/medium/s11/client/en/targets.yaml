- id: liability_cap
  kind: missing
  domain: calculation
  text: The liability cap must be at least 1.5x annual_value_usd from the register (a fixed amount is
    compared with 1.5x the value, a multiple of the annual fees must be at least 1.5); a cap exactly at
    the minimum is fine and an uncapped contract is fine.
- id: period_caps
  kind: missing
  domain: calculation
  text: A cap equal to the fees paid over the last N months is worth N/12 of the annual value.
- id: governing_law
  kind: missing
  domain: business rule
  text: The governing law must be the law of Switzerland, of Singapore or of England and Wales.
- id: dispute_forum
  kind: missing
  domain: business rule
  text: The courts or arbitration seat must also be in one of the accepted jurisdictions; an accepted
    law with a forum elsewhere is an issue, and so is an accepted forum with another law.
- id: auto_renewal
  kind: missing
  domain: calculation
  text: A contract that renews automatically (in any wording) needs a non-renewal notice period of at
    least 45 days; a month counts as 30 days; contracts that simply expire are fine.
- id: payment_terms
  kind: missing
  domain: business rule
  text: The payment term must be at least 45 days from receipt of the invoice.
- id: data_protection
  kind: ambiguous
  domain: data semantics
  text: Contracts in the `IT & data services` category must contain a clause on handling personal data,
    whatever its title.
- id: termination_convenience
  kind: missing
  domain: business rule
  text: Contracts with an annual value above USD 250,000 (strictly more) must allow us to terminate for
    convenience (any time, no reason needed); termination for breach alone is not enough.
- id: indemnity_mutual
  kind: missing
  domain: business rule
  text: Indemnities must be mutual; a clause where only we indemnify the supplier is an issue.
- id: issue_codes
  kind: missing
  domain: deliverable
  text: Every playbook point that fails is one issue with its code; the codes are LIABILITY_CAP, GOVERNING_LAW,
    AUTO_RENEWAL, PAYMENT_TERMS, DATA_PROTECTION, TERMINATION_CONVENIENCE, INDEMNITY.
- id: round_contracts
  kind: missing
  domain: deliverable
  text: The contracts on the supplier's own paper, those with an amendment record and the one the e-mail
    is about are handled by procurement this round; they need an entry but are not used. Every other contract
    is reviewed, small ones included.
- id: decision_rule
  kind: missing
  domain: business rule
  text: The critical issues are LIABILITY_CAP and INDEMNITY, plus DATA_PROTECTION when it is checked;
    the decision is reject with two or more critical issues, negotiate with any issue, otherwise sign.
