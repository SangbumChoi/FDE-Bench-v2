- id: liability_cap
  kind: missing
  domain: calculation
  text: El límite de responsabilidad debe ser al menos 1 × el importe_anual_usd del registro (un importe
    fijo se compara con 1 × el importe, un múltiplo del importe anual debe ser al menos 1); un límite
    exactamente igual al mínimo es correcto y un contrato sin límite también.
- id: period_caps
  kind: missing
  domain: calculation
  text: Un límite igual a lo pagado en los últimos N meses equivale a N/12 del importe anual.
- id: governing_law
  kind: missing
  domain: business rule
  text: El contrato debe regirse por el Derecho de Suiza o el de Singapur; si se rige por otra ley, es
    una incidencia.
- id: dispute_forum
  kind: missing
  domain: business rule
  text: Los tribunales o la sede del arbitraje también deben estar en una jurisdicción aceptada; una ley
    aceptada con el foro en otro lugar es una incidencia, y también lo es un foro aceptado con otra ley.
- id: auto_renewal
  kind: missing
  domain: calculation
  text: Un contrato que se prorroga automáticamente, con cualquier redacción, necesita un preaviso de
    no renovación de al menos 90 días; cada mes cuenta como 30 días; los contratos que simplemente vencen
    son correctos.
- id: payment_terms
  kind: missing
  domain: business rule
  text: El plazo de pago debe ser de al menos 60 días desde la recepción de la factura.
- id: data_protection
  kind: ambiguous
  domain: data semantics
  text: Los contratos de las categorías `TI y servicios de datos` y `Marketing` deben incluir una cláusula
    sobre el tratamiento de datos personales, sea cual sea su título.
- id: termination_convenience
  kind: missing
  domain: business rule
  text: Los contratos con un importe anual superior a 150.000 USD (estrictamente mayor) deben permitirnos
    desistir por conveniencia, en cualquier momento y sin causa; la resolución por incumplimiento no basta.
- id: indemnity_mutual
  kind: missing
  domain: business rule
  text: Las indemnidades deben ser recíprocas; una cláusula en la que solo nosotros indemnizamos al proveedor
    es una incidencia.
- id: issue_codes
  kind: missing
  domain: deliverable
  text: Cada punto de nuestros criterios que no se cumple es una incidencia con su código; los códigos
    son LIABILITY_CAP, GOVERNING_LAW, AUTO_RENEWAL, PAYMENT_TERMS, DATA_PROTECTION, TERMINATION_CONVENIENCE
    e INDEMNITY.
- id: round_contracts
  kind: missing
  domain: deliverable
  text: Los contratos en el modelo del propio proveedor, los que tienen un registro de modificación y
    aquel del que trata el correo los lleva compras en esta ronda; necesitan una entrada, pero no se usa
    su respuesta. Todos los demás contratos se revisan, también los pequeños.
- id: decision_rule
  kind: missing
  domain: business rule
  text: Las incidencias críticas son LIABILITY_CAP e INDEMNITY, y también DATA_PROTECTION cuando se revisa;
    la decisión es reject con dos o más incidencias críticas, negotiate con alguna incidencia y sign en
    los demás casos.
