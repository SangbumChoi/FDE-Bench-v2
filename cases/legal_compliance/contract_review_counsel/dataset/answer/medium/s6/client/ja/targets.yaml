- id: liability_cap
  kind: missing
  domain: calculation
  text: 責任上限は契約台帳の年間金額_USDの1倍以上が必要です（固定金額は年間金額の1倍と比較し、年間代金の倍数は1以上）。最低基準とちょうど同じなら問題なく、上限なしの契約も問題ありません。
- id: period_caps
  kind: missing
  domain: calculation
  text: 直近Nか月の代金による上限は年間金額のN/12と換算します。
- id: governing_law
  kind: missing
  domain: business rule
  text: 準拠法はスイス法またはシンガポール法である必要があります。
- id: dispute_forum
  kind: missing
  domain: business rule
  text: 管轄裁判所または仲裁地も認められる法域にある必要があります。準拠法は認められても紛争解決地が別の場所なら論点で、紛争解決地は認められても準拠法が別の場合も論点です。
- id: auto_renewal
  kind: missing
  domain: calculation
  text: 自動的に更新される契約は書き方にかかわらず更新拒絶の通知期間が90日以上必要で、1か月は30日として扱います。満了で終了する契約は問題ありません。
- id: payment_terms
  kind: missing
  domain: business rule
  text: 支払期限は請求書の受領から60日以上必要です。
- id: data_protection
  kind: ambiguous
  domain: data semantics
  text: 調達区分が `IT・データサービス` または `マーケティング` の契約には、見出しを問わず個人情報の取扱いに関する条項が必要です。
- id: termination_convenience
  kind: missing
  domain: business rule
  text: 年間金額が150,000米ドルを超える契約では、当社がいつでも理由なく解約できる必要があり、違反による解除だけでは足りません。
- id: indemnity_mutual
  kind: missing
  domain: business rule
  text: 補償は相互的である必要があり、当社だけが取引先を補償する条項は論点です。
- id: issue_codes
  kind: missing
  domain: deliverable
  text: 満たしていない基準ごとに該当するコードで論点を1つ記録し、コードは LIABILITY_CAP、GOVERNING_LAW、AUTO_RENEWAL、PAYMENT_TERMS、DATA_PROTECTION、TERMINATION_CONVENIENCE、INDEMNITY
    です。
- id: round_contracts
  kind: missing
  domain: deliverable
  text: 取引先の書式による契約、修正記録がある契約、メールが取り上げている契約は今回購買部門が扱います。項目は必要ですが結果は反映しません。それ以外の契約は少額のものも含めてすべてレビューします。
- id: decision_rule
  kind: missing
  domain: business rule
  text: 重大な論点は LIABILITY_CAP と INDEMNITY で、データ保護を確認する場合は DATA_PROTECTION も含みます。重大な論点が2つ以上あれば reject、論点が1つでもあれば
    negotiate、なければ sign です。
