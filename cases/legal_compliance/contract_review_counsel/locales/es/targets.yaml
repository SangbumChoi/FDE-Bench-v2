- id: liability_cap
  text: El límite de responsabilidad debe ser al menos {{cap_multiple}} × el importe_anual_usd del registro (un importe fijo se compara con {{cap_multiple}} × el importe, un múltiplo del importe anual debe ser al menos {{cap_multiple}}).
- id: period_caps_out_of_round
  text: Los límites fijados como lo pagado en los últimos N meses se están sustituyendo en un trabajo aparte y no se marcan en esta ronda.
- id: governing_law
  text: El contrato debe regirse por {{governing_law}}; si se rige por otra ley, es una incidencia.
- id: dispute_forum
  text: Los tribunales o la sede del arbitraje también deben estar en una jurisdicción aceptada; una ley aceptada con el foro en otro lugar es una incidencia.
- id: auto_renewal
  text: Un contrato que se prorroga automáticamente necesita un preaviso de no renovación de al menos {{renewal_notice_days}} días.
- id: payment_terms
  text: El plazo de pago debe ser de al menos {{payment_days}} días desde la recepción de la factura.
- id: data_protection
  text: Los contratos de {{dp_categories}} deben incluir una cláusula sobre el tratamiento de datos personales.
- id: customer_personal_data
  text: Un contrato de cualquier otra categoría también necesita la cláusula de protección de datos cuando el proveedor trata datos personales de nuestros propios clientes en virtud de él (entregas en el domicilio de los clientes, cartas a clientes).
- id: termination_convenience
  text: Los contratos con un importe anual superior a {{tfc_above}} USD deben permitirnos desistir por conveniencia (en cualquier momento y sin causa).
- id: issue_codes
  text: Cada punto de nuestros criterios que no se cumple es una incidencia con su código; los códigos son LIABILITY_CAP, GOVERNING_LAW, AUTO_RENEWAL, PAYMENT_TERMS, DATA_PROTECTION, TERMINATION_CONVENIENCE e INDEMNITY.
- id: round_points
  text: En esta ronda solo se revisan y se indican LIABILITY_CAP, GOVERNING_LAW, PAYMENT_TERMS e INDEMNITY; la renovación, la protección de datos y la resolución son de compras, y una entrada que las incluye no es la lista que pedimos.
- id: critical_issues
  text: Las incidencias críticas son LIABILITY_CAP e INDEMNITY, y también DATA_PROTECTION cuando se revisa; todas las demás son no críticas.
- id: decision_rule
  text: Un contrato con {{reject_at}} incidencias críticas es reject; cualquier otro contrato con una incidencia crítica se negocia, y un contrato sin incidencias se firma.
- id: accepted_deviations
  text: El límite de firma es de {{tolerance_below}} USD; un contrato con un importe anual inferior cuyas incidencias son todas no críticas se firma tal cual, con las incidencias en la lista; a partir de ese importe, cualquier incidencia se negocia.
- id: amendments
  text: Un registro de modificación solo cuenta si su fecha es posterior al borrador del contrato; un cambio acordado antes del borrador queda sustituido por el borrador.
- id: requests_to_sign
  text: La petición de un responsable de negocio de firmar un contrato sin más (aunque lo haya aprobado el consejero delegado o la renovación sea urgente) no cambia la revisión; las incidencias y la decisión siguen nuestros criterios.
- id: small_contract_fast_track
  text: Los contratos con un importe anual inferior a {{fast_track_below}} USD se marcan como sign sin incidencias y sin revisión jurídica.
