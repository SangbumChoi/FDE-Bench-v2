# The case in plain words, shown at the top of its page.
task: >-
  El equipo jurídico de Brightvale Holdings tiene 40 contratos con proveedores pendientes de firma. La IA revisa cada
  uno con los criterios de contratación de la empresa y entrega un único archivo, `review.json`: para cada contrato,
  los problemas encontrados (como códigos de incidencia) y una decisión, `sign`, `negotiate` o `reject`.
given:
  - "La solicitud del cliente: «revisar estos contratos e indicarnos cuáles necesitan cambios antes de firmarlos». No dice qué cuenta como problema."
  - "`registro_contratos.csv`: una fila por contrato (C001 a C040) con el proveedor, una de seis categorías de compra (la mayor, `TI y servicios de datos`, con 12), el importe anual en dólares (de 6.000 a 1.175.000 USD) y la ruta del texto."
  - "`contratos/C001.txt` a `C040.txt`: un contrato por archivo, que empieza con la fecha de su borrador y tiene 7 u 8 cláusulas (objeto y duración, precio y forma de pago, confidencialidad, protección de datos si la hay, indemnidad, limitación de responsabilidad, resolución, ley aplicable y jurisdicción). La misma cláusula se redacta de varias maneras, y seis contratos están en el modelo del propio proveedor, en inglés."
  - "`modificaciones/`: cuatro registros de cambios negociados sobre un borrador, cada uno con su fecha, su estado (acordada por ambas partes, o propuesta por el proveedor y no aceptada) y el nuevo texto de una cláusula."
  - "`correos/2026-10-27.txt`: la directora de TI pide al equipo jurídico que marque «sign» sin más el C040, un contrato de TI de 1.040.000 USD, porque ya lo ha aprobado el consejero delegado."
ask:
  - "Qué puntos revisan los criterios, con un código de incidencia por cada punto que no se cumple: el límite de responsabilidad, la ley aplicable, el plazo de pago y la indemnidad siempre; desde medium también el preaviso de renovación, la protección de datos y el desistimiento por conveniencia. Solo se admiten estos siete códigos."
  - "El límite de responsabilidad mínimo aceptable: 1, 1,5 o 2 veces el importe anual, según la versión. Un límite exactamente igual al mínimo es correcto, y también la ausencia de límite. Desde medium, un límite de «lo pagado en los últimos N meses» equivale a N/12 del importe anual; en easy esos límites no se marcan."
  - "Qué ley aplicable se acepta, según la versión: el Derecho de Suiza o el de Singapur; el de Suiza, el de Singapur o el de Inglaterra y Gales; o solo el de Singapur. Desde medium, los tribunales o la sede del arbitraje también deben estar en uno de esos lugares; en easy solo cuenta la ley."
  - "El plazo de pago mínimo aceptable: 30, 45 o 60 días desde la recepción de la factura, según la versión. Y las indemnidades deben ser recíprocas: una cláusula en la que solo la empresa indemniza al proveedor es una incidencia."
  - "Desde medium, tres cifras más que cambian con la versión: el preaviso para evitar una prórroga automática debe ser de al menos 45, 60 o 90 días (un mes cuenta como 30 días); los contratos de más de 100.000, 150.000 o 250.000 USD al año deben permitir a la empresa desistir en cualquier momento sin alegar causa; y la cláusula sobre datos personales se exige solo en `TI y servicios de datos`, o también en `Marketing`. En hard también se exige cuando el proveedor trata datos personales de los propios clientes de la empresa (entregas a domicilio, cartas a clientes)."
  - "Cómo se decide: las incidencias de límite de responsabilidad, protección de datos e indemnidad son críticas (en easy solo el límite y la indemnidad). `reject` si un contrato tiene una o más, o dos o más, incidencias críticas, según la versión; si no, `negotiate` si tiene alguna incidencia y `sign` si no tiene ninguna."
  - "Qué contratos quedan fuera en esta dificultad: en easy y medium no se puntúan los seis en el modelo del proveedor, los cuatro con un registro de modificación ni aquel del que trata el correo (aun así necesitan una entrada), y los contratos pequeños se revisan como los demás. En hard cuentan todos."
  - "En hard: solo una modificación acordada por ambas partes y con fecha posterior al borrador cambia el contrato; una petición de firma del negocio no cambia nada; y, por costumbre de la empresa, los contratos de menos de 10.000, 20.000 o 25.000 USD al año, según la versión, van por la vía rápida: se marcan `sign` sin incidencias y sin revisión."
invalid_if:
  - "Omite alguno de los 40 contratos del registro, incluidos los que no se puntúan en esta dificultad."
  - "Da a un contrato una decisión que no se deduce de las incidencias indicadas para él según la regla de decisión del cliente."
  - "Usa un identificador de contrato que no está en el registro, un código de incidencia fuera de los siete o una decisión distinta de `sign`, `negotiate` o `reject`."
  - "Solo en hard: indica incidencias en un contrato por debajo del importe de la vía rápida o no lo marca `sign`, salvo que la IA haya pedido una excepción al cliente."
quality: >-
  Un número de 0 a 1; cuanto mayor, mejor: 0,7 × lo bien que las incidencias indicadas coinciden con las que los
  contratos tienen de verdad según los criterios (tanto las incidencias que faltan como las falsas la bajan) + 0,3 ×
  la proporción de contratos con la decisión correcta. Solo cuentan los contratos y puntos que se puntúan en esta
  dificultad (29 contratos en easy y medium, los 40 en hard). La forma de trabajar del cliente (vale 0) firma todos los contratos
  tal como están, sin incidencias; la solución de referencia (vale 1) es una lista de palabras clave aplicada a la versión
  en inglés de cada contrato, que no ve las cláusulas redactadas de otra forma (como «net 30» o un preaviso en meses),
  aplica toda modificación acordada sea cual sea su fecha y decide la protección de datos solo por categoría.
tiers:
  easy: >-
    Cuatro puntos que se leen directamente en la cláusula: el límite de responsabilidad (los límites de «lo pagado en
    los últimos N meses» no se marcan), la ley aplicable (solo la ley, no dónde se resuelven las controversias), el
    plazo de pago y la indemnidad recíproca; solo el límite y la indemnidad son críticos. La renovación, la protección
    de datos y la resolución las revisa compras. Se puntúan 29 contratos: quedan fuera los del modelo del proveedor,
    los modificados y el del correo; los pequeños se revisan.
  medium: >-
    Los siete puntos: se añaden el preaviso de renovación, los límites de lo pagado en N meses (N/12 del importe
    anual), la protección de datos por categoría, el desistimiento por conveniencia por encima de un importe anual y
    dónde se resuelven las controversias (los tribunales o la sede también deben estar en un lugar aceptado). La
    protección de datos pasa a ser crítica. Se puntúan los mismos 29 contratos.
  hard: >-
    Se puntúan los 40 contratos. Se añaden los seis contratos en el modelo del proveedor (en inglés), los registros de
    modificación (cuentan los dos acordados después del borrador; no cuentan una propuesta no aceptada ni un cambio
    acordado con fecha anterior al borrador), los datos personales de clientes en un contrato de logística o de
    servicios profesionales, el correo que pide firmar el C040 (que los criterios rechazan) y la vía rápida para
    contratos pequeños.
