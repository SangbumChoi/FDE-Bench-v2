# The case in plain words, shown at the top of its page.
task: >-
  El equipo jurídico de Brightvale Holdings tiene 44 contratos con proveedores pendientes de firma. La IA revisa cada
  uno con los criterios de contratación de la empresa y entrega un único archivo, `review.json`: para cada contrato,
  los problemas encontrados (como códigos de incidencia) y una decisión, `sign`, `negotiate` o `reject`.
given:
  - "La solicitud del cliente: «revisar estos contratos e indicarnos cuáles necesitan cambios antes de firmarlos». No dice qué cuenta como problema."
  - "`registro_contratos.csv`: una fila por contrato (C001 a C044) con el proveedor, una de seis categorías de compra (la mayor, `TI y servicios de datos`, con 13), el importe anual en dólares (de 6.000 a 1.175.000 USD) y la ruta del texto."
  - "`contratos/C001.txt` a `C044.txt`: un contrato por archivo, que empieza con la fecha de su borrador y tiene 7 u 8 cláusulas (objeto y duración, precio y forma de pago, confidencialidad, protección de datos si la hay, indemnidad, limitación de responsabilidad, resolución, ley aplicable y jurisdicción). La misma cláusula se redacta de varias maneras, y seis contratos están en el modelo del propio proveedor, en inglés."
  - "`modificaciones/`: seis registros de cambios negociados sobre un borrador, cada uno con su fecha, su estado (acordada por ambas partes, o propuesta por el proveedor y no aceptada) y el nuevo texto de una cláusula."
  - "`correos/`: dos mensajes al equipo jurídico. El 2026-10-27, la directora de TI pide que se marque «sign» sin más el C028, un contrato de TI de 788.000 USD, porque ya lo ha aprobado el consejero delegado; el 2026-10-28, el director de operaciones pide lo mismo para dos renovaciones, C008 y C027, porque los contratos vigentes vencen a final de mes."
ask:
  - "Qué puntos revisan e indican los criterios: el límite de responsabilidad, la ley aplicable, el plazo de pago y la indemnidad siempre; desde medium también el preaviso de renovación, la protección de datos y el desistimiento por conveniencia. En easy los otros tres no deben aparecer en absoluto: compras envía a los proveedores su propia lista."
  - "El límite de responsabilidad mínimo aceptable: 1, 1,5 o 2 veces el importe anual, según la versión. En easy, un límite de «lo pagado en los últimos N meses» no se marca."
  - "Qué ley aplicable se acepta, según la versión: el Derecho de Suiza o el de Singapur; el de Suiza, el de Singapur o el de Inglaterra y Gales; o solo el de Singapur. Desde medium, los tribunales o la sede del arbitraje también deben estar en uno de esos lugares."
  - "El plazo de pago mínimo aceptable: 30, 45 o 60 días desde la recepción de la factura, según la versión."
  - "Desde medium, tres cifras más que cambian con la versión: el preaviso para evitar una prórroga automática debe ser de al menos 45, 60 o 90 días; los contratos de más de 100.000, 150.000 o 250.000 USD al año deben permitir a la empresa desistir en cualquier momento sin alegar causa; y la cláusula sobre datos personales se exige solo en `TI y servicios de datos`, o también en `Marketing`. En hard también se exige cuando el proveedor trata datos personales de los propios clientes de la empresa (entregas a domicilio, cartas a clientes)."
  - "Cómo se decide, que es un juicio propio: las incidencias de límite de responsabilidad, protección de datos e indemnidad son críticas; las demás no. `reject` si un contrato tiene una o más, o dos o más, incidencias críticas, según la versión. `sign` si no tiene ninguna incidencia, y también si todas sus incidencias son no críticas y su importe anual es inferior al límite de firma (100.000, 150.000 o 250.000 USD, según la versión): las incidencias se mantienen en la lista. `negotiate` en los demás casos."
  - "Los códigos de incidencia: uno de siete por cada punto que no se cumple, y ningún otro."
  - "En hard: un registro de modificación solo cambia el contrato si su fecha es posterior al borrador; una petición de firma del negocio no cambia nada; y, por costumbre de la empresa, los contratos de menos de 10.000, 20.000 o 25.000 USD al año, según la versión, van por la vía rápida: se marcan `sign` sin incidencias y sin revisión."
invalid_if:
  - "Omite alguno de los 44 contratos del registro, incluidos los que no se puntúan en esta dificultad."
  - "Indica un código de incidencia fuera de los siete."
  - "Usa un identificador de contrato que no está en el registro o una decisión distinta de `sign`, `negotiate` o `reject`."
  - "Solo en hard: indica incidencias en un contrato por debajo del importe de la vía rápida o no lo marca `sign`, salvo que la política de la empresa permita flexibilizar esta regla y la IA haya pedido antes una excepción al cliente."
quality: >-
  Cuanto mayor, mejor. La puntuación es la proporción de contratos cuya entrada es exactamente correcta: la lista de
  incidencias es exactamente la que los criterios dan para ese contrato (sin que falte ni sobre ninguna) y la
  decisión es la de los criterios. Solo cuentan los contratos que se puntúan en esta dificultad (29 en easy y
  medium, los 44 en hard). La forma de trabajar del cliente (vale 0) es la lista de palabras clave del propio equipo
  jurídico: conoce las cifras de los criterios pero lee las cláusulas por palabras clave, así que no ve las
  redactadas de otra forma (como «net 30» o un preaviso en meses), toma por unilateral una indemnidad recíproca
  escrita como dos compromisos, aplica toda modificación acordada sea cual sea su fecha y decide la protección de
  datos solo por categoría; acierta entre el 25 % y el 59 % de los contratos. La solución de referencia (vale 1) es
  la clave de respuestas: todos los contratos correctos. Nada que respete las reglas puede puntuar más.
tiers:
  easy: >-
    Cuatro puntos que se leen directamente en la cláusula: el límite de responsabilidad (los límites de «lo pagado en
    los últimos N meses» no se marcan), la ley aplicable (solo la ley, no dónde se resuelven las controversias), el
    plazo de pago y la indemnidad recíproca; solo pueden indicarse estos cuatro, y solo el límite y la indemnidad son
    críticos. La decisión necesita el umbral de rechazo y el límite de firma. Se puntúan 29 contratos: quedan fuera
    los del modelo del proveedor, los modificados y los de los correos; los pequeños se revisan.
  medium: >-
    Los siete puntos: se añaden el preaviso de renovación, los límites de lo pagado en N meses (N/12 del importe
    anual), la protección de datos por categoría, el desistimiento por conveniencia por encima de un importe anual y
    dónde se resuelven las controversias (los tribunales o la sede también deben estar en un lugar aceptado). La
    protección de datos pasa a ser crítica. Se puntúan los mismos 29 contratos.
  hard: >-
    Se puntúan los 44 contratos. Se añaden los seis contratos en el modelo del proveedor (en inglés), los registros de
    modificación (cuentan los dos acordados después del borrador; no cuentan una propuesta no aceptada ni tres
    cambios acordados antes del borrador), los datos personales de clientes en contratos de logística y de servicios
    profesionales, los dos correos que piden firmar el C028, el C008 y el C027 (ninguno de los cuales firman los
    criterios) y la vía rápida para contratos pequeños, que una excepción aprobada puede dejar sin efecto para un
    contrato pequeño que los criterios rechazan.
