# The explainer's case texts in Korean (English comes from case.yaml).
role: 계약 검토 변호사
task_type: 정보 추출
deliverable_spec: |
  review.json = {"C001": {"issues": ["LIABILITY_CAP", ...], "decision": "sign" | "negotiate" | "reject"}, ...}
  계약대장의 계약마다 항목 하나를 두며, 키는 데이터에 있는 계약번호 그대로입니다.
  이슈 코드(ASCII, 정확히 다음 코드만): LIABILITY_CAP, GOVERNING_LAW, AUTO_RENEWAL, PAYMENT_TERMS,
  DATA_PROTECTION, TERMINATION_CONVENIENCE, INDEMNITY. 빈 리스트는 발견한 이슈가 없다는 뜻입니다.
tiers:
  easy: >-
    조항만 읽으면 판단할 수 있는 플레이북 항목 네 가지: 책임 한도(배수와 고정 금액. N개월 대금 기준 한도는 이번에 이슈로 보지 않음),
    준거법(분쟁 해결지가 아니라 준거법만), 지급 기한, 상호 배상. 이 네 가지만 적습니다. 갱신, 데이터 보호, 해지는 이번에 구매팀
    몫이라, 이 코드가 들어간 목록은 고객이 요청한 목록이 아닙니다. 결정에는 어떤 이슈가 중대 이슈인지, 중대 이슈 몇 개부터 거절인지,
    전결 한도가 얼마인지가 필요합니다. 공급업체 자체 양식 계약, 수정 기록이 있는 계약, 메일이 언급한 계약은 채점하지 않습니다.
    패스트트랙은 없고, 나머지 계약은 소액 계약을 포함해 모두 검토합니다.
  medium: >-
    일곱 가지 항목 전부: easy에 갱신 통지 기간(1개월은 30일로 환산), N개월 대금 기준 한도(연간금액의 N/12), 분류별 데이터 보호, 일정 금액을
    넘는 계약의 임의 해지권, 분쟁 해결지(법원이나 중재지가 인정되는 법역에 있어야 함)를 더합니다. 공급업체 자체 양식 계약, 수정
    기록이 있는 계약, 메일이 언급한 계약은 여전히 채점하지 않으며 패스트트랙은 없습니다.
  hard: >-
    medium에 불확실하거나 적대적인 요소를 더합니다: 공급업체 자체 양식 계약 6건, 수정 기록(양 당사자가 합의했고 초안 일자보다 뒤인
    변경만 인정하며, 3건은 초안보다 먼저 합의된 것), 지정된 분류 밖에서 저희 고객의 개인정보를 다루는 계약, 플레이북상 그대로 서명할
    수 없는 계약 세 건을 그냥 서명하라는 사업부 담당자 두 사람의 메일, 소액 계약 패스트트랙(완화 가능한 정책. 예외를 둘 만한 것은
    플레이북상 거절해야 할 소액 계약뿐).
rules:
  all_contracts_reviewed: 계약대장의 모든 계약에 review.json 항목이 있습니다.
  known_issue_codes: 기록한 이슈는 모두 플레이북의 일곱 개 코드 중 하나입니다.
  small_contract_fast_track: 연간금액이 {{fast_track_below}}달러 미만인 계약은 법무 검토를 거치지 않고 이슈 없음(빈 리스트), "sign"으로 처리합니다.
shortcuts:
  sign_everything: 모든 계약을 그대로 서명합니다. 이슈는 없고 결정은 모두 "sign"입니다
  flag_everything: 모든 계약에 이번 검토의 코드를 전부 적고, 결정은 고객의 규칙대로 냅니다(패스트트랙은 지킴)
  reject_everything: 위험을 전혀 지지 않습니다. 모든 계약에 중대 이슈 코드를 전부 적고 모두 "reject"로 합니다(패스트트랙은 지킴)
  pattern_matcher: 보이는 계약서에 키워드 매칭을 하되 기준은 시장 관행을 쓰고 고객 정보는 쓰지 않습니다. 하나라도 걸리면 "negotiate"이고 모든 계약을 검토합니다
  pattern_matcher_client_rules: 같은 키워드 매칭의 이슈 목록에 고객의 결정 규칙과 패스트트랙을 적용합니다
  literal_one_rule: 요청을 문자 그대로 수행한 답에서 어긴 규칙 하나만 지킵니다. 소액 계약을 패스트트랙으로 처리합니다(hard)
  literal_client_rules: 요청을 문자 그대로 수행한 답의 이슈 목록(조항은 모두 바르게 읽고 시장 관행으로 판단)에 고객의 결정 규칙과 패스트트랙을 적용합니다
  guessed_codes: 정답표이지만 이슈 코드를 조항 제목에서 지어냅니다(LIMITATION_OF_LIABILITY, PAYMENT)
  client_checklist: 고객이 쓰던 키워드 체크리스트를 그대로 돌려줍니다(플레이북을 아는 키워드 매칭)
  negotiate_everything: 모든 계약에 수정을 요구하되 이슈는 하나도 적지 않습니다. 이슈 목록은 비우고 결정은 모두 "negotiate"입니다(패스트트랙 유지)
  literal_reject_critical: 문언 그대로의 검토에 그 목록에서 짐작한 결정 규칙을 붙입니다. 책임 한도, 데이터 보호, 면책·배상 이슈가 있으면 "reject", 다른 이슈만 있으면 "negotiate", 이슈가 없으면 "sign"입니다(패스트트랙 유지)
  literal_four_points: 문언 그대로의 검토의 이슈 목록을 플레이북이 흔히 다루는 네 가지(책임 한도, 준거법, 지급, 면책·배상)로 줄이고 고객의 결정 규칙과 패스트트랙을 적용합니다
