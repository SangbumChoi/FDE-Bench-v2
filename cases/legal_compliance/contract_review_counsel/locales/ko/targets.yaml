- id: liability_cap
  text: 책임 한도는 계약대장의 연간금액_USD의 {{cap_multiple}}배 이상이어야 합니다(고정 금액은 연간금액의 {{cap_multiple}}배와 비교하고, 연간 대금의 배수는 {{cap_multiple}} 이상).
- id: period_caps_out_of_round
  text: 직전 N개월 대금 기준 한도는 별도 작업에서 교체 중이므로 이번에는 이슈로 기록하지 않습니다.
- id: governing_law
  text: 준거법은 {{governing_law}}이어야 합니다.
- id: dispute_forum
  text: 관할 법원이나 중재지도 인정되는 법역에 있어야 합니다. 준거법은 괜찮지만 분쟁 해결지가 다른 곳이면 이슈입니다.
- id: auto_renewal
  text: 자동으로 갱신되는 계약은 갱신 거절 통지 기간이 {{renewal_notice_days}}일 이상이어야 합니다.
- id: payment_terms
  text: 지급 기한은 청구서 수령일로부터 {{payment_days}}일 이상이어야 합니다.
- id: data_protection
  text: 구매분류가 {{dp_categories}}인 계약에는 개인정보 취급 조항이 있어야 합니다.
- id: customer_personal_data
  text: 다른 분류의 계약이라도 공급업체가 그 계약에 따라 저희 고객의 개인정보를 다루면(고객 주소로 배송, 고객에게 보내는 서신) 데이터 보호 조항이 필요합니다.
- id: termination_convenience
  text: 연간금액이 {{tfc_above}}달러를 초과하는 계약은 저희가 언제든 사유 없이 해지할 수 있어야 합니다.
- id: issue_codes
  text: 충족하지 못한 플레이북 항목마다 해당 코드로 이슈 하나를 기록하며, 코드는 LIABILITY_CAP, GOVERNING_LAW, AUTO_RENEWAL, PAYMENT_TERMS, DATA_PROTECTION, TERMINATION_CONVENIENCE, INDEMNITY입니다.
- id: round_points
  text: 이번에는 LIABILITY_CAP, GOVERNING_LAW, PAYMENT_TERMS, INDEMNITY만 확인하고 적습니다. 갱신, 데이터 보호, 해지는 구매팀 몫이며, 이 코드가 들어간 항목은 저희가 요청한 목록이 아닙니다.
- id: critical_issues
  text: 중대 이슈는 LIABILITY_CAP과 INDEMNITY이며, 데이터 보호를 확인하는 경우 DATA_PROTECTION도 포함됩니다. 그 밖의 이슈는 모두 일반 이슈입니다.
- id: decision_rule
  text: 중대 이슈가 {{reject_at}}인 계약은 reject입니다. 중대 이슈가 있지만 그 수에 못 미치는 계약은 협상하고, 이슈가 없는 계약은 서명합니다.
- id: accepted_deviations
  text: 전결 한도는 {{tolerance_below}}달러입니다. 연간금액이 한도 미만이고 이슈가 모두 일반 이슈인 계약은 이슈를 목록에 적은 채 그대로 서명하며, 한도 이상이면 이슈가 하나라도 있으면 협상합니다.
- id: amendments
  text: 수정 기록은 일자가 계약 초안 일자보다 뒤일 때만 인정합니다. 초안보다 먼저 합의한 변경은 초안으로 대체된 것으로 봅니다.
- id: requests_to_sign
  text: 사업부 담당자가 계약을 그냥 서명으로 처리해 달라고 요청해도(CEO 승인이 있거나 갱신이 급하더라도) 검토는 달라지지 않으며, 이슈와 결정은 플레이북을 따릅니다.
- id: small_contract_fast_track
  text: 연간금액 {{fast_track_below}}달러 미만 계약은 법무 검토를 거치지 않고 이슈 없음(빈 리스트), sign으로 처리합니다.
