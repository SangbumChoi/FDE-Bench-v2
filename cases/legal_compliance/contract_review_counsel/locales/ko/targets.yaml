- id: liability_cap
  text: 책임 한도는 계약대장의 연간금액_USD의 {{cap_multiple}}배 이상이어야 합니다(고정 금액은 연간금액의 {{cap_multiple}}배와 비교하고, 연간 대금의 배수는 {{cap_multiple}} 이상). 최저 기준과 정확히 같으면 문제없으며 한도가 없는 계약도 문제없습니다.
- id: period_caps_out_of_round
  text: 직전 N개월 대금 기준 한도는 별도 작업에서 교체 중이므로 이번에는 이슈로 기록하지 않습니다.
- id: period_caps
  text: 직전 N개월 대금 기준 한도는 연간금액의 N/12로 봅니다.
- id: governing_law
  text: 준거법은 {{governing_law}}이어야 합니다.
- id: law_not_forum
  text: 이번에는 준거법만 보며, 법원이나 중재지는 보지 않습니다.
- id: dispute_forum
  text: 관할 법원이나 중재지도 인정되는 법역에 있어야 합니다. 준거법은 괜찮지만 분쟁 해결지가 다른 곳이면 이슈이고, 분쟁 해결지는 괜찮지만 준거법이 다른 경우도 이슈입니다.
- id: auto_renewal
  text: 자동으로 갱신되는 계약은 표현과 상관없이 갱신 거절 통지 기간이 {{renewal_notice_days}}일 이상이어야 하고, 1개월은 30일로 봅니다. 만료로 종료되는 계약은 문제없습니다.
- id: payment_terms
  text: 지급 기한은 청구서 수령일로부터 {{payment_days}}일 이상이어야 합니다.
- id: data_protection
  text: 구매분류가 {{dp_categories}}인 계약에는 제목과 상관없이 개인정보 취급 조항이 있어야 합니다.
- id: customer_personal_data
  text: 다른 분류의 계약이라도 공급업체가 그 계약에 따라 저희 고객의 개인정보를 다루면(고객 주소로 배송, 고객에게 보내는 서신) 데이터 보호 조항이 필요하며, 계약의 목적 조항에 그 내용이 적혀 있습니다.
- id: termination_convenience
  text: 연간금액이 {{tfc_above}}달러를 초과하는 계약은 저희가 언제든 사유 없이 해지할 수 있어야 하며, 위반 해지만으로는 부족합니다.
- id: indemnity_mutual
  text: 배상 조항은 상호적이어야 하며, 저희만 공급업체에 배상하는 조항은 이슈입니다.
- id: issue_codes
  text: 충족하지 못한 플레이북 항목마다 해당 코드로 이슈 하나를 기록하며, 코드는 LIABILITY_CAP, GOVERNING_LAW, AUTO_RENEWAL, PAYMENT_TERMS, DATA_PROTECTION, TERMINATION_CONVENIENCE, INDEMNITY입니다.
- id: round_points
  text: 이번에는 LIABILITY_CAP, GOVERNING_LAW, PAYMENT_TERMS, INDEMNITY만 확인합니다. 갱신, 데이터 보호, 해지는 구매팀이 확인하며 다른 코드는 반영하지 않습니다.
- id: round_contracts
  text: 공급업체 자체 양식 계약, 수정 기록이 있는 계약, 메일이 언급한 계약은 이번에 구매팀이 처리합니다. 항목은 있어야 하지만 결과는 반영하지 않습니다. 나머지 계약은 소액 계약을 포함해 모두 검토합니다.
- id: decision_rule
  text: 중대 이슈는 LIABILITY_CAP과 INDEMNITY이며, 데이터 보호를 확인하는 경우 DATA_PROTECTION도 포함됩니다. 중대 이슈가 {{reject_at}}이면 reject, 이슈가 하나라도 있으면 negotiate, 없으면 sign입니다.
- id: amendments
  text: 양 당사자가 합의했고 일자가 계약 초안 일자보다 뒤인 변경만 인정합니다. 을이 제안했지만 저희가 수락하지 않은 변경이나 초안 일자보다 앞선 변경은 인정하지 않습니다.
- id: requests_to_sign
  text: 사업부 담당자가 계약을 그냥 서명으로 처리해 달라고 요청해도(CEO 승인이 있더라도) 검토는 달라지지 않으며, 이슈와 결정은 플레이북을 따릅니다.
- id: small_contract_fast_track
  text: 연간금액 {{fast_track_below}}달러 미만 계약은 법무 검토를 거치지 않고 이슈 없음(빈 리스트), sign으로 처리합니다.
