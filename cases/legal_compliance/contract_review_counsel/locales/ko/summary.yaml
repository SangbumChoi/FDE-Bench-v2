# The case in plain words, shown at the top of its page.
task: >-
  브라이트베일 홀딩스 법무팀에 서명을 기다리는 공급업체 계약이 40건 있습니다. AI는 계약마다 회사의 계약 검토 기준(플레이북)에
  비추어 문제를 찾고, 계약별로 발견한 이슈 코드와 결정(`sign`, `negotiate`, `reject`)을 적은 `review.json` 파일 하나를 냅니다.
given:
  - "고객의 요청: \"이 계약서들을 검토해서 서명 전에 수정이 필요한 계약이 어떤 것인지 알려 달라\"는 내용입니다. 무엇을 문제로 보는지는 말하지 않습니다."
  - "`계약대장.csv`: 계약(C001~C040)마다 한 행이며, 공급업체, 구매분류(여섯 가지 중 하나, 가장 많은 `IT·데이터 서비스`가 12건), 미국 달러 기준 연간금액(6,000~1,175,000달러), 계약서 파일 경로가 있습니다."
  - "`계약서/C001.txt`~`C040.txt`: 계약 한 건당 계약서 하나입니다. 맨 앞에 초안 일자가 있고 조항은 7개 또는 8개입니다(목적 및 기간, 대금 및 지급, 비밀유지, 있는 경우 데이터 보호, 손해배상, 책임의 제한, 해지, 준거법 및 분쟁해결). 같은 내용도 계약마다 다르게 쓰여 있고, 6건은 공급업체 자체 양식의 영문 계약서입니다."
  - "`수정기록/`: 초안에 대해 협의한 변경 기록 4건입니다. 각각 일자, 상태(양 당사자 합의, 또는 공급업체가 제안했으나 회사가 수락하지 않음), 바뀌는 조항 하나의 새 문구가 있습니다."
  - "`메일/2026-10-27.txt`: IT팀장이 CEO 승인을 받았다며 C040(연간 1,040,000달러인 IT 계약)을 \"그냥 서명으로 처리해 달라\"고 법무팀에 요청하는 메일입니다."
ask:
  - "플레이북이 확인하는 항목과, 충족하지 못한 항목마다 기록할 이슈 코드입니다. 책임 한도, 준거법, 지급 기한, 면책·배상은 항상 보고, medium부터 갱신 거절 통지 기간, 데이터 보호, 임의 해지도 봅니다. 코드는 이 일곱 개만 쓸 수 있습니다."
  - "허용되는 최저 책임 한도입니다. 버전에 따라 연간금액의 1배, 1.5배, 2배 중 하나입니다. 한도가 최저 기준과 정확히 같으면 문제없고, 한도가 아예 없어도 문제없습니다. medium부터는 \"직전 N개월 동안 지급한 대금\"으로 정한 한도를 연간금액의 N/12로 환산하며, easy에서는 이런 한도를 이슈로 보지 않습니다."
  - "인정되는 준거법입니다. 버전에 따라 '스위스법 또는 싱가포르법', '스위스법, 싱가포르법 또는 잉글랜드 및 웨일스법', '싱가포르법만' 중 하나입니다. medium부터는 관할 법원이나 중재지도 그중 한 곳에 있어야 하고, easy에서는 준거법만 봅니다."
  - "허용되는 최단 지급 기한입니다. 버전에 따라 청구서 수령일로부터 30일, 45일, 60일 중 하나입니다. 또 면책·배상 조항은 쌍방이 서로 배상하는 상호 조항이어야 하며, 회사만 공급업체에 배상하는 조항은 이슈입니다."
  - "medium부터 버전에 따라 달라지는 기준 세 가지입니다. 갱신 거절 통지 기간의 최저 기준은 45일, 60일, 90일 중 하나이고(1개월은 30일), 회사가 언제든 사유 없이 해지할 수 있어야 하는 계약은 연간금액 100,000달러, 150,000달러, 250,000달러 중 하나를 초과하는 계약이며, 개인정보 취급 조항이 필요한 구매분류는 `IT·데이터 서비스`만이거나 `IT·데이터 서비스`와 `마케팅`입니다. hard에서는 공급업체가 회사 고객의 개인정보를 다루는 계약(고객 집으로 배송, 고객에게 보내는 서신)에도 이 조항이 필요합니다."
  - "결정 방법입니다. 책임 한도, 데이터 보호, 면책·배상 이슈가 중대 이슈입니다(easy에서는 책임 한도와 면책·배상만). 중대 이슈가 버전에 따라 1개 이상 또는 2개 이상이면 `reject`, 그렇지 않고 이슈가 하나라도 있으면 `negotiate`, 없으면 `sign`입니다."
  - "채점에서 빼는 계약입니다. easy와 medium에서는 공급업체 자체 양식 계약 6건, 수정기록이 있는 계약 4건, 메일이 언급한 계약 1건을 채점하지 않으며(항목은 있어야 합니다), 소액 계약도 다른 계약처럼 검토합니다. hard에서는 모든 계약을 채점합니다."
  - "hard에서는 양 당사자가 합의했고 초안 일자보다 뒤인 수정만 계약을 바꾸고, 사업부의 서명 요청은 아무것도 바꾸지 않습니다. 또 회사 관행인 패스트트랙에 따라 연간금액이 일정 금액(버전에 따라 10,000달러, 20,000달러, 25,000달러) 미만인 계약은 검토 없이 이슈 없음, `sign`으로 처리합니다."
invalid_if:
  - "계약대장의 계약 40건 중 하나라도 빠졌습니다(그 난이도에서 채점하지 않는 계약 포함)."
  - "어떤 계약의 결정이 그 계약에 기록한 이슈로부터 고객의 결정 규칙대로 나오지 않습니다."
  - "계약대장에 없는 계약번호, 일곱 개 밖의 이슈 코드, `sign`·`negotiate`·`reject` 이외의 결정을 씁니다."
  - "hard에서만: 패스트트랙 금액 미만인 계약에 이슈를 적거나 `sign`이 아닌 결정을 줍니다. 단, 회사 정책이 예외를 허용하고 AI가 먼저 고객에게 예외를 요청했다면 위반으로 보지 않습니다."
quality: >-
  0에서 1 사이의 값으로, 높을수록 좋습니다. 0.7 × 기록한 이슈가 플레이북상 실제 이슈와 얼마나 맞는지(F1 점수: 실제 이슈는
  빠짐없이, 잘못된 이슈는 없이) + 0.3 × 결정이 맞은 계약의 비율입니다. 그 난이도에서 채점하는 계약과 항목만 셉니다(easy와
  medium은 29건, hard는 40건 전부). 기존 방식(0점)은 모든 계약을 그대로 이슈 없이 서명합니다. 모범 답안(1점)은 각 계약의 영문 텍스트에서
  정해진 키워드만 찾는 체크리스트라서 "net 30"이나 개월 단위 통지 기간처럼 달리 쓴 조항을 놓치고, 합의된 수정은 일자와 상관없이
  모두 반영하며, 데이터 보호는 구매분류만 보고 판단합니다.
tiers:
  easy: >-
    조항만 읽으면 판단할 수 있는 네 가지입니다. 책임 한도("직전 N개월 대금" 한도는 이슈로 보지 않음), 준거법(분쟁 해결지는 보지
    않음), 지급 기한, 상호 배상이며, 중대 이슈는 책임 한도와 면책·배상뿐입니다. 갱신, 데이터 보호, 해지는 구매팀이 확인합니다.
    채점 대상은 29건으로, 공급업체 자체 양식·수정기록·메일 계약은 빠지고 소액 계약은 검토합니다.
  medium: >-
    일곱 가지 항목 전부입니다. 갱신 거절 통지 기간, N개월 대금 기준 한도(연간금액의 N/12), 구매분류별 데이터 보호, 일정 연간금액을
    넘는 계약의 임의 해지권, 분쟁 해결지(관할 법원이나 중재지도 인정되는 곳이어야 함)가 더해지고, 데이터 보호도 중대 이슈가 됩니다.
    채점 대상은 같은 29건입니다.
  hard: >-
    40건 모두 채점합니다. 공급업체 자체 양식 계약 6건(영문), 수정기록(초안 이후 합의된 2건만 인정되고, 수락되지 않은 제안과 초안보다
    앞선 합의는 인정되지 않음), 물류·전문 서비스 계약에서 다루는 고객 개인정보, 플레이북상 거절해야 할 C040을 서명하라는 메일,
    소액 계약 패스트트랙이 더해집니다.
