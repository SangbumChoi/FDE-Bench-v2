# The case in plain words, shown at the top of its page.
# One line per text: a folded line break would put a space into the Chinese text.
task: "明谷集团法务部有 44 份供应商合同等待签署。AI 需要按公司的合同审查手册逐份检查，找出问题，并提交一个 `review.json` 文件：每份合同列出发现的问题代码和结论（`sign`、`negotiate` 或 `reject`）。"
given:
  - "客户的需求：“审一下这些合同，告诉我们哪些在签之前需要改”。需求没有说明什么算问题。"
  - "`合同台账.csv`：每份合同（C001 至 C044）一行，包括供应商、采购类别（共六类，最多的 `IT与数据服务` 有 13 份）、以美元计的年度金额（6,000 至 1,175,000 美元）和合同文件路径。"
  - "`合同文本/C001.txt` 至 `C044.txt`：每份合同一个文件，开头写有草稿日期，共 7 或 8 条：合同标的与期限、价款与支付、保密、数据保护（有些合同没有）、赔偿、责任限制、合同解除、适用法律与争议解决。同一内容在不同合同中措辞不同，其中 6 份是供应商自己的英文合同文本。"
  - "`修改记录/`：针对草稿谈下来的 6 条修改记录，每条写明日期、状态（双方已确认，或供应商（乙方）提出、我方（甲方）未接受）以及替换某一条款的新文本。"
  - "`邮件/`：两封写给法务部的邮件。2026-10-27，IT 负责人称 CEO 已批准，要求把 C028（年度金额 788,000 美元的 IT 合同）“直接标 sign”；2026-10-28，首席运营官以现有合同月底到期为由，对两份续签合同 C008 和 C027 提出同样的要求。"
ask:
  - "手册检查并列出哪些点：责任上限、适用法律、付款期限和赔偿始终检查；从 medium 起还检查续约通知期、数据保护和无理由解除。在 easy 中另外三点完全不能列出：采购会另行把自己的清单发给供应商。"
  - "可以接受的最低责任上限：随版本不同，为年度金额的 1 倍、1.5 倍或 2 倍。在 easy 中，按“过去 N 个月已付费用”约定的上限不标。"
  - "可以接受的适用法律：随版本不同，为“瑞士法或新加坡法”“瑞士法、新加坡法或英格兰和威尔士法”或“仅新加坡法”。从 medium 起，法院或仲裁地也必须位于其中之一。"
  - "可以接受的最短付款期限：随版本不同，为自收到发票起 30 天、45 天或 60 天。"
  - "从 medium 起，另有三个随版本不同的标准：提出不续约的通知期至少为 45 天、60 天或 90 天；年度金额超过 100,000、150,000 或 250,000 美元的合同必须允许我方随时无理由解除；需要个人信息处理条款的采购类别为仅 `IT与数据服务`，或者 `市场营销` 也需要。在 hard 中，供应商会处理我们自己客户个人信息的合同（送货上门、给客户的信函）也需要这一条款。"
  - "如何得出结论，这本身就是一项判断：责任上限、数据保护和赔偿方面的问题是关键问题，其余不是。关键问题达到一个及以上或两个及以上（随版本不同）为 `reject`。没有问题为 `sign`；问题全是非关键问题、且年度金额低于签批限额（随版本不同，为 100,000、150,000 或 250,000 美元）的合同也为 `sign`，问题仍列在清单里。其余为 `negotiate`。"
  - "问题代码：每个不满足的点对应七个代码之一，不能用别的代码。"
  - "在 hard 中：修改记录只有日期晚于草稿才改变合同；业务方要求直接签的请求不改变任何东西；按照公司的快速通道习惯，年度金额低于一定数额（随版本不同，为 10,000、20,000 或 25,000 美元）的合同不经审查，直接标为 `sign`，问题列表为空。"
invalid_if:
  - "台账中 44 份合同有任何一份没有记录（包括本难度不计分的合同）。"
  - "列出了七个以外的问题代码。"
  - "使用了台账中没有的合同编号，或 `sign`、`negotiate`、`reject` 以外的结论。"
  - "仅限 hard：给低于快速通道金额的合同列出问题，或没有标为 `sign`；但公司政策允许放宽这条规则、且 AI 已先向客户申请例外的除外。"
quality: "越高越好。得分是记录完全正确的合同占比：问题清单与手册对该合同得出的清单完全一致（不漏不多），且结论就是手册的结论。只计本难度计分的合同（easy 和 medium 为 29 份，hard 为全部 44 份）。客户原来的做法（记 0 分）是法务部自己的关键词清单：它知道手册的各项数值，但靠关键词读条款，所以会漏掉换了说法的条款（如“net 30”或以月为单位的通知期），把写成两句承诺的双向赔偿当成单向赔偿，对已确认的修改不论日期一律采用，数据保护只按采购类别判断；它能做对 25% 到 59% 的合同。参考答案（记 1 分）就是标准答案：每份合同都对。遵守规则的结果不可能比它更高。"
tiers:
  easy: "直接读条款就能判断的四点：责任上限（按“过去 N 个月费用”约定的上限不标）、适用法律（只看法律，不看争议解决地）、付款期限和双向赔偿；只能列出这四点，关键问题只有责任上限和赔偿。结论需要拒签门槛和签批限额。计分合同 29 份：不含供应商合同文本、有修改记录和邮件所说的合同，小额合同也要审。"
  medium: "全部七点：增加续约通知期、按 N 个月费用约定的上限（年度金额的 N/12）、按类别的数据保护、超过一定年度金额的无理由解除，以及争议解决地（法院或仲裁地也须在可接受的地方）；数据保护也成为关键问题。计分合同仍是这 29 份。"
  hard: "全部 44 份合同计分。增加 6 份供应商自己的合同文本（英文）、修改记录（只有草稿之后双方确认的 2 条算数，未被接受的提议和早于草稿确认的 3 条修改都不算）、物流和专业服务合同中涉及的客户个人信息、要求直接签 C028、C008 和 C027 的两封邮件（按手册这三份都不能直接签），以及小额合同快速通道；对按手册应拒签的小额合同，经批准的例外可以不走快速通道。"
