- id: liability_cap
  text: 责任上限必须不低于台账中年度金额_美元的 {{cap_multiple}} 倍（固定金额与 {{cap_multiple}} 倍年度金额比较，按年度费用倍数约定的倍数须不低于 {{cap_multiple}}）。
- id: period_caps_out_of_round
  text: 按过去 N 个月已付费用约定的上限正在另一个项目里统一更换，本轮不标。
- id: governing_law
  text: 适用法律必须是{{governing_law}}。
- id: dispute_forum
  text: 法院或仲裁地也必须位于可接受的法域；适用法律可以接受但争议解决地在别处算问题。
- id: auto_renewal
  text: 会自动续期的合同，不续约通知期须不少于 {{renewal_notice_days}} 天。
- id: payment_terms
  text: 付款期限必须自收到发票起不少于 {{payment_days}} 天。
- id: data_protection
  text: 采购类别为 {{dp_categories}} 的合同必须有处理个人信息的条款。
- id: customer_personal_data
  text: 其他类别的合同，如果供应商在合同下处理我们自己客户的个人信息（给客户送货上门、处理写给客户的信函），也必须有数据保护条款。
- id: termination_convenience
  text: 年度金额超过 {{tfc_above}} 美元的合同必须允许我方无理由随时解除。
- id: issue_codes
  text: 每有一点手册要求不满足就记一个问题，使用对应代码：LIABILITY_CAP、GOVERNING_LAW、AUTO_RENEWAL、PAYMENT_TERMS、DATA_PROTECTION、TERMINATION_CONVENIENCE、INDEMNITY。
- id: round_points
  text: 本轮只检查并列出 LIABILITY_CAP、GOVERNING_LAW、PAYMENT_TERMS 和 INDEMNITY；续约、数据保护和解除归采购，列了这些代码的记录就不是我们要的清单。
- id: critical_issues
  text: 关键问题是 LIABILITY_CAP 和 INDEMNITY，检查数据保护时还包括 DATA_PROTECTION；其余问题都是非关键问题。
- id: decision_rule
  text: 有{{reject_at}}关键问题的合同为 reject；有关键问题但不到这个数的合同要谈判，没有问题的合同直接签。
- id: accepted_deviations
  text: 签批限额是 {{tolerance_below}} 美元；年度金额低于限额且问题全是非关键问题的合同照签，问题仍列在清单里；达到或超过限额的，只要有问题就要谈判。
- id: amendments
  text: 修改记录只有日期晚于合同草稿日期才算数；早于草稿就已确认的修改已被草稿取代。
- id: requests_to_sign
  text: 业务负责人要求直接签某份合同（即使有 CEO 批准或续签很急）不会改变审查；问题和结论都按手册来。
- id: small_contract_fast_track
  text: 年度金额低于 {{fast_track_below}} 美元的合同不做法务审查，直接标为 sign，问题列表为空。
