- id: liability_cap
  text: 责任上限必须不低于台账中年度金额_美元的 {{cap_multiple}} 倍（固定金额与 {{cap_multiple}} 倍年度金额比较，按年度费用倍数约定的倍数须不低于 {{cap_multiple}}）；恰好等于最低值没问题，不设上限也没问题。
- id: period_caps_out_of_round
  text: 按过去 N 个月已付费用约定的上限正在另一个项目里统一更换，本轮不标。
- id: period_caps
  text: 按过去 N 个月已付费用约定的上限折算为年度金额的 N/12。
- id: governing_law
  text: 适用法律必须是{{governing_law}}。
- id: law_not_forum
  text: 本轮只看适用法律，不看法院或仲裁地。
- id: dispute_forum
  text: 法院或仲裁地也必须位于可接受的法域；适用法律可以接受但争议解决地在别处算问题，争议解决地可以接受但适用法律是别的也算问题。
- id: auto_renewal
  text: 会自动续期的合同（不论措辞）不续约通知期须不少于 {{renewal_notice_days}} 天，一个月按 30 天计；期满即终止的合同没问题。
- id: payment_terms
  text: 付款期限必须自收到发票起不少于 {{payment_days}} 天。
- id: data_protection
  text: 采购类别为 {{dp_categories}} 的合同必须有处理个人信息的条款，标题不限。
- id: customer_personal_data
  text: 其他类别的合同，如果供应商在合同下处理我们自己客户的个人信息（给客户送货上门、处理写给客户的信函），也必须有数据保护条款；合同标的条款会写明。
- id: termination_convenience
  text: 年度金额超过 {{tfc_above}} 美元（严格大于）的合同必须允许我方无理由随时解除；只有违约解除不够。
- id: indemnity_mutual
  text: 赔偿必须是双向的；只由我方赔偿供应商的条款算问题。
- id: issue_codes
  text: 每有一点手册要求不满足就记一个问题，使用对应代码：LIABILITY_CAP、GOVERNING_LAW、AUTO_RENEWAL、PAYMENT_TERMS、DATA_PROTECTION、TERMINATION_CONVENIENCE、INDEMNITY。
- id: round_points
  text: 本轮只检查 LIABILITY_CAP、GOVERNING_LAW、PAYMENT_TERMS 和 INDEMNITY；续约、数据保护和解除由采购核对，写了其他代码也会被忽略。
- id: round_contracts
  text: 供应商自己的合同文本、有修改记录的合同以及邮件所说的那份合同，本轮由采购处理；它们要有一条记录，但不采用其结论。其余合同都要审，小额合同也包括在内。
- id: decision_rule
  text: 关键问题是 LIABILITY_CAP 和 INDEMNITY，检查数据保护时还包括 DATA_PROTECTION；有{{reject_at}}关键问题为 reject，有任何问题为 negotiate，否则 sign。
- id: amendments
  text: 只有双方都已确认、且日期晚于合同草稿日期的修改才算数；乙方提出但我方未接受的修改，或日期早于草稿的修改，都不算。
- id: requests_to_sign
  text: 业务负责人要求直接签某份合同（即使有 CEO 批准）不会改变审查；问题和结论都按手册来。
- id: small_contract_fast_track
  text: 年度金额低于 {{fast_track_below}} 美元的合同不做法务审查，直接标为 sign，问题列表为空。
