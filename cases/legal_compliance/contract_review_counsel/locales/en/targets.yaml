- id: liability_cap
  kind: missing
  domain: calculation
  param: cap_multiple
  text: The liability cap must be at least {{cap_multiple}}x annual_value_usd from the register (a fixed amount is compared with {{cap_multiple}}x the value, a multiple of the annual fees must be at least {{cap_multiple}}).
- id: period_caps_out_of_round
  kind: missing
  domain: business rule
  tiers: [easy]
  text: Caps written as the fees paid over the last N months are being replaced in a separate exercise and are not flagged this round.
- id: governing_law
  kind: missing
  domain: business rule
  param: governing_law
  text: The governing law must be {{governing_law}}.
- id: dispute_forum
  kind: missing
  domain: business rule
  tiers: [medium, hard]
  text: The courts or arbitration seat must also be in one of the accepted jurisdictions; an accepted law with a forum elsewhere is an issue.
- id: auto_renewal
  kind: missing
  domain: calculation
  tiers: [medium, hard]
  param: renewal_notice_days
  text: A contract that renews automatically needs a non-renewal notice period of at least {{renewal_notice_days}} days.
- id: payment_terms
  kind: missing
  domain: business rule
  param: payment_days
  text: The payment term must be at least {{payment_days}} days from receipt of the invoice.
- id: data_protection
  kind: ambiguous
  domain: data semantics
  tiers: [medium, hard]
  param: dp_categories
  text: Contracts in {{dp_categories}} must contain a clause on handling personal data.
- id: customer_personal_data
  kind: missing
  domain: data semantics
  tiers: [hard]
  text: A contract in any other category needs the data-protection clause too when the supplier handles personal data of our own customers under it (deliveries to customers' addresses, letters to customers).
- id: termination_convenience
  kind: missing
  domain: business rule
  tiers: [medium, hard]
  param: tfc_above
  text: Contracts with an annual value above USD {{tfc_above}} must allow us to terminate for convenience (any time, no reason needed).
- id: issue_codes
  kind: missing
  domain: deliverable
  text: Every playbook point that fails is one issue with its code; the codes are LIABILITY_CAP, GOVERNING_LAW, AUTO_RENEWAL, PAYMENT_TERMS, DATA_PROTECTION, TERMINATION_CONVENIENCE, INDEMNITY.
- id: round_points
  kind: missing
  domain: deliverable
  tiers: [easy]
  text: This round only LIABILITY_CAP, GOVERNING_LAW, PAYMENT_TERMS and INDEMNITY are checked and listed; renewal, data protection and termination are procurement's, and an entry that lists them is not the list we asked for.
- id: critical_issues
  kind: missing
  domain: business rule
  text: The critical issues are LIABILITY_CAP and INDEMNITY, plus DATA_PROTECTION when it is checked; every other issue is non-critical.
- id: decision_rule
  kind: missing
  domain: business rule
  param: reject_at
  text: A contract with {{reject_at}} critical issues is a reject; any other contract with a critical issue is negotiated, and a contract with no issue is signed.
- id: accepted_deviations
  kind: missing
  domain: business rule
  param: tolerance_below
  text: The sign-off limit is USD {{tolerance_below}}; a contract with an annual value below it whose issues are all non-critical is signed as it is, with the issues listed; at or above it, any issue is negotiated.
- id: amendments
  kind: missing
  domain: data semantics
  tiers: [hard]
  text: An amendment record counts only when it is dated after the contract's draft; a change agreed before the draft is superseded by the draft.
- id: requests_to_sign
  kind: missing
  domain: business rule
  tiers: [hard]
  text: A business owner's request to just sign a contract (even with CEO approval or an urgent renewal) does not change the review; issues and decision follow the playbook.
- id: small_contract_fast_track
  kind: missing
  domain: business rule
  tiers: [hard]
  param: fast_track_below
  text: Contracts with an annual value below USD {{fast_track_below}} are marked sign with no issues, without legal review.
