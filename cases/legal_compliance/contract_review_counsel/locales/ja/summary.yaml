# The case in plain words, shown at the top of its page.
# One line per text: a folded line break would put a space into the Japanese text.
task: "ブライトベール・ホールディングスの法務部には、署名待ちの取引先契約が44件あります。AIは各契約を会社の契約審査基準（プレイブック）に照らして問題を探し、契約ごとに見つかった論点コードと判定（`sign`、`negotiate`、`reject`）を書いた `review.json` を1つ提出します。"
given:
  - "顧客の依頼：「これらの契約書をレビューして、署名前に修正が必要なものを教えてほしい」という内容です。何を問題とみなすかは書かれていません。"
  - "`契約台帳.csv`：契約（C001〜C044）1件につき1行で、取引先、調達区分（6種類のいずれか。最も多い `IT・データサービス` が13件）、米ドル建ての年間金額（6,000〜1,175,000米ドル）、契約書ファイルのパスがあります。"
  - "`契約書/C001.txt`〜`C044.txt`：契約1件につき契約書1つです。冒頭に草案日付があり、条項は7つか8つです（目的および期間、代金および支払、秘密保持、ある場合はデータ保護、補償、責任の制限、解除、準拠法および紛争解決）。同じ内容でも契約ごとに書き方が違い、6件は取引先の書式による英文契約書です。"
  - "`修正記録/`：草案について交渉した変更の記録が6件あります。それぞれに日付、状態（双方合意済み、または取引先（乙）が提案し当社（甲）は未承諾）、差し替える条項1つの新しい文言があります。"
  - "`メール/`：法務部あてのメールが2通あります。2026-10-27にはIT部長が、CEOの承認済みだとして、C028（年間788,000米ドルのIT契約）を「そのまま署名で」と依頼し、2026-10-28にはCOOが、現行契約が今月末で切れるとして、更新契約2件（C008、C027）について同じ依頼をしています。"
ask:
  - "プレイブックが確認して記載する項目です。責任上限、準拠法、支払期限、補償は常に確認し、medium からは更新拒絶の通知期間、データ保護、任意解約も確認します。easy では残りの3つを記載してはいけません。購買部門が自分のリストを取引先に別途送るためです。"
  - "認められる最低の責任上限です。バージョンによって年間金額の1倍、1.5倍、2倍のいずれかです。easy では「直近Nか月に支払った代金」で定めた上限を論点としません。"
  - "認められる準拠法です。バージョンによって「スイス法またはシンガポール法」「スイス法、シンガポール法またはイングランドおよびウェールズ法」「シンガポール法のみ」のいずれかです。medium からは管轄裁判所または仲裁地もそのいずれかにある必要があります。"
  - "認められる最短の支払期限です。バージョンによって請求書の受領から30日、45日、60日のいずれかです。"
  - "medium から、バージョンによって変わる基準が3つ加わります。更新拒絶の通知期間の最低基準は45日、60日、90日のいずれか、当社がいつでも理由を示さずに解約できる必要があるのは年間金額が100,000米ドル、150,000米ドル、250,000米ドルのいずれかを超える契約、個人情報の取扱いに関する条項が必要な調達区分は `IT・データサービス` だけか、`IT・データサービス` と `マーケティング` です。hard では、取引先が当社の顧客の個人情報を扱う契約（顧客宅への配送、顧客に送る書簡）にもこの条項が必要です。"
  - "判定の仕方で、これはそれ自体が1つの判断です。責任上限、データ保護、補償の論点が重大な論点で、それ以外は軽微な論点です。重大な論点がバージョンによって1つ以上または2つ以上あれば `reject` です。論点がなければ `sign` で、論点がすべて軽微で年間金額が決裁限度額（バージョンによって100,000米ドル、150,000米ドル、250,000米ドル）未満の契約も `sign` とし、論点はリストに残します。それ以外は `negotiate` です。"
  - "論点コードです。満たしていない項目ごとに7つのコードのいずれかを使い、ほかのコードは使えません。"
  - "hard では、修正記録は草案日付より後の場合にだけ契約を変え、事業部門からの署名の依頼は何も変えません。また会社の慣行であるファストトラックにより、年間金額が一定額（バージョンによって10,000米ドル、20,000米ドル、25,000米ドル）未満の契約は、レビューせずに論点なしの `sign` とします。"
invalid_if:
  - "契約台帳の44件のうち1件でも抜けています（この難易度で採点しない契約も含みます）。"
  - "7つ以外の論点コードを記載しています。"
  - "契約台帳にない契約番号、または `sign`・`negotiate`・`reject` 以外の判定を使っています。"
  - "hard のみ：ファストトラックの金額未満の契約に論点を記録しているか、`sign` 以外の判定にしています。ただし、会社の方針がこのルールの例外を認めており、AIが先に顧客へ例外を申請していれば認められます。"
quality: "高いほど良い評価です。点数は、項目が完全に正しい契約の割合です。論点リストがプレイブックによるその契約のリストと完全に一致し（漏れも余分もない）、判定がプレイブックの判定と同じである必要があります。この難易度で採点する契約だけを数えます（easy と medium は29件、hard は44件すべて）。従来のやり方（0点）は法務部が使ってきたキーワードのチェックリストです。プレイブックの数値は知っていますが条項をキーワードで読むため、「net 30」や月単位の通知期間のように言い換えた条項を見落とし、2つの約束として書かれた相互補償を一方的な補償と取り違え、合意済みの修正は日付にかかわらずすべて反映し、データ保護は調達区分だけで判断します。このやり方で正しくなるのは契約の25%〜59%です。模範解答（1点）は正解表で、すべての契約が正しくなります。ルールを守るかぎり、これより高い点数にはなりません。"
tiers:
  easy: "条項を読めば判断できる4点です。責任上限（「直近Nか月の代金」による上限は論点としない）、準拠法（紛争解決地は見ない）、支払期限、相互補償で、記載できるのはこの4点だけ、重大な論点は責任上限と補償だけです。判定には拒否の基準と決裁限度額が必要です。採点対象は29件で、取引先の書式・修正記録・メールの契約は除き、少額の契約はレビューします。"
  medium: "7点すべてです。更新拒絶の通知期間、Nか月の代金による上限（年間金額のN/12）、調達区分によるデータ保護、一定の年間金額を超える契約の任意解約権、紛争解決地（管轄裁判所または仲裁地も認められる場所にあること）が加わり、データ保護も重大な論点になります。採点対象は同じ29件です。"
  hard: "44件すべてを採点します。取引先の書式による契約6件（英文）、修正記録（草案後に合意された2件だけが有効で、承諾されていない提案1件と草案より前に合意された3件は無効）、物流・専門サービスの契約で扱う顧客の個人情報、C028、C008、C027を署名するよう求める2通のメール（プレイブック上は3件ともそのまま署名できません）、少額契約のファストトラックが加わります。プレイブック上は拒否すべき少額契約は、承認された例外があればファストトラックから外せます。"
