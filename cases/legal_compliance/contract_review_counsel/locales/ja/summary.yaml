# The case in plain words, shown at the top of its page.
# One line per text: a folded line break would put a space into the Japanese text.
task: "ブライトベール・ホールディングスの法務部には、署名待ちの取引先契約が40件あります。AIは各契約を会社の契約審査基準（プレイブック）に照らして問題を探し、契約ごとに見つかった論点コードと判定（`sign`、`negotiate`、`reject`）を書いた `review.json` を1つ提出します。"
given:
  - "顧客の依頼：「これらの契約書をレビューして、署名前に修正が必要なものを教えてほしい」という内容です。何を問題とみなすかは書かれていません。"
  - "`契約台帳.csv`：契約（C001〜C040）1件につき1行で、取引先、調達区分（6種類のいずれか。最も多い `IT・データサービス` が12件）、米ドル建ての年間金額（6,000〜1,175,000米ドル）、契約書ファイルのパスがあります。"
  - "`契約書/C001.txt`〜`C040.txt`：契約1件につき契約書1つです。冒頭に草案日付があり、条項は7つか8つです（目的および期間、代金および支払、秘密保持、ある場合はデータ保護、補償、責任の制限、解除、準拠法および紛争解決）。同じ内容でも契約ごとに書き方が違い、6件は取引先の書式による英文契約書です。"
  - "`修正記録/`：草案について交渉した変更の記録が4件あります。それぞれに日付、状態（双方合意済み、または取引先（乙）が提案し当社（甲）は未承諾）、差し替える条項1つの新しい文言があります。"
  - "`メール/2026-10-27.txt`：IT部長が、CEOの承認済みだとして、C040（年間1,040,000米ドルのIT契約）を「そのまま署名で」と法務部に依頼するメールです。"
ask:
  - "プレイブックが確認する項目と、満たしていない項目ごとに記録する論点コードです。責任上限、準拠法、支払期限、補償は常に確認し、medium からは更新拒絶の通知期間、データ保護、任意解約も確認します。使えるコードはこの7つだけです。"
  - "認められる最低の責任上限です。バージョンによって年間金額の1倍、1.5倍、2倍のいずれかです。上限が最低基準とちょうど同じなら問題なく、上限がまったくなくても問題ありません。medium からは「直近Nか月に支払った代金」で定めた上限を年間金額のN/12に換算し、easy ではこの種の上限を論点としません。"
  - "認められる準拠法です。バージョンによって「スイス法またはシンガポール法」「スイス法、シンガポール法またはイングランドおよびウェールズ法」「シンガポール法のみ」のいずれかです。medium からは管轄裁判所または仲裁地もそのいずれかにある必要があり、easy では準拠法だけを見ます。"
  - "認められる最短の支払期限です。バージョンによって請求書の受領から30日、45日、60日のいずれかです。また補償条項は双方が互いに補償する相互的なものである必要があり、当社だけが取引先を補償する条項は論点です。"
  - "medium から、バージョンによって変わる基準が3つ加わります。更新拒絶の通知期間の最低基準は45日、60日、90日のいずれか（1か月は30日）、当社がいつでも理由を示さずに解約できる必要があるのは年間金額が100,000米ドル、150,000米ドル、250,000米ドルのいずれかを超える契約、個人情報の取扱いに関する条項が必要な調達区分は `IT・データサービス` だけか、`IT・データサービス` と `マーケティング` です。hard では、取引先が当社の顧客の個人情報を扱う契約（顧客宅への配送、顧客に送る書簡）にもこの条項が必要です。"
  - "判定の仕方です。責任上限、データ保護、補償の論点が重大な論点です（easy では責任上限と補償だけ）。重大な論点がバージョンによって1つ以上または2つ以上あれば `reject`、そうでなく論点が1つでもあれば `negotiate`、なければ `sign` です。"
  - "今回対象外の契約です。easy と medium では、取引先の書式による契約6件、修正記録がある契約4件、メールが取り上げている契約1件は採点しません（項目は必要です）。少額の契約もほかの契約と同じようにレビューします。hard ではすべての契約を採点します。"
  - "hard では、双方が合意し草案日付より後の修正だけが契約を変え、事業部門からの署名の依頼は何も変えません。また会社の慣行であるファストトラックにより、年間金額が一定額（バージョンによって10,000米ドル、20,000米ドル、25,000米ドル）未満の契約は、レビューせずに論点なしの `sign` とします。"
invalid_if:
  - "契約台帳の40件のうち1件でも抜けています（今回採点しない契約も含みます）。"
  - "ある契約の判定が、その契約に記録した論点から顧客の判定ルールどおりに導かれていません。"
  - "契約台帳にない契約番号、7つ以外の論点コード、`sign`・`negotiate`・`reject` 以外の判定を使っています。"
  - "hard のみ：ファストトラックの金額未満の契約に論点を記録しているか、`sign` 以外の判定にしています。ただし、AIが顧客に例外を申請していれば認められます。"
quality: "0から1の値で、高いほど良い評価です。0.7 × 記録した論点がプレイブック上の実際の論点とどれだけ一致するか（F1スコア：実際の論点を漏れなく、誤った論点はなく）＋ 0.3 × 判定が正しい契約の割合です。今回の範囲の契約と項目だけを数えます（easy と medium は29件、hard は40件すべて）。従来のやり方（0点）はすべての契約をそのまま論点なしで署名します。模範解答（1点）は各契約の英語の原文から決まったキーワードだけを探すチェックリストなので、「net 30」や月単位の通知期間のように言い換えた条項を見落とし、合意済みの修正は日付にかかわらずすべて反映し、データ保護は調達区分だけで判断します。"
tiers:
  easy: "条項を読めば判断できる4点です。責任上限（「直近Nか月の代金」による上限は論点としない）、準拠法（紛争解決地は見ない）、支払期限、相互補償で、重大な論点は責任上限と補償だけです。更新・データ保護・解約は購買部門が確認します。採点対象は29件で、取引先の書式・修正記録・メールの契約は除き、少額の契約はレビューします。"
  medium: "7点すべてです。更新拒絶の通知期間、Nか月の代金による上限（年間金額のN/12）、調達区分によるデータ保護、一定の年間金額を超える契約の任意解約権、紛争解決地（管轄裁判所または仲裁地も認められる場所にあること）が加わり、データ保護も重大な論点になります。採点対象は同じ29件です。"
  hard: "40件すべてを採点します。取引先の書式による契約6件（英文）、修正記録（草案後に合意された2件だけが有効で、承諾されていない提案と草案より前の合意は無効）、物流・専門サービスの契約で扱う顧客の個人情報、プレイブック上は拒否すべきC040を署名するよう求めるメール、少額契約のファストトラックが加わります。"
