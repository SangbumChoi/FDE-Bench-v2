# The explainer's case texts in Japanese (English comes from case.yaml).
role: 契約審査担当弁護士
task_type: 情報抽出
deliverable_spec: |
  review.json = {"C001": {"issues": ["LIABILITY_CAP", ...], "decision": "sign" | "negotiate" | "reject"}, ...}
  契約台帳の契約ごとに1項目とし、キーはデータ上の契約番号そのままです。
  論点コード（ASCII、次のものに限る）：LIABILITY_CAP、GOVERNING_LAW、AUTO_RENEWAL、PAYMENT_TERMS、
  DATA_PROTECTION、TERMINATION_CONVENIENCE、INDEMNITY。空リストは論点が見つからなかったことを意味します。
tiers:
  easy: >-
    条項を読めば判断できるプレイブックの4点：責任上限（倍数と固定金額。Nか月の代金による上限は今回論点としない）、準拠法（紛争解決地では
    なく準拠法だけ）、支払期限、相互補償。記載するのはこの4点だけです。更新・データ保護・解約は今回購買部門の担当で、これらが入った
    リストは顧客が求めたリストではありません。判定には、どの論点が重大か、重大な論点がいくつで拒否になるか、決裁限度額がいくらかが
    必要です。取引先の書式による契約、修正記録がある契約、メールが取り上げている契約は採点しません。ファストトラックはなく、それ以外の
    契約は少額のものも含めてすべてレビューします。
  medium: >-
    7点すべて：easy に、更新の通知期間（1か月を30日で換算）、Nか月の代金による上限（年間金額のN/12）、区分によるデータ保護、一定額を
    超える契約の任意解約権、紛争解決地（裁判所または仲裁地が認められる法域にあること）を加えます。取引先の書式による契約、修正記録が
    ある契約、メールが取り上げている契約は引き続き採点せず、ファストトラックはありません。
  hard: >-
    medium に不確実な要素と敵対的な要素を加えます：取引先の書式による契約6件、修正記録（双方が合意し草案日付より後の変更だけが有効で、
    3件は草案より前に合意されたもの）、指定区分以外で当社の顧客の個人情報を扱う契約、プレイブック上はそのまま署名できない契約3件を
    署名するよう求める事業部門責任者2人のメール、少額契約のファストトラック（緩和可能な方針。例外に値するのはプレイブック上拒否すべき
    少額契約だけ）。
rules:
  all_contracts_reviewed: 契約台帳のすべての契約について review.json に項目があります。
  known_issue_codes: 記録した論点はすべてプレイブックの7つのコードのいずれかです。
  small_contract_fast_track: 年間金額が{{fast_track_below}}米ドル未満の契約は、レビューを行わずに論点なしの "sign" とします。
shortcuts:
  sign_everything: すべての契約をそのまま署名します。論点はなく、判定はすべて "sign" です
  flag_everything: すべての契約に今回のコードを全部記載し、判定は顧客のルールどおりにします（ファストトラックは守る）
  reject_everything: リスクを一切取りません。すべての契約に重大な論点のコードを全部記載し、すべて "reject" とします（ファストトラックは守る）
  pattern_matcher: 見えている契約書にキーワード照合をかけ、基準は市場慣行を使い、顧客の情報は使いません。1つでも当たれば "negotiate" とし、すべての契約をレビューします
  pattern_matcher_client_rules: 同じキーワード照合の論点リストに、顧客の判定ルールとファストトラックを当てはめます
  literal_one_rule: 依頼を文字どおりに行った解答で、破っているルール1つだけを守ります。少額契約をファストトラックで処理します（hard）
  literal_client_rules: 依頼を文字どおりに行った解答の論点リスト（条項はすべて正しく読み、市場慣行で判断）に、顧客の判定ルールとファストトラックを当てはめます
  guessed_codes: 正解表ですが、論点コードを条項の見出しから作っています（LIMITATION_OF_LIABILITY、PAYMENT）
  client_checklist: 顧客自身のキーワードチェックリストをそのまま返します（プレイブックを知っているキーワード照合）
  negotiate_everything: すべての契約に修正を求めるが、論点は1つも挙げません。論点リストは空、判定はすべて「negotiate」です（ファストトラックは維持）
  literal_reject_critical: 文言どおりのレビューに、そのリストから推測した判定ルールを付けます。責任上限、データ保護、補償の論点があれば「reject」、その他の論点だけなら「negotiate」、論点がなければ「sign」です（ファストトラックは維持）
  literal_four_points: 文言どおりのレビューの論点リストを、プレイブックがよく扱う4点（責任上限、準拠法、支払、補償）に絞り、顧客の判定ルールとファストトラックを適用します
