- id: liability_cap
  text: 責任上限は契約台帳の年間金額_USDの{{cap_multiple}}倍以上が必要です（固定金額は年間金額の{{cap_multiple}}倍と比較し、年間代金の倍数は{{cap_multiple}}以上）。
- id: period_caps_out_of_round
  text: 直近Nか月の代金による上限は別の取り組みで差し替え中のため、今回は論点として記録しません。
- id: governing_law
  text: 準拠法は{{governing_law}}である必要があります。
- id: dispute_forum
  text: 管轄裁判所または仲裁地も認められる法域にある必要があります。準拠法は認められても紛争解決地が別の場所なら論点です。
- id: auto_renewal
  text: 自動的に更新される契約は、更新拒絶の通知期間が{{renewal_notice_days}}日以上必要です。
- id: payment_terms
  text: 支払期限は請求書の受領から{{payment_days}}日以上必要です。
- id: data_protection
  text: 調達区分が {{dp_categories}} の契約には、個人情報の取扱いに関する条項が必要です。
- id: customer_personal_data
  text: ほかの区分の契約でも、取引先がその契約のもとで当社の顧客の個人情報を扱う場合（顧客宅への配送、顧客への書簡）にはデータ保護条項が必要です。
- id: termination_convenience
  text: 年間金額が{{tfc_above}}米ドルを超える契約では、当社がいつでも理由なく解約できる必要があります。
- id: issue_codes
  text: 満たしていない基準ごとに該当するコードで論点を1つ記録し、コードは LIABILITY_CAP、GOVERNING_LAW、AUTO_RENEWAL、PAYMENT_TERMS、DATA_PROTECTION、TERMINATION_CONVENIENCE、INDEMNITY です。
- id: round_points
  text: 今回は LIABILITY_CAP、GOVERNING_LAW、PAYMENT_TERMS、INDEMNITY だけを確認して記載します。更新・データ保護・解約は購買部門の担当で、これらのコードが入った項目は当社がお願いしたリストではありません。
- id: critical_issues
  text: 重大な論点は LIABILITY_CAP と INDEMNITY で、データ保護を確認する場合は DATA_PROTECTION も含みます。それ以外の論点はすべて軽微な論点です。
- id: decision_rule
  text: 重大な論点が{{reject_at}}ある契約は reject です。重大な論点があってもその数に届かない契約は交渉し、論点のない契約は署名します。
- id: accepted_deviations
  text: 決裁限度額は{{tolerance_below}}米ドルです。年間金額が限度額未満で論点がすべて軽微な契約は、論点をリストに記載したままそのまま署名し、限度額以上なら論点が1つでもあれば交渉します。
- id: amendments
  text: 修正記録は、日付が契約の草案日付より後の場合にだけ有効です。草案より前に合意した変更は草案によって置き換えられています。
- id: requests_to_sign
  text: 事業部門の責任者がそのまま署名するよう依頼しても（CEOの承認があっても、更新が急ぎでも）レビューは変わらず、論点と判定はプレイブックに従います。
- id: small_contract_fast_track
  text: 年間金額{{fast_track_below}}米ドル未満の契約はレビューせず、論点なしの sign とします。
